<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT 中文模型權重審核器</title><style>body{max-width:740px;margin:auto;padding:18px;background:#0d1729;color:#edf3ff;font:16px system-ui,-apple-system,sans-serif;line-height:1.55}input,button{font:inherit;padding:11px;border-radius:9px}input{box-sizing:border-box;width:100%;background:#1d2d44;color:white;border:1px solid #52657c}button{border:0;background:#387bd5;color:white;margin:9px 6px 9px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#192940;padding:12px;border-radius:10px}small{color:#b7c6dd}label{display:block;margin-top:12px}a{color:#9ecaff}</style></head><body><h2>AIVAULT 中文模型權重審核器</h2><p><strong>model-audit-20261018-a</strong>。僅在按下按鈕時讀取 Hugging Face 公開檔案目錄，不下載模型權重、不初始化 ONNX、不改其他 AIVAULT 頁面。</p><label>Hugging Face 模型 ID</label><input id="model" value="onnx-community/Qwen3-0.6B-ONNX" spellcheck="false" autocomplete="off"><button id="check">查詢公開檔案大小</button><button id="copy">複製審核結果</button><pre id="out">等待操作。</pre><small>此工具僅做下載量初篩；不證明 ONNX/WASM 相容、手機 RAM 足夠或繁體中文品質。若檔案大小缺失，標示未知，不能當作零位元組。公開目錄查詢不使用 Grok、Kling 或付費推論 API。</small><script>
const o=document.getElementById('out');let report='';const mb=n=>(n/1000000).toFixed(1)+' MB';
document.getElementById('check').onclick=async()=>{const id=document.getElementById('model').value.trim();if(!/^[\w.-]+\/[\w.-]+$/.test(id)){o.textContent='模型 ID 格式錯誤；格式應為 owner/repository';return}o.textContent='查詢公開目錄中……';try{const url='https://huggingface.co/api/models/'+encodeURIComponent(id.split('/')[0])+'/'+encodeURIComponent(id.split('/')[1])+'/tree/main?recursive=true&expand=false';const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const rows=await r.json();if(!Array.isArray(rows))throw Error('非預期 API 格式');const files=rows.filter(x=>x.type==='file');const relevant=files.filter(x=>/\.onnx($|_data$)|\.onnx\.data$|\.onnx_data$|\.data$|\.bin$|\.safetensors$/i.test(x.path));const unknown=relevant.filter(x=>!Number.isFinite(x.size));const onnx=relevant.filter(x=>/\.onnx$/i.test(x.path));const allKnown=relevant.filter(x=>Number.isFinite(x.size)).reduce((a,x)=>a+x.size,0);const lines=['AIVAULT model-audit-20261018-a','模型：'+id,'公開目錄檔案數：'+files.length,'模型/權重候選檔：'+relevant.length,'已知候選檔大小合計：'+mb(allKnown),'未知大小檔案數：'+unknown.length,'ONNX 主檔數：'+onnx.length,'','模型/權重檔案：'];for(const f of relevant.slice(0,90))lines.push((Number.isFinite(f.size)?mb(f.size):'大小未知')+'  '+f.path);if(relevant.length>90)lines.push('尚有 '+(relevant.length-90)+' 個檔案未列出');lines.push('','重要：此合計涵蓋倉庫中多種模型變體，並非單一量化版本的下載量。');lines.push('外部資料檔與 ONNX 依賴關係未經解析；不能把 ONNX 主檔大小當成總下載量。');lines.push('200 MB 門檻：需選定具體 ONNX 檔及其外部依賴後才能判定。');lines.push('WASM 相容性：未驗證；手機峰值記憶體：未驗證。');report=lines.join('\n');o.textContent=report}catch(e){report='查詢失敗：'+String(e)+'\n可能是網路、CORS、模型 ID 或公開 API 暫時不可用。沒有下載權重。';o.textContent=report}};
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(report||o.textContent)}catch(e){o.textContent+='\n複製失敗：'+e}};
</script></body></html>
