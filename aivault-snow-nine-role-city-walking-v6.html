<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>AIVAULT 冰雪協作城｜九職業入城測試</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#152d4d;color:#fff;font-family:system-ui}#hud{position:fixed;top:12px;left:12px;background:#102d50d9;border:1px solid #8ccafa;border-radius:12px;padding:11px;max-width:min(70vw,260px);font-size:11px;pointer-events:none}#hud b{font-size:17px}#ctrl{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:5px;max-width:98vw}button{font-size:12px;border:1px solid #a3d5fa;border-radius:12px;padding:9px 8px;background:#153b60e8;color:white}#err{position:fixed;inset:25%;display:none;background:#183b5b;padding:18px;border-radius:12px}</style></head><body><div id="hud"><b>❄ AIVAULT 冰雪協作城</b><div>真正 WebGL 3D 場景 · 獨立預覽 V2</div><div>九職業入城｜轉向及防穿牆 V6</div><div>動畫展示 ≠ AI 真實在線</div><div id="choice-info">正在讀取角色選擇……</div></div><div id="ctrl"><button id="choose">選角</button><button id="focus">找我的角色</button><button id="play">⏸ 暫停</button><button id="zoom">＋ 放大</button><button id="reset">⟳ 視角</button></div><div id="err">3D 載入失敗。請使用 Safari 開啟，並確認網路可以載入 Three.js。</div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as T from 'three';

renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x8cb5d8);scene.fog=null;
const camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,400);let angle=.72,dist=125;const target=new T.Vector3(0,0,0);
function cam(){camera.position.set(target.x+Math.sin(angle)*dist,target.y+dist*.72,target.z+Math.cos(angle)*dist);camera.lookAt(target)}cam();
scene.add(new T.HemisphereLight(0xeaf6ff,0x5d6b80,2.1));const sun=new T.DirectionalLight(0xffe3bd,2.3);sun.position.set(-25,48,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-60;sun.shadow.camera.right=60;sun.shadow.camera.top=60;sun.shadow.camera.bottom=-60;scene.add(sun);
const mat=(c,r=1)=>new T.MeshStandardMaterial({color:c,roughness:r});const snow=mat(0xf0f7ff),wall=mat(0x91a9b9),roof=mat(0x3a5a79),stone=mat(0x647d95),gold=new T.MeshStandardMaterial({color:0xffc975,emissive:0x5c2800,emissiveIntensity:.55}),wood=mat(0x725d59),blue=new T.MeshStandardMaterial({color:0x50d8ff,emissive:0x0079c5,emissiveIntensity:1});
function mesh(g,m,x=0,y=0,z=0,cast=true){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=true;scene.add(o);return o}
function box(x,y,z,w,h,d,m){return mesh(new T.BoxGeometry(w,h,d),m,x,y,z)}
function cone(x,y,z,r,h,m,n=5){return mesh(new T.ConeGeometry(r,h,n),m,x,y,z)}
function ball(x,y,z,r,m){return mesh(new T.SphereGeometry(r,10,8),m,x,y,z)}
box(0,-.65,0,115,1,115,snow);
for(let i=-4;i<=4;i++){box(i*10,-.1,0,4,.12,112,mat(0xc6dce9));box(0,-.08,i*10,112,.12,4,mat(0xc6dce9))}
const snowRoof=mat(0xf5fbff),timber=mat(0x513c38),brick=mat(0x9b9c9c),warm=gold,deepRoof=mat(0x34516b),copper=mat(0x98735a);
const slate=mat(0x526b80),pine=mat(0x49604f),plaster=mat(0xd4c8b2);
function beam(x,y,z,w,h,d,m=timber){return box(x,y,z,w,h,d,m)}
function roofPair(x,y,z,w,d,rise,baseMat=deepRoof){
 const half=Math.hypot(w/2,rise),angle=Math.atan2(rise,w/2);
 for(const side of [-1,1]){
  const panel=new T.Mesh(new T.BoxGeometry(half+.35,.22,d+.65),baseMat);
  panel.position.set(x+side*w/4,y+rise/2,z);panel.rotation.z=-side*angle;panel.castShadow=true;scene.add(panel);
  const snowPanel=new T.Mesh(new T.BoxGeometry(half+.4,.16,d+.82),snowRoof);
  snowPanel.position.set(x+side*w/4,y+rise/2+.14,z);snowPanel.rotation.z=-side*angle;snowPanel.castShadow=true;scene.add(snowPanel);
 }
 beam(x,y+rise+.12,z,.44,.3,d+1.1,snowRoof);
}
function windowGlow(x,y,z,w=.8,h=1){
 beam(x,y,z,w,h,.12,warm);
 beam(x,y,z+.1,w+.24,.15,.2,timber);
 beam(x,y,z+.12,.12,h+.15,.18,timber);
 beam(x,y-h/2-.08,z+.16,w+.4,.2,.4,snowRoof);
}
function chimney(x,y,z,s=1){
 beam(x,y,z,.8*s,2.1*s,.8*s,copper);
 beam(x,y+1.12*s,z,1.12*s,.32*s,1.12*s,snowRoof);
}
function house(x,z,i){
 const s=.78+(i%3)*.16,kind=i%4;
 const W=(kind===1?6.4:5.6)*s,D=(kind===2?6.4:5.5)*s,H=(kind===3?4.6:3.8)*s;
 blockArea(x,z,W+2*s,D+3.5*s);
 beam(x,.28*s,z,W+1*s,.55*s,D+1*s,stone);
 beam(x,H/2+.35*s,z,W,H,D,kind===2?plaster:brick);
 beam(x,H+.3*s,z,W+.45*s,.32*s,D+.5*s,timber);
 // Visible timber-frame facade and side buttresses.
 for(const side of [-1,1]){
  beam(x+side*(W/2-.2*s),H/2+.4*s,z+D/2+.08*s,.36*s,H,.3*s,timber);
  beam(x+side*(W/2+.18*s),1.1*s,z,.38*s,2.1*s,D+.4*s,stone);
 }
 for(const y of [.75*s,(H-.45*s)]){
  beam(x,y,z+D/2+.17*s,W,.2*s,.26*s,timber);
 }
 roofPair(x,H+.4*s,z,W+1.5*s,D+1.4*s,(kind===3?3.2:2.8)*s,kind===2?pine:deepRoof);
 // Projecting dormer and little snow-covered canopy.
 if(kind!==2){
  beam(x,H+1.0*s,z+D/2+.27*s,1.5*s,1.35*s,.65*s,plaster);
  roofPair(x,H+1.7*s,z+D/2+.27*s,2.1*s,1.15*s,.85*s,slate);
  windowGlow(x,H+1.12*s,z+D/2+.68*s,.65*s,.7*s);
 }
 windowGlow(x-1.55*s,2.1*s,z+D/2+.2*s,.8*s,1.1*s);
 windowGlow(x+1.55*s,2.1*s,z+D/2+.2*s,.8*s,1.1*s);
 beam(x,1.05*s,z+D/2+.23*s,1.24*s,2.05*s,.18*s,timber);
 beam(x-.38*s,1.1*s,z+D/2+.36*s,.13*s,.13*s,.13*s,warm);
 // Deep porch with visible support posts.
 for(const dx of [-1.2*s,1.2*s])beam(x+dx,1.5*s,z+D/2+1.4*s,.23*s,2.8*s,.23*s,timber);
 beam(x,2.95*s,z+D/2+1.15*s,3.1*s,.3*s,2.4*s,slate);
 beam(x,3.2*s,z+D/2+1.15*s,3.35*s,.25*s,2.55*s,snowRoof);
 beam(x,.12*s,z+D/2+1.45*s,3.1*s,.24*s,2.4*s,stone);
 chimney(x+W*.27,H+1.7*s,z-D*.23,s);
 // Specialty wing: market stall, workshop furnace, or watch turret.
 if(kind===1){
  beam(x+W*.66,1.3*s,z,2.1*s,2.6*s,3.4*s,stone);
  roofPair(x+W*.66,2.65*s,z,2.8*s,3.8*s,1.2*s,slate);
  windowGlow(x+W*.66,1.6*s,z+1.78*s,.7*s,.75*s);
 }else if(kind===2){
  beam(x-W*.62,2.25*s,z,1.65*s,4.5*s,1.8*s,stone);
  cone(x-W*.62,5.5*s,z,1.6*s,2.6*s,deepRoof,8);
  cone(x-W*.62,5.95*s,z,1.15*s,1.8*s,snowRoof,8);
 }else if(kind===3){
  beam(x+W*.64,1.5*s,z,2.5*s,3*s,3*s,timber);
  roofPair(x+W*.64,3*s,z,3.1*s,3.7*s,1.4*s,deepRoof);
 }
}
for(let ix=-4;ix<=4;ix++)for(let iz=-4;iz<=4;iz++){
 if(Math.abs(ix)<=1&&Math.abs(iz)<=1)continue;
 if((ix+iz)%3===0)house(ix*10,iz*10,Math.abs(ix*7+iz));
}
function tower(x,z,sc=1){
 blockArea(x,z,11*sc,11*sc,1.5);
 beam(x,1*sc,z,11*sc,2*sc,11*sc,stone);
 beam(x,6*sc,z,8*sc,10*sc,8*sc,brick);
 for(const dx of [-3.7*sc,3.7*sc])for(const dz of [-3.7*sc,3.7*sc]){
  beam(x+dx,7*sc,z+dz,1.1*sc,14*sc,1.1*sc,stone);
  cone(x+dx,16.5*sc,z+dz,1.7*sc,5*sc,deepRoof,8);
  cone(x+dx,17.2*sc,z+dz,1.25*sc,3.9*sc,snowRoof,8);
 }
 beam(x,11.2*sc,z,9.4*sc,2.2*sc,9.4*sc,stone);
 roofPair(x,12.2*sc,z,10.3*sc,10.3*sc,6*sc,deepRoof);
 beam(x,18.3*sc,z,.65*sc,.5*sc,11*sc,snowRoof);
 for(const dx of [-2.2*sc,0,2.2*sc])windowGlow(x+dx,7.2*sc,z+4.16*sc,.9*sc,1.7*sc);
 beam(x,1.4*sc,z+4.25*sc,2.4*sc,2.8*sc,.3*sc,timber);
 beam(x,3.1*sc,z+5*sc,4*sc,.35*sc,2.2*sc,snowRoof);
}
tower(0,-7,1.1);tower(-29,-22,.65);tower(30,-20,.7);
function tree(x,z,sc){box(x,1*sc,z,.6*sc,2*sc,.6*sc,wood);for(let k=0;k<3;k++)cone(x,(2+k*.9)*sc,z,(2.3-k*.55)*sc,2.4*sc,mat(0x3d766c),7);cone(x,4.1*sc,z,.7*sc,.45*sc,snow,7)}
for(let i=0;i<85;i++){let x=(Math.sin(i*12.23)*.5+.5)*102-51,z=(Math.cos(i*7.63)*.5+.5)*102-51;if(Math.abs(x)<6||Math.abs(z)<6)continue;tree(x,z,.65+(i%4)*.14)}

const roles=['學者','工程師','探索者','生活專家','分析師','藝術家','建築師','醫療師','貿易師','研究員','巡守','調度員'];
const palette=[0x46668a,0xa36b46,0x3c6580,0x9e687a,0x536c88,0x975d8c,0x6c5a4b,0x96a8b3,0x826048,0x445b6d,0x657d65,0x504e70];
let people=[],mixers=[],loaded=false;const blockers=[];function blockArea(x,z,w,d,pad=1.5){blockers.push({minX:x-w/2-pad,maxX:x+w/2+pad,minZ:z-d/2-pad,maxZ:z+d/2+pad})}function blocked(x,z){return blockers.some(b=>x>b.minX&&x<b.maxX&&z>b.minZ&&z<b.maxZ)}
// Roads are open corridors between building rows; no path enters the central tower.
const paths=[
 [[-42,0],[-30,0],[-18,0],[-10,0],[-18,0],[-30,0]],
 [[12,0],[20,0],[30,0],[42,0],[30,0],[20,0]],
 [[0,12],[0,22],[0,32],[0,42],[0,32],[0,22]]
];
const motionClock=new T.Clock();
function movePedestrian(p,dt){
 if(p.wait>0){p.wait=Math.max(0,p.wait-dt);p.action.timeScale=0;return}
 const goal=p.path[p.next],dx=goal[0]-p.root.position.x,dz=goal[1]-p.root.position.z;
 const distance=Math.hypot(dx,dz);
 if(distance<.25){p.next=(p.next+1)%p.path.length;p.wait=.55+(p.index%3)*.25;p.action.timeScale=0;return}
 // Soldier.glb faces local +Z. Turn in place before translating so it never moonwalks.
 // The source Soldier mesh faces -Z, not +Z.
 const desired=Math.atan2(-dx,-dz);

 if(Math.abs(diff)>.12){p.action.timeScale=0;return}

 p.action.timeScale=.75+p.speed*.18;
}

let choice=null;try{const v=JSON.parse(localStorage.getItem('aivault_snow_character_choice_v1')||'null');if(v&&Number.isInteger(v.role_id)&&v.role_id>=1&&v.role_id<=9&&['男','女'].includes(v.gender))choice=v;}catch(e){}
const choiceInfo=document.getElementById('choice-info');
choiceInfo.textContent=choice?'你的角色：'+choice.gender+' · '+roles[choice.role_id-1]+'（外觀模型尚未完成）':'尚未選角，請按下方「選角」';
document.getElementById('choose').onclick=()=>location.href='aivault-snow-nine-role-selector.html';
document.getElementById('focus').onclick=()=>{if(!choice||!people.length){choiceInfo.textContent='請先選角，並等待模型載入';return}const p=people[choice.role_id-1];target.copy(p.root.position);dist=45;angle=.72;cam();choiceInfo.textContent='已定位：'+choice.gender+' · '+roles[choice.role_id-1]+'（Soldier 代用骨架，非完成角色）'};

const info=document.createElement('div');info.id='rig-info';info.textContent='正在載入骨架人物……';document.getElementById('hud').appendChild(info);
new GLTFLoader().load('https://threejs.org/examples/models/gltf/Soldier.glb',g=>{
 const walk=g.animations.find(a=>/walk/i.test(a.name));
 if(!walk){info.textContent='BLOCKED：素材缺少 Walk 動畫';return}
 for(let i=0;i<12;i++){
  const root=cloneSkinned(g.scene);
  const path=paths[i%paths.length];const start=(Math.floor(i/3)*2)%path.length;const x=path[start][0],z=path[start][1];
  root.position.set(x,0,z);root.scale.setScalar(1.9);
  root.rotation.y=Math.atan2(x-path[(start+1)%path.length][0],z-path[(start+1)%path.length][1]);
  root.traverse(o=>{if(o.isMesh||o.isSkinnedMesh){o.castShadow=true;const a=Array.isArray(o.material)?o.material:[o.material];o.material=a.map(m=>{const n=m.clone();if(n.color&&/body|soldier|uniform|coat|jacket/i.test(o.name))n.color.setHex(palette[i]);return n});if(o.material.length===1)o.material=o.material[0]}});
  scene.add(root);
  if(choice&&i===choice.role_id-1){
   const marker=new T.Mesh(new T.TorusGeometry(1.2,.09,8,32),new T.MeshBasicMaterial({color:0xffd36d}));
   marker.rotation.x=Math.PI/2;marker.position.y=.1;root.add(marker);
  }
  const mixer=new T.AnimationMixer(root);const action=mixer.clipAction(walk);action.time=(i/12)*walk.duration;action.play();mixers.push(mixer);
  people.push({root,path,next:(start+1)%path.length,wait:i*.2,speed:1.8+(i%4)*.3,action,index:i,role:roles[i]});
 }
 loaded=true;info.textContent='12 位骨架人物已載入：道路巡走、轉向、防穿牆；男女外觀尚未實作。';
},undefined,e=>{info.textContent='BLOCKED：骨架素材無法載入 '+(e?.message||e)});
const snowGeo=new T.BufferGeometry(),pts=[];for(let i=0;i<300;i++)pts.push((Math.random()-.5)*115,Math.random()*35,(Math.random()-.5)*115);snowGeo.setAttribute('position',new T.Float32BufferAttribute(pts,3));const flakes=new T.Points(snowGeo,new T.PointsMaterial({color:0xffffff,size:.22,transparent:true,opacity:.8}));scene.add(flakes);
let playing=true,time=0,drag=false,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(!drag)return;angle-=(e.clientX-lastX)*.008;dist=Math.max(30,Math.min(165,dist+(e.clientY-lastY)*.1));lastX=e.clientX;lastY=e.clientY;cam()});renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(25,Math.min(100,dist+e.deltaY*.03));cam()},{passive:true});document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'⏸ 暫停':'▶ 播放'};document.getElementById('zoom').onclick=()=>{dist=Math.max(30,dist-10);cam()};document.getElementById('reset').onclick=()=>{angle=.72;dist=125;target.set(0,0,0);cam()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function loop(){requestAnimationFrame(loop);const dt=Math.min(motionClock.getDelta(),.05);if(playing){time+=dt;people.forEach(p=>movePedestrian(p,dt));mixers.forEach(m=>m.update(dt));const a=flakes.geometry.attributes.position;for(let i=0;i<a.count;i++){let y=a.getY(i)-.03;if(y<0)y=34;a.setY(i,y)}a.needsUpdate=true}renderer.render(scene,camera)}loop();
