<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b1a">
<title>暗星 × 曙光｜一起聊</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;background:linear-gradient(180deg,#0d0b1a,#1b1530 60%,#2a1d12);color:#f2f0ff;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
body{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:12px 14px}
header a{color:#cfc8ff;text-decoration:none;font-size:14px;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:6px 10px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap}
.faces{display:flex;justify-content:center;gap:18px;padding:6px 0 4px}
.duo-face{display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .25s}
.duo-face.talking{transform:scale(1.08)}
.duo-face span.n{font-size:13px;opacity:.85}
#orbDark,#orbDawn{width:120px;height:120px;display:block}
#dsDuoSub{margin:6px 14px 0;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.08);font-size:14px;line-height:1.45;min-height:20px}
#duoLog{flex:1;overflow-y:auto;margin:8px 14px;padding:8px;border-radius:12px;background:rgba(0,0,0,.25);font-size:14px;line-height:1.5}
#duoLog .ln{margin:6px 0;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.04)}#duoLog .ln .tx{white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}#duoLog .ln .act{display:flex;gap:6px;margin-top:4px;opacity:.55}#duoLog .ln .act button{width:30px;height:26px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:transparent;color:inherit;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer}#duoLog .ln .act button:active{background:rgba(255,255,255,.15)}#duoToast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);transform:translateX(-50%);background:rgba(20,18,35,.95);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:8px 12px;font-size:14px;z-index:50;display:flex;gap:10px;align-items:center}#duoToast button{border:0;background:#f5b301;color:#111;border-radius:8px;padding:4px 8px;font-size:13px}#duoClear{margin-left:auto;font-size:13px;color:#cfc8ff;background:none;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:6px 10px}#duoLog .ln.user{color:#bfe3ff}#duoLog .ln.dawn{color:#ffd98a}#duoLog .ln.dark{color:#d9d3ff}
.row{display:flex;gap:8px;padding:6px 14px}
.btn{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:10px 12px;font-size:15px;cursor:pointer}
.btn.primary{background:linear-gradient(135deg,#7b6cff,#f5b301);border:0;font-weight:600;flex:1}
.btn:disabled{opacity:.45}
#dsTrioAsk{padding-bottom:12px}
#dsTrioIn{flex:1;min-width:0;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.95);color:#111;padding:10px;font-size:16px}
#loginNote{margin:0 14px;color:#ffb4b4;font-size:13px}
</style>
</head>
<body>
<header><a href="technical-dark-star.html">‹ 返回</a><h1>🌙 暗星 × ☀️ 曙光</h1><button id="duoClear" type="button">清除全部</button></header>
<div class="faces">
  <div class="duo-face" id="faceDark"><span id="orbDark"></span><span class="n">暗星</span></div>
  <div class="duo-face" id="faceDawn"><span id="orbDawn"></span><span class="n">曙光</span></div>
</div>
<p id="loginNote" hidden>⚠️ 尚未登入 AIVAULT，AI 回覆可能受限；請先在 AIVAULT 登入。</p>
<div id="dsDuoSub" hidden></div>
<div id="duoLog"></div>
<div id="duoToast" hidden></div>
<div class="row"><button id="dsTrioTalk" class="btn primary" type="button">🌙☀️ 一起聊</button><button id="dsDuoTalk" class="btn" type="button">🌙☀️ 互聊</button></div>
<div class="row" id="dsTrioAsk" hidden><button id="dsTrioMic" class="btn" type="button" style="flex:none;min-width:48px">🎤</button><input id="dsTrioIn" type="text" placeholder="打字也可以…" enterkeyhint="send"><button id="dsTrioSend" class="btn" type="button">送出</button></div>
<script src="darkstar-dawn-duo-orb.js?v=20261016-d1"></script>
<script src="darkstar-dawn-duo-app.js?v=20261016-d2"></script>
</body>
</html>
