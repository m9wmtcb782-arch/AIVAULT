<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AIVAULT｜暗星 GLB 3D 引擎解析測試</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#070a0f;color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}body{display:flex;flex-direction:column;overflow:hidden}.top{padding:14px 16px;border-bottom:1px solid #202733;background:#0b0f16}.title{font-size:18px;font-weight:700}.sub{font-size:12px;color:#94a0b2;margin-top:4px}.main{position:relative;flex:1;min-height:0}canvas{display:block;width:100%;height:100%}.panel{position:absolute;left:12px;right:12px;bottom:12px;max-height:45%;overflow:auto;background:rgba(9,13,19,.9);backdrop-filter:blur(10px);border:1px solid #283140;border-radius:14px;padding:12px;font-size:12px;line-height:1.55}.ok{color:#72e6a2}.warn{color:#ffd36b}.err{color:#ff7b8a}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #202733;padding:5px 0}.name{word-break:break-all;color:#d9e1ec}.value{color:#8fd3ff;text-align:right;word-break:break-all}.buttons{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.buttons button{border:1px solid #344054;background:#151b25;color:#eef2f7;border-radius:9px;padding:7px 9px}.buttons button:active{transform:scale(.98)}
</style>
</head>
<body>
<div class="top"><div class="title">AIVAULT｜Technical Dark Star 自有 GLB 3D 引擎解析</div><div class="sub">獨立測試頁｜不修改正式暗星介面</div></div>
<div class="main"><div id="stage"></div><div class="panel"><div id="status" class="warn">正在載入 Three.js 與 AIVAULT GLB…</div><div id="info"></div><div class="buttons"><button id="front">正面</button><button id="left">左轉</button><button id="right">右轉</button><button id="reset">重置</button></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';

const MODEL='./assets/dark-star/technical-dark-star-avatar.glb';
const status=document.getElementById('status');
const info=document.getElementById('info');
const stage=document.getElementById('stage');
let scene,camera,renderer,root,mixer,clock;

function row(k,v){return `<div class="row"><span class="name">${k}</span><span class="value">${String(v).replaceAll('&','&amp;').replaceAll('<','&lt;')}</span></div>`}
function setStatus(t,c='warn'){status.className=c;status.textContent=t}
function collect(root){
 let meshes=0,skinned=0,morphMeshes=0,morphs=[] ,bones=0,materials=0,vertices=0;
 root.traverse(o=>{
   if(o.isMesh){meshes++;vertices+=o.geometry?.attributes?.position?.count||0; if(o.material)materials+=Array.isArray(o.material)?o.material.length:1;if(o.morphTargetDictionary){morphMeshes++;morphs.push(...Object.keys(o.morphTargetDictionary))}}
   if(o.isSkinnedMesh)skinned++;
   if(o.isBone)bones++;
 });
 return {meshes,skinned,morphMeshes,bones,materials,vertices,morphs:[...new Set(morphs)]};
}

async function boot(){
 try{
   scene=new THREE.Scene();
   scene.background=new THREE.Color(0x070a0f);
   camera=new THREE.PerspectiveCamera(35,stage.clientWidth/stage.clientHeight,.01,1000);
   camera.position.set(0,1.55,3.2);
   renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
   renderer.setPixelRatio(Math.min(devicePixelRatio,2));
   renderer.setSize(stage.clientWidth,stage.clientHeight);
   renderer.outputColorSpace=THREE.SRGBColorSpace;
   stage.appendChild(renderer.domElement);
   scene.add(new THREE.HemisphereLight(0xffffff,0x263041,2.0));
   const key=new THREE.DirectionalLight(0xffffff,3.0);key.position.set(2,4,4);scene.add(key);
   const fill=new THREE.DirectionalLight(0x9ec8ff,1.5);fill.position.set(-3,2,1);scene.add(fill);
   const loader=new GLTFLoader();
   const gltf=await loader.loadAsync(MODEL);
   root=gltf.scene;scene.add(root);
   const box=new THREE.Box3().setFromObject(root), size=box.getSize(new THREE.Vector3()), center=box.getCenter(new THREE.Vector3());
   root.position.sub(center);root.position.y+=size.y*.5;
   const max=Math.max(size.x,size.y,size.z)||1;camera.position.set(0,max*.38,max*2.25);camera.lookAt(0,max*.45,0);
   if(gltf.animations?.length){mixer=new THREE.AnimationMixer(root);gltf.animations.forEach(a=>mixer.clipAction(a).play())}
   const d=collect(root);
   info.innerHTML=row('GLB解析','成功')+row('Mesh',d.meshes)+row('SkinnedMesh',d.skinned)+row('Bones',d.bones)+row('Materials',d.materials)+row('Vertices',d.vertices)+row('Animations',gltf.animations?.length||0)+row('Morph Meshes',d.morphMeshes)+row('Morph Targets',d.morphs.length)+(d.morphs.length?row('Morph 名稱',d.morphs.join(', ')):'');
   if(d.morphs.length||d.bones||gltf.animations?.length)setStatus('✅ 3D 引擎解析成功，已找到可控制的動畫資料。下一步可接臉部控制。','ok');
   else setStatus('⚠️ GLB 可以正常解析與顯示，但目前未找到 Morph Target、Bone 或 Animation；需要進一步檢查模型結構。','warn');
   clock=new THREE.Clock();animate();
 }catch(e){console.error(e);setStatus('❌ Three.js / GLTFLoader 解析失敗：'+(e?.message||e),'err');info.innerHTML=row('模型',MODEL)+row('錯誤',e?.stack||e)}
}
function animate(){requestAnimationFrame(animate);if(mixer)mixer.update(clock.getDelta());renderer.render(scene,camera)}
function turn(rad){if(root)root.rotation.y=rad}
document.getElementById('front').onclick=()=>turn(0);document.getElementById('left').onclick=()=>turn(.55);document.getElementById('right').onclick=()=>turn(-.55);document.getElementById('reset').onclick=()=>turn(0);
addEventListener('resize',()=>{if(!renderer)return;camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();renderer.setSize(stage.clientWidth,stage.clientHeight)});
boot();
</script>
</body></html>
