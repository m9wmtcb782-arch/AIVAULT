<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a11">
<title>AIVAULT — Secure Login</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#060911;color:#edf5ff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",sans-serif}
body{display:grid;place-items:center;padding:24px;overflow-x:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 8%,rgba(63,108,255,.18),transparent 35%),radial-gradient(circle at 80% 85%,rgba(0,225,255,.06),transparent 32%)}
.bg:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:40px 40px}
.card{position:relative;width:min(100%,430px);padding:36px 27px 27px;border:1px solid rgba(150,180,220,.17);border-radius:28px;background:rgba(10,15,25,.84);backdrop-filter:blur(25px);box-shadow:0 30px 90px rgba(0,0,0,.48)}
.brand{text-align:center}
.brandName{font-size:42px;font-weight:800;letter-spacing:.17em;margin-left:.17em;text-shadow:0 0 28px rgba(96,220,255,.16)}
.tag{margin-top:9px;font-size:11px;letter-spacing:.2em;color:#8090aa}
h1{text-align:center;font-size:21px;margin:35px 0 8px}
.hint{text-align:center;color:#77869e;font-size:13px;margin-bottom:27px}
.field{position:relative;margin-bottom:17px}
label{display:block;color:#aab7cb;font-size:12px;margin-bottom:8px}
input[type=email],input[type=password],input[type=text]{
  width:100%;height:50px;border-radius:13px;border:1px solid rgba(160,185,220,.18);
  background:#080d16;color:#fff;padding:0 15px;font-size:15px;outline:none
}
input:focus{border-color:rgba(101,232,255,.55);box-shadow:0 0 0 3px rgba(101,232,255,.07)}
.eye{position:absolute;right:8px;bottom:5px;width:40px;height:40px;border:0;background:none;color:#8796ae;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;color:#8794aa;font-size:12px;margin:3px 0 20px}
.remember{display:flex;align-items:center;gap:7px;cursor:pointer}
.remember input{width:15px;height:15px;accent-color:#75eaff}
.login{
  width:100%;height:51px;border:0;border-radius:14px;
  background:linear-gradient(135deg,#e2fcff,#819aff);color:#07101a;
  font-weight:800;font-size:15px;box-shadow:0 12px 32px rgba(79,139,255,.2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px
}
.login:disabled{opacity:.55;cursor:not-allowed}
.sep{display:flex;align-items:center;gap:12px;color:#56647b;font-size:10px;letter-spacing:.12em;margin:25px 0}
.sep:before,.sep:after{content:"";height:1px;flex:1;background:rgba(255,255,255,.08)}
.passkey{
  width:100%;height:47px;border-radius:13px;border:1px solid rgba(155,180,220,.18);
  background:rgba(255,255,255,.025);color:#c6d3e6;font-size:13px;cursor:pointer
}
.error{display:none;color:#ff9b9b;font-size:12px;margin:-5px 0 14px;line-height:1.4}
.error.show{display:block}
.success{display:none;color:#86efac;font-size:12px;margin:-5px 0 14px}
.success.show{display:block}
.security{text-align:center;color:#5f6d84;font-size:10px;line-height:1.7;margin-top:22px}
.spinner{
  width:16px;height:16px;border:2px solid rgba(7,16,26,.25);border-top-color:#07101a;
  border-radius:50%;animation:spin .7s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.config-warn{
  margin-top:16px;padding:10px 12px;border-radius:10px;
  background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);
  color:#fbbf24;font-size:11px;line-height:1.5;display:none
}
.config-warn.show{display:block}
.link-btn{background:none;border:none;color:#7dd3fc;font-size:12px;cursor:pointer;padding:0}
.link-btn:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="bg"></div>
<main class="card">
  <section class="brand">
    <div class="brandName">AIVAULT</div>
    <div class="tag">AI AGENT OPERATING SYSTEM</div>
  </section>
  <h1>登入 AIVAULT</h1>
  <div class="hint">安全進入你的 AI 工作空間</div>

  <form id="form" novalidate>
    <div class="field">
      <label for="email">帳號 / Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="name@example.com" required>
    </div>
    <div class="field">
      <label for="password">密碼</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="輸入密碼" required>
      <button class="eye" id="eye" type="button" aria-label="顯示密碼">◉</button>
    </div>

    <div class="error" id="error"></div>
    <div class="success" id="success"></div>

    <div class="row">
      <label class="remember">
        <input id="remember" type="checkbox"> 記住此裝置
      </label>
      <button type="button" class="link-btn" id="btnForgot">忘記密碼？</button>
    </div>

    <button class="login" type="submit" id="btnLogin">
      <span id="loginLabel">登入 AIVAULT</span>
    </button>
  </form>

  <div class="sep">SECURE ACCESS</div>
  <button class="passkey" type="button" id="passkey">使用 Passkey / Face ID / Touch ID</button>

  <div class="security">
    🔒 使用 Supabase Auth 驗證身分與 Session。<br>
    密碼不會寫入前端程式碼 · Access Token 僅存於本機。
  </div>

  <div class="config-warn" id="configWarn">
    ⚠️ 尚未設定 SUPABASE_URL / SUPABASE_ANON_KEY。<br>
    請在下方 script 區塊填入你的專案資訊後再測試登入。
  </div>
</main>

<script type="module">
  // =====================================================
  // ① 請填入你的 Supabase 專案資訊
  // =====================================================
  const SUPABASE_URL = 'https://clcddygkaaqqtsbswgdf.supabase.co'
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsY2RkeWdrYWFxcXRzYnN3Z2RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzUwNjQsImV4cCI6MjEwMjMxMTA2NH0.kYg6h7n74CtbiIjNjZ2xxJj16SV42INZVzQ9dLNUfKE'

  // 登入成功後要去的頁面
  const HOME_URL = 'aivault-home.html'

  // =====================================================
  // ② 引入 supabase-js（CDN ESM）
  // =====================================================
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

  const isConfigured =
    SUPABASE_URL &&
    !SUPABASE_URL.includes('YOUR_PROJECT') &&
    SUPABASE_ANON_KEY &&
    !SUPABASE_ANON_KEY.includes('YOUR_SUPABASE')

  const supabase = isConfigured
    ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
          autoRefreshToken: true,
          persistSession: true,
          detectSessionInUrl: true,
          storage: window.localStorage
        }
      })
    : null

  // DOM
  const form = document.getElementById('form')
  const emailEl = document.getElementById('email')
  const passEl = document.getElementById('password')
  const errorEl = document.getElementById('error')
  const successEl = document.getElementById('success')
  const btnLogin = document.getElementById('btnLogin')
  const loginLabel = document.getElementById('loginLabel')
  const rememberEl = document.getElementById('remember')
  const configWarn = document.getElementById('configWarn')

  if (!isConfigured) {
    configWarn.classList.add('show')
  }

  // 顯示／隱藏密碼
  document.getElementById('eye').onclick = () => {
    const show = passEl.type === 'password'
    passEl.type = show ? 'text' : 'password'
    document.getElementById('eye').textContent = show ? '◎' : '◉'
  }

  function showError(msg) {
    errorEl.textContent = msg
    errorEl.classList.add('show')
    successEl.classList.remove('show')
  }
  function showSuccess(msg) {
    successEl.textContent = msg
    successEl.classList.add('show')
    errorEl.classList.remove('show')
  }
  function clearMsg() {
    errorEl.classList.remove('show')
    successEl.classList.remove('show')
  }
  function setLoading(on) {
    btnLogin.disabled = on
    loginLabel.innerHTML = on
      ? '<span class="spinner"></span> 登入中…'
      : '登入 AIVAULT'
  }

  // 已登入就直接跳轉
  async function checkExistingSession() {
    if (!supabase) return
    const { data: { session } } = await supabase.auth.getSession()
    if (session) {
      location.replace(HOME_URL)
    }
  }
  checkExistingSession()

  // 記住帳號（只記 email，不記密碼）
  const savedEmail = localStorage.getItem('aivault_remember_email')
  if (savedEmail) {
    emailEl.value = savedEmail
    rememberEl.checked = true
  }

  // 正式登入
  form.onsubmit = async (e) => {
    e.preventDefault()
    clearMsg()

    const email = emailEl.value.trim()
    const password = passEl.value

    if (!email || !password) {
      showError('請輸入帳號與密碼。')
      return
    }

    if (!supabase) {
      showError('尚未設定 Supabase 專案金鑰，無法登入。')
      return
    }

    setLoading(true)

    try {
      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      })

      if (error) {
        // 刻意使用較通用的錯誤訊息，避免帳號枚舉
        let msg = '登入失敗，請檢查帳號或密碼。'
        if (error.message?.includes('Email not confirmed')) {
          msg = '此帳號尚未完成 Email 驗證，請先至信箱點擊確認連結。'
        } else if (error.message?.includes('Invalid login credentials')) {
          msg = '帳號或密碼錯誤。'
        } else if (error.status === 429) {
          msg = '嘗試次數過多，請稍後再試。'
        }
        showError(msg)
        setLoading(false)
        return
      }

      // 記住 email
      if (rememberEl.checked) {
        localStorage.setItem('aivault_remember_email', email)
      } else {
        localStorage.removeItem('aivault_remember_email')
      }

      showSuccess('登入成功，正在進入工作台…')
      // 短暫延遲讓使用者看到成功提示
      setTimeout(() => {
        location.href = HOME_URL
      }, 400)

    } catch (err) {
      console.error(err)
      showError('網路或系統錯誤，請稍後再試。')
      setLoading(false)
    }
  }

  // 忘記密碼
  document.getElementById('btnForgot').onclick = async () => {
    clearMsg()
    const email = emailEl.value.trim()
    if (!email) {
      showError('請先輸入 Email，再點「忘記密碼」。')
      return
    }
    if (!supabase) {
      showError('尚未設定 Supabase，無法寄送重設信。')
      return
    }

    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/aivault-login.html'
    })

    if (error) {
      showError('無法寄送重設密碼信件：' + (error.message || '未知錯誤'))
    } else {
      showSuccess('已寄出重設密碼連結，請至信箱查收。')
    }
  }

  // Passkey 預留
  document.getElementById('passkey').onclick = () => {
    showError('Passkey / Face ID 將在下一階段啟用。目前請使用 Email + 密碼登入。')
  }

  // 監聽 Auth 狀態（可選）
  if (supabase) {
    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session) {
        // 已在 submit 處理跳轉
      }
      if (event === 'SIGNED_OUT') {
        // 未來可在此清狀態
      }
    })
  }
</script>
</body>
</html>
