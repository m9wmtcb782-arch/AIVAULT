<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#070a11">

<title>AIVAULT — Secure Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:#060911;
  color:#edf5ff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Noto Sans TC",
    sans-serif;
}

body{
  display:grid;
  place-items:center;
  padding:24px;
  overflow-x:hidden;
}

.bg{
  position:fixed;
  inset:0;
  background:
    radial-gradient(
      circle at 50% 8%,
      rgba(63,108,255,.18),
      transparent 35%
    ),
    radial-gradient(
      circle at 80% 85%,
      rgba(0,225,255,.06),
      transparent 32%
    );
}

.bg:after{
  content:"";
  position:absolute;
  inset:0;

  background-image:
    linear-gradient(
      rgba(255,255,255,.018) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.018) 1px,
      transparent 1px
    );

  background-size:40px 40px;
}

/* =========================================================
   CARD
========================================================= */

.card{
  position:relative;
  width:min(100%,430px);

  padding:36px 27px 27px;

  border:1px solid rgba(150,180,220,.17);
  border-radius:28px;

  background:rgba(10,15,25,.84);

  backdrop-filter:blur(25px);

  box-shadow:
    0 30px 90px rgba(0,0,0,.48);
}

/* =========================================================
   BRAND
========================================================= */

.brand{
  text-align:center;
}

.brandName{
  font-size:42px;
  font-weight:800;

  letter-spacing:.17em;
  margin-left:.17em;

  text-shadow:
    0 0 28px rgba(96,220,255,.16);
}

.tag{
  margin-top:9px;

  font-size:11px;
  letter-spacing:.2em;

  color:#8090aa;
}

/* =========================================================
   TITLE
========================================================= */

h1{
  text-align:center;

  font-size:21px;

  margin:35px 0 8px;
}

.hint{
  text-align:center;

  color:#77869e;

  font-size:13px;

  margin-bottom:27px;
}

/* =========================================================
   FIELDS
========================================================= */

.field{
  position:relative;
  margin-bottom:17px;
}

label{
  display:block;

  color:#aab7cb;

  font-size:12px;

  margin-bottom:8px;
}

input[type=email],
input[type=password],
input[type=text]{
  width:100%;
  height:50px;

  border-radius:13px;

  border:1px solid rgba(160,185,220,.18);

  background:#080d16;

  color:#fff;

  padding:0 15px;

  font-size:15px;

  outline:none;
}

input:focus{
  border-color:rgba(101,232,255,.55);

  box-shadow:
    0 0 0 3px rgba(101,232,255,.07);
}

.eye{
  position:absolute;

  right:8px;
  bottom:5px;

  width:40px;
  height:40px;

  border:0;

  background:none;

  color:#8796ae;

  cursor:pointer;
}

/* =========================================================
   MESSAGE
========================================================= */

.message{
  display:none;

  font-size:12px;

  margin:-4px 0 15px;

  line-height:1.6;
}

.message.show{
  display:block;
}

.message.error{
  color:#ff9b9b;
}

.message.success{
  color:#8ef1ff;
}

/* =========================================================
   ROW
========================================================= */

.row{
  display:flex;

  justify-content:space-between;

  align-items:center;

  color:#8794aa;

  font-size:12px;

  margin:3px 0 20px;
}

.remember{
  display:flex;

  align-items:center;

  gap:7px;
}

.remember input{
  width:15px;
  height:15px;

  accent-color:#75eaff;
}

.link-button{
  border:0;

  background:none;

  color:#7fdfff;

  font-size:12px;

  padding:0;

  cursor:pointer;
}

/* =========================================================
   LOGIN BUTTON
========================================================= */

.login{
  width:100%;
  height:51px;

  border:0;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #e2fcff,
      #819aff
    );

  color:#07101a;

  font-weight:800;

  font-size:15px;

  box-shadow:
    0 12px 32px rgba(79,139,255,.2);

  cursor:pointer;

  transition:
    transform .15s ease,
    opacity .15s ease;
}

.login:active{
  transform:scale(.985);
}

.login:disabled{
  opacity:.55;
  cursor:not-allowed;
}

/* =========================================================
   SECURE ACCESS
========================================================= */

.sep{
  display:flex;

  align-items:center;

  gap:12px;

  color:#56647b;

  font-size:10px;

  letter-spacing:.12em;

  margin:25px 0;
}

.sep:before,
.sep:after{
  content:"";

  height:1px;

  flex:1;

  background:rgba(255,255,255,.08);
}

.passkey{
  width:100%;
  height:47px;

  border-radius:13px;

  border:1px solid rgba(155,180,220,.18);

  background:rgba(255,255,255,.025);

  color:#c6d3e6;

  font-size:13px;

  cursor:pointer;
}

/* =========================================================
   REGISTER
========================================================= */

.register-area{
  text-align:center;

  margin-top:22px;

  color:#68768d;

  font-size:12px;
}

.register-button{
  margin-top:8px;

  border:0;

  background:none;

  color:#8eeaff;

  font-size:13px;

  font-weight:600;

  cursor:pointer;
}

/* =========================================================
   BACK LOGIN
========================================================= */

.back-login{
  text-align:center;

  margin-top:20px;

  color:#68768d;

  font-size:12px;
}

.back-button{
  border:0;

  background:none;

  color:#8eeaff;

  font-size:13px;

  font-weight:600;

  cursor:pointer;
}

/* =========================================================
   SECURITY
========================================================= */

.security{
  text-align:center;

  color:#5f6d84;

  font-size:10px;

  line-height:1.7;

  margin-top:22px;
}

/* =========================================================
   HIDDEN
========================================================= */

.hidden{
  display:none !important;
}

/* =========================================================
   LOADING
========================================================= */

.loading{
  display:inline-block;

  width:15px;
  height:15px;

  border:2px solid rgba(7,16,26,.25);

  border-top-color:#07101a;

  border-radius:50%;

  animation:spin .7s linear infinite;

  vertical-align:-3px;

  margin-right:6px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}
</style>
</head>

<body>

<div class="bg"></div>

<main class="card">

  <!-- =====================================================
       BRAND
  ====================================================== -->

  <section class="brand">

    <div class="brandName">
      AIVAULT
    </div>

    <div class="tag">
      AI AGENT OPERATING SYSTEM
    </div>

  </section>


  <!-- =====================================================
       LOGIN PANEL
  ====================================================== -->

  <section id="loginPanel">

    <h1>
      登入 AIVAULT
    </h1>

    <div class="hint">
      安全進入你的 AI 工作空間
    </div>


    <form id="loginForm" novalidate>

      <!-- Email -->

      <div class="field">

        <label for="loginEmail">
          帳號 / Email
        </label>

        <input
          id="loginEmail"
          type="email"
          autocomplete="username"
          placeholder="name@example.com"
          required
        >

      </div>


      <!-- Password -->

      <div class="field">

        <label for="loginPassword">
          密碼
        </label>

        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          placeholder="輸入密碼"
          required
        >

        <button
          class="eye"
          id="loginEye"
          type="button"
          aria-label="顯示密碼"
        >
          ◉
        </button>

      </div>


      <!-- Message -->

      <div
        class="message error"
        id="loginMessage"
      ></div>


      <!-- Options -->

      <div class="row">

        <label class="remember">

          <input
            id="remember"
            type="checkbox"
          >

          記住此裝置

        </label>


        <button
          class="link-button"
          id="forgotPassword"
          type="button"
        >
          忘記密碼？
        </button>

      </div>


      <!-- Login -->

      <button
        class="login"
        id="loginButton"
        type="submit"
      >
        登入 AIVAULT
      </button>

    </form>


    <!-- Secure -->

    <div class="sep">
      SECURE ACCESS
    </div>


    <button
      class="passkey"
      id="passkey"
      type="button"
    >
      使用 Passkey / Face ID / Touch ID
    </button>


    <!-- Register -->

    <div class="register-area">

      還沒有 AIVAULT 帳號？

      <br>

      <button
        class="register-button"
        id="showRegister"
        type="button"
      >
        註冊帳號
      </button>

    </div>


    <div class="security">
      🔒 使用 Supabase Auth 驗證身分與 Session。<br>
      密碼不會寫入前端程式碼。
    </div>

  </section>


  <!-- =====================================================
       REGISTER PANEL
  ====================================================== -->

  <section
    id="registerPanel"
    class="hidden"
  >

    <h1>
      建立 AIVAULT 帳號
    </h1>

    <div class="hint">
      建立你的 AI 工作空間帳號
    </div>


    <form id="registerForm" novalidate>

      <!-- Email -->

      <div class="field">

        <label for="registerEmail">
          Email
        </label>

        <input
          id="registerEmail"
          type="email"
          autocomplete="email"
          placeholder="name@example.com"
          required
        >

      </div>


      <!-- Password -->
