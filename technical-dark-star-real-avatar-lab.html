<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Technical Dark Star｜真人 3D Avatar Lab</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#10131a;color:#fff}#app{width:100%;height:100%;position:relative}canvas{display:block;width:100%;height:100%}.panel{position:absolute;left:12px;right:12px;bottom:12px;max-height:43vh;overflow:auto;background:rgba(12,15,22,.9);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:12px;box-shadow:0 12px 40px rgba(0,0,0,.35)}h1{font-size:17px;margin:0 0 4px}.sub{font-size:12px;color:#aeb7c8;margin-bottom:8px}.row{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0}.btn{border:1px solid #394357;background:#1b2130;color:#fff;border-radius:10px;padding:9px 11px;font-size:13px}.btn:active{transform:scale(.97)}label{font-size:12px;color:#c8d0df;display:flex;align-items:center;gap:7px;min-width:150px}input[type=range]{width:120px}.status{font-size:12px;color:#8ee6bd;margin-top:7px;word-break:break-word}.upload{font-size:12px;color:#b9c3d5}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:3}.badge{background:rgba(10,13,20,.72);padding:8px 11px;border-radius:12px;border:1px solid rgba(255,255,255,.12);font-size:12px}</style></head><body><div id="app"><div class="top"><div class="badge">Technical Dark Star · 真人 3D Avatar Lab</div><div class="badge" id="modelName">載入模型中…</div></div><div class="panel"><h1>真人數字人臉部控制測試</h1><div class="sub">獨立測試頁：同一個 3D 女性模型控制原生臉部，不疊加假眼睛或假嘴巴。</div><div class="row"><button class="btn" id="loadDefault">載入真人測試模型</button><label class="btn upload">載入自己的 VRM / GLB <input id="file" type="file" accept=".vrm,.glb" hidden></label><button class="btn" onclick="DarkStarFace.reset()">重置</button></div><div class="row"><button class="btn" onclick="DarkStarFace.blink()">眨眼</button><button class="btn" onclick="DarkStarFace.wink('left')">左眼眨</button><button class="btn" onclick="DarkStarFace.wink('right')">右眼眨</button><button class="btn" onclick="DarkStarFace.look('left')">看左</button><button class="btn" onclick="DarkStarFace.look('right')">看右</button><button class="btn" onclick="DarkStarFace.look('up')">看上</button><button class="btn" onclick="DarkStarFace.look('down')">看下</button><button class="btn" onclick="DarkStarFace.look('center')">看前</button></div><div class="row"><button class="btn" onclick="DarkStarFace.expression('happy')">😊 開心</button><button class="btn" onclick="DarkStarFace.expression('sad')">😢 悲傷</button><button class="btn" onclick="DarkStarFace.expression('angry')">😠 憤怒</button><button class="btn" onclick="DarkStarFace.expression('surprised')">😮 驚訝</button><button class="btn" onclick="DarkStarFace.expression('relaxed')">😐 平靜</button></div><div class="row"><label>嘴型 <input id="mouth" type="range" min="0" max="1" step="0.01" value="0" oninput="DarkStarFace.mouth(+this.value)"></label><label>眼睛 <input id="eyes" type="range" min="0" max="1" step="0.01" value="1" oninput="DarkStarFace.eyes(+this.value)"></label></div><div class="status" id="status">正在載入模型。</div></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.1/lib/three-vrm.module.js"}}</script><script type="module">import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{VRMLoaderPlugin,VRMUtils}from'@pixiv/three-vrm';const DEFAULT_MODEL='https://raw.githubusercontent.com/TLTMedia/valid-vrm-avatars/master/Asian/Asian_F_1_Casual.glb',status=document.getElementById('status'),nameEl=document.getElementById('modelName');const scene=new THREE.Scene();scene.background=new THREE.Color(0x10131a);const camera=new THREE.PerspectiveCamera(28,innerWidth/innerHeight,.01,100);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.getElementById('app').prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=.7;controls.maxDistance=10;scene.add(new THREE.HemisphereLight(0xffffff,0x334455,2.2));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(2,4,5);scene.add(key);let root=null,vrm=null,morphMeshes=[];const loader=new GLTFLoader();loader.crossOrigin='anonymous';loader.register(p=>new VRMLoaderPlugin(p));function setStatus(t){status.textContent=t}function fit(r){const b=new THREE.Box3().setFromObject(r),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),h=Math.max(s.y,.1),d=Math.max(2,h*2.2);camera.position.set(c.x,c.y+h*.03,c.z+d);camera.near=.01;camera.far=d*20;camera.updateProjectionMatrix();controls.target.set(c.x,c.y+h*.08,c.z)}function dispose(){if(root){scene.remove(root);root.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){const a=Array.isArray(o.material)?o.material:[o.material];a.forEach(m=>m.dispose())}})}root=null;vrm=null;morphMeshes=[]}async function load(url,label){setStatus('正在載入真人 3D 模型…');nameEl.textContent=label||'3D Avatar';dispose();try{const g=await loader.loadAsync(url);root=g.scene;vrm=g.userData.vrm||null;root.traverse(o=>{o.frustumCulled=false;if(o.isMesh&&o.morphTargetDictionary)morphMeshes.push(o)});scene.add(root);fit(root);if(vrm?.lookAt)vrm.lookAt.autoUpdate=true;setStatus(vrm?'真人 VRM 已載入，可以控制原生臉部。':'真人 GLB 已載入，可以直接檢查模型；若要完整 VRM 表情控制請載入 VRM。')}catch(e){console.error(e);setStatus('載入失敗：'+(e?.message||e))}}function morph(re,v){for(const m of morphMeshes){const d=m.morphTargetDictionary||{};for(const k in d)if(re.test(k))m.morphTargetInfluences[d[k]]=v}}function exp(names,v){if(!vrm?.expressionManager)return false;for(const n of names)try{vrm.expressionManager.setValue(n,v)}catch{}return true}function reset(){if(vrm?.expressionManager)for(const e of vrm.expressionManager.expressions||[]){try{vrm.expressionManager.setValue(e.name,0)}catch{}}for(const m of morphMeshes)if(m.morphTargetInfluences)m.morphTargetInfluences.fill(0);document.getElementById('mouth').value=0;document.getElementById('eyes').value=1;look('center');setStatus('臉部已重置。')}function blink(){if(!exp(['blink'],1))morph(/eyeBlink|EyeBlink|blink/i,1);setTimeout(()=>{if(!exp(['blink'],0))morph(/eyeBlink|EyeBlink|blink/i,0)},180)}function wink(s){const r=s==='left'?/eyeBlinkLeft|EyeBlinkLeft|blinkLeft/i:/eyeBlinkRight|EyeBlinkRight|blinkRight/i;if(!exp([s==='left'?'blinkLeft':'blinkRight'],1))morph(r,1);setTimeout(()=>{if(!exp([s==='left'?'blinkLeft':'blinkRight'],0))morph(r,0)},180)}const target=new THREE.Object3D();scene.add(target);function look(d){const p={center:[0,1.25,2],left:[-1.8,1.25,2],right:[1.8,1.25,2],up:[0,2.3,2],down:[0,.3,2]}[d]||[0,1.25,2];target.position.set(...p);if(vrm?.lookAt)vrm.lookAt.target=target;setStatus('視線：'+d)}function mouth(v){if(!exp(['aa','A','mouthOpen'],v))morph(/jawOpen|mouthOpen|viseme_aa|^A$/i,v)}function eyes(v){if(!exp(['blink'],1-v))morph(/eyeBlink|EyeBlink|blink/i,1-v)}function expression(n){reset();const a={happy:['happy','joy'],sad:['sad','sorrow'],angry:['angry'],surprised:['surprised'],relaxed:['relaxed','neutral']}[n]||[n];if(!exp(a,1))morph(n==='happy'?/smile|mouthSmile/i:n==='sad'?/sad|frown/i:n==='angry'?/angry|browDown/i:n==='surprised'?/jawOpen|surprise/i:/neutral/i,1);setStatus('表情：'+n)}window.DarkStarFace={reset,blink,wink,look,mouth,eyes,expression};document.getElementById('loadDefault').onclick=()=>load(DEFAULT_MODEL,'真人女性 · Asian F1');document.getElementById('file').onchange=e=>{const f=e.target.files?.[0];if(f)load(URL.createObjectURL(f),f.name)};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=clock.getDelta();if(vrm)vrm.update(dt);controls.update();renderer.render(scene,camera)}animate();load(DEFAULT_MODEL,'真人女性 · Asian F1');</script></body></html>
