<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIVAULT｜電子法律教材</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#100e0c;color:#f4ead6;font-family:-apple-system,"Noto Sans TC",sans-serif}button,input,textarea{font:inherit;color:inherit}body{overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#14110e}.txtbtn{height:36px;border:1px solid rgba(255,236,205,.12);background:#1c1814;border-radius:10px;padding:0 10px;color:#f4ead6;text-decoration:none;display:inline-flex;align-items:center}.spacer{flex:1}.layout{flex:1;min-height:0;display:grid;grid-template-columns:280px minmax(0,1fr) 320px}.side,.ask{background:#14110e;overflow:auto}.stagewrap{display:flex;flex-direction:column;min-width:0}.stage{flex:1;display:flex;align-items:center;justify-content:center}.book{display:flex;width:100%;height:100%}.sheet{flex:1;background:#f4ead6;color:#1b1612;position:relative;overflow:hidden}.sheet .inner{height:100%;overflow:auto;padding:24px}.nav{display:flex;gap:8px;justify-content:center;padding:8px}.coverwrap{margin:12px;aspect-ratio:3/4;max-height:160px;border:1px solid #7a6240;display:grid;place-items:center}.toc button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#efe4cf;padding:8px}@media(max-width:980px){.layout{grid-template-columns:1fr}.side,.ask{display:none}.side.open,.ask.open{display:block;position:fixed;inset:58px 0 0;z-index:30;background:#14110e}.sheet.left,.gutter{display:none}}
</style></head>
<body>
<div class="app">
<header class="top">
<div class="brand">電子教材</div>
<span id="connStatus"></span>
<div class="spacer"></div>
<button class="txtbtn" id="btnLib">選書</button>
<button class="txtbtn" id="btnToc">目錄</button>
<button class="txtbtn" id="btnAsk">詢問暗星</button>
<a class="txtbtn" href="dark-star-ebook-editor.html">匯入</a>
</header>
<div class="prog"><i id="progBar"></i></div>
<div class="layout">
<aside class="side" id="side"><div class="coverwrap" id="coverBox">封面空白</div><div class="meta" id="bookMeta"></div><div class="toc" id="tocList"></div></aside>
<main class="stagewrap"><div class="stage" id="stage">
<div class="empty" id="emptyState"><h1>選擇教材</h1><input id="ebookIdInput" placeholder="ebook_id"><button class="txtbtn" id="btnOpen">開啟</button><div id="localLib"></div></div>
<div class="book" id="bookView" hidden>
<article class="sheet left" id="pageLeft"><div class="inner" id="leftInner"></div><div class="pageno" id="leftNo"></div></article>
<div class="gutter"></div>
<article class="sheet" id="pageRight"><div class="inner" id="rightInner"></div><div class="pageno" id="rightNo"></div></article>
</div></div>
<div class="nav" id="readerNav" hidden>
<button class="txtbtn" id="prevBtn">上一頁</button>
<input id="jumpPage" type="number">
<span id="pageLabel"></span>
<button class="txtbtn" id="nextBtn">下一頁</button>
<button class="txtbtn" id="btnRead">朗讀本頁</button>
<button class="txtbtn" id="btnStopRead">停止</button>
</div></main>
<aside class="ask" id="ask"><h2>詢問暗星</h2><div class="qs">
<button type="button" data-q="這一頁在講什麼？">這一頁在講什麼？</button>
<button type="button" id="btnReadExplain">朗讀解說</button>
</div><div class="log" id="askLog"></div>
<form id="askForm"><textarea id="askInput"></textarea><button class="txtbtn" type="submit">詢問暗星</button></form></aside>
</div><div class="drawer-backdrop" id="backdrop"></div></div>
<script src="dark-star-ebook-a.js"></script>
<script src="dark-star-ebook-b.js"></script>
</body></html>
