<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#1b1612">
<title>AIVAULT｜電子法律教材＋暗星解說</title>
<style>
:root{--ink:#1b1612;--paper:#f4ead6;--paper-2:#efe2c6;--gold:#c4a36a;--gold-2:#8b6a33;--panel:#14110e;--line:rgba(255,236,205,.12);--src:#9ec3ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#100e0c;color:#f4ead6;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}body{overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#14110e;border-bottom:1px solid var(--line)}.mark{width:28px;height:28px;border-radius:8px;background:#f4ead6;color:#1b1612;display:grid;place-items:center;font-weight:800}.brand b{display:block;font-size:13px}.brand small{color:#cbbda3;font-size:11px}.spacer{flex:1}.txtbtn{height:36px;border:1px solid var(--line);background:#1c1814;border-radius:10px;padding:0 10px;color:#f4ead6;display:inline-flex;align-items:center;text-decoration:none}.layout{flex:1;min-height:0;display:grid;grid-template-columns:280px minmax(0,1fr) 360px}.side,.ask{background:var(--panel);min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}.ask{border-right:0;border-left:1px solid var(--line)}.side h2,.ask h2{margin:0;padding:12px 14px 8px;font-size:12px;color:var(--gold)}.meta{padding:0 14px 12px;color:#d8cbb4;font-size:13px}.coverwrap{margin:0 14px 12px;aspect-ratio:3/4;max-height:180px;border-radius:8px;border:1px solid #7a6240;display:grid;place-items:center;background:#2a2218}.toc{flex:1;overflow:auto;padding:0 8px 16px}.toc button{width:100%;text-align:left;border:0;background:transparent;color:#efe4cf;padding:8px}.stagewrap{min-width:0;display:flex;flex-direction:column;background:#161310}.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;touch-action:pan-y}.book{width:min(980px,100%);height:100%;display:flex}.sheet{flex:1;max-width:480px;background:var(--paper);color:#1b1612;overflow:hidden;position:relative}.sheet .inner{height:100%;overflow:auto;padding:28px 30px 42px;line-height:1.85}.sheet .pageno{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px}.gutter{width:18px;background:linear-gradient(90deg,#b89a68,#4a381c 50%,#b89a68)}.empty{max-width:560px;margin:auto;text-align:center}.nav{height:58px;display:flex;align-items:center;justify-content:center;gap:8px}.nav input{width:72px;height:36px;background:#1c1814;border:1px solid var(--line);border-radius:10px;text-align:center}.prog{height:4px;background:#2a241c}.prog>i{display:block;height:100%;width:0;background:#c4a36a}.ask .log{flex:1;overflow:auto;padding:8px 12px}.bubble{border-radius:12px;padding:10px;margin:8px 0;white-space:pre-wrap}.ask textarea{min-height:72px;width:100%;background:#1c1814;border:1px solid var(--line);border-radius:10px}.qs{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px}.qs button{border:1px solid var(--line);background:#1c1814;border-radius:999px;padding:6px 8px;font-size:12px}@media(max-width:980px){.layout{grid-template-columns:1fr}.side,.ask{display:none}.side.open,.ask.open{display:flex;position:fixed;inset:58px 0 0;z-index:30}.gutter,.sheet.left{display:none}.drawer-backdrop.show{display:block;position:fixed;inset:58px 0 0;background:rgba(0,0,0,.45);z-index:25}}
.drawer-backdrop{display:none}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="mark">星</div>
    <div class="brand"><b>電子法律教材</b><small>原文與暗星解說分離</small></div>
    <span id="connStatus">連線 ingest API</span>
    <div class="spacer"></div>
    <button class="txtbtn" id="btnLib">選書</button>
    <button class="txtbtn" id="btnToc">目錄</button>
    <button class="txtbtn" id="btnAsk">詢問暗星</button>
    <a class="txtbtn" href="dark-star-ebook-editor.html">教材匯入</a>
  </header>
  <div class="prog"><i id="progBar"></i></div>
  <div class="layout">
    <aside class="side" id="side">
      <h2>教材資訊</h2>
      <div class="coverwrap" id="coverBox">尚無封面</div>
      <div class="meta" id="bookMeta">尚未建立電子書</div>
      <h2>編／章／節／條</h2>
      <div class="toc" id="tocList"></div>
    </aside>
    <main class="stagewrap">
      <div class="stage" id="stage">
        <div class="empty" id="emptyState">
          <h1>選擇教材</h1>
          <p>輸入 ebook_id 或點本機書目</p>
          <p><input id="ebookIdInput" placeholder="ebook_id"></p>
          <button class="txtbtn" id="btnOpen">開啟教材</button>
          <div id="localLib"></div>
        </div>
        <div class="book" id="bookView" hidden>
          <article class="sheet left" id="pageLeft"><div class="inner" id="leftInner"></div><div class="pageno" id="leftNo"></div></article>
          <div class="gutter"></div>
          <article class="sheet" id="pageRight"><div class="inner" id="rightInner"></div><div class="pageno" id="rightNo"></div></article>
        </div>
      </div>
      <div class="nav" id="readerNav" hidden>
        <button class="txtbtn" id="prevBtn">上一頁</button>
        <input id="jumpPage" type="number">
        <span id="pageLabel"></span>
        <button class="txtbtn" id="nextBtn">下一頁</button>
        <button class="txtbtn" id="btnRead">暗星朗讀本頁</button>
        <button class="txtbtn" id="btnStopRead">停止朗讀</button>
      </div>
    </main>
    <aside class="ask" id="ask">
      <h2>詢問暗星</h2>
      <div class="qs">
        <button type="button" data-q="這一頁在講什麼？">這一頁在講什麼？</button>
        <button type="button" data-q="這一條是什麼意思？">這一條是什麼意思？</button>
        <button type="button" id="btnReadExplain">朗讀解說</button>
      </div>
      <div class="log" id="askLog"></div>
      <form id="askForm"><textarea id="askInput" placeholder="對目前頁提問"></textarea><button class="txtbtn" type="submit">詢問暗星</button></form>
    </aside>
  </div>
  <div class="drawer-backdrop" id="backdrop"></div>
</div>
<script src="dark-star-ebook.js"></script>
</body>
</html>
