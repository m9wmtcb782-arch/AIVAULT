<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />
  <title>AIVAULT — AI Agent 協作工作平台</title>
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png" />
  <meta name="apple-mobile-web-app-title" content="AIVAULT" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    :root {
      --bg: #0b1120; --card: #1e293b; --border: #334155; --text: #f1f5f9; --text-muted: #94a3b8;
      --primary: #3b82f6; --success: #22c55e; --warning: #f59e0b; --danger: #ef4444;
      --agent-gpt: #10b981; --agent-grok: #8b5cf6; --agent-coding: #06b6d4; --agent-research: #f97316;
      --agent-design: #ec4899; --agent-teacher: #84cc16; --agent-doctor: #14b8a6; --agent-lawyer: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; line-height: 1.5; }
    .header { position: sticky; top: 0; z-index: 100; background: rgba(15,23,42,.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg,#3b82f6,#8b5cf6); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; }
    .logo-text h1 { font-size: 18px; font-weight: 700; }
    .logo-text p { font-size: 11px; color: var(--text-muted); }
    .owner-badge { background: linear-gradient(135deg,#f59e0b,#d97706); color: #000; font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 20px; border: none; }
    .tabs { display: flex; gap: 4px; padding: 10px 12px; overflow-x: auto; border-bottom: 1px solid var(--border); background: #0f172a; }
    .tab { flex-shrink: 0; padding: 8px 14px; border-radius: 20px; font-size: 13px; background: transparent; color: var(--text-muted); border: none; cursor: pointer; }
    .tab.active { background: var(--primary); color: #fff; }
    .content { padding: 16px; padding-bottom: 80px; max-width: 640px; margin: 0 auto; }
    .section-title { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; }
    .agents-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 24px; }
    .agent-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
    .agent-avatar { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 8px; }
    .agent-name { font-size: 14px; font-weight: 600; }
    .agent-role { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
    .agent-status { display: flex; align-items: center; gap: 6px; font-size: 11px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; }
    .status-dot.working { background: var(--success); }
    .status-dot.thinking { background: var(--warning); }
    .status-dot.idle { background: #64748b; }
    .status-dot.offline { background: #475569; }
    .chat-container { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 24px; display: flex; flex-direction: column; height: 420px; }
    .chat-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 88%; display: flex; flex-direction: column; gap: 4px; }
    .msg.owner { align-self: flex-end; }
    .msg.agent { align-self: flex-start; }
    .msg-bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.45; }
    .msg.owner .msg-bubble { background: var(--primary); border-bottom-right-radius: 4px; }
    .msg.agent .msg-bubble { background: #334155; border-bottom-left-radius: 4px; }
    .msg-meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 6px; }
    .msg.owner .msg-meta { justify-content: flex-end; }
    .chat-input-area { border-top: 1px solid var(--border); padding: 10px 12px; display: flex; gap: 8px; }
    .chat-input { flex: 1; background: #0f172a; border: 1px solid var(--border); border-radius: 24px; padding: 10px 16px; color: var(--text); font-size: 14px; outline: none; }
    .send-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); border: none; color: #fff; font-size: 18px; }
    .send-btn:disabled { opacity: .4; }
    .panel { display: none; }
    .panel.active { display: block; }
    .demo-note { text-align: center; font-size: 12px; color: var(--text-muted); padding: 20px 16px; border-top: 1px solid var(--border); }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1e293b; border: 1px solid var(--border); color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 14px; z-index: 400; transition: .3s; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .typing { display: flex; gap: 4px; padding: 8px 0; }
    .typing span { width: 6px; height: 6px; background: #94a3b8; border-radius: 50%; animation: typing 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes typing { 0%,60%,100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <div class="logo-icon">AV</div>
      <div class="logo-text">
        <h1>AIVAULT</h1>
        <p>AI Agent 協作工作平台</p>
      </div>
    </div>
    <div class="owner-badge">OWNER</div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-panel="home">工作中心</button>
    <button class="tab" data-panel="chat">AI 協作</button>
  </nav>

  <main class="content">
    <div class="panel active" id="panel-home">
      <div class="section-title">在線 Agent</div>
      <div class="agents-grid" id="agentsGrid"></div>
      <div class="section-title">最新協作</div>
      <div class="chat-container" style="height:280px">
        <div class="chat-header"><span>AIVAULT 協作</span><span style="font-size:11px;color:var(--success)">● 真實 AI</span></div>
        <div class="chat-messages" id="homeChatPreview"></div>
      </div>
    </div>

    <div class="panel" id="panel-chat">
      <div class="section-title">多 Agent 協作聊天室</div>
      <div class="chat-container">
        <div class="chat-header"><span>真實 AI 協作</span><span style="font-size:11px;color:var(--success)">● Live</span></div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
          <input class="chat-input" id="chatInput" placeholder="以 Owner 身份輸入指令..." />
          <button class="send-btn" id="sendBtn">↑</button>
        </div>
      </div>
      <p style="font-size:12px;color:var(--text-muted);text-align:center;margin-top:8px">已接上真實 AI Gateway（Groq）</p>
    </div>
  </main>

  <div class="demo-note"><strong>AIVAULT v0.2</strong><br>真實 AI Gateway · Groq 已接入</div>
  <div class="toast" id="toast"></div>
