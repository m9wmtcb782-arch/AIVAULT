<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>AIVAULT Chat</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#fff;
  color:#111827;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Noto Sans TC",
    "PingFang TC",
    sans-serif;
}

button,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:#fff;
}

/* =========================
   HEADER
========================= */

.header{
  height:68px;
  flex:none;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 12px;

  border-bottom:1px solid #e5e7eb;
  background:#fff;

  z-index:20;
}

.head{
  display:flex;
  align-items:center;
  gap:5px;
}

.brand{
  font-size:21px;
  font-weight:750;
  letter-spacing:-.02em;
}

.icon-btn{
  width:50px;
  height:50px;

  border:0;
  background:transparent;

  border-radius:14px;

  display:grid;
  place-items:center;

  color:#111827;
}

.icon-btn:active,
.action:active,
.history-item:active,
.menu-item:active{
  background:#f1f5f9;
}

.icon{
  width:26px;
  height:26px;

  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* =========================
   CHAT
========================= */

.chat{
  flex:1;
  overflow-y:auto;

  padding:
    25px
    16px
    175px;
}

.inner{
  width:100%;
  max-width:850px;
  margin:auto;
}

.welcome{
  padding:40px 8px 25px;
}

.welcome h1{
  margin:0 0 12px;

  font-size:32px;
  line-height:1.3;
  font-weight:750;
  letter-spacing:-.03em;
}

.welcome p{
  margin:0;

  font-size:19px;
  line-height:1.7;

  color:#64748b;
}

.message{
  display:flex;
  width:100%;
  margin:24px 0;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:min(88%,760px);

  font-size:19px;
  line-height:1.75;

  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user .bubble{
  padding:13px 17px;

  background:#f1f5f9;

  border-radius:20px;
}

.ai .bubble{
  padding:4px 2px;
}

/* =========================
   TYPING
========================= */

.typing{
  display:flex;
  gap:5px;
  padding:10px 2px;
}

.dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#94a3b8;

  animation:blink 1s infinite;
}

.dot:nth-child(2){
  animation-delay:.15s;
}

.dot:nth-child(3){
  animation-delay:.3s;
}

@keyframes blink{
  0%,70%,100%{
    opacity:.3;
  }

  35%{
    opacity:1;
  }
}

/* =========================
   COMPOSER
========================= */

.composer-wrap{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  padding:
    10px
    12px
    calc(12px + env(safe-area-inset-bottom));

  background:
    linear-gradient(
      to top,
      #fff 72%,
      rgba(255,255,255,.94)
    );

  z-index:15;
}

.composer{
  width:100%;
  max-width:850px;

  min-height:68px;

  margin:auto;

  border:1.5px solid #cbd5e1;

  border-radius:23px;

  background:#fff;

  display:flex;
  align-items:flex-end;

  gap:6px;

  padding:9px 10px;

  box-shadow:
    0 4px 20px rgba(15,23,42,.08);
}

textarea{
  flex:1;

  min-height:46px;
  max-height:180px;

  border:0;
  outline:0;

  resize:none;

  padding:9px 4px;

  font-size:19px;
  line-height:1.5;

  color:#111827;
  background:transparent;
}

textarea::placeholder{
  color:#94a3b8;
}

.action{
  width:47px;
  height:47px;

  flex:none;

  border:0;

  background:transparent;

  border-radius:14px;

  display:grid;
  place-items:center;

  color:#475569;
}

.send{
  background:#111827;
  color:#fff;
}

.send:disabled{
  opacity:.45;
}

.recording{
  background:#111827 !important;
  color:#fff !important;
}

/* =========================
   DRAWER
========================= */

.overlay{
  position:fixed;
  inset:0;

  background:rgba(15,23,42,.35);

  opacity:0;

  pointer-events:none;

  transition:.2s;

  z-index:40;
}

.overlay.show{
  opacity:1;
  pointer-events:auto;
}

.drawer{
  position:fixed;

  left:0;
  top:0;
  bottom:0;

  width:min(88vw,370px);

  background:#fff;

  z-index:50;

  transform:translateX(-105%);

  transition:.25s;

  display:flex;
  flex-direction:column;

  box-shadow:
    10px 0 35px rgba(15,23,42,.15);
}

.drawer.open{
  transform:translateX(0);
}

.drawer-head{
  height:70px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 12px;

  border-bottom:1px solid #e5e7eb;
}

.drawer-title{
  font-size:22px;
  font-weight:750;
}

.new-chat{
  margin:14px;

  height:54px;

  border:1px solid #cbd5e1;

  border-radius:15px;

  background:#fff;

  display:flex;
  align-items:center;

  gap:12px;

  padding:0 16px;

  font-size:18px;
  font-weight:650;
}

.history{
  flex:1;
  overflow:auto;

  padding:0 10px;
}

.label{
  padding:12px 10px 7px;

  color:#64748b;

  font-size:15px;
  font-weight:650;
}

.history-item{
  min-height:56px;

  display:flex;
  align-items:center;

  gap:11px;

  padding:8px 10px;

  border-radius:12px;

  user-select:none;
}

.history-item span{
  flex:1;

  font-size:17px;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}

.drawer-bottom{
  border-top:1px solid #e5e7eb;

  padding:10px;
}

.drawer-row{
  min-height:52px;

  display:flex;
  align-items:center;

  gap:12px;

  padding:0 10px;

  border-radius:12px;

  font-size:17px;
}

/* =========================
   MORE MENU
========================= */

.more{
  position:fixed;

  top:66px;
  right:10px;

  width:min(88vw,320px);

  background:#fff;

  border:1px solid #e5e7eb;

  border-radius:17px;

  padding:7px;

  box-shadow:
    0 14px 40px rgba(15,23,42,.16);

  z-index:60;

  display:none;
}

.more.show{
  display:block;
}

.menu-item{
  min-height:53px;

  display:flex;
  align-items:center;

  gap:13px;

  padding:8px 12px;

  border-radius:12px;

  font-size:17px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;

  left:50%;
  bottom:110px;

  transform:translateX(-50%);

  background:#111827;
  color:#fff;

  padding:10px 15px;

  border-radius:12px;

  font-size:15px;

  z-index:100;

  display:none;

  max-width:90vw;

  text-align:center;
}

.toast.show{
  display:block;
}

/* =========================
   FILE CHIP
========================= */

.file-chip{
  display:inline-flex;

  align-items:center;

  gap:7px;

  padding:6px 9px;

  margin:3px 0;

  background:#f1f5f9;

  border-radius:9px;

  font-size:14px;

  color:#475569;
}

/* =========================
   MOBILE
========================= */

@media(max-width:480px){

  .header{
    height:64px;
  }

  .brand{
    font-size:20px;
  }

  .welcome h1{
    font-size:29px;
  }

  .bubble,
  textarea{
    font-size:18px;
  }

}

</style>
</head>

</div>

<!-- =========================

========================= -->

<aside

  <div class="drawer-head">

<script>

/* =========================================================
   AIVAULT CHAT
   ========================================================= */

const GATEWAY_URL =
  "https://clcddygkaaqqtsbswgdf.supabase.co/functions/v1/ai-gateway";

const STORAGE_KEY =
  "aivault_chat_history_v1";


/* =========================================================
   ELEMENTS
   ========================================================= */

const input =
  document.getElementById("input");

const chat =
  document.getElementById("chat");

const inner =
  document.getElementById("inner");

const historyList =
  document.getElementById("historyList");

const drawer =
  document.getElementById("drawer");

const overlay =
  document.getElementById("overlay");

const more =
  document.getElementById("more");

const sendBtn =
  document.getElementById("sendBtn");

const micBtn =
  document.getElementById("micBtn");

const fileInput =
  document.getElementById("fileInput");

const toastEl =
  document.getElementById("toast");


/* =========================================================
   STATE
   ========================================================= */

let chats =
  JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
  );

let currentId =
  null;

let currentMessages =
  [];

let busy =
  false;

let recognition =
  null;


/* =========================================================
   TOAST
   ========================================================= */

function toast(message){

  toastEl.textContent =
    message;

  toastEl.classList.add("show");

  clearTimeout(
    toast.timer
  );

  toast.timer =
    setTimeout(
      () =>
        toastEl.classList.remove("show"),
      2400
    );
}


/* =========================================================
   STORAGE
   ========================================================= */

function saveChats(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(chats)
  );

}


/* =========================================================
   SCROLL
   ========================================================= */

function scrollBottom(){

  requestAnimationFrame(
    () =>
      chat.scrollTop =
        chat.scrollHeight
  );

}


/* =========================================================
   ADD MESSAGE TO UI
   ========================================================= */

function addMessage(
  role,
  text
){

  document
    .getElementById("welcome")
    ?.remove();

  const row =
    document.createElement("div");

  row.className =
    "message " +
    (
      role === "user"
        ? "user"
        : "ai"
    );

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    text;

  row.appendChild(
    bubble
  );

  inner.appendChild(
    row
  );

  scrollBottom();

  return bubble;
}


/* =========================================================
   TYPING
   ========================================================= */

function showTyping(){

  document
    .getElementById("welcome")
    ?.remove();

  const row =
    document.createElement("div");

  row.id =
    "typing";

  row.className =
    "message ai";

  row.innerHTML = `
    <div class="typing">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  `;

  inner.appendChild(
    row
  );

  scrollBottom();

}


/* =========================================================
   RESET CHAT
   ========================================================= */

function resetChat(){

  currentId =
    null;

  currentMessages =
    [];

  inner.innerHTML = `
    <section
      class="welcome"
      id="welcome"
    >

      <h1>
        你好，我是 AIVAULT AI
      </h1>

      <p>
        有什麼事情需要我協助？
      </p>

    </section>
  `;

  input.value =
    "";

  input.style.height =
    "auto";

}


/* =========================================================
   ENSURE CURRENT CHAT
   ========================================================= */

function ensureCurrentChat(){

  if(currentId){

    const existing =
      chats.find(
        c =>
          c.id === currentId
      );

    if(existing){

      return existing;

    }

  }

  const chatItem = {

    id:
      Date.now().toString(),

    title:
      "新聊天",

    messages:
      []

  };

  chats.unshift(
    chatItem
  );

  currentId =
    chatItem.id;

  currentMessages =
    chatItem.messages;

  saveChats();

  renderHistory();

  return chatItem;

}


/* =========================================================
   SYNC CURRENT CHAT
   ========================================================= */

function syncCurrentChat(){

  const c =
    ensureCurrentChat();

  c.messages =
    currentMessages;

  const firstUserMessage =
    currentMessages.find(
      m =>
        m.role === "user"
    );

  if(
    firstUserMessage &&
    c.title === "新聊天"
  ){

    c.title =
      firstUserMessage.content
        .slice(0,30);

  }

  saveChats();

  renderHistory();

}


/* =========================================================
   HISTORY
   ========================================================= */

function renderHistory(){

  historyList.innerHTML =
    "";

  chats
    .slice(0,50)
    .forEach(
      c => {

        const row =
          document.createElement(
            "div"
          );

        row.className =
          "history-item";

        row.innerHTML = `
          <svg
            class="icon"
            viewBox="0 0 24 24"
          >

            <path d="M4 5h16v14H4z"/>
            <path d="M8 9h8"/>
            <path d="M8 13h6"/>

          </svg>

          <span></span>
        `;

        row
          .querySelector("span")
          .textContent =
            c.title ||
            "新聊天";


        let timer;


        row.addEventListener(
          "touchstart",
          () => {

            timer =
              setTimeout(
                () =>
                  deleteChat(c.id),
                700
              );

          },
          {
            passive:true
          }
        );


        [
          "touchend",
          "touchmove",
          "touchcancel"
        ]
        .forEach(
          eventName => {

            row.addEventListener(
              eventName,
              () =>
                clearTimeout(timer)
            );

          }
        );


        row.addEventListener(
          "contextmenu",
          event => {

            event.preventDefault();

            deleteChat(
              c.id
            );

          }
        );


        row.onclick =
          () =>
            loadChat(
              c.id
            );


        historyList.appendChild(
          row
        );

      }
    );

}


/* =========================================================
   DELETE CHAT
   ========================================================= */

function deleteChat(id){

  if(
    !confirm(
      "要刪除這個聊天嗎？"
    )
  ){

    return;

  }

  chats =
    chats.filter(
      c =>
        c.id !== id
    );

  if(
    currentId === id
  ){

    resetChat();

  }

  saveChats();

  renderHistory();

}


/* =========================================================
   LOAD CHAT
   ========================================================= */

function loadChat(id){

  const c =
    chats.find(
      x =>
        x.id === id
    );

  if(!c){

    return;

  }

  currentId =
    id;

  currentMessages =
    c.messages || [];

  inner.innerHTML =
    "";

  if(
    !currentMessages.length
  ){

    resetChat();

    currentId =
      id;

    currentMessages =
      c.messages || [];

  }
  else{

    currentMessages.forEach(
      m =>
        addMessage(
          m.role,
          m.content
        )
    );

  }

  drawer.classList.remove(
    "open"
  );

  overlay.classList.remove(
    "show"
  );

}


/* =========================================================
   GATEWAY RESPONSE EXTRACTION
   ========================================================= */

function extractGatewayText(
  data
){

  if(
    typeof data ===
    "string"
  ){

    return data;

  }


  const candidates = [

    data?.text,

    data?.response,

    data?.content,

    data?.answer,

    data?.output,

    data?.message?.content,

    data?.result?.text,

    data?.result?.response,

    data?.result?.content,

    data?.data?.text,

    data?.data?.response,

    data?.choices?.[0]
      ?.message
      ?.content,

    data?.choices?.[0]
      ?.text,

    data?.output_text

  ];


  return (
    candidates.find(
      value =>
        typeof value ===
        "string" &&
        value.trim()
    ) ||
    ""
  );

}


/* =========================================================
   REAL AIVAULT GATEWAY
   ========================================================= */

async function callGateway(
  messages
){

  const response =
    await fetch(
      GATEWAY_URL,
      {

        method:
          "POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            messages:
              messages
          })

      }
    );


  const raw =
    await response.text();


  let data;


  try{

    data =
      JSON.parse(
        raw
      );

  }
  catch{

    data =
      raw;

  }


  if(
    !response.ok
  ){

    const errorText =
      extractGatewayText(
        data
      );

    throw new Error(
      errorText ||
      `Gateway HTTP ${response.status}`
    );

  }


  const answer =
    extractGatewayText(
      data
    );


  if(!answer){

    throw new Error(
      "Gateway 已回應，但沒有取得 AI 文字內容。請檢查 ai-gateway 的回傳格式。"
    );

  }


  return answer;

}


/* =========================================================
   SEND MESSAGE
   ========================================================= */

async function sendMessage(){

  if(busy){

    return;

  }


  const text =
    input.value.trim();


  if(!text){

    return;

  }


  busy =
    true;

  sendBtn.disabled =
    true;


  ensureCurrentChat();


  currentMessages.push({

    role:
      "user",

    content:
      text

  });


  addMessage(
    "user",
    text
  );


  input.value =
    "";

  input.style.height =
    "auto";


  syncCurrentChat();


  showTyping();


  try{

    /*
     * 真正呼叫 AIVAULT AI Gateway
     */

    const answer =
      await callGateway(
        currentMessages
      );


    document
      .getElementById(
        "typing"
      )
      ?.remove();


    addMessage(
      "assistant",
      answer
    );


    currentMessages.push({

      role:
        "assistant",

      content:
        answer

    });


    syncCurrentChat();

  }
  catch(error){

    document
      .getElementById(
        "typing"
      )
      ?.remove();


    const errorMessage =
      "⚠️ " +
      (
        error?.message ||
        "AIVAULT AI 連線失敗"
      );


    addMessage(
      "assistant",
      errorMessage
    );


    currentMessages.push({

      role:
        "assistant",

      content:
        errorMessage

    });


    syncCurrentChat();

  }
  finally{

    busy =
      false;

    sendBtn.disabled =
      false;

    input.focus();

  }

}


/* =========================================================
   HEADER / DRAWER
   ========================================================= */

document
  .getElementById("menuBtn")
  .onclick =
    () => {

      drawer.classList.add(
        "open"
      );

      overlay.classList.add(
        "show"
      );

    };


document
  .getElementById("closeDrawer")
  .onclick =
    closeDrawer;


overlay.onclick =
  closeDrawer;


function closeDrawer(){

  drawer.classList.remove(
    "open"
  );

  overlay.classList.remove(
    "show"
  );

}


/* =========================================================
   NEW CHAT
   ========================================================= */

document
  .getElementById("newChat")
  .onclick =
    () => {

      resetChat();

      closeDrawer();

    };


/* =========================================================
   MORE MENU
   ========================================================= */

document
  .getElementById("moreBtn")
  .onclick =
    event => {

      event.stopPropagation();

      more.classList.toggle(
        "show"
      );

    };


document.addEventListener(
  "click",
  event => {

    if(
      !more.contains(
        event.target
      ) &&
      !document
        .getElementById(
          "moreBtn"
        )
        .contains(
          event.target
        )
    ){

      more.classList.remove(
        "show"
      );

    }

  }
);


/* =========================================================
   SEND BUTTON
   ========================================================= */

sendBtn.onclick =
  sendMessage;


/* =========================================================
   TEXTAREA
   ========================================================= */

input.addEventListener(
  "input",
  () => {

    input.style.height =
      "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        180
      ) + "px";

  }
);


input.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
        "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================================
   ATTACHMENT
   ========================================================= */

document
  .getElementById("attachBtn")
  .onclick =
    () =>
      fileInput.click();


fileInput.onchange =
  event => {

    const files =
      [
        ...event.target.files
      ];


    if(!files.length){

      return;

    }


    /*
     * 目前先建立附件狀態。
     *
     * 真正把 PDF / 圖片 / 文件內容
     * 送給 AI，需要 Gateway 支援
     * multipart / base64 / file URL
     * 等實際格式。
     */

    toast(
      `已選擇 ${files.length} 個檔案`
    );

  };


/* =========================================================
   SPEECH RECOGNITION
   ========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(
  SpeechRecognition
){

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "zh-TW";


  recognition.continuous =
    false;


  recognition.interimResults =
    true;


  recognition.onstart =
    () => {

      micBtn.classList.add(
        "recording"
      );

      toast(
        "正在聆聽……"
      );

    };


  recognition.onresult =
    event => {

      let text =
        "";


      for(
        let i =
          event.resultIndex;
        i <
          event.results.length;
        i++
      ){

        text +=
          event
            .results[i][0]
            .transcript;

      }


      input.value =
        text;


      input.dispatchEvent(
        new Event(
          "input"
        )
      );

    };


  recognition.onend =
    () => {

      micBtn.classList.remove(
        "recording"
      );

    };


  recognition.onerror =
    event => {

      micBtn.classList.remove(
        "recording"
      );

      toast(
        "語音輸入失敗：" +
        event.error
      );

    };


  micBtn.onclick =
    () => {

      try{

        recognition.start();

      }
      catch{

        /* 防止重複啟動 */
      }

    };

}
else{

  micBtn.onclick =
    () =>
      toast(
        "此瀏覽器不支援語音輸入"
      );

}


/* =========================================================
   MORE FUNCTIONS
   ========================================================= */

document
  .querySelectorAll(
    ".menu-item"
  )
  .forEach(
    item => {

      item.onclick =
        async () => {

          const action =
            item.dataset.action;


          more.classList.remove(
            "show"
          );


          /* SHARE */

          if(
            action ===
            "share"
          ){

            const text =
              currentMessages
                .map(
                  message =>
                    (
                      message.role ===
                      "user"
                        ? "你："
                        : "AI："
                    ) +
                    message.content
                )
                .join(
                  "\n\n"
                );


            if(
              navigator.share
            ){

              try{

                await navigator.share({

                  title:
                    "AIVAULT Chat",

                  text:
                    text

                });

              }
              catch{

                /* 使用者取消分享 */
              }

            }
            else{

              try{

                await navigator
                  .clipboard
                  .writeText(
                    text
                  );

                toast(
                  "對話已複製"
                );

              }
              catch{

                toast(
                  "無法複製對話"
                );

              }

            }

          }


          /* SEARCH */

          else if(
            action ===
            "search"
          ){

            const query =
              prompt(
                "搜尋目前對話"
              );


            if(!query){

              return;

            }


            const count =
              currentMessages.filter(
                message =>
                  message.content
                    .toLowerCase()
                    .includes(
                      query
                        .toLowerCase()
                    )
              ).length;


            toast(
              `${count} 則符合`
            );

          }


          /* FILES */

          else if(
            action ===
            "files"
          ){

            fileInput.click();

          }


          /* PIN */

          else if(
            action ===
            "pin"
          ){

            toast(
              "已釘選目前聊天"
            );

          }


          /* ARCHIVE */

          else if(
            action ===
            "archive"
          ){

            toast(
              "已封存目前聊天"
            );

          }


          /* PROJECT */

          else if(
            action ===
            "project"
          ){

            toast(
              "新增至專案入口已建立"
            );

          }


          /* IMAGE */

          else if(
            action ===
            "image"
          ){

            toast(
              "分享圖入口已建立"
            );

          }

        };

    }
  );


/* =========================================================
   INITIALIZE
   ========================================================= */

renderHistory();

</script>
