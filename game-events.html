<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>活動</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body class="game-body">
  <div class="snow-layer"></div>
  <div class="app" id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/boot.js"></script>
  <script>
    (async () => {
      if (!(await FKAuth.requirePlayer())) return;
      const hour = new Date().getHours();
      const events = [
        { t: "暴風雪", d: "建築升級時間 +10%，熔爐產量提升", on: hour % 6 < 2 },
        { t: "資源潮", d: "伐木與農場產量提升", on: hour % 5 === 0 },
        { t: "野獸侵襲", d: "世界地圖出現高戰力 AI", on: true }
      ];
      document.getElementById("app").innerHTML = `
        <div class="page-head"><a class="back" href="game-menu.html">← 返回</a><h2>世界活動</h2></div>
        <div class="panel">${events.map(e => `<div class="list-item"><div><b>${e.t}</b><div class="tiny">${e.d}</div></div><span class="badge">${e.on?"進行中":"待機"}</span></div>`).join("")}</div>
        ${FKUI.nav("more")}
      `;
    })();
  </script>
</body>
</html>
