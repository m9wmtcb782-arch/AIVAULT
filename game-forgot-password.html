<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>重設密碼</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body class="game-body">
  <div class="snow-layer"></div>
  <div class="app">
    <div class="page-head"><a class="back" href="game-login.html">← 返回</a><h2>忘記密碼</h2></div>
    <div class="panel glass">
      <label>Email</label><input id="email" type="email" />
      <div class="msg" id="msg"></div>
      <button class="btn" id="btn">寄送重設密碼信</button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/boot.js"></script>
  <script>
    qs("btn").onclick = () => guarded(async () => {
      await FKApi.resetPassword(qs("email").value.trim());
      qs("msg").className = "msg ok";
      qs("msg").textContent = "重設密碼信已寄出";
    });
  </script>
</body>
</html>
