<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AIVAULT 冰雪城 2.5D 穩定版</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#c9e4f4;font-family:-apple-system,sans-serif}canvas{width:100vw;height:100dvh;display:block;touch-action:none}#ui{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:12px;background:#18365ad9;color:white;border:1px solid #9acbf1;border-radius:12px;padding:10px 13px;font-size:12px;pointer-events:none}#ui b{font-size:16px}#ctrl{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 12px);left:50%;transform:translateX(-50%);display:flex;gap:8px}button{background:#244f79ed;color:white;border:1px solid #b4e1ff;border-radius:10px;padding:10px 13px;font-size:14px}</style></head><body><canvas id="city"></canvas><div id="ui"><b>❄ AIVAULT 冰雪協作城</b><div>2.5D 建築與居民｜純 Canvas 穩定展示</div><div>9 職業居民 · 2 AI 衛士 · 無霧</div><div>手指拖曳移動，按 + / − 縮放</div></div><div id="ctrl"><button id="minus">−</button><button id="reset">🏰 全景</button><button id="plus">＋</button></div><script>
const cv=document.getElementById('city'),ctx=cv.getContext('2d');let W=0,H=0,scale=1,panX=0,panY=0,t=0,drag=false,lastX=0,lastY=0;
function resize(){W=innerWidth;H=innerHeight;cv.width=Math.round(W*devicePixelRatio);cv.height=Math.round(H*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function iso(x,z,y=0){return [W*.5+(x-z)*15*scale+panX,H*.53+(x+z)*7.7*scale-y*13*scale+panY]}
function poly(pts,fill,stroke='#637f96',line=1){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke()}}
function p(x,z,y=0){return iso(x,z,y)}
function cube(x,z,w,d,h,color='#9b806c'){let a=p(x,z),b=p(x+w,z),c=p(x+w,z+d),e=p(x,z+d),A=p(x,z,h),B=p(x+w,z,h),C=p(x+w,z+d,h),E=p(x,z+d,h);poly([a,b,B,A],'#796354');poly([b,c,C,B],color);poly([A,B,C,E],'#b4a193');return {A,B,C,E}}
function roof(x,z,w,d,h,rise){let a=p(x-.35,z-.35,h),b=p(x+w+.35,z-.35,h),c=p(x+w+.35,z+d+.35,h),e=p(x-.35,z+d+.35,h),r1=p(x+w/2,z-.35,h+rise),r2=p(x+w/2,z+d+.35,h+rise);poly([a,r1,r2,e],'#f9fcff','#b6d6e6',1.2);poly([r1,b,c,r2],'#d5e8f4','#b6d6e6',1.2);poly([a,b,r1],'#eff8ff');poly([e,r2,c],'#e0f1fb')}
function line(a,b,color,width){ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.strokeStyle=color;ctx.lineWidth=width*scale;ctx.stroke()}
function glow(x,z,y){let q=p(x,z,y);ctx.shadowColor='#ffb94d';ctx.shadowBlur=12*scale;ctx.fillStyle='#ffda8b';ctx.fillRect(q[0]-3*scale,q[1]-5*scale,6*scale,9*scale);ctx.shadowBlur=0}
function house(x,z,k){let w=2.7+(k%3)*.3,d=2.5+(k%2)*.4,h=2.7+(k%4)*.25;cube(x,z,w,d,h,k%3===0?'#b2a394':'#a88a73');roof(x,z,w,d,h,1.75);glow(x+w*.65,z+d+.03,1.6);glow(x+w*.2,z+d+.03,1.6);let q=p(x+w*.46,z+d+.06,.9);ctx.fillStyle='#5a4134';ctx.fillRect(q[0]-3*scale,q[1]-8*scale,6*scale,11*scale);if(k%4===0){let q=p(x+w*.2,z+d*.3,h+1.5);poly([[q[0]-4*scale,q[1]+8*scale],[q[0]+4*scale,q[1]+8*scale],[q[0]+3*scale,q[1]-9*scale],[q[0]-3*scale,q[1]-9*scale]],'#857569')}}
function castle(){cube(-3.3,-3.3,6.6,6.6,7,'#a4b0bd');roof(-3.3,-3.3,6.6,6.6,7,4);for(let x of [-3.5,3.5])for(let z of [-3.5,3.5]){cube(x-.65,z-.65,1.3,1.3,9,'#a5b2be');let q=p(x,z,11);poly([[q[0]-12*scale,q[1]+10*scale],[q[0],q[1]-20*scale],[q[0]+12*scale,q[1]+10*scale]],'#eaf8ff')}for(let x of [-1.8,0,1.8])glow(x,3.35,4)}
function fir(x,z,h){let q=p(x,z);line(q,p(x,z,h),'#694c3e',3);for(let j=0;j<3;j++){let a=p(x,z,1+j*.8),top=p(x,z,h+j*.15);poly([[a[0]-12*scale+j*2,a[1]],[top[0],top[1]],[a[0]+12*scale-j*2,a[1]]],j%2?'#427968':'#3b675a','#d5e9ef',.5)}}
const roles=['學者','工程師','探索者','生活專家','分析師','藝術家','建築師','醫療師','貿易師'];const coats=['#486fba','#a55a54','#5c8366','#a477b2','#aa7b44','#7e6aaf','#5b8b9c','#e6e7e9','#b87854'];
function person(x,z,i,guard=false){let q=p(x,z),s=scale;ctx.fillStyle='#536d85';ctx.beginPath();ctx.ellipse(q[0],q[1]+2*s,8*s,3*s,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4a4851';ctx.fillRect(q[0]-4*s,q[1]-11*s,3*s,10*s);ctx.fillRect(q[0]+1*s,q[1]-11*s,3*s,10*s);ctx.fillStyle=guard?'#304a68':coats[i%coats.length];ctx.beginPath();ctx.ellipse(q[0],q[1]-18*s,8*s,12*s,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f0c8a4';ctx.beginPath();ctx.arc(q[0],q[1]-34*s,7*s,0,Math.PI*2);ctx.fill();ctx.fillStyle=guard?'#28374c':'#5a463e';ctx.beginPath();ctx.arc(q[0],q[1]-38*s,7.5*s,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(q[0]-5*s,q[1]-24*s,10*s,2*s);if(guard){ctx.fillStyle='#b7d3ee';ctx.fillRect(q[0]+5*s,q[1]-20*s,4*s,13*s)}}
const houses=[];for(let x=-14;x<=14;x+=4.8)for(let z=-14;z<=14;z+=4.8){if(Math.abs(x)<5&&Math.abs(z)<5)continue;if(Math.abs(x)<2||Math.abs(z)<2)continue;houses.push({x,z,k:houses.length})}
const trees=[];for(let i=0;i<38;i++){let x=Math.sin(i*12.3)*18,z=Math.cos(i*7.73)*18;if(Math.abs(x)<4||Math.abs(z)<4)continue;trees.push({x,z})}
const people=roles.map((r,i)=>({x:-11+(i%3)*11,z:6+Math.floor(i/3)*3,i}));let last=0;
function draw(ms){requestAnimationFrame(draw);const dt=Math.min((ms-last)/1000,.1);last=ms;t+=dt;let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#83b3d7');sky.addColorStop(1,'#e3f4ff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);poly([p(-21,-21),p(21,-21),p(21,21),p(-21,21)],'#e6f4fc',null);
for(let k=-17;k<=17;k+=.7){let a=p(k,-18),b=p(k,18);line(a,b,'#edf8ff',.3)}
for(let d of [-1.6,1.6]){poly([p(-18,d-.7),p(18,d-.7),p(18,d+.7),p(-18,d+.7)],'#bcd5e6',null);poly([p(d-.7,-18),p(d+.7,-18),p(d+.7,18),p(d-.7,18)],'#bcd5e6',null)}
const items=[...houses.map(o=>({...o,type:'house'})),...trees.map(o=>({...o,type:'tree'})),{x:0,z:0,type:'castle'},...people.map(o=>({...o,type:'person'})),{x:Math.sin(t*.35)*12,z:1.1,type:'guard',i:0},{x:1.1,z:Math.cos(t*.31)*12,type:'guard',i:1}];items.sort((a,b)=>(a.x+a.z)-(b.x+b.z));for(let o of items){if(o.type==='house')house(o.x,o.z,o.k);if(o.type==='tree')fir(o.x,o.z,3.5);if(o.type==='castle')castle();if(o.type==='person')person(o.x,o.z,o.i);if(o.type==='guard')person(o.x,o.z,o.i,true)}}
requestAnimationFrame(draw);
document.getElementById('plus').onclick=()=>scale=Math.min(2.5,scale*1.22);document.getElementById('minus').onclick=()=>scale=Math.max(.35,scale/1.22);document.getElementById('reset').onclick=()=>{scale=1;panX=panY=0};
cv.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;panX+=e.clientX-lastX;panY+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY});cv.addEventListener('pointerup',()=>drag=false);cv.addEventListener('pointercancel',()=>drag=false);
</script></body></html>
