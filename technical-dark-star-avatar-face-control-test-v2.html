<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AIVAULT｜Dark Star 3D Engine V2</title><style>html,body{margin:0;width:100%;height:100%;background:#080b10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}body{display:flex;flex-direction:column}.top{padding:14px;border-bottom:1px solid #26303d}.title{font-size:18px;font-weight:700}.status{margin-top:6px;font-size:14px;color:#ffd166}.stage{position:relative;flex:1;min-height:0}.log{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(5,8,12,.92);padding:12px;border-radius:12px;border:1px solid #303b49;max-height:45%;overflow:auto;font-size:13px;line-height:1.6}.ok{color:#72e6a2}.err{color:#ff7b8a}</style><script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script></head><body><div class="top"><div class="title">AIVAULT｜Technical Dark Star 3D Engine Proof V2</div><div id="status" class="status">① 頁面已啟動，等待 Three.js</div></div><div id="stage" class="stage"></div><div id="log" class="log"></div><script type="module">const status=document.getElementById('status'),log=document.getElementById('log');function say(t,c=''){log.innerHTML+=`<div class="${c}">${t}</div>`;log.scrollTop=log.scrollHeight}try{say('② 開始載入本地 Three.js…');const THREE=await import('three');say('③ Three.js 模組成功','ok');status.textContent='③ Three.js 成功';const {GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');say('④ GLTFLoader 模組成功','ok');status.textContent='④ GLTFLoader 成功';const stage=document.getElementById('stage');const scene=new THREE.Scene();scene.background=new THREE.Color(0x10151d);const camera=new THREE.PerspectiveCamera(35,stage.clientWidth/Math.max(1,stage.clientHeight),.01,1000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(stage.clientWidth,stage.clientHeight);stage.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x334455,2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(2,4,5);scene.add(light);renderer.render(scene,camera);say('⑤ Three.js GPU Renderer 成功','ok');status.textContent='⑤ GPU Renderer 成功';say('⑥ 開始解析 AIVAULT GLB…');const loader=new GLTFLoader();loader.load('./assets/dark-star/technical-dark-star-avatar.glb',g=>{scene.add(g.scene);const box=new THREE.Box3().setFromObject(g.scene);const size=box.getSize(new THREE.Vector3());const center=box.getCenter(new THREE.Vector3());g.scene.position.sub(center);const max=Math.max(size.x,size.y,size.z)||1;camera.position.set(0,max*.4,max*2.4);camera.lookAt(0,0,0);say('⑦ ✅ AIVAULT GLB 解析成功','ok');say('Mesh / SkinnedMesh / Bones / Morph Target 將在下一階段檢查','ok');status.textContent='⑦ GLB 成功';function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)}loop()},undefined,e=>{throw new Error('GLB 解析失敗：'+(e?.message||e))})}catch(e){status.textContent='❌ 發生錯誤';status.className='status err';say('錯誤：'+(e?.stack||e),'err')}</script></body></html>
