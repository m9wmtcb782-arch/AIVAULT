<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>曙光照片短視頻測試</title>
  <style>
    body { margin: 0; background: #10140f; color: #f4f1e8; font: 16px/1.45 -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif; }
    main { max-width: 720px; margin: auto; padding: 16px 14px 40px; }
    button, textarea, input { font: inherit; }
    button { border: 0; border-radius: 12px; padding: 10px 12px; background: #d7a441; color: #1b1408; }
    textarea, input { width: 100%; box-sizing: border-box; margin: 8px 0; }
    textarea { min-height: 80px; }
    img, video { max-width: 100%; border-radius: 12px; background: #000; }
    pre { white-space: pre-wrap; word-break: break-word; background: #0d110c; padding: 10px; border-radius: 10px; }
    .card { background: #1a2118; border: 1px solid #31402c; border-radius: 16px; padding: 14px; margin: 12px 0; }
  </style>
</head>
<body>
<main>
  <p><a href="technical-dark-star.html">回暗星</a></p>
  <h1>曙光照片 → 5 秒短視頻</h1>
  <p>Magic Hour image-to-video，model ltx-2.5，audio=true。不是前端動畫。</p>
  <section class="card">
    <input id="file" type="file" accept="image/jpeg,image/png">
    <img id="preview" alt="">
    <textarea id="prompt">夜晚街道，一個人站在雨中，鏡頭緩慢靠近。雨聲和遠處城市環境聲。</textarea>
    <button id="run" type="button">曙光生成 5 秒短視頻</button>
    <p id="job"></p>
    <video id="player" controls playsinline></video>
    <pre id="out">尚未生成</pre>
  </section>
</main>
<script>
  var SUPABASE = "https://clcddygkaaqqtsbswgdf.supabase.co";
  var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsY2RkeWdrYWFxcXRzYnN3Z2RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzUwNjQsImV4cCI6MjEwMjMxMTA2NH0.kYg6h7n74CtbiIjNjZ2xxJj16SV42INZVzQ9dLNUfKE";
  var fileInput = document.getElementById("file");
  fileInput.onchange = function () {
    var file = fileInput.files[0];
    if (!file) return;
    document.getElementById("preview").src = URL.createObjectURL(file);
  };
  function readFile(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result || "")); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  async function call(body) {
    var response = await fetch(SUPABASE + "/functions/v1/dawn-light-photo-video", {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: ANON, authorization: "Bearer " + ANON },
      body: JSON.stringify(body)
    });
    var data = await response.json();
    data.http = response.status;
    return data;
  }
  document.getElementById("run").onclick = async function () {
    var out = document.getElementById("out");
    var file = fileInput.files[0];
    if (!file) { out.textContent = "請先選 JPG 或 PNG"; return; }
    out.textContent = "上傳並建立 job…";
    var image = await readFile(file);
    var result = await call({ prompt: document.getElementById("prompt").value, image_base64: image });
    document.getElementById("job").textContent = result.job_id ? "job " + result.job_id : "";
    out.textContent = JSON.stringify(result, null, 2);
    var tries = 0;
    while (result.job_id && result.status !== "COMPLETE" && tries < 20) {
      await new Promise(function (resolve) { setTimeout(resolve, 8000); });
      result = await call({ id: result.job_id });
      out.textContent = JSON.stringify(result, null, 2);
      tries += 1;
    }
    if (result.video_url) {
      var player = document.getElementById("player");
      player.src = result.video_url;
      player.play().catch(function () {});
    }
  };
</script>
</body>
</html>
