<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AIVAULT — 教學助理</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#fff;color:#172033}.app{max-width:1600px;margin:auto;padding:14px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.btn{border:1px solid #d5dbe5;background:#fff;color:#172033;padding:9px 12px;border-radius:9px;cursor:pointer}.primary{background:#7567ff;color:#fff;border-color:#7567ff}.layout{display:grid;grid-template-columns:330px minmax(0,1fr) 300px;gap:12px}.panel{background:#fff;border:1px solid #dfe4ec;border-radius:13px;padding:13px}.panel+.panel{margin-top:10px}.voice-box{background:#f8fafc;border:1px solid #dfe4ec;border-radius:11px;padding:12px}.voice-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.mode-grid{display:grid;gap:6px}.mode-btn.active{border-color:#7567ff;box-shadow:0 0 0 1px #7567ff;background:#f4f2ff}.ppt-shell{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;min-height:720px}.thumbs{background:#f8fafc;border:1px solid #dfe4ec;border-radius:10px;padding:8px;overflow:auto;max-height:720px}.thumb{background:#fff;border:1px solid #d5dbe5;border-radius:7px;padding:5px;margin-bottom:7px;cursor:pointer;overflow:hidden}.thumb.active{border-color:#7567ff;box-shadow:0 0 0 1px #7567ff}.thumb canvas,.thumb>div{max-width:100%;overflow:hidden}.stage{background:#f8fafc;border:1px solid #dfe4ec;border-radius:10px;min-height:720px;display:flex;flex-direction:column;overflow:hidden}.stagebar{display:flex;justify-content:space-between;align-items:center;padding:9px;border-bottom:1px solid #dfe4ec;background:#fff}.slide-stage{flex:1;display:flex;justify-content:center;align-items:center;overflow:auto;padding:12px}.ppt-preview{width:100%;min-height:600px}.ppt-preview>*{max-width:100%!important;margin:auto}.video-zone{display:none}.video-zone.show{display:block}.video-zone iframe{width:100%;aspect-ratio:16/9;border:0}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:100}.modal.show{display:grid}.modal-card{background:#fff;padding:16px;border-radius:13px;width:min(760px,92%)}.class-mode{position:fixed!important;inset:0!important;z-index:5000;background:#000!important;padding:10px!important;max-width:none!important;border:0!important;border-radius:0!important}.class-mode .ppt-shell{height:100vh;min-height:0;grid-template-columns:170px minmax(0,1fr)}.class-mode .thumbs{max-height:none}.class-mode .stage{height:calc(100vh - 20px);min-height:0;background:#000}.class-mode .slide-stage{min-height:0}.class-mode .panel-title,.class-mode .video-zone,.class-mode .course{display:none!important}.class-mode .ppt-preview{height:100%;min-height:0;display:flex;align-items:center;justify-content:center}.class-mode .ppt-preview>*{max-height:100%!important;width:auto!important}@media(max-width:900px){.layout{grid-template-columns:1fr}.ppt-shell{grid-template-columns:90px 1fr;min-height:520px}.thumbs{max-height:520px}}</style></head><body><div class="app" id="app"><header class="topbar"><div><b style="font-size:20px">✦ AIVAULT — 教學助理</b><div style="font-size:12px;color:#667085">Technical Dark Star AI 教學助理／PPT／聲控</div></div></header><div class="layout"><aside><section class="panel"><b>🎤 暗星聲控</b><div class="voice-box"><div id="voiceState">正在準備聲控…</div><div id="transcript" style="margin-top:8px;min-height:42px">可說：下一頁、第 8 頁、開始上課、回主畫面、恢復聲控</div><div class="voice-actions"><button class="btn primary" id="voiceStart">🎤 開始聽</button><button class="btn" id="voiceStop">取消聲控</button></div></div></section><section class="panel"><b>💬 暗星回答模式</b><div class="mode-grid" style="margin-top:8px"><button class="btn mode-btn" data-mode="voice">🔊 語音</button><button class="btn mode-btn" data-mode="text">💬 字幕</button><button class="btn mode-btn active" data-mode="both">🔊💬 語音＋字幕</button></div><div id="answerModeStatus" style="margin-top:8px;font-size:12px;color:#667085">目前：語音＋字幕</div></section><section class="panel"><b>📊 PPT 教材</b><input id="pptFile" type="file" accept=".pptx" style="display:block;margin-top:10px"><div style="display:flex;gap:6px;margin-top:8px"><button class="btn primary" id="savePpt">儲存 PPT</button><button class="btn" id="clearPpt">清除目前</button></div><div id="pptFiles" style="margin-top:8px"></div></section><section class="panel"><b>🌐 真實網站搜尋</b><input id="searchInput" placeholder="例如：民法第184條" style="width:100%;margin-top:8px;padding:9px;box-sizing:border-box"><button class="btn primary" id="searchBtn" style="margin-top:7px">搜尋</button></section><section class="panel"><b>🎬 影片區</b><input id="youtubeUrl" placeholder="YouTube 網址" style="width:100%;margin-top:8px;padding:9px;box-sizing:border-box"><div style="margin-top:7px"><button class="btn" id="openVideo">開啟影片區</button><button class="btn" id="closeVideo">關閉</button></div></section></aside><main class="panel" id="teachingPanel"><div class="panel-title">📽️ 授課主畫面｜PPT</div><div class="ppt-shell"><div class="thumbs" id="thumbs"><div style="color:#667085;font-size:12px">上傳 PPT 後顯示每頁縮圖</div></div><div class="stage"><div class="stagebar"><div><button class="btn" id="prev">← 上一頁</button><button class="btn primary" id="next">下一頁 →</button></div><div id="pageInfo" style="font-size:12px;color:#667085">尚未載入 PPT</div><div><button class="btn primary" id="startClass">▶ 開始上課</button><button class="btn" id="exitClass" style="display:none">↩ 回主畫面</button></div></div><div class="slide-stage"><div id="pptPreview" class="ppt-preview"><div style="min-height:500px;display:grid;place-items:center;color:#667085">請上傳 PPT</div></div></div></div></div><div class="video-zone panel" id="videoZone"><b>🎬 影片區</b><div id="videoFrame" style="margin-top:8px"></div></div></main><aside><section class="panel"><b>🧭 聲控指令</b><p>下一頁</p><p>上一頁</p><p>第 8 頁</p><p>開始上課</p><p>回主畫面</p><p>取消聲控</p><p>恢復聲控</p></section></aside></div></div><div id="answerBox" style="position:fixed;left:12px;bottom:12px;max-width:420px;background:#fff;border:1px solid #dfe4ec;border-radius:10px;padding:10px;display:none;z-index:6000"></div><script type="module">import {init} from 'https://esm.sh/pptx-preview@1.0.7';window.pptxPreviewInit=init;window.dispatchEvent(new Event('pptx-ready'));</script><script>const SUPABASE_URL='https://clcddygkaaqqtsbswgdf.supabase.co',GATEWAY=SUPABASE_URL+'/functions/v1/ai-gateway';let currentPpt=null,currentSlides=[],currentIndex=0,recognition=null,voiceEnabled=true,answerMode='both',classMode=false;const $=id=>document.getElementById(id);function answer(t){if(answerMode==='text'||answerMode==='both'){$('answerBox').textContent=t;$('answerBox').style.display='block'}if(answerMode==='voice'||answerMode==='both')try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}catch{}}function setMode(m){answerMode=m;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));$('answerModeStatus').textContent='目前：'+({voice:'語音',text:'字幕',both:'語音＋字幕'}[m])}document.querySelectorAll('.mode-btn').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));function updatePage(){if(!currentSlides.length){$('pageInfo').textContent='尚未載入 PPT';return}$('pageInfo').textContent='第 '+(currentIndex+1)+' / '+currentSlides.length+' 頁';document.querySelectorAll('.thumb').forEach((e,i)=>e.classList.toggle('active',i===currentIndex));currentSlides.forEach((s,i)=>s.style.display=i===currentIndex?'':'none')}function nextSlide(){if(currentSlides.length){currentIndex=Math.min(currentIndex+1,currentSlides.length-1);updatePage();answer('下一頁。')}}function prevSlide(){if(currentSlides.length){currentIndex=Math.max(currentIndex-1,0);updatePage();answer('上一頁。')}}function gotoSlide(n){if(currentSlides.length){currentIndex=Math.max(0,Math.min(n,currentSlides.length-1));updatePage();answer('已跳到第 '+(currentIndex+1)+' 頁。')}}$('next').onclick=nextSlide;$('prev').onclick=prevSlide;async function loadPpt(file){currentPpt=file;currentSlides=[];currentIndex=0;$('pptPreview').innerHTML='';$('thumbs').innerHTML='';try{if(!window.pptxPreviewInit){await new Promise(r=>window.addEventListener('pptx-ready',r,{once:true}))}const root=$('pptPreview');const res=await window.pptxPreviewInit(root,{width:1280,height:720,mode:'contain'});await res.preview(await file.arrayBuffer());const nodes=[...root.children].filter(x=>x.nodeType===1);if(!nodes.length)throw Error('PPT 沒有產生投影片');currentSlides=nodes;nodes.forEach((node,i)=>{node.style.display=i===0?'':'none';const t=document.createElement('div');t.className='thumb';t.innerHTML='<div style="font-size:10px;color:#667085;margin-bottom:4px">第 '+(i+1)+' 頁</div>';const clone=node.cloneNode(true);clone.style.width='100%';clone.style.height='auto';clone.style.pointerEvents='none';t.appendChild(clone);t.onclick=()=>gotoSlide(i);$('thumbs').appendChild(t)});updatePage();answer('PPT 已載入，共 '+currentSlides.length+' 頁。')}catch(e){$('pptPreview').innerHTML='<div style="padding:30px;color:#b42318">PPT 預覽失敗：'+e.message+'</div>';$('thumbs').innerHTML='<div style="color:#b42318;font-size:12px">無法建立縮圖</div>'}}$('pptFile').onchange=e=>{const f=e.target.files?.[0];if(f)loadPpt(f)};function enterClassMode(){if(!currentSlides.length){answer('請先上傳 PPT。');return}classMode=true;$('teachingPanel').classList.add('class-mode');$('startClass').style.display='none';$('exitClass').style.display='inline-block';document.body.style.overflow='hidden';try{$('teachingPanel').requestFullscreen?.()}catch{}updatePage();answer('開始上課。PPT 已進入全螢幕教學模式。')}function exitClassMode(){classMode=false;$('teachingPanel').classList.remove('class-mode');$('startClass').style.display='inline-block';$('exitClass').style.display='none';document.body.style.overflow='';try{if(document.fullscreenElement)document.exitFullscreen()}catch{}answer('已回到主畫面。')}$('startClass').onclick=enterClassMode;$('exitClass').onclick=exitClassMode;function showVideo(){const u=$('youtubeUrl').value.trim(),m=u.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/)([A-Za-z0-9_-]{11})/);if(!m){answer('請先輸入有效的 YouTube 網址。');return}$('videoFrame').innerHTML='<iframe src="https://www.youtube.com/embed/'+m[1]+'" allowfullscreen></iframe>';$('videoZone').classList.add('show')}function closeVideo(){$('videoZone').classList.remove('show');$('videoFrame').innerHTML=''}$('openVideo').onclick=showVideo;$('closeVideo').onclick=closeVideo;function openSearch(q){if(!q)return;window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank','noopener')}$('searchBtn').onclick=()=>openSearch($('searchInput').value.trim());let db=null;try{const r=indexedDB.open('aivault-teaching-assistant',1);r.onupgradeneeded=e=>e.target.result.createObjectStore('ppt',{keyPath:'id'});r.onsuccess=e=>db=e.target.result}catch{}$('savePpt').onclick=()=>{if(!db||!currentPpt){answer('請先上傳 PPT。');return}const tx=db.transaction('ppt','readwrite');tx.objectStore('ppt').put({id:crypto.randomUUID(),name:currentPpt.name,type:currentPpt.type,blob:currentPpt});tx.oncomplete=()=>answer('PPT 已儲存。')};$('clearPpt').onclick=()=>{currentPpt=null;currentSlides=[];currentIndex=0;$('pptPreview').innerHTML='<div style="min-height:500px;display:grid;place-items:center;color:#667085">請上傳 PPT</div>';$('thumbs').innerHTML='<div style="color:#667085;font-size:12px">上傳 PPT 後顯示每頁縮圖</div>';updatePage()};function norm(t){return t.replace(/[，。！？、,.!?\s]/g,'').trim()}function command(text){const t=norm(text);if(!voiceEnabled){if(/恢復聲控|開啟聲控|啟動聲控/.test(t)){voiceEnabled=true;$('voiceState').textContent='🎤 聲控已啟動';answer('聲控已恢復')}return}if(/取消聲控|停止聲控|關閉聲控/.test(t)){voiceEnabled=false;try{recognition?.stop();speechSynthesis.cancel()}catch{}$('voiceState').textContent='🤫 靜默待機';$('transcript').textContent='靜默待機，只接受「恢復聲控」。';return}if(/下一頁|下一張/.test(t))return nextSlide();if(/上一頁|上一張/.test(t))return prevSlide();const m=t.match(/第(\d+)頁/);if(m)return gotoSlide(+m[1]-1);if(/開始上課|開始授課/.test(t))return enterClassMode();if(/回主畫面|退出教學/.test(t))return exitClassMode();if(/開啟影片區|打開影片區/.test(t))return showVideo();if(/關閉影片區|關掉影片區/.test(t))return closeVideo();if(/語音加字幕|語音字幕|兩者/.test(t))return setMode('both');if(/只顯示字幕|字幕回答|不要出聲/.test(t))return setMode('text');if(/語音回答/.test(t))return setMode('voice');if(/找|搜尋|搜索/.test(t)){const q=t.replace(/^(幫我)?(找|搜尋|搜索)/,'');if(q)return openSearch(q)}}function setupVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('voiceState').textContent='此瀏覽器不支援語音辨識';voiceEnabled=false;return}recognition=new SR();recognition.lang='zh-TW';recognition.continuous=false;recognition.interimResults=true;recognition.onstart=()=>{$('voiceState').textContent='🎤 正在聽';};recognition.onresult=e=>{let f='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)f+=e.results[i][0].transcript;if(f){$('transcript').textContent=f;command(f)}};recognition.onerror=()=>{};recognition.onend=()=>{if(voiceEnabled)setTimeout(()=>{try{recognition.start()}catch{}},300)};$('voiceStart').onclick=()=>{voiceEnabled=true;try{recognition.start()}catch{}};$('voiceStop').onclick=()=>command('取消聲控');try{recognition.start()}catch{}}setupVoice();</script></body></html>
