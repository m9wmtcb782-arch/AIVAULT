<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT — 教學助理</title><style>body{margin:0;background:#fff;color:#172033;font:15px sans-serif}.app{padding:12px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:260px 1fr;gap:10px}.p{border:1px solid #dfe4ec;border-radius:10px;padding:10px;margin-bottom:10px;background:#fff}.b{padding:8px 10px;border:1px solid #d5dbe5;border-radius:8px;background:#fff;cursor:pointer}.primary{background:#7567ff;color:#fff}.ppt{display:grid;grid-template-columns:130px 1fr;gap:8px;height:700px}.thumbs{overflow:auto;background:#f8fafc;padding:6px}.thumb{height:110px;background:#fff;border:1px solid #ddd;margin-bottom:6px;padding:4px;cursor:pointer}.thumb.active{border-color:#7567ff}.tp{height:78px;overflow:hidden}.stage{display:flex;flex-direction:column;border:1px solid #ddd;min-width:0}.bar{display:flex;justify-content:space-between;align-items:center;padding:7px;border-bottom:1px solid #ddd}.view{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto}.class{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:9000;background:#000!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;max-width:none!important}.class>b{display:none!important}.class .ppt{height:100vh;width:100vw;padding:0;display:block}.class .thumbs{display:none!important}.class .stage{height:100vh;width:100vw;border:0;border-radius:0;background:#000}.class .bar{position:absolute;left:0;right:0;top:0;z-index:20;background:rgba(0,0,0,.72);color:#fff;border:0}.class .bar .b{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)}.class .bar .primary{background:#7567ff;border-color:#7567ff}.class .view{height:100vh;min-height:0;padding:0;background:#000}.class .view>*{max-width:100vw!important;max-height:100vh!important}.research{position:fixed;right:18px;bottom:18px;width:min(520px,72vw);height:min(430px,62vh);background:#fff;border:2px solid #7567ff;border-radius:14px;box-shadow:0 10px 35px #0003;z-index:9500;display:none;overflow:hidden}.research.on{display:block}.research.big{left:2vw;right:2vw;top:7vh;bottom:7vh;width:auto;height:auto}.research .rh{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#7567ff;color:#fff}.research .rb{height:calc(100% - 42px);overflow:auto}.research iframe{width:100%;height:100%;border:0}.research .fallback{padding:14px;line-height:1.6}.ppt.focusPpt{position:fixed;inset:0;width:100vw;height:100vh;z-index:9400;background:#000;padding:0;display:block}.ppt.focusPpt .thumbs{display:none}.ppt.focusPpt .stage{height:100vh;width:100vw;border:0}.ppt.focusPpt .view{height:100vh}.ans{position:fixed;bottom:10px;left:10px;background:#fff;border:1px solid #ddd;padding:8px;display:none;z-index:9999}@media(max-width:800px){.grid{grid-template-columns:1fr}.ppt{grid-template-columns:80px 1fr}.research{right:8px;bottom:8px;width:82vw;height:48vh}}</style></head><body><div class="app" id="app"><h2>✦ AIVAULT — 教學助理</h2><div>Technical Dark Star AI 教學助理／PPT／聲控</div><div class="grid"><aside><section class="p"><b>🎤 暗星聲控</b><div id="vs">正在準備聲控…</div><div id="tr">等待老師說話…</div><button class="b primary" id="voiceStart">開始聽</button><button class="b" id="voiceStop">取消聲控</button></section><section class="p"><b>💬 回答模式</b><button class="b mode" data-m="voice">🔊 語音</button><button class="b mode" data-m="text">💬 字幕</button><button class="b mode active" data-m="both">🔊💬 語音＋字幕</button></section><section class="p"><b>📊 PPT</b><input id="file" type="file" accept=".pptx"><button class="b" id="save">儲存</button><button class="b" id="clear">清除</button></section><section class="p"><b>🌐 網路研究</b><input id="q" placeholder="民法第184條／比例原則案例"><button class="b primary" id="search">搜尋</button></section><section class="p"><b>🎬 影片</b><input id="yu" placeholder="YouTube 網址"><button class="b" id="openV">開啟影片區</button><button class="b" id="closeV">關閉</button><div id="video"></div></section></aside><main class="p" id="panel"><b>📽️ PPT 授課主畫面</b><div class="ppt" id="ppt"><div class="thumbs" id="thumbs">上傳 PPT 後顯示縮圖</div><div class="stage"><div class="bar"><div><button class="b" id="prev">←</button><button class="b primary" id="next">→</button><button class="b" id="goto">指定頁</button></div><span id="info">尚未載入</span><div><button class="b primary" id="start">▶ 開始上課</button><button class="b" id="exit" style="display:none">↩ 回主畫面</button></div></div><div class="view" id="view">請上傳 PPT</div></div></div></main></div></div><div id="research" class="research"><div class="rh"><b id="rtitle">🌐 網路研究</b><div><button class="b" id="rPpt">看 PPT</button><button class="b" id="rBig">放大</button><button class="b" id="rClose">關閉</button></div></div><div class="rb" id="rbody"></div></div><div id="ans" class="ans"></div><script>const $=x=>document.getElementById(x);let viewer=null,count=0,index=0,voice=true,rec=null,mode='both',classMode=false,researchOpen=false,researchBig=false,researchKind='';function say(t){if(mode!='voice'){$('ans').textContent=t;$('ans').style.display='block'}else $('ans').style.display='none';if(mode!='text')try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}catch{}}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x.dataset.m===mode))});function update(){$('info').textContent=count?'第 '+(index+1)+' / '+count+' 頁':'尚未載入';document.querySelectorAll('.thumb').forEach((x,k)=>x.classList.toggle('active',k===index))}async function go(k){if(!count)return;index=Math.max(0,Math.min(count-1,k));try{await viewer.renderSlide(index)}catch(e){}update()}async function loadPpt(f){$('view').textContent='正在解析 PPT…';$('thumbs').textContent='正在建立縮圖…';try{const m=await import('https://esm.sh/@aiden0z/pptx-renderer@1.2.4');viewer=await m.PptxViewer.open(await f.arrayBuffer(),$('view'),{renderMode:'slide',fitMode:'contain'});count=viewer.slideCount||0;if(!count)throw Error('沒有投影片');$('thumbs').innerHTML='';for(let k=0;k<count;k++){const t=document.createElement('div');t.className='thumb';t.innerHTML='<div>第 '+(k+1)+' 頁</div>';const box=document.createElement('div');box.className='tp';t.appendChild(box);t.onclick=()=>go(k);$('thumbs').appendChild(t);try{const h=viewer.renderThumbnailToContainer(k,box,{width:105});if(h?.ready)await h.ready}catch{}}index=0;await go(0);say('PPT 已載入，共 '+count+' 頁。')}catch(e){$('view').textContent='PPT 預覽失敗：'+e.message;say('PPT 預覽失敗。')}}$('file').onchange=e=>e.target.files[0]&&loadPpt(e.target.files[0]);$('next').onclick=()=>{go(index+1);say('下一頁。')};$('prev').onclick=()=>{go(index-1);say('上一頁。')};$('goto').onclick=()=>{const n=prompt('請輸入頁碼',index+1);if(n)go(Number(n)-1)};async function enter(){if(!count)return say('請先上傳 PPT。');classMode=true;$('panel').classList.add('class');$('ppt').classList.add('focusPpt');$('start').style.display='none';$('exit').style.display='inline-block';document.body.style.overflow='hidden';await go(index);try{await $('panel').requestFullscreen()}catch{}say('開始上課。PPT 已進入全螢幕教學模式。')}async function exit(){classMode=false;$('panel').classList.remove('class');$('ppt').classList.remove('focusPpt');$('start').style.display='inline-block';$('exit').style.display='none';document.body.style.overflow='';hideResearch();try{if(document.fullscreenElement)await document.exitFullscreen()}catch{}say('已回到主畫面。')}function showResearch(q){researchOpen=true;researchBig=false;researchKind=/民法|刑法|憲法|行政法|商法|勞動法|法條|條文|法律/.test(q)?'law':/案例|判決|裁判|比例原則|判例/.test(q)?'case':'web';$('research').classList.add('on');$('research').classList.remove('big');$('rtitle').textContent=researchKind==='law'?'⚖️ 法條原文／網路研究':researchKind==='case'?'⚖️ 案例／判決研究':'🌐 網路研究';const official=researchKind==='law'?'https://www.google.com/search?q='+encodeURIComponent('site:mojlaw.moj.gov.tw '+q):researchKind==='case'?'https://www.google.com/search?q='+encodeURIComponent('site:judgment.judicial.gov.tw '+q):'https://www.google.com/search?q='+encodeURIComponent(q);$('rbody').innerHTML='<iframe src="'+official+'" title="網路搜尋"></iframe><div class="fallback">若手機瀏覽器拒絕在子畫面嵌入搜尋頁，請按下方按鈕在新視窗查看官方資料。<br><br><button class="b primary" onclick="window.open(\''+official+'\',\'_blank\')">開啟網路搜尋</button></div>';$('q').value=q;researchBig=false;syncResearch();say(researchKind==='law'?'已依法律資料需求開啟網路法條研究畫面。':researchKind==='case'?'已開啟案例與判決研究畫面。':'已開啟網路研究畫面。')}function syncResearch(){if(researchOpen){$('research').classList.add('on');$('research').classList.toggle('big',researchBig)}else $('research').classList.remove('on')}function hideResearch(){researchOpen=false;researchBig=false;syncResearch()}$('rClose').onclick=hideResearch;$('rBig').onclick=()=>{researchBig=!researchBig;syncResearch();say(researchBig?'已放大研究畫面。':'已縮小研究畫面。')};$('rPpt').onclick=()=>{hideResearch();say('已切回 PPT。')};$('start').onclick=enter;$('exit').onclick=exit;document.onkeydown=e=>{if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1);if(e.key==='Escape'&&classMode)exit()};$('search').onclick=()=>{const q=$('q').value.trim();if(q)showResearch(q)};function yid(u){try{const x=new URL(u);return x.searchParams.get('v')||x.pathname.split('/').pop()}catch{return''}}$('openV').onclick=()=>{const id=yid($('yu').value.trim());if(!id)return say('請輸入 YouTube 網址。');$('video').innerHTML='<iframe style="width:100%;aspect-ratio:16/9" src="https://www.youtube.com/embed/'+encodeURIComponent(id)+'" allowfullscreen></iframe>';say('影片區已開啟。')};$('closeV').onclick=()=>{$('video').innerHTML='';say('影片區已關閉。')};let db;try{const r=indexedDB.open('aivault-teaching-assistant',1);r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('ppt'))e.target.result.createObjectStore('ppt',{keyPath:'id'})};r.onsuccess=e=>db=e.target.result}catch{}$('save').onclick=()=>{const f=$('file').files[0];if(!f||!db)return say('請先選擇 PPT。');const t=db.transaction('ppt','readwrite');t.objectStore('ppt').put({id:crypto.randomUUID(),name:f.name,type:f.type,blob:f});t.oncomplete=()=>say('PPT 已儲存。')};$('clear').onclick=()=>{viewer=null;count=0;index=0;$('view').textContent='請上傳 PPT';$('thumbs').textContent='上傳 PPT 後顯示縮圖';update()};function cmd(t){t=t.replace(/[，。！？、,.!?\s]/g,'');$('tr').textContent=t;if(!voice){if(/恢復聲控|開啟聲控|啟動聲控/.test(t)){voice=true;start()}return}if(/取消聲控|停止聲控|關閉聲控/.test(t)){voice=false;try{rec.stop()}catch{}speechSynthesis.cancel();return}if(/下一頁|下一張/.test(t))return $('next').click();if(/上一頁|上一張/.test(t))return $('prev').click();const m=t.match(/第(\d+)頁/);if(m)return go(+m[1]-1);if(/開始上課|開始授課/.test(t))return enter();if(/回主畫面|退出教學/.test(t))return exit();if(/開啟影片區/.test(t))return $('openV').click();if(/關閉影片區/.test(t))return $('closeV').click();if(/看PPT|看投影片|回PPT/.test(t)){hideResearch();return}if(/看法條|看條文|看案例|看判決|放大法條|放大案例|放大研究畫面/.test(t)){if(!researchOpen){const q=$('q').value.trim()||researchKind||'法律資料';showResearch(q)}researchBig=true;syncResearch();return say('已把研究資料放大。')}if(/縮小法條|縮小案例|縮小研究/.test(t)){researchBig=false;syncResearch();return say('已縮小研究畫面，回到子畫面。')}if(/兩個一起|一起看|PPT和法條|PPT與法條|PPT跟法條/.test(t)){researchBig=false;syncResearch();return say('PPT 與研究資料維持子母畫面。')}if(/關閉法條|關閉案例|關閉研究/.test(t)){hideResearch();return}if(/語音加字幕|語音字幕/.test(t)){mode='both';return}if(/只顯示字幕|字幕回答/.test(t)){mode='text';return}if(/語音回答/.test(t)){mode='voice';return}if(/搜尋|搜索|找/.test(t)){const q=t.replace(/^(幫我)?(搜尋|搜索|找)/,'');if(q)return showResearch(q)}}function start(){if(!rec||!voice)return;try{rec.start()}catch{}}function setup(){const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S){voice=false;$('vs').textContent='此瀏覽器不支援語音辨識';return}rec=new S();rec.lang='zh-TW';rec.continuous=false;rec.interimResults=true;rec.onresult=e=>{let t='';for(let k=e.resultIndex;k<e.results.length;k++)if(e.results[k].isFinal)t+=e.results[k][0].transcript;if(t)cmd(t)};rec.onend=()=>voice&&setTimeout(start,300);$('voiceStart').onclick=()=>{voice=true;$('vs').textContent='聲控啟用';start()};$('voiceStop').onclick=()=>{voice=false;$('vs').textContent='聲控已取消（靜默待機）';try{rec.stop()}catch{}speechSynthesis.cancel()};start()}setup()</script></body></html>
