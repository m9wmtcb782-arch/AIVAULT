<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIVAULT — 教學助理</title>
<style>
body{margin:0;background:#fff;color:#172033;font:15px sans-serif}*{box-sizing:border-box}.app{padding:12px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:260px 1fr;gap:10px}.p{border:1px solid #dfe4ec;border-radius:10px;padding:10px;margin-bottom:10px;background:#fff}.b{padding:8px 10px;border:1px solid #d5dbe5;border-radius:8px;background:#fff;cursor:pointer}.primary{background:#7567ff;color:#fff}.active{outline:2px solid #7567ff}.ppt{display:grid;grid-template-columns:130px 1fr;gap:8px;height:700px}.thumbs{overflow:auto;background:#f8fafc;padding:6px}.thumb{height:110px;background:#fff;border:1px solid #ddd;margin-bottom:6px;padding:4px;cursor:pointer}.thumb.active{border-color:#7567ff}.tp{height:78px;overflow:hidden}.stage{display:flex;flex-direction:column;border:1px solid #ddd;min-width:0}.bar{display:flex;justify-content:space-between;align-items:center;padding:7px;border-bottom:1px solid #ddd}.view{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto}.class{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:9000;background:#000!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;max-width:none!important}.class>b{display:none!important}.class .ppt{height:100vh;width:100vw;padding:0;display:block}.class .thumbs{display:none!important}.class .stage{height:100vh;width:100vw;border:0;border-radius:0;background:#000}.class .bar{position:absolute;left:0;right:0;top:0;z-index:20;background:rgba(0,0,0,.72);color:#fff;border:0}.class .bar .b{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)}.class .bar .primary{background:#7567ff;border-color:#7567ff}.class .view{height:100vh;min-height:0;padding:0;background:#000}.class .view>*{max-width:100vw!important;max-height:100vh!important}.ppt.focusPpt{position:fixed;inset:0;width:100vw;height:100vh;z-index:9400;background:#000;padding:0;display:block}.ppt.focusPpt .thumbs{display:none}.ppt.focusPpt .stage{height:100vh;width:100vw;border:0}.ppt.focusPpt .view{height:100vh}
.research{position:fixed;right:18px;bottom:18px;width:min(540px,76vw);height:min(470px,64vh);background:#fff;border:2px solid #7567ff;border-radius:14px;box-shadow:0 10px 35px #0003;z-index:9500;display:none;overflow:hidden}.research.on{display:block}.research.big{left:2vw;right:2vw;top:7vh;bottom:7vh;width:auto;height:auto}.research .rh{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 10px;background:#7567ff;color:#fff}.research .rb{height:calc(100% - 44px);overflow:auto}.rlinks{padding:14px;line-height:1.7}.rlinks a{display:block;margin:8px 0}.small{font-size:12px;color:#667085}.ans{position:fixed;bottom:10px;left:10px;background:#fff;border:1px solid #ddd;padding:8px;display:none;z-index:9999}.mic{margin-top:8px;padding:8px;border-radius:8px;background:#f8fafc}.ok{color:#087f5b}.bad{color:#b42318}.warn{color:#9a6700}@media(max-width:800px){.grid{grid-template-columns:1fr}.ppt{grid-template-columns:80px 1fr}.research{right:8px;bottom:8px;width:84vw;height:50vh}}
</style>
</head>
<body>
<div class="app" id="app">
<h2>✦ AIVAULT — 教學助理</h2>
<div>Technical Dark Star AI 教學助理／PPT／聲控</div>
<div class="grid"><aside>
<section class="p"><b>🎤 暗星聲控</b><div id="vs">正在準備聲控…</div><div id="tr">等待老師說話…</div><div id="mic" class="mic">正在檢查麥克風…</div><button class="b primary" id="voiceStart">開始聽</button><button class="b" id="voiceStop">取消聲控</button></section>
<section class="p"><b>🔊 暗星說話聲音</b><div id="speechStatus">暗星語音：開啟</div><button class="b primary" id="speechOn">開啟聲音</button><button class="b" id="speechOff">關閉聲音</button></section>
<section class="p"><b>💬 回答模式</b><button class="b mode" data-m="voice">🔊 語音</button><button class="b mode" data-m="text">💬 字幕</button><button class="b mode active" data-m="both">🔊💬 語音＋字幕</button></section>
<section class="p"><b>📊 PPT</b><input id="file" type="file" accept=".pptx"><button class="b" id="save">儲存</button><button class="b" id="clear">清除</button></section>
<section class="p"><b>🌐 網路研究</b><input id="q" placeholder="民法第184條／比例原則案例"><button class="b primary" id="search">搜尋</button></section>
<section class="p"><b>🎬 影片</b><input id="yu" placeholder="YouTube 網址"><button class="b" id="openV">開啟影片區</button><button class="b" id="closeV">關閉</button><div id="video"></div></section>
</aside>
<main class="p" id="panel"><b>📽️ PPT 授課主畫面</b><div class="ppt" id="ppt"><div class="thumbs" id="thumbs">上傳 PPT 後顯示縮圖</div><div class="stage"><div class="bar"><div><button class="b" id="prev">←</button><button class="b primary" id="next">→</button><button class="b" id="goto">指定頁</button></div><span id="info">尚未載入</span><div><button class="b primary" id="start">▶ 開始上課</button><button class="b" id="exit" style="display:none">↩ 回主畫面</button></div></div><div class="view" id="view">請上傳 PPT</div></div></div></main>
</div></div>
<div id="research" class="research"><div class="rh"><b id="rtitle">🌐 網路研究</b><div><button class="b" id="rPpt">看 PPT</button><button class="b" id="rBig">放大</button><button class="b" id="rOpen">↗ 開啟網頁</button><button class="b" id="rClose">關閉</button></div></div><div class="rb" id="rbody"></div></div><div id="ans" class="ans"></div>
<script>
const $=x=>document.getElementById(x);let viewer=null,count=0,index=0,voice=true,rec=null,mode='both',classMode=false,speechEnabled=true;let researchOpen=false,researchBig=false,researchKind='',researchUrl='',listening=false;
function setMode(m){mode=m;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x.dataset.m===mode))}function setSpeechEnabled(v){speechEnabled=v;$('speechStatus').textContent='暗星語音：'+(v?'開啟':'關閉');$('speechOn').classList.toggle('primary',v);$('speechOff').classList.toggle('primary',!v);if(!v)try{speechSynthesis.cancel()}catch{}}
function say(t){if(mode!=='voice'){$('ans').textContent=t;$('ans').style.display='block'}else $('ans').style.display='none';if(mode!=='text'&&speechEnabled)try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}catch{}}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.m));$('speechOn').onclick=()=>setSpeechEnabled(true);$('speechOff').onclick=()=>setSpeechEnabled(false);
function update(){$('info').textContent=count?'第 '+(index+1)+' / '+count+' 頁':'尚未載入';document.querySelectorAll('.thumb').forEach((x,k)=>x.classList.toggle('active',k===index))}async function go(k){if(!count||!viewer)return;index=Math.max(0,Math.min(count-1,k));try{await viewer.renderSlide(index)}catch(e){console.error(e)}update()}
async function loadPpt(f){$('view').textContent='正在解析 PPT…';$('thumbs').textContent='正在建立縮圖…';try{const m=await import('https://esm.sh/@aiden0z/pptx-renderer@1.2.4');viewer=await m.PptxViewer.open(await f.arrayBuffer(),$('view'),{renderMode:'slide',fitMode:'contain'});count=Number(viewer.slideCount)||0;if(!count)throw Error('沒有投影片');$('thumbs').innerHTML='';for(let k=0;k<count;k++){const t=document.createElement('div');t.className='thumb';t.innerHTML='<div>第 '+(k+1)+' 頁</div>';const box=document.createElement('div');box.className='tp';t.appendChild(box);t.onclick=()=>go(k);$('thumbs').appendChild(t);try{const h=viewer.renderThumbnailToContainer(k,box,{width:105});if(h&&h.ready)await h.ready}catch(e){console.warn('thumbnail',k,e)}}index=0;await go(0);say('PPT 已載入，共 '+count+' 頁。')}catch(e){console.error(e);$('view').textContent='PPT 預覽失敗：'+(e.message||e);say('PPT 預覽失敗。')}}$('file').onchange=e=>e.target.files[0]&&loadPpt(e.target.files[0]);$('next').onclick=()=>{go(index+1);say('下一頁。')};$('prev').onclick=()=>{go(index-1);say('上一頁。')};$('goto').onclick=()=>{const n=prompt('請輸入頁碼',index+1);if(n)go(Number(n)-1)};
async function enter(){if(!count)return say('請先上傳 PPT。');classMode=true;$('panel').classList.add('class');$('ppt').classList.add('focusPpt');$('start').style.display='none';$('exit').style.display='inline-block';document.body.style.overflow='hidden';await go(index);try{await $('panel').requestFullscreen()}catch{}say('開始上課。PPT 已進入全螢幕教學模式。')}async function exit(){classMode=false;$('panel').classList.remove('class');$('ppt').classList.remove('focusPpt');$('start').style.display='inline-block';$('exit').style.display='none';document.body.style.overflow='';hideResearch();try{if(document.fullscreenElement)await document.exitFullscreen()}catch{}say('已回到主畫面。')}$('start').onclick=enter;$('exit').onclick=exit;
function clean(t){return t.replace(/[，。！？、,.!?\s]/g,'')}function detectKind(q){if(/民法|刑法|憲法|行政法|商法|公司法|勞動法|法條|條文|法律/.test(q))return'law';if(/案例|判決|裁判|判例|比例原則|憲判|大法庭/.test(q))return'case';return'web'}
function makeResearch(q){const kind=detectKind(q),e=encodeURIComponent(q);let urls=[{name:'一般搜尋',url:'https://www.google.com/search?q='+e},{name:'Bing',url:'https://www.bing.com/search?q='+e}],label='一般網路研究';if(kind==='law'){urls=[{name:'全國法規資料庫',url:'https://law.moj.gov.tw/LawClass/LawAll.aspx?kw='+e},{name:'Google 法律搜尋',url:'https://www.google.com/search?q='+encodeURIComponent('site:law.moj.gov.tw '+q)},{name:'Bing 法律搜尋',url:'https://www.bing.com/search?q='+encodeURIComponent(q+' site:law.moj.gov.tw')}];label='法條研究'}if(kind==='case'){urls=[{name:'司法院裁判書查詢',url:'https://judgment.judicial.gov.tw/FJUD/default.aspx?kw='+e},{name:'Google 案例搜尋',url:'https://www.google.com/search?q='+encodeURIComponent('site:judgment.judicial.gov.tw '+q)},{name:'Bing 案例搜尋',url:'https://www.bing.com/search?q='+encodeURIComponent(q+' site:judgment.judicial.gov.tw')}];label='案例／判決研究'}return{kind,urls,label}}
function showResearch(q){q=q.trim();if(!q)return;const r=makeResearch(q);researchOpen=true;researchBig=false;researchKind=r.kind;researchUrl=r.urls[0].url;$('q').value=q;$('rtitle').textContent=r.kind==='law'?'⚖️ 法條研究':r.kind==='case'?'⚖️ 案例／判決研究':'🌐 網路研究';$('rbody').innerHTML='<div class="rlinks"><b>'+r.label+'</b><div class="small">外部網站不再嵌入本頁。請直接點擊來源，由瀏覽器開啟；這樣不會因 X-Frame-Options／CSP 阻擋而卡住。</div>'+r.urls.map((u,i)=>'<a href="'+u.url+'" target="_blank" rel="noopener noreferrer">'+(i===0?'↗ ':'🔗 ')+u.name+'</a>').join('')+'<div class="small">暗星不把外部網站內容冒充成自己的資料。</div></div>';syncResearch();say('已找到 '+r.urls.length+' 個搜尋來源。請直接開啟需要的來源。')}
function syncResearch(){$('research').classList.toggle('on',researchOpen);$('research').classList.toggle('big',researchOpen&&researchBig)}function hideResearch(){researchOpen=false;researchBig=false;syncResearch()}$('rClose').onclick=hideResearch;$('rBig').onclick=()=>{if(!researchOpen)return;researchBig=!researchBig;syncResearch();say(researchBig?'研究畫面已放大。':'研究畫面已縮回子畫面。')};$('rPpt').onclick=()=>{hideResearch();say('已回到 PPT。')};$('rOpen').onclick=()=>{if(researchUrl)window.open(researchUrl,'_blank','noopener,noreferrer')};$('search').onclick=()=>showResearch($('q').value);
function yid(u){try{const x=new URL(u);return x.searchParams.get('v')||x.pathname.split('/').pop()}catch{return''}}$('openV').onclick=()=>{const id=yid($('yu').value.trim());if(!id)return say('請輸入 YouTube 網址。');$('video').innerHTML='<iframe style="width:100%;aspect-ratio:16/9" src="https://www.youtube.com/embed/'+encodeURIComponent(id)+'" allowfullscreen></iframe>';say('影片區已開啟。')};$('closeV').onclick=()=>{$('video').innerHTML='';say('影片區已關閉。')};
let db;try{const r=indexedDB.open('aivault-teaching-assistant',1);r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('ppt'))e.target.result.createObjectStore('ppt',{keyPath:'id'})};r.onsuccess=e=>db=e.target.result}catch{}$('save').onclick=()=>{const f=$('file').files[0];if(!f||!db)return say('請先選擇 PPT。');const t=db.transaction('ppt','readwrite');t.objectStore('ppt').put({id:crypto.randomUUID(),name:f.name,type:f.type,blob:f});t.oncomplete=()=>say('PPT 已儲存。')};$('clear').onclick=()=>{viewer=null;count=0;index=0;$('view').textContent='請上傳 PPT';$('thumbs').textContent='上傳 PPT 後顯示縮圖';update()};
function legalIntent(t){return /(?:民法|刑法|憲法|行政法|商法|公司法|勞動法|法條|條文).*(?:第?\d+條|條文|規定)|(?:第?\d+條).*(?:民法|刑法|憲法|行政法|公司法|勞動法)|比例原則|違憲|大法庭|憲判/.test(t)}function caseIntent(t){return /案例|判決|裁判|判例|司法院|最高法院|法院見解|比例原則案例/.test(t)}
function command(t){const raw=t,x=clean(t);$('tr').textContent=raw;if(!voice){if(/恢復聲控|開啟聲控|啟動聲控|恢復聽取/.test(x)){voice=true;$('vs').textContent='聲控已恢復';startRec();say('聲控已恢復。')}return}if(/取消聲控|停止聲控|關閉聲控/.test(x)){voice=false;$('vs').textContent='聲控已取消（靜默待機，只等待恢復聲控）';try{speechSynthesis.cancel()}catch{}return}if(/關閉暗星語音|關閉暗星聲音|關閉說話聲音|停止暗星說話|不要說話|靜音暗星/.test(x)){setSpeechEnabled(false);return}if(/開啟暗星語音|開啟暗星聲音|恢復暗星說話|恢復說話聲音|取消靜音暗星/.test(x)){setSpeechEnabled(true);return}if(/下一頁|下一張/.test(x))return $('next').click();if(/上一頁|上一張/.test(x))return $('prev').click();const m=x.match(/第(\d+)頁/);if(m)return go(+m[1]-1);if(/開始上課|開始授課/.test(x))return enter();if(/回主畫面|退出教學/.test(x))return exit();if(/開啟影片區/.test(x))return $('openV').click();if(/關閉影片區/.test(x))return $('closeV').click();if(/看PPT|看投影片|回PPT/.test(x)){hideResearch();return}if(/只顯示字幕|字幕回答/.test(x)){setMode('text');return}if(/語音加字幕|語音字幕|語音＋字幕/.test(x)){setMode('both');return}if(/語音回答|只用語音/.test(x)){setMode('voice');return}if(/看法條|看條文|放大法條|放大案例|看案例|看判決|放大研究畫面/.test(x)){if(!researchOpen)showResearch($('q').value||'法律資料');researchBig=true;syncResearch();return say('已把研究資料放大。')}if(/縮小法條|縮小案例|縮小研究/.test(x)){researchBig=false;syncResearch();return say('研究資料已縮回子畫面。')}if(/兩個一起|一起看|PPT和法條|PPT與法條|PPT跟法條|PPT和案例/.test(x)){researchBig=false;syncResearch();return say('PPT 與研究資料維持子母畫面。')}if(/關閉法條|關閉案例|關閉研究/.test(x)){hideResearch();return}if(legalIntent(x)||caseIntent(x))return showResearch(raw);if(/搜尋|搜索|找|查一下|查詢|上網/.test(x)){const q=raw.replace(/^(幫我|請)?\s*(搜尋|搜索|找|查一下|查詢|上網)/,'').trim();if(q)return showResearch(q)}}
async function detectMicrophone(){const el=$('mic');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){el.className='mic bad';el.textContent='❌ 此瀏覽器不支援麥克風檢測';return false}if(!window.isSecureContext){el.className='mic bad';el.textContent='❌ 目前不是 HTTPS 安全環境，無法取得麥克風';return false}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const tracks=stream.getAudioTracks();const devices=await navigator.mediaDevices.enumerateDevices();stream.getTracks().forEach(t=>t.stop());const n=devices.filter(d=>d.kind==='audioinput').length;el.className='mic ok';el.textContent='✅ 已偵測到麥克風'+(n?'（'+n+' 個音訊輸入）':'');return tracks.length>0}catch(e){el.className='mic '+(e.name==='NotAllowedError'?'warn':'bad');el.textContent=e.name==='NotAllowedError'?'⚠️ 麥克風權限尚未允許':e.name==='NotFoundError'?'❌ 找不到麥克風':'❌ 麥克風無法使用：'+e.name;return false}}
function startRec(){if(!rec||listening)return;try{rec.start();listening=true}catch{}}function setup(){const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S){voice=false;$('vs').textContent='此瀏覽器不支援語音辨識';return}rec=new S();rec.lang='zh-TW';rec.continuous=false;rec.interimResults=true;rec.onstart=()=>{listening=true;if(voice)$('vs').textContent='聲控啟用'};rec.onerror=()=>{listening=false};rec.onresult=e=>{let t='';for(let k=e.resultIndex;k<e.results.length;k++)if(e.results[k].isFinal)t+=e.results[k][0].transcript;if(t)command(t)};rec.onend=()=>{listening=false;setTimeout(()=>{if(rec)startRec()},350)};$('voiceStart').onclick=()=>{voice=true;$('vs').textContent='聲控啟用';startRec()};$('voiceStop').onclick=()=>{voice=false;$('vs').textContent='聲控已取消（靜默待機，只等待恢復聲控）';try{rec.stop()}catch{}};startRec()}
setSpeechEnabled(true);detectMicrophone();setup();
</script></body></html>
