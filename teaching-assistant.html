<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>AIVAULT — 教學助理</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}button,input{font:inherit}.app{max-width:1600px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title{font-size:20px;font-weight:800}.sub,.muted{font-size:12px;color:#667085}.layout{display:grid;grid-template-columns:300px minmax(0,1fr) 280px;gap:12px}.panel{background:#fff;border:1px solid #dfe4ec;border-radius:13px;padding:13px;margin-bottom:10px}.btn{border:1px solid #d5dbe5;background:#fff;color:#172033;padding:9px 12px;border-radius:9px;cursor:pointer}.primary{background:#7567ff;color:#fff;border-color:#7567ff}.voice{background:#f8fafc;border:1px solid #dfe4ec;border-radius:10px;padding:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.modes{display:grid;gap:6px}.mode.active{border-color:#7567ff;background:#f4f2ff}.ppt{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;min-height:720px}.thumbs{background:#f8fafc;border:1px solid #dfe4ec;border-radius:10px;padding:7px;overflow:auto;max-height:720px}.thumb{background:#fff;border:1px solid #d5dbe5;border-radius:7px;margin-bottom:7px;padding:5px;cursor:pointer;overflow:hidden;height:125px}.thumb.active{border-color:#7567ff;box-shadow:0 0 0 1px #7567ff}.thumb-title{font-size:10px;color:#667085;margin-bottom:3px}.thumb-preview{width:110px;height:85px;margin:auto;overflow:hidden;background:#fff}.stage{min-width:0;min-height:720px;border:1px solid #dfe4ec;border-radius:10px;display:flex;flex-direction:column;overflow:hidden;background:#f8fafc}.bar{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px;background:#fff;border-bottom:1px solid #dfe4ec}.nav{display:flex;gap:5px;flex-wrap:wrap}.slide-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:12px}.ppt-preview{width:100%;height:100%;min-height:600px}.video{display:none}.video.show{display:block}.video iframe{width:100%;aspect-ratio:16/9;border:0}.answer{position:fixed;left:12px;bottom:12px;z-index:8000;background:#fff;border:1px solid #dfe4ec;border-radius:10px;padding:10px;max-width:420px;display:none;box-shadow:0 5px 20px #0001}.class-mode{position:fixed!important;inset:0!important;z-index:7000!important;background:#000!important;border:0!important;border-radius:0!important;padding:0!important;margin:0!important;max-width:none!important}.class-mode .ppt{height:100vh;min-height:0;padding:10px;grid-template-columns:160px minmax(0,1fr)}.class-mode .thumbs{max-height:none}.class-mode .stage{height:calc(100vh - 20px);min-height:0;background:#000;border-color:#222}.class-mode .slide-wrap{padding:8px;min-height:0}.class-mode .ppt-preview{height:100%;min-height:0;width:100%;overflow:auto}.class-mode .ppt-preview>*{max-width:100%!important}.class-mode .video{display:none!important}@media(max-width:900px){.layout{grid-template-columns:1fr}.ppt{grid-template-columns:90px 1fr;min-height:520px}.stage{min-height:520px}.thumbs{max-height:520px}.class-mode .ppt{grid-template-columns:80px 1fr}}</style></head><body><div class="app" id="app"><header class="top"><div><div class="title">✦ AIVAULT — 教學助理</div><div class="sub">Technical Dark Star AI 教學助理／PPT／聲控</div></div></header><div class="layout"><aside><section class="panel"><b>🎤 暗星聲控</b><div class="voice" style="margin-top:8px"><div id="voiceState">正在準備聲控…</div><div id="transcript" style="margin-top:7px;min-height:40px">可說：下一頁、第 8 頁、開始上課、回主畫面、恢復聲控</div><div class="actions"><button class="btn primary" id="voiceStart">🎤 開始聽</button><button class="btn" id="voiceStop">取消聲控</button></div></div></section><section class="panel"><b>💬 暗星回答模式</b><div class="modes" style="margin-top:8px"><button class="btn mode" data-mode="voice">🔊 語音</button><button class="btn mode" data-mode="text">💬 字幕</button><button class="btn mode active" data-mode="both">🔊💬 語音＋字幕</button></div><div id="modeStatus" class="muted" style="margin-top:7px">目前：語音＋字幕</div></section><section class="panel"><b>📊 PPT 教材</b><input id="pptFile" type="file" accept=".pptx" style="display:block;width:100%;margin-top:9px"><div style="display:flex;gap:6px;margin-top:8px"><button class="btn primary" id="savePpt">儲存 PPT</button><button class="btn" id="clearPpt">清除</button></div><div id="pptFiles" style="margin-top:8px"></div></section><section class="panel"><b>🌐 網路搜尋</b><input id="searchInput" placeholder="民法第184條／比例原則案例" style="width:100%;padding:9px;margin-top:8px"><button class="btn primary" id="searchBtn" style="margin-top:7px">搜尋</button><div class="muted" style="margin-top:6px">原始來源與暗星說明分開。</div></section><section class="panel"><b>🎬 影片區</b><input id="youtubeUrl" placeholder="YouTube 網址" style="width:100%;padding:9px;margin-top:8px"><div style="margin-top:7px"><button class="btn" id="openVideo">開啟影片區</button><button class="btn" id="closeVideo">關閉</button></div></section></aside><main class="panel" id="teachingPanel"><div style="font-weight:800;margin-bottom:9px">📽️ 授課主畫面｜PPT</div><div class="ppt"><div class="thumbs" id="thumbs"><div class="muted">上傳 PPT 後顯示每頁縮圖</div></div><div class="stage"><div class="bar"><div class="nav"><button class="btn" id="prev">← 上一頁</button><button class="btn primary" id="next">下一頁 →</button><button class="btn" id="goto">指定頁</button></div><div id="pageInfo" class="muted">尚未載入 PPT</div><div class="nav"><button class="btn primary" id="startClass">▶ 開始上課</button><button class="btn" id="exitClass" style="display:none">↩ 回主畫面</button></div></div><div class="slide-wrap"><div id="pptPreview" class="ppt-preview"><div style="height:100%;min-height:500px;display:grid;place-items:center;color:#667085">請上傳 PPT</div></div></div></div></div><div class="video panel" id="videoZone"><b>🎬 影片區</b><div id="videoFrame" style="margin-top:8px"></div></div></main><aside><section class="panel"><b>🧭 聲控指令</b><p>下一頁</p><p>上一頁</p><p>第 8 頁</p><p>開始上課</p><p>回主畫面</p><p>取消聲控</p><p>恢復聲控</p><p>開啟影片區</p><p>關閉影片區</p></section></aside></div></div><div id="answer" class="answer"></div><script>const SUPABASE_URL='https://clcddygkaaqqtsbswgdf.supabase.co',GATEWAY=SUPABASE_URL+'/functions/v1/ai-gateway';const $=id=>document.getElementById(id);let currentPpt=null,currentSlides=[],currentIndex=0,pptViewer=null,voiceEnabled=true,recognition=null,answerMode='both',classMode=false;function speak(t){if(answerMode==='text'||answerMode==='both'){$('answer').textContent=t;$('answer').style.display='block'}else $('answer').style.display='none';if(answerMode==='voice'||answerMode==='both')try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}catch{}}function setMode(m){answerMode=m;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x.dataset.mode===m));$('modeStatus').textContent='目前：'+({voice:'語音',text:'字幕',both:'語音＋字幕'}[m])}document.querySelectorAll('.mode').forEach(x=>x.onclick=()=>setMode(x.dataset.mode));function updatePage(){ $('pageInfo').textContent=currentSlides.length?'第 '+(currentIndex+1)+' / '+currentSlides.length+' 頁':'尚未載入 PPT';document.querySelectorAll('.thumb').forEach((x,i)=>x.classList.toggle('active',i===currentIndex))}async function gotoSlide(i){if(!currentSlides.length)return;currentIndex=Math.max(0,Math.min(currentSlides.length-1,i));try{if(pptViewer?.renderSlide)await pptViewer.renderSlide(currentIndex);else if(pptViewer?.goToSlide)await pptViewer.goToSlide(currentIndex,{behavior:'instant'});else currentSlides.forEach((x,n)=>{if(x instanceof HTMLElement)x.style.display=n===currentIndex?'':'none'})}catch(e){console.warn(e)}updatePage()}function nextSlide(){gotoSlide(currentIndex+1);speak('下一頁。')}function prevSlide(){gotoSlide(currentIndex-1);speak('上一頁。')}function makeThumbs(){const count=pptViewer?.slideCount||0;$('thumbs').innerHTML='';currentSlides=Array.from({length:count},(_,i)=>i);for(let i=0;i<count;i++){const t=document.createElement('div');t.className='thumb';t.innerHTML='<div class="thumb-title">第 '+(i+1)+' 頁</div>';const box=document.createElement('div');box.className='thumb-preview';t.appendChild(box);t.onclick=()=>gotoSlide(i);$('thumbs').appendChild(t);try{const h=pptViewer.renderThumbnailToContainer(i,box,{width:110});if(h?.ready)h.ready.catch(()=>{})}catch(e){box.textContent='縮圖失敗'}}updatePage();gotoSlide(0)}async function loadPpt(file){if(!file.name.toLowerCase().endsWith('.pptx')){speak('目前支援 PPTX。');return}currentPpt=file;currentSlides=[];currentIndex=0;pptViewer=null;$('pageInfo').textContent='正在解析 '+file.name+'…';$('pptPreview').innerHTML='';$('thumbs').innerHTML='<div class="muted">正在建立投影片…</div>';try{const m=await import('https://esm.sh/@aiden0z/pptx-renderer@1.2.4');if(typeof m.PptxViewer!=='function')throw Error('PPT 引擎載入失敗');pptViewer=await m.PptxViewer.open(await file.arrayBuffer(),$('pptPreview'),{renderMode:'slide',fitMode:'contain'});if(!pptViewer.slideCount)throw Error('PPT 沒有投影片');makeThumbs();speak('PPT 已載入，共 '+pptViewer.slideCount+' 頁。')}catch(e){console.error(e);$('pptPreview').innerHTML='<div style="padding:30px;color:#b42318">PPT 預覽失敗：'+e.message+'</div>';$('thumbs').innerHTML='<div class="muted">無法建立縮圖。</div>';speak('PPT 預覽失敗。')}}$('pptFile').onchange=e=>{const f=e.target.files?.[0];if(f)loadPpt(f)};$('next').onclick=nextSlide;$('prev').onclick=prevSlide;$('goto').onclick=()=>{const n=prompt('請輸入頁碼',String(currentIndex+1));if(n)gotoSlide(Number(n)-1)};async function enterClassMode(){if(!currentSlides.length){speak('請先上傳 PPT。');return}classMode=true;$('teachingPanel').classList.add('class-mode');$('startClass').style.display='none';$('exitClass').style.display='inline-block';document.body.style.overflow='hidden';try{if(document.fullscreenElement!==$('teachingPanel')&&$('teachingPanel').requestFullscreen)await $('teachingPanel').requestFullscreen()}catch{}await gotoSlide(currentIndex);speak('開始上課。PPT 已進入教學模式。')}async function exitClassMode(){classMode=false;$('teachingPanel').classList.remove('class-mode');$('startClass').style.display='inline-block';$('exitClass').style.display='none';document.body.style.overflow='';try{if(document.fullscreenElement)await document.exitFullscreen()}catch{}speak('已回到主畫面。')}$('startClass').onclick=enterClassMode;$('exitClass').onclick=exitClassMode;document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextSlide();if(e.key==='ArrowLeft')prevSlide();if(e.key==='Escape'&&classMode)exitClassMode()});function youtubeId(u){try{const x=new URL(u);if(x.hostname.includes('youtu.be'))return x.pathname.slice(1).split('/')[0];return x.searchParams.get('v')||((x.pathname.match(/\/shorts\/([^/]+)/)||[])[1]||'')}catch{return ''}}$('openVideo').onclick=()=>{const id=youtubeId($('youtubeUrl').value.trim());if(!id){speak('請先輸入 YouTube 網址。');return}$('videoFrame').innerHTML='<iframe src="https://www.youtube.com/embed/'+encodeURIComponent(id)+'" allowfullscreen></iframe>';$('videoZone').classList.add('show');speak('影片區已開啟。')};$('closeVideo').onclick=()=>{$('videoZone').classList.remove('show');$('videoFrame').innerHTML='';speak('影片區已關閉。')};$('searchBtn').onclick=()=>{const q=$('searchInput').value.trim();if(q)window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank','noopener')};let db=null;try{const r=indexedDB.open('aivault-teaching-assistant',1);r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('ppt'))e.target.result.createObjectStore('ppt',{keyPath:'id'})};r.onsuccess=e=>db=e.target.result}catch{}$('savePpt').onclick=()=>{if(!currentPpt||!db){speak('請先上傳 PPT。');return}const tx=db.transaction('ppt','readwrite');tx.objectStore('ppt').put({id:crypto.randomUUID(),name:currentPpt.name,type:currentPpt.type,blob:currentPpt});tx.oncomplete=()=>speak('PPT 已儲存。')};$('clearPpt').onclick=()=>{currentPpt=null;currentSlides=[];currentIndex=0;pptViewer=null;$('pptPreview').innerHTML='<div style="height:100%;min-height:500px;display:grid;place-items:center;color:#667085">請上傳 PPT</div>';$('thumbs').innerHTML='<div class="muted">上傳 PPT 後顯示每頁縮圖</div>';$('pageInfo').textContent='尚未載入 PPT'});function norm(t){return t.replace(/[，。！？、,.!?\s]/g,'')}function command(t){t=norm(t);if(!voiceEnabled){if(/恢復聲控|開啟聲控|啟動聲控/.test(t)){voiceEnabled=true;setVoiceUI();startRecognition()}return}if(/取消聲控|停止聲控|關閉聲控/.test(t)){voiceEnabled=false;try{recognition?.stop();speechSynthesis.cancel()}catch{}setVoiceUI();return}if(/下一頁|下一張/.test(t))return nextSlide();if(/上一頁|上一張/.test(t))return prevSlide();const m=t.match(/第(\d+)頁/);if(m)return gotoSlide(+m[1]-1);if(/開始上課|開始授課/.test(t))return enterClassMode();if(/回主畫面|退出教學/.test(t))return exitClassMode();if(/開啟影片區|打開影片區/.test(t))return $('openVideo').click();if(/關閉影片區|關掉影片區/.test(t))return $('closeVideo').click();if(/語音加字幕|語音字幕/.test(t))return setMode('both');if(/只顯示字幕|字幕回答/.test(t))return setMode('text');if(/語音回答/.test(t))return setMode('voice');if(/搜尋|搜索|找/.test(t)){const q=t.replace(/^(幫我)?(搜尋|搜索|找)/,'');if(q){window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank','noopener')}}}function setVoiceUI(){$('voiceState').textContent=voiceEnabled?'🎤 聲控已啟動':'🤫 靜默待機｜只接受「恢復聲控」';$('voiceStart').textContent=voiceEnabled?'🎤 聲控已啟動':'恢復聲控';$('transcript').textContent=voiceEnabled?'可說：下一頁、第 8 頁、開始上課、回主畫面、取消聲控':'暗星目前靜默待機，只接受「恢復聲控」。'}function startRecognition(){if(!recognition||!voiceEnabled)return;try{recognition.start()}catch{}}function setupVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('voiceState').textContent='此瀏覽器不支援語音辨識';voiceEnabled=false;return}recognition=new SR();recognition.lang='zh-TW';recognition.continuous=false;recognition.interimResults=true;recognition.onstart=()=>{$('voiceState').textContent='🎤 正在聽'};recognition.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=e.results[i][0].transcript;if(t){$('transcript').textContent=t;command(t)}};recognition.onend=()=>{if(voiceEnabled)setTimeout(startRecognition,300)};$('voiceStart').onclick=()=>{voiceEnabled=true;setVoiceUI();startRecognition()};$('voiceStop').onclick=()=>{voiceEnabled=false;try{recognition.stop()}catch{}speechSynthesis.cancel();setVoiceUI()};setVoiceUI();startRecognition()}setupVoice();</script></body></html>
