<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#fff"><title>Technical Dark Star｜真實聲音克隆測試</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f8;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0000000a}h1{font-size:24px;margin:4px 0 8px}.muted{color:#666;font-size:14px}.status{padding:10px 12px;border-radius:12px;background:#f1f1f1;margin-top:10px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,input,textarea{font:inherit}button{border:1px solid #ccc;background:#fff;border-radius:12px;padding:12px 16px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}button.primary{background:#111;color:#fff;border-color:#111}button:disabled{opacity:.45;cursor:not-allowed}.record{width:100%;min-height:64px;font-size:18px}.record.on{background:#b00020;color:#fff;border-color:#b00020}input,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:12px;background:#fff}.meter{font-variant-numeric:tabular-nums;font-size:20px;text-align:center;margin:8px}.wavebox{position:relative;height:170px;background:#101010;border-radius:14px;overflow:hidden;margin:10px 0}.wavebox canvas{width:100%;height:100%;display:block;pointer-events:none}.recordingLabel{position:absolute;left:12px;top:10px;color:#fff;font-size:14px;display:none}.recordingLabel.on{display:block}.result{white-space:pre-wrap;background:#111;color:#eee;border-radius:12px;padding:12px;font-family:ui-monospace,monospace;font-size:13px;overflow:auto}.small{font-size:13px}.audio{width:100%;margin-top:10px}.audio[hidden]{display:none}label{display:block;margin:12px 0 6px;font-weight:600}.ok{color:#087f23}.err{color:#b00020}</style>
</head>
<body><main class="wrap">
<h1>🎙️ Technical Dark Star｜真實聲音克隆測試</h1><div class="muted">獨立測試頁。此頁不修改 technical-dark-star.html。</div>
<div id="auth" class="status">正在檢查登入狀態…</div>
<section class="card"><h2>① 錄製聲音</h2><div class="muted">建議朗讀約 30–40 秒。最長 45 秒。錄音會即時顯示音波與秒數。</div>
<label>聲音名稱</label><input id="voiceName" value="暗星測試聲音" maxlength="80">
<div class="wavebox"><canvas id="wave"></canvas><div id="recLabel" class="recordingLabel">🔴 正在錄音</div></div>
<div id="timer" class="meter">00:00 / 00:45</div><button id="recordBtn" class="record" type="button">🎙️ 開始錄音</button>
<div class="row" style="margin-top:10px"><button id="stopBtn" type="button" disabled>⏹ 停止錄音</button><button id="playBtn" type="button" disabled>▶ 播放原始錄音</button><button id="redoBtn" type="button" disabled>↻ 重新錄音</button></div>
<audio id="originalAudio" class="audio" controls hidden></audio>
<div id="micStatus" class="status small">尚未啟用麥克風</div></section>
<section class="card"><h2>② 真正 Clone</h2><div class="muted">會把錄音送到 AIVAULT 隔離測試函式，再由 ElevenLabs 建立真正 Voice ID。</div><div class="row"><button id="cloneBtn" class="primary" type="button" disabled>🚀 開始真正聲音克隆</button></div></section>
<section class="card"><h2>③ 真正語音生成</h2><label>測試文字</label><textarea id="testText" rows="4">大家好，我是暗星。這是 AIVAULT 真正聲音克隆的播放測試。</textarea><button id="speakBtn" class="primary" type="button" disabled style="margin-top:10px">🔊 使用 Clone Voice 生成語音</button><audio id="cloneAudio" class="audio" controls hidden></audio></section>
<section class="card"><h2>🧪 測試結果</h2><div id="result" class="result">尚未開始測試</div></section>
</main>
<script>
const SUPABASE_URL='https://clcddygkaaqqtsbswgdf.supabase.co';
const SUPABASE_KEY='sb_publishable_1D05YGthBrNGg-5L92TLCw_GiLnInBu';
const FN=SUPABASE_URL+'/functions/v1/technical-dark-star-voice-clone-test';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);let recorder=null,chunks=[],blob=null,url=null,voiceId=null,stream=null,audioCtx=null,analyser=null,raf=null,startAt=0,timerInt=null,mime='',stopping=false;
function msg(t,cls=''){ $('result').textContent=t; $('result').className='result '+cls }
function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
async function auth(){const {data:{session}}=await sb.auth.getSession();if(session){$('auth').innerHTML='✅ 已登入，可以進行真實 Clone 測試。';$('auth').className='status ok';return session} $('auth').innerHTML='⚠️ 尚未登入 Supabase。請先在 AIVAULT 登入後再開本測試頁。';$('auth').className='status err';return null}
function draw(){if(!analyser)return;const c=$('wave'),d=c.getContext('2d'),r=c.getBoundingClientRect(),w=c.width=Math.max(300,r.width*devicePixelRatio),h=c.height=Math.max(120,r.height*devicePixelRatio);d.clearRect(0,0,w,h);const data=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(data);d.strokeStyle='#fff';d.lineWidth=2*devicePixelRatio;d.beginPath();for(let i=0;i<data.length;i++){const x=i/(data.length-1)*w,y=h/2+(data[i]-128)/128*h*.42;i?d.lineTo(x,y):d.moveTo(x,y)}d.stroke();raf=requestAnimationFrame(draw)}
function resetUIAfterStop(){clearInterval(timerInt);timerInt=null;cancelAnimationFrame(raf);raf=null;if(audioCtx){audioCtx.close().catch(()=>{});audioCtx=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}analyser=null;$('stopBtn').disabled=true;$('recordBtn').classList.remove('on');$('recordBtn').textContent='🎙️ 開始錄音';$('recLabel').classList.remove('on');}
function stop(){if(stopping)return;stopping=true;clearInterval(timerInt);timerInt=null;cancelAnimationFrame(raf);raf=null;$('stopBtn').disabled=true;$('recordBtn').disabled=true;if(recorder&&recorder.state!=='inactive'){try{recorder.stop()}catch(e){finishStop()}}else finishStop()}
function finishStop(){if(audioCtx){audioCtx.close().catch(()=>{});audioCtx=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}analyser=null;$('recordBtn').disabled=false;$('recordBtn').classList.remove('on');$('recordBtn').textContent='🎙️ 開始錄音';$('recLabel').classList.remove('on');stopping=false}
async function start(){if(recorder&&recorder.state!=='inactive')return;try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('此瀏覽器不支援麥克風錄音');stream=await navigator.mediaDevices.getUserMedia({audio:true});$('micStatus').textContent='✅ 麥克風已授權，正在錄音';$('micStatus').className='status small ok';mime=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'].find(x=>MediaRecorder.isTypeSupported(x))||'';recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);chunks=[];stopping=false;recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};recorder.onstop=()=>{blob=new Blob(chunks,{type:mime||'audio/webm'});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);$('originalAudio').src=url;$('originalAudio').hidden=false;$('playBtn').disabled=false;$('redoBtn').disabled=false;$('cloneBtn').disabled=false;$('micStatus').textContent='✅ 錄音完成，可以播放、重新錄音或開始 Clone';$('micStatus').className='status small ok';$('timer').textContent=fmt((Date.now()-startAt)/1000)+' / 00:45';finishStop()};recorder.start(250);startAt=Date.now();$('recordBtn').classList.add('on');$('recordBtn').textContent='🔴 錄音中…';$('stopBtn').disabled=false;$('playBtn').disabled=true;$('redoBtn').disabled=true;$('cloneBtn').disabled=true;$('recLabel').classList.add('on');$('timer').textContent='00:00 / 00:45';audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();const src=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=2048;src.connect(analyser);draw();timerInt=setInterval(()=>{const s=(Date.now()-startAt)/1000;$('timer').textContent=fmt(s)+' / 00:45';if(s>=45)stop()},100)}catch(e){finishStop();$('micStatus').textContent='❌ 無法使用麥克風：'+(e.message||e);$('micStatus').className='status err'}}
$('recordBtn').addEventListener('click',start);$('stopBtn').addEventListener('click',stop);$('playBtn').addEventListener('click',async()=>{if(!$('originalAudio').src)return;try{await $('originalAudio').play()}catch(e){$('micStatus').textContent='❌ 無法播放原始錄音：'+(e.message||e);$('micStatus').className='status err'}});$('redoBtn').addEventListener('click',()=>{if(recorder&&recorder.state!=='inactive')stop();blob=null;voiceId=null;$('originalAudio').pause();$('originalAudio').removeAttribute('src');$('originalAudio').hidden=true;$('playBtn').disabled=true;$('cloneBtn').disabled=true;$('redoBtn').disabled=true;$('speakBtn').disabled=true;$('timer').textContent='00:00 / 00:45';setTimeout(start,100)});
$('cloneBtn').addEventListener('click',async()=>{if(!blob)return;const s=await auth();if(!s)return;msg('正在建立真正 Voice Clone…');$('cloneBtn').disabled=true;try{const fd=new FormData();fd.append('action','clone');fd.append('name',$('voiceName').value.trim()||'暗星測試聲音');fd.append('description','Technical Dark Star isolated voice clone test');const ext=(blob.type||'').includes('mp4')?'m4a':'webm';fd.append('files',blob,'dark-star-sample.'+ext);const {data:{session}}=await sb.auth.getSession();const res=await fetch(FN,{method:'POST',headers:{Authorization:'Bearer '+session.access_token},body:fd});const j=await res.json();if(!res.ok||!j.voice_id)throw new Error(j.error||j.message||'Clone 失敗');voiceId=j.voice_id;$('speakBtn').disabled=false;msg('Provider: '+(j.provider||'elevenlabs')+'\nVoice ID: '+voiceId+'\nStatus: REAL CLONE SUCCESS\nOwner: '+(j.owner_id||s.user.id),'ok')}catch(e){msg('REAL CLONE FAILED\n'+(e.message||e),'err');$('cloneBtn').disabled=false}});
$('speakBtn').addEventListener('click',async()=>{if(!voiceId)return;const s=await auth();if(!s)return;msg('正在用 Clone Voice 生成真正音訊…');$('speakBtn').disabled=true;try{const {data:{session}}=await sb.auth.getSession();const res=await fetch(FN,{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({action:'speak',voice_id:voiceId,text:$('testText').value,model:'eleven_multilingual_v2'})});const j=await res.json();if(!res.ok||!j.audio_base64)throw new Error(j.error||j.message||'TTS 失敗');const a=$('cloneAudio');a.src='data:'+(j.content_type||'audio/mpeg')+';base64,'+j.audio_base64;a.hidden=false;await a.play();msg('Provider: '+(j.provider||'elevenlabs')+'\nVoice ID: '+voiceId+'\nStatus: REAL CLONE TTS SUCCESS\n已產生並播放實際音訊。','ok')}catch(e){msg('REAL CLONE TTS FAILED\n'+(e.message||e),'err')}finally{$('speakBtn').disabled=false}});
auth();
</script></body></html>
