<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>聯盟</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body class="game-body">
  <div class="snow-layer"></div>
  <div class="app" id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/boot.js"></script>
  <script>
    async function render() {
      if (!(await FKAuth.requirePlayer())) return;
      const snap = await FKApi.snapshot();
      const list = await FKApi.listAlliances();
      document.getElementById("app").innerHTML = `
        <div class="page-head"><a class="back" href="game-menu.html">← 返回</a><h2>聯盟</h2></div>
        ${FKUI.top(snap)}
        <div class="panel">
          <p class="tiny">目前聯盟：${snap.player.alliance_id || "無"}</p>
          <input id="aname" placeholder="新聯盟名稱" />
          <button class="btn" id="create">建立聯盟</button>
          <button class="btn secondary" onclick="location.href='game-chat.html?ch=alliance'">聯盟聊天</button>
          ${list.map((a) => `<div class="list-item"><span>${a.name}</span><button class="btn small" onclick="join('${a.id}')">加入</button></div>`).join("") || "<p class='tiny'>尚無聯盟</p>"}
          <button class="btn danger" id="leave">離開聯盟</button>
        </div>${FKUI.nav("more")}
      `;
      document.getElementById("create").onclick = () => guarded(async () => {
        await FKApi.createAlliance(document.getElementById("aname").value); await render();
      });
      document.getElementById("leave").onclick = () => guarded(async () => { await FKApi.leaveAlliance(); await render(); });
    }
    async function join(id) { try { await FKApi.joinAlliance(id); await render(); } catch(e){ alert(e.message);} }
    render();
  </script>
</body>
</html>
