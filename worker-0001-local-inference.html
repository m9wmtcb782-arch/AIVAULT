<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT Worker-001 真實推論</title><style>body{font:16px system-ui;background:#0b1424;color:#eef;padding:18px;max-width:680px;margin:auto}button,textarea{font:inherit;padding:12px;border-radius:9px;margin:8px 0}textarea{width:95%;min-height:90px}button{background:#2674d9;color:white;border:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#18283f;padding:12px;border-radius:9px}</style><h2>Worker-001｜本機推論驗證</h2><p>只在此裝置執行開放權重 Qwen3-0.6B。無 Gemini、Grok、Kling 或付費 API。未通過測試不會標記代理已啟用。</p><textarea id="question">請用繁體中文說明什麼是推論引擎。</textarea><p><button id="load">載入模型（可能下載數百 MB）</button> <button id="ask" disabled>真正生成回答</button></p><p id="status">未載入，未驗證</p><pre id="answer"></pre><button id="copy" disabled>複製驗證報告</button><button id="copylog">複製診斷紀錄</button><pre id="log"></pre><script type="module">const $=id=>document.getElementById(id);let model=null;let verified=null;let adapterInfo='not_checked';const log=s=>$('log').textContent+=s+'\n';$('load').onclick=async()=>{if(!confirm('確定在本機下載並載入 Qwen3-0.6B？可能耗用數百 MB 網路及記憶體。'))return;$('load').disabled=true;$('status').textContent='載入中（尚未驗證）';try{if(!navigator.gpu)throw Error('WebGPU API 不存在');const adapter=await navigator.gpu.requestAdapter();if(!adapter)throw Error('此裝置無可用 WebGPU adapter；不冒充推論成功');adapterInfo='webgpu_adapter_available';log('WebGPU adapter 已取得');const {pipeline}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');model=await pipeline('text-generation','onnx-community/Qwen3-0.6B-ONNX',{device:'webgpu',dtype:'q4f16',progress_callback:p=>{if(p.status==='progress'&&Number.isFinite(p.progress))$('status').textContent='模型下載 '+Math.round(p.progress)+'%（仍未驗證）'}});$('status').textContent='模型載入完成，等待真實回答驗證';$('ask').disabled=false}catch(e){$('status').textContent='BLOCKED：模型無法載入';log('診斷環境：'+adapterInfo+' | '+navigator.userAgent);log(String(e.stack||e))}finally{$('load').disabled=false}};$('ask').onclick=async()=>{if(!model)return;const question=$('question').value.trim();if(!question)return;$('ask').disabled=true;$('answer').textContent='生成中…';const t=performance.now();try{const out=await model([{role:'system',content:'使用繁體中文回答。'},{role:'user',content:question}],{max_new_tokens:160,do_sample:false});const item=out?.[0]?.generated_text;const answer=typeof item==='string'?item:Array.isArray(item)?item.filter(x=>x.role==='assistant').map(x=>x.content).join('\n'):'';if(!answer.trim()||answer.trim()===question)throw Error('模型未返回有效的回答');$('answer').textContent=answer;verified={worker:'Worker-001',model:'onnx-community/Qwen3-0.6B-ONNX',backend:'webgpu/q4f16',question,answer,elapsed_ms:Math.round(performance.now()-t),verified_at:new Date().toISOString(),result:'LOCAL_INFERENCE_PASS_BROWSER_ONLY'};$('copy').disabled=false;$('status').textContent='LOCAL_INFERENCE_PASS：Worker-001 本機生成完成（不代表其他代理已啟用）';log('耗時 '+verified.elapsed_ms+' ms')}catch(e){verified=null;$('copy').disabled=true;$('answer').textContent='';$('status').textContent='INFERENCE_FAILED';log(String(e.stack||e))}finally{$('ask').disabled=false}};$('copylog').onclick=async()=>{try{await navigator.clipboard.writeText($('status').textContent+'\n'+$('log').textContent);log('診斷紀錄已複製')}catch(e){log('複製失敗：'+String(e))}};$('copy').onclick=async()=>{if(!verified)return;const report=JSON.stringify(verified,null,2);try{await navigator.clipboard.writeText(report);log('已複製含真實回答的驗證報告')}catch(e){log('無法自動複製：'+String(e));$('log').textContent+='\n'+report}};</script></html>
