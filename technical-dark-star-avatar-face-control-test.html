<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AIVAULT｜暗星 Native Face Control Proof</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#070a0f;color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}body{display:flex;flex-direction:column;overflow:hidden}.top{padding:13px 15px;border-bottom:1px solid #202733;background:#0b0f16}.title{font-size:18px;font-weight:700}.sub{font-size:12px;color:#94a0b2;margin-top:4px}.main{position:relative;flex:1;min-height:0}#stage{position:absolute;inset:0}canvas{display:block;width:100%;height:100%}.panel{position:absolute;left:10px;right:10px;bottom:10px;max-height:58%;overflow:auto;background:rgba(8,12,18,.93);backdrop-filter:blur(12px);border:1px solid #293342;border-radius:14px;padding:11px;font-size:12px;line-height:1.45}.ok{color:#72e6a2}.warn{color:#ffd36b}.err{color:#ff7b8a}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #202733;padding:4px 0}.name{color:#d9e1ec;word-break:break-all}.value{color:#8fd3ff;text-align:right;word-break:break-all}.group{margin-top:9px;color:#fff;font-weight:700}.buttons{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.buttons button{border:1px solid #344054;background:#151b25;color:#eef2f7;border-radius:9px;padding:7px 9px;font-size:12px}.morph{margin-top:7px}.morph label{display:flex;justify-content:space-between;color:#cbd5e1}.morph input{width:100%}.note{margin-top:8px;color:#93a0b3;font-size:11px}
</style>
</head>
<body>
<div class="top"><div class="title">AIVAULT｜Technical Dark Star 原生臉部控制 Proof</div><div class="sub">獨立測試頁｜不修改正式暗星｜先驗證同一個 3D 模型能否直接控制 Morph Target</div></div>
<div class="main"><div id="stage"></div><div class="panel"><div id="status" class="warn">正在載入本地 Three.js 與 AIVAULT GLB…</div><div id="info"></div><div id="controls"></div><div class="note">這一頁只測原生 Mesh / Morph Target。若模型沒有臉部 Morph，下一步改用正式 VRM + three-vrm 成功案例，不做假眼睛或圖片疊加。</div></div></div>
<script type="module">
import * as THREE from './vendor/three/three.module.js';
import {GLTFLoader} from './vendor/three/examples/jsm/loaders/GLTFLoader.js';

const MODEL='./assets/dark-star/technical-dark-star-avatar.glb';
const stage=document.getElementById('stage');
const status=document.getElementById('status');
const info=document.getElementById('info');
const controls=document.getElementById('controls');
let scene,camera,renderer,root,clock,mixer;
const morphItems=[];
function row(k,v){return `<div class="row"><span class="name">${k}</span><span class="value">${String(v).replaceAll('&','&amp;').replaceAll('<','&lt;')}</span></div>`}
function setStatus(t,c='warn'){status.className=c;status.textContent=t}
function escapeHtml(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function findMorphs(){
 const out=[];
 root.traverse(o=>{
  if(!o.isMesh || !o.morphTargetDictionary || !o.morphTargetInfluences)return;
  for(const [name,index] of Object.entries(o.morphTargetDictionary))out.push({mesh:o,name,index,influence:o.morphTargetInfluences[index]||0});
 });
 return out;
}
function addMorphControl(item){
 const wrap=document.createElement('div');wrap.className='morph';
 const label=document.createElement('label');label.innerHTML=`<span>${escapeHtml(item.name)}</span><span id="v-${morphItems.length}">0.00</span>`;
 const input=document.createElement('input');input.type='range';input.min='0';input.max='1';input.step='0.01';input.value='0';
 input.addEventListener('input',()=>{const v=Number(input.value);item.mesh.morphTargetInfluences[item.index]=v;label.lastElementChild.textContent=v.toFixed(2)});
 wrap.append(label,input);controls.appendChild(wrap);
 morphItems.push(item);
}
function resetFace(){for(const item of morphItems){item.mesh.morphTargetInfluences[item.index]=0;const el=controls.querySelector(`#v-${morphItems.indexOf(item)}`);if(el)el.textContent='0.00';const sliders=controls.querySelectorAll('input[type=range]');const i=morphItems.indexOf(item);if(sliders[i])sliders[i].value='0'}}
function presetButton(text,matcher){const b=document.createElement('button');b.textContent=text;b.onclick=()=>{for(const item of morphItems){const hit=matcher(item.name.toLowerCase());item.mesh.morphTargetInfluences[item.index]=hit?1:0}controls.querySelectorAll('input[type=range]').forEach((s,i)=>{s.value=matcher(morphItems[i].name.toLowerCase())?'1':'0'});controls.querySelectorAll('[id^="v-"]').forEach((e,i)=>e.textContent=matcher(morphItems[i].name.toLowerCase())?'1.00':'0.00')};return b}
async function boot(){
 try{
  scene=new THREE.Scene();scene.background=new THREE.Color(0x070a0f);
  camera=new THREE.PerspectiveCamera(35,stage.clientWidth/stage.clientHeight,.01,1000);
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(stage.clientWidth,stage.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xffffff,0x263041,2.0));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(2,4,4);scene.add(key);const fill=new THREE.DirectionalLight(0x9ec8ff,1.5);fill.position.set(-3,2,1);scene.add(fill);
  setStatus('Three.js GPU renderer 已建立，正在解析 AIVAULT GLB…');
  const loader=new GLTFLoader();const gltf=await loader.loadAsync(MODEL);root=gltf.scene;scene.add(root);
  const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());root.position.sub(center);root.position.y+=size.y*.5;
  const max=Math.max(size.x,size.y,size.z)||1;camera.position.set(0,max*.38,max*2.25);camera.lookAt(0,max*.45,0);
  if(gltf.animations?.length){mixer=new THREE.AnimationMixer(root);gltf.animations.forEach(a=>mixer.clipAction(a).play())}
  const morphs=findMorphs();
  let meshes=0,skinned=0,bones=0;root.traverse(o=>{if(o.isMesh)meshes++;if(o.isSkinnedMesh)skinned++;if(o.isBone)bones++});
  info.innerHTML=row('GLB','解析成功')+row('Mesh',meshes)+row('SkinnedMesh',skinned)+row('Bones',bones)+row('Animations',gltf.animations?.length||0)+row('原生 Morph Target',morphs.length);
  if(morphs.length){
   setStatus('✅ 找到原生 Morph Target，可以直接測臉部控制。','ok');
   const title=document.createElement('div');title.className='group';title.textContent='快速臉部測試';controls.appendChild(title);
   const quick=document.createElement('div');quick.className='buttons';
   quick.append(presetButton('眨眼',n=>/blink|eye.?close|eye.?blink/.test(n)),presetButton('張嘴',n=>/mouth|jaw|aa|ih|ou|ee|oh/.test(n)),presetButton('開心',n=>/happy|smile|joy/.test(n)),presetButton('生氣',n=>/angry|frown|mad/.test(n)));
   const reset=document.createElement('button');reset.textContent='全部重置';reset.onclick=resetFace;quick.appendChild(reset);controls.appendChild(quick);
   const title2=document.createElement('div');title2.className='group';title2.textContent='全部原生 Morph Target';controls.appendChild(title2);
   morphs.forEach(addMorphControl);
  }else{
   setStatus('⚠️ 這個 GLB 沒有可用的 Morph Target。這不是失敗：3D 引擎已成功，但這個模型不適合做原生臉部控制。下一步直接採用 VRM + three-vrm。','warn');
  }
  clock=new THREE.Clock();animate();
 }catch(e){console.error(e);setStatus('❌ 解析失敗：'+(e?.message||e),'err');info.innerHTML=row('錯誤',e?.stack||e)}
}
function animate(){requestAnimationFrame(animate);if(mixer)mixer.update(clock.getDelta());renderer.render(scene,camera)}
addEventListener('resize',()=>{if(!renderer)return;camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();renderer.setSize(stage.clientWidth,stage.clientHeight)});
boot();
</script>
</body></html>
