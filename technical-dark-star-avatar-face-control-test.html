<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AIVAULT｜暗星 Native Face Control Proof</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#070a0f;color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}body{display:flex;flex-direction:column;overflow:hidden}.top{padding:13px 15px;border-bottom:1px solid #202733;background:#0b0f16}.title{font-size:18px;font-weight:700}.sub{font-size:12px;color:#94a0b2;margin-top:4px}.main{position:relative;flex:1;min-height:0}#stage{position:absolute;inset:0}.panel{position:absolute;left:10px;right:10px;bottom:10px;max-height:58%;overflow:auto;background:rgba(8,12,18,.93);border:1px solid #293342;border-radius:14px;padding:11px;font-size:12px;line-height:1.45}.ok{color:#72e6a2}.warn{color:#ffd36b}.err{color:#ff7b8a}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #202733;padding:4px 0}.name{color:#d9e1ec;word-break:break-all}.value{color:#8fd3ff;text-align:right;word-break:break-all}.group{margin-top:9px;color:#fff;font-weight:700}.buttons{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.buttons button{border:1px solid #344054;background:#151b25;color:#eef2f7;border-radius:9px;padding:7px 9px;font-size:12px}.morph{margin-top:7px}.morph label{display:flex;justify-content:space-between}.morph input{width:100%}.note{margin-top:8px;color:#93a0b3;font-size:11px}</style></head><body><div class="top"><div class="title">AIVAULT｜Technical Dark Star 原生臉部控制 Proof</div><div class="sub">獨立測試頁｜逐步驗證本地 Three.js → GLTFLoader → AIVAULT GLB</div></div><div class="main"><div id="stage"></div><div class="panel"><div id="status" class="warn">① JavaScript 已啟動，準備載入本地 Three.js…</div><div id="info"></div><div id="controls"></div><div class="note">只測真正 Mesh / Bone / Morph Target，不做假眼睛或圖片疊加。</div></div></div><script>const MODEL='./assets/dark-star/technical-dark-star-avatar.glb',THREE_URL='./vendor/three/three.module.js',LOADER_URL='./vendor/three/examples/jsm/loaders/GLTFLoader.js';const stage=document.getElementById('stage'),status=document.getElementById('status'),info=document.getElementById('info'),controls=document.getElementById('controls');let THREE,scene,camera,renderer,root,clock,mixer;const morphItems=[];function setStatus(t,c='warn'){status.className=c;status.textContent=t}function row(k,v){return '<div class="row"><span class="name">'+String(k).replaceAll('<','&lt;')+'</span><span class="value">'+String(v).replaceAll('&','&amp;').replaceAll('<','&lt;')+'</span></div>'}function findMorphs(){const a=[];root.traverse(o=>{if(o.isMesh&&o.morphTargetDictionary&&o.morphTargetInfluences)for(const [name,index] of Object.entries(o.morphTargetDictionary))a.push({mesh:o,name,index})});return a}function addMorph(x){const i=morphItems.length,w=document.createElement('div');w.className='morph';w.innerHTML='<label><span>'+x.name+'</span><span id="mv'+i+'">0.00</span></label>';const s=document.createElement('input');s.type='range';s.min=0;s.max=1;s.step=.01;s.value=0;s.oninput=()=>{const v=+s.value;x.mesh.morphTargetInfluences[x.index]=v;document.getElementById('mv'+i).textContent=v.toFixed(2)};w.appendChild(s);controls.appendChild(w);morphItems.push(x)}async function boot(){try{setStatus('② 正在載入本地 Three.js…');THREE=await import(THREE_URL);setStatus('③ Three.js 成功，正在載入 GLTFLoader…','ok');const {GLTFLoader}=await import(LOADER_URL);setStatus('④ GLTFLoader 成功，正在建立 GPU Renderer…','ok');scene=new THREE.Scene();scene.background=new THREE.Color(0x070a0f);camera=new THREE.PerspectiveCamera(35,1,.01,1000);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(stage.clientWidth,stage.clientHeight);stage.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x263041,2));setStatus('⑤ GPU Renderer 成功，正在解析 AIVAULT GLB…','ok');const gltf=await new GLTFLoader().loadAsync(MODEL);root=gltf.scene;scene.add(root);const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());root.position.sub(center);const max=Math.max(size.x,size.y,size.z)||1;camera.position.set(0,max*.38,max*2.25);camera.lookAt(0,max*.45,0);if(gltf.animations?.length){mixer=new THREE.AnimationMixer(root);gltf.animations.forEach(a=>mixer.clipAction(a).play())}let meshes=0,skinned=0,bones=0;root.traverse(o=>{if(o.isMesh)meshes++;if(o.isSkinnedMesh)skinned++;if(o.isBone)bones++});const morphs=findMorphs();info.innerHTML=row('GLB','解析成功')+row('Mesh',meshes)+row('SkinnedMesh',skinned)+row('Bones',bones)+row('Animations',gltf.animations?.length||0)+row('原生 Morph Target',morphs.length);if(morphs.length){setStatus('⑥ ✅ 找到原生 Morph Target，可以開始臉部控制。','ok');const g=document.createElement('div');g.className='group';g.textContent='全部原生 Morph Target';controls.appendChild(g);morphs.forEach(addMorph)}else setStatus('⑥ ⚠️ GLB 沒有原生 Morph Target；3D 引擎成功，但這個模型不適合臉控。','warn');clock=new THREE.Clock();animate()}catch(e){console.error(e);setStatus('❌ 載入失敗：'+(e&&e.message||e),'err');info.innerHTML=row('錯誤',e&&e.stack||e)+row('Three.js',THREE_URL)+row('GLTFLoader',LOADER_URL)}}function animate(){requestAnimationFrame(animate);try{if(mixer)mixer.update(clock.getDelta());renderer.render(scene,camera)}catch(e){setStatus('❌ GPU render：'+e.message,'err')}}addEventListener('resize',()=>{if(renderer){camera.aspect=stage.clientWidth/Math.max(1,stage.clientHeight);camera.updateProjectionMatrix();renderer.setSize(stage.clientWidth,stage.clientHeight)}});boot();</script></body></html>
