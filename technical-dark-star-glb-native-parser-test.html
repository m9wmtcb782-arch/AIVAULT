<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AIVAULT｜GLB Native Parser Proof</title><style>html,body{margin:0;height:100%;background:#070a0f;color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}body{padding:18px}.title{font-size:19px;font-weight:700}.status{margin-top:10px;padding:12px;border:1px solid #293342;border-radius:12px;background:#0b0f16;line-height:1.5}.ok{color:#72e6a2}.err{color:#ff7b8a}.warn{color:#ffd36b}.row{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid #202733}.name{color:#aeb9c8}.value{text-align:right;color:#8fd3ff;word-break:break-all}.note{margin-top:14px;color:#93a0b3;font-size:12px;line-height:1.5}</style></head><body><div class="title">AIVAULT｜Technical Dark Star GLB Native Parser</div><div id="status" class="status">① 正在啟動原生 JavaScript GLB Parser…</div><div id="info"></div><div class="note">這一頁完全不使用 Three.js、ES Module 或 GLTFLoader。直接讀取 AIVAULT 自有 GLB，確認模型本身的 Mesh、Skin、Animation、Morph Target 資料。</div><script>const MODEL='./assets/dark-star/technical-dark-star-avatar.glb';const status=document.getElementById('status'),info=document.getElementById('info');function esc(x){return String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function row(k,v){return '<div class="row"><span class="name">'+esc(k)+'</span><span class="value">'+esc(v)+'</span></div>'}async function run(){try{status.textContent='② 正在直接取得 AIVAULT GLB…';const r=await fetch(MODEL,{cache:'no-store'});if(!r.ok)throw new Error('GLB HTTP '+r.status);const b=await r.arrayBuffer();if(b.byteLength<20)throw new Error('GLB 太小');const dv=new DataView(b);const magic=dv.getUint32(0,true);const version=dv.getUint32(4,true);const length=dv.getUint32(8,true);if(magic!==0x46546c67)throw new Error('GLB Magic 不正確');if(version!==2)throw new Error('GLB Version '+version+' 不支援');let p=12,json=null,binBytes=0;while(p+8<=b.byteLength){const chunkLen=dv.getUint32(p,true),type=dv.getUint32(p+4,true);p+=8;if(p+chunkLen>b.byteLength)throw new Error('GLB chunk 超出檔案範圍');if(type===0x4e4f534a){const text=new TextDecoder().decode(new Uint8Array(b,p,chunkLen));json=JSON.parse(text.replace(/\u0000+$/g,''))}else if(type===0x004e4942){binBytes=chunkLen}p+=chunkLen}if(!json)throw new Error('找不到 JSON chunk');const meshes=json.meshes||[],nodes=json.nodes||[],skins=json.skins||[],animations=json.animations||[],materials=json.materials||[],textures=json.textures||[],images=json.images||[],accessors=json.accessors||[];let primitives=0,morphTargets=0,morphNames=[];for(const m of meshes){for(const pr of (m.primitives||[])){primitives++;const targets=pr.targets||[];if(targets.length){morphTargets+=targets.length;for(let i=0;i<targets.length;i++)morphNames.push((m.name||'mesh')+' / Morph '+i)}}}const nodeNames=nodes.map(n=>n.name).filter(Boolean);const skinJoints=skins.reduce((n,s)=>n+(s.joints?.length||0),0);info.innerHTML=row('HTTP','200')+row('檔案大小',b.byteLength.toLocaleString()+' bytes')+row('GLB Version',version)+row('JSON bytes',JSON.stringify(json).length.toLocaleString())+row('BIN bytes',binBytes.toLocaleString())+row('Nodes',nodes.length)+row('Meshes',meshes.length)+row('Primitives',primitives)+row('Materials',materials.length)+row('Textures',textures.length)+row('Images',images.length)+row('Skins',skins.length)+row('Skin Joints',skinJoints)+row('Animations',animations.length)+row('Morph Target groups',morphTargets);if(morphNames.length)info.innerHTML+=row('Morph Target names',morphNames.join(' | '));status.className='status '+(morphTargets?'ok':'warn');status.textContent=morphTargets?'③ ✅ 原生 Parser 成功，而且 GLB 含 Morph Target！可以進入真正臉部控制。':'③ ⚠️ 原生 Parser 成功，但這個 GLB 沒有 Morph Target。3D 檔案正常，下一步應換正式 VRM/ARKit 52 模型。'}catch(e){status.className='status err';status.textContent='❌ '+(e.message||e);info.innerHTML=row('錯誤',e.stack||e)}}run();</script></body></html>
