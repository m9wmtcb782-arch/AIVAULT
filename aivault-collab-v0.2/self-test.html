<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT Collaboration Pool · Self Test</title><style>body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;margin:0;background:#fff;color:#0f172a;padding:20px}main{max-width:900px;margin:auto}h1{font-size:22px}.summary{padding:14px;border:1px solid #e2e8f0;border-radius:12px;margin:12px 0}.pass{color:#15803d}.fail{color:#b91c1c}.item{padding:9px 0;border-bottom:1px solid #e2e8f0}.muted{color:#64748b;font-size:12px}button{padding:10px 14px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;cursor:pointer}</style></head><body><main><h1>🧪 AIVAULT Collaboration Pool 自我測試</h1><div class="muted">測試 Engine 的 Task → Agent → Message → Review → Fix → Test → Gate → Event 流程。不呼叫外部 AI、不需要 API Key。</div><div class="summary" id="summary">測試中…</div><div id="results"></div><button id="rerun">重新測試</button></main><script src="app.js"></script><script>(function(){'use strict';const $=id=>document.getElementById(id);function run(){const results=window.AIVAULT_COLLAB.Engine?window.AIVAULT_COLLAB.Engine.prototype.runAcceptance.call(new window.AIVAULT_COLLAB.Engine(new window.AIVAULT_COLLAB.MemoryAdapter())):[];const passed=results.filter(x=>x.ok).length;const total=results.length;$('summary').innerHTML='<strong>'+passed+'/'+total+'</strong> 通過'+(passed===total?' · <span class="pass">PASS</span>':' · <span class="fail">FAIL</span>');$('results').innerHTML=results.map(x=>'<div class="item '+(x.ok?'pass':'fail')+'">'+(x.ok?'✓':'✗')+' '+escapeHtml(x.name)+' — '+escapeHtml(x.detail)+'</div>').join('')}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('rerun').onclick=run;run()})();</script></body></html>
