<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIVAULT 稅務指揮中心｜第一基地</title>
<style>
:root{--bg:#050a14;--panel:#0a1628;--panel-border:#1a3a5c;--cyan:#00e5ff;--text:#d0e8ff;--muted:#6a8aaa;--warn:#ffaa00;--ok:#00ff88}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft JhengHei",sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:#061020;border-bottom:1px solid var(--panel-border)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:2px}
.logo-icon{width:32px;height:32px;border:2px solid var(--cyan);border-radius:50%;display:grid;place-items:center;color:var(--cyan)}
.layout{display:grid;grid-template-columns:180px 1fr 240px;gap:12px;padding:12px}
.sidebar{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;padding:12px}
.nav-item{padding:10px 12px;margin:4px 0;border-radius:6px;color:var(--muted)}
.nav-item.active{background:#0d2840;color:var(--cyan)}
.panel{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;padding:12px;margin-bottom:12px}
.panel h3{font-size:0.75rem;color:var(--cyan);letter-spacing:1px;margin-bottom:8px}
.stat{display:flex;justify-content:space-between;font-size:0.8rem;padding:3px 0;border-bottom:1px solid #0d2840}
.badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:0.65rem;background:#0d2840}
.badge.ok{background:#003322;color:var(--ok)}
.badge.warn{background:#332200;color:var(--warn)}
.orb-wrap{display:grid;place-items:center;padding:16px 0}
.orb{width:160px;height:160px;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 40% 40%,#0d2840,#050a14 70%);border:2px solid #1a3a5c}
.orb-ring{position:absolute;inset:-10px;border-radius:50%;border:3px solid transparent;pointer-events:none;animation:pulse 2.4s ease-in-out infinite}
.orb.green .orb-ring{border-color:#00ff88;box-shadow:0 0 20px #00ff88}
.orb.yellow .orb-ring{border-color:#ffaa00;box-shadow:0 0 20px #ffaa00}
.orb.red .orb-ring{border-color:#ff4466;box-shadow:0 0 20px #ff4466}
.orb-label{text-align:center;z-index:1}
.orb-label .score{font-size:1.8rem;font-weight:700}
.orb-label .sub{font-size:0.65rem;color:var(--muted)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.04);opacity:1}}
.safety-btns{display:flex;gap:6px;justify-content:center;margin-top:6px}
.safety-btns button{font-size:0.7rem;padding:4px 8px;border-radius:4px;cursor:pointer;border:1px solid var(--panel-border);background:#0d2840;color:var(--text)}
.disclaimer{background:#1a1200;color:#ffaa00;padding:6px 12px;text-align:center;font-size:0.75rem;border-bottom:1px solid #332200}
.right-col{display:flex;flex-direction:column;gap:12px}
.feed-item{font-size:0.75rem;padding:5px 0;border-bottom:1px solid #0d2840}
.feed-item.ok{color:var(--ok)}
.feed-item.warn{color:var(--warn)}
</style>
</head>
<body>
<div class="disclaimer">【原型展示】多模型推理。非單一規則。純前端模擬，必須人工覆核。</div>
<header>
  <div class="logo"><div class="logo-icon">◈</div><div><div>AIVAULT</div><div style="font-size:0.65rem;color:var(--muted)">TAX COMMAND CENTER</div></div></div>
  <span class="badge ok">12 ENGINES</span>
</header>
<div class="layout">
  <aside class="sidebar">
    <div class="nav-item active" style="font-weight:700;color:var(--cyan);border:1px solid #0088aa;margin-bottom:8px">◈ AI 財稅模擬</div>
    <div class="nav-item">▣ Command Center</div>
    <div class="nav-item">◎ Tax Core</div>
    <div class="nav-item">▤ Scenarios</div>
  </aside>
  <main>
    <div class="panel">
      <h3>安全指數 · SAFETY INDEX</h3>
      <div class="orb-wrap">
        <div id="orb" class="orb green">
          <div class="orb-ring"></div>
          <div class="orb-label"><div class="score" id="scoreVal">92</div><div class="sub" id="scoreLabel">安全</div></div>
        </div>
      </div>
      <div class="safety-btns">
        <button onclick="setSafety(92,'green','安全')">綠</button>
        <button onclick="setSafety(68,'yellow','注意')">黃</button>
        <button onclick="setSafety(34,'red','風險')">紅</button>
      </div>
    </div>
    <div class="panel">
      <h3>12 推理引擎</h3>
      <div id="engines" style="font-size:0.75rem"></div>
    </div>
  </main>
  <aside class="right-col">
    <div class="panel">
      <h3>STATUS</h3>
      <div class="feed-item ok">12 引擎已載入</div>
      <div class="feed-item">稅務：邏輯、數學、因果、機率、時間、常識、策略、協作</div>
      <div class="feed-item">非單一規則推理</div>
      <div class="feed-item warn">必須人工覆核</div>
    </div>
  </aside>
</div>
<script>
const ENGINES = [
  {id:1,name:"邏輯與法律",tax:true},
  {id:2,name:"數學與財稅",tax:true},
  {id:3,name:"因果分析",tax:true},
  {id:4,name:"機率與風險",tax:true},
  {id:5,name:"時間與趨勢",tax:true},
  {id:6,name:"空間與地理",tax:false},
  {id:7,name:"常識與判斷",tax:true},
  {id:8,name:"科學研究",tax:false},
  {id:9,name:"多模態感知",tax:false},
  {id:10,name:"程式工程",tax:false},
  {id:11,name:"策略規劃",tax:true},
  {id:12,name:"多 AI 協作",tax:true}
];
document.getElementById('engines').innerHTML = ENGINES.map(e =>
  `<div class="stat"><span>${e.id}. ${e.name}</span>${e.tax?'<span class="badge ok">稅務</span>':'<span class="badge">其他</span>'}</div>`
).join('');
function setSafety(val, level, label) {
  document.getElementById('orb').className = 'orb ' + level;
  document.getElementById('scoreVal').textContent = val;
  document.getElementById('scoreLabel').textContent = label;
}
</script>
</body>
</html>
