<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIVAULT 稅務指揮中心</title>
<style>
:root{--bg:#050a14;--panel:#0a1628;--panel-border:#1a3a5c;--cyan:#00e5ff;--text:#d0e8ff;--muted:#6a8aaa;--warn:#ffaa00;--ok:#00ff88}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft JhengHei",sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#061020;border-bottom:1px solid var(--panel-border)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:1px}
.logo-icon{width:28px;height:28px;border:2px solid var(--cyan);border-radius:50%;display:grid;place-items:center;color:var(--cyan);font-size:0.9rem}
.layout{display:grid;grid-template-columns:160px 1fr 220px;gap:10px;padding:10px}
.sidebar{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;padding:10px}
.nav-item{padding:8px 10px;margin:3px 0;border-radius:6px;color:var(--muted);font-size:0.85rem}
.nav-item.active{background:#0d2840;color:var(--cyan)}
.panel{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;padding:10px;margin-bottom:10px}
.panel h3{font-size:0.7rem;color:var(--cyan);letter-spacing:1px;margin-bottom:6px}
.orb{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 40% 40%,#0d2840,#050a14 70%);border:2px solid #1a3a5c;cursor:pointer}
.orb-ring{position:absolute;inset:-6px;border-radius:50%;border:2px solid transparent;pointer-events:none;animation:pulse 2.4s ease-in-out infinite}
.orb.green .orb-ring{border-color:#00ff88;box-shadow:0 0 12px #00ff88}
.orb.yellow .orb-ring{border-color:#ffaa00;box-shadow:0 0 12px #ffaa00}
.orb.red .orb-ring{border-color:#ff4466;box-shadow:0 0 12px #ff4466}
.orb-label .score{font-size:0.75rem;font-weight:700}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.05);opacity:1}}
.disclaimer{background:#1a1200;color:#ffaa00;padding:5px 10px;text-align:center;font-size:0.7rem;border-bottom:1px solid #332200}
.right-col{display:flex;flex-direction:column;gap:10px}
.feed-item{font-size:0.7rem;padding:4px 0;border-bottom:1px solid #0d2840}
.feed-item.ok{color:var(--ok)}
.feed-item.warn{color:var(--warn)}
.badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:0.6rem;background:#0d2840}
.badge.ok{background:#003322;color:var(--ok)}
</style>
</head>
<body>
<div class="disclaimer">【原型】NCL 統籌 · 人類觀察 · 點擊光圈查看趨勢 · 改善防範</div>
<header>
  <div class="logo"><div class="logo-icon">◈</div><div><div>AIVAULT</div><div style="font-size:0.6rem;color:var(--muted)">TAX COMMAND</div></div></div>
  <span class="badge ok">NCL</span>
</header>
<div class="layout">
  <aside class="sidebar">
    <div class="nav-item active" style="font-weight:700;color:var(--cyan);border:1px solid #0088aa;margin-bottom:6px">◈ AI 財稅模擬</div>
    <div class="nav-item">▣ Command</div>
    <div class="nav-item">◎ Tax Core</div>
  </aside>
  <main>
    <div class="panel">
      <h3>12 推理引擎 · 點擊光圈</h3>
      <div id="engineOrbs" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;justify-items:center"></div>
    </div>
    <div id="chartPanel" class="panel" style="display:none">
      <h3 id="chartTitle">趨勢</h3>
      <canvas id="trendCanvas" width="280" height="120" style="width:100%;background:#050a14;border-radius:6px"></canvas>
      <div id="chartNote" style="font-size:0.7rem;color:var(--muted);margin-top:4px"></div>
    </div>
  </main>
  <aside class="right-col">
    <div class="panel">
      <h3>STATUS</h3>
      <div class="feed-item ok">NCL 統籌 12 引擎</div>
      <div class="feed-item">點擊光圈查看趨勢</div>
      <div class="feed-item">人類觀察 · 改善防範</div>
      <div class="feed-item warn">必須人工覆核</div>
    </div>
  </aside>
</div>
<script>
const ENGINES = [
  {id:1,name:"邏輯",score:88,level:"green"},
  {id:2,name:"數學",score:92,level:"green"},
  {id:3,name:"因果",score:76,level:"yellow"},
  {id:4,name:"機率",score:64,level:"yellow"},
  {id:5,name:"時間",score:81,level:"green"},
  {id:6,name:"空間",score:70,level:"yellow"},
  {id:7,name:"常識",score:85,level:"green"},
  {id:8,name:"科學",score:58,level:"red"},
  {id:9,name:"多模態",score:62,level:"yellow"},
  {id:10,name:"程式",score:90,level:"green"},
  {id:11,name:"策略",score:74,level:"yellow"},
  {id:12,name:"協作",score:83,level:"green"}
];
document.getElementById('engineOrbs').innerHTML = ENGINES.map(e => `
  <div onclick="showTrend(${e.id})" style="text-align:center;cursor:pointer">
    <div class="orb ${e.level}"><div class="orb-ring"></div>
      <div class="orb-label"><div class="score">${e.score}</div></div></div>
    <div style="font-size:0.6rem;margin-top:3px;color:var(--muted)">${e.name}</div>
  </div>
`).join('');
function showTrend(id) {
  const e = ENGINES.find(x => x.id === id);
  document.getElementById('chartPanel').style.display = 'block';
  document.getElementById('chartTitle').textContent = e.name + ' · 趨勢';
  document.getElementById('chartNote').textContent = 'NCL 統籌 · 人類觀察 · 改善防範';
  const c = document.getElementById('trendCanvas');
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  ctx.strokeStyle = e.level === 'red' ? '#ff4466' : (e.level === 'yellow' ? '#ffaa00' : '#00ff88');
  ctx.lineWidth = 2;
  ctx.beginPath();
  const pts = Array.from({length:12}, (_,i) => 35 + Math.sin(i*0.55 + id)*20 + (e.score-70)*0.25);
  pts.forEach((y,i) => {
    const x = 16 + i * 22;
    if (i === 0) ctx.moveTo(x, 120-y);
    else ctx.lineTo(x, 120-y);
  });
  ctx.stroke();
}
</script>
</body>
</html>
