<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>醫院</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body class="game-body">
  <div class="snow-layer"></div>
  <div class="app" id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/boot.js"></script>
  <script>
    async function render() {
      if (!(await FKAuth.requirePlayer())) return;
      const snap = await FKApi.snapshot();
      const a = snap.army;
      const w = ["warrior","archer","cavalry","mage"].map(k => `<div class="list-item"><span>${FKEngine.TROOPS[k].name}</span><b>${a["wounded_"+k]||0}</b></div>`).join("");
      const busy = a.healing && a.healing.finish_at > Date.now();
      document.getElementById("app").innerHTML = `
        <div class="page-head"><a class="back" href="game-city.html">← 返回</a><h2>醫院</h2></div>
        ${FKUI.top(snap)}
        <div class="panel">${w}
          ${busy ? `<div class="timer">治療中 ${FKUI.remain(a.healing.finish_at)}</div>` : ""}
          <button class="btn" onclick="heal()">全部治療</button>
          <button class="btn secondary" onclick="spd()">Coupons 加速</button>
        </div>${FKUI.nav("city")}`;
    }
    async function heal(){ try{ await FKApi.heal(); await render(); }catch(e){ alert(e.message);} }
    async function spd(){ try{ await FKApi.speedup("heal"); await render(); }catch(e){ alert(e.message);} }
    render(); setInterval(render, 1000);
  </script>
</body>
</html>
