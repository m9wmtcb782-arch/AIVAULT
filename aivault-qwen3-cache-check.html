<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT Qwen3 快取與載入環境檢查</title><style>body{background:#0b1020;color:#eef3ff;font:16px system-ui,-apple-system,sans-serif;padding:18px;max-width:720px;margin:auto;line-height:1.5}button{background:#4382ec;border:0;border-radius:12px;color:white;font-size:17px;padding:13px;margin:5px}pre{background:#172137;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:10px}small{color:#c6d0e3}</style></head><body><h2>AIVAULT Qwen3 無下載檢查</h2><p>此頁只讀取瀏覽器允許的儲存空間資訊、已保存的載入階段與快取索引。不下載模型，不清除資料，不啟動 GPU 推論。</p><button id="run">檢查快取與環境</button><button id="copy">複製結果</button><pre id="log">尚未檢查</pre><script>
const $=x=>document.getElementById(x);let lines=[];const say=s=>{$('log').textContent=(lines.push(s),lines.join('\n'))};const fmt=n=>typeof n==='number'?(n/1024/1024).toFixed(1)+' MiB':'未提供';
$('run').onclick=async()=>{lines=[];say('AIVAULT qwen3-cache-check-20261018-b');say('UA='+navigator.userAgent);say('WebGPU='+!!navigator.gpu);try{const s=JSON.parse(localStorage.getItem('aivault-qwen3-loader-stage-v1')||'null');say('上次模型載入階段='+JSON.stringify(s))}catch(e){say('階段讀取錯誤='+e.message)}
try{if(navigator.storage?.estimate){const x=await navigator.storage.estimate();say('此網站儲存空間已用='+fmt(x.usage));say('此網站儲存空間估計配額='+fmt(x.quota));say('注意：這不是手機剩餘 RAM，亦不保證所有跨網域快取都可見。')}else say('storage.estimate 不支援')}catch(e){say('儲存資訊錯誤='+e.message)}
try{if('caches' in window){const names=await caches.keys();say('Cache Storage 名稱數='+names.length);for(const name of names.slice(0,20)){const c=await caches.open(name);const keys=await c.keys();const model=keys.filter(k=>k.url.includes('Qwen3')||k.url.includes('model_q4f16'));say('快取 '+name+'：條目 '+keys.length+'；Qwen相關 '+model.length);
for(const request of keys.slice(0,30)){
  const url=new URL(request.url);
  const safePath=url.pathname;
  try{
    const response=await c.match(request);
    if(!response){say('項目：'+safePath+' | 找不到回應');continue}
    const len=response.headers.get('content-length');
    const range=response.headers.get('content-range');
    const type=response.headers.get('content-type');
    say('項目：'+safePath+' | status='+response.status+' | type='+(type||'未提供')+' | content-length='+(len||'未提供')+' | content-range='+(range||'未提供')+' | body='+!!response.body);
  }catch(e){say('項目：'+safePath+' | 檢查錯誤='+e.message)}
}}}else say('Cache Storage 不支援')}catch(e){say('快取索引讀取錯誤='+e.message)}
say('注意：Transformers.js 可能使用 Cache API、IndexedDB 或瀏覽器 HTTP 快取；本檢查不讀取大型回應本文；Content-Length 可能不存在或不代表實際完整位元組，不能單靠標頭證明檔案完整。');};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(lines.join('\n'));say('結果已複製')}catch(e){say('複製失敗：'+e.message)}};
</script></body></html>
