<h1>暗星・教材拍照解題</h1><p>拍下題目，暗星會搜尋後端已匯入的電子書，依教材分析並附上書名與頁碼。</p>
<section><label for="book">搜尋範圍</label><select id="book"><option value="">全部已匯入電子書</option></select><small id="catalogStatus">正在取得後端教材…</small><button id="refresh" type="button">重新載入教材</button>
<label for="photo">題目照片</label><input id="photo" type="file" accept="image/*" capture="environment"><small>手機可拍照或選擇照片；一次一張，請拍清楚題目與選項。</small><img id="preview" alt="題目照片預覽"><button id="recognize" disabled>辨識照片中的題目</button>
<label for="question">辨識題目（可修正）</label><textarea id="question" placeholder="先拍照辨識，或自行輸入題目。"></textarea>
<label for="terms">搜尋關鍵詞（可修正，以逗號分隔）</label><input id="terms" style="width:100%;padding:10px" placeholder="例如：比例原則、食品安全、風險評估">
<button id="search">只搜尋教材</button><button id="solve" disabled>搜尋教材並解題</button><p id="status" role="status" aria-live="polite"></p></section>
<section id="result" hidden><h2>暗星回答</h2><div id="answer"></div><h2>教材依據</h2><small>以下是電子書系統頁碼，可能與原書印刷頁碼不同。</small><div id="sources"></div></section>
