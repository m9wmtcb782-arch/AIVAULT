<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT｜角色語音庫</title><style>body{margin:0;background:#0b1120;color:#f1f5f9;font:16px system-ui,-apple-system,sans-serif}main{max-width:680px;margin:auto;padding:18px}h1{font-size:23px}.muted,small{color:#94a3b8}.panel{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.voice{background:#0f172a;color:#fff;text-align:left;border:1px solid #475569;border-radius:12px;padding:12px;min-height:85px}.voice[aria-pressed=true]{border:2px solid #a78bfa}button,input,select,textarea{font:inherit}input,select,textarea{box-sizing:border-box;width:100%;padding:11px;margin:6px 0 12px;background:#0f172a;color:white;border:1px solid #475569;border-radius:10px}button.secondary{background:#334155;color:#fff;border:1px solid #64748b;border-radius:10px;padding:12px;margin-left:8px}button.primary{background:#7c3aed;color:white;border:0;border-radius:10px;padding:12px}label{display:block}a{color:#c4b5fd}p{line-height:1.55}</style></head><body><main><small>AI 短視頻企劃中心 / AIVAULT Voice Engine</small><h1>🎙️ 角色語音庫</h1><p class="muted">Qwen3-TTS 模型尚未部署。以下為角色規格管理，不會使用系統電子聲音冒充模型。</p><section class="panel"><h2>24 種基礎聲線（六組各四種）</h2><div id="voices" class="grid"></div></section><section class="panel"><h2>新增角色規格</h2><label>角色名稱<input id="name" maxlength="60" placeholder="例如：林風"></label><label>角色類型<select id="kind"><option>成年男性</option><option>成年女性</option><option>老年男性</option><option>老年女性</option><option>男童</option><option>女童</option></select></label><label>聲音特徵<input id="desc" maxlength="180" placeholder="低沉、溫柔、略帶沙啞"></label><button class="primary" id="add">儲存角色規格</button></section><section class="panel"><h2>台詞與情緒</h2><label>選擇聲線<input id="selected" readonly></label><label>情緒<select id="emotion"><option>自然</option><option>喜悅</option><option>悲傷</option><option>憤怒</option><option>恐懼</option></select></label><label>台詞<textarea id="line" rows="3">孩子，你終於回來了。我一直在等你。</textarea></label><p id="status" role="status" class="muted">模型未連接，暫無試聽功能。</p><button class="primary" id="export">匯出角色設定 JSON</button><button class="secondary" id="addLine">加入分鏡對白</button><button class="secondary" id="checkTts">檢查 AI 語音引擎</button><p class="muted">接入測試：請輸入自行部署的 HTTPS 語音 Worker 網址。此設定不儲存，沒有預設付費服務。</p><label>自架語音 Worker HTTPS 網址<input id="ttsUrl" inputmode="url" autocomplete="off" placeholder="https://your-worker.example/synthesize"></label><button class="primary" id="generateTts">生成並試聽真實語音</button><audio id="ttsPlayer" controls preload="none" style="display:none;width:100%;margin-top:12px"></audio></section><section class="panel"><h2>分鏡配音清單</h2><p class="muted">依序記錄角色、情緒與台詞，可匯出給後續配音模型。尚未產生音訊。</p><div id="dialogues"></div><p class="muted">可替每段對白附上真實錄音檔（僅本次開啟頁面有效，不會上傳伺服器）。</p><button class="primary" id="exportScene">匯出分鏡配音 JSON</button><button class="secondary" id="clearScene">清空清單</button></section><p class="muted">目前是獨立測試模組，角色資料暫存此瀏覽器，尚未同步 Supabase。</p></main><script>
const seed=[{"id":"AV-M01","name":"成年男性","desc":"低沉磁性","emoji":"👨"},{"id":"AV-M02","name":"成年男性","desc":"陽光爽朗","emoji":"👨"},{"id":"AV-M03","name":"成年男性","desc":"溫柔斯文","emoji":"👨"},{"id":"AV-M04","name":"成年男性","desc":"冷峻威嚴","emoji":"👨"},{"id":"AV-F01","name":"成年女性","desc":"溫柔知性","emoji":"👩"},{"id":"AV-F02","name":"成年女性","desc":"成熟磁性","emoji":"👩"},{"id":"AV-F03","name":"成年女性","desc":"清冷高雅","emoji":"👩"},{"id":"AV-F04","name":"成年女性","desc":"熱情爽朗","emoji":"👩"},{"id":"AV-OM01","name":"老年男性","desc":"慈祥厚實","emoji":"👴"},{"id":"AV-OM02","name":"老年男性","desc":"滄桑沙啞","emoji":"👴"},{"id":"AV-OM03","name":"老年男性","desc":"嚴肅洪亮","emoji":"👴"},{"id":"AV-OM04","name":"老年男性","desc":"虛弱低緩","emoji":"👴"},{"id":"AV-OF01","name":"老年女性","desc":"慈祥溫暖","emoji":"👵"},{"id":"AV-OF02","name":"老年女性","desc":"滄桑低啞","emoji":"👵"},{"id":"AV-OF03","name":"老年女性","desc":"嚴厲有力","emoji":"👵"},{"id":"AV-OF04","name":"老年女性","desc":"優雅沉穩","emoji":"👵"},{"id":"AV-B01","name":"男童","desc":"活潑清亮","emoji":"👦"},{"id":"AV-B02","name":"男童","desc":"害羞輕柔","emoji":"👦"},{"id":"AV-B03","name":"男童","desc":"調皮沙啞","emoji":"👦"},{"id":"AV-B04","name":"男童","desc":"沉穩早熟","emoji":"👦"},{"id":"AV-G01","name":"女童","desc":"甜美清脆","emoji":"👧"},{"id":"AV-G02","name":"女童","desc":"活潑俏皮","emoji":"👧"},{"id":"AV-G03","name":"女童","desc":"文靜柔和","emoji":"👧"},{"id":"AV-G04","name":"女童","desc":"倔強明亮","emoji":"👧"}];const $=id=>document.getElementById(id);let custom=[];try{const v=JSON.parse(localStorage.getItem("aivault_ave_voices_v1")||"[]");if(Array.isArray(v))custom=v.slice(0,100)}catch{}let current=seed[0];function render(){const host=$("voices");host.replaceChildren();for(const v of [...seed,...custom]){const b=document.createElement("button");b.className="voice";b.setAttribute("aria-pressed",String(v.id===current.id));const title=document.createElement("strong");title.textContent=(v.emoji||"🎭")+" "+v.name;const sub=document.createElement("small");sub.textContent=v.desc||"自訂聲線";b.append(title,document.createElement("br"),sub);b.onclick=()=>{current=v;render()};host.append(b)}$("selected").value=current.name+" ("+current.id+")"}$("add").onclick=()=>{const name=$("name").value.trim();if(!name)return $("status").textContent="請填角色名稱";if(custom.length>=100)return $("status").textContent="已達本機 100 角色上限";const v={id:"AV-C-"+Date.now().toString(36),name,kind:$("kind").value,desc:$("desc").value.trim(),emoji:"🎭"};custom.push(v);current=v;try{localStorage.setItem("aivault_ave_voices_v1",JSON.stringify(custom));$("status").textContent="角色規格已儲存在本機瀏覽器"}catch{$("status").textContent="本機儲存失敗，僅保留在本頁"}render()};$("export").onclick=()=>{const data={voice:current,emotion:$("emotion").value,text:$("line").value,model:"Qwen3-TTS",status:"NOT_DEPLOYED"};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download="aivault-voice-spec.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};let scenes=[];try{const d=JSON.parse(localStorage.getItem("aivault_ave_scenes_v1")||"[]");if(Array.isArray(d))scenes=d.slice(0,100)}catch{}function persistScenes(){try{localStorage.setItem("aivault_ave_scenes_v1",JSON.stringify(scenes))}catch{$("status").textContent="儲存空間不足，請先匯出備份"}}let audioUrls={};function renderScenes(){const host=$("dialogues");host.replaceChildren();if(!scenes.length){host.textContent="尚未加入分鏡對白";return}scenes.forEach((s,i)=>{const p=document.createElement("p");p.textContent=(i+1)+". "+s.voice_name+"｜"+s.emotion+"｜"+s.text;const file=document.createElement("input");file.type="file";file.accept="audio/*";file.setAttribute("aria-label","為第 "+(i+1)+" 段選擇錄音");file.onchange=()=>{const f=file.files&&file.files[0];if(!f)return;if(f.size>25*1024*1024){$("status").textContent="錄音檔不可超過 25MB";return}if(!f.type.startsWith("audio/")){$("status").textContent="請選擇音訊檔";return}if(audioUrls[i])URL.revokeObjectURL(audioUrls[i]);audioUrls[i]=URL.createObjectURL(f);s.audio_status="LOCAL_AUDIO_ATTACHED";renderScenes()};p.append(file);if(audioUrls[i]){const a=document.createElement("audio");a.controls=true;a.preload="none";a.src=audioUrls[i];p.append(a)}const del=document.createElement("button");del.className="secondary";del.textContent="移除";del.onclick=()=>{if(audioUrls[i])URL.revokeObjectURL(audioUrls[i]);scenes.splice(i,1);audioUrls=Object.fromEntries(Object.entries(audioUrls).filter(([k])=>Number(k)!==i).map(([k,v])=>[Number(k)>i?Number(k)-1:Number(k),v]));persistScenes();renderScenes()};p.append(del);host.append(p)})}function downloadJson(name,data){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}$("addLine").onclick=()=>{const t=$("line").value.trim();if(!t)return $("status").textContent="請輸入台詞";if(scenes.length>=100)return $("status").textContent="清單最多 100 段";scenes.push({voice_id:current.id,voice_name:current.name,voice_description:current.desc,emotion:$("emotion").value,text:t,audio_status:"NOT_GENERATED"});persistScenes();renderScenes();$("status").textContent="已加入分鏡對白（尚未生成語音）"};$("exportScene").onclick=()=>downloadJson("aivault-scene-dialogues.json",{schema_version:1,voice_model:"Qwen3-TTS",model_status:"NOT_DEPLOYED",dialogues:scenes.map(s=>({...s,audio_status:s.audio_status==="LOCAL_AUDIO_ATTACHED"?"LOCAL_ONLY_NOT_EXPORTED":s.audio_status}))});$("clearScene").onclick=()=>{if(!confirm("確定清空分鏡配音清單？"))return;Object.values(audioUrls).forEach(u=>URL.revokeObjectURL(u));audioUrls={};scenes=[];persistScenes();renderScenes()};renderScenes();render();let generatedAudioUrl=null;$("generateTts").onclick=async()=>{const button=$("generateTts");if(button.disabled)return;const raw=$("ttsUrl").value.trim();let endpoint;try{endpoint=new URL(raw);if(endpoint.protocol!=="https:"||endpoint.username||endpoint.password||endpoint.hash||endpoint.search||endpoint.pathname!=="/synthesize")throw Error("INVALID_URL")}catch{$("status").textContent="請輸入完整 HTTPS 網址，路徑須為 /synthesize，不能包含帳密或查詢參數。";return}button.disabled=true;$("status").textContent="正在向自架 Worker 請求語音…";try{const adapter=await import("./aivault-role-voice-tts-adapter.mjs");const request=adapter.buildSynthesisRequest({voice_id:current.id,emotion:$("emotion").value,text:$("line").value});const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),60000);let response;try{response=await fetch(endpoint.href,{method:"POST",headers:{"Content-Type":"application/json","Accept":"audio/wav,audio/mpeg,audio/ogg,audio/webm,audio/mp4"},body:JSON.stringify(request),credentials:"omit",redirect:"error",cache:"no-store",signal:controller.signal})}finally{clearTimeout(timer)}if(!response.ok)throw Error("WORKER_HTTP_"+response.status);if(!/^audio\//i.test(response.headers.get("content-type")||""))throw Error("WORKER_DID_NOT_RETURN_AUDIO");if(Number(response.headers.get("content-length")||0)>25*1024*1024)throw Error("AUDIO_TOO_LARGE");const blob=await adapter.validateAudioResult({status:"READY",audio_blob:await response.blob()});if(generatedAudioUrl)URL.revokeObjectURL(generatedAudioUrl);generatedAudioUrl=URL.createObjectURL(blob);$("ttsPlayer").src=generatedAudioUrl;$("ttsPlayer").style.display="block";$("status").textContent="收到格式驗證通過的音訊；請實際試聽確認聲線與發音。"}catch(e){$("status").textContent="語音生成未完成："+e.message}finally{button.disabled=false}};$("checkTts").onclick=async()=>{try{const adapter=await import("./aivault-role-voice-tts-adapter.mjs");await adapter.synthesizeWithWorker({voice_id:current.id,emotion:$("emotion").value,text:$("line").value});$("status").textContent="語音引擎已連接"}catch(e){$("status").textContent=e.message==="TTS_WORKER_NOT_CONNECTED"?"尚未部署真正的 TTS Worker；24 種聲線目前僅為規格，無法生成語音。":"語音引擎檢查失敗："+e.message}};
</script></body></html>
