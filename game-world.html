<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>世界入口</title>
  <link rel="stylesheet" href="css/game.css" />
  <style>
    body { margin:0; background:#071018; color:#e8f4ff; font-family:sans-serif; }
    .panel { margin:16px; padding:16px; border:1px solid #3a5a70; border-radius:16px; background:#0c1c2c; }
    .btn { display:block; width:100%; margin:8px 0; padding:14px; border:0; border-radius:14px; font-weight:700; background:#8fd4ff; color:#081018; }
    .tiny { color:#8aa3b8; font-size:12px; }
  </style>
</head>
<body class="game-body">
  <div class="app" id="app">
    <div class="panel">
      <h2>冰雪王國</h2>
      <p class="tiny" id="hint">載入中…</p>
      <button class="btn" type="button" onclick="location.href='game-city.html'">進入主城</button>
      <button class="btn" type="button" onclick="location.href='game-map.html'">世界地圖</button>
      <button class="btn" type="button" onclick="location.href='game-start.html'">回開始</button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/boot.js"></script>
  <script>
    const hint = document.getElementById("hint");
    hint.textContent = window.FKApi ? "已載入引擎" : "js 資料夾未載到，可先點主城";
    (async () => {
      try {
        if (!window.FKApi) return;
        const ctx = await FKAuth.requirePlayer();
        if (!ctx) return;
        const p = ctx.player || {};
        hint.textContent = (p.name || p.player_name || "領主") + " 已進入世界";
      } catch (e) {
        hint.textContent = e.message || String(e);
      }
    })();
  </script>
</body>
</html>
