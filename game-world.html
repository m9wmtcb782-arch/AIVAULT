<script>
  (async () => {
    const box = document.getElementById("app");
    try {
      const ctx = await FKAuth.requirePlayer();
      if (!ctx) return;
      const uid = ctx.session.user.id;
      let snap = null;
      try { snap = await FKApi.snapshot(); } catch (e) {}
      if (!snap || !snap.player) {
        try { snap = FKLocal.snapshot(uid); } catch (e) {
          const p = ctx.player;
          snap = { player: p, city: { level: 1, x: 0, y: 0 }, resources: { wood:0,food:0,stone:0,iron:0 }, coupons: 0 };
        }
      }
      const c = (snap && snap.city) || { level: 1, x: 0, y: 0 };
      const p = snap.player;
      box.innerHTML = `
        ${FKUI.top(snap)}
        <div class="city-board" onclick="location.href='game-city.html'">
          <div class="spot core" style="left:50%;top:52%"><div class="ico">火</div>熔爐 ${c.level||1}</div>
        </div>
        <div class="panel">
          <h3>${p.name || p.player_name} 的冰雪王國</h3>
          <button class="btn" onclick="location.href='game-city.html'">進入主城</button>
          <button class="btn secondary" onclick="location.href='game-map.html'">打開世界地圖</button>
        </div>
        ${FKUI.nav("city")}
      `;
    } catch (e) {
      box.innerHTML = `<div class="panel"><h2>載入失敗</h2><p>${e.message||e}</p></div>`;
    }
  })();
</script>
