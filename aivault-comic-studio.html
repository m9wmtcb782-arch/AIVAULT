<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT 漫劇工作室 V0.1</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Noto Sans TC",sans-serif;background:#0b1020;color:#e9eefc}*{box-sizing:border-box}body{margin:0}header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:#151d32;border-bottom:1px solid #34415b}h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 12px}main{display:grid;grid-template-columns:minmax(260px,330px) minmax(320px,1fr);gap:16px;padding:16px;max-width:1400px;margin:auto}.panel{background:#172137;border:1px solid #34415b;border-radius:12px;padding:16px}label{display:block;font-size:13px;color:#bccbe7;margin:10px 0 4px}input,textarea,select{width:100%;background:#0c1427;color:white;border:1px solid #445574;border-radius:7px;padding:10px;font:inherit}textarea{min-height:76px;resize:vertical}button,.button{background:#3256a5;color:white;border:1px solid #577ac4;border-radius:7px;padding:9px 12px;cursor:pointer;font:inherit}button:hover{background:#426cc4}.secondary{background:#27354e}.danger{background:#73303e}.tools{display:flex;flex-wrap:wrap;gap:8px}.stage{aspect-ratio:9/16;max-height:480px;max-width:270px;margin:12px auto;border:1px solid #5c7398;border-radius:9px;display:flex;flex-direction:column;justify-content:end;padding:18px;text-align:center;background:linear-gradient(150deg,#26385b,#593e67)}.stage .character{font-size:70px}.stage .dialogue{background:#101a30cc;border-radius:8px;padding:12px;min-height:70px}.timeline{display:flex;gap:8px;overflow-x:auto;padding:10px 0}.shot{flex:0 0 130px;min-height:90px;text-align:left;background:#293854;border:2px solid transparent}.shot.active{border-color:#80b5ff}.muted{color:#a9b8d1;font-size:12px}#status{font-size:13px;color:#a8dbb8}footer{padding:16px;text-align:center;color:#91a2c1;font-size:12px}@media(max-width:780px){main{grid-template-columns:1fr}.stage{max-height:420px}}
</style></head><body>
<header><h1>🎬 AIVAULT 漫劇工作室 <small>V0.1</small></h1><div class="tools"><a class="button secondary" href="./aivault-home.html">← 主站</a><button id="save">儲存本機</button><button id="export">匯出 JSON</button><button id="importBtn">匯入 JSON</button><input id="importFile" type="file" accept="application/json,.json" hidden></div></header>
<main><section class="panel"><h2>作品與分鏡編輯</h2><label for="title">作品名稱</label><input id="title" maxlength="100"><label for="mode">敘事模式</label><select id="mode"><option value="script">固定劇本</option><option value="open">開放式因序故事</option></select><label for="scene">場景名稱</label><input id="scene" maxlength="100"><label for="character">角色名稱</label><input id="character" maxlength="100"><label for="dialogue">台詞／旁白</label><textarea id="dialogue" maxlength="2000"></textarea><label for="duration">鏡頭長度（秒）</label><input id="duration" type="number" min="1" max="120" step="1"><label for="background">場景色彩</label><input id="background" type="color"><div class="tools" style="margin-top:16px"><button id="add">新增分鏡</button><button id="duplicate" class="secondary">複製分鏡</button><button id="remove" class="danger">刪除分鏡</button></div><p class="muted">資料僅存於此瀏覽器；不會自動同步雲端。匯出 JSON 可備份與轉交渲染節點。</p><div id="status" role="status" aria-live="polite"></div></section>
<section class="panel"><h2>畫面預覽</h2><div id="stage" class="stage"><div class="character" aria-hidden="true">🎭</div><div id="stageScene"></div><div class="dialogue"><strong id="stageName"></strong><div id="stageText"></div></div></div><div class="tools"><button id="prev" class="secondary">◀ 上一鏡</button><button id="play">▶ 播放分鏡</button><button id="next" class="secondary">下一鏡 ▶</button></div><p id="meta" class="muted"></p><h2>分鏡時間軸</h2><div id="timeline" class="timeline"></div><p class="muted">目前是可操作的分鏡預覽，不是 AI 生成影片或 MP4 輸出。角色表情與畫面為佔位示意。</p></section></main>
<footer>AIVAULT · 獨立開發原型 · 不呼叫付費 API</footer>
<script>
"use strict";
const $=id=>document.getElementById(id);
const defaultShot=()=>({id:crypto.randomUUID(),scene:"月下庭院",character:"女主角",dialogue:"故事從這裡開始。",duration:5,background:"#30446e"});
let project={version:1,title:"我的第一部漫劇",mode:"script",shots:[defaultShot()]},index=0,timer=null;
function status(s){$("status").textContent=s}
function stop(){if(timer!==null){clearTimeout(timer);timer=null}$("play").textContent="▶ 播放分鏡"}
function readFields(){const s=project.shots[index];s.scene=$("scene").value;s.character=$("character").value;s.dialogue=$("dialogue").value;s.duration=Math.min(120,Math.max(1,Number($("duration").value)||1));s.background=$("background").value;project.title=$("title").value;project.mode=$("mode").value}
function render(){const s=project.shots[index];$("title").value=project.title;$("mode").value=project.mode;$("scene").value=s.scene;$("character").value=s.character;$("dialogue").value=s.dialogue;$("duration").value=s.duration;$("background").value=s.background;$("stage").style.background="linear-gradient(150deg,"+s.background+",#18152b)";$("stageScene").textContent=s.scene;$("stageName").textContent=s.character;$("stageText").textContent=s.dialogue;$("meta").textContent="鏡頭 "+(index+1)+"/"+project.shots.length+" · "+s.duration+" 秒 · 全片 "+project.shots.reduce((n,x)=>n+x.duration,0)+" 秒";const timeline=$("timeline");timeline.replaceChildren();project.shots.forEach((shot,i)=>{const b=document.createElement("button");b.className="shot"+(i===index?" active":"");b.textContent=(i+1)+". "+shot.scene+" ("+shot.duration+"s)";b.onclick=()=>{stop();readFields();index=i;render()};timeline.append(b)})}
function move(i){readFields();index=(i+project.shots.length)%project.shots.length;render()}
function valid(p){return p&&p.version===1&&typeof p.title==="string"&&["script","open"].includes(p.mode)&&Array.isArray(p.shots)&&p.shots.length>0&&p.shots.length<=500&&p.shots.every(s=>typeof s.id==="string"&&typeof s.scene==="string"&&typeof s.character==="string"&&typeof s.dialogue==="string"&&Number.isFinite(s.duration)&&s.duration>=1&&s.duration<=120&&/^#[0-9a-fA-F]{6}$/.test(s.background))}
$("prev").onclick=()=>{stop();move(index-1)};$("next").onclick=()=>{stop();move(index+1)};
$("add").onclick=()=>{stop();readFields();project.shots.splice(index+1,0,defaultShot());index++;render();status("已新增分鏡")};
$("duplicate").onclick=()=>{stop();readFields();project.shots.splice(index+1,0,{...project.shots[index],id:crypto.randomUUID()});index++;render();status("已複製分鏡")};
$("remove").onclick=()=>{stop();if(project.shots.length===1){status("至少保留一個分鏡");return}project.shots.splice(index,1);index=Math.min(index,project.shots.length-1);render();status("已刪除分鏡")};
$("play").onclick=()=>{if(timer!==null){stop();return}readFields();render();$("play").textContent="■ 停止播放";const tick=()=>{const seconds=project.shots[index].duration;timer=setTimeout(()=>{if(index>=project.shots.length-1){stop();return}index++;render();tick()},seconds*1000)};tick()};
$("save").onclick=()=>{readFields();try{localStorage.setItem("aivault-comic-v01",JSON.stringify(project));status("已儲存至本機瀏覽器")}catch(e){status("儲存失敗，請匯出 JSON 備份")}};
$("export").onclick=()=>{readFields();const blob=new Blob([JSON.stringify(project,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="aivault-comic-project.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status("已匯出專案 JSON")};
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=async e=>{const file=e.target.files[0];if(!file)return;if(file.size>2e6){status("檔案過大");return}try{const p=JSON.parse(await file.text());if(!valid(p))throw Error("invalid");stop();project=p;index=0;render();status("專案匯入成功")}catch(e){status("JSON 格式不符合 V0.1 規格")}e.target.value=""};
for(const id of ["title","mode","scene","character","dialogue","duration","background"]){$(id).addEventListener("input",()=>{readFields();render()})}
try{const saved=localStorage.getItem("aivault-comic-v01");if(saved){const p=JSON.parse(saved);if(valid(p))project=p}}catch(e){status("無法讀取本機儲存")};render();
</script></body></html>
