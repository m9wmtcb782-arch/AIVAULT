<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>選擇領主</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; background:#071018; color:#e8f4ff; font-family:sans-serif; }
    .stage { padding:12px 12px 24px; }
    h1 { text-align:center; font-size:20px; }
    .sub { text-align:center; color:#8aa3b8; font-size:12px; }
    .hero { height:38vh; border-radius:16px; background:#123044; position:relative; overflow:hidden;
      display:flex; align-items:flex-end; justify-content:center; font-size:72px; }
    .hero video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .bubble { position:absolute; left:10px; right:10px; bottom:10px; background:#071018ee; border-radius:12px; padding:10px; font-size:14px; }
    .sec { margin:10px 0 6px; color:#8aa3b8; font-size:13px; }
    .picks { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .card { border:1px solid #3a5a70; background:#0c1a26; border-radius:12px; padding:12px; color:#e8f4ff; text-align:left; font-size:15px; }
    .card.on { border-color:#9ad8ff; background:#163044; }
    .card b { display:block; }
    .card i { font-style:normal; color:#8aa3b8; font-size:12px; }
    .btn { width:100%; margin-top:14px; border:0; border-radius:14px; padding:14px; font-weight:800; background:#9ad8ff; color:#081018; }
    .msg { color:#ff8a9a; font-size:13px; min-height:18px; text-align:center; }
  </style>
</head>
<body>
  <div class="stage">
    <h1>選擇領主</h1>
    <p class="sub">先點角色，再按確認</p>
    <div class="hero" id="stage">🗡️</div>
    <div class="bubble" id="hello">點下面的角色</div>
    <div class="sec">男主</div>
    <div class="picks" id="males"></div>
    <div class="sec">女主</div>
    <div class="picks" id="females"></div>
    <p class="msg" id="err"></p>
    <button class="btn" type="button" id="go">確認並寫入帳號</button>
  </div>
  <script>
    const HEROES = [
      {id:"m_warrior",g:"m",icon:"🗡️",job:"戰士",name:"凌霜",say:"戰士報到。盾在前，你在後。"},
      {id:"m_knight",g:"m",icon:"🛡️",job:"騎士",name:"北烈",say:"騎士聽令。我為王國衝鋒。"},
      {id:"m_mage",g:"m",icon:"✨",job:"法師",name:"朔風",say:"法術已備。冰焰聽你差遣。"},
      {id:"m_archer",g:"m",icon:"🏹",job:"弓手",name:"寒羽",say:"弓已上弦。山脊那頭交給我。"},
      {id:"f_warrior",g:"f",icon:"⚔️",job:"戰士",name:"白雪",say:"女戰士在此。近身我來。"},
      {id:"f_knight",g:"f",icon:"🏰",job:"騎士",name:"霜蘭",say:"騎士禮。城門由我守。"},
      {id:"f_mage",g:"f",icon:"❄️",job:"法師",name:"冰璃",say:"法陣亮了。跟我念這句。"},
      {id:"f_archer",g:"f",icon:"🎯",job:"弓手",name:"月寒",say:"箭在弦上。你一揮手我就放。"}
    ];
    let cur = "m_warrior";
    function paint() {
      const mk = list => list.map(h =>
        `<button class="card${h.id===cur?" on":""}" type="button" data-id="${h.id}">
          <b>${h.icon} ${h.name}</b><i>${h.job}</i></button>`
      ).join("");
      document.getElementById("males").innerHTML = mk(HEROES.filter(h=>h.g==="m"));
      document.getElementById("females").innerHTML = mk(HEROES.filter(h=>h.g==="f"));
      document.querySelectorAll(".card").forEach(btn => {
        btn.onclick = () => {
          cur = btn.getAttribute("data-id");
          const h = HEROES.find(x => x.id === cur);
          document.getElementById("stage").textContent = h.icon;
          document.getElementById("hello").textContent = h.name + "：" + h.say;
          paint();
        };
      });
    }
    paint();
    const h0 = HEROES[0];
    document.getElementById("stage").textContent = h0.icon;
    document.getElementById("hello").textContent = h0.name + "：" + h0.say;

    document.getElementById("go").onclick = async () => {
      const err = document.getElementById("err");
      err.textContent = "寫入中…";
      localStorage.setItem("fk_hero", cur);
      try {
        if (!window.supabase) {
          await new Promise((resolve, reject) => {
            const s = document.createElement("script");
            s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
            s.onload = resolve; s.onerror = () => reject(new Error("套件載入失敗"));
            document.body.appendChild(s);
          });
        }
        const sb = supabase.createClient(
          "https://clcddygkaaqqtsbswgdf.supabase.co",
          "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsY2RkeWdrYWFxcXRzYnN3Z2RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzUwNjQsImV4cCI6MjEwMjMxMTA2NH0.kYg6h7n74CtbiIjNjZ2xxJj16SV42INZVzQ9dLNUfKE"
        );
        const { data: { session } } = await sb.auth.getSession();
        if (!session) { err.textContent = "尚未登入"; location.href = "game-login.html"; return; }
        const { error } = await sb.rpc("aivault_game_set_hero_v1", { p_hero: cur });
        if (error) {
          if ((error.message || "").indexOf("NO_PLAYER") >= 0) { location.href = "game-create-player.html"; return; }
          err.textContent = error.message; return;
        }
        location.href = "game-city.html";
      } catch (e) {
        err.textContent = e.message || String(e);
      }
    };
  </script>
</body>
</html>
