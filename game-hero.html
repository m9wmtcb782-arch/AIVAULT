<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>選擇領主</title>
  <style>
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body {
      margin:0; height:100%; overflow:hidden; overscroll-behavior:none; touch-action:none;
      background:#071018; color:#e8f4ff; font-family:sans-serif; font-size:12px;
    }
    .stage { height:100dvh; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); overflow:hidden; }
    h1 { text-align:center; font-size:15px; margin:4px 0 2px; }
    .sub { text-align:center; color:#8aa3b8; font-size:10px; margin:0 0 6px; }
    .hero { height:22vh; border-radius:12px; background:#123044; position:relative; overflow:hidden;
      display:flex; align-items:center; justify-content:center; font-size:42px; }
    .hero video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .bubble { margin:6px 0; background:#071018ee; border-radius:8px; padding:6px 8px; font-size:11px; }
    .sec { margin:6px 0 4px; color:#8aa3b8; font-size:10px; }
    .picks { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .card { border:1px solid #3a5a70; background:#0c1a26; border-radius:10px; padding:7px 8px; color:#e8f4ff; text-align:left; font-size:12px; }
    .card.on { border-color:#9ad8ff; background:#163044; }
    .card b { display:block; font-size:12px; }
    .card i { font-style:normal; color:#8aa3b8; font-size:10px; }
    .btn { width:100%; margin-top:8px; border:0; border-radius:12px; padding:10px; font-weight:800; background:#9ad8ff; color:#081018; font-size:13px; }
    .msg { color:#ff8a9a; font-size:11px; min-height:14px; text-align:center; }
  </style>
</head>
<body>
  <div class="stage">
    <h1>選擇領主</h1>
    <p class="sub">先點角色，再按確認</p>
    <div class="hero" id="stage">🗡️</div>
    <div class="bubble" id="hello">點下面的角色</div>
    <div class="sec">男主</div>
    <div class="picks" id="males"></div>
    <div class="sec">女主</div>
    <div class="picks" id="females"></div>
    <label style="display:block;margin-top:10px;font-size:12px;color:#8aa3b8">你的暱稱（不是角色名）</label>
    <input id="nick" maxlength="20" placeholder="2～20字" style="width:100%;padding:8px;border-radius:10px;border:1px solid #3a5a70;background:#061018;color:#fff;margin:4px 0 6px;font-size:13px;" />
    <p class="msg" id="err"></p>
    <button class="btn" type="button" id="go">確認暱稱與角色</button>
  </div>
  <script>
    document.addEventListener("touchmove", e => e.preventDefault(), {passive:false});
    const HEROES = [
      {id:"m_warrior",g:"m",icon:"🗡️",job:"戰士",name:"凌霜",say:"戰士報到。盾在前，你在後。"},
      {id:"m_knight",g:"m",icon:"🛡️",job:"騎士",name:"北烈",say:"騎士聽令。我為王國衝鋒。"},
      {id:"m_mage",g:"m",icon:"✨",job:"法師",name:"朔風",say:"法術已備。冰焰聽你差遣。"},
      {id:"m_archer",g:"m",icon:"🏹",job:"弓手",name:"寒羽",say:"弓已上弦。山脊那頭交給我。"},
      {id:"f_warrior",g:"f",icon:"⚔️",job:"戰士",name:"白雪",say:"女戰士在此。近身我來。"},
      {id:"f_knight",g:"f",icon:"🏰",job:"騎士",name:"霜蘭",say:"騎士禮。城門由我守。"},
      {id:"f_mage",g:"f",icon:"❄️",job:"法師",name:"冰璃",say:"法陣亮了。跟我念這句。"},
      {id:"f_archer",g:"f",icon:"🎯",job:"弓手",name:"月寒",say:"箭在弦上。你一揮手我就放。"}
    ];
    let cur = "m_warrior";
    function paint() {
      const mk = list => list.map(h =>
        `<button class="card${h.id===cur?" on":""}" type="button" data-id="${h.id}">
          <b>${h.icon} ${h.name}</b><i>${h.job}</i></button>`
      ).join("");
      document.getElementById("males").innerHTML = mk(HEROES.filter(h=>h.g==="m"));
      document.getElementById("females").innerHTML = mk(HEROES.filter(h=>h.g==="f"));
      document.querySelectorAll(".card").forEach(btn => {
        btn.onclick = () => {
          cur = btn.getAttribute("data-id");
          const h = HEROES.find(x => x.id === cur);
          document.getElementById("stage").textContent = h.icon;
          document.getElementById("hello").textContent = h.name + "：" + h.say;
          paint();
        };
      });
    }
    paint();
    const h0 = HEROES[0];
    document.getElementById("stage").textContent = h0.icon;
    document.getElementById("hello").textContent = h0.name + "：" + h0.say;

    document.getElementById("go").onclick = async () => {
      const err = document.getElementById("err");
      err.textContent = "寫入中…";
      localStorage.setItem("fk_hero", cur);
      try {
        if (!window.supabase) {
          await new Promise((resolve, reject) => {
            const s = document.createElement("script");
            s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
            s.onload = resolve; s.onerror = () => reject(new Error("套件載入失敗"));
            document.body.appendChild(s);
          });
        }
        const sb = supabase.createClient(
          "https://clcddygkaaqqtsbswgdf.supabase.co",
          "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsY2RkeWdrYWFxcXRzYnN3Z2RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzUwNjQsImV4cCI6MjEwMjMxMTA2NH0.kYg6h7n74CtbiIjNjZ2xxJj16SV42INZVzQ9dLNUfKE"
        );
        const { data: { session } } = await sb.auth.getSession();
        if (!session) { err.textContent = "尚未登入"; location.href = "game-login.html"; return; }
        const nick = (document.getElementById("nick").value || "").trim();
        if (nick.length < 2 || nick.length > 20) { err.textContent = "暱稱要 2～20 字"; return; }
        const r1 = await sb.rpc("aivault_game_set_nick_v1", { p_nick: nick });
        if (r1.error) {
          if ((r1.error.message || "").indexOf("NO_PLAYER") >= 0) { location.href = "game-create-player.html"; return; }
          err.textContent = r1.error.message; return;
        }
        const r2 = await sb.rpc("aivault_game_set_hero_v1", { p_hero: cur });
        if (r2.error) { err.textContent = r2.error.message; return; }
        location.href = "game-city.html";
      } catch (e) {
        err.textContent = e.message || String(e);
      }
    };
  </script>
</body>
</html>
