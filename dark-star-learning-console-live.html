<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暗星即時學習監督台｜AIVAULT</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f4f6f8;color:#18212b;margin:0}main{max-width:1100px;margin:auto;padding:16px}.top,.actions{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}.card{background:#fff;border:1px solid #dfe5eb;border-radius:14px;padding:16px}.wide{grid-column:1/-1}input,textarea,select,button{font:inherit;width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #dfe5eb;margin:5px 0}textarea{min-height:110px}button{background:#465cff;color:white;font-weight:700;cursor:pointer}.secondary{background:#e9edf4;color:#18212b}.log{background:#101722;color:#e8edf5;padding:12px;border-radius:9px;white-space:pre-wrap;overflow:auto;max-height:380px;font-size:12px}.item{border:1px solid #dfe5eb;border-radius:9px;padding:10px;margin:8px 0}.muted{color:#687584;font-size:13px}.error{color:#b42318;white-space:pre-wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main><div class="top"><div><h2>🌑 暗星即時學習監督台</h2><div class="muted">正式後端紀錄 · 不使用假進度</div></div><div class="actions"><button class="secondary" id="refresh">重新讀取</button><button class="secondary" id="home">回工作中心</button></div></div><div class="grid"><section class="card"><h3>暗星服務</h3><div id="health">檢查中…</div><div id="healthRaw" class="log"></div></section><section class="card"><h3>今日紀錄</h3><div id="summary">讀取中…</div><div class="muted">資料來源：Supabase monitor events</div></section><section class="card"><h3>👨‍🏫 我要教暗星</h3><label>學習主題</label><input id="title" placeholder="例如：學習 WebGPU 任務派送"><label>詳細要求</label><textarea id="content" placeholder="請描述要研究、理解、實作或測試的內容"></textarea><label>任務類型</label><select id="mode"><option value="learning-research">學習與研究</option><option value="code-review">程式碼理解與審查</option><option value="runtime-test">實際執行與測試</option><option value="compute-dispatch">協作池／算力池</option></select><button id="send">送出給暗星</button><div id="sendResult" class="muted"></div></section><section class="card"><h3>最新任務回應</h3><div id="taskRaw" class="log">尚未送出</div></section><section class="card wide"><h3>📚 正式學習事件紀錄</h3><div class="muted">只顯示後端已寫入的事件；submitted／queued 不代表已學會。</div><div id="events">讀取中…</div></section></div></main><script>const BASE='https://clcddygkaaqqtsbswgdf.supabase.co/functions/v1',MON=BASE+'/dark-star-learning-monitor',DS=BASE+'/technical-dark-star',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function req(url,opt={}){let r,t,d;try{r=await fetch(url,{...opt,headers:{Accept:'application/json','Content-Type':'application/json',...(opt.headers||{})}});t=await r.text()}catch(e){throw new Error('網路或 CORS 連線失敗\n網址：'+url+'\n原因：'+(e?.message||String(e)))}try{d=t?JSON.parse(t):null}catch{d={raw:t}}if(!r.ok){const detail=d?.error||d?.message||d?.raw||t||'沒有回應內容';throw new Error('HTTP '+r.status+' '+r.statusText+'\n網址：'+url+'\n錯誤：'+detail)}return d}
function renderEvents(list){$('events').innerHTML=list.length?list.map(e=>`<div class="item"><b>${esc(e.title||e.event_type||'事件')}</b><div class="muted">${esc(e.created_at)}｜狀態：${esc(e.status)}｜任務：${esc(e.task_id||'尚未取得')}</div><div>${esc(e.chinese_explanation||'尚未有中文解讀')}</div><details><summary>查看原始資料</summary><pre>${esc(JSON.stringify(e,null,2))}</pre></details></div>`).join(''):'<div class="muted">目前沒有正式事件紀錄</div>'}
async function load(){try{const h=await req(DS+'/health');$('health').textContent='在線回應｜版本 '+(h.version||'—');$('healthRaw').textContent=JSON.stringify(h,null,2)}catch(e){$('health').textContent='連線失敗';$('healthRaw').textContent=e.message}try{const d=await req(MON+'/events?limit=100');renderEvents(d.events||[]);const today=(d.events||[]).filter(e=>String(e.created_at||'').slice(0,10)===new Date().toISOString().slice(0,10));$('summary').innerHTML=`今日事件：<b>${today.length}</b><br>全部回傳：${d.count||0}`}catch(e){$('events').innerHTML='<div class="error">'+esc(e.message)+'</div>';$('summary').innerHTML='<div class="error">讀取失敗：'+esc(e.message)+'</div>'}}
async function send(){const title=$('title').value.trim(),content=$('content').value.trim(),mode=$('mode').value;if(!title&&!content){$('sendResult').textContent='請先輸入內容';return}$('send').disabled=true;$('sendResult').textContent='送出中…';$('taskRaw').textContent='等待後端回應…';try{const d=await req(MON+'/task',{method:'POST',body:JSON.stringify({title,content,mode,task_type:mode})});$('taskRaw').textContent=JSON.stringify(d,null,2);$('sendResult').textContent=d.success?'已送出；請以任務狀態與後續事件判斷是否完成':'後端回傳失敗，請查看下方完整內容';$('content').value='';await load()}catch(e){$('taskRaw').textContent=e.message;$('sendResult').innerHTML='<span class="error">失敗：'+esc(e.message)+'</span>'}finally{$('send').disabled=false}}
$('refresh').onclick=load;$('send').onclick=send;$('home').onclick=()=>location.href='index.html';load();setInterval(load,30000)</script></body></html>
