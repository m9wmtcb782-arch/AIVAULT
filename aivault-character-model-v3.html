<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT 真實3D人物檢視</title><style>body{margin:0;background:#15263c;color:#eaf4ff;font:14px system-ui}#info{position:fixed;top:12px;left:12px;right:12px;max-width:440px;background:#0b1f35dc;padding:12px;border-radius:12px;z-index:2}h3{margin:0 0 6px}#status{font-size:12px;color:#c7e5ff}#bar{position:fixed;bottom:18px;left:0;right:0;text-align:center;z-index:2}button{border:1px solid #8dbbe4;border-radius:12px;padding:12px;background:#214a72;color:white;font-size:15px}canvas{display:block}#error{color:#ffd1ba}</style></head><body><div id="info"><h3>❄ AIVAULT 真實 3D 人物｜模型檢視 V3</h3><div>這次使用 Quaternius 的真實骨架人物模型，不是幾何方塊。</div><div>目前是基礎人物檢視，尚未完成冬裝、Q版造型與走路動畫。</div><p id="status">正在載入模型…</p><div id="error"></div></div><div id="bar"><button id="spin">⏸ 停止旋轉</button> <button id="home">⟳ 重置視角</button></div><script type="module">import * as THREE from 'https://esm.sh/three@0.160.1';import {GLTFLoader} from 'https://esm.sh/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';const status=document.getElementById('status'),err=document.getElementById('error');let r;try{r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight);r.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(r.domElement)}catch(e){status.textContent='WebGL 無法啟動';err.textContent=e.message;throw e}const scene=new THREE.Scene();scene.background=new THREE.Color('#8fb7d2');const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.01,200);camera.position.set(0,1.7,5);scene.add(new THREE.HemisphereLight(0xffffff,0x667788,2.4));const l=new THREE.DirectionalLight(0xffe2bb,2.3);l.position.set(-3,6,5);scene.add(l);const floor=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.8,.2,48),new THREE.MeshStandardMaterial({color:0xeaf4fb}));floor.position.y=-.1;scene.add(floor);const modelURL='https://raw.githubusercontent.com/programasweights/avatar/main/public/assets/character.glb';let subject,spin=true;new GLTFLoader().load(modelURL,g=>{subject=g.scene;let bounds=new THREE.Box3().setFromObject(subject),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());subject.position.sub(center);const h=Math.max(size.y,.1),factor=2.8/h;subject.scale.setScalar(factor);subject.position.y+=1.4;scene.add(subject);status.textContent='已載入真實 GLB 人物（可用手指旋轉）。模型不含走路動畫。';},p=>{if(p.total)status.textContent='載入中 '+Math.round(p.loaded/p.total*100)+'%'},e=>{status.textContent='模型下載失敗';err.textContent='目前無法取得遠端 GLB；這不是已完成的角色。請稍後重試。'});let down=false,last=0;r.domElement.addEventListener('pointerdown',e=>{down=true;last=e.clientX});window.addEventListener('pointerup',()=>down=false);window.addEventListener('pointermove',e=>{if(down&&subject){subject.rotation.y+=(e.clientX-last)*.012;last=e.clientX}});document.getElementById('spin').onclick=e=>{spin=!spin;e.target.textContent=spin?'⏸ 停止旋轉':'▶ 自動旋轉'};document.getElementById('home').onclick=()=>{if(subject)subject.rotation.y=0;camera.position.set(0,1.7,5)};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);if(subject&&spin&&!down)subject.rotation.y+=.004;r.render(scene,camera)}animate();</script></body></html>
