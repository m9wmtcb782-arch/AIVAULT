<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AIVAULT 檔案庫</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#f5f6f8;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif}body{min-height:100vh}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd;padding:16px 18px}h1{margin:0;font-size:24px}.sub{margin-top:4px;color:#666;font-size:13px}.wrap{max-width:1100px;margin:auto;padding:18px}.drop{background:#fff;border:2px dashed #aaa;border-radius:16px;padding:28px;text-align:center;cursor:pointer;transition:.15s}.drop.drag{border-color:#111;background:#fafafa}.drop strong{font-size:18px}.drop p{margin:8px 0;color:#666}button{border:0;border-radius:10px;padding:10px 14px;background:#111;color:#fff;font-size:15px;cursor:pointer}button.secondary{background:#eee;color:#111}button.danger{background:#c62828}button:disabled{opacity:.5;cursor:not-allowed}input[type=file]{display:none}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}#status{color:#666;font-size:14px;align-self:center}.cloud{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin:18px 0}.cloud h2{margin:0 0 8px;font-size:19px}.cloud .hint{color:#666;font-size:13px;margin-bottom:12px}.field{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.field input{flex:1;min-width:180px;padding:11px 12px;border:1px solid #ccc;border-radius:10px;font-size:15px}.editor{width:100%;min-height:480px;resize:vertical;padding:14px;border:1px solid #ccc;border-radius:12px;background:#fafafa;font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono",monospace}.editor:focus,.field input:focus{outline:2px solid #bbb;border-color:#999}.counter{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#666;font-size:13px;margin:8px 0 12px}.cloud-actions{display:flex;gap:8px;flex-wrap:wrap}.cloud-status{margin-top:10px;font-size:13px;color:#555}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;overflow:hidden}.thumb{height:170px;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img,.thumb video{width:100%;height:100%;object-fit:contain}.icon{font-size:48px;color:#fff}.info{padding:12px}.name{font-weight:700;word-break:break-all}.meta{color:#777;font-size:12px;margin-top:5px}.source{font-size:11px;color:#555;margin-top:5px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{font-size:13px;padding:8px 10px}.empty{text-align:center;color:#777;padding:50px;background:#fff;border-radius:14px;border:1px solid #ddd}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:30;padding:20px}.modal.show{display:flex;align-items:center;justify-content:center}.panel{background:#fff;width:min(1000px,100%);height:min(90vh,900px);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}.panelhead{padding:12px 16px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;gap:10px;align-items:center}.panelbody{padding:16px;overflow:auto;flex:1}.preview-img{max-width:100%;max-height:70vh;display:block;margin:auto}.preview-video{width:100%;max-height:70vh}.preview-audio{width:100%;margin-top:20px}pre{white-space:pre-wrap;word-break:break-word;background:#f3f3f3;padding:14px;border-radius:10px}iframe{width:100%;height:70vh;border:0}canvas{max-width:100%;display:block;margin:0 auto 16px;background:#fff}audio,video{outline:none}.authbar{font-size:12px;color:#666;margin-top:6px}@media(max-width:600px){.wrap{padding:12px}.drop{padding:22px 12px}.grid{grid-template-columns:1fr}.thumb{height:200px}.editor{min-height:360px}}
</style>
</head>
<body>
<header>
  <h1>🌑 AIVAULT 檔案庫</h1>
  <div class="sub">獨立檔案上傳、儲存、預覽、播放與刪除</div>
  <div id="authbar" class="authbar">正在檢查 AIVAULT 登入狀態…</div>
</header>
<main class="wrap">
  <div id="drop" class="drop">
    <strong>拖曳檔案到這裡，或點擊選擇檔案</strong>
    <p>支援 JPG、PNG、GIF、WEBP、JSON、TXT、Word、PDF、MP4、WEBM、MOV、WAV、MP3、M4A 等</p>
    <button type="button" onclick="fileInput.click()">選擇檔案</button>
    <input id="fileInput" type="file" multiple accept=".jpg,.jpeg,.png,.gif,.webp,.json,.txt,.csv,.md,.doc,.docx,.pdf,.mp4,.webm,.mov,.m4v,.wav,.mp3,.m4a,.aac,.ogg">
  </div>
  <div class="toolbar">
    <button type="button" onclick="fileInput.click()">＋ 上傳檔案</button>
    <button class="secondary" type="button" onclick="refresh()">重新整理</button>
    <button class="danger" type="button" onclick="deleteAll()">刪除全部</button>
    <span id="status"></span>
  </div>

  <section class="cloud">
    <h2>📝 大型文字 → TXT → 雲端儲存</h2>
    <div class="hint">可直接貼上大型內容；不設定 100,000 字元硬上限。儲存後會同步到 Supabase「aivault-files」，並保留本機檔案庫。</div>
    <div class="field">
      <input id="txtName" type="text" value="aivault-text" placeholder="輸入 TXT 檔案名稱">
      <button type="button" onclick="downloadEditorTxt()">⬇️ 下載 TXT</button>
    </div>
    <textarea id="largeText" class="editor" spellcheck="false" placeholder="把大型文字、程式碼、文件內容直接貼在這裡…"></textarea>
    <div class="counter"><span id="charCount">字元：0</span><span id="byteCount">UTF-8：0 B</span><span>目標：100,000+ 字元</span></div>
    <div class="cloud-actions">
      <button id="saveCloudBtn" type="button" onclick="saveLargeTextToCloud()">☁️ 儲存 TXT 到雲端</button>
      <button class="secondary" type="button" onclick="saveEditorLocal()">💾 同時存入本機檔案庫</button>
      <button class="secondary" type="button" onclick="clearEditor()">清空文字</button>
    </div>
    <div id="cloudStatus" class="cloud-status"></div>
  </section>

  <div id="list" class="grid"></div>
</main>
<div id="modal" class="modal">
  <div class="panel">
    <div class="panelhead"><strong id="modalTitle">預覽</strong><button class="secondary" onclick="closeModal()">關閉</button></div>
    <div id="modalBody" class="panelbody"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const DB_NAME="aivault_file_vault",STORE="files";
const SUPABASE_URL="https://clcddygkaaqqtsbswgdf.supabase.co";
const SUPABASE_KEY="sb_publishable_1D05YGthBrNGg-5L92TLCw_GiLnInBu";
const CLOUD_BUCKET="aivault-files";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let db,authUser=null;
const $=id=>document.getElementById(id);
const fileInput=$("fileInput"),drop=$("drop"),list=$("list"),status=$("status"),largeText=$("largeText");
function initDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE)){const s=d.createObjectStore(STORE,{keyPath:"id",autoIncrement:true});s.createIndex("created","created")}};req.onsuccess=e=>{db=e.target.result;resolve()};req.onerror=()=>reject(req.error)})}
function tx(mode="readonly"){return db.transaction(STORE,mode).objectStore(STORE)}
function addFile(file){return new Promise((resolve,reject)=>{const r=tx("readwrite").add({name:file.name,type:file.type||guessType(file.name),size:file.size,created:Date.now(),blob:file});r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function allFiles(){return new Promise((resolve,reject)=>{const r=tx().getAll();r.onsuccess=()=>resolve(r.result.sort((a,b)=>b.created-a.created));r.onerror=()=>reject(r.error)})}
function getFile(id){return new Promise((resolve,reject)=>{const r=tx().get(Number(id));r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function removeFile(id){return new Promise((resolve,reject)=>{const r=tx("readwrite").delete(Number(id));r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function clearFiles(){return new Promise((resolve,reject)=>{const r=tx("readwrite").clear();r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function guessType(name){const ext=name.split(".").pop().toLowerCase();const m={jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",gif:"image/gif",webp:"image/webp",json:"application/json",txt:"text/plain",csv:"text/csv",md:"text/markdown",pdf:"application/pdf",mp4:"video/mp4",webm:"video/webm",mov:"video/quicktime",m4v:"video/mp4",wav:"audio/wav",mp3:"audio/mpeg",m4a:"audio/mp4",aac:"audio/aac",ogg:"audio/ogg",doc:"application/msword",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"};return m[ext]||"application/octet-stream"}
function fmtSize(n){if(n<1024)return n+" B";if(n<1024**2)return(n/1024).toFixed(1)+" KB";if(n<1024**3)return(n/1024**2).toFixed(1)+" MB";return(n/1024**3).toFixed(2)+" GB"}
function icon(type,name){if(type.startsWith("image/"))return"🖼️";if(type.startsWith("video/"))return"🎬";if(type.startsWith("audio/"))return"🎵";if(type.includes("pdf"))return"📕";if(type.includes("word")||/\.docx?$/i.test(name))return"📘";if(type.includes("json")||/\.json$/i.test(name))return"🧩";return"📄"}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function initAuth(){try{const {data}=await sb.auth.getSession();authUser=data.session?.user||null;updateAuthUI();await loadCloudFiles();}catch(e){console.error(e);$("authbar").textContent="雲端登入狀態檢查失敗；本機檔案庫仍可使用。"}}
function updateAuthUI(){if(authUser){$("authbar").textContent="☁️ Supabase 雲端：已登入 · "+(authUser.email||authUser.id);$("saveCloudBtn").disabled=false}else{$("authbar").textContent="☁️ Supabase 雲端：尚未登入；大型文字仍可下載／存本機。";$('saveCloudBtn').disabled=true}}
sb.auth.onAuthStateChange((_event,session)=>{authUser=session?.user||null;updateAuthUI();loadCloudFiles()});
async function refresh(){const files=await allFiles();status.textContent=`本機 ${files.length} 個檔案`;renderLocal(files);await loadCloudFiles()}
function renderLocal(files){list.innerHTML="";if(!files.length&&!authUser){list.innerHTML='<div class="empty" style="grid-column:1/-1">目前沒有本機檔案。雲端檔案需要登入 AIVAULT。</div>';return}files.forEach(f=>renderCard(f,false));if(!files.length&&authUser)list.innerHTML='<div class="empty" style="grid-column:1/-1">目前沒有本機檔案；下方儲存的雲端檔案會顯示在這裡。</div>'}
function renderCard(f,isCloud){const card=document.createElement("div");card.className="card";const thumb=document.createElement("div");thumb.className="thumb";if(f.type?.startsWith("image/")){const img=document.createElement("img");img.src=f.url||URL.createObjectURL(f.blob);thumb.appendChild(img)}else if(f.type?.startsWith("video/")){const v=document.createElement("video");v.src=f.url||URL.createObjectURL(f.blob);v.muted=true;v.preload="metadata";thumb.appendChild(v)}else{const d=document.createElement("div");d.className="icon";d.textContent=icon(f.type||"",f.name);thumb.appendChild(d)}const info=document.createElement("div");info.className="info";info.innerHTML=`<div class="name">${esc(f.name)}</div><div class="meta">${esc(f.type||"未知格式")} · ${fmtSize(f.size||0)} · ${new Date(f.created||Date.now()).toLocaleString()}</div><div class="source">${isCloud?"☁️ Supabase 雲端":"💻 本機 IndexedDB"}</div>`;const acts=document.createElement("div");acts.className="actions";const p=document.createElement("button");p.textContent="預覽 / 播放";p.onclick=()=>preview(f.id,f,isCloud);const dl=document.createElement("button");dl.className="secondary";dl.textContent="儲存到裝置";dl.onclick=()=>isCloud?downloadCloud(f.path,f.name):downloadFile(f.id);acts.append(p,dl);if(isCloud){const del=document.createElement("button");del.className="danger";del.textContent="刪除雲端";del.onclick=()=>deleteCloud(f);acts.appendChild(del)}else{const del=document.createElement("button");del.className="danger";del.textContent="刪除";del.onclick=()=>deleteOne(f.id,f.name);acts.appendChild(del)}info.appendChild(acts);card.append(thumb,info);list.appendChild(card)}
async function loadCloudFiles(){if(!authUser)return;try{const {data,error}=await sb.storage.from(CLOUD_BUCKET).list(authUser.id,{limit:1000,sortBy:{column:"name",order:"asc"}});if(error)throw error;const start=Array.from(list.children);const cloudFiles=[];for(const x of(data||[])){if(!x.id)continue;const path=authUser.id+"/"+x.name;const {data:urlData}=await sb.storage.from(CLOUD_BUCKET).createSignedUrl(path,3600);const meta=x.metadata||{};cloudFiles.push({name:x.name,type:meta.mimetype||guessType(x.name),size:Number(meta.size||0),created:x.created_at||Date.now(),path,url:urlData?.signedUrl})}if(!list.children.length||start.length===1&&start[0].classList.contains("empty")){list.innerHTML=""}cloudFiles.forEach(f=>renderCard(f,true));if(!cloudFiles.length&&list.children.length===0)list.innerHTML='<div class="empty" style="grid-column:1/-1">目前沒有雲端檔案。</div>'}catch(e){console.error(e);$("cloudStatus").textContent="雲端檔案讀取失敗："+e.message}}
async function handleFiles(files){const arr=[...files];if(!arr.length)return;status.textContent="正在儲存本機...";for(const f of arr){try{await addFile(f)}catch(e){alert("無法儲存："+f.name+"\n"+e)}}await refresh()}
fileInput.addEventListener("change",e=>{handleFiles(e.target.files);fileInput.value=""});["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("drag")}));["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("drag")}));drop.addEventListener("drop",e=>handleFiles(e.dataTransfer.files));
function updateCount(){const t=largeText.value;$("charCount").textContent="字元："+t.length.toLocaleString();$("byteCount").textContent="UTF-8："+new TextEncoder().encode(t).byteLength.toLocaleString()+" B"}largeText.addEventListener("input",updateCount);
function normalizedName(){let n=$("txtName").value.trim()||"aivault-text";n=n.replace(/[\\/:*?"<>|]/g,"_");if(!/\.txt$/i.test(n))n+=".txt";return n}
function makeTxtBlob(){return new Blob([largeText.value],{type:"text/plain;charset=utf-8"})}
function downloadEditorTxt(){const b=makeTxtBlob(),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=normalizedName();a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function saveEditorLocal(){const blob=makeTxtBlob();try{await addFile(new File([blob],normalizedName(),{type:"text/plain;charset=utf-8"}));$("cloudStatus").textContent="已存入本機檔案庫。";await refresh()}catch(e){alert("本機儲存失敗："+e.message)}}
async function saveLargeTextToCloud(){if(!authUser){$("cloudStatus").textContent="尚未登入 AIVAULT，無法寫入私人雲端。請先登入 AIVAULT。";return}const text=largeText.value;if(!text){$("cloudStatus").textContent="請先輸入文字。";return}const blob=makeTxtBlob(),name=normalizedName(),path=authUser.id+"/"+name;const btn=$("saveCloudBtn");btn.disabled=true;$("cloudStatus").textContent="正在上傳大型 TXT…";try{const {error}=await sb.storage.from(CLOUD_BUCKET).upload(path,blob,{contentType:"text/plain;charset=utf-8",upsert:true,cacheControl:"3600"});if(error)throw error;const {error:metaError}=await sb.from("aivault_file_assets").upsert({user_id:authUser.id,name,storage_path:path,bucket_id:CLOUD_BUCKET,mime_type:"text/plain",file_size_bytes:blob.size,metadata:{source:"large_text_editor",character_count:text.length,utf8_bytes:blob.size}},{onConflict:"user_id,storage_path"});if(metaError&&metaError.code!=="23505")throw metaError;$("cloudStatus").textContent=`☁️ 已儲存「${name}」到 Supabase 雲端，${text.length.toLocaleString()} 字元 / ${fmtSize(blob.size)}。`;await refresh()}catch(e){console.error(e);$("cloudStatus").textContent="雲端儲存失敗："+e.message}finally{btn.disabled=false}}
async function downloadCloud(path,name){try{const {data,error}=await sb.storage.from(CLOUD_BUCKET).download(path);if(error)throw error;const u=URL.createObjectURL(data),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){alert("雲端下載失敗："+e.message)}}
async function deleteCloud(f){if(!confirm(`確定刪除雲端檔案「${f.name}」？`))return;try{const {error}=await sb.storage.from(CLOUD_BUCKET).remove([f.path]);if(error)throw error;await sb.from("aivault_file_assets").delete().eq("user_id",authUser.id).eq("storage_path",f.path);await refresh()}catch(e){alert("雲端刪除失敗："+e.message)}}
async function preview(id,f,isCloud){let file=f;if(!isCloud)file=await getFile(id);if(!file)return;let url=file.url;if(!url)url=URL.createObjectURL(file.blob);$("modalTitle").textContent=file.name;const b=$("modalBody");b.innerHTML="";if((file.type||"").startsWith("image/")){const img=document.createElement("img");img.className="preview-img";img.src=url;b.appendChild(img)}else if((file.type||"").startsWith("video/")){const v=document.createElement("video");v.className="preview-video";v.controls=true;v.src=url;b.appendChild(v)}else if((file.type||"").startsWith("audio/")){const a=document.createElement("audio");a.className="preview-audio";a.controls=true;a.src=url;b.appendChild(a)}else if(file.type==="application/pdf"||/\.pdf$/i.test(file.name)){const iframe=document.createElement("iframe");iframe.src=url;b.appendChild(iframe)}else if((file.type||"").includes("json")||/\.(txt|json|csv|md)$/i.test(file.name)){const pre=document.createElement("pre");pre.textContent=isCloud?await fetch(url).then(r=>r.text()):await file.blob.text();b.appendChild(pre)}else if((file.type||"").includes("word")||/\.docx?$/i.test(file.name)){if(window.mammoth){const ab=isCloud?await fetch(url).then(r=>r.arrayBuffer()):await file.blob.arrayBuffer();const result=await mammoth.convertToHtml({arrayBuffer:ab});const div=document.createElement("div");div.innerHTML=result.value;b.appendChild(div)}else{const p=document.createElement("p");p.textContent="Word 預覽元件尚未載入。你仍可下載檔案。";b.appendChild(p)}}else{const p=document.createElement("p");p.textContent="此格式可以儲存，但瀏覽器無法直接預覽。";b.appendChild(p)}$("modal").classList.add("show")}
function closeModal(){$("modal").classList.remove("show");$("modalBody").innerHTML=""}$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});
async function downloadFile(id){const f=await getFile(id);if(!f)return;const a=document.createElement("a");a.href=URL.createObjectURL(f.blob);a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function deleteOne(id,name){if(!confirm(`確定刪除「${name}」？`))return;await removeFile(id);await refresh()}async function deleteAll(){const files=await allFiles();if(!files.length)return;if(!confirm(`確定刪除全部 ${files.length} 個本機檔案？此動作無法復原。`))return;await clearFiles();await refresh()}
function clearEditor(){if(largeText.value&&!confirm("確定清空目前文字？"))return;largeText.value="";updateCount();$("cloudStatus").textContent=""}
(async()=>{try{await initDB();await initAuth();await refresh()}catch(e){status.textContent="檔案庫初始化失敗";console.error(e)}})();
</script>
<script src="https://unpkg.com/mammoth@1.9.1/mammoth.browser.min.js"></script>
</body>
</html>
