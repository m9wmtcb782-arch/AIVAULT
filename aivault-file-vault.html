<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AIVAULT 檔案庫</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#f5f6f8;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif}body{min-height:100vh}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd;padding:14px 18px}.headrow{display:flex;align-items:center;gap:12px}h1{margin:0;font-size:24px}.sub{margin-top:4px;color:#666;font-size:13px}.authbar{font-size:12px;color:#666;margin-top:6px}.drawerBtn{font-size:15px;padding:9px 12px;margin-left:auto}.wrap{max-width:1100px;margin:auto;padding:18px}.drop{background:#fff;border:2px dashed #aaa;border-radius:16px;padding:28px;text-align:center;cursor:pointer}.drop.drag{border-color:#111;background:#fafafa}.drop strong{font-size:18px}.drop p{margin:8px 0;color:#666}button{border:0;border-radius:10px;padding:10px 14px;background:#111;color:#fff;font-size:15px;cursor:pointer}button.secondary{background:#eee;color:#111}button.danger{background:#c62828}button:disabled{opacity:.5;cursor:not-allowed}input[type=file]{display:none}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}#status{color:#666;font-size:14px;align-self:center}.cloud{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin:18px 0}.cloud h2{margin:0 0 8px;font-size:19px}.hint{color:#666;font-size:13px;margin-bottom:12px}.field{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.field input{flex:1;min-width:180px;padding:11px 12px;border:1px solid #ccc;border-radius:10px;font-size:15px}.editor{width:100%;min-height:480px;resize:vertical;padding:14px;border:1px solid #ccc;border-radius:12px;background:#fafafa;font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono",monospace}.counter{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#666;font-size:13px;margin:8px 0 12px}.cloud-actions{display:flex;gap:8px;flex-wrap:wrap}.cloud-status{margin-top:10px;font-size:13px;color:#555}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;overflow:hidden}.thumb{height:170px;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img,.thumb video{width:100%;height:100%;object-fit:contain}.icon{font-size:48px;color:#fff}.info{padding:12px}.name{font-weight:700;word-break:break-all}.meta{color:#777;font-size:12px;margin-top:5px;line-height:1.5}.source{font-size:11px;color:#555;margin-top:5px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{font-size:13px;padding:8px 10px}.empty{text-align:center;color:#777;padding:50px;background:#fff;border-radius:14px;border:1px solid #ddd}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;padding:20px}.modal.show{display:flex;align-items:center;justify-content:center}.panel{background:#fff;width:min(1000px,100%);height:min(90vh,900px);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}.panelhead{padding:12px 16px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;gap:10px;align-items:center}.panelbody{padding:16px;overflow:auto;flex:1}.preview-img{max-width:100%;max-height:70vh;display:block;margin:auto}.preview-video{width:100%;max-height:70vh}.preview-audio{width:100%;margin-top:20px}pre{white-space:pre-wrap;word-break:break-word;background:#f3f3f3;padding:14px;border-radius:10px}iframe{width:100%;height:70vh;border:0}audio,video{outline:none}
.drawerShade{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:40}.drawerShade.show{display:block}.drawer{position:fixed;top:0;right:0;height:100vh;width:min(430px,92vw);background:#fff;z-index:50;box-shadow:-8px 0 30px rgba(0,0,0,.18);transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column}.drawer.open{transform:translateX(0)}.drawerHead{padding:16px;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:10px}.drawerHead strong{font-size:20px}.drawerClose{margin-left:auto}.drawerTools{padding:12px;border-bottom:1px solid #eee;display:flex;gap:8px;flex-wrap:wrap}.drawerTools button{font-size:13px;padding:8px 10px}.drawerList{overflow:auto;padding:10px}.drawerItem{border:1px solid #ddd;border-radius:12px;padding:11px;margin-bottom:9px;background:#fafafa}.drawerTop{display:flex;gap:9px;align-items:flex-start}.drawerIcon{font-size:28px}.drawerName{font-weight:700;word-break:break-all;flex:1}.drawerMeta{font-size:12px;color:#666;line-height:1.55;margin-top:5px}.drawerActions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.drawerActions button{font-size:12px;padding:7px 9px}.badge{display:inline-block;border-radius:999px;padding:2px 7px;background:#e9e9e9;color:#555;font-size:11px;margin-left:4px}.drawerEmpty{text-align:center;color:#777;padding:35px 12px}.sectionTitle{font-size:12px;color:#777;font-weight:700;padding:6px 3px}
@media(max-width:600px){.wrap{padding:12px}.drop{padding:22px 12px}.grid{grid-template-columns:1fr}.thumb{height:200px}.editor{min-height:360px}.headrow h1{font-size:20px}}
</style>
</head>
<body>
<header>
  <div class="headrow"><h1>🌑 AIVAULT 檔案庫</h1><button class="drawerBtn" type="button" onclick="openDrawer()">☰ 檔案管理</button></div>
  <div class="sub">獨立檔案上傳、儲存、預覽、播放與刪除</div>
  <div id="authbar" class="authbar">正在檢查 AIVAULT 登入狀態…</div>
</header>
<main class="wrap">
  <div id="drop" class="drop"><strong>拖曳檔案到這裡，或點擊選擇檔案</strong><p>支援 JPG、PNG、GIF、WEBP、JSON、TXT、Word、PDF、MP4、WEBM、MOV、WAV、MP3、M4A 等</p><button type="button" onclick="fileInput.click()">選擇檔案</button><input id="fileInput" type="file" multiple accept=".jpg,.jpeg,.png,.gif,.webp,.json,.txt,.csv,.md,.doc,.docx,.pdf,.mp4,.webm,.mov,.m4v,.wav,.mp3,.m4a,.aac,.ogg"></div>
  <div class="toolbar"><button type="button" onclick="fileInput.click()">＋ 上傳檔案</button><button class="secondary" type="button" onclick="refresh()">重新整理</button><button class="secondary" type="button" onclick="openDrawer()">☰ 開啟檔案管理</button><button class="danger" type="button" onclick="deleteAll()">刪除全部本機</button><span id="status"></span></div>
  <section class="cloud"><h2>📝 大型文字 → TXT → 雲端儲存</h2><div class="hint">可直接貼上大型內容；不設定 100,000 字元硬上限。儲存後同步到 Supabase「aivault-files」，並保留本機檔案庫。</div><div class="field"><input id="txtName" type="text" value="aivault-text" placeholder="輸入 TXT 檔案名稱"><button type="button" onclick="downloadEditorTxt()">⬇️ 下載 TXT</button></div><textarea id="largeText" class="editor" spellcheck="false" placeholder="把大型文字、程式碼、文件內容直接貼在這裡…"></textarea><div class="counter"><span id="charCount">字元：0</span><span id="byteCount">UTF-8：0 B</span><span>目標：100,000+ 字元</span></div><div class="cloud-actions"><button id="saveCloudBtn" type="button" onclick="saveLargeTextToCloud()">☁️ 儲存 TXT 到雲端</button><button class="secondary" type="button" onclick="saveEditorLocal()">💾 同時存入本機檔案庫</button><button class="secondary" type="button" onclick="clearEditor()">清空文字</button></div><div id="cloudStatus" class="cloud-status"></div></section>
  <div id="list" class="grid"></div>
</main>
<div id="drawerShade" class="drawerShade" onclick="closeDrawer()"></div>
<aside id="drawer" class="drawer" aria-label="檔案管理抽屜"><div class="drawerHead"><strong>📁 已儲存檔案</strong><button class="secondary drawerClose" onclick="closeDrawer()">✕</button></div><div class="drawerTools"><button type="button" onclick="refreshDrawer()">↻ 重新整理</button><button class="secondary" type="button" onclick="deleteAllCloud()">刪除全部雲端</button></div><div id="drawerList" class="drawerList"></div></aside>
<div id="modal" class="modal"><div class="panel"><div class="panelhead"><strong id="modalTitle">預覽</strong><button class="secondary" onclick="closeModal()">關閉</button></div><div id="modalBody" class="panelbody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/mammoth@1.9.1/mammoth.browser.min.js"></script>
<script>
const DB_NAME="aivault_file_vault",STORE="files";const SUPABASE_URL="https://clcddygkaaqqtsbswgdf.supabase.co";const SUPABASE_KEY="sb_publishable_1D05YGthBrNGg-5L92TLCw_GiLnInBu";const CLOUD_BUCKET="aivault-files";const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let db,authUser=null,cloudFiles=[];const $=id=>document.getElementById(id);const fileInput=$("fileInput"),drop=$("drop"),list=$("list"),status=$("status"),largeText=$("largeText");
function initDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE)){const s=d.createObjectStore(STORE,{keyPath:"id",autoIncrement:true});s.createIndex("created","created")}};req.onsuccess=e=>{db=e.target.result;resolve()};req.onerror=()=>reject(req.error)})}function tx(mode="readonly"){return db.transaction(STORE,mode).objectStore(STORE)}function addFile(file){return new Promise((resolve,reject)=>{const r=tx("readwrite").add({name:file.name,type:file.type||guessType(file.name),size:file.size,created:Date.now(),blob:file});r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}function allFiles(){return new Promise((resolve,reject)=>{const r=tx().getAll();r.onsuccess=()=>resolve(r.result.sort((a,b)=>b.created-a.created));r.onerror=()=>reject(r.error)})}function getFile(id){return new Promise((resolve,reject)=>{const r=tx().get(Number(id));r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function removeFile(id){return new Promise((resolve,reject)=>{const r=tx("readwrite").delete(Number(id));r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}function clearFiles(){return new Promise((resolve,reject)=>{const r=tx("readwrite").clear();r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function guessType(name){const ext=name.split(".").pop().toLowerCase();const m={jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",gif:"image/gif",webp:"image/webp",json:"application/json",txt:"text/plain",csv:"text/csv",md:"text/markdown",pdf:"application/pdf",mp4:"video/mp4",webm:"video/webm",mov:"video/quicktime",m4v:"video/mp4",wav:"audio/wav",mp3:"audio/mpeg",m4a:"audio/mp4",aac:"audio/aac",ogg:"audio/ogg",doc:"application/msword",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"};return m[ext]||"application/octet-stream"}function extOf(name){const i=String(name||"").lastIndexOf(".");return i>0?String(name).slice(i+1).toUpperCase():"無副檔名"}function fmtSize(n){n=Number(n)||0;if(n<1024)return n+" B";if(n<1024**2)return(n/1024).toFixed(1)+" KB";if(n<1024**3)return(n/1024**2).toFixed(1)+" MB";return(n/1024**3).toFixed(2)+" GB"}function fmtDate(v){return v?new Date(v).toLocaleString("zh-TW",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}):"未知"}function icon(type,name){if((type||"").startsWith("image/"))return"🖼️";if((type||"").startsWith("video/"))return"🎬";if((type||"").startsWith("audio/"))return"🎵";if((type||"").includes("pdf"))return"📕";if((type||"").includes("word")||/\.docx?$/i.test(name))return"📘";if((type||"").includes("json")||/\.json$/i.test(name))return"🧩";if(/\.txt$/i.test(name))return"📝";return"📄"}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function initAuth(){try{const {data}=await sb.auth.getSession();authUser=data.session?.user||null;updateAuthUI();await loadCloudFiles()}catch(e){console.error(e);$("authbar").textContent="雲端登入狀態檢查失敗；本機檔案庫仍可使用。"}}function updateAuthUI(){if(authUser){$("authbar").textContent="☁️ Supabase 雲端：已登入 · "+(authUser.email||authUser.id);$("saveCloudBtn").disabled=false}else{$("authbar").textContent="☁️ Supabase 雲端：尚未登入；大型文字仍可下載／存本機。";$("saveCloudBtn").disabled=true}}sb.auth.onAuthStateChange((_event,session)=>{authUser=session?.user||null;updateAuthUI();loadCloudFiles()});
async function handleFiles(files){for(const f of files){try{await addFile(f)}catch(e){console.error(e)}}await refresh()}fileInput.addEventListener("change",e=>handleFiles([...e.target.files]));["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("drag")}));["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("drag")}));drop.addEventListener("drop",e=>handleFiles([...e.dataTransfer.files]));drop.addEventListener("click",e=>{if(e.target.tagName!=="BUTTON")fileInput.click()});
async function refresh(){const files=await allFiles();status.textContent=`本機 ${files.length} 個檔案`;renderLocal(files);await loadCloudFiles();renderDrawer(files,cloudFiles)}function renderLocal(files){list.innerHTML="";if(!files.length){list.innerHTML='<div class="empty" style="grid-column:1/-1">目前沒有本機檔案。請上傳檔案或從大型文字區儲存。</div>';return}files.forEach(f=>renderCard(f,false))}function renderCard(f,isCloud){const card=document.createElement("div");card.className="card";const thumb=document.createElement("div");thumb.className="thumb";if(f.type?.startsWith("image/")){const img=document.createElement("img");img.src=f.url||URL.createObjectURL(f.blob);thumb.appendChild(img)}else if(f.type?.startsWith("video/")){const v=document.createElement("video");v.src=f.url||URL.createObjectURL(f.blob);v.muted=true;v.preload="metadata";thumb.appendChild(v)}else{const d=document.createElement("div");d.className="icon";d.textContent=icon(f.type||"",f.name);thumb.appendChild(d)}const info=document.createElement("div");info.className="info";info.innerHTML=`<div class="name">${esc(f.name)}</div><div class="meta">副檔名：${esc(extOf(f.name))}<br>格式：${esc(f.type||"未知格式")} · 大小：${fmtSize(f.size||0)}<br>存檔時間：${esc(fmtDate(f.created))}</div><div class="source">${isCloud?"☁️ Supabase 雲端":"💻 本機 IndexedDB"}</div>`;const acts=document.createElement("div");acts.className="actions";const p=document.createElement("button");p.textContent="預覽 / 播放";p.onclick=()=>preview(f.id,f,isCloud);const dl=document.createElement("button");dl.className="secondary";dl.textContent="儲存到裝置";dl.onclick=()=>isCloud?downloadCloud(f.path,f.name):downloadFile(f.id);acts.append(p,dl);const del=document.createElement("button");del.className="danger";del.textContent=isCloud?"刪除雲端":"刪除";del.onclick=()=>isCloud?deleteCloud(f):deleteOne(f.id,f.name);acts.appendChild(del);info.appendChild(acts);card.append(thumb,info);list.appendChild(card)}
async function loadCloudFiles(){if(!authUser){cloudFiles=[];renderDrawer(await allFiles(),[]);return}try{const {data,error}=await sb.storage.from(CLOUD_BUCKET).list(authUser.id,{limit:1000,sortBy:{column:"name",order:"asc"}});if(error)throw error;cloudFiles=(data||[]).map(x=>{const name=x.name;return{name,path:`${authUser.id}/${name}`,type:x.metadata?.mimetype||x.metadata?.contentType||guessType(name),size:x.metadata?.size||0,created:x.created_at||x.updated_at||x.last_accessed_at||Date.now(),updated:x.updated_at}});const signed=await Promise.all(cloudFiles.map(async f=>{const r=await sb.storage.from(CLOUD_BUCKET).createSignedUrl(f.path,3600);return {...f,url:r.data?.signedUrl||""}}));cloudFiles=signed;status.textContent=`本機 ${await countLocal()} 個 · 雲端 ${cloudFiles.length} 個`;renderDrawer(await allFiles(),cloudFiles)}catch(e){console.error(e);$("cloudStatus").textContent="雲端檔案清單讀取失敗："+e.message;renderDrawer(await allFiles(),[])}}
async function countLocal(){return (await allFiles()).length}
function openDrawer(){ $("drawer").classList.add("open");$("drawerShade").classList.add("show");refreshDrawer()}function closeDrawer(){$("drawer").classList.remove("open");$("drawerShade").classList.remove("show")}async function refreshDrawer(){const local=await allFiles();await loadCloudFiles();renderDrawer(local,cloudFiles)}
function renderDrawer(local,cloud){const box=$("drawerList");box.innerHTML="";if(!local.length&&!cloud.length){box.innerHTML='<div class="drawerEmpty">目前沒有儲存的檔案。</div>';return}if(cloud.length){const t=document.createElement("div");t.className="sectionTitle";t.textContent=`☁️ 雲端檔案（${cloud.length}）`;box.appendChild(t);cloud.forEach(f=>drawerItem(box,f,true))}if(local.length){const t=document.createElement("div");t.className="sectionTitle";t.textContent=`💻 本機檔案（${local.length}）`;box.appendChild(t);local.forEach(f=>drawerItem(box,f,false))}}
function drawerItem(box,f,isCloud){const item=document.createElement("div");item.className="drawerItem";const top=document.createElement("div");top.className="drawerTop";top.innerHTML=`<div class="drawerIcon">${icon(f.type||"",f.name)}</div><div class="drawerName">${esc(f.name)} <span class="badge">.${esc(extOf(f.name).toLowerCase())}</span><div class="drawerMeta">大小：${fmtSize(f.size)}<br>存檔時間：${esc(fmtDate(f.created))}<br>${isCloud?"位置：AIVAULT 雲端":"位置：本機檔案庫"}</div></div>`;const acts=document.createElement("div");acts.className="drawerActions";const p=document.createElement("button");p.textContent="預覽";p.onclick=()=>preview(f.id,f,isCloud);const d=document.createElement("button");d.className="secondary";d.textContent="下載";d.onclick=()=>isCloud?downloadCloud(f.path,f.name):downloadFile(f.id);const x=document.createElement("button");x.className="danger";x.textContent="刪除";x.onclick=()=>isCloud?deleteCloud(f):deleteOne(f.id,f.name);acts.append(p,d,x);item.append(top,acts);box.appendChild(item)}
async function preview(id,f,isCloud){let blob=f.blob;if(isCloud){if(!f.url)return alert("無法取得雲端預覽連結");if(f.type?.startsWith("image/")||f.type?.startsWith("video/")||f.type?.startsWith("audio/")||f.type?.includes("pdf")){showPreview(f.name,f.type,f.url)}else{try{const r=await fetch(f.url);blob=await r.blob();await showBlobPreview(f.name,f.type,blob)}catch(e){alert("讀取檔案失敗："+e.message)}}}else{if(!blob){const g=await getFile(id);blob=g.blob}await showBlobPreview(f.name,f.type,blob)}}async function showBlobPreview(name,type,blob){const url=URL.createObjectURL(blob);showPreview(name,type,url,blob)}function showPreview(name,type,url,blob){$("modalTitle").textContent=name;const body=$("modalBody");body.innerHTML="";if(type?.startsWith("image/")){const i=document.createElement("img");i.className="preview-img";i.src=url;body.appendChild(i)}else if(type?.startsWith("video/")){const v=document.createElement("video");v.className="preview-video";v.controls=true;v.autoplay=false;v.src=url;body.appendChild(v)}else if(type?.startsWith("audio/")){const a=document.createElement("audio");a.className="preview-audio";a.controls=true;a.src=url;body.appendChild(a)}else if(type?.includes("pdf")){const fr=document.createElement("iframe");fr.src=url;body.appendChild(fr)}else if(type?.includes("word")||/\.docx?$/i.test(name)){if(blob&&window.mammoth){const reader=new FileReader();reader.onload=async e=>{try{const r=await mammoth.convertToHtml({arrayBuffer:e.target.result});body.innerHTML=r.value}catch(err){body.innerHTML='<pre>Word 預覽失敗：'+esc(err.message)+'</pre>'}};reader.readAsArrayBuffer(blob)}else body.innerHTML='<p>Word 檔案已儲存，可下載到裝置開啟。</p>'}else{const load=async()=>{try{const text=blob?await blob.text():await fetch(url).then(r=>r.text());const pre=document.createElement("pre");pre.textContent=text;body.appendChild(pre)}catch(e){body.innerHTML='<p>此檔案沒有內建預覽器，請下載後開啟。</p>'}};load()}$("modal").classList.add("show")}function closeModal(){$("modal").classList.remove("show");$("modalBody").innerHTML=""}
function downloadFile(id){getFile(id).then(f=>{const a=document.createElement("a");a.href=URL.createObjectURL(f.blob);a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)})}async function downloadCloud(path,name){const r=await sb.storage.from(CLOUD_BUCKET).createSignedUrl(path,300);if(r.error)return alert(r.error.message);const a=document.createElement("a");a.href=r.data.signedUrl;a.download=name;a.target="_blank";a.click()}
async function deleteOne(id,name){if(!confirm(`確定刪除本機檔案「${name}」？`))return;await removeFile(id);await refresh()}async function deleteAll(){if(!confirm("確定刪除全部本機檔案？雲端檔案不會被刪除。"))return;await clearFiles();await refresh()}async function deleteCloud(f){if(!authUser)return;if(!confirm(`確定刪除雲端檔案「${f.name}」？\n這會從 Supabase 儲存空間永久刪除。`))return;const r=await sb.storage.from(CLOUD_BUCKET).remove([f.path]);if(r.error)return alert("刪除雲端檔案失敗："+r.error.message);const m=await sb.from("aivault_file_assets").delete().eq("user_id",authUser.id).eq("storage_path",f.path);if(m.error)console.warn("metadata delete:",m.error);await refresh();alert("已刪除雲端檔案："+f.name)}async function deleteAllCloud(){if(!authUser||!cloudFiles.length)return;if(!confirm(`確定刪除全部 ${cloudFiles.length} 個雲端檔案？此操作不可復原。`))return;const paths=cloudFiles.map(f=>f.path);const r=await sb.storage.from(CLOUD_BUCKET).remove(paths);if(r.error)return alert("刪除全部雲端檔案失敗："+r.error.message);await sb.from("aivault_file_assets").delete().eq("user_id",authUser.id);await refresh()}
largeText.addEventListener("input",()=>{const t=largeText.value;$("charCount").textContent=`字元：${t.length.toLocaleString()}`;$("byteCount").textContent=`UTF-8：${new Blob([t]).size.toLocaleString()} B`});function safeTxtName(){let n=$("txtName").value.trim()||"aivault-text";if(!/\.txt$/i.test(n))n+=".txt";return n.replace(/[\\/:*?"<>|]/g,"_")}function downloadEditorTxt(){const blob=new Blob([largeText.value],{type:"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=safeTxtName();a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function saveEditorLocal(){const text=largeText.value;if(!text){return alert("請先貼上文字內容。")};const f=new File([text],safeTxtName(),{type:"text/plain;charset=utf-8"});await addFile(f);await refresh();$("cloudStatus").textContent="已存入本機檔案庫："+f.name}function clearEditor(){if(confirm("確定清空目前文字？"))largeText.value="";$("charCount").textContent="字元：0";$("byteCount").textContent="UTF-8：0 B"}
async function saveLargeTextToCloud(){const text=largeText.value;if(!text)return alert("請先貼上文字內容。");if(!authUser)return alert("目前尚未登入 AIVAULT 雲端，請先登入後再儲存雲端檔案。\n你仍可使用「下載 TXT」或「同時存入本機檔案庫」。");const name=safeTxtName();const blob=new Blob([text],{type:"text/plain;charset=utf-8"});const path=`${authUser.id}/${name}`;$("saveCloudBtn").disabled=true;$("cloudStatus").textContent="正在上傳雲端…";try{const r=await sb.storage.from(CLOUD_BUCKET).upload(path,blob,{contentType:"text/plain;charset=utf-8",upsert:true,cacheControl:"3600"});if(r.error)throw r.error;const meta=await sb.from("aivault_file_assets").upsert({user_id:authUser.id,name,storage_path:path,bucket_id:CLOUD_BUCKET,mime_type:"text/plain",file_size_bytes:blob.size,metadata:{source:"large_text_editor",character_count:text.length,utf8_bytes:blob.size,saved_at:new Date().toISOString()}},{onConflict:"user_id,storage_path"});if(meta.error)console.warn("metadata:",meta.error);$("cloudStatus").textContent=`☁️ 已儲存：${name} · ${text.length.toLocaleString()} 字元 · ${fmtDate(new Date())}`;await loadCloudFiles()}catch(e){console.error(e);$("cloudStatus").textContent="雲端儲存失敗："+e.message}finally{$("saveCloudBtn").disabled=!authUser}}
$(document).addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();closeDrawer()}});$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});(async()=>{try{await initDB();await refresh();await initAuth()}catch(e){console.error(e);alert("檔案庫初始化失敗："+e.message)}})();
</script>
