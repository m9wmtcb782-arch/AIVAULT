<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Technical Dark Star｜情緒數字人即時測試</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#fff;color:#202123}body{overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #eee;gap:10px}.logo{width:30px;height:30px;border-radius:9px;background:#171717;color:#fff;display:flex;align-items:center;justify-content:center}.title{font-weight:700}.engine{font-size:12px;color:#888}.main{flex:1;min-height:0;overflow:auto;padding:16px}.card{max-width:900px;margin:auto;border:1px solid #e5e5e5;border-radius:16px;padding:14px}.modes{display:flex;gap:8px}.mode,.btn{flex:1;border:1px solid #ddd;background:#fff;border-radius:11px;padding:11px;font-weight:600}.mode.active,.primary{background:#171717;color:#fff;border-color:#171717}.voice-row{display:grid;grid-template-columns:90px 1fr;gap:8px;margin:12px 0}.voice-select{border:1px solid #ddd;border-radius:10px;padding:10px;background:#fff}.status{padding:9px 11px;background:#f6f6f6;border-radius:10px;font-size:13px}.video{margin-top:12px;width:100%;max-height:45vh;background:#111;border-radius:14px;object-fit:cover}.controls{display:flex;gap:8px;margin-top:10px}.log{height:130px;overflow:auto;background:#fafafa;border:1px solid #eee;border-radius:10px;padding:9px;font-size:12px;white-space:pre-wrap}.avatar{position:fixed;right:14px;bottom:14px;width:220px;background:rgba(255,255,255,.97);border:1px solid #e8e8e8;border-radius:24px;box-shadow:0 12px 38px rgba(0,0,0,.14);overflow:hidden;z-index:20}.ah{padding:8px 11px;font-size:11px;font-weight:700;display:flex;justify-content:space-between}.ae{color:#777;font-weight:500}.stage{height:190px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#fff,#fafafa)}.face{position:relative;width:132px;height:132px;border-radius:48% 48% 45% 45%;background:linear-gradient(145deg,#ffecd9,#ffd6b5);border:2px solid #efc29b;transition:transform .25s ease}.hair{position:absolute;left:-7px;top:-10px;width:144px;height:68px;background:linear-gradient(135deg,#2e211e,#70483a);border-radius:75px 75px 25px 25px;z-index:5}.bang{position:absolute;left:45px;top:40px;width:34px;height:45px;background:#493029;border-radius:0 0 24px 24px;transform:rotate(8deg)}.brow{position:absolute;top:49px;width:34px;height:6px;background:#4a3029;border-radius:8px;z-index:8;transition:transform .16s ease}.brow.l{left:22px}.brow.r{right:22px}.eye{position:absolute;top:60px;width:32px;height:21px;background:#fff;border:1px solid #e8d8cf;border-radius:50%;overflow:hidden;z-index:7;transition:height .12s ease,transform .12s ease}.eye.l{left:18px}.eye.r{right:18px}.pupil{position:absolute;width:12px;height:12px;border-radius:50%;background:#292321;left:9px;top:4px;transition:transform .18s ease}.pupil:after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;left:2px;top:1px}.mouth{position:absolute;left:47px;top:94px;width:38px;height:9px;background:#a94d5b;border-radius:0 0 22px 22px;z-index:9;transition:all .08s ease}.as{height:26px;border-top:1px solid #eee;text-align:center;padding:6px;font-size:10px;color:#777}.speaking .face{animation:talk .22s ease-in-out infinite alternate}@keyframes talk{from{transform:translateY(0)}to{transform:translateY(-1.5px)}}.avatar[data-e="happy"] .mouth{height:15px;border-radius:5px 5px 22px 22px}.avatar[data-e="sad"] .mouth,.avatar[data-e="regret"] .mouth{height:5px;transform:rotate(180deg)}.avatar[data-e="angry"] .brow.l{transform:rotate(16deg)}.avatar[data-e="angry"] .brow.r{transform:rotate(-16deg)}.avatar[data-e="surprised"] .eye,.avatar[data-e="fear"] .eye{height:28px}.avatar[data-e="surprised"] .mouth,.avatar[data-e="fear"] .mouth{height:22px;width:24px;left:54px;border-radius:50%}.avatar[data-e="thinking"] .pupil{transform:translate(7px,-3px)}.avatar[data-e="nostalgia"] .face{transform:rotate(-2deg)}.avatar[data-e="touched"] .face{transform:translateY(-2px)}@media(max-width:600px){.avatar{width:155px;right:8px;bottom:8px}.stage{height:140px}.face{transform:scale(.82)}.avatar[data-e="nostalgia"] .face{transform:scale(.82) rotate(-2deg)}}
</style></head><body><div class="app"><header class="top"><div class="logo">✦</div><div><div class="title">Technical Dark Star</div><div class="engine">情緒數字人｜即時語音／視訊</div></div></header><main class="main"><section class="card"><div class="modes"><button id="vBtn" class="mode active" onclick="setMode('voice')">🎤 即時語音</button><button id="cBtn" class="mode" onclick="setMode('video')">🎥 即時視訊</button></div><div class="voice-row"><b>🔊 聲音</b><select id="voice" class="voice-select"></select></div><div id="status" class="status">尚未連線</div><video id="cam" class="video" autoplay playsinline muted style="display:none"></video><div class="controls"><button class="btn primary" onclick="start()">▶ 開始</button><button class="btn" onclick="stop()">■ 停止</button><button id="switch" class="btn" onclick="switchCamera()" style="display:none">🔄 鏡頭</button></div><pre id="log" class="log"></pre></section></main></div><div id="avatar" class="avatar" data-e="neutral"><div class="ah"><span>🌟 暗星</span><span id="emotion" class="ae">平靜</span></div><div class="stage"><div class="face"><div class="hair"><div class="bang"></div></div><div class="brow l"></div><div class="brow r"></div><div class="eye l"><i class="pupil"></i></div><div class="eye r"><i class="pupil"></i></div><div class="mouth"></div></div></div><div id="avatarStatus" class="as">正在等待</div></div><script>
const FN='wss://clcddygkaaqqtsbswgdf.supabase.co/functions/v1/technical-dark-star-vision-test';const voices=[['Zephyr','明亮'],['Puck','活潑'],['Charon','資訊型'],['Kore','穩重'],['Fenrir','興奮'],['Leda','年輕'],['Orus','穩重'],['Aoede','輕快'],['Callirrhoe','輕鬆'],['Autonoe','明亮'],['Enceladus','氣聲'],['Iapetus','清晰'],['Umbriel','輕鬆'],['Algieba','順滑'],['Despina','順滑'],['Erinome','清晰'],['Algenib','沙啞'],['Rasalgethi','資訊型'],['Laomedeia','活潑'],['Achernar','柔和'],['Alnilam','穩重'],['Schedar','平穩'],['Gacrux','成熟'],['Pulcherrima','前衛'],['Achird','友善'],['Zubenelgenubi','隨性'],['Vindemiatrix','溫柔'],['Sadachbia','活潑'],['Sadaltager','知識型'],['Sulafat','溫暖']];const $=id=>document.getElementById(id);voices.forEach(v=>{let o=document.createElement('option');o.value=v[0];o.textContent=v[0]+' — '+v[1];$('voice').appendChild(o)});$('voice').value=localStorage.getItem('darkStarVoice')||'Kore';let mode='voice',ws=null,stream=null,pc=null,ic=null,src=null,proc=null,next=0,facing='user';let mouthLoop=null,blinkLoop=null,gazeLoop=null;const av=$('avatar');const labels={neutral:'平靜',touched:'感動',angry:'憤怒',sad:'悲傷',fear:'恐懼',nostalgia:'懷念',regret:'遺憾',happy:'開心',surprised:'驚訝',thinking:'思考'};const emotions=[['touched',/感動|感謝|欣慰|溫暖|感人|珍惜|謝謝/],['angry',/憤怒|生氣|火大|荒謬|不可接受|惱火|憤慨|氣憤/],['sad',/悲傷|難過|傷心|失落|痛苦|心疼|哭泣|眼淚/],['fear',/恐懼|害怕|危險|可怕|恐慌|擔心|不安/],['nostalgia',/懷念|想念|回憶|往事|曾經|那時/],['regret',/遺憾|可惜|後悔|錯過|沒能|未能|如果當時/],['surprised',/驚訝|竟然|沒想到|哇|原來|居然/],['happy',/哈哈|開心|高興|太棒|成功|恭喜|喜歡|太好了/],['thinking',/思考|分析|首先|其次|原因|因此|判斷|考慮|推理|結論/]];function log(s){$('log').textContent+='['+new Date().toLocaleTimeString('zh-TW')+'] '+s+'\n';$('log').scrollTop=$('log').scrollHeight}function setMode(m){if(ws||stream)return;mode=m;$('vBtn').classList.toggle('active',m==='voice');$('cBtn').classList.toggle('active',m==='video');$('cam').style.display=m==='video'?'block':'none';$('switch').style.display=m==='video'?'block':'none';}function emotion(t){for(const [e,re] of emotions)if(re.test(t))return e;return 'neutral'}function setEmotion(e){av.dataset.e=e;$('emotion').textContent=labels[e]||'平靜'}function motion(){clearInterval(blinkLoop);clearInterval(gazeLoop);blinkLoop=setInterval(()=>{if(av.classList.contains('speaking'))return;document.querySelectorAll('.eye').forEach(x=>x.style.height='3px');setTimeout(()=>document.querySelectorAll('.eye').forEach(x=>x.style.height='21px'),100)},3500);gazeLoop=setInterval(()=>{let x=Math.round(Math.random()*8-4),y=Math.round(Math.random()*5-2);document.querySelectorAll('.pupil').forEach(p=>p.style.transform=`translate(${x}px,${y}px)`)},1700)}function mouth(){if(!av.classList.contains('speaking'))av.classList.add('speaking');let m=document.querySelector('.mouth'),h=5+Math.random()*19,w=25+Math.random()*18;m.style.height=h+'px';m.style.width=w+'px';m.style.left=(66-w/2)+'px';m.style.borderRadius=h>15?'50%':'0 0 22px 22px';mouthLoop=setTimeout(mouth,85)}function stopMouth(){clearTimeout(mouthLoop);av.classList.remove('speaking');let m=document.querySelector('.mouth');m.style.height='9px';m.style.width='38px';m.style.left='47px'}function play(buf){if(!pc)return;let u=new Uint8Array(buf),p=new Int16Array(u.buffer,u.byteOffset,Math.floor(u.byteLength/2));if(!p.length)return;let b=pc.createBuffer(1,p.length,24000),d=b.getChannelData(0);for(let i=0;i<p.length;i++)d[i]=p[i]/32768;let s=pc.createBufferSource();s.buffer=b;s.connect(pc.destination);let now=pc.currentTime;if(next<now+.03)next=now+.03;s.start(next);next+=b.duration;mouth();$('avatarStatus').textContent='暗星正在說話'}function base64(b){let x=atob(b),u=new Uint8Array(x.length);for(let i=0;i<x.length;i++)u[i]=x.charCodeAt(i);play(u.buffer)}function handle(raw){if(raw instanceof ArrayBuffer){play(raw);return}try{let d=JSON.parse(raw);if(d.audio?.data)base64(d.audio.data);if(d.serverContent?.outputTranscription?.text){let t=d.serverContent.outputTranscription.text;log('暗星：'+t);setEmotion(emotion(t))}if(d.serverContent?.inputTranscription?.text)log('你：'+d.serverContent.inputTranscription.text);if(d.type)log('系統：'+d.type)}catch(e){log('解析錯誤：'+e.message)}}async function start(){try{if(ws)return;pc=new AudioContext();await pc.resume();ic=new AudioContext({sampleRate:16000});await ic.resume();let con={audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}};if(mode==='video')con.video={facingMode:facing,width:{ideal:1280},height:{ideal:720}};stream=await navigator.mediaDevices.getUserMedia(con);if(mode==='video')$('cam').srcObject=stream;ws=new WebSocket(FN+'?voice='+encodeURIComponent($('voice').value));ws.binaryType='arraybuffer';ws.onopen=()=>{$('status').textContent='🟢 暗星已連線｜正在聆聽';motion();log('WebSocket 已連線')};ws.onmessage=e=>handle(e.data);ws.onclose=()=>{$('status').textContent='⚪ 已斷線';stopMouth()};src=ic.createMediaStreamSource(stream);proc=ic.createScriptProcessor(2048,1,1);let silent=ic.createGain();silent.gain.value=0;proc.onaudioprocess=e=>{if(!ws||ws.readyState!==1)return;let a=e.inputBuffer.getChannelData(0),p=new Int16Array(a.length);for(let i=0;i<a.length;i++)p[i]=Math.max(-1,Math.min(1,a[i]))*32767;let u=new Uint8Array(p.buffer),bin='';for(let i=0;i<u.length;i++)bin+=String.fromCharCode(u[i]);ws.send(JSON.stringify({type:'audio',data:btoa(bin),mimeType:'audio/pcm;rate=16000'}))};src.connect(proc);proc.connect(silent);silent.connect(ic.destination);if(mode==='video')startVideo()}catch(e){$('status').textContent='🔴 啟動失敗';log(e.message||e)}}function startVideo(){let c=document.createElement('canvas'),x=c.getContext('2d');window.vt=setInterval(()=>{if(!ws||ws.readyState!==1||!$('cam').videoWidth)return;c.width=640;c.height=Math.round(640*$('cam').videoHeight/$('cam').videoWidth);x.drawImage($('cam'),0,0,c.width,c.height);ws.send(JSON.stringify({type:'video',data:c.toDataURL('image/jpeg',.72).split(',')[1],mimeType:'image/jpeg'}))},1000)}async function stop(){if(window.vt)clearInterval(window.vt);stopMouth();clearInterval(blinkLoop);clearInterval(gazeLoop);if(proc)proc.disconnect();if(src)src.disconnect();if(ic)await ic.close().catch(()=>{});if(pc)await pc.close().catch(()=>{});if(ws){try{ws.send(JSON.stringify({type:'close'}))}catch(e){}ws.close()}if(stream)stream.getTracks().forEach(t=>t.stop());ws=null;stream=null;ic=null;pc=null;proc=null;src=null;next=0;$('cam').srcObject=null;$('status').textContent='⚪ 已停止';$('avatarStatus').textContent='暗星已停止'}async function switchCamera(){if(mode!=='video'||!stream)return;facing=facing==='user'?'environment':'user';let old=stream;let ns=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}}});old.getTracks().forEach(t=>t.stop());stream=ns;$('cam').srcObject=ns;log(facing==='user'?'前鏡頭：自己':'後鏡頭：別人／書')}
</script></body></html>
