<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AIVAULT｜九職業選角室</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#0c233e,#385f80);color:#f5f9ff;font:15px system-ui}main{max-width:880px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 14px 90px}h1{margin:0 0 6px;font-size:23px}p{color:#d3e5f2;font-size:13px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}.role{border:2px solid #6289a6;border-radius:16px;padding:15px 6px;background:#163750;color:#fff;min-height:118px;text-align:center;font:inherit}.role[aria-pressed=true]{border-color:#ffd27d;background:#375975;box-shadow:0 0 0 2px #f4c76a33}.num{font-size:12px;color:#bad3e5}.role b{display:block;font-size:18px;margin:7px 0}.role small{font-size:11px;color:#d3e1e9}fieldset{margin:18px 0;border:1px solid #7299b5;border-radius:12px;padding:12px}legend{padding:0 7px}label{margin-right:18px}#selected{padding:12px;background:#09243bbb;border-radius:12px;line-height:1.7}#buttons{display:flex;gap:10px;margin-top:12px}#buttons button,#buttons a{flex:1;text-align:center;border-radius:12px;padding:12px 6px;border:1px solid #a7c6db;background:#225b7c;color:white;font:inherit;text-decoration:none}#buttons button:disabled{opacity:.4}#notice{font-size:12px;margin-top:8px}@media(max-width:370px){.role b{font-size:16px}.role{min-height:112px}}</style></head><body><main><h1>❄ AIVAULT｜協作城九職業選角</h1><p>依照協作城概念圖設立九種職業。此頁僅選擇角色設定，不會建立 AI、修改人口或宣稱已完成九套 3D 模型。</p><div class="grid" id="roles"></div><fieldset><legend>角色外觀</legend><label><input type="radio" name="gender" value="男" checked> 男性</label><label><input type="radio" name="gender" value="女"> 女性</label></fieldset><div id="selected" aria-live="polite">尚未選擇職業</div><div id="buttons"><button id="save" disabled>儲存我的選擇</button><a href="aivault-snow-city-rigged-crowd-test.html">觀看城市測試</a></div><p id="notice">選擇暫存於這台裝置的瀏覽器，不會寫入 Supabase。城市測試仍使用 Soldier 骨架素材。</p></main><script>
const roles=[["學者","研究、閱讀、學習"],["工程師","建設、維護、生產"],["探索者","搜尋、收集、資料"],["生活專家","烹飪、照顧、後勤"],["分析師","驗證、檢測、評估"],["藝術家","繪圖、設計、創作"],["建築師","建設、規劃、維護"],["醫療師","健康、照護、支援"],["貿易師","交易、資源、經濟"]];
const root=document.getElementById('roles'),selected=document.getElementById('selected'),save=document.getElementById('save'),notice=document.getElementById('notice');let current=-1;
roles.forEach(([name,desc],i)=>{const b=document.createElement('button');b.className='role';b.type='button';b.setAttribute('aria-pressed','false');b.innerHTML='<span class="num">職業 '+String(i+1).padStart(2,'0')+'</span><b>'+name+'</b><small>'+desc+'</small>';b.onclick=()=>{current=i;document.querySelectorAll('.role').forEach((el,j)=>el.setAttribute('aria-pressed',String(j===i)));update()};root.appendChild(b)});
function gender(){return document.querySelector('input[name="gender"]:checked').value}
function update(){selected.textContent=current<0?'尚未選擇職業':'已選：'+gender()+' · '+roles[current][0]+'｜'+roles[current][1];save.disabled=current<0}
document.querySelectorAll('input[name="gender"]').forEach(el=>el.onchange=update);
save.onclick=()=>{if(current<0)return;try{localStorage.setItem('aivault_snow_character_choice_v1',JSON.stringify({version:1,role_id:current+1,role:roles[current][0],gender:gender()}));notice.textContent='已儲存在這台裝置的瀏覽器。尚未同步用戶帳號或連接 3D 角色模型。'}catch(e){notice.textContent='儲存失敗：瀏覽器不允許本機儲存。'}};
try{const v=JSON.parse(localStorage.getItem('aivault_snow_character_choice_v1')||'null');if(v&&Number.isInteger(v.role_id)&&v.role_id>=1&&v.role_id<=9){document.querySelector('input[value="'+(v.gender==='女'?'女':'男')+'"]').checked=true;root.children[v.role_id-1].click()}}catch(e){}
</script></body></html>
