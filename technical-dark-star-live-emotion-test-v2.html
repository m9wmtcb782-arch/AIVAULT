<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Technical Dark Star｜臉部控制 V2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#fff;color:#202123}body{overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #eee;gap:10px}.logo{width:30px;height:30px;border-radius:9px;background:#171717;color:#fff;display:grid;place-items:center;color:#fff}.title{font-weight:700}.sub{font-size:12px;color:#888}.main{flex:1;overflow:auto;padding:16px}.card{max-width:900px;margin:auto;border:1px solid #e5e5e5;border-radius:16px;padding:14px}.modes,.controls{display:flex;gap:8px}.btn{flex:1;border:1px solid #ddd;background:#fff;border-radius:11px;padding:11px;font-weight:600}.active,.primary{background:#171717;color:#fff;border-color:#171717}.voice{display:grid;grid-template-columns:90px 1fr;gap:8px;margin:12px 0}.voice select{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;background:#fff}.status{margin:10px 0;padding:9px 11px;background:#f6f6f6;border-radius:10px;font-size:13px}.cam{width:100%;max-height:45vh;object-fit:cover;border-radius:14px;background:#111;display:none}.log{height:130px;overflow:auto;background:#fafafa;border:1px solid #eee;border-radius:10px;padding:9px;font-size:12px;white-space:pre-wrap}.avatar{position:fixed;right:12px;bottom:12px;width:220px;background:rgba(255,255,255,.97);border:1px solid #e8e8e8;border-radius:24px;box-shadow:0 12px 38px rgba(0,0,0,.14);overflow:hidden;z-index:30}.head{padding:8px 11px;font-size:11px;font-weight:700;display:flex;justify-content:space-between}.emo{color:#777;font-weight:500}.stage{height:190px;display:grid;place-items:center;background:linear-gradient(#fff,#fafafa)}.face{position:relative;width:132px;height:132px;border-radius:48% 48% 45% 45%;background:linear-gradient(145deg,#ffecd9,#ffd6b5);border:2px solid #efc29b}.hair{position:absolute;left:-7px;top:-10px;width:144px;height:68px;background:linear-gradient(135deg,#2e211e,#70483a);border-radius:75px 75px 25px 25px;z-index:5}.bang{position:absolute;left:45px;top:40px;width:34px;height:45px;background:#493029;border-radius:0 0 24px 24px;transform:rotate(8deg)}.brow{position:absolute;top:49px;width:34px;height:6px;background:#4a3029;border-radius:8px;z-index:8;transition:transform .16s ease,top .16s ease}.brow.l{left:22px}.brow.r{right:22px}.eye{position:absolute;top:60px;width:32px;height:21px;background:#fff;border:1px solid #e8d8cf;border-radius:50%;overflow:hidden;z-index:7;transition:height .12s ease}.eye.l{left:18px}.eye.r{right:18px}.pupil{position:absolute;width:12px;height:12px;border-radius:50%;background:#292321;left:9px;top:4px;transition:transform .18s ease}.pupil:after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;left:2px;top:1px}.mouth{position:absolute;left:47px;top:94px;width:38px;height:7px;background:#a94d5b;border-radius:0 0 22px 22px;z-index:9;transition:height .055s ease,width .055s ease,left .055s ease,border-radius .055s ease}.speaking .mouth{box-shadow:0 0 0 1px rgba(169,77,91,.12)}.avatar[data-e="happy"] .mouth{height:14px;border-radius:5px 5px 22px 22px}.avatar[data-e="sad"] .mouth,.avatar[data-e="regret"] .mouth{height:5px;border-radius:20px 20px 0 0;transform:rotate(180deg)}.avatar[data-e="angry"] .brow.l{transform:rotate(16deg)}.avatar[data-e="angry"] .brow.r{transform:rotate(-16deg)}.avatar[data-e="surprised"] .eye,.avatar[data-e="fear"] .eye{height:28px}.avatar[data-e="surprised"] .mouth,.avatar[data-e="fear"] .mouth{height:21px;width:23px;left:55px;border-radius:50%}.avatar[data-e="thinking"] .pupil{transform:translate(6px,-3px)}.avatar[data-e="nostalgia"] .face{transform:rotate(-2deg)}.avatar[data-e="touched"] .face{transform:translateY(-2px)}.face.look-left .pupil{transform:translate(-7px,0)}.face.look-right .pupil{transform:translate(7px,0)}.face.look-up .pupil{transform:translate(0,-4px)}.face.look-down .pupil{transform:translate(0,4px)}.face.look-left .brow.l{transform:translateX(-2px)}.face.look-right .brow.r{transform:translateX(2px)}.face.blink .eye{height:3px}.as{height:26px;border-top:1px solid #eee;text-align:center;padding:6px;font-size:10px;color:#777}@media(max-width:600px){.avatar{width:155px;right:7px;bottom:7px}.stage{height:140px}.face{transform:scale(.82)}.avatar[data-e="nostalgia"] .face{transform:scale(.82) rotate(-2deg)}} </style></head><body><div class="app"><header class="top"><div class="logo">✦</div><div><div class="title">Technical Dark Star</div><div class="sub">臉部控制 V2｜嘴型／眼睛／眉毛／視線</div></div></header><main class="main"><section class="card"><div class="modes"><button id="voiceBtn" class="btn active">🎤 即時語音</button><button id="videoBtn" class="btn">🎥 即時視訊</button></div><div class="voice"><b>🔊 聲音</b><select id="voice"></select></div><div id="status" class="status">尚未連線</div><video id="cam" class="cam" autoplay playsinline muted></video><div class="controls"><button id="start" class="btn primary">▶ 開始</button><button id="stop" class="btn">■ 停止</button><button id="switch" class="btn" style="display:none">↔ 視線／鏡頭</button></div><pre id="log" class="log"></pre></section></main></div><div id="avatar" class="avatar" data-e="neutral"><div class="head"><span>🌟 暗星</span><span id="emo" class="emo">平靜</span></div><div class="stage"><div id="face" class="face"><div class="hair"><div class="bang"></div></div><div class="brow l"></div><div class="brow r"></div><div class="eye l"><i class="pupil"></i></div><div class="eye r"><i class="pupil"></i></div><div id="mouth" class="mouth"></div></div></div><div id="as" class="as">正在等待</div></div><script>
const FN='wss://clcddygkaaqqtsbswgdf.supabase.co/functions/v1/technical-dark-star-vision-test';const VOICES=[['Zephyr','明亮'],['Puck','活潑'],['Charon','資訊型'],['Kore','穩重'],['Fenrir','興奮'],['Leda','年輕'],['Orus','穩重'],['Aoede','輕快'],['Callirrhoe','輕鬆'],['Autonoe','明亮'],['Enceladus','氣聲'],['Iapetus','清晰'],['Umbriel','輕鬆'],['Algieba','順滑'],['Despina','順滑'],['Erinome','清晰'],['Algenib','沙啞'],['Rasalgethi','資訊型'],['Laomedeia','活潑'],['Achernar','柔和'],['Alnilam','穩重'],['Schedar','平穩'],['Gacrux','成熟'],['Pulcherrima','前衛'],['Achird','友善'],['Zubenelgenubi','隨性'],['Vindemiatrix','溫柔'],['Sadachbia','活潑'],['Sadaltager','知識型'],['Sulafat','溫暖']];const $=x=>document.getElementById(x);for(const v of VOICES){let o=document.createElement('option');o.value=v[0];o.textContent=v[0]+' — '+v[1];$('voice').appendChild(o)}$('voice').value=localStorage.getItem('darkStarVoice')||'Kore';let mode='voice',ws=null,stream=null,inputCtx=null,playCtx=null,src=null,proc=null,nextPlay=0,facing='user',mouthRAF=0,mouthEndTimer=0,blinkTimer=0;let audioActiveUntil=0;const face=$('face'),mouthEl=$('mouth'),av=$('avatar');const labels={neutral:'平靜',touched:'感動',angry:'憤怒',sad:'悲傷',fear:'恐懼',nostalgia:'懷念',regret:'遺憾',happy:'開心',surprised:'驚訝',thinking:'思考'};const E=[['touched',/感動|感謝|欣慰|溫暖|感人|珍惜|謝謝/],['angry',/憤怒|生氣|火大|荒謬|不可接受|惱火|氣憤/],['sad',/悲傷|難過|傷心|失落|痛苦|心疼|哭泣|眼淚/],['fear',/恐懼|害怕|危險|可怕|恐慌|擔心|不安/],['nostalgia',/懷念|想念|回憶|往事|曾經|那時/],['regret',/遺憾|可惜|後悔|錯過|沒能|未能|如果當時/],['surprised',/驚訝|竟然|沒想到|哇|原來|居然/],['happy',/哈哈|開心|高興|太棒|成功|恭喜|喜歡|太好了/],['thinking',/思考|分析|首先|其次|原因|因此|判斷|考慮|推理|結論/]];function log(s){$('log').textContent+='['+new Date().toLocaleTimeString('zh-TW')+'] '+s+'\n';$('log').scrollTop=$('log').scrollHeight}function setEmotion(t){let e='neutral';for(const [n,r] of E)if(r.test(t)){e=n;break}av.dataset.e=e;$('emo').textContent=labels[e]}function setMode(m){if(ws||stream)return;mode=m;$('voiceBtn').classList.toggle('active',m==='voice');$('videoBtn').classList.toggle('active',m==='video');$('cam').style.display=m==='video'?'block':'none';$('switch').style.display=m==='video'?'block':'none'}$('voiceBtn').onclick=()=>setMode('voice');$('videoBtn').onclick=()=>setMode('video');
function setLook(dir){face.classList.remove('look-left','look-right','look-up','look-down');if(dir)face.classList.add('look-'+dir)}function interpretLook(t){const s=String(t||'');if(/左邊|左側|左方|往左|左手邊|左邊的/.test(s))return'left';if(/右邊|右側|右方|往右|右手邊|右邊的/.test(s))return'right';if(/上面|上方|往上|上邊/.test(s))return'up';if(/下面|下方|往下|下邊/.test(s))return'down';return null}function applyModelFaceCommand(t){setEmotion(t);const look=interpretLook(t);if(look)setLook(look)}
function blink(){clearTimeout(blinkTimer);blinkTimer=setTimeout(()=>{if(!av.classList.contains('speaking')){face.classList.add('blink');setTimeout(()=>face.classList.remove('blink'),100)}blink()},3500+Math.random()*2200)}
function stopMouth(){cancelAnimationFrame(mouthRAF);clearTimeout(mouthEndTimer);av.classList.remove('speaking');mouthEl.style.height='7px';mouthEl.style.width='38px';mouthEl.style.left='47px';audioActiveUntil=0;$('as').textContent='暗星已說完'}
function mouthLoop(){cancelAnimationFrame(mouthRAF);const tick=()=>{if(performance.now()>audioActiveUntil){stopMouth();return}av.classList.add('speaking');const remaining=Math.max(0,audioActiveUntil-performance.now());const phase=(performance.now()%130)/130;const h=5+(Math.sin(phase*Math.PI*2)*.5+.5)*Math.min(21,Math.max(7,remaining>120?20:10));const w=26+(Math.sin(phase*Math.PI*2+.8)*.5+.5)*16;mouthEl.style.height=h.toFixed(1)+'px';mouthEl.style.width=w.toFixed(1)+'px';mouthEl.style.left=(66-w/2).toFixed(1)+'px';mouthEl.style.borderRadius=h>15?'50%':'0 0 22px 22px';mouthRAF=requestAnimationFrame(tick)};tick()}
function playPCM(buf){if(!playCtx)return;const u=new Uint8Array(buf);if(!u.byteLength)return;const p=new Int16Array(u.buffer,u.byteOffset,Math.floor(u.byteLength/2));if(!p.length)return;const b=playCtx.createBuffer(1,p.length,24000),d=b.getChannelData(0);for(let i=0;i<p.length;i++)d[i]=p[i]/32768;const s=playCtx.createBufferSource();s.buffer=b;s.connect(playCtx.destination);const now=playCtx.currentTime;if(nextPlay<now+.025)nextPlay=now+.025;s.start(nextPlay);nextPlay+=b.duration;audioActiveUntil=Math.max(audioActiveUntil,performance.now()+Math.max(40,b.duration*1000)+40);mouthLoop();$('as').textContent='暗星正在說話'}function b64(x){const z=atob(x),u=new Uint8Array(z.length);for(let i=0;i<z.length;i++)u[i]=z.charCodeAt(i);playPCM(u.buffer)}
function handle(raw){if(raw instanceof ArrayBuffer){playPCM(raw);return}try{const d=JSON.parse(raw);if(d.audio?.data)b64(d.audio.data);const c=d.serverContent;if(c?.outputTranscription?.text){const t=c.outputTranscription.text;log('暗星：'+t);applyModelFaceCommand(t)}if(c?.turnComplete){audioActiveUntil=Math.max(audioActiveUntil,performance.now()+120);mouthEndTimer=setTimeout(stopMouth,180)}if(c?.interrupted){stopMouth()}if(c?.inputTranscription?.text)log('你：'+c.inputTranscription.text);if(d.type==='go_away')log('Session GoAway：'+d.timeLeft);if(d.type)log('系統：'+d.type)}catch(e){log('解析錯誤：'+e.message)}}
async function start(){try{if(ws)return;playCtx=new AudioContext();await playCtx.resume();inputCtx=new AudioContext({sampleRate:16000});await inputCtx.resume();let constraints={audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}};if(mode==='video')constraints.video={facingMode:facing,width:{ideal:1280},height:{ideal:720}};stream=await navigator.mediaDevices.getUserMedia(constraints);if(mode==='video'){$('cam').srcObject=stream}ws=new WebSocket(FN+'?voice='+encodeURIComponent($('voice').value));ws.binaryType='arraybuffer';ws.onopen=()=>{$('status').textContent='🟢 暗星已連線｜正在看、聽';blink();log('WebSocket 已連線｜暗星臉部控制已啟用')};ws.onmessage=e=>handle(e.data);ws.onclose=()=>{stopMouth();$('status').textContent='⚪ 已斷線'};src=inputCtx.createMediaStreamSource(stream);proc=inputCtx.createScriptProcessor(2048,1,1);const silent=inputCtx.createGain();silent.gain.value=0;proc.onaudioprocess=e=>{if(!ws||ws.readyState!==1)return;const a=e.inputBuffer.getChannelData(0),p=new Int16Array(a.length);for(let i=0;i<a.length;i++)p[i]=Math.max(-1,Math.min(1,a[i]))*32767;const u=new Uint8Array(p.buffer);let bin='';for(let i=0;i<u.length;i++)bin+=String.fromCharCode(u[i]);ws.send(JSON.stringify({type:'audio',data:btoa(bin),mimeType:'audio/pcm;rate=16000'}))};src.connect(proc);proc.connect(silent);silent.connect(inputCtx.destination);if(mode==='video')startVideo()}catch(e){$('status').textContent='🔴 啟動失敗';log(e.message||String(e))}}
function startVideo(){const c=document.createElement('canvas'),x=c.getContext('2d');window.vt=setInterval(()=>{if(!ws||ws.readyState!==1||!$('cam').videoWidth)return;c.width=640;c.height=Math.round(640*$('cam').videoHeight/$('cam').videoWidth);x.drawImage($('cam'),0,0,c.width,c.height);ws.send(JSON.stringify({type:'video',data:c.toDataURL('image/jpeg',.72).split(',')[1],mimeType:'image/jpeg'}))},800)}
async function stop(){if(window.vt)clearInterval(window.vt);stopMouth();clearTimeout(blinkTimer);if(proc)proc.disconnect();if(src)src.disconnect();if(inputCtx)await inputCtx.close().catch(()=>{});if(playCtx)await playCtx.close().catch(()=>{});if(ws){try{ws.send(JSON.stringify({type:'close'}))}catch{}ws.close()}if(stream)stream.getTracks().forEach(t=>t.stop());ws=stream=inputCtx=playCtx=src=proc=null;nextPlay=0;$('cam').srcObject=null;$('status').textContent='⚪ 已停止';$('as').textContent='暗星已停止'}
$('start').onclick=start;$('stop').onclick=stop;$('switch').onclick=async()=>{if(mode!=='video'||!stream)return;facing=facing==='user'?'environment':'user';const old=stream;const ns=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}}});old.getTracks().forEach(t=>t.stop());stream=ns;$('cam').srcObject=ns;log(facing==='user'?'鏡頭：自己':'鏡頭：環境／別人／書')};
</script></body></html>
