<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT 協作池｜真實學習監控</title><style>body{background:#071527;color:#e6f1ff;font:16px system-ui;margin:0;padding:22px;max-width:850px}h1{font-size:25px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{background:#122640;border:1px solid #30465f;border-radius:12px;padding:18px}.num{font-size:28px;font-weight:700}.muted{color:#a9bfd6}button{background:#2563eb;color:white;border:0;border-radius:8px;padding:12px;margin-top:15px}small{display:block;margin-top:8px}a{color:#8ecbff}</style></head><body><h1>AIVAULT 協作池｜真實學習監控</h1><p class="muted">只顯示資料庫證據，不把教材索引算作模型學習。</p><div id="state">正在讀取資料快照…</div><div class="grid" id="stats"></div><p id="stamp" class="muted"></p><button onclick="load()">重新整理</button><p class="muted">快照更新依賴 GitHub Actions 定時執行與 Supabase 讀取權限。沒有快照時顯示「尚未啟用」，不顯示假數據。</p><script>
async function load(){let state=document.getElementById('state'),stats=document.getElementById('stats');state.textContent='讀取中';try{let r=await fetch('./learning-status/latest.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('尚無已發布快照');let x=await r.json();let rows=[['學習任務',x.tasks],['不同 Worker ID',x.unique_agent_ids],['教材已索引',x.indexed],['真實執行中（有證據）',x.verified_running],['仍受阻',x.statuses?.blocked??'未知'],['已完成',x.statuses?.done??0]];stats.innerHTML='';for(let [k,v] of rows){let el=document.createElement('div');el.className='tile';let a=document.createElement('div');a.className='muted';a.textContent=k;let b=document.createElement('div');b.className='num';b.textContent=String(v);el.append(a,b);stats.append(el)}state.textContent='資料庫快照';document.getElementById('stamp').textContent='最後更新：'+x.captured_at}catch(e){state.textContent='尚未啟用：'+e.message;stats.innerHTML='';document.getElementById('stamp').textContent='需要先執行 learning-status-snapshot 工作流程。'}}load();
</script></body></html>
