<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AIVAULT FROST KINGDOM</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body class="game-body">
  <div class="snow-layer"></div>
  <div class="hero-stage">
    <svg class="castle" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
      <rect x="30" y="80" width="120" height="70" fill="#1c3a52"/>
      <rect x="20" y="70" width="28" height="80" fill="#163044"/>
      <rect x="132" y="70" width="28" height="80" fill="#163044"/>
      <rect x="72" y="40" width="36" height="110" fill="#214a66"/>
      <polygon points="18,70 34,48 50,70" fill="#8fd4ff"/>
      <polygon points="130,70 146,48 162,70" fill="#8fd4ff"/>
      <polygon points="68,40 90,16 112,40" fill="#c8ecff"/>
      <circle cx="90" cy="118" r="14" fill="#ff8a4a"/>
      <rect x="84" y="118" width="12" height="32" fill="#3a2010"/>
    </svg>
  </div>
  <div class="splash-actions">
    <h1 class="logo">AIVAULT</h1>
    <div class="sub">FROST KINGDOM</div>
    <button class="btn" id="btnStart" type="button">開始遊戲</button>
    <button class="btn secondary" id="btnLogin" type="button">登入帳號</button>
    <button class="btn gold" id="btnContinue" type="button" style="display:none">繼續遊戲</button>
    <p class="tiny" id="modeHint" style="text-align:center;margin-top:12px"></p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/boot.js"></script>
  <script>
    function goLogin() {
      try { if (window.FKAudio) FKAudio.start(); } catch (e) {}
      location.href = "game-login.html";
    }
    document.getElementById("btnStart").onclick = goLogin;
    document.getElementById("btnLogin").onclick = goLogin;
    try {
      document.getElementById("modeHint").textContent =
        (window.FKApi && FKApi.mode() === "local")
          ? "本機權威引擎"
          : (window.FKApi ? "已連接 AIVAULT Supabase" : "JS 未齊，先進入登入頁");
    } catch (e) {
      document.getElementById("modeHint").textContent = "JS 未齊";
    }
    (async () => {
      try {
        if (!window.FKApi) return;
        const s = await FKApi.session();
        if (!s) return;
        const btn = document.getElementById("btnContinue");
        btn.style.display = "block";
        btn.onclick = async () => {
          try { if (window.FKAudio) FKAudio.start(); } catch (e) {}
          const p = await FKApi.getPlayer();
          location.href = p ? "game-world.html" : "game-create-player.html";
        };
      } catch (e) {}
    })();
  </script>
</body>
</html>
