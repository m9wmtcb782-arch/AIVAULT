<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>AIVAULT — System Initialization</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02040a;
  color:#edf7ff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",sans-serif;
}

body{
  display:grid;
  place-items:center;
}

.scene{
  position:relative;
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 50%,
      rgba(33,105,255,.14),
      transparent 30%
    ),
    radial-gradient(
      circle at 50% 70%,
      rgba(0,235,255,.07),
      transparent 42%
    ),
    #02040a;
}

.grid{
  position:absolute;
  inset:-10%;

  background-image:
    linear-gradient(
      rgba(90,180,255,.045) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(90,180,255,.045) 1px,
      transparent 1px
    );

  background-size:44px 44px;

  transform:
    perspective(500px)
    rotateX(60deg)
    translateY(18%);

  transform-origin:center bottom;
  opacity:.55;
}

.stars{
  position:absolute;
  inset:0;

  background-image:
    radial-gradient(
      circle,
      rgba(160,225,255,.8) 0 1px,
      transparent 1.5px
    );

  background-size:93px 117px;
  opacity:.18;

  animation:stars 9s linear infinite;
}

/* =========================
   AIVAULT LOGO
========================= */

.logo{
  position:relative;
  text-align:center;
  z-index:3;

  opacity:0;
  transform:scale(.92);

  animation:logoIn 1.2s .15s forwards;
}

.brand{
  font-size:clamp(38px,10vw,72px);
  font-weight:800;
  letter-spacing:.22em;
  margin-left:.22em;

  text-shadow:
    0 0 12px rgba(106,224,255,.35),
    0 0 48px rgba(76,119,255,.28);
}

.tag{
  margin-top:10px;
  font-size:11px;
  letter-spacing:.24em;
  color:#8193ad;
}

/* =========================
   CORE
========================= */

.core{
  position:absolute;
  z-index:2;

  width:min(78vw,360px);
  height:min(78vw,360px);

  border-radius:50%;

  border:1px solid rgba(96,195,255,.28);

  box-shadow:
    0 0 90px rgba(43,117,255,.12),
    inset 0 0 60px rgba(0,215,255,.05);

  animation:rotate 12s linear infinite;

  opacity:0;
  animation:
    coreIn .8s .4s forwards,
    rotate 12s 1.2s linear infinite;
}

.core:before,
.core:after{
  content:"";
  position:absolute;
  border-radius:50%;
  inset:10%;
  border:1px dashed rgba(104,225,255,.24);
}

.core:after{
  inset:25%;
  border:1px solid rgba(128,155,255,.22);
}

/* =========================
   SCAN
========================= */

.scan{
  position:absolute;

  left:50%;
  top:50%;

  width:min(90vw,600px);
  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(117,241,255,.8),
      transparent
    );

  box-shadow:
    0 0 18px rgba(94,231,255,.75);

  transform:
    translate(-50%,-50%)
    scaleX(0);

  opacity:0;

  z-index:4;
}

/* =========================
   PARTICLES
========================= */

.particle{
  position:absolute;

  width:4px;
  height:4px;

  border-radius:50%;

  background:#9ff6ff;

  box-shadow:
    0 0 14px #71eaff;

  opacity:0;
}

.p1{
  left:18%;
  top:38%;
  animation:p 2.8s 1.4s forwards;
}

.p2{
  left:76%;
  top:30%;
  animation:p 3s 1.8s forwards;
}

.p3{
  left:23%;
  top:72%;
  animation:p 2.6s 2.1s forwards;
}

.p4{
  left:81%;
  top:67%;
  animation:p 3.2s 1.6s forwards;
}

/* =========================
   STATUS
========================= */

.status{
  position:absolute;

  z-index:5;

  bottom:19%;

  width:100%;

  text-align:center;

  font-size:12px;

  letter-spacing:.18em;

  color:#8fa2bd;

  min-height:18px;

  padding:0 20px;
}

/* =========================
   PROGRESS
========================= */

.progress{
  position:absolute;

  z-index:5;

  bottom:14.5%;

  left:50%;

  transform:translateX(-50%);

  width:min(72vw,420px);

  height:2px;

  background:rgba(255,255,255,.08);

  overflow:hidden;
}

.bar{
  height:100%;

  width:0;

  background:
    linear-gradient(
      90deg,
      #65eaff,
      #839bff
    );

  box-shadow:
    0 0 12px #65eaff;

  animation:
    load 6.1s linear forwards;
}

/* =========================
   SOUND BUTTON
========================= */

.sound{
  position:absolute;

  right:18px;
  top:18px;

  z-index:10;

  border:
    1px solid rgba(160,190,220,.2);

  border-radius:999px;

  background:
    rgba(7,12,22,.6);

  color:#a9bbd3;

  padding:9px 13px;

  font-size:11px;

  backdrop-filter:blur(10px);

  cursor:pointer;
}

.sound.on{
  color:#8ef1ff;

  border-color:
    rgba(104,234,255,.45);

  box-shadow:
    0 0 15px rgba(104,234,255,.08);
}

/* =========================
   READY
========================= */

.ready{
  position:absolute;

  z-index:6;

  bottom:10%;

  color:#8ef1ff;

  font-size:13px;

  letter-spacing:.28em;

  opacity:0;

  text-shadow:
    0 0 14px rgba(101,235,255,.6);
}

.tap{
  position:absolute;

  z-index:8;

  bottom:7%;

  font-size:11px;

  color:#6e7e97;

  letter-spacing:.1em;

  opacity:0;

  transition:opacity .3s;
}

.tap.show{
  opacity:1;
}

/* =========================
   FLASH / FADE
========================= */

.flash{
  position:absolute;
  inset:0;

  background:#dffaff;

  opacity:0;

  z-index:20;

  pointer-events:none;
}

.fade{
  position:absolute;
  inset:0;

  background:#02040a;

  opacity:0;

  z-index:30;

  pointer-events:none;

  transition:
    opacity .85s ease;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes logoIn{
  to{
    opacity:1;
    transform:scale(1);
  }
}

@keyframes coreIn{
  to{
    opacity:1;
  }
}

@keyframes rotate{
  to{
    transform:rotate(360deg);
  }
}

@keyframes stars{
  to{
    transform:translateY(44px);
  }
}

@keyframes load{
  to{
    width:100%;
  }
}

@keyframes p{
  0%{
    opacity:0;
    transform:scale(.4);
  }

  25%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:
      translate(20vw,-12vh)
      scale(1.8);
  }
}

@keyframes scan{
  0%{
    transform:
      translate(-50%,-50%)
      scaleX(0);

    opacity:0;
  }

  35%{
    transform:
      translate(-50%,-50%)
      scaleX(1);

    opacity:1;
  }

  100%{
    transform:
      translate(-50%,-50%)
      scaleX(1);

    opacity:0;
  }
}

@keyframes flash{
  0%{
    opacity:0;
  }

  35%{
    opacity:.18;
  }

  100%{
    opacity:0;
  }
}

@media(prefers-reduced-motion:reduce){

  *{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
  }

}
</style>
</head>

<body>

<main class="scene" id="scene">

  <div class="grid"></div>

  <div class="stars"></div>

  <!-- 音效 -->
  <button
    class="sound"
    id="sound"
    type="button"
  >
    🔇 SOUND OFF
  </button>

  <!-- 核心動畫 -->
  <div class="core"></div>

  <!-- 粒子 -->
  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>

  <!-- Logo -->
  <div class="logo">
    <div class="brand">AIVAULT</div>
    <div class="tag">
      AI AGENT OPERATING SYSTEM
    </div>
  </div>

  <!-- 掃描線 -->
  <div
    class="scan"
    id="scan"
  ></div>

  <!-- 狀態 -->
  <div
    class="status"
    id="status"
  >
    INITIALIZING AIVAULT SYSTEM
  </div>

  <!-- 進度 -->
  <div class="progress">
    <div class="bar"></div>
  </div>

  <!-- Ready -->
  <div
    class="ready"
    id="ready"
  >
    SYSTEM READY
  </div>

  <div
    class="tap"
    id="tap"
  >
    點擊畫面啟動聲音
  </div>

  <!-- 特效 -->
  <div
    class="flash"
    id="flash"
  ></div>

  <div
    class="fade"
    id="fade"
  ></div>

</main>

<script>

/* =========================================================
   AIVAULT LAUNCH SYSTEM
========================================================= */

let soundOn = false;
let started = false;
let redirectStarted = false;

let audioCtx = null;

const status =
  document.getElementById("status");

const sound =
  document.getElementById("sound");

const tap =
  document.getElementById("tap");

const ready =
  document.getElementById("ready");

const scan =
  document.getElementById("scan");

const flash =
  document.getElementById("flash");

const fade =
  document.getElementById("fade");


/* =========================================================
   建立 AudioContext
========================================================= */

function getAudioContext(){

  try{

    if(!audioCtx){

      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    return audioCtx;

  }catch(e){

    return null;

  }

}


/* =========================================================
   單音
========================================================= */

function playTone(
  frequency,
  duration,
  delay = 0,
  gainValue = 0.035
){

  if(!soundOn) return;

  const ctx =
    getAudioContext();

  if(!ctx) return;

  try{

    if(ctx.state === "suspended"){
      ctx.resume();
    }

    const oscillator =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    oscillator.type = "sine";

    oscillator.frequency.setValueAtTime(
      frequency,
      ctx.currentTime + delay
    );

    gain.gain.setValueAtTime(
      0.0001,
      ctx.currentTime + delay
    );

    gain.gain.exponentialRampToValueAtTime(
      gainValue,
      ctx.currentTime + delay + 0.025
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      ctx.currentTime + delay + duration
    );

    oscillator
      .connect(gain)
      .connect(ctx.destination);

    oscillator.start(
      ctx.currentTime + delay
    );

    oscillator.stop(
      ctx.currentTime +
      delay +
      duration +
      0.04
    );

  }catch(e){}

}
