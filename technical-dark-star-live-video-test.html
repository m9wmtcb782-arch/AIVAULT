<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Technical Dark Star｜視訊</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#fff;color:#202123}body{overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column}
.top{height:58px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #eee;gap:10px}
.logo{width:30px;height:30px;border-radius:9px;background:#171717;color:#fff;display:flex;align-items:center;justify-content:center}
.title{font-weight:600}.engine{font-size:12px;color:#888}
.back{margin-left:auto;border:1px solid #ddd;background:#fff;border-radius:9px;padding:7px 10px;text-decoration:none;color:inherit}
.main{flex:1;min-height:0;overflow:auto;padding:18px 18px 110px}
.card{max-width:760px;margin:0 auto;border:1px solid #e5e5e5;border-radius:16px;padding:16px}
.status{padding:10px 12px;background:#f6f6f6;border-radius:10px;font-size:13px;margin-bottom:12px}
.video-wrap{position:relative;background:#111;border-radius:14px;overflow:hidden;aspect-ratio:4/3}
.video{width:100%;height:100%;object-fit:cover;display:block}.mirror{transform:scaleX(-1)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{border:1px solid #ddd;background:#fff;border-radius:10px;padding:12px;font-weight:600}
.btn.primary{background:#171717;color:#fff;border-color:#171717}.btn:disabled{opacity:.45}
.chat{margin-top:12px;min-height:80px;max-height:220px;overflow:auto;border:1px solid #eee;border-radius:10px;padding:10px;background:#fafafa}
.bubble{margin:0 0 8px;padding:8px 10px;border-radius:12px;font-size:14px;line-height:1.55;white-space:pre-wrap}
.bubble.user{background:#eef5ff}.bubble.ai{background:#f2f2f2}
.log{margin-top:12px;min-height:80px;max-height:160px;overflow:auto;background:#fafafa;border:1px solid #eee;border-radius:10px;padding:10px;font-size:12px;white-space:pre-wrap}
.composer{position:fixed;left:0;right:0;bottom:0;padding:10px 16px max(14px,env(safe-area-inset-bottom));background:#fff}
.composer-box{max-width:760px;margin:0 auto;display:flex;gap:8px;border:1px solid #d9d9d9;border-radius:22px;background:#fff;padding:6px}
.composer-box textarea{flex:1;border:0;outline:0;resize:none;min-height:40px;padding:9px 10px;font:inherit;font-size:16px}
.composer-box button{width:44px;height:44px;border:0;border-radius:50%;background:#171717;color:#fff}
</style>
</head>
<body class="mode-video">
<div class="app">
<header class="top"><div class="logo">✦</div><div><div class="title">Technical Dark Star</div><div class="engine">視訊｜live-voice</div></div><a class="back" href="technical-dark-star.html">← 回暗星</a></header>
<main class="main"><section class="card">
<div id="status" class="status">按開始。鏡頭只預覽；語音走 live-voice。</div>
<div class="video-wrap"><video id="preview" class="video mirror" autoplay playsinline muted></video></div>
<div class="controls"><button id="autoBtn" class="btn primary" onclick="toggleAuto()">⚡ 自動連接</button><button id="cameraBtn" class="btn" onclick="switchCamera()" disabled>🔄 切鏡頭</button><button id="startBtn" class="btn" onclick="start()">▶ 開始</button><button id="stopBtn" class="btn" onclick="stop()" disabled>■ 停止</button></div>
<div class="voice-row" style="margin-top:10px"><select id="voiceSelect"></select> <span id="voiceStat"></span> 音訊:<b id="audioStat">0</b></div>
<div id="chat" class="chat"></div>
<pre id="log" class="log"></pre>
</section></main>
<div class="composer"><div class="composer-box"><textarea id="liveInput" rows="1" placeholder="打字"></textarea><button type="button" id="liveSend" onclick="sendTyped()">➤</button></div></div>
</div>
<script src="technical-dark-star-live-session.js?v=6"></script>
</body>
</html>
