<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Technical Dark Star｜即時互動測試</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#fff;color:#202123}
body{overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column}
.top{height:58px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #eee;gap:10px}
.logo{width:30px;height:30px;border-radius:9px;background:#171717;color:#fff;display:flex;align-items:center;justify-content:center}.title{font-weight:600}.engine{font-size:12px;color:#888}
.back{margin-left:auto;border:1px solid #ddd;background:#fff;border-radius:9px;padding:7px 10px}.main{flex:1;min-height:0;overflow:auto;padding:18px}
.card{max-width:760px;margin:0 auto;border:1px solid #e5e5e5;border-radius:16px;padding:16px}.modes{display:flex;gap:8px;margin-bottom:12px}
.mode{flex:1;border:1px solid #ddd;background:#fff;border-radius:11px;padding:11px;font-weight:600}.mode.active{background:#171717;color:#fff;border-color:#171717}
.voice-row{display:grid;grid-template-columns:100px 1fr;gap:8px;align-items:center;margin-bottom:12px}.voice-label{font-weight:600}
.voice-select{width:100%;border:1px solid #ddd;border-radius:10px;background:#fff;padding:11px;font-size:15px}.status{padding:10px 12px;background:#f6f6f6;border-radius:10px;font-size:13px;margin-bottom:12px}
.video-wrap{position:relative;background:#111;border-radius:14px;overflow:hidden;aspect-ratio:4/3}.video{width:100%;height:100%;object-fit:cover;display:block}.mirror{transform:scaleX(-1)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{border:1px solid #ddd;background:#fff;border-radius:10px;padding:12px;font-weight:600}.btn.primary{background:#171717;color:#fff;border-color:#171717}.btn:disabled{opacity:.45}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.stat{font-size:12px;background:#f7f7f7;border-radius:8px;padding:6px 8px;color:#555}
.log{margin-top:12px;min-height:120px;max-height:230px;overflow:auto;background:#fafafa;border:1px solid #eee;border-radius:10px;padding:10px;font-size:12px;line-height:1.6;white-space:pre-wrap}
.hint{font-size:12px;color:#777;line-height:1.6;margin-top:10px}.voiceOnly{display:none}.videoOnly{display:block}.mode-voice .voiceOnly{display:block}.mode-voice .videoOnly{display:none}.mode-video .voiceOnly{display:none}.mode-video .videoOnly{display:block}
.music-bar{margin-top:10px;padding:10px 12px;border:1px solid #e8e8e8;border-radius:10px;background:#fbfbfb;font-size:12px;display:flex;align-items:center;gap:8px}
.music-dot{width:9px;height:9px;border-radius:50%;background:#bbb;flex:none}.music-dot.on{background:#222;box-shadow:0 0 0 4px #eee}.music-text{flex:1}.music-stop{border:1px solid #ddd;background:#fff;border-radius:8px;padding:6px 9px;font-size:12px}
</style>
</head>
<body class="mode-voice">
<div class="app">
<header class="top"><div class="logo">✦</div><div><div class="title">Technical Dark Star</div><div class="engine">同一個即時對話核心｜語音／視訊</div></div><button class="back" onclick="history.back()">← 回上一頁</button></header>
<main class="main"><section class="card">
<div class="modes"><button id="voiceBtn" class="mode active" onclick="setMode('voice')">🎤 即時語音</button><button id="videoBtn" class="mode" onclick="setMode('video')">🎥 即時視訊</button></div>
<div class="voice-row"><div class="voice-label">🔊 暗星聲音</div><select id="voiceSelect" class="voice-select"></select></div>
<div id="status" class="status">尚未連線</div>
<div class="video-wrap videoOnly"><video id="preview" class="video mirror" autoplay playsinline muted></video></div>
<div class="controls"><button id="autoBtn" class="btn primary" onclick="toggleAuto()">⚡ 自動連接</button><button id="cameraBtn" class="btn videoOnly" onclick="switchCamera()" disabled>🔄 切換鏡頭：自己／別人</button><button id="startBtn" class="btn" onclick="start(false)">▶ 開始</button><button id="stopBtn" class="btn" onclick="stop(false)" disabled>■ 停止</button></div>
<div class="stats"><span class="stat">模式：<b id="modeStat">語音</b></span><span class="stat">聲音：<b id="voiceStat">Kore</b></span><span class="stat">收到音訊：<b id="audioStat">0</b></span><span class="stat">音訊位元組：<b id="byteStat">0</b></span></div>
<div class="music-bar"><span id="musicDot" class="music-dot"></span><span id="musicText" class="music-text">🎵 音樂：未播放｜暗星可使用目前手機喇叭播放內建放鬆音樂</span><button class="music-stop" onclick="stopMusic()">停止音樂</button></div>
<div class="hint voiceOnly">🎤 語音模式只開啟麥克風，不會要求攝影機，也不會開啟影像串流。</div>
<div class="hint videoOnly">🎥 視訊模式才開啟攝影機；同時使用麥克風，讓暗星看、聽、說。</div>
<pre id="log" class="log"></pre>
</section></main></div>
<script>
const FN='wss://clcddygkaaqqtsbswgdf.supabase.co/functions/v1/technical-dark-star-vision-test';
const VOICES=[['Zephyr','明亮'],['Puck','活潑'],['Charon','資訊型'],['Kore','穩重'],['Fenrir','興奮'],['Leda','年輕'],['Orus','穩重'],['Aoede','輕快'],['Callirrhoe','輕鬆'],['Autonoe','明亮'],['Enceladus','氣聲'],['Iapetus','清晰'],['Umbriel','輕鬆'],['Algieba','順滑'],['Despina','順滑'],['Erinome','清晰'],['Algenib','沙啞'],['Rasalgethi','資訊型'],['Laomedeia','活潑'],['Achernar','柔和'],['Alnilam','穩重'],['Schedar','平穩'],['Gacrux','成熟'],['Pulcherrima','前衛'],['Achird','友善'],['Zubenelgenubi','隨性'],['Vindemiatrix','溫柔'],['Sadachbia','活潑'],['Sadaltager','知識型'],['Sulafat','溫暖']];
let ws=null,stream=null,auto=false,autoCycleTimer=null,autoStarting=false,cycleRunning=false,facing='user',mode='voice',videoTimer=null,inputCtx=null,processor=null,source=null,silent=null,playCtx=null,nextPlayTime=0,audioPackets=0,audioBytes=0,resumeHandle=null;
let musicCtx=null,musicMaster=null,musicNodes=[],musicTimer=null,musicPlaying=false;
const $=id=>document.getElementById(id);
function log(s){$('log').textContent+='['+new Date().toLocaleTimeString('zh-TW')+'] '+s+'\n';$('log').scrollTop=$('log').scrollHeight}
function status(s){$('status').textContent=s}
function initVoices(){const sel=$('voiceSelect');sel.innerHTML='';VOICES.forEach(([id,label])=>{const o=document.createElement('option');o.value=id;o.textContent=id+' — '+label;sel.appendChild(o)});sel.value=localStorage.getItem('darkStarVoice')||'Kore';updateVoice();sel.onchange=()=>{localStorage.setItem('darkStarVoice',sel.value);updateVoice();log('🔊 已選擇暗星聲音：'+sel.value)}}
function updateVoice(){$('voiceStat').textContent=$('voiceSelect').value}
function setMode(m){if(m===mode)return;if(ws||stream){log('⚠️ 已連線時不能直接切換模式，請先停止再切換');return}mode=m;document.body.className='mode-'+m;$('voiceBtn').classList.toggle('active',m==='voice');$('videoBtn').classList.toggle('active',m==='video');$('modeStat').textContent=m==='voice'?'語音':'視訊';log(m==='voice'?'🎤 語音模式：只開麥克風，暗星聽你說話並用聲音回答':'🎥 視訊模式：開啟攝影機＋麥克風，暗星同時看、聽、說')}
async function openMedia(){if(stream)return;const constraints={audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}};if(mode==='video')constraints.video={facingMode:facing,width:{ideal:1280},height:{ideal:720}};stream=await navigator.mediaDevices.getUserMedia(constraints);if(mode==='video'&&stream.getVideoTracks().length){$('preview').srcObject=stream;$('cameraBtn').disabled=false}else $('cameraBtn').disabled=true;log(mode==='video'?'✓ 攝影機＋麥克風權限已取得':'✓ 只有麥克風權限已取得｜沒有開啟攝影機')}
async function openAudio(){if(!playCtx){playCtx=new AudioContext();log('🔊 建立暗星語音播放引擎')}if(playCtx.state!=='running')await playCtx.resume();if(!inputCtx)inputCtx=new AudioContext({sampleRate:16000});if(inputCtx.state!=='running')await inputCtx.resume();log('✓ 語音播放引擎已啟動｜輸出 24kHz PCM')}
function connect(resume=false){return new Promise((resolve,reject)=>{if(ws&&ws.readyState===1)return resolve();const voice=encodeURIComponent($('voiceSelect').value);let url=FN+'?voice='+voice;if(resume&&resumeHandle)url+='&resumeHandle='+encodeURIComponent(resumeHandle);const s=new WebSocket(url);s.binaryType='arraybuffer';ws=s;s.onopen=()=>{status(resume?'🟢 正在接續暗星對話…':'🟢 已連線｜等待暗星語音');log(resume?'✓ WebSocket 已重新開始｜要求 Session Resumption':'✓ WebSocket 已連線｜聲音：'+$('voiceSelect').value);resolve()};s.onerror=()=>{if(s===ws)log('WebSocket 錯誤');reject(new Error('WebSocket error'))};s.onclose=()=>{if(s!==ws)return;if(auto&&!cycleRunning){status('🟡 自動連接中…');autoRetryStart()}else if(!auto)status('⚪ 已斷線')};s.onmessage=e=>handleMessage(e.data)})}
function handleMessage(raw){if(raw instanceof ArrayBuffer){playPCM(raw);return}try{const d=JSON.parse(raw);if(d.audio?.data)playBase64PCM(d.audio.data);if(d.handle)resumeHandle=d.handle;if(d.type==='live_open')log('✓ Live Session 已建立');else if(d.type==='session_handle'){if(d.handle)resumeHandle=d.handle;log('✓ 已取得可續接 Handle');}else if(d.type==='handoff_start'){log('→ 後端通知：建立下一個 Session')}else if(d.type==='handoff_complete'){log('✓ 後端 Session 銜接完成')}else if(d.type==='session_resumed'){status('🟢 Session 已續接');log('✓ Session Resumption 成功｜沒有重新開場白')}else if(d.serverContent?.inputTranscription?.text)log('你：'+d.serverContent.inputTranscription.text);else if(d.serverContent?.outputTranscription?.text){const t=d.serverContent.outputTranscription.text;log('暗星：'+t);detectMusicCommand(t)}else if(d.type==='go_away')log('⚠️ GoAway：'+d.timeLeft);else if(d.type==='handoff_failed')log('❌ 後端銜接失敗：'+d.message);else if(d.type==='error'||d.error)log('❌ 錯誤：'+(d.message||d.error?.message||JSON.stringify(d.error)))}catch(e){log('訊息解析錯誤：'+e.message)}}
function playBase64PCM(b64){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);playPCM(u.buffer)}
function playPCM(buf){if(!playCtx)return;const bytes=new Uint8Array(buf),pcm=new Int16Array(bytes.buffer,bytes.byteOffset,Math.floor(bytes.byteLength/2));if(!pcm.length)return;audioPackets++;audioBytes+=bytes.byteLength;$('audioStat').textContent=audioPackets;$('byteStat').textContent=audioBytes.toLocaleString();if(playCtx.state!=='running')playCtx.resume().catch(()=>{});const audio=playCtx.createBuffer(1,pcm.length,24000),data=audio.getChannelData(0);for(let i=0;i<pcm.length;i++)data[i]=pcm[i]/32768;const src=playCtx.createBufferSource();src.buffer=audio;src.connect(playCtx.destination);const now=playCtx.currentTime;if(nextPlayTime<now+.03)nextPlayTime=now+.03;src.start(nextPlayTime);nextPlayTime+=audio.duration}
function musicCommandIsNegative(t){return /(不能|無法|沒辦法|沒有辦法|不具備|目前沒有).{0,12}(播放|放)(音樂|歌曲)?/.test(t)}
function detectMusicCommand(t){if(!t||musicCommandIsNegative(t))return;const q=t.replace(/[，。！？,.!?]/g,'');if(/(現在|幫你|為你|替你|開始|正在|已經|已替你|已幫你).{0,18}(播放|放)(一首|音樂|歌曲|音樂給你)?/.test(q)||/(播放|放)(一首|音樂|歌曲)/.test(q)){startMusic('暗星語音指令');}}
async function startMusic(reason='手動測試'){try{if(!musicCtx)musicCtx=new AudioContext();if(musicCtx.state!=='running')await musicCtx.resume();stopMusic(false);musicMaster=musicCtx.createGain();musicMaster.gain.value=.16;musicMaster.connect(musicCtx.destination);const notes=[261.63,329.63,392.00,523.25,392.00,329.63,293.66,349.23,440.00,523.25,440.00,349.23];let i=0;const playNote=()=>{if(!musicPlaying)return;const now=musicCtx.currentTime;const f=notes[i++%notes.length];const o=musicCtx.createOscillator(),g=musicCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,now);g.gain.exponentialRampToValueAtTime(.16,now+.05);g.gain.exponentialRampToValueAtTime(.0001,now+1.8);o.connect(g);g.connect(musicMaster);o.start(now);o.stop(now+1.85);musicNodes.push(o);musicNodes=musicNodes.filter(n=>n!==o);};musicPlaying=true;$('musicDot').classList.add('on');$('musicText').textContent='🎵 音樂：正在播放｜使用目前手機喇叭';log('🎵 暗星已啟動手機喇叭音樂｜原因：'+reason);playNote();musicTimer=setInterval(playNote,900)}catch(e){musicPlaying=false;$('musicDot').classList.remove('on');$('musicText').textContent='🎵 音樂：播放失敗';log('❌ 音樂播放失敗：'+(e.message||e))}}
function stopMusic(update=true){musicPlaying=false;if(musicTimer){clearInterval(musicTimer);musicTimer=null}musicNodes.forEach(n=>{try{n.stop()}catch(_){}});musicNodes=[];if(musicMaster){try{musicMaster.disconnect()}catch(_){}}musicMaster=null;if(update){$('musicDot').classList.remove('on');$('musicText').textContent='🎵 音樂：已停止';log('⏹️ 已停止音樂')}}
async function start(resume=false){if(autoStarting)return;autoStarting=true;try{audioPackets=0;audioBytes=0;$('audioStat').textContent='0';$('byteStat').textContent='0';await openAudio();await openMedia();await connect(resume);if(mode==='video')startVideo();startAudio();$('startBtn').disabled=true;$('stopBtn').disabled=false;status('🟢 暗星正在聽／說'+(mode==='video'?'／看':'')+'｜聲音：'+$('voiceSelect').value);if(resume)log('✓ 2:31 自動開始完成｜沿用上一個 Session Handle');scheduleAutoCycle()}catch(e){status('🔴 無法啟動');log('啟動失敗：'+(e.message||e));if(auto)autoRetryStart()}finally{autoStarting=false}}
function scheduleAutoCycle(){clearTimeout(autoCycleTimer);if(!auto)return;autoCycleTimer=setTimeout(()=>automaticStopStart(),150000)}
async function automaticStopStart(){if(!auto||cycleRunning||!ws)return;cycleRunning=true;log('⏱️ 到達 2:30｜自動按「停止」');status('🟡 2:30 自動停止…');await stop(true);setTimeout(async()=>{if(!auto){cycleRunning=false;return}log('⏱️ 到達 2:31｜自動按「開始」');status('🟡 2:31 自動開始…');await start(true);cycleRunning=false},1000)}
function autoRetryStart(){if(!auto||cycleRunning)return;clearTimeout(autoCycleTimer);autoCycleTimer=setTimeout(()=>start(!!resumeHandle),1000)}
function startVideo(){clearInterval(videoTimer);const c=document.createElement('canvas'),x=c.getContext('2d');videoTimer=setInterval(()=>{if(!ws||ws.readyState!==1||!$('preview').videoWidth)return;c.width=640;c.height=Math.round(640*$('preview').videoHeight/$('preview').videoWidth);x.drawImage($('preview'),0,0,c.width,c.height);ws.send(JSON.stringify({type:'video',data:c.toDataURL('image/jpeg',.72).split(',')[1],mimeType:'image/jpeg'}))},1000)}
function startAudio(){if(!stream||!inputCtx)return;if(processor)processor.disconnect();if(source)source.disconnect();source=inputCtx.createMediaStreamSource(stream);processor=inputCtx.createScriptProcessor(2048,1,1);silent=inputCtx.createGain();silent.gain.value=0;processor.onaudioprocess=e=>{if(!ws||ws.readyState!==1)return;const a=e.inputBuffer.getChannelData(0),pcm=new Int16Array(a.length);for(let i=0;i<a.length;i++)pcm[i]=Math.max(-1,Math.min(1,a[i]))*32767;let bin='';const u=new Uint8Array(pcm.buffer);for(let i=0;i<u.length;i++)bin+=String.fromCharCode(u[i]);ws.send(JSON.stringify({type:'audio',data:btoa(bin),mimeType:'audio/pcm;rate=16000'}))};source.connect(processor);processor.connect(silent);silent.connect(inputCtx.destination)}
async function stop(fromAuto=false){clearTimeout(autoCycleTimer);clearInterval(videoTimer);videoTimer=null;stopMusic(false);if(processor){processor.disconnect();processor=null}if(source){source.disconnect();source=null}if(silent){silent.disconnect();silent=null}if(inputCtx){await inputCtx.close().catch(()=>{});inputCtx=null}if(playCtx){await playCtx.close().catch(()=>{});playCtx=null}nextPlayTime=0;if(ws){try{ws.send(JSON.stringify({type:'close'}))}catch(_){}try{ws.close()}catch(_){}ws=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('preview').srcObject=null;$('startBtn').disabled=false;$('stopBtn').disabled=true;$('cameraBtn').disabled=true;if(!fromAuto){auto=false;cycleRunning=false;clearTimeout(autoCycleTimer);status('⚪ 已停止');log('已手動停止')}$('musicDot').classList.remove('on');$('musicText').textContent='🎵 音樂：未播放｜暗星可使用目前手機喇叭播放內建放鬆音樂'}
async function toggleAuto(){if(auto){auto=false;cycleRunning=false;clearTimeout(autoCycleTimer);await stop(false);$('autoBtn').textContent='⚡ 自動連接';return}auto=true;$('autoBtn').textContent='⏸ 停止自動連接';log('⚡ 啟動自動循環：2:30 停止 → 2:31 開始 → Session Resumption');await start(!!resumeHandle)}
async function switchCamera(){if(mode!=='video'||!stream||!stream.getVideoTracks().length)return;facing=facing==='user'?'environment':'user';const old=stream.getVideoTracks()[0];old.stop();const next=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}}});const track=next.getVideoTracks()[0];stream.removeTrack(old);stream.addTrack(track);$('preview').srcObject=stream;$('preview').classList.toggle('mirror',facing==='user');log(facing==='user'?'📷 已切換前鏡頭：自己':'📷 已切換後鏡頭：別人／書本')}
window.addEventListener('beforeunload',()=>{try{clearTimeout(autoCycleTimer);clearInterval(videoTimer);stopMusic(false);if(ws)ws.close();if(stream)stream.getTracks().forEach(t=>t.stop())}catch(_){} });
initVoices();
log('✓ 測試頁已載入');log('⏱️ 自動接續規則：2:30 按停止，2:31 按開始');log('🎵 音樂工具已載入｜暗星要求播放音樂時，使用目前手機喇叭播放內建放鬆音樂');
</script>
</body>
</html>
