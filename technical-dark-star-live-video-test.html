<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<title>Technical Dark Star｜即時互動測試</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#fff;color:#202123}
body{overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column}
.top{height:58px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #eee;gap:10px}
.logo{width:30px;height:30px;border-radius:9px;background:#171717;color:#fff;display:flex;align-items:center;justify-content:center}.title{font-weight:600}.engine{font-size:12px;color:#888}
.back{margin-left:auto;border:1px solid #ddd;background:#fff;border-radius:9px;padding:7px 10px}.main{flex:1;min-height:0;overflow:auto;padding:18px}
.card{max-width:760px;margin:0 auto;border:1px solid #e5e5e5;border-radius:16px;padding:16px}.modes{display:flex;gap:8px;margin-bottom:12px}
.mode{flex:1;border:1px solid #ddd;background:#fff;border-radius:11px;padding:11px;font-weight:600}.mode.active{background:#171717;color:#fff;border-color:#171717}
.voice-row{display:grid;grid-template-columns:100px 1fr;gap:8px;align-items:center;margin-bottom:12px}.voice-label{font-weight:600}
.voice-select{width:100%;border:1px solid #ddd;border-radius:10px;background:#fff;padding:11px;font-size:15px}.status{padding:10px 12px;background:#f6f6f6;border-radius:10px;font-size:13px;margin-bottom:12px}
.digital-human{margin-bottom:12px;border:1px solid #e7e7e7;border-radius:16px;padding:12px;background:linear-gradient(180deg,#fff,#fafafa)}
.digital-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.digital-title{font-weight:700}.digital-link{font-size:11px;color:#777;display:flex;align-items:center;gap:5px}.digital-link-dot{width:7px;height:7px;border-radius:50%;background:#bbb}.digital-link-dot.on{background:#4caf50;box-shadow:0 0 0 4px #eaf7ec}
.avatar-stage{position:relative;height:230px;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 36%,#fff 0,#f5f2ff 45%,#ece8ff 100%);display:flex;align-items:center;justify-content:center}
.avatar-glow{position:absolute;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(140,110,255,.18),rgba(140,110,255,0) 70%);animation:avatarGlow 3s ease-in-out infinite}
@keyframes avatarGlow{0%,100%{transform:scale(.96);opacity:.65}50%{transform:scale(1.05);opacity:1}}
.face{position:relative;width:170px;height:190px;border-radius:48% 48% 45% 45%;background:linear-gradient(145deg,#fff,#f0edff);border:2px solid #ded8ff;box-shadow:0 12px 30px rgba(80,60,130,.13);transform:translateY(5px)}
.hair{position:absolute;left:-4px;top:-13px;width:178px;height:82px;border-radius:55% 55% 40% 45%;background:#29263b;transform:rotate(-2deg);box-shadow:0 5px 12px rgba(0,0,0,.1)}
.hair:after{content:"";position:absolute;right:8px;top:38px;width:45px;height:52px;border-radius:0 0 50% 50%;background:#29263b;transform:rotate(14deg)}
.star{position:absolute;right:20px;top:20px;font-size:21px;filter:drop-shadow(0 2px 4px rgba(120,90,220,.25));z-index:5}
.brow{position:absolute;top:72px;width:42px;height:9px;border-top:5px solid #403a55;border-radius:50%;transition:transform .16s ease}
.brow.left{left:28px;transform:rotate(7deg)}.brow.right{right:28px;transform:rotate(-7deg)}
.eye{position:absolute;top:82px;width:39px;height:29px;border-radius:50%;background:#fff;border:2px solid #d9d3e9;overflow:hidden;transition:height .12s ease,transform .12s ease}
.eye.left{left:27px}.eye.right{right:27px}.pupil{position:absolute;left:50%;top:50%;width:15px;height:15px;border-radius:50%;background:#28243a;transform:translate(-50%,-50%);transition:transform .15s ease}.pupil:after{content:"";position:absolute;left:3px;top:2px;width:4px;height:4px;border-radius:50%;background:#fff}
.nose{position:absolute;left:78px;top:111px;width:14px;height:22px;border-left:2px solid #ddd5ec;border-bottom:2px solid #ddd5ec;border-radius:0 0 0 12px;transform:rotate(-8deg)}
.mouth{position:absolute;left:50%;top:143px;width:42px;height:13px;border:3px solid #5d3e5d;border-top:0;border-radius:0 0 24px 24px;background:#f39db6;transform:translateX(-50%) scaleY(.45);transform-origin:center top;transition:transform .055s linear,border-radius .12s ease}
.mouth:after{content:"";position:absolute;left:7px;right:7px;bottom:2px;height:3px;border-radius:50%;background:#fff;opacity:.75}
.cheek{position:absolute;top:128px;width:25px;height:11px;border-radius:50%;background:rgba(255,155,180,.22);filter:blur(2px)}.cheek.left{left:15px}.cheek.right{right:15px}
.avatar-state{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.82);font-size:11px;color:#6b6577;backdrop-filter:blur(5px);white-space:nowrap}
.video-wrap{position:relative;background:#111;border-radius:14px;overflow:hidden;aspect-ratio:4/3}.video{width:100%;height:100%;object-fit:cover;display:block}.mirror{transform:scaleX(-1)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{border:1px solid #ddd;background:#fff;border-radius:10px;padding:12px;font-weight:600}.btn.primary{background:#171717;color:#fff;border-color:#171717}.btn:disabled{opacity:.45}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.stat{font-size:12px;background:#f7f7f7;border-radius:8px;padding:6px 8px;color:#555}
.log{margin-top:12px;min-height:120px;max-height:230px;overflow:auto;background:#fafafa;border:1px solid #eee;border-radius:10px;padding:10px;font-size:12px;line-height:1.6;white-space:pre-wrap}
.hint{font-size:12px;color:#777;line-height:1.6;margin-top:10px}.voiceOnly{display:none}.videoOnly{display:block}.mode-voice .voiceOnly{display:block}.mode-voice .videoOnly{display:none}.mode-video .voiceOnly{display:none}.mode-video .videoOnly{display:block}
.music-bar{margin-top:10px;padding:10px 12px;border:1px solid #e8e8e8;border-radius:10px;background:#fbfbfb;font-size:12px;display:flex;align-items:center;gap:8px}
.music-dot{width:9px;height:9px;border-radius:50%;background:#bbb;flex:none}.music-dot.on{background:#222;box-shadow:0 0 0 4px #eee}.music-text{flex:1}.music-stop{border:1px solid #ddd;background:#fff;border-radius:8px;padding:6px 9px;font-size:12px}
@media(max-width:520px){.main{padding:10px}.card{padding:12px}.avatar-stage{height:215px}.face{transform:scale(.93) translateY(5px)}}
</style>
</head>
<body class="mode-voice">
<div class="app">

<pre id="log" class="log"></pre>
</section></main></div>
<script>
const FN='wss://clcddygkaaqqtsbswgdf.supabase.co/functions/v1/technical-dark-star-vision-test';
const VOICES=[['Zephyr','明亮'],['Puck','活潑'],['Charon','資訊型'],['Kore','穩重'],['Fenrir','興奮'],['Leda','年輕'],['Orus','穩重'],['Aoede','輕快'],['Callirrhoe','輕鬆'],['Autonoe','明亮'],['Enceladus','氣聲'],['Iapetus','清晰'],['Umbriel','輕鬆'],['Algieba','順滑'],['Despina','順滑'],['Erinome','清晰'],['Algenib','沙啞'],['Rasalgethi','資訊型'],['Laomedeia','活潑'],['Achernar','柔和'],['Alnilam','穩重'],['Schedar','平穩'],['Gacrux','成熟'],['Pulcherrima','前衛'],['Achird','友善'],['Zubenelgenubi','隨性'],['Vindemiatrix','溫柔'],['Sadachbia','活潑'],['Sadaltager','知識型'],['Sulafat','溫暖']];
let ws=null,stream=null,auto=false,autoCycleTimer=null,autoStarting=false,cycleRunning=false,facing='user',mode='voice',videoTimer=null,inputCtx=null,processor=null,source=null,silent=null,playCtx=null,nextPlayTime=0,audioPackets=0,audioBytes=0,resumeHandle=null,wsRecovery=false;
let musicCtx=null,musicMaster=null,musicNodes=[],musicTimer=null,musicPlaying=false;
let avatarSpeech=0,avatarTarget=0,avatarRAF=null,blinkTimer=null,avatarExpression='neutral',avatarEyeX=0,avatarEyeY=0;
const $=id=>document.getElementById(id);
function log(s){$('log').textContent+='['+new Date().toLocaleTimeString('zh-TW')+'] '+s+'\n';$('log').scrollTop=$('log').scrollHeight}
function status(s){$('status').textContent=s}
function initVoices(){const sel=$('voiceSelect');sel.innerHTML='';VOICES.forEach(([id,label])=>{const o=document.createElement('option');o.value=id;o.textContent=id+' — '+label;sel.appendChild(o)});sel.value=localStorage.getItem('darkStarVoice')||'Kore';updateVoice();sel.onchange=()=>{localStorage.setItem('darkStarVoice',sel.value);updateVoice();log('🔊 已選擇暗星聲音：'+sel.value)}}
function updateVoice(){$('voiceStat').textContent=$('voiceSelect').value}
function setAvatarState(text){$('avatarState').textContent=text}
function setAvatarLinked(on){$('digitalLinkDot').classList.toggle('on',on);$('digitalLinkText').textContent=on?'已連結暗星即時語音':'未連結暗星'}
function setAvatarExpression(type){avatarExpression=type;const bl=$('browL'),br=$('browR');if(type==='happy'){bl.style.transform='rotate(-3deg)';br.style.transform='rotate(3deg)';}else if(type==='surprised'){bl.style.transform='rotate(-14deg) translateY(-5px)';br.style.transform='rotate(14deg) translateY(-5px)';}else if(type==='thinking'){bl.style.transform='rotate(12deg) translateY(1px)';br.style.transform='rotate(-5deg)';}else{bl.style.transform='rotate(7deg)';br.style.transform='rotate(-7deg)'}}
function avatarSpeechLevel(level){avatarTarget=Math.max(0,Math.min(1,level));if(avatarTarget>.035){setAvatarState('🗣️ 暗星正在說話');}else if(ws){setAvatarState('👂 暗星正在聆聽');}}
function startAvatarAnimation(){if(avatarRAF)return;const tick=()=>{avatarSpeech+=(avatarTarget-avatarSpeech)*.28;const mouthScale=.42+avatarSpeech*2.05;$('mouth').style.transform='translateX(-50%) scaleY('+mouthScale.toFixed(3)+')';$('mouth').style.borderRadius=avatarSpeech>.35?'45%':'0 0 24px 24px';const eyeOpen=avatarSpeech>.08?1:1;void eyeOpen;avatarRAF=requestAnimationFrame(tick)};avatarRAF=requestAnimationFrame(tick);if(!blinkTimer){const blink=()=>{if(!ws){blinkTimer=setTimeout(blink,3200+Math.random()*2500);return}const l=$('eyeL'),r=$('eyeR');l.style.height='4px';r.style.height='4px';setTimeout(()=>{l.style.height='29px';r.style.height='29px'},115);blinkTimer=setTimeout(blink,2800+Math.random()*3200)};blinkTimer=setTimeout(blink,2500)}}
function stopAvatarAnimation(){avatarTarget=0;setAvatarState('等待暗星連線');setAvatarLinked(false)}
function setAvatarEyes(x,y){avatarEyeX=Math.max(-5,Math.min(5,x));avatarEyeY=Math.max(-4,Math.min(4,y));$('pupilL').style.transform='translate(calc(-50% + '+avatarEyeX+'px),calc(-50% + '+avatarEyeY+'px))';$('pupilR').style.transform='translate(calc(-50% + '+avatarEyeX+'px),calc(-50% + '+avatarEyeY+'px))'}
function setMode(m){if(m===mode)return;if(ws||stream){log('⚠️ 已連線時不能直接切換模式，請先停止再切換');return}mode=m;document.body.className='mode-'+m;$('voiceBtn').classList.toggle('active',m==='voice');$('videoBtn').classList.toggle('active',m==='video');$('modeStat').textContent=m==='voice'?'語音':'視訊';log(m==='voice'?'🎤 語音模式：只開麥克風，暗星聽你說話並用聲音回答':'🎥 視訊模式：開啟攝影機＋麥克風，暗星同時看、聽、說')}
async function openMedia(){if(stream)return;const constraints={audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}};if(mode==='video')constraints.video={facingMode:facing,width:{ideal:1280},height:{ideal:720}};stream=await navigator.mediaDevices.getUserMedia(constraints);if(mode==='video'&&stream.getVideoTracks().length){$('preview').srcObject=stream;$('cameraBtn').disabled=false}else $('cameraBtn').disabled=true;log(mode==='video'?'✓ 攝影機＋麥克風權限已取得':'✓ 只有麥克風權限已取得｜沒有開啟攝影機')}
async function openAudio(){if(!playCtx){playCtx=new AudioContext();log('🔊 建立暗星語音播放引擎')}if(playCtx.state!=='running')await playCtx.resume();if(!inputCtx)inputCtx=new AudioContext({sampleRate:16000});if(inputCtx.state!=='running')await inputCtx.resume();log('✓ 語音播放引擎已啟動｜輸出 24kHz PCM')}
function connect(resume=false){return new Promise((resolve,reject)=>{if(ws&&ws.readyState===1)return resolve();const voice=encodeURIComponent($('voiceSelect').value);let url=FN+'?voice='+voice;if(resume&&resumeHandle)url+='&resumeHandle='+encodeURIComponent(resumeHandle);const s=new WebSocket(url);s.binaryType='arraybuffer';ws=s;s.onopen=()=>{status(resume?'🟢 正在接續暗星對話…':'🟢 已連線｜等待暗星語音');setAvatarLinked(true);setAvatarState('👂 暗星正在聆聽');startAvatarAnimation();log(resume?'✓ WebSocket 已重新開始｜要求 Session Resumption':'✓ WebSocket 已連線｜聲音：'+$('voiceSelect').value);resolve()};s.onerror=()=>{if(s!==ws)return;log('❌ WebSocket 錯誤｜全部停止，1 秒後自動重新開啟');reject(new Error('WebSocket error'));recoverFromWebSocketError(s)};s.onclose=()=>{if(s!==ws)return;if(!wsRecovery&&!auto&&!cycleRunning)stopAvatarAnimation();if(!wsRecovery&&auto&&!cycleRunning){status('🟡 自動連接中…');autoRetryStart()}else if(!wsRecovery&&!auto)status('⚪ 已斷線')};s.onmessage=e=>handleMessage(e.data)})}
async function recoverFromWebSocketError(deadSocket){if(wsRecovery)return;wsRecovery=true;auto=true;cycleRunning=false;clearTimeout(autoCycleTimer);autoCycleTimer=null;clearInterval(videoTimer);videoTimer=null;stopMusic(false);if(processor){try{processor.disconnect()}catch(_){}processor=null}if(source){try{source.disconnect()}catch(_){}source=null}if(silent){try{silent.disconnect()}catch(_){}silent=null}if(inputCtx){try{await inputCtx.close()}catch(_){}inputCtx=null}if(playCtx){try{await playCtx.close()}catch(_){}playCtx=null}nextPlayTime=0;if(stream){stream.getTracks().forEach(t=>{try{t.stop()}catch(_){}});stream=null}$('preview').srcObject=null;$('startBtn').disabled=false;$('stopBtn').disabled=true;$('cameraBtn').disabled=true;if(ws===deadSocket)ws=null;try{deadSocket.onclose=null}catch(_){}try{deadSocket.onerror=null}catch(_){}try{deadSocket.onmessage=null}catch(_){}try{deadSocket.close()}catch(_){}status('🔴 WebSocket 錯誤｜全部已停止');setAvatarLinked(false);setAvatarState('🔄 暗星準備重新連線');log('🛑 麥克風、攝影機、語音、音樂、WebSocket 全部已關閉');setTimeout(async()=>{if(!wsRecovery)return;log('🔄 1 秒後自動重新開啟暗星');status('🟡 自動重新開啟…');try{await start(true);log('🟢 WebSocket 錯誤復原完成');}catch(_){}finally{wsRecovery=false}},1000)}
function handleMessage(raw){if(raw instanceof ArrayBuffer){playPCM(raw);return}try{const d=JSON.parse(raw);if(d.audio?.data)playBase64PCM(d.audio.data);if(d.handle)resumeHandle=d.handle;if(d.type==='live_open'){log('✓ Live Session 已建立');setAvatarLinked(true)}else if(d.type==='session_handle'){if(d.handle)resumeHandle=d.handle;log('✓ 已取得可續接 Handle')}else if(d.type==='handoff_start')log('→ 後端通知：建立下一個 Session');else if(d.type==='handoff_complete')log('✓ 後端 Session 銜接完成');else if(d.type==='session_resumed'){status('🟢 Session 已續接');setAvatarState('👂 暗星正在聆聽');log('✓ Session Resumption 成功｜沒有重新開場白')}else if(d.serverContent?.inputTranscription?.text){setAvatarState('👂 暗星正在聽你說話');setAvatarEyes(0,0);log('你：'+d.serverContent.inputTranscription.text)}else if(d.serverContent?.outputTranscription?.text){const t=d.serverContent.outputTranscription.text;log('暗星：'+t);detectAvatarExpression(t);detectMusicCommand(t)}else if(d.type==='go_away')log('⚠️ GoAway：'+d.timeLeft);else if(d.type==='handoff_failed')log('❌ 後端銜接失敗：'+d.message);else if(d.type==='error'||d.error)log('❌ 錯誤：'+(d.message||d.error?.message||JSON.stringify(d.error)))}catch(e){log('訊息解析錯誤：'+e.message)}}
function detectAvatarExpression(t){if(!t)return;const q=t.replace(/[，。！？,.!?]/g,'');if(/(哈哈|開心|太好了|成功|很棒|喜歡|😊|😄)/.test(q)){setAvatarExpression('happy');setAvatarState('😊 暗星很開心');setAvatarEyes(0,-1)}else if(/(等等|真的嗎|什麼|怎麼會|驚訝|沒想到)/.test(q)){setAvatarExpression('surprised');setAvatarState('😮 暗星有點驚訝');setAvatarEyes(0,-2)}else if(/(讓我想想|思考|分析|考慮|應該)/.test(q)){setAvatarExpression('thinking');setAvatarState('🤔 暗星正在思考');setAvatarEyes(3,0)}else{setAvatarExpression('neutral');setAvatarState('🗣️ 暗星正在說話');setAvatarEyes(0,0)}}
function playBase64PCM(b64){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);playPCM(u.buffer)}
function playPCM(buf){if(!playCtx)return;const bytes=new Uint8Array(buf),pcm=new Int16Array(bytes.buffer,bytes.byteOffset,Math.floor(bytes.byteLength/2));if(!pcm.length)return;audioPackets++;audioBytes+=bytes.byteLength;$('audioStat').textContent=audioPackets;$('byteStat').textContent=audioBytes.toLocaleString();let sum=0;for(let i=0;i<pcm.length;i++){const v=pcm[i]/32768;sum+=v*v}const rms=Math.sqrt(sum/pcm.length);avatarSpeechLevel(Math.min(1,rms*7.5));if(playCtx.state!=='running')playCtx.resume().catch(()=>{});const audio=playCtx.createBuffer(1,pcm.length,24000),data=audio.getChannelData(0);for(let i=0;i<pcm.length;i++)data[i]=pcm[i]/32768;const src=playCtx.createBufferSource();src.buffer=audio;src.connect(playCtx.destination);const now=playCtx.currentTime;if(nextPlayTime<now+.03)nextPlayTime=now+.03;src.start(nextPlayTime);const end=nextPlayTime+audio.duration;src.onended=()=>{if(end>=nextPlayTime-.01&&playCtx.currentTime>=end-.03)avatarTarget=Math.max(0,avatarTarget-.16)};nextPlayTime=end}
function musicCommandIsNegative(t){return /(不能|無法|沒辦法|沒有辦法|不具備|目前沒有).{0,12}(播放|放)(音樂|歌曲)?/.test(t)}
function detectMusicCommand(t){if(!t||musicCommandIsNegative(t))return;const q=t.replace(/[，。！？,.!?]/g,'');if(/(現在|幫你|為你|替你|開始|正在|已經|已替你|已幫你).{0,18}(播放|放)(一首|音樂|歌曲|音樂給你)?/.test(q)||/(播放|放)(一首|音樂|歌曲)/.test(q))startMusic('暗星語音指令')}
async function startMusic(reason='手動測試'){try{if(!musicCtx)musicCtx=new AudioContext();if(musicCtx.state!=='running')await musicCtx.resume();stopMusic(false);musicMaster=musicCtx.createGain();musicMaster.gain.value=.16;musicMaster.connect(musicCtx.destination);const notes=[261.63,329.63,392,523.25,392,329.63,293.66,349.23,440,523.25,440,349.23];let i=0;const playNote=()=>{if(!musicPlaying)return;const now=musicCtx.currentTime,f=notes[i++%notes.length],o=musicCtx.createOscillator(),g=musicCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.16,now+.05);g.gain.exponentialRampToValueAtTime(.0001,now+1.8);o.connect(g);g.connect(musicMaster);o.start(now);o.stop(now+1.85);musicNodes.push(o);musicNodes=musicNodes.filter(n=>n!==o)};musicPlaying=true;$('musicDot').classList.add('on');$('musicText').textContent='🎵 音樂：正在播放｜使用目前手機喇叭';log('🎵 暗星已啟動手機喇叭音樂｜原因：'+reason);playNote();musicTimer=setInterval(playNote,900)}catch(e){musicPlaying=false;$('musicDot').classList.remove('on');$('musicText').textContent='🎵 音樂：播放失敗';log('❌ 音樂播放失敗：'+(e.message||e))}}
function stopMusic(update=true){musicPlaying=false;if(musicTimer){clearInterval(musicTimer);musicTimer=null}musicNodes.forEach(n=>{try{n.stop()}catch(_){} });musicNodes=[];if(musicMaster){try{musicMaster.disconnect()}catch(_){}}musicMaster=null;if(update){$('musicDot').classList.remove('on');$('musicText').textContent='🎵 音樂：已停止';log('⏹️ 已停止音樂')}}
async function start(resume=false){if(autoStarting)return;autoStarting=true;try{audioPackets=0;audioBytes=0;$('audioStat').textContent='0';$('byteStat').textContent='0';await openAudio();await openMedia();await connect(resume);if(mode==='video')startVideo();startAudio();$('startBtn').disabled=true;$('stopBtn').disabled=false;status('🟢 暗星正在聽／說'+(mode==='video'?'／看':'')+'｜聲音：'+$('voiceSelect').value);setAvatarLinked(true);setAvatarState('👂 暗星正在聆聽');if(resume)log('✓ 自動重新開始｜沿用上一個 Session Handle');scheduleAutoCycle()}catch(e){if(e?.message==='WebSocket error'){status('🔴 WebSocket 錯誤｜等待自動重新開啟')}else{status('🔴 無法啟動');log('啟動失敗：'+(e.message||e));if(auto&&!wsRecovery)autoRetryStart()}}finally{autoStarting=false}}
function scheduleAutoCycle(){clearTimeout(autoCycleTimer);if(!auto||wsRecovery)return;autoCycleTimer=setTimeout(()=>automaticStopStart(),150000)}
async function automaticStopStart(){if(!auto||cycleRunning||wsRecovery||!ws)return;cycleRunning=true;log('⏱️ 到達 2:30｜自動按「停止」');status('🟡 2:30 自動停止…');await stop(true);setTimeout(async()=>{if(!auto||wsRecovery){cycleRunning=false;return}log('⏱️ 到達 2:31｜自動按「開始」');status('🟡 2:31 自動開始…');await start(true);cycleRunning=false},1000)}
function autoRetryStart(){if(!auto||cycleRunning||wsRecovery)return;clearTimeout(autoCycleTimer);autoCycleTimer=setTimeout(()=>start(!!resumeHandle),1000)}
function startVideo(){clearInterval(videoTimer);const c=document.createElement('canvas'),x=c.getContext('2d');videoTimer=setInterval(()=>{if(!ws||ws.readyState!==1||!$('preview').videoWidth)return;c.width=640;c.height=Math.round(640*$('preview').videoHeight/$('preview').videoWidth);x.drawImage($('preview'),0,0,c.width,c.height);ws.send(JSON.stringify({type:'video',data:c.toDataURL('image/jpeg',.72).split(',')[1],mimeType:'image/jpeg'}))},1000)}
function startAudio(){if(!stream||!inputCtx)return;if(processor)processor.disconnect();if(source)source.disconnect();source=inputCtx.createMediaStreamSource(stream);processor=inputCtx.createScriptProcessor(2048,1,1);silent=inputCtx.createGain();silent.gain.value=0;processor.onaudioprocess=e=>{if(!ws||ws.readyState!==1)return;const a=e.inputBuffer.getChannelData(0),pcm=new Int16Array(a.length);for(let i=0;i<a.length;i++)pcm[i]=Math.max(-1,Math.min(1,a[i]))*32767;let bin='';const u=new Uint8Array(pcm.buffer);for(let i=0;i<u.length;i++)bin+=String.fromCharCode(u[i]);ws.send(JSON.stringify({type:'audio',data:btoa(bin),mimeType:'audio/pcm;rate=16000'}))};source.connect(processor);processor.connect(silent);silent.connect(inputCtx.destination)}
async function stop(fromAuto=false){clearTimeout(autoCycleTimer);clearInterval(videoTimer);videoTimer=null;stopMusic(false);if(processor){try{processor.disconnect()}catch(_){}processor=null}if(source){try{source.disconnect()}catch(_){}source=null}if(silent){try{silent.disconnect()}catch(_){}silent=null}if(inputCtx){await inputCtx.close().catch(()=>{});inputCtx=null}if(playCtx){await playCtx.close().catch(()=>{});playCtx=null}nextPlayTime=0;avatarTarget=0;setAvatarState(fromAuto?'⏱️ 2:30 自動切換中…':'等待暗星連線');setAvatarLinked(false);if(ws){const old=ws;ws=null;try{old.send(JSON.stringify({type:'close'}))}catch(_){}try{old.close()}catch(_){}}if(stream){stream.getTracks().forEach(t=>{try{t.stop()}catch(_){}});stream=null}$('preview').srcObject=null;$('startBtn').disabled=false;$('stopBtn').disabled=true;$('cameraBtn').disabled=true;if(!fromAuto){auto=false;cycleRunning=false;clearTimeout(autoCycleTimer);status('⚪ 已停止');log('已手動停止')}$('musicDot').classList.remove('on');$('musicText').textContent='🎵 音樂：未播放｜暗星可使用目前手機喇叭播放內建放鬆音樂'}
async function toggleAuto(){if(auto){auto=false;cycleRunning=false;clearTimeout(autoCycleTimer);await stop(false);$('autoBtn').textContent='⚡ 自動連接';return}auto=true;$('autoBtn').textContent='⏸ 停止自動連接';log('⚡ 啟動自動循環：2:30 停止 → 2:31 開始 → Session Resumption');await start(!!resumeHandle)}
async function switchCamera(){if(mode!=='video'||!stream||!stream.getVideoTracks().length)return;facing=facing==='user'?'environment':'user';const old=stream.getVideoTracks()[0];old.stop();const next=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}}});const track=next.getVideoTracks()[0];stream.removeTrack(old);stream.addTrack(track);$('preview').srcObject=stream;$('preview').classList.toggle('mirror',facing==='user');log(facing==='user'?'📷 已切換前鏡頭：自己':'📷 已切換後鏡頭：別人／書本')}
window.addEventListener('beforeunload',()=>{try{clearTimeout(autoCycleTimer);clearInterval(videoTimer);stopMusic(false);if(ws)ws.close();if(stream)stream.getTracks().forEach(t=>t.stop())}catch(_){} });
initVoices();startAvatarAnimation();
log('✓ 測試頁已載入');log('🧑‍🚀 可愛版暗星數字人已載入｜嘴型將跟隨實際 Live PCM 語音');log('⏱️ 自動接續規則：2:30 按停止，2:31 按開始');log('🔁 WebSocket 錯誤規則：全部停止 → 1 秒 → 自動重新開啟');log('🎵 音樂工具已載入｜暗星要求播放音樂時，使用目前手機喇叭播放內建放鬆音樂');
