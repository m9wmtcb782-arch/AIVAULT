<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Technical Dark Star｜Face Control Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#050812;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:1100px;margin:auto;padding:12px}.stage{height:58vh;min-height:360px;background:#090d16;border:1px solid #29466f;border-radius:18px;overflow:hidden;position:relative}canvas{width:100%;height:100%;display:block}.status{position:absolute;left:12px;top:12px;padding:8px 12px;border-radius:10px;background:#07101dcc;border:1px solid #31558f;font-size:13px}.panel{margin-top:12px;background:#0b1220;border:1px solid #29466f;border-radius:18px;padding:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.group{margin-top:12px;padding-top:12px;border-top:1px solid #20334f}.group h3{margin:0 0 8px;font-size:16px}.btn{border:0;border-radius:10px;padding:10px 13px;background:#31558f;color:white;font-size:14px}.btn:active{transform:scale(.98)}label{display:block;margin:8px 0;font-size:13px}input[type=range]{width:100%}.small{font-size:12px;color:#9fb1cb}.ok{color:#63e6be}.err{color:#ff6b81}.warn{color:#ffd166}.bones{max-height:220px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:11px;line-height:1.45;color:#a9c1df}</style></head><body><main><div class="stage"><canvas id="c"></canvas><div id="status" class="status warn">正在載入暗星 3D…</div></div><div class="panel"><b>Technical Dark Star｜Face Control V24</b><div class="small" style="margin-top:6px">這一版先禁止錯誤的向後折手。姿勢求解只接受「高位、向左右延伸」的真實手臂骨鏈，並以世界座標求解，不再累積旋轉。</div><div class="group"><h3>身體姿勢</h3><div class="row"><button class="btn" onclick="applyNaturalPose()">自然站立</button><button class="btn" onclick="resetPose()">原始姿勢</button><button class="btn" onclick="toggleIdle()" id="idleBtn">停止自然待機</button></div><div id="poseInfo" class="small" style="margin-top:8px">正在分析實際骨架…</div><div id="chains" class="bones" style="margin-top:8px"></div></div><div class="group"><h3>嘴巴</h3><div class="row"><button class="btn" onclick="setM('h_expressions.MouthOpen_h',.8)">張嘴</button><button class="btn" onclick="setM('h_expressions.Shout_h',.8)">大喊</button><button class="btn" onclick="setM('h_expressions.Kiss_h',.8)">嘟嘴</button><button class="btn" onclick="setM('h_expressions.RsmileOpen_h',.7);setM('h_expressions.LsmileOpen_h',.7)">微笑</button><button class="btn" onclick="clearFace()">還原</button></div><label>MouthOpen <input id="mouth" type="range" min="0" max="1" step=".01" value="0" oninput="setM('h_expressions.MouthOpen_h',+this.value)"></label></div><div class="group"><h3>眼睛</h3><div class="row"><button class="btn" onclick="blink('L')">左眼眨</button><button class="btn" onclick="blink('R')">右眼眨</button><button class="btn" onclick="blink('B')">雙眼眨</button><button class="btn" onclick="setM('h_expressions.Lsquint_h',.7);setM('h_expressions.Rsquint_h',.7)">瞇眼</button><button class="btn" onclick="setM('h_expressions.LeyeOpen_h',.8);setM('h_expressions.ReyeOpen_h',.8)">睜大</button></div></div><div class="group"><h3>眉毛</h3><div class="row"><button class="btn" onclick="setM('h_expressions.LbrowUp_h',.7);setM('h_expressions.RbrowUp_h',.7)">挑眉</button><button class="btn" onclick="setM('h_expressions.LbrowDown_h',.7);setM('h_expressions.RbrowDown_h',.7)">壓眉</button><button class="btn" onclick="setM('h_expressions.LLbrowUp_h',.7);setM('h_expressions.RRbrowUp_h',.7)">外側挑眉</button><button class="btn" onclick="clearFace()">還原表情</button></div></div><div class="group"><h3>自動眨眼</h3><div class="row"><button id="auto" class="btn" onclick="toggleBlink()">啟用自然眨眼</button><span id="autoText" class="small">目前關閉</span></div></div><div class="group"><h3>Morph Targets</h3><div id="found" class="small"></div></div></div></main><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';const MODEL='./assets/dark-star/technical-dark-star-avatar.glb';let scene,camera,renderer,controls,avatar,meshes=[],weights=new Map(),blinkTimer=null,blinking=false,original=[],arms={L:[],R:[]},idle=false,idleBase=new Map(),idleClock=new THREE.Clock();const status=document.getElementById('status'),found=document.getElementById('found'),poseInfo=document.getElementById('poseInfo'),chains=document.getElementById('chains');function msg(t,c='warn'){status.textContent=t;status.className='status '+c}function collect(o){o.traverse(x=>{if(x.isMesh&&x.morphTargetDictionary&&x.morphTargetInfluences){meshes.push(x);Object.entries(x.morphTargetDictionary).forEach(([n,i])=>{if(!weights.has(n))weights.set(n,[]);weights.get(n).push({mesh:x,index:i})})}})}function setM(n,v){const a=weights.get(n);if(!a)return;a.forEach(x=>x.mesh.morphTargetInfluences[x.index]=THREE.MathUtils.clamp(v,0,1))}window.setM=setM;window.clearFace=()=>{meshes.forEach(m=>m.morphTargetInfluences.fill(0));document.getElementById('mouth').value=0};window.blink=async side=>{const ns=side==='L'?['h_expressions.LeyeClose_h']:side==='R'?['h_expressions.ReyeClose_h']:['h_expressions.LeyeClose_h','h_expressions.ReyeClose_h'];ns.forEach(n=>setM(n,1));await new Promise(r=>setTimeout(r,130));ns.forEach(n=>setM(n,0))};window.toggleBlink=()=>{blinking=!blinking;document.getElementById('autoText').textContent=blinking?'目前開啟':'目前關閉';document.getElementById('auto').textContent=blinking?'停止自然眨眼':'啟用自然眨眼';if(blinking)scheduleBlink();else clearTimeout(blinkTimer)};function scheduleBlink(){if(!blinking)return;blinkTimer=setTimeout(async()=>{await window.blink('B');scheduleBlink()},2800+Math.random()*3200)}function savePose(){original=[];avatar.traverse(o=>{if(o.isBone)original.push({b:o,q:o.quaternion.clone(),p:o.position.clone(),s:o.scale.clone()})})}function resetPose(){original.forEach(x=>{x.b.quaternion.copy(x.q);x.b.position.copy(x.p);x.b.scale.copy(x.s)});idleBase.clear();poseInfo.textContent='已恢復 GLB 原始綁定姿勢。'}window.resetPose=resetPose;function boneWorld(b){return b.getWorldPosition(new THREE.Vector3())}function chainFrom(b){const out=[b];let cur=b;for(let i=0;i<5;i++){const kids=cur.children.filter(x=>x.isBone);if(!kids.length)break;const p=boneWorld(cur);const scored=kids.map(k=>{const q=boneWorld(k),d=q.clone().sub(p),len=d.length();return {k,d,len}}).filter(x=>x.len>.005).sort((a,b)=>b.len-a.len);if(!scored.length)break;out.push(scored[0].k);cur=scored[0].k}return out}function discoverArms(){const bones=[];avatar.traverse(o=>{if(o.isBone)bones.push(o)});avatar.updateMatrixWorld(true);const pts=bones.map(b=>({b,p:boneWorld(b)}));const ys=pts.map(x=>x.p.y);const minY=Math.min(...ys),maxY=Math.max(...ys),range=Math.max(.001,maxY-minY);const candidates=pts.filter(x=>{const ch=x.b.children.filter(y=>y.isBone);if(!ch.length)return false;const c=boneWorld(ch[0]),d=c.clone().sub(x.p);return x.p.y>minY+range*.50&&Math.abs(d.x)>Math.abs(d.y)*.45&&Math.abs(d.x)>Math.abs(d.z)*.55&&Math.abs(x.p.x)>range*.035});function choose(side){const a=candidates.filter(x=>side==='L'?x.p.x<0:x.p.x>0).sort((a,b)=>{const sa=Math.abs(a.p.x)+a.p.y*.08,sb=Math.abs(b.p.x)+b.p.y*.08;return sb-sa});for(const x of a){const ch=chainFrom(x.b);if(ch.length>=3){const d=boneWorld(ch[1]).sub(boneWorld(ch[0]));if(Math.sign(d.x)===(side==='L'?-1:1)||Math.abs(d.x)<.12)return ch}}return []}arms.L=choose('L');arms.R=choose('R');chains.textContent='左臂鏈：'+(arms.L.length?arms.L.map(x=>x.name).join(' → '):'未通過安全辨識')+'\n右臂鏈：'+(arms.R.length?arms.R.map(x=>x.name).join(' → '):'未通過安全辨識');return arms.L.length>=3&&arms.R.length>=3}function aimBoneDown(bone,targetDir){if(!bone)return false;const child=bone.children.find(x=>x.isBone);if(!child)return false;avatar.updateMatrixWorld(true);const p0=boneWorld(bone),p1=boneWorld(child),cur=p1.sub(p0).normalize(),target=targetDir.clone().normalize();const qWorld=new THREE.Quaternion().setFromUnitVectors(cur,target);const currentWorld=new THREE.Quaternion();bone.getWorldQuaternion(currentWorld);const desiredWorld=qWorld.multiply(currentWorld);if(bone.parent&&bone.parent.isBone){const parentWorld=new THREE.Quaternion();bone.parent.getWorldQuaternion(parentWorld);bone.quaternion.copy(parentWorld.invert().multiply(desiredWorld))}else bone.quaternion.copy(desiredWorld);bone.updateMatrixWorld(true);return true}function applyNaturalPose(){resetPose();if(!discoverArms()){poseInfo.textContent='⚠️ 這個 GLB 的手臂骨架目前無法達到高可信度辨識；為避免再次出現鬼片姿勢，本次不改動身體。';return}const ok1=aimBoneDown(arms.L[0],new THREE.Vector3(-.10,-.995,0));const ok2=aimBoneDown(arms.R[0],new THREE.Vector3(.10,-.995,0));avatar.updateMatrixWorld(true);if(arms.L[1])aimBoneDown(arms.L[1],new THREE.Vector3(-.04,-.999,0));if(arms.R[1])aimBoneDown(arms.R[1],new THREE.Vector3(.04,-.999,0));idleBase.clear();arms.L.concat(arms.R).forEach(b=>{if(b)idleBase.set(b,b.quaternion.clone())});poseInfo.textContent=(ok1&&ok2)?'✅ 安全自然站立：手臂只允許向下，不允許向前/向後折；前臂維持近垂直。':'⚠️ 未通過安全姿勢檢查，保留原始姿勢。'}window.applyNaturalPose=applyNaturalPose;window.toggleIdle=()=>{idle=!idle;document.getElementById('idleBtn').textContent=idle?'停止自然待機':'啟用自然待機';if(idle){arms.L.concat(arms.R).forEach(b=>{if(b&&!idleBase.has(b))idleBase.set(b,b.quaternion.clone())})}poseInfo.textContent=idle?'自然待機開啟（不累積旋轉）。':'自然待機停止。'};function applyIdle(t){if(!idle)return;const s=Math.sin(t*1.1);for(const b of arms.L.concat(arms.R)){if(!b||!idleBase.has(b))continue;const base=idleBase.get(b);const q=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),(b===arms.L[0]?-1:1)*s*.008);b.quaternion.copy(base).premultiply(q)}}function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x090d16);camera=new THREE.PerspectiveCamera(35,1,.01,100);renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;scene.add(new THREE.HemisphereLight(0xffffff,0x334455,2));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(2,3,4);scene.add(key);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;resize();addEventListener('resize',resize);load()}function resize(){const e=document.querySelector('.stage'),w=e.clientWidth,h=e.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}async function load(){try{const r=await fetch(MODEL,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const buf=await r.arrayBuffer();const loader=new GLTFLoader();loader.setMeshoptDecoder(MeshoptDecoder);const gltf=await loader.parseAsync(buf,new URL('./assets/dark-star/',location.href).href);avatar=gltf.scene;scene.add(avatar);collect(avatar);const box=new THREE.Box3().setFromObject(avatar),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());avatar.position.sub(center);camera.position.set(0,size.y*.18,size.y*1.65);controls.target.set(0,0,0);controls.update();savePose();discoverArms();resetPose();msg('✅ V24：已停用危險的錯誤姿勢求解','ok');found.textContent=[...weights.keys()].join('　')}catch(e){console.error(e);msg('❌ 載入/解碼失敗：'+(e.message||e),'err')}}function animate(){requestAnimationFrame(animate);applyIdle(idleClock.getElapsedTime());controls?.update();renderer?.render(scene,camera)}init();animate();</script></body></html>
