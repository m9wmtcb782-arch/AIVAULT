<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Technical Dark Star｜原生臉部 Morph 實測</title><style>*{box-sizing:border-box}html,body{margin:0;background:#080d18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}header{padding:16px 18px 8px}.title{font-size:21px;font-weight:800}.sub{margin-top:5px;color:#9eabc2;font-size:14px}main{padding:0 14px 28px;max-width:900px;margin:auto}.stage{position:relative;height:58vh;min-height:360px;border-radius:18px;overflow:hidden;background:#111827;box-shadow:0 12px 40px rgba(0,0,0,.35)}canvas{width:100%;height:100%;display:block}.loading{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#aab4cc;background:linear-gradient(180deg,rgba(8,13,24,.15),rgba(8,13,24,.55));pointer-events:none}.panel{background:#121a2b;border-radius:16px;padding:14px;margin-top:12px}.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.row button{flex:1 1 auto}button{font:inherit;border:0;border-radius:10px;padding:10px 12px;background:#26334d;color:#fff}button:active{transform:scale(.98)}button.primary{background:#31558f}button.stop{background:#633c48}.name{font-size:18px;font-weight:800;margin-bottom:3px}.muted{color:#9eabc2;font-size:13px;line-height:1.55}.range{width:100%;margin:12px 0}input[type=range]{width:100%}.tag{margin-top:10px}.tag button{padding:8px 10px}.ok{color:#62e6ae}.error{color:#ff788b;white-space:pre-wrap;word-break:break-word}.warn{color:#ffd166;white-space:pre-wrap;word-break:break-word}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#1e293b;color:#b9c7dd;font-size:12px;margin-right:5px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head>
<body><header><div class="title">Technical Dark Star｜原生臉部 Morph 實測</div><div class="sub">只測試真正 GLB / GPU / Morph，不修改正式暗星。</div></header><main><section class="stage"><canvas id="view"></canvas><div id="loading" class="loading">正在啟動 GPU 並載入暗星 3D 模型…</div></section><div class="panel"><div id="status">初始化 3D 引擎…</div><div id="info" class="muted">等待 GLB</div></div><div class="panel"><div class="name">GLB 結構診斷</div><div id="diag" class="muted">尚未開始</div></div><div class="panel"><div class="row"><button id="prev">◀ 上一個</button><button id="next">下一個 ▶</button><button id="reset">重置</button><button id="auto" class="primary">逐個測試</button></div><div style="margin-top:12px" class="name" id="name">等待模型</div><div class="muted" id="idx">—</div><input id="power" class="range" type="range" min="0" max="1" step="0.01" value="0"><div class="row"><button data-v="0">0</button><button data-v="0.25">25%</button><button data-v="0.5">50%</button><button data-v="0.75">75%</button><button data-v="1">100%</button></div></div><div class="panel"><div class="name">臉部標記</div><div class="muted">選目前 Morph 實際控制的部位，之後整理成暗星正式 Face Controller。</div><div class="row tag"><button data-tag="left-eye">左眼</button><button data-tag="right-eye">右眼</button><button data-tag="mouth">嘴巴</button><button data-tag="brow">眉毛</button><button data-tag="smile">笑</button><button data-tag="frown">皺眉</button><button data-tag="other">其他</button></div><div id="tags" class="muted" style="margin-top:10px">尚未標記</div></div></main>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const MODEL='./assets/dark-star/technical-dark-star-avatar.glb',BASE='./assets/dark-star/',$=id=>document.getElementById(id);let scene,camera,renderer,avatar,clock,morphs=[],active=0,value=0,tags={},autoTimer=null;
function setStatus(text,cls=''){$('status').textContent=text;$('status').className=cls}function resize(){if(!renderer||!camera)return;const b=$('view').getBoundingClientRect(),w=Math.max(1,Math.floor(b.width)),h=Math.max(1,Math.floor(b.height));renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}function frameAvatar(){const box=new THREE.Box3().setFromObject(avatar),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),max=Math.max(size.x,size.y,size.z);camera.position.set(center.x,center.y+size.y*.03,center.z+max*1.65);camera.lookAt(center.x,center.y,center.z)}function collectMorphs(){morphs=[];avatar.traverse(o=>{if(!o.isMesh||!o.morphTargetDictionary||!o.morphTargetInfluences)return;for(const[name,index]of Object.entries(o.morphTargetDictionary))morphs.push({name,mesh:o,index,label:`${o.name||'Face Mesh'} / ${name}`})})}function clearMorphs(){for(const m of morphs)m.mesh.morphTargetInfluences[m.index]=0}function apply(){if(!morphs.length)return;clearMorphs();morphs[active].mesh.morphTargetInfluences[morphs[active].index]=value;$('name').textContent=morphs[active].label;$('idx').textContent=`第 ${active+1} 個 / 共 ${morphs.length} 個`;$('power').value=value}function selectMorph(i){active=(i+morphs.length)%morphs.length;value=0;apply()}function setValue(v){value=Math.max(0,Math.min(1,Number(v)));apply()}function render(){requestAnimationFrame(render);if(!renderer)return;const dt=clock.getDelta();if(autoTimer){autoTimer.elapsed+=dt;if(autoTimer.elapsed>.9){autoTimer.elapsed=0;selectMorph(active+1);value=.75;apply()}}renderer.render(scene,camera)}function init3D(){const c=$('view');if(!c.getContext('webgl2')&&!c.getContext('webgl'))throw new Error('此瀏覽器沒有可用的 WebGL GPU。');renderer=new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;scene=new THREE.Scene();scene.background=new THREE.Color(0x111827);camera=new THREE.PerspectiveCamera(32,1,.01,100);clock=new THREE.Clock();scene.add(new THREE.HemisphereLight(0xffffff,0x334155,2.2));const key=new THREE.DirectionalLight(0xffffff,2.8);key.position.set(2,3,4);scene.add(key);const fill=new THREE.DirectionalLight(0x9fc5ff,1.4);fill.position.set(-3,1,2);scene.add(fill);resize();addEventListener('resize',resize)}
const COMPONENT_BYTES={5120:1,5121:1,5122:2,5123:2,5125:4,5126:4},TYPE_COMPONENTS={SCALAR:1,VEC2:2,VEC3:3,VEC4:4,MAT2:4,MAT3:9,MAT4:16};function u32(v,o){return v.getUint32(o,true)}
function parseGLB(buf){const dv=new DataView(buf);if(buf.byteLength<12)throw new Error('GLB header 不完整');const magic=new TextDecoder().decode(new Uint8Array(buf,0,4)),version=u32(dv,4),total=u32(dv,8);if(magic!=='glTF')throw new Error(`GLB Magic 錯誤：${magic}`);if(version!==2)throw new Error(`GLB Version 不支援：${version}`);if(total>buf.byteLength)throw new Error(`GLB header 宣稱 ${total} bytes，但實際只有 ${buf.byteLength} bytes`);let off=12,json=null,binLength=0,chunks=[];while(off+8<=Math.min(total,buf.byteLength)){const len=u32(dv,off),type=u32(dv,off+4),ds=off+8,de=ds+len;if(de>buf.byteLength)throw new Error(`Chunk 超界：offset=${off} length=${len} end=${de} file=${buf.byteLength}`);chunks.push({type,len,offset:off});if(type===0x4e4f534a)json=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,ds,len)).trim());if(type===0x004e4942)binLength=len;off=de}if(!json)throw new Error('找不到 JSON chunk');if(!binLength)throw new Error('找不到 BIN chunk');const problems=[],warnings=[],declared=json.buffers?.[0]?.byteLength??null;if(declared!==null&&declared>binLength)problems.push(`buffers[0].byteLength=${declared} > BIN chunk=${binLength}`);if(declared!==null&&declared<binLength)warnings.push(`buffers[0].byteLength=${declared} < BIN chunk=${binLength}（多出的通常是 GLB padding）`);const bvs=json.bufferViews||[],acs=json.accessors||[];for(let i=0;i<bvs.length;i++){const b=bvs[i],start=b.byteOffset||0,len=b.byteLength||0,end=start+len;if(b.buffer!==0)problems.push(`bufferView[${i}] 指向 buffer ${b.buffer}，目前只有 buffer 0`);if(start<0||len<0||end>binLength)problems.push(`bufferView[${i}] 超界：offset=${start} length=${len} end=${end} BIN=${binLength}`);if(b.byteStride!==undefined&&(!Number.isInteger(b.byteStride)||b.byteStride<4||b.byteStride>252||b.byteStride%4!==0))problems.push(`bufferView[${i}] byteStride=${b.byteStride} 不符合 glTF 2.0 vertex attribute 要求`)}for(let i=0;i<acs.length;i++){const a=acs[i];if(a.bufferView===undefined)continue;const b=bvs[a.bufferView];if(!b){problems.push(`accessor[${i}] bufferView=${a.bufferView} 不存在`);continue}const cb=COMPONENT_BYTES[a.componentType],comps=TYPE_COMPONENTS[a.type];if(!cb||!comps){problems.push(`accessor[${i}] 未知 componentType/type：${a.componentType}/${a.type}`);continue}const ao=a.byteOffset||0,stride=b.byteStride||cb*comps,last=ao+stride*Math.max(0,(a.count||0)-1)+cb*comps;if(ao%cb!==0)problems.push(`accessor[${i}] byteOffset=${ao} 未對齊 componentType ${cb} bytes`);if(((b.byteOffset||0)+ao)%cb!==0)problems.push(`accessor[${i}] 絕對 offset=${(b.byteOffset||0)+ao} 未對齊 componentType ${cb} bytes`);if(last>(b.byteLength||0))problems.push(`accessor[${i}] 超出 bufferView[${a.bufferView}]：需要=${last} viewLength=${b.byteLength} count=${a.count} type=${a.type} stride=${stride}`);if(b.target===34962&&((ao%4)!==0||(b.byteStride!==undefined&&b.byteStride%4!==0)))problems.push(`accessor[${i}] vertex attribute 未 4-byte 對齊`)}const morphRefs=[];for(const[mi,m]of(json.meshes||[]).entries())for(const[pi,p]of(m.primitives||[]).entries())for(const[t,targets]of(p.targets||[]).entries())for(const[k,ai]of Object.entries(targets||{}))morphRefs.push({mesh:mi,primitive:pi,target:t,semantic:k,accessor:ai});const uniqueMorph=[...new Set(morphRefs.map(x=>x.accessor))];$('diag').innerHTML=`<span class="badge">GLB ${buf.byteLength.toLocaleString()} bytes</span><span class="badge">JSON ${chunks.find(c=>c.type===0x4e4f534a)?.len||0}</span><span class="badge">BIN ${binLength.toLocaleString()}</span><span class="badge">bufferViews ${bvs.length}</span><span class="badge">accessors ${acs.length}</span><span class="badge">morph accessors ${uniqueMorph.length}</span><br>${problems.length?`<span class="error">❌ 發現 ${problems.length} 個結構問題：\n${problems.slice(0,30).map((x,n)=>`${n+1}. ${x}`).join('\n')}</span>`:`<span class="ok">✅ buffers / bufferViews / accessors 範圍與對齊檢查通過。</span>`}${warnings.length?`<br><span class="warn">⚠ ${warnings.join('\n')}</span>`:''}`;return{json,problems,warnings,binLength,morphRefs}}
async function boot(){try{setStatus('先確認瀏覽器 GPU…');init3D();setStatus('GPU OK，直接取得完整 GLB…','ok');const r=await fetch(MODEL,{cache:'no-store'});if(!r.ok)throw new Error(`GLB HTTP ${r.status}`);const buf=await r.arrayBuffer();if(buf.byteLength<20)throw new Error(`GLB 太小：${buf.byteLength} bytes`);setStatus(`GLB 已完整取得：${buf.byteLength.toLocaleString()} bytes，先做規格級結構檢查…`,'ok');const report=parseGLB(buf);if(report.problems.length)throw new Error('GLB 結構驗證失敗，先不交給 Three.js。第一個問題：\n'+report.problems[0]);setStatus('GLB 結構驗證通過，交給 GLTFLoader…','ok');const loader=new GLTFLoader();const gltf=await new Promise((resolve,reject)=>loader.parse(buf,BASE,resolve,reject));avatar=gltf.scene;scene.add(avatar);frameAvatar();collectMorphs();apply();$('loading').style.display='none';setStatus(`✅ 真正 GPU 3D 模型已顯示｜${morphs.length} 個 Morph Target`,'ok');$('info').innerHTML='<span class="badge">GLB</span><span class="badge">WebGL GPU</span><span class="badge">Direct ArrayBuffer</span><span class="badge">Native Morph</span><br>GLB 已先通過 Khronos glTF 2.0 buffer/accessor 結構檢查，再交給 GLTFLoader。';render()}catch(e){console.error(e);$('loading').textContent='3D 模型載入失敗';setStatus('❌ '+(e?.stack||e?.message||String(e)),'error');$('info').textContent='這次會先告訴我們究竟是哪個 GLB bufferView/accessor 出問題。正式暗星未修改。'}}
$('prev').onclick=()=>selectMorph(active-1);$('next').onclick=()=>selectMorph(active+1);$('reset').onclick=()=>setValue(0);$('power').oninput=e=>setValue(e.target.value);document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>setValue(b.dataset.v));document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{if(!morphs.length)return;tags[active]=b.dataset.tag;$('tags').innerHTML=Object.entries(tags).map(([i,t])=>`${+i+1}. ${morphs[i].label} → <b>${t}</b>`).join('<br>')||'尚未標記'});$('auto').onclick=()=>{if(autoTimer){autoTimer=null;$('auto').textContent='逐個測試';$('auto').className='primary';setValue(0);return}if(!morphs.length)return;autoTimer={elapsed:0};$('auto').textContent='停止測試';$('auto').className='stop';value=.75;apply()};boot();
</script></body></html>
