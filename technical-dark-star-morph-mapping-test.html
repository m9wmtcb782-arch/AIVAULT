<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Technical Dark Star｜Morph Target Inspector V20</title><style>body{margin:0;background:#050812;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;padding:16px}.box{max-width:1000px;margin:0 auto 12px;background:#0b1220;border:1px solid #31558f;border-radius:16px;padding:16px}pre{white-space:pre-wrap;word-break:break-word;line-height:1.45}.ok{color:#63e6be}.err{color:#ff6b81}.warn{color:#ffd166}button{margin:4px;padding:8px 10px;border:0;border-radius:8px;background:#31558f;color:#fff}</style></head><body><div class="box"><h2>Technical Dark Star｜Morph Target Inspector V20</h2><div id="status" class="warn">正在讀取目前 GLB…</div><pre id="info"></pre></div><div class="box"><h3>臉部 Morph 結構</h3><div id="list"></div></div><script>const MODEL='./assets/dark-star/technical-dark-star-avatar.glb';const S=document.getElementById('status'),I=document.getElementById('info'),L=document.getElementById('list');const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));(async()=>{try{const r=await fetch(MODEL,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const b=await r.arrayBuffer(),v=new DataView(b);if(v.getUint32(0,true)!==0x46546c67)throw Error('GLB Magic 錯誤');let p=12,j='';while(p+8<=b.byteLength){const len=v.getUint32(p,true),type=v.getUint32(p+4,true);p+=8;if(type===0x4e4f534a)j=new TextDecoder().decode(new Uint8Array(b,p,len));p+=len}const g=JSON.parse(j);I.textContent='HTTP status: '+r.status+'\nArrayBuffer bytes: '+b.byteLength+'\nGLB Version: '+v.getUint32(4,true)+'\nMeshes: '+(g.meshes?.length||0)+'\nNodes: '+(g.nodes?.length||0)+'\nSkins: '+(g.skins?.length||0)+'\nAnimations: '+(g.animations?.length||0)+'\nextensionsRequired: '+JSON.stringify(g.extensionsRequired||[])+'\n\n';let total=0;for(let mi=0;mi<(g.meshes||[]).length;mi++){const m=g.meshes[mi],ps=m.primitives||[];let has=false;for(let pi=0;pi<ps.length;pi++){const t=ps[pi].targets||[];if(!t.length)continue;has=true;total+=t.length;const title=document.createElement('div');title.innerHTML='<b>Mesh '+mi+(m.name?' — '+esc(m.name):'')+' / Primitive '+pi+' / Morph '+t.length+'</b>';L.appendChild(title);const pre=document.createElement('pre');pre.textContent=t.map((x,i)=>'Morph '+i+': '+Object.keys(x).join(', ')).join('\n');L.appendChild(pre);if(m.extras){const ex=document.createElement('pre');ex.textContent='mesh.extras = '+JSON.stringify(m.extras,null,2);L.appendChild(ex)}}if(has)I.textContent+='Mesh '+mi+(m.name?' '+m.name:'')+' has morph targets\n'}I.textContent+='\nTotal morph target entries: '+total+'\n';if(total){S.className='ok';S.textContent='✅ 已確認 GLB 內含 Morph Targets。現在可以開始逐組辨識眼睛、眉毛、嘴巴。'}else{S.className='warn';S.textContent='⚠️ JSON 中沒有 primitive.targets；需要改查 skin/animation/其他 face data。'}}catch(e){S.className='err';S.textContent='❌ '+e.message;I.textContent=e.stack||e}}</script></body></html>
