<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Technical Dark Star｜GLB Diagnostic</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050812;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
body{padding:16px;box-sizing:border-box}.box{max-width:900px;margin:auto;background:#0b1220;border:1px solid #31558f;border-radius:16px;padding:18px}.ok{color:#63e6be}.err{color:#ff6b81}.warn{color:#ffd166}pre{white-space:pre-wrap;word-break:break-word;line-height:1.55}button{border:0;border-radius:10px;padding:12px 16px;background:#31558f;color:#fff;font-size:16px}
</style>
</head>
<body>
<div class="box">
<h2>Technical Dark Star｜GLB Diagnostic V18</h2>
<div id="status" class="warn">正在直接讀取 GLB，不使用 model-viewer / Three.js。</div>
<pre id="log"></pre>
<button onclick="location.reload()">重新測試</button>
</div>
<script>
const MODEL='./assets/dark-star/technical-dark-star-avatar.glb';
const statusEl=document.getElementById('status');
const logEl=document.getElementById('log');
function log(x){logEl.textContent+=x+'\n'}
function ok(x){statusEl.className='ok';statusEl.textContent='✅ '+x}
function fail(x){statusEl.className='err';statusEl.textContent='❌ '+x;log(x)}
(async()=>{
 try{
  const r=await fetch(MODEL,{cache:'no-store'});
  log('HTTP status: '+r.status+' '+r.statusText);
  log('Content-Type: '+(r.headers.get('content-type')||'none'));
  log('Content-Length: '+(r.headers.get('content-length')||'none'));
  if(!r.ok) throw new Error('HTTP '+r.status);
  const b=await r.arrayBuffer();
  log('ArrayBuffer bytes: '+b.byteLength);
  if(b.byteLength<20) throw new Error('GLB 太短');
  const v=new DataView(b);
  const magic=v.getUint32(0,true);
  const version=v.getUint32(4,true);
  const total=v.getUint32(8,true);
  log('Magic: '+String.fromCharCode(103,108,84,70)+' / '+magic.toString(16));
  log('Version: '+version);
  log('Declared total length: '+total);
  if(magic!==0x46546c67) throw new Error('GLB Magic 不正確');
  if(version!==2) throw new Error('GLB version 不是 2');
  if(total!==b.byteLength) log('⚠️ declared length 與實際長度不同');
  let p=12, json=null, binCount=0;
  while(p+8<=b.byteLength){
   const len=v.getUint32(p,true),type=v.getUint32(p+4,true);p+=8;
   if(p+len>b.byteLength) throw new Error('Chunk 超出檔案範圍：offset '+p+' len '+len);
   if(type===0x4e4f534a){json=new TextDecoder().decode(new Uint8Array(b,p,len));log('JSON chunk: '+len+' bytes')}
   else if(type===0x004e4942){binCount++;log('BIN chunk #'+binCount+': '+len+' bytes')}
   else log('Other chunk type '+type.toString(16)+': '+len+' bytes');
   p+=len;
  }
  if(!json) throw new Error('找不到 JSON chunk');
  const gltf=JSON.parse(json);
  log('buffers: '+(gltf.buffers?.length||0));
  log('bufferViews: '+(gltf.bufferViews?.length||0));
  log('accessors: '+(gltf.accessors?.length||0));
  log('meshes: '+(gltf.meshes?.length||0));
  log('nodes: '+(gltf.nodes?.length||0));
  log('skins: '+(gltf.skins?.length||0));
  log('animations: '+(gltf.animations?.length||0));
  log('extensionsUsed: '+JSON.stringify(gltf.extensionsUsed||[]));
  log('extensionsRequired: '+JSON.stringify(gltf.extensionsRequired||[]));
  let meshopt=0;
  for(const [i,bv] of (gltf.bufferViews||[]).entries()) if(bv.extensions?.EXT_meshopt_compression){meshopt++;log('Meshopt bufferView '+i+': '+JSON.stringify(bv.extensions.EXT_meshopt_compression))}
  log('Meshopt bufferViews: '+meshopt);
  ok('GLB 本體可以直接讀取與解析；下一步只需要處理 Meshopt 解碼。');
 }catch(e){fail(e?.stack||e?.message||String(e))}
})();
</script>
</body>
</html>
