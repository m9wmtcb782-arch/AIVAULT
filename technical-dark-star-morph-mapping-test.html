<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Technical Dark Star｜GLB 多 Buffer 診斷</title><style>body{margin:0;background:#080d18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;padding:18px}h2{margin:0 0 8px}.box{background:#121a2b;border-radius:14px;padding:14px;margin:12px 0;white-space:pre-wrap;word-break:break-word}.ok{color:#62e6ae}.err{color:#ff788b}.warn{color:#ffd166}button{border:0;border-radius:10px;padding:12px 16px;background:#31558f;color:white;font-size:16px}</style></head><body><h2>Technical Dark Star｜GLB 多 Buffer 診斷</h2><div class="box">這一版不再把「buffer 1」誤判成錯誤。glTF 可以有多個 buffer；GLB 的 BIN chunk 只代表其中一個 buffer，其他 buffer 可以透過 URI 載入。</div><div id="status" class="box">讀取 GLB…</div><div id="buffers" class="box">—</div><div id="detail" class="box">—</div><button onclick="location.reload()">重新檢查</button><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';import{GLTFLoader}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';const MODEL='./assets/dark-star/technical-dark-star-avatar.glb',BASE='./assets/dark-star/';const $=x=>document.getElementById(x);function u32(d,o){return d.getUint32(o,true)}async function main(){try{const r=await fetch(MODEL,{cache:'no-store'});if(!r.ok)throw Error('GLB HTTP '+r.status);const buf=await r.arrayBuffer(),d=new DataView(buf);if(new TextDecoder().decode(new Uint8Array(buf,0,4))!=='glTF')throw Error('不是 GLB');let p=12,json=null,bin=null;while(p+8<=buf.byteLength){const n=u32(d,p),t=u32(d,p+4),s=p+8,e=s+n;if(e>buf.byteLength)throw Error('chunk 超界');if(t===0x4e4f534a)json=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,s,n)).trim());if(t===0x004e4942)bin={offset:s,length:n};p=e}if(!json)throw Error('沒有 JSON chunk');$('status').innerHTML='<span class="ok">GLB 讀取成功：'+buf.byteLength.toLocaleString()+' bytes</span><br>JSON：'+(bin?json.buffers?.length||0:0)+' buffers，BIN：'+(bin?.length||0).toLocaleString()+' bytes';const bs=json.buffers||[];let out=[];for(let i=0;i<bs.length;i++){const b=bs[i];if(i===0&&!b.uri){out.push('buffer[0]：使用 GLB BIN chunk，宣告 '+b.byteLength.toLocaleString()+' bytes');continue}if(!b.uri){out.push('buffer['+i+']：❌ 沒有 URI，也沒有對應 BIN chunk');continue}const url=new URL(b.uri,location.href).href;out.push('buffer['+i+'] URI：'+b.uri+'\n  解析網址：'+url+'\n  宣告大小：'+b.byteLength.toLocaleString());try{const x=await fetch(url,{method:'HEAD',cache:'no-store'});out[out.length-1]+='\n  HTTP：'+x.status+' '+(x.ok?'✅ 可取得':'❌ 無法取得')}catch(e){out[out.length-1]+='\n  HTTP：❌ '+e.message}}$('buffers').textContent=out.join('\n\n');$('detail').textContent='接下來直接交給 GLTFLoader。若 buffer[1] 的外部 URI 存在，GLTFLoader 會依 BASE 路徑載入；若不存在，這裡會直接顯示缺少的檔名，而不是再誤報 bufferView 超界。';$('status').innerHTML+='<br><span class="warn">正在測試 Three.js 多 Buffer 載入…</span>';const loader=new GLTFLoader();await new Promise((resolve,reject)=>loader.parse(buf,BASE,resolve,reject));$('status').innerHTML+='<br><span class="ok">✅ GLTFLoader 多 Buffer 載入成功。</span>';$('detail').textContent='下一步就是把真正的 GLB/GPU/Morph 渲染接回這個已確認可載入的路徑。'}catch(e){$('status').innerHTML='<span class="err">❌ '+(e.stack||e.message||e)+'</span>';console.error(e)}}main();</script></body></html>
