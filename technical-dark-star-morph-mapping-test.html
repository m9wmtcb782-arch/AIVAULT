<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Technical Dark Star｜Direct GLB Render V17</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050812;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;overflow:hidden}
#viewer{position:fixed;inset:0;width:100%;height:100%;background:radial-gradient(circle at 50% 35%,#18365d,#050812 70%)}
model-viewer{width:100%;height:100%;background:transparent;--poster-color:transparent}
#panel{position:fixed;top:12px;left:12px;right:12px;z-index:20;background:rgba(5,10,20,.95);border:2px solid #3b82f6;border-radius:16px;padding:15px;box-shadow:0 12px 40px #000b}
#title{font-size:21px;font-weight:900}#status{margin-top:8px;font-size:15px;line-height:1.6}.ok{color:#63e6be}.warn{color:#ffd166}.err{color:#ff6b81}
#bar{position:fixed;bottom:16px;left:16px;right:16px;z-index:20;display:flex;gap:8px;justify-content:center}button{border:0;border-radius:10px;padding:11px 15px;background:#31558f;color:white;font-size:15px}
</style>
<!-- Official model-viewer configuration: Meshopt is disabled by default. -->
<script>
self.ModelViewerElement=self.ModelViewerElement||{};
self.ModelViewerElement.meshoptDecoderLocation='https://cdn.jsdelivr.net/npm/meshoptimizer/meshopt_decoder.js';
</script>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
</head>
<body>
<div id="viewer">
<model-viewer id="mv" src="./assets/dark-star/technical-dark-star-avatar.glb" camera-controls auto-rotate rotation-per-second="3deg" exposure="1.1" shadow-intensity="1" loading="eager" reveal="auto"></model-viewer>
</div>
<div id="panel"><div id="title">Technical Dark Star｜Direct GLB Render V17</div><div id="status" class="warn">V17：使用官方 model-viewer Meshopt decoder URL。</div></div>
<div id="bar"><button id="reset">重置視角</button><button id="front">正面</button></div>
<script>
const mv=document.getElementById('mv'),status=document.getElementById('status');
window.addEventListener('error',e=>{if(e.message){status.className='err';status.textContent='❌ '+e.message}});
mv.addEventListener('load',()=>{status.className='ok';status.textContent='✅ Technical Dark Star GLB 已成功進入 3D 畫面。Meshopt 解碼成功。'});
mv.addEventListener('error',e=>{status.className='err';status.textContent='❌ GLB 載入失敗：'+JSON.stringify(e.detail||e)});
document.getElementById('reset').onclick=()=>{mv.cameraOrbit='0deg 75deg auto';mv.fieldOfView='auto'};
document.getElementById('front').onclick=()=>{mv.cameraOrbit='0deg 90deg auto';mv.fieldOfView='auto'};
</script>
</body></html>
