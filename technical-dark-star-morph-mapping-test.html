<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Technical Dark Star｜Morph Target Inspector</title><style>body{margin:0;background:#050812;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;padding:16px}main{max-width:900px;margin:auto}.box{background:#0b1220;border:1px solid #31558f;border-radius:16px;padding:16px;margin-bottom:12px}.ok{color:#63e6be}.err{color:#ff6b81}.warn{color:#ffd166}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}button{border:0;border-radius:9px;padding:10px;background:#31558f;color:#fff;text-align:left}pre{white-space:pre-wrap;word-break:break-word;line-height:1.5}</style></head><body><main><div class="box"><h2>Technical Dark Star｜Morph Target Inspector V19</h2><div id="status" class="warn">直接解析 GLB，尋找臉部 Morph Targets。</div><pre id="info"></pre></div><div class="box"><h3>Morph Targets</h3><div id="morphs" class="grid"></div></div></main><script>
const MODEL='./assets/dark-star/technical-dark-star-avatar.glb';const status=document.getElementById('status'),info=document.getElementById('info'),morphs=document.getElementById('morphs');
function log(s){info.textContent+=s+'\n'}
(async()=>{try{const r=await fetch(MODEL,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const b=await r.arrayBuffer();const v=new DataView(b);if(v.getUint32(0,true)!==0x46546c67)throw Error('GLB Magic 錯誤');let p=12,json='';while(p+8<=b.byteLength){const len=v.getUint32(p,true),type=v.getUint32(p+4,true);p+=8;if(type===0x4e4f534a)json=new TextDecoder().decode(new Uint8Array(b,p,len));p+=len}const g=JSON.parse(json);log('GLB bytes: '+b.byteLength);log('Meshes: '+(g.meshes?.length||0));log('Nodes: '+(g.nodes?.length||0));log('Skins: '+(g.skins?.length||0));let total=0;for(let mi=0;mi<(g.meshes||[]).length;mi++){const m=g.meshes[mi];for(let pi=0;pi<(m.primitives||[]).length;pi++){const t=m.primitives[pi].targets||[];if(t.length){log('Mesh '+mi+' primitive '+pi+' morph count: '+t.length);total+=t.length;const names=m.extras?.targetNames||m.targetNames||[];t.forEach((x,i)=>{const n=names[i]||('Mesh '+mi+' / Morph '+i);const btn=document.createElement('button');btn.textContent=n;btn.onclick=()=>alert('Morph target index: '+i+'\nAttributes: '+Object.keys(x).join(', '));morphs.appendChild(btn)})}}}log('Morph target groups: '+total);if(total) {status.className='ok';status.textContent='✅ 已找到 Morph Targets，可以進入臉部控制映射。'} else {status.className='warn';status.textContent='⚠️ 沒找到 Morph Targets。'} }catch(e){status.className='err';status.textContent='❌ '+(e.stack||e.message||e);}})();</script></body></html>
