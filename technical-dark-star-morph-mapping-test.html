<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Technical Dark Star｜Morph GPU V12</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#08111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;overflow:auto}
#app{position:fixed;inset:0;z-index:0}
#fallback{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;background:#08111f;color:#fff;font-size:34px;font-weight:800}
#panel{position:fixed;left:12px;right:12px;top:12px;z-index:10;background:rgba(5,10,20,.96);border:2px solid #3b82f6;border-radius:16px;padding:16px;box-shadow:0 12px 40px #000b}
#title{font-size:21px;font-weight:900;margin-bottom:10px}
#build{font-size:13px;color:#8fb8ff;margin-bottom:10px}
#status{font-size:16px;line-height:1.7;white-space:pre-wrap;word-break:break-word;max-height:45vh;overflow:auto}
.ok{color:#63e6be}.err{color:#ff6b81}.warn{color:#ffd166}
#cube{margin-top:12px;font-size:14px;color:#b9c7e5}
#face{position:fixed;left:12px;right:12px;bottom:12px;z-index:11;max-height:32vh;overflow:auto;background:rgba(5,10,20,.94);border:1px solid #334155;border-radius:14px;padding:10px;display:none}
.row{display:flex;align-items:center;gap:8px;margin:5px 0}.row span{width:100px;font-size:11px;overflow:hidden;white-space:nowrap}.row input{flex:1}.value{width:42px;text-align:right;font-size:12px;color:#b9c7e5}
</style>
</head>
<body>
<div id="fallback">DARK STAR MORPH V12</div>
<div id="app"></div>
<div id="panel">
  <div id="title">Technical Dark Star｜原生 GLB + Meshopt + Morph GPU</div>
  <div id="build">BUILD V12｜此頁只測試暗星頭像，不修改正式暗星</div>
  <div id="status">A. HTML 已載入，等待 JavaScript…</div>
  <div id="cube">GPU 測試：等待 WebGLRenderer</div>
</div>
<div id="face"></div>
<script>
const S=document.getElementById('status');
const F=document.getElementById('fallback');
const C=document.getElementById('cube');
function log(t,c){S.innerHTML+='<div class="'+(c||'')+'">'+String(t).replace(/</g,'&lt;')+'</div>';}
function fail(e){log('❌ '+(e&&e.stack?e.stack:(e&&e.message?e.message:e)),'err');}
F.style.display='none';
log('B. JavaScript 已執行','ok');
(async()=>{
 try{
  log('C. 開始載入 Three.js…','warn');
  const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
  log('C. Three.js 載入成功｜REV '+(THREE.REVISION||'?'),'ok');
  log('D. 開始載入 GLTFLoader…','warn');
  const GLTF=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js');
  log('D. GLTFLoader 載入成功','ok');
  log('E. 開始載入 MeshoptDecoder…','warn');
  const M=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/meshopt_decoder.module.js');
  log('E. MeshoptDecoder 載入成功','ok');
  log('F. 建立 WebGLRenderer…','warn');
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.setClearColor(0x08111f,1);
  document.getElementById('app').appendChild(renderer.domElement);
  C.textContent='GPU 測試：WebGLRenderer 已建立，開始繪製固定測試立方體。';
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,100);
  camera.position.set(0,0,4);
  const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(2,3,4);scene.add(light);scene.add(new THREE.AmbientLight(0xffffff,1.5));
  const cube=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.5,1.5),new THREE.MeshStandardMaterial({color:0x28a9ff,roughness:.35,metalness:.15}));scene.add(cube);
  let root=null;
  function frame(){cube.rotation.x+=.008;cube.rotation.y+=.012;if(root)root.rotation.y=Math.sin(performance.now()/7000)*.04;renderer.render(scene,camera);requestAnimationFrame(frame)}
  frame();
  log('F. WebGLRenderer 建立成功｜如果看到藍色立方體，代表 GPU/Three.js 正常','ok');
  const MODEL='./assets/dark-star/technical-dark-star-avatar.glb';
  log('G. Fetch GLB：'+MODEL,'warn');
  const r=await fetch(MODEL,{cache:'no-store'});
  log('G. GLB HTTP '+r.status+'｜'+(r.headers.get('content-type')||'unknown'),'ok');
  if(!r.ok)throw new Error('GLB HTTP '+r.status);
  const buf=await r.arrayBuffer();
  const dv=new DataView(buf);const magic=String.fromCharCode(dv.getUint8(0),dv.getUint8(1),dv.getUint8(2),dv.getUint8(3));const ver=dv.getUint32(4,true);const total=dv.getUint32(8,true);
  log('H. GLB '+magic+'｜version='+ver+'｜bytes='+buf.byteLength.toLocaleString()+'｜declared='+total.toLocaleString(),'ok');
  if(magic!=='glTF'||ver!==2)throw new Error('GLB header invalid');
  log('I. 建立 GLTFLoader + Meshopt Decoder','warn');
  const loader=new GLTF.GLTFLoader();loader.setMeshoptDecoder(M.MeshoptDecoder);
  log('I. Meshopt Decoder 已註冊','ok');
  log('J. loader.parse(ArrayBuffer) 開始…','warn');
  const gltf=await loader.parseAsync(buf,'./assets/dark-star/');
  root=gltf.scene;scene.remove(cube);scene.add(root);
  const box=new THREE.Box3().setFromObject(root);const center=box.getCenter(new THREE.Vector3());const size=box.getSize(new THREE.Vector3());
  root.position.sub(center);const max=Math.max(size.x,size.y,size.z)||1;camera.position.set(0,max*.08,max*2.4);camera.lookAt(0,0,0);
  let meshCount=0,morphCount=0;const morphs=[];
  root.traverse(o=>{if(o.isMesh){meshCount++;if(o.morphTargetInfluences&&o.morphTargetDictionary){for(const [name,index] of Object.entries(o.morphTargetDictionary)){morphs.push({mesh:o,name,index})}}}});
  log('K. ✅ GLB 解析成功｜Mesh='+meshCount+'｜Morph Targets='+morphs.length+'｜Animations='+(gltf.animations?.length||0),'ok');
  C.textContent='GPU 測試：固定立方體已成功繪製；現在已切換成暗星 GLB。';
  const face=document.getElementById('face');face.style.display=morphs.length?'block':'none';
  morphs.slice(0,96).forEach((x,i)=>{const row=document.createElement('div');row.className='row';const label=document.createElement('span');label.textContent=(i+1)+'. '+x.name;const input=document.createElement('input');input.type='range';input.min=0;input.max=1;input.step=.01;input.value=0;const value=document.createElement('div');value.className='value';value.textContent='0.00';input.oninput=()=>{for(const y of morphs)y.mesh.morphTargetInfluences[y.index]=0;x.mesh.morphTargetInfluences[x.index]=Number(input.value);value.textContent=Number(input.value).toFixed(2)};row.append(label,input,value);face.append(row)});
  if(morphs.length){morphs[0].mesh.morphTargetInfluences[morphs[0].index]=.5;log('L. 第一個 Morph 已設為 0.5，可在底部滑桿直接測試','ok')}
  log('完成：現在不是空白頁，畫面應該有暗星模型。','ok');
 }catch(e){fail(e)}
})().catch(fail);
addEventListener('resize',()=>{const c=document.querySelector('canvas');if(c){c.style.width='100%';c.style.height='100%'}});
</script>
</body>
</html>
