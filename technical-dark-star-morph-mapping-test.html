<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Technical Dark Star｜Face Control Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#050812;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:1100px;margin:auto;padding:12px}.stage{height:58vh;min-height:360px;background:#090d16;border:1px solid #29466f;border-radius:18px;overflow:hidden;position:relative}canvas{width:100%;height:100%;display:block}.status{position:absolute;left:12px;top:12px;padding:8px 12px;border-radius:10px;background:#07101dcc;border:1px solid #31558f;font-size:13px}.panel{margin-top:12px;background:#0b1220;border:1px solid #29466f;border-radius:18px;padding:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.group{margin-top:12px;padding-top:12px;border-top:1px solid #20334f}.group h3{margin:0 0 8px;font-size:16px}.btn{border:0;border-radius:10px;padding:10px 13px;background:#31558f;color:white;font-size:14px}.btn:active{transform:scale(.98)}label{display:block;margin:8px 0;font-size:13px}input[type=range]{width:100%}.small{font-size:12px;color:#9fb1cb}.ok{color:#63e6be}.err{color:#ff6b81}.warn{color:#ffd166}.bones{max-height:180px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:11px;line-height:1.45;color:#a9c1df}</style></head><body><main><div class="stage"><canvas id="c"></canvas><div id="status" class="status warn">正在載入暗星 3D…</div></div><div class="panel"><b>Technical Dark Star｜Face Control V23</b><div class="small" style="margin-top:6px">以 GLB 實際 Skeleton 關節鏈求解自然站立，不再猜固定旋轉軸。</div><div class="group"><h3>身體姿勢</h3><div class="row"><button class="btn" onclick="applyNaturalPose()">自然站立</button><button class="btn" onclick="resetPose()">原始姿勢</button><button class="btn" onclick="toggleIdle()" id="idleBtn">停止自然待機</button></div><div id="poseInfo" class="small" style="margin-top:8px">正在分析實際骨骼鏈…</div><div id="chains" class="bones" style="margin-top:8px"></div></div><div class="group"><h3>嘴巴</h3><div class="row"><button class="btn" onclick="setM('h_expressions.MouthOpen_h',.8)">張嘴</button><button class="btn" onclick="setM('h_expressions.Shout_h',.8)">大喊</button><button class="btn" onclick="setM('h_expressions.Kiss_h',.8)">嘟嘴</button><button class="btn" onclick="setM('h_expressions.RsmileOpen_h',.7);setM('h_expressions.LsmileOpen_h',.7)">微笑</button><button class="btn" onclick="clearFace()">還原</button></div><label>MouthOpen <input id="mouth" type="range" min="0" max="1" step=".01" value="0" oninput="setM('h_expressions.MouthOpen_h',+this.value)"></label></div><div class="group"><h3>眼睛</h3><div class="row"><button class="btn" onclick="blink('L')">左眼眨</button><button class="btn" onclick="blink('R')">右眼眨</button><button class="btn" onclick="blink('B')">雙眼眨</button><button class="btn" onclick="setM('h_expressions.Lsquint_h',.7);setM('h_expressions.Rsquint_h',.7)">瞇眼</button><button class="btn" onclick="setM('h_expressions.LeyeOpen_h',.8);setM('h_expressions.ReyeOpen_h',.8)">睜大</button></div></div><div class="group"><h3>眉毛</h3><div class="row"><button class="btn" onclick="setM('h_expressions.LbrowUp_h',.7);setM('h_expressions.RbrowUp_h',.7)">挑眉</button><button class="btn" onclick="setM('h_expressions.LbrowDown_h',.7);setM('h_expressions.RbrowDown_h',.7)">壓眉</button><button class="btn" onclick="setM('h_expressions.LLbrowUp_h',.7);setM('h_expressions.RRbrowUp_h',.7)">外側挑眉</button><button class="btn" onclick="clearFace()">還原表情</button></div></div><div class="group"><h3>自動眨眼</h3><div class="row"><button id="auto" class="btn" onclick="toggleBlink()">啟用自然眨眼</button><span id="autoText" class="small">目前關閉</span></div></div><div class="group"><h3>Morph Targets</h3><div id="found" class="small"></div></div></div></main><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
const MODEL='./assets/dark-star/technical-dark-star-avatar.glb';let scene,camera,renderer,controls,avatar,meshes=[],weights=new Map(),blinkTimer=null,blinking=false,original=[],arms={L:[],R:[]},idle=true,idleClock=new THREE.Clock();const status=document.getElementById('status'),found=document.getElementById('found'),poseInfo=document.getElementById('poseInfo'),chains=document.getElementById('chains');function msg(t,c='warn'){status.textContent=t;status.className='status '+c}function collect(o){o.traverse(x=>{if(x.isMesh&&x.morphTargetDictionary&&x.morphTargetInfluences){meshes.push(x);Object.entries(x.morphTargetDictionary).forEach(([n,i])=>{if(!weights.has(n))weights.set(n,[]);weights.get(n).push({mesh:x,index:i})})}})}function setM(n,v){const a=weights.get(n);if(!a)return;a.forEach(x=>x.mesh.morphTargetInfluences[x.index]=THREE.MathUtils.clamp(v,0,1))}window.setM=setM;window.clearFace=()=>{meshes.forEach(m=>m.morphTargetInfluences.fill(0));document.getElementById('mouth').value=0};window.blink=async side=>{const ns=side==='L'?['h_expressions.LeyeClose_h']:side==='R'?['h_expressions.ReyeClose_h']:['h_expressions.LeyeClose_h','h_expressions.ReyeClose_h'];ns.forEach(n=>setM(n,1));await new Promise(r=>setTimeout(r,130));ns.forEach(n=>setM(n,0))};window.toggleBlink=()=>{blinking=!blinking;document.getElementById('autoText').textContent=blinking?'目前開啟':'目前關閉';document.getElementById('auto').textContent=blinking?'停止自然眨眼':'啟用自然眨眼';if(blinking)scheduleBlink();else clearTimeout(blinkTimer)};function scheduleBlink(){if(!blinking)return;blinkTimer=setTimeout(async()=>{await window.blink('B');scheduleBlink()},2800+Math.random()*3200)}function savePose(){original=[];avatar.traverse(o=>{if(o.isBone)original.push({b:o,q:o.quaternion.clone(),p:o.position.clone()})})}function resetPose(){original.forEach(x=>{x.b.quaternion.copy(x.q);x.b.position.copy(x.p)});poseInfo.textContent='已恢復 GLB 原始綁定姿勢。'}window.resetPose=resetPose;
function boneWorld(b){return b.getWorldPosition(new THREE.Vector3())}function descendants(b,depth=0,max=7){let out=[];if(!b||depth>=max)return out;for(const c of b.children){if(c.isBone){out.push(c,...descendants(c,depth+1,max))}}return out}function chainFrom(b){const out=[b];let cur=b;for(let i=0;i<5;i++){const kids=cur.children.filter(x=>x.isBone);if(!kids.length)break;let best=kids.sort((a,c)=>boneWorld(c).distanceTo(boneWorld(cur))-boneWorld(a).distanceTo(boneWorld(cur))).pop();out.push(best);cur=best}return out}
function discoverArms(){const bones=[];avatar.traverse(o=>{if(o.isBone)bones.push(o)});const pts=bones.map(b=>({b,p:boneWorld(b)}));const ys=pts.map(x=>x.p.y).sort((a,b)=>a-b);const yTop=ys[Math.floor(ys.length*.78)]??0;const candidates=pts.filter(x=>x.p.y>yTop*.55);const left=candidates.filter(x=>x.p.x<-.08).sort((a,b)=>Math.abs(b.p.x)-Math.abs(a.p.x));const right=candidates.filter(x=>x.p.x>.08).sort((a,b)=>Math.abs(b.p.x)-Math.abs(a.p.x));function choose(arr){for(const x of arr){const ch=chainFrom(x.b);if(ch.length>=3){const p0=x.p,p1=boneWorld(ch[1]);if(Math.abs(p1.x-p0.x)>.03)return ch}}return arr.length?chainFrom(arr[0].b):[]}arms.L=choose(left);arms.R=choose(right);chains.textContent='左臂鏈：'+arms.L.map(x=>x.name).join(' → ')+'\n右臂鏈：'+arms.R.map(x=>x.name).join(' → ')}
function aimSegment(bone,desiredDir){const child=bone.children.find(x=>x.isBone);if(!bone||!child)return;avatar.updateMatrixWorld(true);const p0=boneWorld(bone),p1=boneWorld(child),cur=p1.sub(p0).normalize(),target=desiredDir.clone().normalize();const q=new THREE.Quaternion().setFromUnitVectors(cur,target);const w=new THREE.Quaternion();bone.getWorldQuaternion(w);const desired=q.multiply(w);const parent=bone.parent;if(parent&&parent.isBone){const pw=new THREE.Quaternion();parent.getWorldQuaternion(pw);bone.quaternion.copy(pw.invert().multiply(desired))}else bone.quaternion.copy(desired);avatar.updateMatrixWorld(true)}
function applyNaturalPose(){resetPose();discoverArms();if(arms.L.length<3||arms.R.length<3){poseInfo.textContent='未能可靠辨識左右手臂骨骼鏈；已保留原始姿勢，避免亂轉。';return}const downL=new THREE.Vector3(-.18,-.96,.20),downR=new THREE.Vector3(.18,-.96,.20),foreL=new THREE.Vector3(-.12,-.94,.34),foreR=new THREE.Vector3(.12,-.94,.34);aimSegment(arms.L[0],downL);aimSegment(arms.R[0],downR);aimSegment(arms.L[1],foreL);aimSegment(arms.R[1],foreR);poseInfo.textContent='已依實際 Skeleton 左右手臂鏈求解：上臂向下、前臂微前彎、手腕保持中立。';}window.applyNaturalPose=applyNaturalPose;window.toggleIdle=()=>{idle=!idle;document.getElementById('idleBtn').textContent=idle?'停止自然待機':'啟用自然待機';poseInfo.textContent=idle?'自然待機開啟。':'自然待機停止。'};
function applyIdle(t){if(!idle)return;const s=Math.sin(t*1.1),c=Math.cos(t*.7);for(const b of [arms.L[0],arms.R[0]])if(b)b.rotation.z+=(b===arms.L[0]?-1:1)*s*.002;for(const b of [arms.L[1],arms.R[1]])if(b)b.rotation.x+=(b===arms.L[1]?1:-1)*c*.003}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x090d16);camera=new THREE.PerspectiveCamera(35,1,.01,100);renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;scene.add(new THREE.HemisphereLight(0xffffff,0x334455,2));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(2,3,4);scene.add(key);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;resize();addEventListener('resize',resize);load()}function resize(){const e=document.querySelector('.stage'),w=e.clientWidth,h=e.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}async function load(){try{const r=await fetch(MODEL,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const buf=await r.arrayBuffer();const loader=new GLTFLoader();loader.setMeshoptDecoder(MeshoptDecoder);const gltf=await loader.parseAsync(buf,new URL('./assets/dark-star/',location.href).href);avatar=gltf.scene;scene.add(avatar);collect(avatar);const box=new THREE.Box3().setFromObject(avatar),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());avatar.position.sub(center);camera.position.set(0,size.y*.18,size.y*1.65);controls.target.set(0,0,0);controls.update();savePose();discoverArms();applyNaturalPose();msg('✅ V23：實際 Skeleton 手臂鏈已分析','ok');found.textContent=[...weights.keys()].join('　')}catch(e){console.error(e);msg('❌ 載入/解碼失敗：'+(e.message||e),'err')}}function animate(){requestAnimationFrame(animate);applyIdle(idleClock.getElapsedTime());controls?.update();renderer?.render(scene,camera)}init();animate();</script></body></html>
