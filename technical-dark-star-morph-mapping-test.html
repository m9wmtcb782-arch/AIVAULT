<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Technical Dark Star｜GLB 多 Buffer 診斷</title>
<style>
body{margin:0;background:#080d18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;padding:18px}
h2{margin:0 0 8px}.box{background:#121a2b;border-radius:14px;padding:14px;margin:12px 0;white-space:pre-wrap;word-break:break-word;line-height:1.65}.ok{color:#62e6ae}.err{color:#ff788b}.warn{color:#ffd166}.muted{color:#aab4cc}button{border:0;border-radius:10px;padding:12px 16px;background:#31558f;color:white;font-size:16px}
</style>
</head>
<body>
<h2>Technical Dark Star｜GLB 多 Buffer 診斷</h2>
<div class="box muted">這一版完全不載入 Three.js，也不依賴 CDN。先直接讀取 GLB，確認每一個 buffer 的來源與實際檔案。正式暗星未修改。</div>
<div id="status" class="box">正在啟動原生 GLB 讀取…</div>
<div id="buffers" class="box">等待 GLB…</div>
<div id="detail" class="box">等待結構分析…</div>
<button onclick="location.reload()">重新檢查</button>
<script>
const MODEL='./assets/dark-star/technical-dark-star-avatar.glb';
const $=id=>document.getElementById(id);
function u32(d,o){return d.getUint32(o,true)}
function text(buf,start,len){return new TextDecoder().decode(new Uint8Array(buf,start,len))}
async function checkUrl(url){
  try{
    const r=await fetch(url,{cache:'no-store'});
    const b=await r.arrayBuffer();
    return {ok:r.ok,status:r.status,size:b.byteLength};
  }catch(e){return {ok:false,status:'FETCH_ERROR',size:0,error:e.message}}
}
async function main(){
 try{
   $('status').innerHTML='<span class="warn">① 正在取得 GLB…</span>';
   const r=await fetch(MODEL,{cache:'no-store'});
   if(!r.ok)throw Error('GLB HTTP '+r.status);
   const buf=await r.arrayBuffer();
   $('status').innerHTML='<span class="ok">① GLB 取得成功：'+buf.byteLength.toLocaleString()+' bytes</span>';
   if(buf.byteLength<20)throw Error('GLB 太小');
   const d=new DataView(buf);
   const magic=text(buf,0,4),version=u32(d,4),total=u32(d,8);
   if(magic!=='glTF')throw Error('Magic 錯誤：'+magic);
   if(version!==2)throw Error('GLB Version='+version);
   let p=12,json=null,binChunks=[];
   while(p+8<=Math.min(total,buf.byteLength)){
     const n=u32(d,p),t=u32(d,p+4),s=p+8,e=s+n;
     if(e>buf.byteLength)throw Error(`chunk 超界：offset=${p} length=${n} end=${e}`);
     if(t===0x4e4f534a)json=JSON.parse(text(buf,s,n).trim());
     if(t===0x004e4942)binChunks.push({offset:s,length:n});
     p=e;
   }
   if(!json)throw Error('沒有 JSON chunk');
   $('status').innerHTML+='<br><span class="ok">② GLB 結構讀取成功：Version 2｜BIN chunks='+binChunks.length+'</span>';
   const bs=json.buffers||[];
   const bvs=json.bufferViews||[];
   const acs=json.accessors||[];
   let out=[];
   out.push(`buffers=${bs.length}｜bufferViews=${bvs.length}｜accessors=${acs.length}`);
   for(let i=0;i<bs.length;i++){
     const b=bs[i]||{};
     if(i===0 && !b.uri){
       const bin=binChunks[0];
       out.push(`buffer[${i}]：GLB BIN\n  宣告=${(b.byteLength||0).toLocaleString()} bytes\n  實際 BIN=${(bin?.length||0).toLocaleString()} bytes`);
     }else if(b.uri){
       const url=new URL(b.uri,location.href).href;
       out.push(`buffer[${i}]：外部 URI\n  URI=${b.uri}\n  URL=${url}\n  宣告=${(b.byteLength||0).toLocaleString()} bytes`);
       const x=await checkUrl(url);
       out[out.length-1]+=x.ok?`\n  HTTP=${x.status} ✅\n  實際=${x.size.toLocaleString()} bytes`:`\n  HTTP=${x.status} ❌ ${x.error||''}`;
     }else{
       out.push(`buffer[${i}]：❌ 沒有 URI，而且不是 GLB BIN buffer`);
     }
   }
   $('buffers').textContent=out.join('\n\n');
   const problems=[];
   for(let i=0;i<bvs.length;i++){
     const b=bvs[i]||{};
     if(b.buffer>=bs.length)problems.push(`bufferView[${i}] 指向不存在的 buffer ${b.buffer}`);
     if(b.buffer===0&&!b.uri){
       const bin=binChunks[0];
       const start=b.byteOffset||0,end=start+(b.byteLength||0);
       if(bin && end>bin.length)problems.push(`bufferView[${i}] 超出 BIN：end=${end} BIN=${bin.length}`);
     }
   }
   $('detail').innerHTML='<span class="ok">③ 結構分析完成</span>\n'+(problems.length?'<span class="err">❌ '+problems.length+' 個 bufferView 問題\n'+problems.join('\n')+'</span>':'<span class="ok">沒有發現 bufferView 指向不存在 buffer 的問題。</span>')+'\n\n<span class="warn">下一步：根據上面的 buffer[1] URI 判斷真正缺少的是哪個外部資源。</span>';
 }catch(e){
   $('status').innerHTML='<span class="err">❌ '+(e.stack||e.message||String(e))+'</span>';
   $('buffers').textContent='';
   $('detail').textContent='原生 GLB 讀取失敗。';
   console.error(e);
 }
}
main();
</script>
</body>
</html>
