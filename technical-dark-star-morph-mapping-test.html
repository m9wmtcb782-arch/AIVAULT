<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Technical Dark Star｜Morph Target Mapping Test</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#0b1020;color:#fff}header{padding:18px}main{padding:0 16px 30px}canvas{width:100%;height:55vh;display:block;background:#111827;border-radius:16px}button,input{font:inherit}button{padding:10px 14px;border:0;border-radius:10px;margin:4px;background:#24304a;color:#fff}button:active{transform:scale(.98)}.row{display:flex;flex-wrap:wrap;align-items:center;margin:10px 0}.card{background:#141b2e;border-radius:16px;padding:14px;margin:12px 0}.big{font-size:22px;font-weight:700}.muted{color:#aab4cc}.bar{width:100%}input[type=range]{width:100%}.ok{color:#55e6a5}.warn{color:#ffd166}</style></head><body><header><div class="big">Technical Dark Star｜原生 Morph Target 實測</div><div class="muted">只測 AIVAULT 自有 GLB，不修改正式暗星頁面</div></header><main><canvas id="c"></canvas><div class="card"><div id="status">① 正在初始化…</div><div id="info" class="muted">等待模型解析</div></div><div class="card"><div class="row"><button id="prev">◀ 上一個</button><button id="next">下一個 ▶</button><button id="reset">重置</button><button id="auto">自動逐個測試</button></div><div class="big" id="name">Morph Target</div><div class="muted" id="idx">—</div><input id="power" type="range" min="0" max="1" step="0.01" value="0"><div class="row"><button data-v="0">0</button><button data-v="0.25">0.25</button><button data-v="0.5">0.5</button><button data-v="0.75">0.75</button><button data-v="1">1</button></div></div><div class="card"><div class="big">標記</div><div class="row"><button data-tag="left-eye">左眼</button><button data-tag="right-eye">右眼</button><button data-tag="mouth">嘴巴</button><button data-tag="brow">眉毛</button><button data-tag="smile">笑</button><button data-tag="frown">皺眉</button><button data-tag="other">其他</button></div><div id="tags" class="muted">尚未標記</div></div></main><script>const MODEL='./assets/dark-star/technical-dark-star-avatar.glb';let canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),morphs=[],active=0,tags={},value=0,autoTimer=null;const $=id=>document.getElementById(id);function status(t,c=''){ $('status').textContent=t;$('status').className=c}function draw(){let dpr=devicePixelRatio||1,w=canvas.clientWidth*dpr,h=canvas.clientHeight*dpr;if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}ctx.clearRect(0,0,w,h);ctx.fillStyle='#0f172a';ctx.fillRect(0,0,w,h);ctx.fillStyle='#64748b';ctx.font=`${22*dpr}px sans-serif`;ctx.textAlign='center';ctx.fillText('Morph Mapping 控制台',w/2,70*dpr);ctx.font=`${16*dpr}px sans-serif`;ctx.fillText(morphs.length?morphs[active].name:'等待模型',w/2,110*dpr);ctx.fillText(`強度 ${value.toFixed(2)}`,w/2,140*dpr);requestAnimationFrame(draw)}function parseGLB(buf){let dv=new DataView(buf);if(dv.getUint32(0,true)!==0x46546c67)throw Error('不是 GLB');let jsonLen=dv.getUint32(12,true),jsonStart=20,json=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,jsonStart,jsonLen)));let meshNames=[];(json.meshes||[]).forEach((mesh,mi)=>{let weights=mesh.weights||[];(mesh.primitives||[]).forEach((p,pi)=>{if(p.targets){let n=(p.targets.length);for(let i=0;i<n;i++)morphs.push({name:`${mesh.name||'Mesh '+mi} / Morph ${i}`,mesh:mi,primitive:pi,index:i})}})});return json}async function boot(){try{status('② 讀取 AIVAULT GLB…');let r=await fetch(MODEL,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let b=await r.arrayBuffer();let json=parseGLB(b);status('③ ✅ GLB 解析成功，找到 '+morphs.length+' 組 Morph Target','ok');$('info').textContent=`Nodes ${json.nodes?.length||0}｜Meshes ${json.meshes?.length||0}｜Skins ${json.skins?.length||0}｜Morph Groups ${morphs.length}`;update()}catch(e){status('❌ '+e.message,'warn')}}function update(){if(!morphs.length)return;active=Math.max(0,Math.min(morphs.length-1,active));$('name').textContent=morphs[active].name;$('idx').textContent=`${active+1} / ${morphs.length}`;$('power').value=value}function setValue(v){value=Number(v);update()}function setActive(i){active=(i+morphs.length)%morphs.length;value=0;update()}document.getElementById('prev').onclick=()=>setActive(active-1);document.getElementById('next').onclick=()=>setActive(active+1);document.getElementById('reset').onclick=()=>setValue(0);document.getElementById('power').oninput=e=>setValue(e.target.value);document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>setValue(b.dataset.v));document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{tags[active]=b.dataset.tag;$('tags').textContent=Object.entries(tags).map(([i,t])=>`${Number(i)+1}: ${morphs[i]?.name} → ${t}`).join('\n')||'尚未標記'});$('auto').onclick=()=>{if(autoTimer){clearInterval(autoTimer);autoTimer=null;$('auto').textContent='自動逐個測試';return}if(!morphs.length)return;$('auto').textContent='停止自動測試';active=0;autoTimer=setInterval(()=>{value=0.7;setActive(active+1);value=.7},900)};draw();boot();</script></body></html>
