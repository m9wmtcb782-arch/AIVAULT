<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Technical Dark Star｜原生臉部 Morph 實測</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#080d18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}header{padding:16px 18px 8px}.title{font-size:21px;font-weight:800}.sub{margin-top:5px;color:#9eabc2;font-size:14px}main{padding:0 14px 28px;max-width:900px;margin:auto}.stage{position:relative;height:58vh;min-height:360px;border-radius:18px;overflow:hidden;background:#111827;box-shadow:0 12px 40px rgba(0,0,0,.35)}canvas{width:100%;height:100%;display:block}.loading{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#aab4cc;background:linear-gradient(180deg,rgba(8,13,24,.15),rgba(8,13,24,.55));pointer-events:none}.panel{background:#121a2b;border-radius:16px;padding:14px;margin-top:12px}.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.row button{flex:1 1 auto}button{font:inherit;border:0;border-radius:10px;padding:10px 12px;background:#26334d;color:#fff}button:active{transform:scale(.98)}button.primary{background:#31558f}button.stop{background:#633c48}.name{font-size:18px;font-weight:800;margin-bottom:3px}.muted{color:#9eabc2;font-size:13px;line-height:1.55}.range{width:100%;margin:12px 0}input[type=range]{width:100%}.tag{margin-top:10px}.tag button{padding:8px 10px}.ok{color:#62e6ae}.warn{color:#ffd166}.error{color:#ff788b;white-space:pre-wrap}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#1e293b;color:#b9c7dd;font-size:12px;margin-right:5px}
</style>
</head>
<body>
<header><div class="title">Technical Dark Star｜原生臉部 Morph 實測</div><div class="sub">直接 GPU 顯示 AIVAULT 自有真人 GLB；這一頁只做臉部控制測試，不修改正式暗星頁面。</div></header>
<main>
<section class="stage"><canvas id="view"></canvas><div id="loading" class="loading">正在載入暗星 3D 模型…</div></section>
<div class="panel"><div id="status">初始化 3D 引擎…</div><div id="info" class="muted">等待 GLB</div></div>
<div class="panel">
<div class="row"><button id="prev">◀ 上一個</button><button id="next">下一個 ▶</button><button id="reset">重置</button><button id="auto" class="primary">逐個測試</button></div>
<div style="margin-top:12px" class="name" id="name">等待模型</div><div class="muted" id="idx">—</div>
<input id="power" class="range" type="range" min="0" max="1" step="0.01" value="0">
<div class="row"><button data-v="0">0</button><button data-v="0.25">25%</button><button data-v="0.5">50%</button><button data-v="0.75">75%</button><button data-v="1">100%</button></div>
</div>
<div class="panel"><div class="name">臉部標記</div><div class="muted">選目前 Morph 實際控制的部位，之後會整理成暗星正式 Face Controller。</div><div class="row tag"><button data-tag="left-eye">左眼</button><button data-tag="right-eye">右眼</button><button data-tag="mouth">嘴巴</button><button data-tag="brow">眉毛</button><button data-tag="smile">笑</button><button data-tag="frown">皺眉</button><button data-tag="other">其他</button></div><div id="tags" class="muted" style="margin-top:10px">尚未標記</div></div>
</main>
<script type="module">
import * as THREE from './vendor/three/three.module.js';
import { GLTFLoader } from './vendor/three/examples/jsm/loaders/GLTFLoader.js';

const MODEL='./assets/dark-star/technical-dark-star-avatar.glb';
const $=id=>document.getElementById(id);
let scene,camera,renderer,avatar,clock;
let morphs=[],active=0,value=0,tags={},autoTimer=null;
let controls={theta:0,phi:0,distance:2.4};

function setStatus(text,cls=''){ $('status').textContent=text; $('status').className=cls; }

function resize(){
  if(!renderer||!camera)return;
  const box=$('view').getBoundingClientRect();
  renderer.setSize(Math.max(1,box.width),Math.max(1,box.height),false);
  camera.aspect=box.width/box.height;
  camera.updateProjectionMatrix();
}

function frameAvatar(){
  const box=new THREE.Box3().setFromObject(avatar);
  const size=box.getSize(new THREE.Vector3());
  const center=box.getCenter(new THREE.Vector3());
  const max=Math.max(size.x,size.y,size.z);
  camera.position.set(center.x,center.y+size.y*.03,center.z+max*1.65);
  camera.lookAt(center.x,center.y,center.z);
  controls.distance=max*1.65;
}

function collectMorphs(){
  morphs=[];
  avatar.traverse(obj=>{
    if(!obj.isMesh || !obj.morphTargetDictionary || !obj.morphTargetInfluences)return;
    for(const [name,index] of Object.entries(obj.morphTargetDictionary)){
      morphs.push({
        name,
        mesh:obj,
        index,
        label:`${obj.name||'Face Mesh'} / ${name}`
      });
    }
  });
}

function clearMorphs(){
  for(const m of morphs)m.mesh.morphTargetInfluences[m.index]=0;
}

function apply(){
  if(!morphs.length)return;
  clearMorphs();
  morphs[active].mesh.morphTargetInfluences[morphs[active].index]=value;
  $('name').textContent=morphs[active].label;
  $('idx').textContent=`第 ${active+1} 個 / 共 ${morphs.length} 個`;
  $('power').value=value;
}

function selectMorph(i){
  active=(i+morphs.length)%morphs.length;
  value=0;
  apply();
}

function setValue(v){value=Math.max(0,Math.min(1,Number(v)));apply();}

function render(){
  requestAnimationFrame(render);
  if(!renderer)return;
  const dt=clock.getDelta();
  if(autoTimer){
    autoTimer.elapsed+=dt;
    if(autoTimer.elapsed>0.9){
      autoTimer.elapsed=0;
      selectMorph(active+1);
      value=.75;
      apply();
    }
  }
  renderer.render(scene,camera);
}

function init3D(){
  const canvas=$('view');
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.05;
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x111827);
  camera=new THREE.PerspectiveCamera(32,1,.01,100);
  clock=new THREE.Clock();
  scene.add(new THREE.HemisphereLight(0xffffff,0x334155,2.2));
  const key=new THREE.DirectionalLight(0xffffff,2.8);key.position.set(2,3,4);scene.add(key);
  const fill=new THREE.DirectionalLight(0x9fc5ff,1.4);fill.position.set(-3,1,2);scene.add(fill);
  resize();
  window.addEventListener('resize',resize);
}

async function boot(){
  try{
    init3D();
    setStatus('正在載入 AIVAULT GLB…');
    const loader=new GLTFLoader();
    const gltf=await loader.loadAsync(MODEL);
    avatar=gltf.scene;
    scene.add(avatar);
    frameAvatar();
    collectMorphs();
    apply();
    $('loading').style.display='none';
    setStatus(`✅ 3D GPU 渲染完成｜找到 ${morphs.length} 個可控制 Morph Target`,'ok');
    $('info').innerHTML=`<span class="badge">GLB</span><span class="badge">WebGL GPU</span><span class="badge">原生 Morph</span><br>現在看到的是真正模型，不再是數字掃描。點「下一個」即可直接讓臉部實際變形。`;
    render();
  }catch(e){
    console.error(e);
    $('loading').textContent='3D 模型載入失敗';
    setStatus('❌ '+(e?.message||e),'error');
    $('info').textContent='請查看瀏覽器主控台錯誤。正式暗星頁面未被修改。';
  }
}

$('prev').onclick=()=>selectMorph(active-1);
$('next').onclick=()=>selectMorph(active+1);
$('reset').onclick=()=>setValue(0);
$('power').oninput=e=>setValue(e.target.value);
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>setValue(b.dataset.v));
document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{
  if(!morphs.length)return;
  tags[active]=b.dataset.tag;
  $('tags').innerHTML=Object.entries(tags).map(([i,t])=>`${Number(i)+1}. ${morphs[i].label} → <b>${t}</b>`).join('<br>')||'尚未標記';
});
$('auto').onclick=()=>{
  if(autoTimer){autoTimer=null;$('auto').textContent='逐個測試';$('auto').className='primary';setValue(0);return;}
  if(!morphs.length)return;
  autoTimer={elapsed:0};
  $('auto').textContent='停止測試';$('auto').className='stop';
  value=.75;apply();
};

boot();
</script>
</body>
</html>
