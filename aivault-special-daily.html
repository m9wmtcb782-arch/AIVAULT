<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🌑🌅 暗星／曙光 每日學習報告</title>
<style>body{margin:0;font:15px/1.6 -apple-system,"PingFang TC",sans-serif;background:#0b1020;color:#e2e8f0}header{padding:14px 16px;background:#111a33}h1{font-size:18px;margin:0}main{padding:12px;max-width:900px;margin:auto}.card{background:#141d38;border:1px solid #24304f;border-radius:12px;padding:12px;margin:10px 0}.muted{color:#94a3b8;font-size:13px}a{color:#93c5fd}input,button{font:inherit;border-radius:8px;border:0;padding:5px 10px}button{background:#1e40af;color:#fff}</style></head><body>
<header><h1>🌑 暗星／🌅 曙光 每日學習報告</h1><div class="muted">只列資料庫裡真實的學習紀錄（網址、筆記摘要）、考試與召集；沒有就是沒有。<a href="aivault-town.html">← 協作城</a></div><p><input type="date" id="d"> <button id="go">查看</button></p></header><main id="m"><p class="muted">載入中…</p></main>
<script>(function(){try{if(localStorage.getItem('specialDailyOff')==='1'){document.getElementById('m').textContent='已關閉（localStorage.specialDailyOff=1）';return}}catch(_){}
var FN='https://clcddygkaaqqtsbswgdf.supabase.co/functions/v1/dark-star-ebook-ingest?feature=degree',ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsY2RkeWdrYWFxcXRzYnN3Z2RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzUwNjQsImV4cCI6MjEwMjMxMTA2NH0.kYg6h7n74CtbiIjNjZ2xxJj16SV42INZVzQ9dLNUfKE';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function tp(t){return t?new Date(t).toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei',hour12:false,hour:'2-digit',minute:'2-digit'}):''}
var d=document.getElementById('d');d.value=new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
function load(){document.getElementById('m').innerHTML='<p class="muted">載入中…</p>';fetch(FN,{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+ANON,'Content-Type':'application/json'},body:JSON.stringify({action:'special_daily',day:d.value})}).then(function(r){return r.json()}).then(function(j){var h='';Object.keys(j.per||{}).forEach(function(k){var p=j.per[k];h+='<div class="card"><h3>'+(k==='darkstar'?'🌑 ':'🌅 ')+esc(p.name)+'</h3><p>'+esc(p.summary)+'</p>'+
 (p.learned.length?'<h4>📚 學習</h4>'+p.learned.map(function(x){return'<div class="card"><b>'+esc(x.topic)+'</b> <span class="muted">'+tp(x.at)+'（台北）'+(x.used_in_exam?'｜✅ 考試時用到':'')+'</span><br><a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+esc(x.title||x.url)+'</a><p>'+esc(x.summary)+'</p><div class="muted">'+esc(x.model)+'</div></div>'}).join(''):'<p class="muted">這天沒有學習紀錄。</p>')+
 (p.exams.length?'<h4>🎓 考試</h4>'+p.exams.map(function(e){return'<div class="muted">'+tp(e.at)+' '+esc(e.exam)+'：'+e.score+'/'+e.max+' → 第 '+e.tier+' 階 '+e.level+' 級｜用了 '+e.notes_used+' 筆筆記｜'+esc(e.note)+'</div>'}).join(''):'')+
 (p.summon?'<p class="muted">📣 '+tp(p.summon.at)+' 被召集：'+esc(p.summon.task)+'</p>':'')+'</div>'});document.getElementById('m').innerHTML=h||'<p class="muted">沒有資料</p>'}).catch(function(e){document.getElementById('m').textContent='⚠️ '+e.message})}
document.getElementById('go').onclick=load;load()})();</script></body></html>
