<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AIVAULT Identity Gateway</title>
<style>body{margin:0;background:#070b14;color:#eef2ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:720px;margin:auto;padding:32px 20px}.card{background:#111827;border:1px solid #26324a;border-radius:20px;padding:24px}h1{margin-top:0}.muted{color:#9aa7bd;line-height:1.7}label{display:block;margin-top:14px;margin-bottom:7px;color:#cbd5e1;font-weight:600}input{width:100%;box-sizing:border-box;padding:15px;border-radius:12px;border:1px solid #334155;background:#0b1220;color:#fff;font-size:16px}button{width:100%;padding:16px;border:0;border-radius:14px;background:#fff;color:#111827;font-size:17px;font-weight:700;margin-top:12px}button.secondary{background:#202a3d;color:#fff}.divider{display:flex;align-items:center;gap:12px;color:#64748b;margin:24px 0 8px}.divider:before,.divider:after{content:"";height:1px;background:#26324a;flex:1}.status{margin-top:18px;padding:14px;border-radius:12px;background:#0b1220;white-space:pre-wrap;line-height:1.6}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#172554;color:#bfdbfe;font-size:13px}</style>
</head><body><main><div class="card"><span class="badge">IDENTITY GATEWAY v1</span><h1>AIVAULT 身分入口</h1><p class="muted">這裡是獨立的身分入口，不是暗星本體。第一階段使用 Passkey / iPhone Face ID。Face ID 只在你的裝置上完成生物辨識，AIVAULT 不接收你的原始臉部資料。</p><label for="email">帳號／Email</label><input id="email" type="email" autocomplete="username" placeholder="輸入你的帳號 Email"><label for="password">密碼</label><input id="password" type="password" autocomplete="current-password" placeholder="輸入密碼"><button id="passwordSignIn">登入 AIVAULT</button><div class="divider">或</div><button id="signIn">使用 Face ID / Passkey 登入</button><button id="register" class="secondary">登入後註冊此裝置 Passkey</button><div id="status" class="status">尚未驗證。</div></div></main>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.105.0";
const SUPABASE_URL="https://clcddygkaaqqtsbswgdf.supabase.co";
const SUPABASE_KEY="sb_publishable_1D05YGthBrNGg-5L92TLCw_GiLnInBu";
const HOME_URL="https://m9wmtcb782-arch.github.io/AIVAULT/aivault-home.html";
const statusEl=document.getElementById("status"),setStatus=v=>statusEl.textContent=v;
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{experimental:{passkey:true},persistSession:true,autoRefreshToken:true}});
function goHome(){window.location.replace(HOME_URL);}
document.getElementById("passwordSignIn").onclick=async()=>{
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 if(!email||!password){setStatus("請輸入帳號／Email 與密碼。");return;}
 setStatus("正在登入 AIVAULT…");
 const {data,error}=await supabase.auth.signInWithPassword({email,password});
 if(error){setStatus("帳號／密碼登入失敗：\n"+error.message);return;}
 if(!data.session||!data.user){setStatus("登入未取得有效 Session。");return;}
 setStatus("一般帳號登入成功，正在進入 AIVAULT…");
 setTimeout(goHome,250);
};
document.getElementById("signIn").onclick=async()=>{
 setStatus("正在啟動裝置身分驗證…");
 const {error}=await supabase.auth.signInWithPasskey();
 if(error){setStatus("Passkey 登入失敗：\n"+error.message);return;}
 const {data:{session}}=await supabase.auth.getSession();
 if(!session){setStatus("Passkey 驗證完成，但沒有取得登入 Session。");return;}
 setStatus("Face ID / Passkey 驗證成功，正在進入 AIVAULT…");
 setTimeout(goHome,250);
};
document.getElementById("register").onclick=async()=>{
 setStatus("請先登入，再註冊此裝置…");
 const {data:{session}}=await supabase.auth.getSession();
 if(!session){setStatus("目前沒有登入 Session。請先登入。");return;}
 const {data,error}=await supabase.auth.registerPasskey();
 if(error){setStatus("Passkey 註冊失敗：\n"+error.message);return;}
 setStatus("Passkey 已註冊。");
};
</script></body></html>
