    }

      pointer-events: none;
    }

      color: #fff;

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #gameTitle {
      font-weight: 800;
      letter-spacing: 1px;
    }

    #turnText {
      font-size: 14px;
    }

      z-index: 21;

      left: 50%;

      );

      max-width: 90vw;

      padding: 10px 16px;

      border-radius: 999px;

      background: rgba(15, 10, 5, 0.86);
      color: white;

      text-align: center;
      font-size: 14px;

      pointer-events: none;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #room {
      position: fixed;
      inset: 0;
      z-index: 100;

      display: none;

      align-items: center;
      justify-content: center;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    }

      padding: 24px;

        linear-gradient(

    }

      margin: 14px 0;

      border-radius: 16px;

      background: rgba(0, 0, 0, 0.35);

      color: #ffd77a;

      font-size: 28px;
      font-weight: 900;
      letter-spacing: 4px;
    }

    .room-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .room-row input {
      flex: 1;
      min-width: 0;

      height: 48px;

      padding: 0 14px;

      border: 0;
      outline: none;

      border-radius: 12px;

    }

  );

}


/* =========================================================
   Create Board
========================================================= */

function createBoard() {

  boardGroup =
    new THREE.Group();


  scene.add(
    boardGroup
  );


  const boardGeometry =
    new THREE.BoxGeometry(

      9.8,

      0.55,

      10.8

    );


  const boardMaterial =
    new THREE.MeshStandardMaterial({

      color:0x6b3f1f,

      roughness:0.65

    });


  const board =
    new THREE.Mesh(

      boardGeometry,

      boardMaterial

    );


  board.position.y =
    -0.35;


  board.receiveShadow =
    true;


  boardGroup.add(
    board
  );


  const material =
    new THREE.LineBasicMaterial({

      color:0x1f1008

    });


  /*
    Horizontal lines
  */

  for (
    let y = 0;
    y < 10;
    y++
  ) {

    const z =
      BOARD.top - y;


    const points = [

      new THREE.Vector3(

        BOARD.left,
        0,
        z

      ),

      new THREE.Vector3(

        BOARD.right,
        0,
        z

      )

    ];


    const geometry =
      new THREE.BufferGeometry()
        .setFromPoints(
          points
        );


    boardGroup.add(

      new THREE.Line(

        geometry,

        material

      )

    );

  }


  /*
    Vertical lines
  */

  for (
    let x = 0;
    x < 9;
    x++
  ) {

    const xx =
      BOARD.left + x;


    const points = [

      new THREE.Vector3(

        xx,
        0,
        BOARD.top

      ),

      new THREE.Vector3(

        xx,
        0,
        BOARD.bottom

      )

    ];


    const geometry =
      new THREE.BufferGeometry()
        .setFromPoints(
          points
        );


    boardGroup.add(

      new THREE.Line(

        geometry,

        material

      )

    );

  }


  addPalace(0);

  addPalace(7);

  createRiver();


  const starPositions = [

    [1,2],
    [7,2],

    [1,7],
    [7,7],

    [0,3],
    [2,3],
    [4,3],
    [6,3],
    [8,3],

    [0,6],
    [2,6],
    [4,6],
    [6,6],
    [8,6]

  ];


  const starMaterial =
    new THREE.MeshStandardMaterial({

      color:0x241209

    });


  for (
    const [x,y]
    of starPositions
  ) {

    const geometry =
      new THREE.CylinderGeometry(

        0.055,

        0.055,

        0.02,

        12

      );


    const dot =
      new THREE.Mesh(

        geometry,

        starMaterial

      );


    dot.position.set(

      BOARD.left + x,

      0.02,

      BOARD.top - y

    );


    boardGroup.add(
      dot
    );

  }

}


/* =========================================================
   Palace
========================================================= */

function addPalace(startY) {

  const material =
    new THREE.LineBasicMaterial({

      color:0x2a1409

    });


  const z1 =
    BOARD.top - startY;


  const z2 =
    BOARD.top -
    startY -
    2;


  const p1 =
    new THREE.Vector3(

      BOARD.left + 3,
      0.02,
      z1

    );


  const p2 =
    new THREE.Vector3(

      BOARD.left + 5,
      0.02,
      z2

    );


  const p3 =
    new THREE.Vector3(

      BOARD.left + 5,
      0.02,
      z1

    );


  const p4 =
    new THREE.Vector3(

      BOARD.left + 3,
      0.02,
      z2

    );


  const g1 =
    new THREE.BufferGeometry()
      .setFromPoints([
        p1,
        p2
      ]);


  const g2 =
    new THREE.BufferGeometry()
      .setFromPoints([
        p3,
        p4
      ]);


  boardGroup.add(

    new THREE.Line(
      g1,
      material
    )

  );


  boardGroup.add(

    new THREE.Line(
      g2,
      material
    )

  );

}


/* =========================================================
   River
========================================================= */

function createRiver() {

  const geometry =
    new THREE.PlaneGeometry(

      8.2,

      1.8

    );


  const material =
    new THREE.MeshStandardMaterial({

      color:0x7c4d25,

      roughness:0.85

    });


  const river =
    new THREE.Mesh(

      geometry,

      material

    );


  river.rotation.x =
    -Math.PI / 2;


  river.position.set(

    0,

    0.015,

    0.5

  );


  boardGroup.add(
    river
  );


  createRiverText(
    '楚河',
    -2.2
  );


  createRiverText(
    '漢界',
    2.2
  );

}


/* =========================================================
   River Text
========================================================= */

function createRiverText(
  text,
  x
) {

  const canvas =
    document.createElement(
      'canvas'
    );


  canvas.width =
    512;


  canvas.height =
    160;


  const ctx =
    canvas.getContext(
      '2d'
    );


  ctx.clearRect(

    0,
    0,
    canvas.width,
    canvas.height

  );


  ctx.fillStyle =
    '#28160b';


  ctx.font =
    'bold 110px "Noto Sans TC", "Microsoft JhengHei", sans-serif';


  ctx.textAlign =
    'center';


  ctx.textBaseline =
    'middle';


  ctx.fillText(

    text,

    256,

    80

  );


  const texture =
    new THREE.CanvasTexture(
      canvas
    );


  texture.needsUpdate =
    true;


  const material =
    new THREE.MeshBasicMaterial({

      map:texture,

      transparent:true

    });


  const geometry =
    new THREE.PlaneGeometry(

      1.8,

      0.56

    );


  const mesh =
    new THREE.Mesh(

      geometry,

      material

    );


  mesh.rotation.x =
    -Math.PI / 2;


  mesh.position.set(

    x,

    0.04,

    0.5

  );


  boardGroup.add(
    mesh
  );

}


/* =========================================================
   Reset Game
========================================================= */

function resetGame() {

  pieces =
    structuredClone(
      initialPieces
    );


  currentTurn =
    'red';


  selected =
    null;


  gameOver =
    false;


  document
    .getElementById(
      'gameOver'
    )
    .classList.remove(
      'on'
    );


  renderPieces();

  updateTurn();

  setMsg(
    '紅方回合'
  );

}


/* =========================================================
   Render Pieces
========================================================= */

function renderPieces() {

  while (
    piecesGroup.children.length
  ) {

    const obj =
      piecesGroup.children.pop();


    obj.traverse(
      child => {

        if (
          child.geometry
        ) {

          child.geometry.dispose();

        }


        if (
          child.material
        ) {

          if (
            Array.isArray(
              child.material
            )
          ) {

            child.material.forEach(
              m => m.dispose()
            );

          } else {

            child.material.dispose();

          }

        }

      }
    );

  }


  for (
    const p of pieces
  ) {

    const mesh =
      createPieceMesh(
        p
      );


    mesh.userData.pieceId =
      p.id;


    piecesGroup.add(
      mesh
    );


    updatePiecePosition(
      mesh,
      p
    );

  }

}


/* =========================================================
   Create Piece
========================================================= */

function createPieceMesh(
  piece
) {

  const group =
    new THREE.Group();


  const color =
    piece.color === 'red'
      ? 0xb22d24
      : 0x222222;


  const edgeColor =
    piece.color === 'red'
      ? 0xf0a25a
      : 0xbebebe;


  const geometry =
    new THREE.CylinderGeometry(

      PIECE_RADIUS,

      PIECE_RADIUS,

      PIECE_HEIGHT,

      48

    );


  const material =
    new THREE.MeshStandardMaterial({

      color,

      roughness:0.3,

      metalness:0.15

    });


  const body =
    new THREE.Mesh(

      geometry,

      material

    );


  body.castShadow =
    true;


  group.add(
    body
  );


  const topGeometry =
    new THREE.CylinderGeometry(

      PIECE_RADIUS * 0.9,

      PIECE_RADIUS * 0.9,

      0.025,

      48

    );


  const topMaterial =
    new THREE.MeshStandardMaterial({

      color:edgeColor,

      roughness:0.45

    });


  const top =
    new THREE.Mesh(

      topGeometry,

      topMaterial

    );


  top.position.y =
    PIECE_HEIGHT / 2 +
    0.015;


  group.add(
    top
  );


  const text =
    createPieceText(

      pieceText[
        piece.color
      ][
        piece.type
      ],

      piece.color

    );


  text.position.y =
    PIECE_HEIGHT / 2 +
    0.035;


  text.rotation.x =
    -Math.PI / 2;


  text.scale.set(

    0.68,
    0.68,
    0.68

  );


  group.add(
    text
  );


  return group;

}


/* =========================================================
   Piece Text
========================================================= */

function createPieceText(
  text,
  color
) {

  const canvas =
    document.createElement(
      'canvas'
    );


  canvas.width =
    256;


  canvas.height =
    256;


  const ctx =
    canvas.getContext(
      '2d'
    );


  ctx.clearRect(

    0,
    0,
    256,
    256

  );


  ctx.textAlign =
    'center';


  ctx.textBaseline =
    'middle';


  ctx.font =
    'bold 150px "Noto Serif TC", "Noto Sans TC", serif';


  ctx.fillStyle =
    color === 'red'
      ? '#7c160f'
      : '#111111';


  ctx.fillText(

    text,

    128,

    128

  );


  const texture =
    new THREE.CanvasTexture(
      canvas
    );


  texture.needsUpdate =
    true;


  const material =
    new THREE.MeshBasicMaterial({

      map:texture,

      transparent:true

    });


  const geometry =
    new THREE.PlaneGeometry(

      0.75,

      0.75

    );


  return new THREE.Mesh(

    geometry,

    material

  );

}


/* =========================================================
   Piece Position
========================================================= */

function updatePiecePosition(
  mesh,
  piece
) {

  mesh.position.set(

    BOARD.left + piece.x,

    0.18,

    BOARD.top - piece.y

  );

}


/* =========================================================
   Pointer
========================================================= */

function onPointerDown(
  event
) {

  if (
    gameOver
  )
    return;


  const rect =
    renderer.domElement
      .getBoundingClientRect();


  pointer.x =
    (
      (
        event.clientX -
        rect.left
      ) /
      rect.width
    ) * 2 - 1;


  pointer.y =
    -(
      (
        event.clientY -
        rect.top
      ) /
      rect.height
    ) * 2 + 1;


  raycaster.setFromCamera(

    pointer,

    camera

  );


  const hits =
    raycaster.intersectObjects(

      piecesGroup.children,

      true

    );


  if (
    hits.length
  ) {

    let obj =
      hits[0].object;


    while (

      obj.parent &&
      !obj.userData.pieceId

    ) {

      obj =
        obj.parent;

    }


    if (
      obj.userData.pieceId
    ) {

      handlePieceClick(

        obj.userData.pieceId

      );

      return;

    }

  }


  const boardHits =
    raycaster.intersectObject(

      boardGroup,

      true

    );


  if (

    boardHits.length &&
    selected

  ) {

    const point =
      boardHits[0].point;


    const pos =
      worldToBoard(
        point
      );


    if (
      pos
    ) {

      tryMove(

        selected,

        pos.x,

        pos.y

      );

    }

  }

}


/* =========================================================
   Piece Click
========================================================= */

function handlePieceClick(
  id
) {

  const piece =
    pieces.find(

      p =>
        p.id === id

    );


  if (
    !piece
  )
    return;


  if (

    gameMode === 'online' &&
    !isMyTurn()

  ) {

    setMsg(
      '現在不是你的回合'
    );

    return;

  }


  if (

    piece.color ===
    currentTurn

  ) {

    selected =
      piece.id;


    setMsg(

      `已選擇 ${
        pieceText[
          piece.color
        ][
          piece.type
        ]
      }`

    );


    return;

  }


  if (
    selected
  ) {

    tryMove(

      selected,

      piece.x,

      piece.y

    );

  }

}


/* =========================================================
   Try Move
========================================================= */

function tryMove(
  pieceId,
  tx,
  ty
) {

  const piece =
    pieces.find(

      p =>
        p.id === pieceId

    );


  if (
    !piece
  )
    return;


  if (
    piece.color !== currentTurn
  ) {

    selected =
      null;

    return;

  }


  if (

    tx < 0 ||
    tx > 8 ||
    ty < 0 ||
    ty > 9

  ) {

    setMsg(
      '不能走到棋盤外'
    );

    return;

  }


  if (

    !isLegalMove(

      piece,

      tx,

      ty

    )

  ) {

    setMsg(
      '這一步不符合象棋規則'
    );

    return;

  }


  const target =
    getPieceAt(

      tx,

      ty

    );


  if (
    target
  ) {

    if (
      target.color ===
      piece.color
    ) {

      setMsg(
        '不能吃自己的棋子'
      );

      return;

    }


    if (
      target.type ===
      'general'
    ) {

      gameOver =
        true;


      movePiece(

        piece,

        tx,

        ty

      );


      renderPieces();


      showGameOver(

        piece.color === 'red'
          ? '紅方勝利'
          : '黑方勝利'

      );


      sendMove(

        piece.id,

        tx,

        ty

      );


      return;

    }


    pieces =
      pieces.filter(

        p =>
          p.id !==
          target.id

      );

  }


  movePiece(

    piece,

    tx,

    ty

  );


  currentTurn =
    currentTurn === 'red'
      ? 'black'
      : 'red';


  selected =
    null;


  renderPieces();

  updateTurn();


  sendMove(

    piece.id,

    tx,

    ty

  );

}


/* =========================================================
   Move Piece
========================================================= */

function movePiece(
  piece,
  x,
  y
) {

  piece.x =
    x;

  piece.y =
    y;

}


/* =========================================================
   Xiangqi Basic Rules
========================================================= */

function isLegalMove(
  piece,
  tx,
  ty
) {

  const dx =
    tx - piece.x;

  const dy =
    ty - piece.y;

  const ax =
    Math.abs(dx);

  const ay =
    Math.abs(dy);


  const target =
    getPieceAt(
      tx,
      ty
    );


  if (

    target &&
    target.color ===
    piece.color

  ) {

    return false;

  }


  switch (
    piece.type
  ) {


    /* General */

    case 'general': {

      if (
        ax + ay !== 1
      ) {

        return false;

      }


      const inPalace =

        piece.color === 'red'

          ? tx >= 3 &&
            tx <= 5 &&
            ty >= 0 &&
            ty <= 2

          : tx >= 3 &&
            tx <= 5 &&
            ty >= 7 &&
            ty <= 9;


      if (
        !inPalace
      )
        return false;


      return true;

    }


    /* Advisor */

    case 'advisor': {

      if (

        ax !== 1 ||
        ay !== 1

      ) {

        return false;

      }


      return piece.color === 'red'

        ? tx >= 3 &&
          tx <= 5 &&
          ty >= 0 &&
          ty <= 2

        : tx >= 3 &&
          tx <= 5 &&
          ty >= 7 &&
          ty <= 9;

    }


    /* Elephant */

    case 'elephant': {

      if (

        ax !== 2 ||
        ay !== 2

      ) {

        return false;

      }


      if (

        piece.color === 'red' &&
        ty > 4

      ) {

        return false;

      }


      if (

        piece.color === 'black' &&
        ty < 5

      ) {

        return false;

      }


      const eyeX =
        piece.x +
        dx / 2;


      const eyeY =
        piece.y +
        dy / 2;


      if (

        getPieceAt(
          eyeX,
          eyeY
        )

      ) {

        return false;

      }


      return true;

    }


    /* Horse */

    case 'horse': {

      if (

        !(
          (
            ax === 1 &&
            ay === 2
          ) ||
          (
            ax === 2 &&
            ay === 1
          )
        )

      ) {

        return false;

      }


      let legX;

      let legY;


      if (
        ax === 2
      ) {

        legX =
          piece.x +
          dx / 2;

        legY =
          piece.y;

      } else {

        legX =
          piece.x;

        legY =
          piece.y +
          dy / 2;

      }


      if (

        getPieceAt(
          legX,
          legY
        )

      ) {

        return false;

      }


      return true;

    }


    /* Rook */

    case 'rook': {

      if (

        dx !== 0 &&
        dy !== 0

      ) {

        return false;

      }


      return pathClear(

        piece.x,
        piece.y,
        tx,
        ty

      );

    }


    /* Cannon */

    case 'cannon': {

      if (

        dx !== 0 &&
        dy !== 0

      ) {

        return false;

      }


      const count =
        countPiecesBetween(

          piece.x,
          piece.y,
          tx,
          ty

        );


      if (
        target
      ) {

        return count === 1;

      } else {

        return count === 0;

      }

    }


    /* Pawn */

    case 'pawn': {

      const forward =

        piece.color === 'red'
          ? 1
          : -1;


      if (

        dx === 0 &&
        dy === forward

      ) {

        return true;

      }


      const crossed =

        piece.color === 'red'

          ? piece.y >= 5

          : piece.y <= 4;


      if (

        crossed &&
        ay === 0 &&
        ax === 1

      ) {

        return true;

      }


      return false;

    }

  }


  return false;

}


/* =========================================================
   Path Clear
========================================================= */

function pathClear(
  x1,
  y1,
  x2,
  y2
) {

  const dx =
    Math.sign(
      x2 - x1
    );


  const dy =
    Math.sign(
      y2 - y1
    );


  let x =
    x1 + dx;


  let y =
    y1 + dy;


  while (

    x !== x2 ||
    y !== y2

  ) {

    if (

      getPieceAt(
        x,
        y
      )

    ) {

      return false;

    }


    x += dx;

    y += dy;

  }


  return true;

}


/* =========================================================
   Count Pieces Between
========================================================= */

function countPiecesBetween(
  x1,
  y1,
  x2,
  y2
) {

  const dx =
    Math.sign(
      x2 - x1
    );


  const dy =
    Math.sign(
      y2 - y1
    );


  let x =
    x1 + dx;


  let y =
    y1 + dy;


  let count =
    0;


  while (

    x !== x2 ||
    y !== y2

  ) {

    if (

      getPieceAt(
        x,
        y
      )

    ) {

      count++;

    }


    x += dx;

    y += dy;

  }


  return count;

}


/* =========================================================
   Get Piece
========================================================= */

function getPieceAt(
  x,
  y
) {

  return pieces.find(

    p =>
      p.x === x &&
      p.y === y

  );

}


/* =========================================================
   World To Board
========================================================= */

function worldToBoard(
  point
) {

  const x =
    Math.round(

      point.x -
      BOARD.left

    );


  const y =
    Math.round(

      BOARD.top -
      point.z

    );


  if (

    x < 0 ||
    x > 8 ||
    y < 0 ||
    y > 9

  ) {

    return null;

  }


  return {
    x,
    y
  };

}


/* =========================================================
   Room ID
========================================================= */

function roomId() {

  return Math.random()

    .toString(36)

    .slice(2,8)

    .toUpperCase();

}


/* =========================================================
   Host Room
========================================================= */

async function hostRoom() {

  const id =
    'AV' +
    roomId();


  document
    .getElementById(
      'roomCode'
    )
    .textContent =
      id;


  document
    .getElementById(
      'roomHint'
    )
    .textContent =
      '正在建立房間…';


  if (
    net.peer
  ) {

    try {

      net.peer.destroy();

    } catch {}

  }


  net.peer =
    new Peer(id);


  net.role =
    'host';


  net.room =
    id;


  gameMode =
    'online';


  net.peer.on(

    'open',

    () => {

      document
        .getElementById(
          'roomHint'
        )
        .textContent =
          '房間已開，把代碼給對方。';


      setMsg(
        '等待黑方加入'
      );

    }

  );


  net.peer.on(

    'error',

    e => {

      document
        .getElementById(
          'roomHint'
        )
        .textContent =
          '連線錯誤：' +
          e.type;

    }

  );


  net.peer.on(

    'connection',

    conn => {

      net.conn =
        conn;


      conn.on(

        'open',

        () => {

          conn.send({

            t:'sync',

            state:
              getGameState()

          });


          document
            .getElementById(
              'room'
            )
            .classList
            .remove(
              'on'
            );


          setMsg(
            '黑方已加入'
          );

        }

      );


      conn.on(

        'data',

        onNetData

      );


      conn.on(

        'close',

        () => {

          setMsg(
            '黑方離線'
          );

        }

      );

    }

  );

}


/* =========================================================
   Join Room
========================================================= */

async function joinRoom() {

  const id =
    document
      .getElementById(
        'joinId'
      )
      .value
      .trim()
      .toUpperCase();


  if (

    !/^AV[A-Z0-9]{6}$/.test(
      id
    )

  ) {

    document
      .getElementById(
        'roomHint'
      )
      .textContent =
        '房間代碼格式錯誤，請輸入完整 8 碼代碼。';


    return;

  }


  if (
    net.peer
  ) {

    try {

      net.peer.destroy();

    } catch {}

  }


  net.peer =
    new Peer();


  net.role =
    'guest';


  net.room =
    id;


  gameMode =
    'online';


  net.peer.on(

    'open',

    () => {

      const conn =
        net.peer.connect(

          id,

          {
            reliable:true
          }

        );


      net.conn =
        conn;


      conn.on(

        'open',

        () => {

          document
            .getElementById(
              'room'
            )
            .classList
            .remove(
              'on'
            );


          setMsg(
            '已加入房間，等待紅方'
          );

        }

      );


      conn.on(

        'data',

        onNetData

      );


      conn.on(

        'close',

        () => {

          setMsg(
            '紅方離線'
          );

        }

      );

    }

  );


  net.peer.on(

    'error',

    e => {

      document
        .getElementById(
          'roomHint'
        )
        .textContent =
          '加入失敗：' +
          e.type;

    }

  );

}


/* =========================================================
   Send Move
========================================================= */

function sendMove(
  pieceId,
  x,
  y
) {

  if (
    gameMode !==
    'online'
  )
    return;


  if (

    !net.conn ||
    !net.conn.open

  )
    return;


  net.conn.send({

    t:'move',

    pieceId,

    x,

    y

  });

}


/* =========================================================
   Network Data
========================================================= */

function onNetData(
  data
) {

  if (
    !data
  )
    return;


  if (
    data.t === 'sync'
  ) {

    applyGameState(
      data.state
    );

    return;

  }


  if (
    data.t === 'move'
  ) {

    applyRemoteMove(
      data
    );

  }

}


/* =========================================================
   Remote Move
========================================================= */

function applyRemoteMove(
  data
) {

  const piece =
    pieces.find(

      p =>
        p.id ===
        data.pieceId

    );


  if (
    !piece
  )
    return;


  const target =
    getPieceAt(

      data.x,
      data.y

    );


  if (

    target &&
    target.color !==
    piece.color

  ) {

    if (

      target.type ===
      'general'

    ) {

      pieces =
        pieces.filter(

          p =>
            p.id !==
            target.id

        );


      movePiece(

        piece,

        data.x,

        data.y

      );


      renderPieces();


      gameOver =
        true;


      showGameOver(

        piece.color === 'red'
          ? '紅方勝利'
          : '黑方勝利'

      );


      return;

    }


    pieces =
      pieces.filter(

        p =>
          p.id !==
          target.id

      );

  }


  movePiece(

    piece,

    data.x,

    data.y

  );


  currentTurn =

    currentTurn === 'red'
      ? 'black'
      : 'red';


  selected =
    null;


  renderPieces();

  updateTurn();

}


/* =========================================================
   Game State
========================================================= */

function getGameState() {

  return {

    pieces,

    currentTurn,

    gameOver

  };

}


/* =========================================================
   Apply Game State
========================================================= */

function applyGameState(
  state
) {

  if (
    !state
  )
    return;


  pieces =
    structuredClone(
      state.pieces
    );


  currentTurn =
    state.currentTurn;


  gameOver =
    state.gameOver;


  selected =
    null;


  renderPieces();

  updateTurn();

}


/* =========================================================
   My Turn
========================================================= */

function isMyTurn() {

  if (
    gameMode !==
    'online'
  )
    return true;


  if (
    net.role ===
    'host'
  ) {

    return (
      currentTurn ===
      'red'
    );

  }


  if (
    net.role ===
    'guest'
  ) {

    return (
      currentTurn ===
      'black'
    );

  }


  return false;

}


/* =========================================================
   Update Turn
========================================================= */

function updateTurn() {

  const text =

    currentTurn === 'red'
      ? '紅方回合'
      : '黑方回合';


  document
    .getElementById(
      'turnText'
    )
    .textContent =
      text;

}


/* =========================================================
   Message
========================================================= */

function setMsg(
  text
) {

  document
    .getElementById(
      'message'
    )
    .textContent =
      text;

}


/* =========================================================
   Game Over
========================================================= */

function showGameOver(
  text
) {

  document
    .getElementById(
      'gameOverTitle'
    )
    .textContent =
      text;


  document
    .getElementById(
      'gameOver'
    )
    .classList
    .add(
      'on'
    );

}


/* =========================================================
   Resize
========================================================= */

function resize() {

  const width =
    window.innerWidth;


  const height =
    window.innerHeight;


  renderer.setSize(

    width,

    height,

    false

  );


  camera.aspect =
    width / height;


  camera.updateProjectionMatrix();

}


/* =========================================================
   Animation
========================================================= */

function animate() {

  animationFrame =
    requestAnimationFrame(
      animate
    );


  renderer.render(

    scene,

    camera

  );

}

document
  .getElementById(
    'btnLocal'

  .addEventListener(

    'click',

    () => {

      gameMode =
        'local';


      net.role =
        null;


      document
        .getElementById(
          'room'
        )
        .classList
        .remove(
          'on'
        );


      resetGame();


      setMsg(
        '本機雙人模式：紅方先走'
      );

    }

  );


document
  .getElementById(
    'btnRestart'
  )
  .addEventListener(

    'click',

    () => {

      resetGame();

    }

  );


document
  .getElementById(
    'btnBackRoom'
  )
  .addEventListener(

    'click',

    () => {

      document
        .getElementById(
          'gameOver'
        )
        .classList
        .remove(
          'on'
        );


      document
        .getElementById(
          'room'
        )
        .classList
        .add(
          'on'
        );

    }

  );


/* =========================================================
   Prevent Mobile Gestures
========================================================= */

document.addEventListener(

  'touchmove',

  event => {

    event.preventDefault();

  },

  {
    passive:false
  }

);


document.addEventListener(

  'gesturestart',

  event => {

    event.preventDefault();

  }

);

</script>

</body>
</html>
