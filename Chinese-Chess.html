<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<title>棋類遊戲｜中國象棋</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  position:fixed;
  inset:0;
  background:#111;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
  touch-action:none;
  overscroll-behavior:none;
}

#app{
  position:fixed;
  inset:0;
  overflow:hidden;
}

#game{
  position:absolute;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

/* =========================
   HUD
========================= */

#hud{
  position:fixed;
  z-index:20;
  top:env(safe-area-inset-top,0px);
  left:0;
  right:0;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:10px 12px;

  pointer-events:none;
}

.hud-box{
  padding:8px 11px;
  border-radius:13px;

  color:#fff;

  background:rgba(20,15,10,.84);

  border:1px solid
    rgba(255,220,150,.28);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

#gameTitle{
  font-weight:900;
  letter-spacing:.8px;
}

#turnText{
  font-size:13px;
}

/* =========================
   Bottom controls
========================= */

#bottomBar{
  position:fixed;
  z-index:30;

  left:50%;
  transform:translateX(-50%);

  bottom:
    calc(
      12px +
      env(safe-area-inset-bottom,0px)
    );

  display:flex;
  gap:8px;

  width:max-content;
  max-width:94vw;
}

button{
  border:0;
  outline:none;

  min-height:44px;

  padding:0 15px;

  border-radius:13px;

  color:#fff;

  background:
    rgba(30,22,15,.9);

  border:1px solid
    rgba(255,220,150,.22);

  font-size:14px;
  font-weight:800;

  touch-action:manipulation;
}

button:active{
  transform:scale(.97);
}

button.primary{
  background:
    linear-gradient(
      135deg,
      #c78b2c,
      #8c5517
    );
}

button.red{
  background:
    linear-gradient(
      135deg,
      #a63b32,
      #6f201c
    );
}

/* =========================
   Message
========================= */

#message{
  position:fixed;
  z-index:25;

  left:50%;

  bottom:
    calc(
      66px +
      env(safe-area-inset-bottom,0px)
    );

  transform:translateX(-50%);

  min-width:150px;
  max-width:90vw;

  padding:8px 14px;

  border-radius:999px;

  background:
    rgba(15,10,5,.86);

  color:#fff;

  text-align:center;

  font-size:13px;

  pointer-events:none;

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

/* =========================
   Start / Mode
========================= */

#modePanel,
#roomPanel,
#gameOver{
  position:fixed;
  inset:0;

  z-index:100;

  display:none;

  align-items:center;
  justify-content:center;

  padding:18px;

  background:
    rgba(0,0,0,.66);

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

#modePanel.on,
#roomPanel.on,
#gameOver.on{
  display:flex;
}

.panel{
  width:min(420px,94vw);

  padding:23px;

  border-radius:24px;

  color:#fff;

  background:
    linear-gradient(
      145deg,
      rgba(90,55,25,.98),
      rgba(25,18,12,.99)
    );

  border:1px solid
    rgba(255,220,150,.32);

  box-shadow:
    0 25px 80px
    rgba(0,0,0,.55);
}

.panel-title{
  font-size:25px;
  font-weight:900;

  margin-bottom:7px;
}

.panel-subtitle{
  color:#ddd;

  font-size:13px;

  line-height:1.6;

  margin-bottom:18px;
}

.mode-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

.mode-button{
  width:100%;

  min-height:58px;

  text-align:left;

  padding:0 17px;

  font-size:15px;
}

.mode-button span{
  display:block;

  margin-top:3px;

  font-size:12px;

  font-weight:500;

  opacity:.7;
}

.room-code{
  display:flex;

  align-items:center;
  justify-content:center;

  min-height:62px;

  margin:12px 0;

  border-radius:16px;

  background:
    rgba(0,0,0,.35);

  border:1px solid
    rgba(255,220,150,.22);

  color:#ffd77a;

  font-size:27px;

  font-weight:900;

  letter-spacing:4px;
}

.room-row{
  display:flex;

  gap:8px;

  margin-top:9px;
}

.room-row input{
  flex:1;
  min-width:0;

  height:46px;

  padding:0 13px;

  border:0;
  outline:none;

  border-radius:12px;

  background:
    rgba(255,255,255,.1);

  color:#fff;

  font-size:16px;

  text-transform:uppercase;
}

.room-row input::placeholder{
  color:
    rgba(255,255,255,.45);
}

.hint{
  min-height:20px;

  margin-top:14px;

  text-align:center;

  color:#ddd;

  font-size:12px;

  line-height:1.5;
}

/* =========================
   Game Over
========================= */

.game-over-box{
  width:min(360px,90vw);

  padding:30px;

  border-radius:22px;

  text-align:center;

  color:#fff;

  background:
    rgba(30,20,10,.96);

  border:1px solid
    rgba(255,220,150,.3);
}

.game-over-title{
  font-size:29px;
  font-weight:900;

  margin-bottom:18px;
}

.game-over-box button{
  margin:4px;
}

/* =========================
   Start button
========================= */

#startGame{
  position:fixed;

  z-index:35;

  left:50%;

  transform:translateX(-50%);

  bottom:
    calc(
      20px +
      env(safe-area-inset-bottom,0px)
    );

  min-width:190px;

  min-height:50px;

  font-size:16px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.35);
}

#startGame.hidden{
  display:none;
}

@media(max-width:600px){

  .panel{
    padding:20px;
  }

  .panel-title{
    font-size:22px;
  }

  #gameTitle{
    font-size:13px;
  }

  #turnText{
    font-size:12px;
  }

  #bottomBar button{
    padding:0 12px;
    font-size:12px;
  }
}
</style>

   Init
========================================================= */

/* =========================================================
   Init Three
========================================================= */

function init(){

  scene =
    new THREE.Scene();

  scene.background =
    new THREE.Color(
      0x15110d
    );


  camera =
    new THREE.PerspectiveCamera(

      CAMERA_FOV,

      window.innerWidth /
      window.innerHeight,

      0.1,

      100

    );


  camera.position.set(

    0,

    CAMERA_Y,

    CAMERA_Z

  );


  camera.lookAt(
    0,
    0,
    0
  );


  renderer =
    new THREE.WebGLRenderer({

      antialias:true,

      alpha:false

    });


  renderer.setPixelRatio(

    Math.min(
      window.devicePixelRatio,
      2
    )

  );


  renderer.setSize(

    window.innerWidth,
    window.innerHeight

  );


  renderer.shadowMap.enabled =
    true;


  renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


  document
    .getElementById('game')
    .appendChild(
      renderer.domElement
    );


  const ambient =
    new THREE.AmbientLight(
      0xffffff,
      1.9
    );


  scene.add(
    ambient
  );


  const light =
    new THREE.DirectionalLight(
      0xffffff,
      2.7
    );


  light.position.set(
    5,
    15,
    9
  );


  light.castShadow =
    true;


  scene.add(
    light
  );


  createBoard();


  piecesGroup =
    new THREE.Group();


  scene.add(
    piecesGroup
  );


  raycaster =
    new THREE.Raycaster();


  pointer =
    new THREE.Vector2();


  renderer.domElement.addEventListener(
    'pointerdown',
    onPointerDown
  );


  window.addEventListener(
    'resize',
    resize
  );


  animate();

}


/* =========================================================
   Board
========================================================= */

function createBoard(){

  boardGroup =
    new THREE.Group();


  scene.add(
    boardGroup
  );


  const board =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        9.7,
        .55,
        10.7
      ),

      new THREE.MeshStandardMaterial({

        color:0x6b3f1f,

        roughness:.66

      })

    );


  board.position.y =
    -.35;


  board.receiveShadow =
    true;


  boardGroup.add(
    board
  );


  const lineMaterial =
    new THREE.LineBasicMaterial({

      color:0x1f1008

    });


  /* horizontal */

  for(
    let y=0;
    y<10;
    y++
  ){

    const z =
      BOARD.top-y;


    const geometry =
      new THREE.BufferGeometry()
        .setFromPoints([

          new THREE.Vector3(
            BOARD.left,
            0,
            z
          ),

          new THREE.Vector3(
            BOARD.right,
            0,
            z
          )

        ]);


    boardGroup.add(

      new THREE.Line(
        geometry,
        lineMaterial
      )

    );

  }


  /* vertical */

  for(
    let x=0;
    x<9;
    x++
  ){

    const xx =
      BOARD.left+x;


    const geometry =
      new THREE.BufferGeometry()
        .setFromPoints([

          new THREE.Vector3(
            xx,
            0,
            BOARD.top
          ),

          new THREE.Vector3(
            xx,
            0,
            BOARD.bottom
          )

        ]);


    boardGroup.add(

      new THREE.Line(
        geometry,
        lineMaterial
      )

    );

  }


  addPalace(0);
  addPalace(7);

  createRiver();

  createStars();

}


/* =========================================================
   Palace
========================================================= */

function addPalace(startY){

  const material =
    new THREE.LineBasicMaterial({

      color:0x2a1409

    });


  const z1 =
    BOARD.top-startY;


  const z2 =
    BOARD.top-startY-2;


  const a =
    new THREE.Vector3(
      BOARD.left+3,
      .02,
      z1
    );


  const b =
    new THREE.Vector3(
      BOARD.left+5,
      .02,
      z2
    );


  const c =
    new THREE.Vector3(
      BOARD.left+5,
      .02,
      z1
    );


  const d =
    new THREE.Vector3(
      BOARD.left+3,
      .02,
      z2
    );


  boardGroup.add(

    new THREE.Line(

      new THREE.BufferGeometry()
        .setFromPoints([a,b]),

      material

    )

  );


  boardGroup.add(

    new THREE.Line(

      new THREE.BufferGeometry()
        .setFromPoints([c,d]),

      material

    )

  );

}


/* =========================================================
   River
========================================================= */

function createRiver(){

  const river =
    new THREE.Mesh(

      new THREE.PlaneGeometry(
        8.1,
        1.75
      ),

      new THREE.MeshStandardMaterial({

        color:0x754a25,

        roughness:.85

      })

    );


  river.rotation.x =
    -Math.PI/2;


  river.position.set(
    0,
    .015,
    .5
  );


  boardGroup.add(
    river
  );


  createRiverText(
    '楚河',
    -2.2
  );


  createRiverText(
    '漢界',
    2.2
  );

}


/* =========================================================
   River text
========================================================= */

function createRiverText(
  text,
  x
){

  const canvas =
    document.createElement(
      'canvas'
    );


  canvas.width =
    512;


  canvas.height =
    160;


  const ctx =
    canvas.getContext('2d');


  ctx.clearRect(
    0,
    0,
    512,
    160
  );


  ctx.fillStyle =
    '#28160b';


  ctx.font =
    'bold 110px "Noto Serif TC","Noto Sans TC",serif';


  ctx.textAlign =
    'center';


  ctx.textBaseline =
    'middle';


  ctx.fillText(
    text,
    256,
    80
  );


  const texture =
    new THREE.CanvasTexture(
      canvas
    );


  texture.needsUpdate =
    true;


  const mesh =
    new THREE.Mesh(

      new THREE.PlaneGeometry(
        1.8,
        .56
      ),

      new THREE.MeshBasicMaterial({

        map:texture,

        transparent:true

      })

    );


  mesh.rotation.x =
    -Math.PI/2;


  mesh.position.set(
    x,
    .04,
    .5
  );


  boardGroup.add(
    mesh
  );

}


/* =========================================================
   Stars
========================================================= */

function createStars(){

  const positions = [

    [1,2],
    [7,2],

    [1,7],
    [7,7],

    [0,3],
    [2,3],
    [4,3],
    [6,3],
    [8,3],

    [0,6],
    [2,6],
    [4,6],
    [6,6],
    [8,6]

  ];


  const material =
    new THREE.MeshStandardMaterial({

      color:0x241209

    });


  for(
    const [x,y]
    of positions
  ){

    const dot =
      new THREE.Mesh(

        new THREE.CylinderGeometry(
          .055,
          .055,
          .02,
          12
        ),

        material

      );


    dot.position.set(

      BOARD.left+x,

      .02,

      BOARD.top-y

    );


    boardGroup.add(
      dot
    );

  }

}


/* =========================================================
   Reset
========================================================= */

function resetGame(){

  pieces =
    structuredClone(
      PIECES
    );


  currentTurn =
    'red';


  selectedId =
    null;


  gameOver =
    false;


  aiThinking =
    false;


  renderPieces();

  updateTurn();

  setMsg(
    gameStarted
      ? '紅方回合'
      : '棋局準備完成'
  );

  document
    .getElementById(
      'gameOver'
    )
    .classList
    .remove(
      'on'
    );

}


/* =========================================================
   Render
========================================================= */

function renderPieces(){

  while(
    piecesGroup.children.length
  ){

    const obj =
      piecesGroup.children.pop();


    obj.traverse(
      child=>{

        if(
          child.geometry
        )
          child.geometry.dispose();


        if(
          child.material
        ){

          if(
            Array.isArray(
              child.material
            )
          ){

            child.material.forEach(
              m=>m.dispose()
            );

          }else{

            child.material.dispose();

          }

        }

      }
    );

  }


  for(
    const piece
    of pieces
  ){

    const mesh =
      createPiece(
        piece
      );


    mesh.userData.pieceId =
      piece.id;


    piecesGroup.add(
      mesh
    );


    setPiecePosition(
      mesh,
      piece
    );

  }

}


/* =========================================================
   Create piece
========================================================= */

function createPiece(
  piece
){

  const group =
    new THREE.Group();


  const red =
    piece.color === 'red';


  const bodyColor =
    red
      ? 0xb22d24
      : 0x222222;


  const edgeColor =
    red
      ? 0xf0a25a
      : 0xbebebe;


  const body =
    new THREE.Mesh(

      new THREE.CylinderGeometry(

        PIECE_RADIUS,

        PIECE_RADIUS,

        PIECE_HEIGHT,

        48

      ),

      new THREE.MeshStandardMaterial({

        color:bodyColor,

        roughness:.28,

        metalness:.12

      })

    );


  body.castShadow =
    true;


  group.add(
    body
  );


  const top =
    new THREE.Mesh(

      new THREE.CylinderGeometry(

        PIECE_RADIUS*.91,

        PIECE_RADIUS*.91,

        .026,

        48

      ),

      new THREE.MeshStandardMaterial({

        color:edgeColor,

        roughness:.42

      })

    );


  top.position.y =
    PIECE_HEIGHT/2+.015;


  group.add(
    top
  );


  const text =
    createPieceText(

      pieceText[
        piece.color
      ][
        piece.type
      ],

      piece.color

    );


  text.position.y =
    PIECE_HEIGHT/2+.035;


  text.rotation.x =
    -Math.PI/2;


  text.scale.set(
    .63,
    .63,
    .63
  );


  group.add(
    text
  );


  return group;

}


/* =========================================================
   Piece text
========================================================= */

function createPieceText(
  text,
  color
){

  const canvas =
    document.createElement(
      'canvas'
    );


  canvas.width =
    256;


  canvas.height =
    256;


  const ctx =
    canvas.getContext(
      '2d'
    );


  ctx.clearRect(
    0,
    0,
    256,
    256
  );


  ctx.textAlign =
    'center';


  ctx.textBaseline =
    'middle';


  ctx.font =
    'bold 150px "Noto Serif TC","Noto Sans TC",serif';


  ctx.fillStyle =
    color === 'red'
      ? '#7c160f'
      : '#111';


  ctx.fillText(
    text,
    128,
    128
  );


  const texture =
    new THREE.CanvasTexture(
      canvas
    );


  texture.needsUpdate =
    true;


  return new THREE.Mesh(

    new THREE.PlaneGeometry(
      .75,
      .75
    ),

    new THREE.MeshBasicMaterial({

      map:texture,

      transparent:true

    })

  );

}


/* =========================================================
   Position
========================================================= */

function setPiecePosition(
  mesh,
  piece
){

  mesh.position.set(

    BOARD.left+piece.x,

    .18,

    BOARD.top-piece.y

  );

}


/* =========================================================
   Touch
========================================================= */

function onPointerDown(
  event
){

  if(
    !gameStarted ||
    gameOver ||
    aiThinking
  )
    return;


  if(
    gameMode === 'online' &&
    !isMyTurn()
  ){

    setMsg(
      '現在不是你的回合'
    );

    return;

  }


  const rect =
    renderer.domElement
      .getBoundingClientRect();


  pointer.x =
    (
      (
        event.clientX -
        rect.left
      ) /
      rect.width
    )*2-1;


  pointer.y =
    -(
      (
        event.clientY -
        rect.top
      ) /
      rect.height
    )*2+1;


  raycaster.setFromCamera(
    pointer,
    camera
  );


  const hits =
    raycaster.intersectObjects(
      piecesGroup.children,
      true
    );


  if(
    hits.length
  ){

    let obj =
      hits[0].object;


    while(
      obj.parent &&
      !obj.userData.pieceId
    ){

      obj =
        obj.parent;

    }


    if(
      obj.userData.pieceId
    ){

      clickPiece(
        obj.userData.pieceId
      );

      return;

    }

  }


  if(
    selectedId
  ){

    const boardHits =
      raycaster.intersectObject(
        boardGroup,
        true
      );


    if(
      boardHits.length
    ){

      const pos =
        worldToBoard(
          boardHits[0].point
        );


      if(
        pos
      ){

        makeMoveFromUser(
          selectedId,
          pos.x,
          pos.y
        );

      }

    }

  }

}


/* =========================================================
   Piece click
========================================================= */

function clickPiece(
  id
){

  const piece =
    findPiece(id);


  if(
    !piece
  )
    return;


  if(
    gameMode === 'online' &&
    !isMyTurn()
  ){

    setMsg(
      '現在不是你的回合'
    );

    return;

  }


  if(
    piece.color === currentTurn
  ){

    selectedId =
      piece.id;


    setMsg(
      `已選擇 ${
        pieceText[
          piece.color
        ][
          piece.type
        ]
      }`
    );


    return;

  }


  if(
    selectedId
  ){

    makeMoveFromUser(
      selectedId,
      piece.x,
      piece.y
    );

  }

}


/* =========================================================
   User move
========================================================= */

function makeMoveFromUser(
  id,
  x,
  y
){

  const piece =
    findPiece(id);


  if(
    !piece
  )
    return;


  const result =
    applyMove(
      pieces,
      piece,
      x,
      y
    );


  if(
    !result.ok
  ){

    setMsg(
      result.reason ||
      '這一步不能走'
    );

    return;

  }


  pieces =
    result.pieces;


  selectedId =
    null;


  currentTurn =
    opposite(
      currentTurn
    );


  renderPieces();

  updateTurn();


  if(
    gameMode === 'online'
  ){

    sendMove({

      pieceId:id,

      x,

      y

    });

  }


  checkAfterMove();

}


/* =========================================================
   Apply move
========================================================= */

function applyMove(
  state,
  piece,
  tx,
  ty
){

  if(
    tx<0 ||
    tx>8 ||
    ty<0 ||
    ty>9
  ){

    return {
      ok:false,
      reason:'不能走到棋盤外'
    };

  }


  if(
    piece.color !==
    currentTurn
  ){

    return {
      ok:false,
      reason:'不是你的回合'
    };

  }


  if(
    !basicMoveLegal(
      state,
      piece,
      tx,
      ty
    )
  ){

    return {
      ok:false,
      reason:'這一步不符合象棋規則'
    };

  }


  const target =
    getPieceAtState(
      state,
      tx,
      ty
    );


  let next =
    structuredClone(
      state
    );


  const moving =
    next.find(
      p=>p.id===piece.id
    );


  if(
    target
  ){

    next =
      next.filter(
        p=>p.id!==target.id
      );

  }


  moving.x =
    tx;

  moving.y =
    ty;


  /*
    不允許自己的將被吃。
  */

  if(
    isInCheck(
      next,
      piece.color
    )
  ){

    return {
      ok:false,
      reason:'不能讓自己的將受到攻擊'
    };

  }


  /*
    將帥照面。
  */

  if(
    generalsFace(
      next
    )
  ){

    return {
      ok:false,
      reason:'將帥不能照面'
    };

  }


  return {
    ok:true,
    pieces:next
  };

}


/* =========================================================
   Basic move rules
========================================================= */

function basicMoveLegal(
  state,
  piece,
  tx,
  ty
){

  const dx =
    tx-piece.x;

  const dy =
    ty-piece.y;

  const ax =
    Math.abs(dx);

  const ay =
    Math.abs(dy);


  const target =
    getPieceAtState(
      state,
      tx,
      ty
    );


  if(
    target &&
    target.color ===
    piece.color
  ){

    return false;

  }


  switch(
    piece.type
  ){

    case 'general':{

      if(
        ax+ay!==1
      )
        return false;


      return inPalace(
        piece.color,
        tx,
        ty
      );

    }


    case 'advisor':{

      if(
        ax!==1 ||
        ay!==1
      )
        return false;


      return inPalace(
        piece.color,
        tx,
        ty
      );

    }


    case 'elephant':{

      if(
        ax!==2 ||
        ay!==2
      )
        return false;


      if(
        piece.color==='red' &&
        ty>4
      )
        return false;


      if(
        piece.color==='black' &&
        ty<5
      )
        return false;


      const eyeX =
        piece.x+
        dx/2;


      const eyeY =
        piece.y+
        dy/2;


      return !getPieceAtState(
        state,
        eyeX,
        eyeY
      );

    }


    case 'horse':{

      if(
        !(
          (
            ax===1 &&
            ay===2
          ) ||
          (
            ax===2 &&
            ay===1
          )
        )
      )
        return false;


      let legX;
      let legY;


      if(
        ax===2
      ){

        legX =
          piece.x+
          Math.sign(dx);

        legY =
          piece.y;

      }else{

        legX =
          piece.x;

        legY =
          piece.y+
          Math.sign(dy);

      }


      return !getPieceAtState(
        state,
        legX,
        legY
      );

    }


    case 'rook':{

      if(
        dx!==0 &&
        dy!==0
      )
        return false;


      return countBetween(
        state,
        piece.x,
        piece.y,
        tx,
        ty
      )===0;

    }


    case 'cannon':{

      if(
        dx!==0 &&
        dy!==0
      )
        return false;


      const count =
        countBetween(
          state,
          piece.x,
          piece.y,
          tx,
          ty
        );


      if(
        target
      ){

        return count===1;

      }


      return count===0;

    }


    case 'pawn':{

      const forward =
        piece.color==='red'
          ? 1
          : -1;


      if(
        dx===0 &&
        dy===forward
      ){

        return true;

      }


      const crossed =
        piece.color==='red'
          ? piece.y>=5
          : piece.y<=4;


      if(
        crossed &&
        ax===1 &&
        ay===0
      ){

        return true;

      }


      return false;

    }

  }


  return false;

}


/* =========================================================
   Palace
========================================================= */

function inPalace(
  color,
  x,
  y
){

  if(
    x<3 ||
    x>5
  )
    return false;


  if(
    color==='red'
  ){

    return y>=0 && y<=2;

  }


  return y>=7 && y<=9;

}


/* =========================================================
   Count between
========================================================= */

function countBetween(
  state,
  x1,
  y1,
  x2,
  y2
){

  const dx =
    Math.sign(
      x2-x1
    );

  const dy =
    Math.sign(
      y2-y1
    );


  let x =
    x1+dx;

  let y =
    y1+dy;


  let count=0;


  while(
    x!==x2 ||
    y!==y2
  ){

    if(
      getPieceAtState(
        state,
        x,
        y
      )
    ){

      count++;

    }


    x+=dx;
    y+=dy;

  }


  return count;

}


/* =========================================================
   Get piece
========================================================= */

function getPieceAtState(
  state,
  x,
  y
){

  return state.find(
    p=>
      p.x===x &&
      p.y===y
  );

}


function findPiece(
  id
){

  return pieces.find(
    p=>p.id===id
  );

}


/* =========================================================
   Check
========================================================= */

function isInCheck(
  state,
  color
){

  const general =
    state.find(
      p=>
        p.type==='general' &&
        p.color===color
    );


  if(
    !general
  )
    return true;


  const enemy =
    opposite(color);


  for(
    const p
    of state.filter(
      p=>p.color===enemy
    )
  ){

    if(
      basicMoveLegalIgnoringTurn(
        state,
        p,
        general.x,
        general.y
      )
    ){

      return true;

    }

  }


  return false;

}


/* =========================================================
   Rule helper ignoring turn
========================================================= */

function basicMoveLegalIgnoringTurn(
  state,
  piece,
  tx,
  ty
){

  const dx =
    tx-piece.x;

  const dy =
    ty-piece.y;

  const ax =
    Math.abs(dx);

  const ay =
    Math.abs(dy);


  const target =
    getPieceAtState(
      state,
      tx,
      ty
    );


  if(
    target &&
    target.color===piece.color
  )
    return false;


  switch(
    piece.type
  ){

    case 'general':

      return (
        ax+ay===1 &&
        inPalace(
          piece.color,
          tx,
          ty
        )
      );


    case 'advisor':

      return (
        ax===1 &&
        ay===1 &&
        inPalace(
          piece.color,
          tx,
          ty
        )
      );


    case 'elephant':{

      if(
        ax!==2 ||
        ay!==2
      )
        return false;


      if(
        piece.color==='red' &&
        ty>4
      )
        return false;


      if(
        piece.color==='black' &&
        ty<5
      )
        return false;


      return !getPieceAtState(
        state,
        piece.x+dx/2,
        piece.y+dy/2
      );

    }


    case 'horse':{

      if(
        !(
          (
            ax===1 &&
            ay===2
          ) ||
          (
            ax===2 &&
            ay===1
          )
        )
      )
        return false;


      let lx;
      let ly;


      if(
        ax===2
      ){

        lx =
          piece.x+
          Math.sign(dx);

        ly =
          piece.y;

      }else{

        lx =
          piece.x;

        ly =
          piece.y+
          Math.sign(dy);

      }


      return !getPieceAtState(
        state,
        lx,
        ly
      );

    }


    case 'rook':

      return (
        (
          dx===0 ||
          dy===0
        ) &&
        countBetween(
          state,
          piece.x,
          piece.y,
          tx,
          ty
        )===0
      );


    case 'cannon':{

      if(
        dx!==0 &&
        dy!==0
      )
        return false;


      const count =
        countBetween(
          state,
          piece.x,
          piece.y,
          tx,
          ty
        );


      return target
        ? count===1
        : count===0;

    }


    case 'pawn':{

      const forward =
        piece.color==='red'
          ? 1
          : -1;


      if(
        dx===0 &&
        dy===forward
      )
        return true;


      const crossed =
        piece.color==='red'
          ? piece.y>=5
          : piece.y<=4;


      return (
        crossed &&
        ax===1 &&
        ay===0
      );

    }

  }


  return false;

}


/* =========================================================
   Generals facing
========================================================= */

function generalsFace(
  state
){

  const red =
    state.find(
      p=>
        p.type==='general' &&
        p.color==='red'
    );


  const black =
    state.find(
      p=>
        p.type==='general' &&
        p.color==='black'
    );


  if(
    !red ||
    !black
  )
    return true;


  if(
    red.x!==black.x
  )
    return false;


  return countBetween(
    state,
    red.x,
    red.y,
    black.x,
    black.y
  )===0;

}


/* =========================================================
   Legal moves
========================================================= */

function getLegalMoves(
  state,
  color
){

  const moves=[];


  for(
    const piece
    of state.filter(
      p=>p.color===color
    )
  ){

    for(
      let y=0;
      y<10;
      y++
    ){

      for(
        let x=0;
        x<9;
        x++
      ){

        if(
          !basicMoveLegal(
            state,
            piece,
            x,
            y
          )
        )
          continue;


        const target =
          getPieceAtState(
            state,
            x,
            y
          );


        const next =
          structuredClone(
            state
          );


        if(
          target
        ){

          const index =
            next.findIndex(
              p=>p.id===target.id
            );


          if(
            index>=0
          )
            next.splice(
              index,
              1
            );

        }


        const moving =
          next.find(
            p=>p.id===piece.id
          );


        moving.x=x;
        moving.y=y;


        if(
          isInCheck(
            next,
            color
          )
        )
          continue;


        if(
          generalsFace(
            next
          )
        )
          continue;


        moves.push({

          pieceId:
            piece.id,

          x,

          y

        });

      }

    }

  }


  return moves;

}


/* =========================================================
   After move
========================================================= */

function checkAfterMove(){

  const enemy =
    currentTurn;


  const legal =
    getLegalMoves(
      pieces,
      enemy
    );


  if(
    legal.length===0
  ){

    if(
      isInCheck(
        pieces,
        enemy
      )
    ){

      endGame(

        enemy==='red'
          ? '黑方勝利・紅方被將死'
          : '紅方勝利・黑方被將死'

      );

    }else{

      endGame(
        '和棋・困斃'
      );

    }


    return;

  }


  if(
    isInCheck(
      pieces,
      enemy
    )
  ){

    setMsg(
      enemy==='red'
        ? '紅方被將軍'
        : '黑方被將軍'
    );

  }else{

    setMsg(
      enemy==='red'
        ? '紅方回合'
        : '黑方回合'
    );

  }


  /*
    電腦回合
  */

  if(
    gameMode==='ai' &&
    currentTurn==='black' &&
    !gameOver
  ){

    computerMove();

  }

}


/* =========================================================
   AI
========================================================= */

function computerMove(){

  if(
    aiThinking ||
    gameOver
  )
    return;


  aiThinking =
    true;


  setMsg(
    '電腦思考中…'
  );


  setTimeout(
    ()=>{

      const move =
        chooseAIMove(
          pieces
        );


      if(
        !move
      ){

        aiThinking=false;

        return;

      }


      applyComputerMove(
        move
      );


    },
    350
  );

}


/* =========================================================
   AI move
========================================================= */

function chooseAIMove(
  state
){

  const moves =
    getLegalMoves(
      state,
      'black'
    );


  if(
    !moves.length
  )
    return null;


  /*
    優先吃大子。
    同時加入一點隨機，
    避免每次完全一樣。
  */

  const scored =
    moves.map(
      move=>{

        const target =
          getPieceAtState(
            state,
            move.x,
            move.y
          );


        let score =
          Math.random()*20;


        if(
          target
        ){

          score +=
            pieceValue(
              target.type
            )*10;

        }


        const next =
          simulateMove(
            state,
            move
          );


        if(
          isInCheck(
            next,
            'red'
          )
        ){

          score+=120;

        }


        if(
          isInCheck(
            next,
            'black'
          )
        ){

          score-=60;

        }


        return {
          move,
          score
        };

      }
    );


  scored.sort(
    (a,b)=>
      b.score-a.score
  );


  return scored[0].move;

}


/* =========================================================
   Simulate
========================================================= */

function simulateMove(
  state,
  move
){

  const next =
    structuredClone(
      state
    );


  const target =
    next.find(
      p=>
        p.x===move.x &&
        p.y===move.y
    );


  if(
    target
  ){

    const index =
      next.findIndex(
        p=>p.id===target.id
      );


    if(
      index>=0
    )
      next.splice(
        index,
        1
      );

  }


  const moving =
    next.find(
      p=>p.id===move.pieceId
    );


  moving.x =
    move.x;

  moving.y =
    move.y;


  return next;

}


/* =========================================================
   Apply AI move
========================================================= */

function applyComputerMove(
  move
){

  pieces =
    simulateMove(
      pieces,
      move
    );


  currentTurn =
    'red';


  selectedId =
    null;


  aiThinking =
    false;


  renderPieces();

  updateTurn();

  checkAfterMove();

}


/* =========================================================
   Piece value
========================================================= */

function pieceValue(
  type
){

  switch(type){

    case 'general':
      return 10000;

    case 'rook':
      return 900;

    case 'cannon':
      return 450;

    case 'horse':
      return 400;

    case 'elephant':
      return 200;

    case 'advisor':
      return 200;

    case 'pawn':
      return 100;

  }


  return 0;

}


/* =========================================================
   Online
========================================================= */

function roomId(){

  return Math.random()
    .toString(36)
    .slice(2,8)
    .toUpperCase();

}


/* =========================================================
   Host
========================================================= */

function hostRoom(){

  closePeer();


  const id =
    'AV'+roomId();


  document
    .getElementById(
      'roomCode'
    )
    .textContent =
      id;


  document
    .getElementById(
      'roomHint'
    )
    .textContent =
      '正在建立房間…';


  net.role =
    'host';


  net.room =
    id;


  gameMode =
    'online';


  net.peer =
    new Peer(id);


  net.peer.on(
    'open',
    ()=>{

      document
        .getElementById(
          'roomHint'
        )
        .textContent =
          '房間已建立，把代碼給對方。';

      setMsg(
        '等待黑方加入'
      );

    }
  );


  net.peer.on(
    'connection',
    conn=>{

      net.conn =
        conn;


      conn.on(
        'open',
        ()=>{

          /*
            主機是權威狀態。
          */

          conn.send({

            t:'sync',

            state:{
              pieces,
              currentTurn,
              gameOver
            }

          });


          gameStarted =
            true;


          document
            .getElementById(
              'roomPanel'
            )
            .classList
            .remove(
              'on'
            );


          document
            .getElementById(
              'startGame'
            )
            .classList
            .add(
              'hidden'
            );


          setMsg(
            '黑方已加入，紅方先走'
          );

        }
      );


      conn.on(
        'data',
        onNetworkData
      );


      conn.on(
        'close',
        ()=>{

          setMsg(
            '黑方已離線'
          );

        }
      );

    }
  );


  net.peer.on(
    'error',
    e=>{

      document
        .getElementById(
          'roomHint'
        )
        .textContent =
          '連線錯誤：'+
          e.type;

    }
  );

}


/* =========================================================
   Join
========================================================= */

function joinRoom(){

  const id =
    document
      .getElementById(
        'joinId'
      )
      .value
      .trim()
      .toUpperCase();


  if(
    !/^AV[A-Z0-9]{6}$/.test(
      id
    )
  ){

    document
      .getElementById(
        'roomHint'
      )
      .textContent =
        '房間代碼必須是完整 8 碼，例如 AV7K29PQ。';

    return;

  }


  closePeer();


  gameMode =
    'online';


  net.role =
    'guest';


  net.room =
    id;


  net.peer =
    new Peer();


  document
    .getElementById(
      'roomHint'
    )
    .textContent =
      '正在加入房間…';


  net.peer.on(
    'open',
    ()=>{

      const conn =
        net.peer.connect(

          id,

          {
            reliable:true
          }

        );


      net.conn =
        conn;


      conn.on(
        'open',
        ()=>{

          document
            .getElementById(
              'roomPanel'
            )
            .classList
            .remove(
              'on'
            );


          document
            .getElementById(
              'startGame'
            )
            .classList
            .add(
              'hidden'
            );


          gameStarted =
            true;


          setMsg(
            '已連線，等待紅方'
          );

        }
      );


      conn.on(
        'data',
        onNetworkData
      );


      conn.on(
        'close',
        ()=>{

          setMsg(
            '紅方已離線'
          );

        }
      );

    }
  );


  net.peer.on(
    'error',
    e=>{

      document
        .getElementById(
          'roomHint'
        )
        .textContent =
          '加入失敗：'+
          e.type;

    }
  );

}


/* =========================================================
   Network data
========================================================= */

function onNetworkData(
  data
){

  if(
    !data
  )
    return;


  if(
    data.t==='sync'
  ){

    applySync(
      data.state
    );

    return;

  }


  if(
    data.t==='move'
  ){

    applyRemoteMove(
      data
    );

  }

}


/* =========================================================
   Sync
========================================================= */

function applySync(
  state
){

  if(
    !state ||
    !Array.isArray(
      state.pieces
    )
  )
    return;


  pieces =
    structuredClone(
      state.pieces
    );


  currentTurn =
    state.currentTurn;


  gameOver =
    state.gameOver;


  selectedId =
    null;


  renderPieces();

  updateTurn();

}


/* =========================================================
   Send move
========================================================= */

function sendMove(
  move
){

  if(
    gameMode!=='online'
  )
    return;


  if(
    !net.conn ||
    !net.conn.open
  )
    return;


  net.conn.send({

    t:'move',

    pieceId:
      move.pieceId,

    x:
      move.x,

    y:
      move.y

  });

}


/* =========================================================
   Remote move
========================================================= */

function applyRemoteMove(
  data
){

  const piece =
    pieces.find(
      p=>
        p.id===
        data.pieceId
    );


  if(
    !piece
  )
    return;


  const next =
    simulateMove(
      pieces,
      data
    );


  /*
    線上玩家收到的走法
    仍然檢查合法性。
  */

  if(
    !basicMoveLegal(
      pieces,
      piece,
      data.x,
      data.y
    )
  )
    return;


  if(
    isInCheck(
      next,
      piece.color
    )
  )
    return;


  if(
    generalsFace(
      next
    )
  )
    return;


  pieces =
    next;


  currentTurn =
    opposite(
      currentTurn
    );


  selectedId =
    null;


  renderPieces();

  updateTurn();

  checkAfterMove();

}


/* =========================================================
   My turn
========================================================= */

function isMyTurn(){

  if(
    gameMode!=='online'
  )
    return true;


  if(
    net.role==='host'
  )
    return currentTurn==='red';


  if(
    net.role==='guest'
  )
    return currentTurn==='black';


  return false;

}


/* =========================================================
   Close Peer
========================================================= */

function closePeer(){

  try{

    if(
      net.conn
    )
      net.conn.close();

  }catch{}


  try{

    if(
      net.peer
    )
      net.peer.destroy();

  }catch{}


  net.peer=null;
  net.conn=null;
  net.role=null;
  net.room=null;

}


/* =========================================================
   End game
========================================================= */

function endGame(
  text
){

  gameOver =
    true;


  document
    .getElementById(
      'gameOverTitle'
    )
    .textContent =
      text;


  document
    .getElementById(
      'gameOver'
    )
    .classList
    .add(
      'on'
    );


  setMsg(
    text
  );

}


/* =========================================================
   Turn
========================================================= */

function updateTurn(){

  const el =
    document.getElementById(
      'turnText'
    );


  if(
    gameMode==='ai'
  ){

    el.textContent =
      currentTurn==='red'
        ? '你：紅方'
        : '電腦：黑方';

    return;

  }


  if(
    gameMode==='online'
  ){

    el.textContent =
      currentTurn==='red'
        ? '紅方回合'
        : '黑方回合';

    return;

  }


  el.textContent =
    currentTurn==='red'
      ? '紅方回合'
      : '黑方回合';

}


/* =========================================================
   Opposite
========================================================= */

function opposite(
  color
){

  return color==='red'
    ? 'black'
    : 'red';

}


/* =========================================================
   World -> Board
========================================================= */

function worldToBoard(
  point
){

  /*
    因為這版沒有把 boardGroup
    做 scale，所以世界座標直接
    對應棋盤座標。
  */

  const x =
    Math.round(
      point.x-
      BOARD.left
    );


  const y =
    Math.round(
      BOARD.top-
      point.z
    );


  if(
    x<0 ||
    x>8 ||
    y<0 ||
    y>9
  )
    return null;


  return {
    x,
    y
  };

}


/* =========================================================
   Resize
========================================================= */

function resize(){

  const w =
    window.innerWidth;


  const h =
    window.innerHeight;


  renderer.setSize(
    w,
    h,
    false
  );


  camera.aspect =
    w/h;


  camera.updateProjectionMatrix();

}


/* =========================================================
   Animation
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );


  renderer.render(
    scene,
    camera
  );

}
