<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Technical Dark Star｜真實聲音克隆測試 v3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f8;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:20px}main{max-width:760px;margin:auto;background:#fff;border:1px solid #ddd;border-radius:18px;padding:22px;box-shadow:0 8px 30px #00000010}h1{font-size:22px;margin:0 0 8px}.sub{color:#666;margin-bottom:20px}.box{border:1px solid #ddd;border-radius:14px;padding:16px;margin:14px 0}button{width:100%;min-height:52px;border:0;border-radius:12px;background:#111;color:#fff;font-size:17px;font-weight:600;touch-action:manipulation}button:disabled{opacity:.45}button.secondary{background:#eee;color:#111}textarea,input{width:100%;border:1px solid #ccc;border-radius:10px;padding:12px;font-size:16px}textarea{min-height:130px;resize:vertical}.status{white-space:pre-wrap;background:#f2f2f2;border-radius:10px;padding:12px;font-size:14px;line-height:1.5}.ok{color:#087a32}.err{color:#b00020}audio{width:100%;margin-top:12px}.small{font-size:13px;color:#666;line-height:1.5}.row{display:grid;gap:10px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main>
<h1>🎙️ Technical Dark Star｜真實聲音克隆測試 v3</h1>
<div class="sub">獨立測試頁。正式 technical-dark-star.html 不會被修改。</div>

<div class="box">
<strong>① 錄製聲音</strong>
<p class="small">先錄音，不需要先登入、不需要先碰 Supabase。iPhone 請在 HTTPS 頁面允許麥克風。</p>
<button id="rec" type="button">🎙️ 開始錄音</button>
<button id="stop" type="button" class="secondary" disabled>⏹️ 停止錄音</button>
<div id="recordState" class="status">尚未錄音</div>
<audio id="preview" controls hidden></audio>
</div>

<div class="box">
<strong>② 真實 Clone</strong>
<div class="row">
<input id="voiceName" value="Technical Dark Star Clone Test" placeholder="Voice Profile 名稱">
<input id="voiceDesc" value="Technical Dark Star 真實聲音克隆測試" placeholder="描述">
<button id="clone" type="button" disabled>🧬 建立真實 Voice Clone</button>
</div>
<div id="cloneState" class="status">等待錄音完成</div>
</div>

<div class="box">
<strong>③ 用 Clone Voice 真實合成語音</strong>
<textarea id="text">大家好，我是暗星。現在進行聲音克隆測試，請確認我的聲音、語速和自然停頓。</textarea>
<button id="speak" type="button" disabled>🔊 用 Clone Voice 說出來</button>
<div id="speakState" class="status">等待 Voice ID</div>
<audio id="audio" controls hidden></audio>
</div>

<div class="box">
<strong>測試狀態</strong>
<div id="log" class="status">v3 已載入。第一個錄音按鈕不依賴 Supabase Auth。</div>
</div>
</main>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://clcddygkaaqqtsbswgdf.supabase.co';
const FUNCTION_URL=SUPABASE_URL+'/functions/v1/technical-dark-star-voice-clone-test';
const SUPABASE_PUBLISHABLE_KEY='';
const $=id=>document.getElementById(id);
let stream=null,recorder=null,chunks=[],audioBlob=null,voiceId='';
function log(msg,cls){$('log').textContent=msg;$('log').className='status '+(cls||'');}
function pickMime(){const list=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus'];return list.find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported(x))||'';}
async function startRecording(){
 try{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('此瀏覽器不支援麥克風錄音，請使用 HTTPS 的 Safari。');
  chunks=[];audioBlob=null;
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  const mime=pickMime();
  recorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  recorder.onerror=e=>log('錄音錯誤：'+(e.error?.message||'MediaRecorder error'),'err');
  recorder.onstop=()=>{
   const type=recorder.mimeType||mime||'audio/webm';
   audioBlob=new Blob(chunks,{type});
   const objectUrl=window.URL.createObjectURL(audioBlob);
   $('preview').src=objectUrl;$('preview').hidden=false;
   $('clone').disabled=false;$('recordState').textContent='錄音完成：'+Math.round(audioBlob.size/1024)+' KB';
   log('錄音完成。現在可以按「建立真實 Voice Clone」。','ok');
   if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  };
  recorder.start(250);
  $('rec').disabled=true;$('stop').disabled=false;
  $('recordState').textContent='正在錄音……請照自然聲音說約 30–40 秒。';
  log('麥克風已啟動，正在實際錄音。','ok');
 }catch(e){log('無法開始錄音：'+(e.message||e),'err');$('recordState').textContent='錄音失敗';}
}
function stopRecording(){if(recorder&&recorder.state!=='inactive')recorder.stop();$('rec').disabled=false;$('stop').disabled=true;}
async function getClient(){
 if(!window.supabase||!window.supabase.createClient) throw new Error('Supabase JS 載入失敗');
 if(!SUPABASE_PUBLISHABLE_KEY) throw new Error('尚未提供瀏覽器端 Supabase Publishable Key；因此本頁可先完成錄音，但 Clone API 會停在這裡。');
 return window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
}
async function cloneVoice(){
 if(!audioBlob)return;
 $('clone').disabled=true;$('cloneState').textContent='正在建立真實 Voice Clone……';
 try{
  const sb=await getClient();
  let session=(await sb.auth.getSession()).data.session;
  if(!session){const r=await sb.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session;}
  if(!session?.access_token)throw new Error('無法取得 Supabase Auth session');
  const fd=new FormData();fd.append('action','clone');fd.append('name',$('voiceName').value.trim()||'Technical Dark Star Clone');fd.append('description',$('voiceDesc').value.trim());fd.append('files',audioBlob,'dark-star-voice.'+(audioBlob.type.includes('mp4')?'mp4':'webm'));
  const res=await fetch(FUNCTION_URL,{method:'POST',headers:{Authorization:'Bearer '+session.access_token},body:fd});
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||data.message||('HTTP '+res.status));
  voiceId=data.voice_id||data.voice?.voice_id||data.id;
  if(!voiceId)throw new Error('後端沒有回傳真正的 voice_id');
  $('cloneState').textContent='Clone 成功\nVoice ID：'+voiceId;$('speak').disabled=false;log('真實 Clone 已取得 Voice ID。下一步測試 TTS。','ok');
 }catch(e){$('cloneState').textContent='Clone 失敗：'+(e.message||e);log('Clone 未完成；沒有假裝成功。','err');$('clone').disabled=false;}
}
async function speak(){
 if(!voiceId)return;
 $('speak').disabled=true;$('speakState').textContent='正在呼叫真實 Clone Voice TTS……';
 try{
  const sb=await getClient();const session=(await sb.auth.getSession()).data.session;
  if(!session?.access_token)throw new Error('沒有 Supabase Auth session');
  const res=await fetch(FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({action:'speak',voice_id:voiceId,text:$('text').value,model:'eleven_multilingual_v2'})});
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||data.message||('HTTP '+res.status));
  if(!data.audio_base64)throw new Error('後端沒有回傳實際音訊');
  const bin=atob(data.audio_base64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const blob=new Blob([bytes],{type:data.mime_type||'audio/mpeg'});$('audio').src=window.URL.createObjectURL(blob);$('audio').hidden=false;$('speakState').textContent='TTS 成功：已收到實際音訊，可以播放。';log('真實 Clone Voice TTS 測試成功。','ok');
 }catch(e){$('speakState').textContent='TTS 失敗：'+(e.message||e);log('TTS 未完成。','err');}finally{$('speak').disabled=false;}
}
$('rec').addEventListener('click',startRecording);$('stop').addEventListener('click',stopRecording);$('clone').addEventListener('click',cloneVoice);$('speak').addEventListener('click',speak);
})();
</script>
</body></html>
