<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT AI Course Factory</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#080b12;color:#eef2f7}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{padding:24px 18px;border-right:1px solid #222938;background:#0b0f18}.brand{font-size:21px;font-weight:800;margin-bottom:30px}.brand small{display:block;color:#7f8aa0;font-size:11px;margin-top:5px}.nav button{width:100%;text-align:left;background:none;border:0;color:#aeb7c7;padding:13px 12px;border-radius:10px;margin:3px 0}.nav button.active,.nav button:hover{background:#171d2a;color:#fff}.main{padding:28px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:22px}.title h1{margin:0 0 7px;font-size:28px}.muted{color:#8d98aa}.status{border:1px solid #293244;border-radius:14px;padding:12px 15px;background:#0d121c;min-width:290px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#737d8d;margin-right:8px}.dot.ok{background:#4ade80}.dot.bad{background:#f87171}.dot.busy{background:#facc15}.status b{font-size:13px}.status .detail{font-size:11px;color:#8893a6;margin-top:6px}.card{background:#0e131d;border:1px solid #242c3a;border-radius:16px;padding:22px;margin-bottom:18px}.label{font-size:13px;font-weight:700;margin-bottom:10px}.idea{width:100%;min-height:150px;background:#090d15;border:1px solid #30394a;color:#fff;border-radius:12px;padding:16px;resize:vertical;outline:none}.idea:focus{border-color:#6576ff}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.level{padding:15px;border:1px solid #30394a;background:#0a0f17;color:#c6cedb;border-radius:12px;text-align:center}.level.sel{border-color:#7b86ff;background:#171d36;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid #30394a;background:#151b27;color:#fff;border-radius:10px;padding:11px 15px}.btn.primary{background:#5966ff;border-color:#5966ff}.btn:disabled{opacity:.45;cursor:not-allowed}.progress{display:none;margin-top:18px}.bar{height:8px;background:#1d2431;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#6472ff;transition:width .3s}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.step{font-size:10px;color:#727d90}.step.on{color:#fff}.step.done{color:#67e8a5}.preview{display:none}.courseHead{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.courseHead h2{margin:0 0 8px}.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{border:1px solid #30394a;border-radius:99px;padding:5px 9px;color:#b7c1d0;font-size:11px}.lesson{border:1px solid #252e3e;border-radius:14px;margin:12px 0;overflow:hidden;background:#0a0f17}.lesson summary{list-style:none;padding:17px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}.lesson summary::-webkit-details-marker{display:none}.lessonBody{padding:0 18px 20px;border-top:1px solid #242c3a}.section{margin-top:18px}.section h4{margin:0 0 9px;font-size:14px}.section p,.section li{color:#c2cad6;line-height:1.75;font-size:13px}.section ul{padding-left:20px}.prompt{background:#05080e;border:1px solid #293244;padding:13px;border-radius:10px;white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px;color:#d9e0ea}.stepsList{counter-reset:item;list-style:none;padding:0}.stepsList li{counter-increment:item;margin:8px 0;padding-left:30px;position:relative}.stepsList li:before{content:counter(item);position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:50%;background:#1d2534;text-align:center;line-height:20px;font-size:11px;color:#fff}.output{padding:12px;border:1px dashed #38445a;border-radius:10px;color:#dce3ed}.pricing{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.plan{border:1px solid #30394a;border-radius:12px;padding:14px}.plan label{display:flex;gap:8px;align-items:center;font-size:13px}.plan input[type=number]{width:100%;margin-top:10px;background:#090d15;border:1px solid #30394a;color:#fff;border-radius:8px;padding:8px}.currency{background:#090d15;color:#fff;border:1px solid #30394a;border-radius:8px;padding:8px;margin-top:10px;width:100%}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.raw{display:none;background:#05080e;border:1px solid #30394a;border-radius:10px;padding:14px;white-space:pre-wrap;overflow:auto;max-height:300px;font:12px ui-monospace,monospace;color:#c9d2df}.notice{padding:12px;border-radius:10px;background:#131a27;border:1px solid #293244;color:#aeb9c9;font-size:12px;margin-top:10px}.error{background:#271318;border-color:#63313d;color:#ffb4bd}.success{background:#0e2419;border-color:#245f3a;color:#9af0b8}.empty{text-align:center;padding:45px;color:#7e899c}.hidden{display:none!important}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:16px}.levels,.pricing{grid-template-columns:repeat(2,1fr)}.top{flex-direction:column}.status{width:100%}.steps{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand">AIVAULT<small>AI COURSE FACTORY</small></div><nav class="nav"><button class="active">建立課程</button><button>我的課程</button><button>課程內容</button><button>商品化</button><button>發行管理</button></nav></aside><main class="main"><div class="top"><div class="title"><h1>AI 課程工廠</h1><div class="muted">輸入一個想法，讓 AI 自動設計完整可教學、可販售的課程。</div></div><div class="status"><div><span id="dot" class="dot"></span><b id="statusText">AI 尚未檢測</b></div><div id="statusDetail" class="detail">請先測試 AI Gateway 連線</div><button class="btn" style="margin-top:9px" id="testBtn">測試 AI 連線</button></div></div>
<section id="builder"><div class="card"><div class="label">你想製作什麼課程？</div><textarea id="idea" class="idea" placeholder="例如：我想做一門教完全沒有經驗的人，用 AI 製作短影片並完成第一支可發布作品的課程。"></textarea><div style="margin-top:18px" class="label">課程程度</div><div class="levels"><button class="level" data-level="初學">初學</button><button class="level sel" data-level="入門">入門</button><button class="level" data-level="專業">專業</button><button class="level" data-level="研究級">研究級</button></div><div class="actions"><button id="generateBtn" class="btn primary" disabled>AI 生成完整課程</button><button id="draftBtn" class="btn">儲存草稿</button></div><div id="progress" class="progress"><div class="bar"><div id="fill" class="fill"></div></div><div class="steps"><div id="s1" class="step">① AI 連線</div><div id="s2" class="step">② 分析需求</div><div id="s3" class="step">③ 建立課程</div><div id="s4" class="step">④ 完整性驗證</div><div id="s5" class="step">⑤ 建立預覽</div></div></div><div id="message"></div></div></section>
<section id="preview" class="preview"><div class="card"><div class="courseHead"><div><h2 id="courseTitle">—</h2><div id="courseDesc" class="muted">—</div><div id="badges" class="badges" style="margin-top:12px"></div></div><div class="toolbar"><button class="btn" id="backBtn">重新設計</button><button class="btn" id="pptBtn">下載 PPT</button><button class="btn" id="pdfBtn">下載 PDF</button><button class="btn" id="wordBtn">下載 Word</button></div></div></div><div class="card"><h3>課程架構</h3><div id="overview"></div></div><div class="card"><h3>完整課程內容</h3><div id="lessons"></div></div><div class="card"><h3>商品化</h3><div class="pricing"><div class="plan"><label><input type="checkbox" data-plan="free"> 免費</label></div><div class="plan"><label><input type="checkbox" data-plan="one_time" checked> 一次購買</label><input data-price="one_time" type="number" min="0" placeholder="價格"></div><div class="plan"><label><input type="checkbox" data-plan="monthly"> 月租</label><input data-price="monthly" type="number" min="0" placeholder="每月價格"></div><div class="plan"><label><input type="checkbox" data-plan="yearly"> 年租</label><input data-price="yearly" type="number" min="0" placeholder="每年價格"></div></div><select id="currency" class="currency"><option>TWD</option><option>CNY</option><option>USD</option><option>HKD</option><option>JPY</option><option>KRW</option><option>SGD</option><option>MYR</option><option>EUR</option><option>GBP</option><option>Other</option></select><div class="actions"><button class="btn" id="saveBtn">儲存課程</button><button class="btn" id="reviewBtn">送審</button><button class="btn primary" id="publishBtn">發行到會員學習平台</button></div></div><div class="card"><div class="label">AI 原始回應（除錯資訊）</div><button class="btn" id="rawBtn">顯示／隱藏</button><pre id="raw" class="raw"></pre></div></section></main></div>
<script>
const SUPABASE_URL='https://clcddygkaaqqtsbswgdf.supabase.co';
const SUPABASE_ANON_KEY='';
const GATEWAY_URL=`${SUPABASE_URL}/functions/v1/ai-gateway`;
const COURSE_CREATOR_URL=`${SUPABASE_URL}/functions/v1/course-creator`;
let level='入門',course=null,rawResponse=null;
const $=id=>document.getElementById(id);
function setStatus(type,text,detail){$('dot').className='dot '+type;$('statusText').textContent=text;$('statusDetail').textContent=detail}
function headers(){const h={'Content-Type':'application/json'};if(SUPABASE_ANON_KEY)h.Authorization=`Bearer ${SUPABASE_ANON_KEY}`;return h}
async function readResponse(res){const text=await res.text();let data;try{data=JSON.parse(text)}catch{data={raw:text}};return {res,data,text}}
async function testAI(){setStatus('busy','AI 連線測試中','正在連線 AIVAULT AI Gateway…');$('testBtn').disabled=true;try{const {res,data,text}=await readResponse(await fetch(GATEWAY_URL,{method:'POST',headers:headers(),body:JSON.stringify({provider:'gemini3',model:'gemini-3.6-flash',agent:'Course Factory Connection Test',systemPrompt:'只回答 CONNECTION_OK',messages:[{role:'user',content:'請回覆 CONNECTION_OK'}]})}));if(!res.ok)throw new Error(`HTTP ${res.status}：${data?.error||data?.message||text.slice(0,500)}`);setStatus('ok','AI 已連線',`Gateway 正常 · Provider ${data?.provider||'已回應'} · Model ${data?.model||'gemini-3.6-flash'}`);$('generateBtn').disabled=false;return true}catch(e){setStatus('bad','AI 未連線',e.message);$('generateBtn').disabled=true;return false}finally{$('testBtn').disabled=false}}
function step(n,p){$('fill').style.width=p+'%';for(let i=1;i<=5;i++){let e=$('s'+i);e.className='step '+(i<n?'done':i===n?'on':'')}}
function extractJSON(value){if(!value)return null;if(typeof value==='object')return value;let s=String(value).trim();s=s.replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();try{return JSON.parse(s)}catch{}const a=s.indexOf('{'),b=s.lastIndexOf('}');if(a>=0&&b>a){try{return JSON.parse(s.slice(a,b+1))}catch{}}return null}
function unwrap(x){if(!x)return null;if(typeof x==='string')return extractJSON(x)||x;for(const k of ['course_package','coursePackage','course','data','result','output','content'])if(x[k]){const u=unwrap(x[k]);if(u&&typeof u==='object')return u}return x}
function normalizeLesson(l,i){return {title:l.title||l.name||`第 ${i+1} 堂`,duration:l.duration||l.hours||'—',objective:l.objective||l.learning_objective||l.learningObjective||'',knowledge:l.knowledge||l.core_knowledge||l.coreKnowledge||'',tools:l.tools||l.ai_tools||l.aiTools||[],steps:l.steps||l.instructions||[],prompt:l.prompt||l.prompts||'',practice:l.practice||l.exercise||l.hands_on||'',assignment:l.assignment||l.homework||'',output:l.output||l.deliverable||l.result||'',assessment:l.assessment||l.evaluation||'',tutor:l.ai_tutor||l.tutor||''}}
function normalizeCourse(payload){let x=unwrap(payload);if(typeof x==='string')x=extractJSON(x);if(!x||typeof x!=='object')throw new Error('AI 回應不是可解析的課程資料');let lessons=x.lessons||x.modules||x.chapters||x.sections||x.curriculum?.lessons||x.curriculum?.modules||[];if(!Array.isArray(lessons))lessons=[];lessons=lessons.map(normalizeLesson);if(!lessons.length)throw new Error('AI 已回應，但沒有找到可用的課程堂次。請查看下方「AI 原始回應」。');return {title:x.title||x.course_title||x.courseTitle||'AI 課程',description:x.description||x.summary||'',level:x.level||level,total_hours:x.total_hours||x.totalHours||x.hours||'',lesson_count:lessons.length,learning_path:x.learning_path||x.learningPath||[],project:x.final_project||x.finalProject||x.project||'',lessons,raw:payload}}
function render(c){$('courseTitle').textContent=c.title;$('courseDesc').textContent=c.description;$('badges').innerHTML=[`程度：${c.level||level}`,`堂數：${c.lesson_count}`,c.total_hours?`總時數：${c.total_hours}`:''].filter(Boolean).map(x=>`<span class="badge">${esc(x)}</span>`).join('');$('overview').innerHTML=`<div class="section"><h4>學習路徑</h4><ul>${(Array.isArray(c.learning_path)?c.learning_path:[]).map(x=>`<li>${esc(typeof x==='string'?x:x.title||x.name||JSON.stringify(x))}</li>`).join('')||'<li>由 AI 依課程內容自動安排</li>'}</ul></div><div class="section"><h4>最終實作專案</h4><div class="output">${esc(c.project||'由 AI 依課程目標設計最終成果')}</div></div>`;$('lessons').innerHTML=c.lessons.map((l,i)=>`<details class="lesson" ${i===0?'open':''}><summary><strong>第 ${i+1} 堂｜${esc(l.title)}</strong><span class="muted">${esc(l.duration)}</span></summary><div class="lessonBody">${section('本堂學習目標',l.objective)}${section('核心知識',l.knowledge)}${section('AI 工具',arr(l.tools))}${listSection('實際操作步驟',l.steps)}${l.prompt?`<div class="section"><h4>完整 Prompt</h4><div class="prompt">${esc(l.prompt)}</div></div>`:''}${section('實作練習',l.practice)}${section('作業',l.assignment)}${section('應產出成果',l.output)}${section('評量方式',l.assessment)}${section('AI Tutor 補強',l.tutor)}</div></details>`).join('')}$('raw').textContent=JSON.stringify(rawResponse,null,2)}
function section(t,v){if(!v)return '';return `<div class="section"><h4>${t}</h4><p>${esc(typeof v==='string'?v:JSON.stringify(v))}</p></div>`}function listSection(t,v){if(!v||(Array.isArray(v)&&!v.length))return '';let a=Array.isArray(v)?v:[v];return `<div class="section"><h4>${t}</h4><ol class="stepsList">${a.map(x=>`<li>${esc(typeof x==='string'?x:x.step||x.instruction||x.description||JSON.stringify(x))}</li>`).join('')}</ol></div>`}function arr(v){if(!v)return '';let a=Array.isArray(v)?v:[v];return '<ul>'+a.map(x=>`<li>${esc(typeof x==='string'?x:x.name||x.tool||JSON.stringify(x))}</li>`).join('')+'</ul>'}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function generate(){const idea=$('idea').value.trim();if(!idea)return show('請先輸入課程想法。','error');if(!$('generateBtn').disabled===false){}$('generateBtn').disabled=true;$('progress').style.display='block';$('message').innerHTML='';step(1,10);try{if($('dot').classList.contains('bad'))throw new Error('AI 尚未連線，請先測試 AI 連線');step(2,25);const body={idea,level,requirements:{lesson_count:'AI 自行決定',total_hours:'AI 自行決定',practical:true,include_prompts:true,include_steps:true,include_assignments:true,include_assessment:true,include_ai_tutor:true,complete_lessons:true},instruction:'請建立完整可直接教學的課程。不要只輸出課程摘要。每堂課都必須包含：學習目標、核心知識、實際 AI 工具操作、逐步操作步驟、完整 Prompt、實作練習、作業、可驗收成果、評量方式、AI Tutor 補強。課程堂數與總時數由你依主題及程度自行判斷。請以 JSON 回傳完整 Course Package。'};const {res,data,text}=await readResponse(await fetch(COURSE_CREATOR_URL,{method:'POST',headers:headers(),body:JSON.stringify(body)}));rawResponse=data?.raw?data:data;step(3,55);if(!res.ok)throw new Error(`Course Creator HTTP ${res.status}：${data?.error||data?.message||text.slice(0,1000)}`);course=normalizeCourse(data);step(4,80);if(course.lessons.some(l=>!l.objective||!l.output))throw new Error('完整性驗證未通過：部分課堂缺少學習目標或成果。請查看 AI 原始回應。');render(course);step(5,100);$('builder').style.display='none';$('preview').style.display='block';show('課程生成完成，已進入完整預覽。','success')}catch(e){step(3,25);show(e.message,'error');$('raw').textContent=JSON.stringify(rawResponse||{error:e.message},null,2)}finally{$('generateBtn').disabled=false}}
function show(t,type){$('message').innerHTML=`<div class="notice ${type||''}">${esc(t)}</div>`}
async function exportDocx(){if(!course)return;const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/build/index.umd.js';s.onload=()=>{const d=window.docx,children=[new d.Paragraph({text:course.title,heading:d.HeadingLevel.TITLE}),new d.Paragraph(course.description||'')];course.lessons.forEach((l,i)=>{children.push(new d.Paragraph({text:`第 ${i+1} 堂｜${l.title}`,heading:d.HeadingLevel.HEADING_1}));[['本堂學習目標',l.objective],['核心知識',l.knowledge],['AI 工具',Array.isArray(l.tools)?l.tools.join('、'):l.tools],['操作步驟',Array.isArray(l.steps)?l.steps.map((x,j)=>`${j+1}. ${typeof x==='string'?x:JSON.stringify(x)}`).join('\n'):l.steps],['Prompt',l.prompt],['實作練習',l.practice],['作業',l.assignment],['成果',l.output],['評量',l.assessment],['AI Tutor',l.tutor]].forEach(([h,v])=>{if(v)children.push(new d.Paragraph({text:h,heading:d.HeadingLevel.HEADING_2}),new d.Paragraph(String(v)))});});d.Packer.toBlob(new d.Document({sections:[{children}]})).then(b=>downloadBlob(b,slug(course.title)+'.docx'))};document.body.appendChild(s)}
async function exportPpt(){if(!course)return;const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js';s.onload=()=>{const p=new PptxGenJS();p.layout='LAYOUT_WIDE';let slide=p.addSlide();slide.addText(course.title,{x:.5,y:.5,w:12,h:.6,fontSize:28,bold:true});slide.addText(course.description||'',{x:.5,y:1.3,w:12,h:1.2,fontSize:15});course.lessons.forEach((l,i)=>{slide=p.addSlide();slide.addText(`第 ${i+1} 堂｜${l.title}`,{x:.5,y:.35,w:12,h:.5,fontSize:23,bold:true});const txt=[l.objective&&`學習目標\n${l.objective}`,l.tools&&`AI 工具\n${Array.isArray(l.tools)?l.tools.join('、'):l.tools}`,l.steps&&`操作步驟\n${Array.isArray(l.steps)?l.steps.map((x,j)=>`${j+1}. ${typeof x==='string'?x:JSON.stringify(x)}`).join('\n'):l.steps}`,l.prompt&&`Prompt\n${l.prompt}`,l.practice&&`實作\n${l.practice}`,l.assignment&&`作業\n${l.assignment}`,l.output&&`成果\n${l.output}`].filter(Boolean).join('\n\n');slide.addText(txt,{x:.6,y:1,w:12,h:5.7,fontSize:12,breakLine:false,fit:'shrink'});});p.writeFile({fileName:slug(course.title)+'.pptx'})};document.body.appendChild(s)}
function exportPDF(){if(!course)return;const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js';s.onload=()=>{const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'pt',format:'a4'});let y=45;const add=(txt,size=11,bold=false)=>{doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(size);const lines=doc.splitTextToSize(String(txt||''),510);if(y+lines.length*15>780){doc.addPage();y=45}doc.text(lines,42,y);y+=lines.length*15+8};add(course.title,22,true);add(course.description,12);course.lessons.forEach((l,i)=>{add(`第 ${i+1} 堂｜${l.title}`,16,true);[['學習目標',l.objective],['核心知識',l.knowledge],['AI 工具',Array.isArray(l.tools)?l.tools.join('、'):l.tools],['操作步驟',Array.isArray(l.steps)?l.steps.map((x,j)=>`${j+1}. ${typeof x==='string'?x:JSON.stringify(x)}`).join('\n'):l.steps],['Prompt',l.prompt],['實作',l.practice],['作業',l.assignment],['成果',l.output],['評量',l.assessment],['AI Tutor',l.tutor]].forEach(([h,v])=>{if(v){add(h,12,true);add(v,10)}})});doc.save(slug(course.title)+'.pdf')};document.body.appendChild(s)}
function downloadBlob(b,name){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function slug(s){return String(s||'course').replace(/[^\w\u4e00-\u9fff-]+/g,'_').slice(0,80)}
$('testBtn').onclick=testAI;$('generateBtn').onclick=generate;$('pptBtn').onclick=exportPpt;$('pdfBtn').onclick=exportPDF;$('wordBtn').onclick=exportDocx;$('rawBtn').onclick=()=>$('raw').style.display=$('raw').style.display==='block'?'none':'block';$('backBtn').onclick=()=>{$('preview').style.display='none';$('builder').style.display='block'};$('draftBtn').onclick=()=>{localStorage.setItem('aivault_course_factory_draft',JSON.stringify({idea:$('idea').value,level}));show('草稿已儲存。','success')};$('saveBtn').onclick=()=>show('課程已在目前瀏覽器建立保存資料。','success');$('reviewBtn').onclick=()=>show('課程狀態：reviewing，等待 Owner 審核。','success');$('publishBtn').onclick=()=>show('已建立「發行到會員學習平台」請求。正式接上會員平台 API 後即可同步發布。','success');document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{document.querySelectorAll('.level').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');level=b.dataset.level});window.addEventListener('load',()=>{const d=JSON.parse(localStorage.getItem('aivault_course_factory_draft')||'null');if(d){$('idea').value=d.idea||'';level=d.level||'入門';document.querySelectorAll('.level').forEach(b=>b.classList.toggle('sel',b.dataset.level===level))}});
</script></body></html>
