<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>玩家</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body class="game-body">
  <div class="snow-layer"></div>
  <div class="app" id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/boot.js"></script>
  <script>
    (async () => {
      if (!(await FKAuth.requirePlayer())) return;
      const id = new URLSearchParams(location.search).get("id");
      const info = await FKApi.playerPublic(id);
      const p = info.player, c = info.city;
      document.getElementById("app").innerHTML = `
        <div class="page-head"><a class="back" href="game-map.html">← 返回</a><h2>${p.name}</h2></div>
        <div class="panel">
          <p>等級 ${p.level} · 戰力 ${FKUI.fmt(p.power)} ${p.is_ai ? "· AI 王國" : ""}</p>
          <p class="tiny">城市 Lv.${c.level} · 座標 (${c.x},${c.y})</p>
          <button class="btn danger" onclick="location.href='game-battle.html?id=${p.id}'">攻擊</button>
          <button class="btn secondary" onclick="spy()">偵察</button>
          <button class="btn secondary" onclick="fr()">加好友</button>
          <button class="btn secondary" onclick="location.href='game-chat.html?ch=private&to=${p.id}'">私聊</button>
          <div class="msg" id="msg"></div>
        </div>
        ${FKUI.nav("map")}
      `;
    })();
    async function spy() {
      document.getElementById("msg").textContent = "偵察請求已送出（目標公開戰力可見）";
    }
    async function fr() {
      try {
        const id = new URLSearchParams(location.search).get("id");
        await FKApi.friendAction(id, "add");
        document.getElementById("msg").className = "msg ok";
        document.getElementById("msg").textContent = "已送出好友邀請";
      } catch (e) { document.getElementById("msg").textContent = e.message; }
    }
  </script>
</body>
</html>
