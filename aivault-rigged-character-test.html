<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT 真實骨架人物測試</title><style>body{margin:0;overflow:hidden;background:#a9c8df;font-family:system-ui}#ui{position:fixed;top:12px;left:12px;right:12px;background:#173554e8;color:white;padding:12px;border-radius:12px;font-size:13px}#state{margin-top:6px}#controls{position:fixed;bottom:16px;left:12px;right:12px;display:flex;justify-content:center;gap:8px}button{padding:12px;border:1px solid #b5d9ff;border-radius:10px;background:#19466d;color:white}</style></head><body><div id="ui"><b>AIVAULT｜真正 GLB 骨架人物獨立驗證</b><div id="state">正在下載真正 3D 模型…</div><div>單一人物，拖曳旋轉，避免再用幾何小人冒充美術資產。</div></div><div id="controls"><button id="idle">待命</button><button id="walk">走路測試</button><button id="reset">重置視角</button></div><script type="module">import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';const state=document.querySelector('#state');const scene=new T.Scene();scene.background=new T.Color(0xa5c9e3);const camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(0,2.5,6.5);camera.lookAt(0,1.2,0);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;document.body.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x55718a,2.6));const light=new T.DirectionalLight(0xfff2dd,2.5);light.position.set(3,8,6);scene.add(light);const floor=new T.Mesh(new T.CylinderGeometry(2.4,2.5,.24,48),new T.MeshStandardMaterial({color:0xe8f4fc}));floor.position.y=-.2;scene.add(floor);const grid=new T.GridHelper(5,16,0xacc7d7,0xd0e2ec);grid.position.y=-.06;scene.add(grid);let actor,bones=[],walk=false,phase=0,turn=.25,drag=false,last=0;const url='https://raw.githubusercontent.com/programasweights/avatar/main/public/assets/character.glb';new GLTFLoader().load(url,g=>{actor=g.scene;let bounds=new T.Box3().setFromObject(actor),size=bounds.getSize(new T.Vector3()),center=bounds.getCenter(new T.Vector3());const s=2.7/Math.max(size.y,.01);actor.scale.setScalar(s);actor.position.set(-center.x*s,-bounds.min.y*s,-center.z*s);scene.add(actor);actor.traverse(o=>{if(o.isBone)bones.push({bone:o,base:o.rotation.clone(),name:o.name.toLowerCase()})});state.textContent='模型已載入｜骨架節點 '+bones.length+'｜角色資產為 Quaternius CC0；冬裝尚未完成';},e=>{if(e.total)state.textContent='模型下載 '+Math.round(e.loaded/e.total*100)+'%'},e=>{state.textContent='模型下載失敗：'+(e.message||'網路或來源限制')+'。尚未通過驗證。'});document.querySelector('#walk').onclick=()=>{walk=true};document.querySelector('#idle').onclick=()=>{walk=false};document.querySelector('#reset').onclick=()=>{turn=.25;camera.position.set(0,2.5,6.5);camera.lookAt(0,1.2,0)};renderer.domElement.addEventListener('pointerdown',e=>{drag=true;last=e.clientX});window.addEventListener('pointerup',()=>drag=false);window.addEventListener('pointermove',e=>{if(drag){turn+=(e.clientX-last)*.008;last=e.clientX}});window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});const clock=new T.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.04);if(actor){actor.rotation.y=turn;if(walk){phase+=dt*5;for(const b of bones){b.bone.rotation.copy(b.base);if(/leftupperleg|leftthigh|leftupleg/.test(b.name))b.bone.rotation.x+=Math.sin(phase)*.38;if(/rightupperleg|rightthigh|rightupleg/.test(b.name))b.bone.rotation.x-=Math.sin(phase)*.38;if(/leftupperarm/.test(b.name))b.bone.rotation.x-=Math.sin(phase)*.25;if(/rightupperarm/.test(b.name))b.bone.rotation.x+=Math.sin(phase)*.25}}else for(const b of bones)b.bone.rotation.copy(b.base)}renderer.render(scene,camera)}frame();</script></body></html>
