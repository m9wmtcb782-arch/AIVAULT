<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>暗星神經狀態＋即時耦合 Lab｜ENGINE-23～27→15／16／03（開發中）</title>
  <style>
    :root { --bg:#0d1117; --panel:#161b22; --fg:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --danger:#f85149; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); }
    header { padding:10px 14px; background:var(--panel); border-bottom:1px solid #30363d; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .badge { font-size:12px; padding:2px 8px; border-radius:999px; background:#21262d; color:var(--muted); }
    .badge.warn { color:var(--warn); border:1px solid var(--warn); }
    .badge.ok { color:var(--ok); border:1px solid var(--ok); }
    .badge.danger { color:var(--danger); border:1px solid var(--danger); }
    main { display:grid; grid-template-columns:1fr 400px; height:calc(100vh - 48px); }
    #view { padding:12px; overflow:auto; display:grid; grid-template-rows:auto auto 1fr; gap:10px; }
    canvas { width:100%; max-width:640px; background:#0a0e14; border-radius:8px; border:1px solid #30363d; }
    .bars { display:grid; gap:6px; max-width:640px; }
    .bar { background:#21262d; border-radius:6px; overflow:hidden; height:20px; position:relative; }
    .bar > i { display:block; height:100%; background:linear-gradient(90deg,#238636,#58a6ff); }
    .bar > span { position:absolute; left:8px; top:1px; font-size:11px; }
    aside { background:var(--panel); border-left:1px solid #30363d; padding:12px; overflow:auto; font-size:13px; }
    button { width:100%; margin:4px 0; padding:8px; background:#21262d; color:var(--fg); border:1px solid #30363d; border-radius:6px; cursor:pointer; text-align:left; }
    button:hover { border-color:var(--accent); }
    button:disabled { opacity:0.4; cursor:not-allowed; border-color:#30363d; }
    h3 { margin:12px 0 6px; font-size:13px; color:var(--muted); }
    pre { background:#0d1117; padding:8px; border-radius:6px; font-size:11px; max-height:240px; overflow:auto; white-space:pre-wrap; }
    label { display:block; margin:6px 0 2px; color:var(--muted); font-size:12px; }
    input { width:100%; padding:6px; background:#0d1117; border:1px solid #30363d; color:var(--fg); border-radius:4px; }
    .disc { color:var(--warn); font-size:12px; }
    .gates { display:flex; gap:6px; flex-wrap:wrap; }
    .gates span { font-size:11px; padding:4px 8px; border-radius:999px; border:1px solid #30363d; }
    .gates .on { color:var(--ok); border-color:var(--ok); }
    .gates .off { color:var(--danger); border-color:var(--danger); }
    @media (max-width:900px){ main{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <header>
    <strong style="color:var(--accent)">Neuro＋Realtime Coupling Lab</strong>
    <span class="badge warn">開發中｜虛擬模擬</span>
    <span class="badge">23～27 → 15／16／03</span>
    <span class="badge danger">非真實意識／中毒｜非 MP4</span>
    <span class="badge" id="clock">sim —</span>
    <span class="badge" id="fps">FPS —</span>
  </header>
  <main>
    <div id="view">
      <p class="disc">疲勞／酒精／危急即時調眨眼、gaze 精度、頭頸穩定、motor 延遲與 walk／complex 閘門。正式頁未掛載。</p>
      <canvas id="c" width="640" height="360"></canvas>
      <div class="gates" id="gates"></div>
      <div class="bars" id="bars"></div>
      <pre id="couple">—</pre>
    </div>
    <aside>
      <h3>狀態場景</h3>
      <button id="tA">A｜長清醒累積疲勞</button>
      <button id="tB">B｜睡 6 小時恢復</button>
      <button id="tC">C｜啤酒＋烈酒</button>
      <button id="tD">D｜危急 BAC</button>
      <button id="tReset">安全重置</button>
      <h3>Motor 閘門（UI＋controller）</h3>
      <button id="tryWalk">請求 walk</button>
      <button id="tryTalk">請求 talk</button>
      <button id="tryComplex">請求 complex_autonomy</button>
      <pre id="gateLog">—</pre>
      <h3>飲酒</h3>
      <label>ABV %</label>
      <input id="abv" type="number" value="40" />
      <label>ml</label>
      <input id="vol" type="number" value="50" />
      <button id="drink">飲用＋40 分</button>
      <button id="tick1h">推進 1 小時</button>
      <h3>日誌</h3>
      <pre id="log"></pre>
    </aside>
  </main>
  <script type="module">
    import { createNeuroPhysioStack } from '../../shared/neuro-physio-stack.js';
    import { createRealtimeNeuroCoupling } from '../../shared/realtime-neuro-coupling.js';
    import { createGazeEngine } from '../../engines/ENGINE-15-autonomous-gaze/gaze-engine.js';
    import { createHeadNeckController } from '../../engines/ENGINE-16-natural-head-neck/head-neck-controller.js';
    import { createMotorController } from '../../engines/ENGINE-03-motor-control/motor-controller.js';

    // Minimal mock avatar for walkToward gate tests in-browser
    const mockAvatar = {
      position: { x: 0, y: 0, z: 0 },
      userData: {}
    };

    const stack = createNeuroPhysioStack({ testMode: true, timeScale: 60 });
    const gaze = createGazeEngine();
    const head = createHeadNeckController({ gazeEngine: gaze });
    const motor = createMotorController({ avatar: mockAvatar, sync: true });
    const bridge = createRealtimeNeuroCoupling({ stack, gaze, head, motor });

    gaze.speakToUser();

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const logEl = document.getElementById('log');
    const gateLog = document.getElementById('gateLog');
    const barsEl = document.getElementById('bars');
    const coupleEl = document.getElementById('couple');
    const gatesEl = document.getElementById('gates');

    function log(...a) {
      logEl.textContent = (a.map(String).join(' ') + '\n' + logEl.textContent).slice(0, 3500);
    }

    let headYaw = 0, headPitch = 0, blink = 0, droop = 0;

    function draw(snap) {
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = '#0a0e14';
      ctx.fillRect(0, 0, w, h);
      const cx = w / 2, cy = h / 2 - 20;
      // torso
      ctx.fillStyle = '#2a3344';
      ctx.fillRect(cx - 40, cy + 30, 80, 110);
      // head follows neuro head yaw/pitch (simplified 2D)
      const hx = cx + headYaw * 40;
      const hy = cy + headPitch * 30;
      ctx.fillStyle = '#e8b896';
      ctx.beginPath();
      ctx.arc(hx, hy, 48, 0, Math.PI * 2);
      ctx.fill();
      // eyes
      const eyeOpen = Math.max(0.08, 1 - blink - droop * 0.7);
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.ellipse(hx - 16, hy - 4, 8, 6 * eyeOpen, 0, 0, Math.PI * 2);
      ctx.ellipse(hx + 16, hy - 4, 8, 6 * eyeOpen, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1a1a1a';
      const track = (snap && snap.applied && snap.applied.gaze && snap.applied.gaze.trackingScale) || 1;
      const pupilOff = (1 - track) * 3;
      ctx.beginPath();
      ctx.arc(hx - 16 + pupilOff, hy - 4, 3.2 * eyeOpen + 0.5, 0, Math.PI * 2);
      ctx.arc(hx + 16 + pupilOff, hy - 4, 3.2 * eyeOpen + 0.5, 0, Math.PI * 2);
      ctx.fill();
      // lids
      if (droop > 0.05) {
        ctx.fillStyle = `rgba(40,30,28,${0.35 + droop * 0.5})`;
        ctx.fillRect(hx - 26, hy - 14, 20, 4 + droop * 8);
        ctx.fillRect(hx + 6, hy - 14, 20, 4 + droop * 8);
      }
      ctx.fillStyle = '#8b949e';
      ctx.font = '13px sans-serif';
      const c = snap ? snap.consciousness : '—';
      ctx.fillText(`即時耦合｜${c}｜delay ${snap ? snap.reactionDelayMs : 0}ms｜非 MP4`, 16, 24);
      if (snap && !snap.gates.walk) {
        ctx.fillStyle = '#f85149';
        ctx.fillText('GATE: walk／complex 拒絕', 16, 44);
      }
    }

    const KEYS = [
      ['wakefulness', '清醒'], ['attention', '注意力'], ['fatigue', '疲勞'],
      ['reactionSpeed', '反應'], ['gazeFocus', '聚焦'], ['headPostureControl', '頭姿']
    ];

    function renderBars(s) {
      barsEl.innerHTML = KEYS.map(([k, label]) => {
        const v = s.neuro[k];
        const pct = Math.round(Math.max(0, Math.min(1, v)) * 100);
        return `<div class="bar"><i style="width:${pct}%"></i><span>${label} ${pct}%</span></div>`;
      }).join('') + `<div class="bar"><i style="width:${Math.min(100, s.alcohol.bac / 0.35 * 100)}%;background:linear-gradient(90deg,#d29922,#f85149)"></i><span>BAC ${s.alcohol.bac.toFixed(3)} · ${s.alcohol.band}</span></div>`;
    }

    let last = performance.now();
    let frames = 0, fpsT = performance.now();

    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      const snap = bridge.syncFromStack();
      gaze.update(dt, now);
      const pose = head.update(dt, { speaking: false, listening: true });
      const gc = gaze.getNeuroCoupling();
      const hc = head.getNeuroCoupling();
      droop = gc.eyelidDroop || 0;
      blink = gaze.getGazeState().blinkActive ? 0.9 : droop * 0.5;
      headYaw = pose.yaw || 0;
      headPitch = pose.pitch || 0;
      // amplify sway visually from coupling
      headYaw += Math.sin(now / 400) * (hc.headSway || 0) * 0.15;

      draw(snap);
      renderBars(stack.recomputeAll());
      gatesEl.innerHTML = `
        <span class="${snap.gates.walk ? 'on' : 'off'}">walk ${snap.gates.walk ? '允許' : '拒絕'}</span>
        <span class="${snap.gates.talk ? 'on' : 'off'}">talk ${snap.gates.talk ? '允許' : '拒絕'}</span>
        <span class="${snap.gates.complex ? 'on' : 'off'}">complex ${snap.gates.complex ? '允許' : '拒絕'}</span>
        <span>delay ${snap.reactionDelayMs}ms</span>
        <span>blink×${(snap.applied.gaze.blinkRateMul || 1).toFixed(2)}</span>
        <span>droop ${(snap.applied.gaze.eyelidDroop || 0).toFixed(2)}</span>
      `;
      coupleEl.textContent = JSON.stringify({
        consciousness: snap.consciousness,
        tiredEyesFullSpeedForbidden: snap.tiredEyesFullSpeedForbidden,
        applied: snap.applied,
        gazeState: { blink: gaze.getGazeState().blinkActive, neuro: gc },
        head: hc,
        motor: motor.getNeuroCoupling()
      }, null, 2);

      // UI mirrors controller gate (same source as walkToward/requestAction)
      const mg = motor.getNeuroCoupling();
      document.getElementById('tryWalk').disabled = !mg.allowWalk;
      document.getElementById('tryComplex').disabled = !mg.allowComplexAutonomy;
      document.getElementById('tryTalk').disabled = !mg.allowTalk;

      document.getElementById('clock').textContent = stack.persist.getSimClock().isoHint;
      frames++;
      if (now - fpsT > 1000) {
        document.getElementById('fps').textContent = `FPS ${frames}`;
        frames = 0; fpsT = now;
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    document.getElementById('tA').onclick = () => { stack.tickMinutes(18 * 60); log('A fatigue'); };
    document.getElementById('tB').onclick = () => {
      stack.sleep.startSleep(); stack.tickMinutes(6 * 60); stack.sleep.wake(); log('B sleep');
    };
    document.getElementById('tC').onclick = () => {
      stack.ingestDrink({ abvPercent: 5, volumeMl: 350 }); stack.tickMinutes(40);
      stack.ingestDrink({ abvPercent: 40, volumeMl: 60 }); stack.tickMinutes(50);
      log('C alcohol', stack.alcohol.getImpairment().bac);
    };
    document.getElementById('tD').onclick = () => {
      stack.alcohol.hydrateBac(0.32); log('D critical');
    };
    document.getElementById('tReset').onclick = () => { stack.safeReset(); log('reset'); };
    document.getElementById('drink').onclick = () => {
      stack.ingestDrink({
        abvPercent: Number(document.getElementById('abv').value),
        volumeMl: Number(document.getElementById('vol').value)
      });
      stack.tickMinutes(40);
      log('drink');
    };
    document.getElementById('tick1h').onclick = () => { stack.tickMinutes(60); log('tick1h'); };

    async function showGate(name, fn) {
      const r = fn();
      let extra = '';
      if (name === 'walk' && r.ok) {
        const fb = await motor.walkToward({ x: 0.5, z: 0 });
        extra = ' walkToward=' + JSON.stringify(fb);
      } else if (name === 'walk' && !r.ok) {
        const fb = await motor.walkToward({ x: 0.5, z: 0 });
        extra = ' walkToward=' + JSON.stringify(fb);
      }
      gateLog.textContent = JSON.stringify(r, null, 2) + extra;
      log(name, r.ok, r.reason || 'ok');
    }
    document.getElementById('tryWalk').onclick = () => showGate('walk', () => bridge.tryWalk());
    document.getElementById('tryTalk').onclick = () => showGate('talk', () => bridge.tryTalk());
    document.getElementById('tryComplex').onclick = () => showGate('complex', () => bridge.tryComplex());
  </script>
</body>
</html>
