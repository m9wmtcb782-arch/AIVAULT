<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>暗星視線／頭頸 Lab｜ENGINE-15／16（開發中）</title>
  <style>
    :root { --bg:#0d1117; --panel:#161b22; --fg:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); }
    header { padding:10px 14px; background:var(--panel); border-bottom:1px solid #30363d; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .badge { font-size:12px; padding:2px 8px; border-radius:999px; background:#21262d; color:var(--muted); }
    .badge.warn { color:var(--warn); border:1px solid var(--warn); }
    .badge.ok { color:var(--ok); border:1px solid var(--ok); }
    main { display:grid; grid-template-columns:1fr 360px; height:calc(100vh - 48px); }
    #view { position:relative; background:#000; }
    canvas { display:block; width:100%; height:100%; }
    aside { background:var(--panel); border-left:1px solid #30363d; padding:12px; overflow:auto; font-size:13px; }
    button { width:100%; margin:4px 0; padding:8px; background:#21262d; color:var(--fg); border:1px solid #30363d; border-radius:6px; cursor:pointer; text-align:left; }
    button:hover { border-color:var(--accent); }
    button.active { border-color:var(--ok); background:#1a3a2a; }
    label { display:block; margin:8px 0 2px; color:var(--muted); }
    input[type=range] { width:100%; }
    pre { background:#0d1117; padding:8px; border-radius:6px; font-size:11px; max-height:220px; overflow:auto; }
    h3 { margin:12px 0 6px; font-size:13px; color:var(--muted); }
    @media (max-width:900px){ main{grid-template-columns:1fr; height:auto;} #view{height:45vh;} }
  </style>
</head>
<body>
  <header>
    <strong style="color:var(--accent)">Gaze / Head Lab</strong>
    <span class="badge warn">開發中</span>
    <span class="badge">ENGINE-15＋16 · Shared Body Core · 同一 GLB</span>
    <span class="badge warn">Test B WebRTC＝未完成</span>
    <span class="badge" id="fps">FPS —</span>
    <span class="badge" id="lag">head lag —</span>
  </header>
  <main>
    <div id="view"></div>
    <aside>
      <p>視線校準：對<strong>使用者</strong>→眼睛；對<strong>朋友</strong>說話→<strong>虛擬鏡頭</strong>（非螢幕朋友影像）。禁止永遠盯鏡頭／固定循環動畫。</p>
      <h3>對話模式（mock）</h3>
      <button id="mUser" class="active">A｜對使用者說話 → user_eyes</button>
      <button id="mFriend">B mock｜對朋友說話 → virtual_camera（非 WebRTC）</button>
      <button id="mListenF">聆聽朋友 → friend_display</button>
      <button id="mThree">C｜三人輪流（自動）</button>
      <button id="mIdle">Idle</button>
      <h3>使用者眼睛位置（mock 追蹤）</h3>
      <label>X <span id="ux"></span></label>
      <input id="userX" type="range" min="-0.8" max="0.8" step="0.01" value="0.18" />
      <label>Y <span id="uy"></span></label>
      <input id="userY" type="range" min="1.1" max="1.9" step="0.01" value="1.55" />
      <label>Z <span id="uz"></span></label>
      <input id="userZ" type="range" min="0.6" max="2.2" step="0.01" value="1.4" />
      <h3>狀態</h3>
      <pre id="state">載入中…</pre>
      <h3>日誌</h3>
      <pre id="log"></pre>
      <p class="badge warn" style="display:block">正式頁未掛載 · 非 MP4 · 非第二套假人物</p>
    </aside>
  </main>
  <script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
  }}
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
    import { createGazeEngine } from '../../engines/ENGINE-15-autonomous-gaze/gaze-engine.js';
    import { createHeadNeckController } from '../../engines/ENGINE-16-natural-head-neck/head-neck-controller.js';
    import { createJointController } from '../joint-controller.js';

    const logEl = document.getElementById('log');
    const log = (...a) => {
      const line = a.map((x) => (typeof x === 'string' ? x : JSON.stringify(x))).join(' ');
      logEl.textContent = (line + '\n' + logEl.textContent).slice(0, 3500);
      console.log('[gaze-lab]', ...a);
    };

    const view = document.getElementById('view');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(view.clientWidth, view.clientHeight);
    view.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x10151c);
    const camera = new THREE.PerspectiveCamera(40, view.clientWidth / view.clientHeight, 0.05, 50);
    camera.position.set(0.35, 1.55, 2.6);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.45, 0);
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const dir = new THREE.DirectionalLight(0xffffff, 1.05);
    dir.position.set(2, 4, 3);
    scene.add(dir);

    // Markers: user eyes / friend display / virtual camera
    function makeMarker(color, label) {
      const g = new THREE.Group();
      const m = new THREE.Mesh(
        new THREE.SphereGeometry(0.04, 16, 12),
        new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.35 })
      );
      g.add(m);
      scene.add(g);
      g.userData.label = label;
      return g;
    }
    const mkUser = makeMarker(0x3fb950, 'user_eyes');
    const mkFriend = makeMarker(0xd29922, 'friend_display');
    const mkCam = makeMarker(0x58a6ff, 'virtual_camera');

    let frames = 0, lastFpsT = performance.now(), fps = 0;
    let lastT = performance.now();
    let avatar = null;
    let bonesByHint = {};
    let morphMeshes = [];
    let gaze = null;
    let headNeck = null;
    let joint = null;
    let threeTimer = null;
    let threeStep = 0;
    let modeBtn = document.getElementById('mUser');

    function setActive(btn) {
      ['mUser','mFriend','mListenF','mThree','mIdle'].forEach((id) => {
        document.getElementById(id).classList.toggle('active', id === btn.id);
      });
      modeBtn = btn;
    }

    function setMorph(name, v) {
      morphMeshes.forEach((m) => {
        const i = m.morphTargetDictionary[name];
        if (i != null && m.morphTargetInfluences) m.morphTargetInfluences[i] = v;
      });
    }

    function syncUserFromSliders() {
      const p = {
        x: +document.getElementById('userX').value,
        y: +document.getElementById('userY').value,
        z: +document.getElementById('userZ').value
      };
      document.getElementById('ux').textContent = p.x.toFixed(2);
      document.getElementById('uy').textContent = p.y.toFixed(2);
      document.getElementById('uz').textContent = p.z.toFixed(2);
      mkUser.position.set(p.x, p.y, p.z);
      if (gaze) gaze.tracker.setUserEyePos(p);
    }
    ['userX','userY','userZ'].forEach((id) => {
      document.getElementById(id).addEventListener('input', syncUserFromSliders);
    });

    // Default friend display + virtual camera positions
    mkFriend.position.set(-0.55, 1.45, 1.15);
    mkCam.position.set(0, 1.52, 2.45);

    const loader = new GLTFLoader();
    loader.setMeshoptDecoder(MeshoptDecoder);
    const glbUrl = '../../../../assets/dark-star/technical-dark-star-avatar.glb';
    loader.load(glbUrl, (gltf) => {
      avatar = gltf.scene;
      avatar.position.set(0, 0, 0);
      scene.add(avatar);
      const bones = [];
      avatar.traverse((o) => {
        if (o.isBone) bones.push(o);
        if (o.isMesh && o.morphTargetDictionary) morphMeshes.push(o);
      });
      const find = (re) => bones.find((b) => re.test(b.name || '')) || null;
      bonesByHint = {
        head: find(/^Head$/),
        neck: find(/^Neck$/),
        leftEye: find(/^LeftEye$/) || find(/h_L_eye/i),
        rightEye: find(/^RightEye$/) || find(/h_R_eye/i),
        leftShoulder: find(/^LeftShoulder$/),
        rightShoulder: find(/^RightShoulder$/),
        spine2: find(/^Spine2$/)
      };
      log('bones', {
        head: bonesByHint.head && bonesByHint.head.name,
        neck: bonesByHint.neck && bonesByHint.neck.name,
        L: bonesByHint.leftEye && bonesByHint.leftEye.name,
        R: bonesByHint.rightEye && bonesByHint.rightEye.name
      });

      joint = createJointController({
        avatar,
        bones,
        bonesByHint,
        setMorph,
        getFps: () => fps,
        log: () => {},
        onSafety: () => {}
      });

      const _v = new THREE.Vector3();
      gaze = createGazeEngine({
        bonesByHint,
        setMorph,
        getHeadWorldPos: () => {
          if (bonesByHint.head) {
            bonesByHint.head.getWorldPosition(_v);
            return { x: _v.x, y: _v.y, z: _v.z };
          }
          return { x: 0, y: 1.55, z: 0.05 };
        }
      });
      gaze.tracker.setFriendDisplayPos({ x: mkFriend.position.x, y: mkFriend.position.y, z: mkFriend.position.z });
      gaze.tracker.setVirtualCameraGaze({ x: mkCam.position.x, y: mkCam.position.y, z: mkCam.position.z });
      headNeck = createHeadNeckController({ bonesByHint, gazeEngine: gaze });
      gaze.speakToUser();
      headNeck.setSpeaking(true);
      headNeck.setListening(false);
      syncUserFromSliders();
      log('ENGINE-15/16 ready · joint', joint.version, '· NOT autonomous decision');
    }, undefined, (e) => log('GLB load fail', String(e)));

    function stopThree() {
      if (threeTimer) clearInterval(threeTimer);
      threeTimer = null;
    }

    document.getElementById('mUser').onclick = (e) => {
      stopThree(); setActive(e.currentTarget);
      if (!gaze) return;
      gaze.speakToUser();
      headNeck.setSpeaking(true); headNeck.setListening(false);
      log('mode answering_user → user_eyes');
    };
    document.getElementById('mFriend').onclick = (e) => {
      stopThree(); setActive(e.currentTarget);
      if (!gaze) return;
      gaze.speakToFriend();
      headNeck.setSpeaking(true); headNeck.setListening(false);
      log('mode answering_friend → virtual_camera (WebRTC NOT wired)');
    };
    document.getElementById('mListenF').onclick = (e) => {
      stopThree(); setActive(e.currentTarget);
      if (!gaze) return;
      gaze.listenFriend();
      headNeck.setSpeaking(false); headNeck.setListening(true);
      log('mode listening_friend → friend_display');
    };
    document.getElementById('mIdle').onclick = (e) => {
      stopThree(); setActive(e.currentTarget);
      if (!gaze) return;
      gaze.tracker.setMode('idle');
      headNeck.setSpeaking(false); headNeck.setListening(false);
      log('idle');
    };
    document.getElementById('mThree').onclick = (e) => {
      setActive(e.currentTarget);
      if (!gaze) return;
      const turns = ['user', 'darkstar_to_user', 'friend', 'darkstar_to_friend'];
      threeStep = 0;
      stopThree();
      const tick = () => {
        const turn = turns[threeStep % turns.length];
        gaze.tracker.rotateThreeWay(turn);
        const answering = turn.startsWith('darkstar');
        headNeck.setSpeaking(answering);
        headNeck.setListening(!answering);
        log('three_way', turn, '→', gaze.tracker.getState().currentGazeTarget);
        threeStep++;
      };
      tick();
      threeTimer = setInterval(tick, 2200);
    };

    window.addEventListener('resize', () => {
      const w = view.clientWidth, h = view.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    // Expose for Playwright
    window.__gazeLab = {
      getGaze: () => (gaze ? gaze.getGazeState() : null),
      getHead: () => (headNeck ? headNeck.getPose() : null),
      getLag: () => (headNeck ? headNeck.measureHeadLagVsEye() : null),
      getFps: () => fps,
      speakToUser: () => gaze && gaze.speakToUser(),
      speakToFriend: () => gaze && gaze.speakToFriend(),
      isSnap: () => (headNeck ? headNeck.isInstantSnap() : null),
      status: 'dev'
    };

    function loop(now) {
      const dt = Math.min(0.05, (now - lastT) / 1000);
      lastT = now;
      frames++;
      if (now - lastFpsT >= 500) {
        fps = Math.round((frames * 1000) / (now - lastFpsT));
        frames = 0;
        lastFpsT = now;
        document.getElementById('fps').textContent = 'FPS ' + fps;
      }
      if (gaze && headNeck) {
        // Eyes first, then head follows
        gaze.update(dt, now);
        headNeck.update(dt);
        const lag = headNeck.measureHeadLagVsEye();
        if (lag) {
          document.getElementById('lag').textContent =
            'head lag ' + lag.lagDeg.toFixed(1) + '° · eyesLead=' + lag.eyesLead;
        }
        const g = gaze.getGazeState();
        document.getElementById('state').textContent = JSON.stringify(
          {
            target: g.currentGazeTarget,
            eyeYawDeg: +g.eyeYawDeg.toFixed(2),
            eyePitchDeg: +g.eyePitchDeg.toFixed(2),
            head: headNeck.getPose() && {
              yawDeg: +headNeck.getPose().yawDeg.toFixed(2),
              pitchDeg: +headNeck.getPose().pitchDeg.toFixed(2)
            },
            conversation: {
              speaker: g.conversation.currentSpeaker,
              answer: g.conversation.answerTarget,
              mode: g.conversation.mode
            },
            webrtcThreePane: g.webrtcThreePane,
            calibration: g.calibration
          },
          null,
          2
        );
      }
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
