<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>競技場</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body class="game-body">
  <div class="snow-layer"></div>
  <div class="app" id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/boot.js"></script>
  <script>
    (async () => {
      if (!(await FKAuth.requirePlayer())) return;
      const list = await FKApi.searchPlayers("");
      const rows = list.slice(0, 12).map((p,i) =>
        `<div class="list-item"><div>#${i+1} ${p.name} · ${FKUI.fmt(p.power)}</div>
         <a class="btn small" href="game-battle.html?id=${p.id}">挑戰</a></div>`
      ).join("");
      document.getElementById("app").innerHTML = `
        <div class="page-head"><a class="back" href="game-menu.html">← 返回</a><h2>競技場</h2></div>
        <div class="panel"><p class="tiny">排名依戰力。挑戰走同一套戰鬥。</p>${rows}</div>
        ${FKUI.nav("more")}
      `;
    })();
  </script>
</body>
</html>
