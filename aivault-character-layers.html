<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT 人物分層 V0.5</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1524;color:#e8efff;font:15px system-ui,sans-serif}header{padding:14px;background:#192940;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:19px;margin:0}a{color:#b4d4ff}main{display:grid;grid-template-columns:260px minmax(280px,1fr) 260px;gap:12px;padding:12px;max-width:1400px;margin:auto}.panel{background:#1b2a41;border:1px solid #40516d;border-radius:12px;padding:14px}button,input,select{background:#283d5c;border:1px solid #597096;color:white;padding:9px;border-radius:7px;font:inherit}button{cursor:pointer}input[type=file]{width:100%}label{display:block;margin:12px 0 6px}.stage{display:grid;place-items:center;min-height:400px;background:#2c3547;border-radius:9px;overflow:auto;padding:8px}canvas{max-width:100%;height:auto;touch-action:none;background:repeating-conic-gradient(#ddd 0% 25%,#fff 0% 50%) 50%/24px 24px}.tools{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.tools button{flex:1}.muted{font-size:12px;color:#b8c7de}.part{padding:8px;border:1px solid #536785;border-radius:7px;margin:6px 0;cursor:pointer}.part.active{background:#3a5d91}.small{font-size:12px}#status{color:#9cdeb9}@media(max-width:850px){main{grid-template-columns:1fr}}
</style></head><body><header><h1>🧩 AIVAULT 人物分層引擎 V0.5</h1><a href="./aivault-drawing-engine.html">← 繪圖引擎</a></header>
<main><section class="panel"><h2>來源圖片</h2><label for="file">匯入人物 PNG / JPEG / WebP</label><input type="file" id="file" accept="image/png,image/jpeg,image/webp"><label for="character">角色 ID</label><input id="character" value="heroine01" maxlength="64"><label for="part">選擇身體部位</label><select id="part"></select><p class="muted">在圖片上拖曳矩形，標記目前部位。這是人工標記，不是 AI 自動辨識。</p><label for="pivotX">旋轉中心 X（原圖座標）</label><input id="pivotX" type="number" min="0" value="0"><label for="pivotY">旋轉中心 Y（原圖座標）</label><input id="pivotY" type="number" min="0" value="0"><div class="tools"><button id="applyPivot">更新旋轉中心</button><button id="remove">移除部位</button></div></section>
<section class="panel"><h2>分層畫布</h2><div class="stage"><canvas id="canvas" width="600" height="800"></canvas></div><div class="tools"><button id="exportPart">匯出目前圖層 PNG</button><button id="exportAll">匯出全部圖層</button><button id="exportManifest">匯出骨架 JSON</button></div><p id="status" role="status" class="small"></p><p class="muted">圖層 PNG 保留原圖尺寸，其餘區域透明；矩形內仍含背景與遮擋內容，需要後續精修。</p></section>
<aside class="panel"><h2>已標記部位</h2><div id="parts"></div><p class="muted">每個圖層記錄範圍、中心點、角色 ID，供下一版動畫骨架使用。</p></aside></main>
<script>
"use strict";
const $=id=>document.getElementById(id),names=["head","hair","left_eye","right_eye","mouth","torso","left_arm","right_arm","left_leg","right_leg","accessory"],labels=["頭部","頭髮","左眼","右眼","嘴巴","身體","左手臂","右手臂","左腿","右腿","配件"];const c=$("canvas"),ctx=c.getContext("2d");let img=null,regions={},selected=names[0],drag=null,preview=null;
names.forEach((n,i)=>{const o=document.createElement("option");o.value=n;o.textContent=labels[i];$("part").append(o)});
function status(s){$("status").textContent=s}
function point(e){const r=c.getBoundingClientRect();return{x:Math.max(0,Math.min(c.width,(e.clientX-r.left)*c.width/r.width)),y:Math.max(0,Math.min(c.height,(e.clientY-r.top)*c.height/r.height))}}
function draw(){ctx.clearRect(0,0,c.width,c.height);if(img)ctx.drawImage(img,0,0,c.width,c.height);for(const [name,box] of Object.entries(regions)){ctx.strokeStyle=name===selected?"#ffdf44":"#47d9f0";ctx.lineWidth=Math.max(2,c.width/300);ctx.strokeRect(box.x,box.y,box.w,box.h);ctx.fillStyle=ctx.strokeStyle;ctx.font=Math.max(14,c.width/35)+"px sans-serif";ctx.fillText(labels[names.indexOf(name)]||name,box.x+4,Math.max(18,box.y-5));ctx.beginPath();ctx.arc(box.pivotX,box.pivotY,Math.max(3,c.width/200),0,Math.PI*2);ctx.fill()}if(preview){ctx.strokeStyle="#ffdf44";ctx.strokeRect(preview.x,preview.y,preview.w,preview.h)}}
function list(){const root=$("parts");root.replaceChildren();for(const [name,box] of Object.entries(regions)){const b=document.createElement("button");b.className="part"+(name===selected?" active":"");b.textContent=(labels[names.indexOf(name)]||name)+" · "+Math.round(box.w)+"×"+Math.round(box.h);b.onclick=()=>{selected=name;$("part").value=name;sync();draw();list()};root.append(b)}}
function sync(){const r=regions[selected];$("pivotX").value=r?Math.round(r.pivotX):0;$("pivotY").value=r?Math.round(r.pivotY):0}
$("part").onchange=e=>{selected=e.target.value;sync();draw();list()};
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>20e6){status("圖片超過 20 MB");return}const url=URL.createObjectURL(f),next=new Image();next.onload=()=>{if(next.width*next.height>25000000){status("圖片像素過大");URL.revokeObjectURL(url);return}img=next;c.width=next.width;c.height=next.height;regions={};preview=null;draw();list();status("已載入 "+next.width+" × "+next.height+" 圖片");URL.revokeObjectURL(url)};next.onerror=()=>{status("圖片無法讀取");URL.revokeObjectURL(url)};next.src=url};
c.addEventListener("pointerdown",e=>{if(!img)return;drag=point(e);c.setPointerCapture(e.pointerId)});
c.addEventListener("pointermove",e=>{if(!drag)return;const p=point(e);preview={x:Math.min(drag.x,p.x),y:Math.min(drag.y,p.y),w:Math.abs(p.x-drag.x),h:Math.abs(p.y-drag.y)};draw()});
c.addEventListener("pointerup",()=>{if(preview&&preview.w>3&&preview.h>3){regions[selected]={...preview,pivotX:preview.x+preview.w/2,pivotY:preview.y+preview.h/2};sync();list();status("已標記："+selected)}drag=null;preview=null;draw()});
c.addEventListener("pointercancel",()=>{drag=null;preview=null;draw()});
$("applyPivot").onclick=()=>{const r=regions[selected];if(!r){status("請先標記部位");return}r.pivotX=Math.max(0,Math.min(c.width,Number($("pivotX").value)||0));r.pivotY=Math.max(0,Math.min(c.height,Number($("pivotY").value)||0));draw();status("旋轉中心已更新")};
$("remove").onclick=()=>{delete regions[selected];sync();draw();list()};
function download(blob,name){if(!blob){status("無法匯出");return}const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function partCanvas(name){const r=regions[name];if(!r||!img)return null;const out=document.createElement("canvas");out.width=c.width;out.height=c.height;const x=out.getContext("2d");x.drawImage(img,r.x,r.y,r.w,r.h,r.x,r.y,r.w,r.h);return out}
function exportPart(name){const out=partCanvas(name);if(!out){status("請先載入圖片並標記部位");return}out.toBlob(blob=>download(blob,($("character").value||"character")+"_"+name+".png"),"image/png")}
$("exportPart").onclick=()=>exportPart(selected);
$("exportAll").onclick=()=>{const keys=Object.keys(regions);if(!keys.length){status("尚無圖層");return}keys.forEach((n,i)=>setTimeout(()=>exportPart(n),i*350));status("正在逐一匯出 "+keys.length+" 個圖層；瀏覽器可能要求允許多檔下載")};
$("exportManifest").onclick=()=>{if(!img){status("請先載入圖片");return}const manifest={schema:"aivault-layer-v1",character_id:$("character").value,image_width:c.width,image_height:c.height,method:"manual-rectangle",occlusion_repaired:false,layers:Object.entries(regions).map(([name,r])=>({name,...r}))};download(new Blob([JSON.stringify(manifest,null,2)],{type:"application/json"}),($("character").value||"character")+"_layers.json")};
draw();
</script></body></html>
