<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>更多</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body class="game-body">
  <div class="snow-layer"></div>
  <div class="app" id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/boot.js"></script>
  <script>
    (async () => {
      if (!(await FKAuth.requirePlayer())) return;
      const snap = await FKApi.snapshot();
      const items = [
        ["角色","game-profile.html"],["好友","game-friends.html"],["聯盟","game-alliance.html"],
        ["競技場","game-arena.html"],["任務","game-tasks.html"],["活動","game-events.html"],
        ["商店","game-shop.html"],["Coupons","game-coupons.html"],["AI 王國","game-ai.html"],
        ["設定","game-settings.html"]
      ];
      document.getElementById("app").innerHTML = `
        ${FKUI.top(snap)}
        <div class="panel">${items.map(([n,h]) => `<a class="btn secondary" href="${h}" style="text-align:center;text-decoration:none">${n}</a>`).join("")}</div>
        ${FKUI.nav("more")}
      `;
    })();
  </script>
</body>
</html>
