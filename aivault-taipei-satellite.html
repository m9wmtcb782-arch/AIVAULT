<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIVAULT 臺北衛星地圖 v1</title>
<link rel="stylesheet" href="css/aivault-taipei-satellite.css?v=v1">
</head><body>
<div id="tpe-map" aria-label="臺北衛星地圖"></div>
<canvas id="tpe-fx" aria-hidden="true"></canvas>
<div id="tpe-status" role="status">載入地圖…</div>
<div id="tpe-clock" aria-live="off"></div>
<div id="tpe-ctl">
  <button id="b-loc" title="顯示我的位置（只在本機使用）">📍</button>
  <button id="b-follow" title="跟隨我" aria-pressed="false">🎯</button>
  <button id="b-north" title="方向／回正北"><span id="needle">🧭</span></button>
  <button id="b-panel" title="圖層與圖例">☰</button>
</div>
<section id="tpe-panel" hidden>
  <h2>圖層</h2>
  <div id="tpe-toggles"></div>
  <h2>捷運班距（現在）</h2>
  <div id="tpe-headway"></div>
  <h2>圖例</h2>
  <ul class="legend">
    <li><b class="real">真實</b>衛星影像、地標位置（OSM／維基百科核對）、你的位置與方向（裝置即時，只在本機）</li>
    <li><b class="sim">模擬</b>捷運列車（依官方公告班距，非即時列車位置）、松山機場起降（依營運時段 06:00–23:00 模擬，非即時航班）、公車、汽車、學生、行人（無追蹤任何真人）</li>
    <li><b class="deco">示意</b>夜市亮燈 17:00–24:00（固定時段，非實際營業狀態）；捷運線形為簡化圖資，可能偏差約 100–200 m</li>
  </ul>
  <p class="priv">🔒 定位與方向只在你的裝置上計算，不儲存、不上傳、不送資料庫。</p>
  <div id="tpe-attr"></div>
</section>
<script src="data/aivault-taipei-satellite-data.js?v=v1"></script>
<script src="data/aivault-taipei-satellite-walks.js?v=v1"></script>
<script src="js/aivault-taipei-satellite.js?v=v2"></script>
</body></html>
