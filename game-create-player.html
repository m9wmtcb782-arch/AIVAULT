<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>建立王國</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body class="game-body">
  <div class="snow-layer"></div>
  <div class="app">
    <div class="page-head"><a class="back" href="game-login.html">← 返回</a><h2>建立你的王國</h2></div>
    <div class="panel glass">
      <p class="tiny">只有第一次進入遊戲時出現。名稱 2～20 字。</p>
      <label>玩家名稱</label>
      <input id="name" maxlength="20" placeholder="例如：冰霜之王" />
      <div class="msg" id="msg"></div>
      <button class="btn gold" id="btn">建立角色並開始</button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/boot.js"></script>
  <script>
    (async () => {
      const s = await FKApi.session();
      if (!s) return location.href = "game-login.html";
      const p = await FKApi.getPlayer();
      if (p) return location.href = "game-hero.html";
    })();
    qs("btn").onclick = () => guarded(async () => {
      qs("btn").disabled = true;
      try {
        await FKApi.bootstrap(qs("name").value);
        location.href = "game-hero.html";
      } catch (e) {
        qs("btn").disabled = false;
        qs("msg").textContent = e.message;
      }
    });
  </script>
</body>
</html>
