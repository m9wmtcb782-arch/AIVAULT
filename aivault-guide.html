<script>
// TODO: 之後可把上傳的簡報＋講稿存到書架（目前只存在本機 IndexedDB，不碰現有書架）
const G='digital-human-real/guide/',$=id=>document.getElementById(id);
const CLIPS={idle:'guide_idle',intro:'guide_intro',point:'guide_point',walk:'guide_walk',explain:'guide_explain',ask:'guide_ask',bow:'guide_bow',talk:'guide_talk'};
const vids=[$('v0'),$('v1')];let cur=0,curClip=null,lip=null,mouthImgs={};
let clipGen=0;
function playClip(name,loop){const my=++clipGen;return new Promise(res=>{const nv=vids[1-cur],ov=vids[cur];nv.loop=!!loop;nv.onended=null;nv.oncanplay=null;nv.src=G+CLIPS[name]+'.mp4';nv.poster=G+CLIPS[name]+'.jpg';
 const go=()=>{if(my!==clipGen){res();return;}nv.play().catch(()=>{});nv.classList.add('on');ov.classList.remove('on');setTimeout(()=>{if(!ov.classList.contains('on'))ov.pause();},400);cur=1-cur;curClip=name;$('slide').classList.toggle('dim',name==='walk');};
 nv.oncanplay=()=>{nv.oncanplay=null;go()};nv.onerror=()=>res();nv.onended=()=>res();nv.load();if(loop)setTimeout(res,50);});}
async function oneShot(n){if(paused)return;await playClip(n,false);if(!paused&&(!stopped||qaMode))playClip(speaking?'talk':'idle',true);}
// ---- lip ----
fetch(G+'lip/guide_lip.json').then(r=>r.json()).then(j=>{lip=j;['closed','half','open','round'].forEach(k=>{const i=new Image();i.src=G+'lip/mouth_'+k+'.png';mouthImgs[k]=i;});});
const LIP_ON=false; // 舊版 lip/ 疊加停用，改用下方 lip2（臉部偵測、只在正臉時）
let speaking=false,vis='closed',visT=0;const SEQ=['half','open','half','closed','round','half','open','closed'];
function lipLoop(t){requestAnimationFrame(lipLoop);const m=$('mouth'),v=vids[cur];
 // 離線合成檢查（guide-lip-check）顯示頭部轉動時會出現雙嘴，guide_talk 本身已有自然嘴動 → 預設關閉疊加；?lip=1 只在正臉、非淡入淡出時試用
 if(!LIP_ON||!lip||!speaking||curClip!=='talk'||v.readyState<2||!v.classList.contains('on')||vids[1-cur].classList.contains('on')){m.style.display='none';return;}
 if(t-visT>140){visT=t;vis=SEQ[(Math.random()*SEQ.length)|0];m.src=mouthImgs[vis].src;}
 const [W,H]=lip.videoSize,[pw,ph]=lip.patchSize,fi=Math.min(lip.frameOffsets.length-1,Math.floor(v.currentTime*lip.fps)),o=lip.frameOffsets[fi]||[0,0];
 const cx=lip.mouthCenter[0]+o[0],cy=lip.mouthCenter[1]+o[1];
 Object.assign(m.style,{display:'block',left:((cx-pw/2)/W*100)+'%',top:((cy-ph/2)/H*100)+'%',width:(pw/W*100)+'%',height:(ph/H*100)+'%'});}
requestAnimationFrame(lipLoop);
// ---- data ----
function demoSlides(){const d=[['AIVAULT 電子書導讀','暗星帶你讀懂一本書'],['重點一：知識的複利','每天 1% 的進步 → 一年 37 倍'],['重點二：圖表解讀','左低右高：先慢後快的成長曲線']];
 return d.map((t,i)=>{const c=document.createElement('canvas');c.width=1280;c.height=720;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,1280,720);g.addColorStop(0,'#0b1d4a');g.addColorStop(1,'#1e1b4b');x.fillStyle=g;x.fillRect(0,0,1280,720);
  x.fillStyle='#7dd3fc';x.font='bold 64px sans-serif';x.fillText(t[0],80,160);x.fillStyle='#e2e8f0';x.font='40px sans-serif';x.fillText(t[1],80,250);
  if(i==2){x.strokeStyle='#38bdf8';x.lineWidth=8;x.beginPath();for(let k=0;k<=100;k++){const px=120+k*10,py=640-Math.pow(1.045,k)*4;k?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();x.strokeStyle='#64748b';x.lineWidth=3;x.strokeRect(120,320,1000,320);}
  if(i==1){[1,2,3,4,5].forEach(k=>{x.fillStyle='#6366f1';x.fillRect(120+k*170,640-k*k*12,110,k*k*12);});}
  return c.toDataURL('image/jpeg',.85);});}
const DEMO_SCRIPT=[['大家好，我是暗星，今天由我為你導讀這本書。','我們會用三頁簡報，快速抓住重點。'],['第一個重點是知識的複利。','請看這裡的長條圖，每天進步一點點，累積起來就非常驚人。','就像存錢一樣，利息也會再生利息。'],['接著看這張圖表。','曲線一開始很平，後來突然往上衝。','這代表堅持的人，會在後段看到爆發性的成果。']];
const DEMO_SLIDES=demoSlides();let slides=DEMO_SLIDES,script=DEMO_SCRIPT,page=0;const toSec=sc=>sc.map(a=>a.join(''));
// IndexedDB
const idb=new Promise(r=>{const q=indexedDB.open('aivault_guide_v1',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);});
async function kv(k,v){const db=await idb;if(!db)return;return new Promise(r=>{const t=db.transaction('kv',v===undefined?'readonly':'readwrite').objectStore('kv');const q=v===undefined?t.get(k):(v===null?t.delete(k):t.put(v,k));q.onsuccess=()=>r(q.result);q.onerror=()=>r();});}
const settings=JSON.parse(localStorage.getItem('aivault-guide-settings')||'{}');
function saveSet(){localStorage.setItem('aivault-guide-settings',JSON.stringify(settings));}
function splitSent(t){return (t.match(/[^。！？!?\n]+[。！？!?]?/g)||[]).map(s=>s.trim()).filter(Boolean);}
// 講稿對應：有「## 第N頁」就照頁碼放；沒有頁碼且段數比投影片少 → 預設從最後一頁往前對齊（可在預覽調整起始頁）；缺的頁保持空白（不念投影片文字）
let scriptInfo={numbered:false,count:0};
function mapScript(text,n){const re=/^\s*#{1,3}\s*第\s*(\d+)\s*頁.*$|^\s*---+\s*$/gm;const out=Array.from({length:n},()=>[]);let m,last=0,curNo=null,parts=[],numbered=false;
 while((m=re.exec(text))){const body=text.slice(last,m.index).trim();if(body)parts.push({no:curNo,body});curNo=m[1]?+m[1]:null;if(m[1])numbered=true;last=re.lastIndex;}
 const tail=text.slice(last).trim();if(tail)parts.push({no:curNo,body:tail});
 if(numbered){parts.forEach(p=>{if(p.no&&p.no<=n)out[p.no-1]=splitSent(p.body);});scriptInfo={numbered:true,count:parts.length};return out;}
 if(parts.length<2){const ss=splitSent(text),per=Math.ceil(ss.length/Math.max(1,n));scriptInfo={numbered:false,count:1,even:true};return Array.from({length:n},(_,i)=>ss.slice(i*per,(i+1)*per));}

// ===== 高跟鞋腳步聲：依 guide_walk 落地時間（walk_steps.json）同步 =====
// iOS：聲音在 JS 內直接合成（不用 fetch/decode），經 MediaStreamDestination → 隱藏 <audio> 播放，避免被靜音鍵/未解鎖擋掉
// ===== 高跟鞋聲：真實腳步取樣（guide/sfx/heel1-6.mp3），依 guide_walk 落地時間（walk_steps.json）同步 =====
const heel=(()=>{const AC=window.AudioContext||window.webkitAudioContext;let ctx=null,out=null,el=null,bufs=[],steps=[],lastT=-1,fired=new Set(),loading=false;
 window.__heelLog=[];const enabled=()=>settings.heel!==false;
 fetch(G+'walk_steps.json').then(r=>r.json()).then(j=>{steps=j.steps||[];}).catch(()=>{});
 function load(){if(loading)return;loading=true;for(let i=1;i<=6;i++)fetch(G+'sfx/heel'+i+'.mp3').then(r=>r.arrayBuffer()).then(b=>{ctx.decodeAudioData(b,d=>bufs.push(d),()=>{});}).catch(()=>{});}
 function unlock(){try{if(!ctx){ctx=new AC();out=ctx.createGain();
   if(ctx.createMediaStreamDestination&&'ontouchend'in document&&/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent)){const d=ctx.createMediaStreamDestination();out.connect(d);el=document.createElement('audio');el.setAttribute('playsinline','');el.autoplay=true;el.style.display='none';document.body.appendChild(el);el.srcObject=d.stream;}
   else out.connect(ctx.destination);load();}
  ctx.resume&&ctx.resume();if(el){const p=el.play();p&&p.catch&&p.catch(()=>{try{out.disconnect();}catch(e){}out.connect(ctx.destination);el=null;});}
  const b=ctx.createBuffer(1,1,22050),n=ctx.createBufferSource();n.buffer=b;n.connect(out);n.start(0);}catch(e){}}
 function click(at,st){if(!ctx||!bufs.length)return;if(ctx.state!=='running'){try{ctx.resume();}catch(e){}}const s=ctx.createBufferSource(),g=ctx.createGain();s.buffer=bufs[(Math.random()*bufs.length)|0];
  s.playbackRate.value=0.95+Math.random()*0.1;g.gain.value=(speaking?0.45:0.85)*(0.85+Math.random()*0.3);s.connect(g);g.connect(out);s.start(Math.max(ctx.currentTime,at-0.012));
  window.__heelLog.push({step:st,video:+vids[cur].currentTime.toFixed(3)});}
 function tick(){const v=vids[cur];if(!enabled()||curClip!=='walk'||paused||v.paused||v.readyState<2){lastT=-1;fired.clear();return;}
  const t=v.currentTime,rate=v.playbackRate||1;if(lastT>=0&&t<lastT-0.5)fired.clear();lastT=t;
  for(const st of steps){if(fired.has(st))continue;const dt=(st-t)/rate;if(dt<=0.06&&dt>-0.05){fired.add(st);click(ctx?ctx.currentTime+Math.max(0,dt):0,st);}}}
 setInterval(tick,16);return{unlock};})();
$('heelChk').checked=settings.heel!==false;$('heelChk').onchange=e=>{settings.heel=e.target.checked;saveSet();if(e.target.checked)heel.unlock();};

// ===== 對嘴（lip3 半臉替換；舊 lip2 嘴型檔保留未用）：離線臉部偵測軌跡（guide/lip2/guide_lip2.json），只在正臉、不歪頭、說話時疊上暗星自己的嘴型；?lip=0 關閉 =====
const lip2=(()=>{const ON=!/[?&]lip=0/.test(location.search),cv=$('lipCv'),cx=cv.getContext('2d');let J=null,S={},alpha=0,vis='closed',visT=0,pulseT=0,lastTs=0;
 if(ON)fetch(G+'lip3/guide_lip3.json').then(r=>r.json()).then(j=>{J=j;for(const[k,f]of Object.entries(j.sprite.files)){const im=new Image();im.src=G+'lip3/'+f;S[k]=im;}}).catch(()=>{});
 const NAME={idle:'idle',intro:'intro',point:'point',walk:'walk',explain:'explain',ask:'ask',bow:'bow',talk:'talk'};
 function pulse(){pulseT=performance.now();}
 function pick(now){if(now-visT<110)return vis;visT=now;const recent=now-pulseT<260,r=Math.random();
  vis=recent?(r<0.55?'open':r<0.9?'half':'closed'):(r<0.35?'half':r<0.6?'open':'closed');return vis;}
 function frame(now){requestAnimationFrame(frame);const dt=Math.min(100,now-(lastTs||now));lastTs=now;
  const W=cv.clientWidth,H=cv.clientHeight;if(!W)return;const dpr=Math.min(2,window.devicePixelRatio||1);if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  const v=vids[cur],tr=J&&J.clips[NAME[curClip]];let want=false,f=null;
  if(ON&&J&&tr&&speaking&&!paused&&v.readyState>=2&&v.classList.contains('on')&&!vids[1-cur].classList.contains('on')){const i=Math.min(tr.f.length-1,Math.floor(v.currentTime*tr.fps));f=tr.f[i];want=!!(f&&f[0]);}
