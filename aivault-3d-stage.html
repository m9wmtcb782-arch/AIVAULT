<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1" />
  <meta name="theme-color" content="#050711" />
  <title>AIVAULT 3D 舞台</title>
  <style>
    *{box-sizing:border-box} html,body{margin:0;height:100%;background:#050711;overflow:hidden;color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
    canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
    #bear2d{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);max-width:88vw;max-height:68vh;
      object-fit:contain;z-index:2;pointer-events:none;filter:drop-shadow(0 18px 30px #0008)}
    .top{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;
      padding:calc(env(safe-area-inset-top) + 12px) 14px}
    .icon{width:40px;height:40px;border-radius:12px;border:1px solid #ffffff22;background:#ffffff14;color:#fff}
    .bar{position:absolute;z-index:5;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);
      display:flex;gap:8px;padding:8px;border-radius:22px;background:#090d18dd;border:1px solid #ffffff18}
    input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;padding:8px;font-size:16px}
    .send{width:40px;height:40px;border:0;border-radius:50%;background:#6078ff;color:#fff}
    .chat{position:absolute;z-index:5;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 70px);
      max-height:22vh;overflow:auto;display:flex;flex-direction:column;gap:6px;pointer-events:none}
    .bubble{align-self:flex-start;max-width:84%;padding:8px 12px;border-radius:14px;background:#ffffff14;font-size:13px;pointer-events:auto}
    .me{align-self:flex-end;background:#637cff33}
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <img id="bear2d" src="aivault-judge-bear.jpg" alt="" />
  <div class="top">
    <button class="icon" id="btnBack" type="button">←</button>
    <button class="icon" id="btnHome" type="button">Home</button>
  </div>
  <div id="chat" class="chat"></div>
  <div class="bar">
    <input id="input" />
    <button class="send" id="send" type="button">➤</button>
  </div>
  <script type="module">
    const SUPABASE_URL = 'https://clcddygkaaqqtsbswgdf.supabase.co';
    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsY2RkeWdrYWFxcXRzYnN3Z2RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzUwNjQsImV4cCI6MjEwMjMxMTA2NH0.kYg6h7n74CtbiIjNjZ2xxJj16SV42INZVzQ9dLNUfKE';
    const bear = document.getElementById('bear2d');
    let rot = 0, y = 0;
    function tick() {
      y += 0.016;
      bear.style.transform = `translate(-50%,-50%) rotateY(${Math.sin(y)*8}deg) translateY(${Math.sin(y*1.4)*6}px)`;
      requestAnimationFrame(tick);
    }
    tick();
    const chat = document.getElementById('chat');
    function add(t, me) {
      const b = document.createElement('div');
      b.className = 'bubble' + (me ? ' me' : '');
      b.textContent = t;
      chat.appendChild(b);
      chat.scrollTop = chat.scrollHeight;
    }
    async function ask(text) {
      add(text, true);
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/ai-gateway`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${KEY}`, apikey: KEY },
          body: JSON.stringify({
            provider: 'groq',
            model: 'openai/gpt-oss-120b',
            messages: [
              { role: 'system', content: '你是法官熊數字人。繁體中文口語，2到4句。' },
              { role: 'user', content: text }
            ]
          })
        });
        const data = await res.json();
        const reply = data.content || data.response || data.text || data.choices?.[0]?.message?.content || '我在。';
        add(reply, false);
        if ('speechSynthesis' in window) {
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(reply);
          u.lang = 'zh-TW';
          speechSynthesis.speak(u);
        }
      } catch (e) { add(String(e.message || e), false); }
    }
    document.getElementById('btnBack').onclick = () => location.href = 'aivault-digital-human.html#/';
    document.getElementById('btnHome').onclick = () => location.href = 'aivault-home.html';
    document.getElementById('send').onclick = () => {
      const v = document.getElementById('input').value.trim();
      if (!v) return;
      document.getElementById('input').value = '';
      ask(v);
    };
    document.getElementById('input').onkeydown = e => { if (e.key === 'Enter') document.getElementById('send').click(); };
  </script>
</body>
</html>
