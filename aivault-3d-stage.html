<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1" />
  <title>AIVAULT 3D 舞台</title>
  <style>
    *{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden;background:#050711;color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
    .stage{position:absolute;inset:0;perspective:900px;display:grid;place-items:center}
    #bear{
      width:min(86vw,420px); transform-style:preserve-3d; transform-origin:50% 70%;
      filter:drop-shadow(0 24px 28px #0008); user-select:none; -webkit-user-drag:none;
    }
    #bear.talk{animation:talk .22s infinite}
    @keyframes idle {
      0%{transform:rotateY(-12deg) rotateX(3deg) translateY(0)}
      50%{transform:rotateY(12deg) rotateX(-3deg) translateY(-12px)}
      100%{transform:rotateY(-12deg) rotateX(3deg) translateY(0)}
    }
    @keyframes talk {
      0%{transform:rotateY(-8deg) scale(1) translateY(0)}
      50%{transform:rotateY(8deg) scale(1.04) translateY(-10px)}
      100%{transform:rotateY(-8deg) scale(1) translateY(0)}
    }
    #bear.idle{animation:idle 3.2s ease-in-out infinite}
    .top{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;gap:8px;
      padding:calc(env(safe-area-inset-top) + 12px) 14px}
    .icon{width:40px;height:40px;border-radius:12px;border:1px solid #ffffff22;background:#ffffff14;color:#fff}
    .chat{position:absolute;z-index:5;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 72px);
      max-height:24vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
    .bubble{max-width:84%;padding:8px 12px;border-radius:14px;background:#ffffff14;font-size:13px}
    .ai{align-self:flex-start}.me{align-self:flex-end;background:#637cff33}
    .bar{position:absolute;z-index:5;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);
      display:flex;gap:8px;padding:8px;border-radius:22px;background:#090d18ee;border:1px solid #ffffff18}
    input{flex:1;min-width:0;border:0;background:transparent;color:#fff;font-size:16px;outline:0}
    .send,.mic{width:40px;height:40px;border:0;border-radius:50%;background:#ffffff14;color:#fff}
    .send{background:#6078ff}
    .ring{position:absolute;width:280px;height:70px;border:2px solid #627bff88;border-radius:50%;
      bottom:26%;left:50%;transform:translateX(-50%);pointer-events:none}
  </style>
</head>
<body>
  <div class="top">
    <button class="icon" id="btnBack" type="button">←</button>
    <button class="icon" id="btnHome" type="button">Home</button>
  </div>
  <div class="stage" id="stage">
    <div class="ring"></div>
    <img id="bear" class="idle" src="aivault-judge-bear.jpg" alt="" />
  </div>
  <div id="chat" class="chat"></div>
  <div class="bar">
    <button class="mic" id="mic" type="button">🎙</button>
    <input id="input" />
    <button class="send" id="send" type="button">➤</button>
  </div>
  <script>
    const URLS = 'https://clcddygkaaqqtsbswgdf.supabase.co';
    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsY2RkeWdrYWFxcXRzYnN3Z2RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzUwNjQsImV4cCI6MjEwMjMxMTA2NH0.kYg6h7n74CtbiIjNjZ2xxJj16SV42INZVzQ9dLNUfKE';
    const bear = document.getElementById('bear');
    const chat = document.getElementById('chat');
    let dragging = false, lastX = 0, rotY = 0;
    document.getElementById('stage').addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; bear.classList.remove('idle','talk'); });
    addEventListener('pointerup', () => { dragging = false; if (!bear.classList.contains('talk')) bear.classList.add('idle'); });
    addEventListener('pointermove', e => {
      if (!dragging) return;
      rotY += (e.clientX - lastX) * 0.35;
      lastX = e.clientX;
      bear.style.transform = 'rotateY(' + rotY + 'deg)';
    });
    function add(t, me) {
      const b = document.createElement('div');
      b.className = 'bubble ' + (me ? 'me' : 'ai');
      b.textContent = t;
      chat.appendChild(b);
      chat.scrollTop = chat.scrollHeight;
    }
    function speak(text) {
      bear.classList.remove('idle'); bear.classList.add('talk');
      const fallback = (t) => {
        if (!('speechSynthesis' in window)) { bear.classList.remove('talk'); bear.classList.add('idle'); return; }
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(t);
        u.lang = 'zh-TW';
        u.onend = () => { bear.classList.remove('talk'); bear.classList.add('idle'); };
        speechSynthesis.speak(u);
      };
      fetch(URLS + '/functions/v1/aivault-tts', {
        method: 'POST',
        headers: { 'Content-Type':'application/json', Authorization:'Bearer '+KEY, apikey:KEY },
        body: JSON.stringify({ action:'tts', text: text, language:'zh-TW' })
      }).then(r => r.json()).then(j => {
        const b64 = (j.result && j.result.audio_base64) || j.audio_base64;
        const mime = (j.result && j.result.mime) || 'audio/mpeg';
        if (!b64) return fallback(text);
        const a = new Audio('data:' + mime + ';base64,' + b64);
        a.onended = () => { bear.classList.remove('talk'); bear.classList.add('idle'); };
        a.play().catch(() => fallback(text));
      }).catch(() => fallback(text));
    }
    async function ask(text) {
      add(text, true);
      bear.classList.remove('idle'); bear.classList.add('talk');
      try {
        const res = await fetch(URLS + '/functions/v1/ai-gateway', {
          method: 'POST',
          headers: { 'Content-Type':'application/json', Authorization:'Bearer '+KEY, apikey:KEY },
          body: JSON.stringify({
            provider:'groq', model:'openai/gpt-oss-120b',
            messages:[
              { role:'system', content:'你是東吳法官熊。繁體中文口語，2到4句，像在台上講話。' },
              { role:'user', content:text }
            ]
          })
        });
        const data = await res.json();
        const reply = data.content || data.response || data.text || (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '本席在聽。';
        add(reply, false);
        speak(reply);
      } catch (e) {
        add(String(e.message || e), false);
        bear.classList.remove('talk'); bear.classList.add('idle');
      }
    }
    document.getElementById('btnBack').onclick = () => location.href = 'aivault-digital-human.html#/';
    document.getElementById('btnHome').onclick = () => location.href = 'aivault-home.html';
    document.getElementById('send').onclick = () => {
      const v = document.getElementById('input').value.trim();
      if (!v) return;
      document.getElementById('input').value = '';
      ask(v);
    };
    document.getElementById('input').onkeydown = e => { if (e.key==='Enter') document.getElementById('send').click(); };
    document.getElementById('mic').onclick = () => {
      const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Rec) return add('此裝置不支援語音輸入', false);
      const r = new Rec(); r.lang = 'zh-TW';
      r.onresult = ev => ask(ev.results[0][0].transcript);
      r.start();
    };
  </script>
</body>
</html>
