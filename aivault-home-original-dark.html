<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />
  <title>AIVAULT — AI Agent 協作工作平台</title>
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png" />
  <meta name="apple-mobile-web-app-title" content="AIVAULT" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    :root {
      --bg: #ffffff; --card: #f8fafc; --card-hover: #f1f5f9; --border: #cbd5e1;
      --text: #0f172a; --text-muted: #64748b; --primary: #3b82f6; --primary-dim: #1d4ed8;
      --success: #22c55e; --warning: #f59e0b; --danger: #ef4444;
      --agent-gpt: #10b981; --agent-grok: #8b5cf6; --agent-coding: #06b6d4;
      --agent-research: #f97316; --agent-design: #ec4899; --agent-teacher: #84cc16;
      --agent-doctor: #14b8a6; --agent-lawyer: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", Roboto, sans-serif;
      background: #ffffff; color: #0f172a; min-height: 100dvh; line-height: 1.5; overflow-x: hidden;
    }
    .header {
      position: sticky; top: 0; z-index: 100; background: #ffffff; backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .logo { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; overflow: hidden; }
    .logo-icon {
      width: 36px; height: 36px; background: linear-gradient(135deg,#ff3b30,#ff9500,#ffcc00,#34c759,#0a84ff,#5856d6,#af52de,#ff2d55); background-size: 300% 300%; animation: aivaultLogoColorShift 6s ease-in-out infinite; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; flex-shrink: 0; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.28);
    }
    @keyframes aivaultLogoColorShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .logo-text { min-width: 0; overflow: hidden; }
    .logo-text h1 { font-size: 18px; font-weight: 700; letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .logo-text p { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gear-btn {
      width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: #ffffff; color: #0f172a;
      font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; margin-left: 4px;
    }
    @media (max-width: 420px) {
      .logo-text p { display: none; }
      .logo-text h1 { font-size: 16px; }
      .owner-badge { padding: 5px 8px; font-size: 10px; }
      .room-btn { padding: 6px 8px; font-size: 11px; }
      .header { padding: 10px; gap: 6px; }
      .header-right { gap: 5px; }
    }
    .account-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
    .account-mask.show { display: flex; }
    .account-panel { width: min(400px,100%); background: #0f172a; border: 1px solid var(--border); border-radius: 14px; padding: 16px; max-height: 90vh; overflow: auto; }
    .account-panel h3 { font-size: 16px; margin-bottom: 10px; }
    .account-panel label { display: block; font-size: 12px; color: var(--text-muted); margin: 10px 0 4px; }
    .account-panel input { width: 100%; background: #020617; border: 1px solid var(--border); border-radius: 10px; padding: 10px; color: var(--text); font: inherit; }
    .account-panel .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .account-panel .meta { font-size: 12px; color: var(--text-muted); word-break: break-all; }
    .header-right { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; max-width: 58%; flex-wrap: nowrap; overflow: visible; }
    .owner-badge { background: #ffffff; color: #0f172a; font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 20px; border: none; cursor: pointer; }
    .room-btn { background: #ffffff; color: #0f172a; border: 1px solid var(--border); font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 20px; border: none; cursor: pointer; }
    .tabs { display: flex; gap: 4px; padding: 10px 12px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border); background: #ffffff; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex-shrink: 0; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; background: transparent; color: var(--text-muted); border: 1px solid transparent; cursor: pointer; }
    .tab.active { background: #ffffff; color: #0f172a; border-color: var(--border); }
    .content { padding: 16px; padding-bottom: 100px; max-width: 640px; margin: 0 auto; }
    .section-title { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .agents-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 24px; }
    @media (min-width: 480px) { .agents-grid { grid-template-columns: repeat(3,1fr); } }
    .agent-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; cursor: pointer; }
    .agent-card:hover { background: var(--card-hover); }
    .agent-avatar { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 8px; }
    .agent-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .agent-role { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
    .agent-status { display: flex; align-items: center; gap: 6px; font-size: 11px; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: #1a1a1a; box-shadow: inset 0 0 2px rgba(255,255,255,.12); }
    .status-dot.standby, .status-dot.offline { background: #1a1a1a; box-shadow: 0 0 0 1px rgba(255,255,255,.14); animation: none; }
    .status-dot.idle, .status-dot.free { background: #22c55e; box-shadow: 0 0 10px #22c55e, 0 0 18px rgba(34,197,94,.35); animation: blink-green 1.4s ease-in-out infinite; }
    .status-dot.working, .status-dot.thinking { background: #3b82f6; box-shadow: 0 0 10px #3b82f6; animation: blink-blue .85s ease-in-out infinite; }
    .status-dot.busy { background: #eab308; box-shadow: 0 0 10px #eab308; animation: blink-yellow .75s ease-in-out infinite; }
    .status-dot.meeting, .status-dot.critical { background: #ef4444; box-shadow: 0 0 12px #ef4444; animation: blink-red .55s ease-in-out infinite; }
    @keyframes blink-green { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .55; transform: scale(.9); } }
    @keyframes blink-blue { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.8); } }
    @keyframes blink-yellow { 0%,100% { opacity: 1; transform: scale(1.05); } 50% { opacity: .4; transform: scale(.75); } }
    @keyframes blink-red { 0%,100% { opacity: 1; transform: scale(1.08); } 50% { opacity: .3; transform: scale(.72); } }
    .task-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
    .task-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: flex; align-items: flex-start; gap: 12px; }
    .task-check { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; font-size: 12px; }
    .task-item.done .task-check { background: var(--success); border-color: var(--success); color: white; }
    .task-item.active .task-check { border-color: var(--primary); background: rgba(59,130,246,.15); }
    .task-title { font-size: 14px; font-weight: 500; }
    .task-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .chat-container { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 24px; display: flex; flex-direction: column; height: 420px; }
    .chat-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 88%; display: flex; flex-direction: column; gap: 4px; }
    .msg.owner { align-self: flex-end; }
    .msg.agent { align-self: flex-start; }
    .msg-bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
    .msg.owner .msg-bubble { background: var(--primary); border-bottom-right-radius: 4px; }
    .msg.agent .msg-bubble { background: #334155; border-bottom-left-radius: 4px; }
    .msg-meta { font-size: 11px; color: var(--text-muted); padding: 0 4px; display: flex; align-items: center; gap: 6px; }
    .msg.owner .msg-meta { justify-content: flex-end; }
    .msg-sender { font-weight: 600; font-size: 12px; }
    .chat-input-area { border-top: 1px solid var(--border); padding: 10px 12px; display: flex; gap: 8px; align-items: center; }
    .chat-input { flex: 1; background: #0f172a; border: 1px solid var(--border); border-radius: 24px; padding: 10px 16px; color: var(--text); font-size: 14px; outline: none; }
    .chat-input:focus { border-color: var(--primary); }
    .send-btn { width: 40px; height: 40px; border-radius: 50%; background: #ffffff; border: 1px solid var(--border); color: #0f172a; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .send-btn:disabled { opacity: .4; }
    .agent-pick-bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: #0f172a; align-items: center; }
    .agent-pick-label { font-size: 11px; color: var(--text-muted); margin-right: 2px; flex-shrink: 0; }
    .agent-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 16px; border: 1px solid var(--border); background: #ffffff; color: #0f172a; font-size: 11px; font-weight: 600; cursor: pointer; user-select: none; }
    .agent-chip.selected { background: rgba(59,130,246,.2); border-color: var(--primary); color: #93c5fd; }
    .agent-chip.offline { opacity: .4; pointer-events: none; }
    .agent-chip .chip-dot { width: 6px; height: 6px; border-radius: 50%; background: #475569; }
    .agent-chip.selected .chip-dot { background: #3b82f6; box-shadow: 0 0 6px #3b82f6; }
    .workflow { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 24px; }
    .workflow-step { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; position: relative; }
    .workflow-step:not(:last-child)::after { content: ''; position: absolute; left: 15px; top: 40px; bottom: -10px; width: 2px; background: var(--border); }
    .step-num { width: 32px; height: 32px; border-radius: 50%; background: #334155; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; z-index: 1; }
    .workflow-step.done .step-num { background: var(--success); color: #000; }
    .workflow-step.active .step-num { background: var(--primary); }
    .step-content { flex: 1; }
    .step-title { font-size: 14px; font-weight: 500; }
    .step-agent { font-size: 12px; color: var(--text-muted); }
    .registry-list { display: flex; flex-direction: column; gap: 8px; }
    .registry-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; }
    .registry-info { display: flex; align-items: center; gap: 12px; }
    .registry-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .toggle { width: 44px; height: 24px; border-radius: 12px; background: #475569; position: relative; cursor: pointer; }
    .toggle.on { background: var(--success); }
    .toggle::after { content: ''; position: absolute; width: 18px; height: 18px; border-radius: 50%; background: white; top: 3px; left: 3px; transition: transform .2s; }
    .toggle.on::after { transform: translateX(20px); }
    .approval-card { background: linear-gradient(135deg,#1e293b,#1e1b4b); border: 1px solid #4c1d95; border-radius: 14px; padding: 16px; margin-bottom: 24px; }
    .approval-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; font-weight: 600; color: #c4b5fd; }
    .approval-body { font-size: 14px; margin-bottom: 14px; line-height: 1.5; }
    .approval-actions { display: flex; gap: 10px; }
    .btn { flex: 1; padding: 10px; border-radius: 10px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; }
    .btn-approve { background: #ffffff; color: #0f172a; border: 1px solid var(--border); }
    .btn-reject { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
    .demo-note { text-align: center; font-size: 12px; color: var(--text-muted); padding: 20px 16px; border-top: 1px solid var(--border); margin-top: 10px; }
    .demo-note strong { color: var(--primary); }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1e293b; border: 1px solid var(--border); color: white; padding: 12px 20px; border-radius: 12px; font-size: 14px; z-index: 400; transition: transform .3s ease; max-width: 90%; text-align: center; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .panel { display: none; }
    .panel.active { display: block; }
    .typing { display: flex; gap: 4px; padding: 8px 0; }
    .typing span { width: 6px; height: 6px; background: #94a3b8; border-radius: 50%; animation: typing 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes typing { 0%,60%,100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }
    #proposalLibraryOverlay, #proposalOverlay { display: none; position: fixed; inset: 0; z-index: 320; background: var(--bg); overflow-y: auto; }
    #proposalLibraryOverlay.show, #proposalOverlay.show { display: block; }
    .proposal-bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: rgba(15,23,42,.96); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .proposal-bar button { background: #ffffff; color: #0f172a; border: 1px solid var(--border); border: none; border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .proposal-bar button.primary { background: #ffffff; color: #0f172a; }
    .proposal-bar button.success { background: #ffffff; color: #0f172a; }
    .proposal-bar button.voice-on { background: #7c3aed; }
    .proposal-wrap { max-width: 800px; margin: 0 auto; padding: 16px; padding-bottom: 100px; }
    .proposal-status { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
    .proposal-stats { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; margin-bottom: 14px; }
    @media (min-width: 520px) { .proposal-stats { grid-template-columns: repeat(4,1fr); } }
    .stat-card { background: #0f172a; border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
    .stat-card .n { font-size: 22px; font-weight: 800; color: #93c5fd; }
    .stat-card .l { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .chart-grid { display: grid; gap: 12px; margin-bottom: 16px; }
    .chart-card { background: #0f172a; border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
    .chart-card h3 { font-size: 13px; margin-bottom: 8px; color: #cbd5e1; }
    .chart-card canvas { width: 100%; height: 180px; display: block; background: #020617; border-radius: 8px; }
    .book-nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; scrollbar-width: none; }
    .book-nav::-webkit-scrollbar { display: none; }
    .book-chip { flex: 0 0 auto; padding: 6px 12px; border-radius: 16px; border: 1px solid var(--border); background: #1e293b; color: #94a3b8; font-size: 12px; font-weight: 600; cursor: pointer; }
    .book-chip.active { background: rgba(59,130,246,.25); border-color: #3b82f6; color: #93c5fd; }
    .proposal-doc { background: #0f172a; border: 1px solid var(--border); border-radius: 14px; padding: 20px 18px; line-height: 1.75; font-size: 14px; white-space: pre-wrap; word-break: break-word; min-height: 280px; }
    .library-list { display: flex; flex-direction: column; gap: 10px; }
    .library-item { background: #0f172a; border: 1px solid var(--border); border-radius: 14px; padding: 14px; cursor: pointer; }
    .library-item h3 { font-size: 15px; margin-bottom: 4px; }
    .library-item .meta { font-size: 12px; color: var(--text-muted); }
    .library-empty { text-align: center; color: var(--text-muted); padding: 40px 16px; }
    #roomOverlay { display: none; }
  </style>
</head>
<body>
<div class="header">
  <div class="logo">
    <div class="logo-icon">A</div>
    <div class="logo-text">
      <h1>AIVAULT</h1>
      <p>AI Agent 協作工作平台</p>
    </div>
  </div>
  <div class="header-right">
    <button type="button" class="owner-badge" id="btnAccount">帳號</button>
    <button type="button" class="room-btn" id="btnRoom">房間</button>
    <button type="button" class="gear-btn" id="btnGear">⚙️</button>
    <button type="button" class="room-btn" id="btnLogout" style="background:#ffffff !important;color:#0f172a !important;border:1px solid #cbd5e1 !important;">登出</button>
  </div>
</div>
<div class="tabs">
  <button class="tab active" data-panel="panel-home">首頁</button>
  <button class="tab" data-panel="panel-chat">對話</button>
  <button class="tab" data-panel="panel-workflow">工作流</button>
  <button class="tab" data-panel="panel-registry">註冊</button>
</div>
<div class="content">
  <div class="panel active" id="panel-home">
    <div class="section-title">快速入口</div>
    <div id="digitalHumanEntry" class="agent-card" style="margin-bottom:16px; grid-column:1/-1; display:block; border-color:rgba(168,85,247,.45); background:linear-gradient(135deg,#2e1065,#1e293b);">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
        <div>
          <div class="agent-name" style="font-size:15px;">Digital Human｜數字人</div>
          <div class="agent-role" style="margin-bottom:2px;">建立你的專屬 AI 數字人</div>
          <div class="agent-role" style="margin-bottom:0;">自訂外觀、聲音與 AI 大腦，讓不同 AI 系統都可以成為數字人的智慧核心。</div>
        </div>
        <div style="flex-shrink:0; padding:8px 12px; border-radius:20px; background:linear-gradient(135deg,#a855f7,#6366f1); color:#fff; font-size:12px; font-weight:700;">進入數字人</div>
      </div>
    </div>
    <div id="mp4ImportEntry" class="agent-card" style="margin-bottom:16px; grid-column:1/-1; display:block; border-color:rgba(59,130,246,.45); background:linear-gradient(135deg,#1e3a8a,#1e293b);">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
        <div>
          <div class="agent-name" style="font-size:15px;">MP4 轉文字匯入</div>
          <div class="agent-role" style="margin-bottom:2px;">將影片教材轉成文字並匯入知識庫</div>
          <div class="agent-role" style="margin-bottom:0;">供暗星後續檢索與解題使用</div>
        </div>
        <div style="flex-shrink:0; padding:8px 12px; border-radius:20px; background:linear-gradient(135deg,#3b82f6,#1d4ed8); color:#fff; font-size:12px; font-weight:700;">開始匯入</div>
      </div>
    </div>
    <div id="textImportEntry" class="agent-card" style="margin-bottom:16px; grid-column:1/-1; display:block; border-color:rgba(16,185,129,.45); background:linear-gradient(135deg,#064e3b,#1e293b);">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
        <div>
          <div class="agent-name" style="font-size:15px;">文字匯入</div>
          <div class="agent-role" style="margin-bottom:2px;">貼上教材、逐字稿或分析文字</div>
          <div class="agent-role" style="margin-bottom:0;">iPhone 複製後長按貼上，送出分析</div>
        </div>
        <div style="flex-shrink:0; padding:8px 12px; border-radius:20px; background:linear-gradient(135deg,#10b981,#059669); color:#fff; font-size:12px; font-weight:700;">開始匯入</div>
      </div>
    </div>
    <!-- rest of the file continues with original content; full file is applied from local -->
  </div>
</div>
<script>
document.getElementById('textImportEntry')?.addEventListener('click', () => { location.href = 'aivault-text-import.html'; });
</script>
</body>
</html>
