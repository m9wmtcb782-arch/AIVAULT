<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT 3D 真人物模型驗證</title><style>body{margin:0;background:#162b47;color:white;font:14px system-ui;overflow:hidden}#status{position:fixed;top:12px;left:12px;right:12px;max-width:390px;background:#102743dd;padding:14px;border-radius:12px;line-height:1.6}b{font-size:17px}#btn{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:10px}button{border:1px solid #a3d5fa;background:#234967;color:white;padding:12px;border-radius:12px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><div id="status"><b>❄ AIVAULT｜真正 3D 人物驗證</b><div id="msg">載入有骨架的 GLB 模型中……</div><small>這是原始角色基底，不是冬裝成品。拖曳旋轉人物。</small></div><div id="btn"><button id="left">↶ 左轉</button><button id="right">右轉 ↷</button><button id="reset">重設</button></div><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
let renderer;const msg=document.getElementById('msg');try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(e){msg.textContent='無法啟用 WebGL：'+e.message;throw e}renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x91b8d1);const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.01,300);scene.add(new THREE.HemisphereLight(0xffffff,0x4d6686,2.7));const light=new THREE.DirectionalLight(0xffe8cc,2.6);light.position.set(3,8,5);scene.add(light);
const floor=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.8,.25,64),new THREE.MeshStandardMaterial({color:0xe9f4fa,roughness:.8}));floor.position.y=-.2;scene.add(floor);
let group=new THREE.Group();scene.add(group);let angle=.4,dist=5,cy=1.3;function setCamera(){camera.position.set(Math.sin(angle)*dist,cy+dist*.12,Math.cos(angle)*dist);camera.lookAt(0,cy,0)}setCamera();
const urls=['https://cdn.jsdelivr.net/gh/programasweights/avatar@main/public/assets/character.glb','https://raw.githubusercontent.com/programasweights/avatar/main/public/assets/character.glb'];const loader=new GLTFLoader();
async function load(){for(const url of urls){try{const gltf=await loader.loadAsync(url);group.add(gltf.scene);const b=new THREE.Box3().setFromObject(group),size=b.getSize(new THREE.Vector3()),center=b.getCenter(new THREE.Vector3());if(size.y<.001)throw Error('模型沒有可見尺寸');const sc=3/size.y;group.scale.setScalar(sc);group.position.set(-center.x*sc,-b.min.y*sc,-center.z*sc);cy=1.45;dist=6;setCamera();msg.textContent='已載入真實 GLB 角色模型。骨架數量：'+gltf.scene.getObjectByProperty('type','SkinnedMesh')?.skeleton?.bones?.length+'（尚無走路動畫）';return}catch(e){msg.textContent='正在嘗試備用模型來源……';}}msg.textContent='模型下載失敗：目前無法連接外部 GLB 來源。沒有用假模型替代。'}load();
let drag=false,last=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;last=e.clientX});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(drag){angle+=(e.clientX-last)*.01;last=e.clientX;setCamera()}});document.getElementById('left').onclick=()=>{angle-=.3;setCamera()};document.getElementById('right').onclick=()=>{angle+=.3;setCamera()};document.getElementById('reset').onclick=()=>{angle=.4;dist=6;setCamera()};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)}loop();
</script></body></html>
