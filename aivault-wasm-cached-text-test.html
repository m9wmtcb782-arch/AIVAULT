<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT 快取模型 WASM 測試</title><style>body{background:#0c1525;color:#f1f5ff;font:16px system-ui,-apple-system,sans-serif;max-width:700px;margin:auto;padding:18px;line-height:1.5}button{padding:12px;border:0;border-radius:9px;background:#3476db;color:white;font-size:16px;margin:5px}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1b2840;padding:12px;border-radius:9px}</style></head><body><h2>AIVAULT WASM 快取推論驗證</h2><p>版本 cached-wasm-20261018-c。已證明 iPhone Safari 能執行極小 ONNX WASM 模型；這次檢查之前下載的 SmolLM2 權重是否仍在快取，若完整才允許嘗試使用 WASM 載入。<b>禁止遠端下載模型</b>。注意：q4f16 權重未必相容 WASM，成功與否仍需驗證。</p><button id="scan">1. 檢查既有快取</button><button id="run" disabled>2. 只用快取載入 WASM</button><button id="copy">複製紀錄</button><p id="state">尚未檢查</p><pre id="log">等待檢查</pre><script type="module">
const $=id=>document.getElementById(id),ver='cached-wasm-20261018-c';let logLines=[ver];const log=s=>{$('log').textContent=logLines.join('\n')+'\n'+s;logLines.push(s)};
const fmt=e=>{try{return 'type='+typeof e+'; string='+String(e)+'; stack='+String(e?.stack||'')}catch{return '異常不可讀'}};
let present=false;
$('scan').onclick=async()=>{logLines=[ver];$('run').disabled=true;present=false;log('UA='+navigator.userAgent);
try{const cachesList=await caches.keys();log('Cache Storage='+cachesList.join(', '));const required=['config.json','tokenizer_config.json','tokenizer.json','generation_config.json','onnx/model_q4f16.onnx'];const hits=new Set();
for(const name of cachesList){const c=await caches.open(name);for(const request of await c.keys()){const u=new URL(request.url);if(!u.pathname.includes('SmolLM2-135M-Instruct-ONNX'))continue;for(const f of required){if(u.pathname.endsWith('/'+f)){hits.add(f);log('FOUND '+f+' ('+name+')')}}}}
const missing=required.filter(f=>!hits.has(f));if(missing.length){$('state').textContent='快取不完整，不進行推論';log('MISSING '+missing.join(', '));log('不會下載缺少的權重')}else{present=true;$('run').disabled=false;$('state').textContent='檔名齊全，可嘗試 WASM（仍不保證內容完整）';log('檔名齊全；不代表快取位元組完整')}
}catch(e){$('state').textContent='檢查失敗';log(fmt(e))}};
$('run').onclick=async()=>{if(!present)return;$('run').disabled=true;log('開始載入 Transformers.js JS；不允許遠端模型檔案');$('state').textContent='WASM 初始化中';try{const m=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');m.env.allowRemoteModels=true;m.env.useBrowserCache=true;
const nativeFetch=globalThis.fetch.bind(globalThis);
globalThis.fetch=async(input,init)=>{const url=String(typeof input==='string'?input:input?.url||input);if(/(?:huggingface\\.co|hf\\.co|hf-mirror\\.com|cdn-lfs)/i.test(url)&&url.includes('SmolLM2-135M-Instruct-ONNX')){const c=await caches.open('transformers-cache');const match=await c.match(url)||await c.match(new Request(url));if(!match)throw new Error('CACHE_ONLY_BLOCKED: '+new URL(url).pathname);log('CACHE HIT '+new URL(url).pathname.split('/').slice(-2).join('/'));return match.clone()}return nativeFetch(input,init)};
m.env.backends.onnx.wasm.numThreads=1;log('allowRemoteModels=true; network model fetch blocked unless cached; device=wasm; dtype=q4f16');const pipe=await m.pipeline('text-generation','onnx-community/SmolLM2-135M-Instruct-ONNX',{device:'wasm',dtype:'q4f16',progress_callback:p=>{if(p.status==='done')log('cached '+p.file)}});log('pipeline READY');try{const ses=pipe.model?.session||pipe.model?.sessions?.model||pipe.model?.sessions?.decoder_model_merged;log('session inputs '+JSON.stringify(ses?.inputNames||[]));log('session metadata '+JSON.stringify(ses?.inputMetadata||{}).slice(0,1800))}catch(e){log('metadata unavailable '+fmt(e))}$('state').textContent='模型載入成功，開始生成';let result;try{result=await pipe([{role:'user',content:'What is two plus two?'}],{max_new_tokens:16,do_sample:false})}catch(e){log('generation error '+fmt(e));throw e}log('ANSWER '+JSON.stringify(result));$('state').textContent='完成真正文字生成'}catch(e){log('FAIL '+fmt(e));$('state').textContent='WASM 快取推論失敗（未下載模型）'}finally{$('run').disabled=false}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(logLines.join('\n'));log('已複製')}catch(e){log('複製失敗 '+fmt(e))}};
</script></body></html>
