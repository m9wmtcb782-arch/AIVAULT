<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />
  <title>AIVAULT Digital Human</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #1e293b;
      --card-hover: #334155;
      --border: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --violet: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      line-height: 1.5;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    img, video, audio { max-width: 100%; }
    .header {
      position: sticky; top: 0; z-index: 40;
      background: rgba(15,23,42,.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .header h1 { font-size: 16px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header p { font-size: 11px; color: var(--text-muted); }
    .header .grow { flex: 1; min-width: 0; }
    .icon-btn, .pill {
      border: none; cursor: pointer; flex-shrink: 0;
      border-radius: 10px; font-weight: 700;
    }
    .icon-btn {
      width: 36px; height: 36px; background: #1e293b; border: 1px solid var(--border); color: #e2e8f0;
    }
    .pill {
      padding: 8px 12px; font-size: 12px;
      background: linear-gradient(135deg, #a855f7, #6366f1); color: #fff;
    }
    .pill.ghost { background: #334155; }
    .pill.danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
    .wrap { max-width: 640px; margin: 0 auto; padding: 14px 14px 110px; }
    .hero {
      border: 1px solid rgba(168,85,247,.35);
      background:
        radial-gradient(circle at 12% 20%, #4c1d95 0%, transparent 42%),
        radial-gradient(circle at 88% 0%, #1e3a8a 0%, transparent 40%),
        #0f172a;
      border-radius: 16px; padding: 16px; margin-bottom: 14px;
    }
    .preview {
      width: 100%; aspect-ratio: 3/4; max-height: 420px;
      object-fit: cover; border-radius: 16px; background: #020617;
      border: 1px solid var(--border); display: block;
    }
    .preview-ph {
      width: 100%; min-height: 220px; border-radius: 16px;
      border: 1px dashed #475569; display: grid; place-items: center;
      color: var(--text-muted); text-align: center; padding: 24px; background: #0f172a;
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px; margin-bottom: 10px;
    }
    .card h3 { font-size: 15px; margin-bottom: 4px; }
    .muted { color: var(--text-muted); font-size: 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row > .pill, .row > .icon-btn { flex: 1 1 auto; min-height: 44px; display: flex; align-items: center; justify-content: center; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 520px) { .grid.two { grid-template-columns: 1fr 1fr; } }
    label { display: block; font-size: 12px; color: var(--text-muted); margin: 10px 0 6px; }
    input, select, textarea {
      width: 100%; background: #020617; border: 1px solid var(--border);
      border-radius: 10px; padding: 12px; color: var(--text);
    }
    textarea { min-height: 140px; resize: vertical; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 10px; border-radius: 999px; font-size: 11px; font-weight: 700;
      background: #0f172a; border: 1px solid var(--border); color: #cbd5e1;
    }
    .chip.on { border-color: #22c55e; color: #86efac; }
    .asset {
      background: #0f172a; border: 1px solid var(--border); border-radius: 14px; padding: 10px;
    }
    .asset.selected { border-color: #22c55e; box-shadow: 0 0 0 1px #22c55e inset; }
    .thumb { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; background: #020617; }
    .toast {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(80px);
      background: #1e293b; border: 1px solid var(--border); color: #fff;
      padding: 12px 16px; border-radius: 12px; z-index: 80; max-width: 90%; text-align: center;
      transition: transform .25s ease; font-size: 13px;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .steps { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; }
    .steps span {
      flex: 0 0 auto; font-size: 11px; padding: 6px 10px; border-radius: 999px;
      border: 1px solid var(--border); color: var(--text-muted);
    }
    .steps span.on { background: rgba(168,85,247,.2); border-color: #a855f7; color: #e9d5ff; }
    .chat-box {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      display: flex; flex-direction: column; height: min(62vh, 520px); overflow: hidden;
    }
    .msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .bubble { max-width: 88%; padding: 10px 12px; border-radius: 14px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .me { align-self: flex-end; background: var(--primary); }
    .bot { align-self: flex-start; background: #334155; }
    .composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); align-items: center; }
    .composer input { flex: 1; border-radius: 999px; }
    .empty { text-align: center; padding: 36px 10px; color: var(--text-muted); }
    .danger-zone { border-color: rgba(239,68,68,.4); }
    video { width: 100%; border-radius: 12px; background: #000; }
    .hidden { display: none !important; }
    .face-stage {
      position: relative; overflow: hidden; border-radius: 16px;
      border: 1px solid var(--border); background: #020617; margin-bottom: 10px;
    }
    .face-stage img { width: 100%; aspect-ratio: 3/4; max-height: 360px; object-fit: cover; display: block; }
    .face-layer {
      position: absolute; left: 0; right: 0; bottom: 0; top: 42%;
      pointer-events: none;
      background: linear-gradient(to top, rgba(2,6,23,.35), transparent);
    }
    .face-svg { position: absolute; left: 50%; top: 38%; width: 58%; transform: translate(-50%,-20%); }
    .emo-tag {
      position: absolute; left: 10px; bottom: 10px;
      padding: 6px 10px; border-radius: 999px; font-size: 11px; font-weight: 800;
      background: rgba(15,23,42,.82); border: 1px solid #334155;
    }
    .face-stage.emo-happy .face-svg { filter: saturate(1.2); }
    .face-stage.emo-angry { box-shadow: inset 0 0 40px rgba(239,68,68,.25); }
    .face-stage.emo-sad { box-shadow: inset 0 0 40px rgba(59,130,246,.2); }
    .face-stage.emo-think { box-shadow: inset 0 0 40px rgba(168,85,247,.2); }
    .face-stage.emo-wow { box-shadow: inset 0 0 40px rgba(245,158,11,.25); }
    .face-stage.talking img { animation: faceTalk 0.28s infinite; }
    @keyframes faceTalk {
      0%,100% { transform: scale(1) translateY(0); filter: brightness(1); }
      50% { transform: scale(1.015) translateY(1px); filter: brightness(1.08); }
    }
    @keyframes blink { 0%, 88%, 100% { transform: scaleY(1); } 92% { transform: scaleY(.12); } }
    @keyframes talk { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
    .eye { transform-origin: center; animation: blink 3.4s infinite; }
    .mouth.talking { transform-origin: center; animation: talk .28s infinite; }
  </style>
</head>
<body>
  <header class="header">
    <button class="icon-btn" id="btnBack" type="button">←</button>
    <button class="pill ghost" id="btnHome" type="button">Home</button>
    <div class="grow">
      <h1 id="hdrTitle">AIVAULT Digital Human</h1>
      <p id="hdrSub">建立、管理與使用你的 AI 數字人。</p>
    </div>
    <button class="pill" id="btnPrimary" type="button">＋ 建立數字人</button>
  </header>

  <main class="wrap" id="app"></main>
  <div class="toast" id="toast"></div>

  <script type="module">
    const SUPABASE_URL = 'https://clcddygkaaqqtsbswgdf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsY2RkeWdrYWFxcXRzYnN3Z2RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzUwNjQsImV4cCI6MjEwMjMxMTA2NH0.kYg6h7n74CtbiIjNjZ2xxJj16SV42INZVzQ9dLNUfKE';
    const FN = (name) => `${SUPABASE_URL}/functions/v1/${name}`;

    const FALLBACK_PROVIDERS = [
      { code: 'groq', name: 'Groq', models: ['openai/gpt-oss-120b', 'llama-3.3-70b-versatile'] },
      { code: 'gemini', name: 'Gemini', models: ['gemini-2.5-flash'] },
      { code: 'gemini3', name: 'Gemini 3', models: ['gemini-2.5-flash'] },
      { code: 'gemini2', name: 'Gemini 2', models: ['gemini-2.5-flash'] },
      { code: 'openai', name: 'OpenAI', models: ['gpt-4o-mini'] }
    ];
    const DEFAULT_MODELS = {
      groq: ['openai/gpt-oss-120b', 'llama-3.3-70b-versatile'],
      gemini: ['gemini-2.5-flash'],
      gemini2: ['gemini-2.5-flash'],
      gemini3: ['gemini-2.5-flash'],
      openai: ['gpt-4o-mini']
    };
    const TONES = ['自然', '專業', '親切', '正式', '活潑'];
    const LANGS = [
      { v: 'zh-Hant', l: '繁體中文' },
      { v: 'zh-Hans', l: '簡體中文' },
      { v: 'en', l: 'English' },
      { v: 'auto', l: '自動' }
    ];
    const VIDEO_PROVIDERS = [
      { code: 'magic-hour', name: 'Magic Hour', test: 'magic-hour-test', result: 'magic-hour-result' }
    ];

    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, storage: window.localStorage }
    });

    let session = null;
    let humans = [];
    let current = null;
    let assets = { image: [], voice: [], video: [] };
    let providers = FALLBACK_PROVIDERS.slice();
    let draft = blankDraft();
    let chatLog = [];
    let lastSpoken = -1;
    let voiceChatOn = true;
    let voiceMode = sessionStorage.getItem('dh_voice_mode') || 'device';
    let mineAudio = null;
    let currentEmotion = 'calm';
    let singing = false;
    let scriptDraft = '';
    let chatClip = null;
    let recordingVideo = false;
    const SCRIPT_PRESETS = [
      { t: '打招呼', s: '你好，我是你的數字人，今天過得怎麼樣？' },
      { t: '自我介紹', s: '我是你專屬的 AI 數字人。我可以陪你聊天、回答問題，也可以唱歌給你聽。' },
      { t: '安慰', s: '沒關係，慢慢來。我在這裡陪你，你想說什麼都可以。' },
      { t: '鼓勵', s: '你已經做得很好了。先休息一下，我們再一起想下一步。' },
      { t: '道晚安', s: '今天也辛苦了。好好睡覺，明天再繼續。晚安。' },
      { t: '唱歌', s: '唱一首溫柔的短歌給我聽' }
    ];

    function blankDraft() {
      return {
        name: '',
        description: '',
        human_id: null,
        selected_image_id: null,
        selected_voice_id: null,
        brain_provider: 'groq',
        brain_model: 'openai/gpt-oss-120b',
        video_provider: 'magic-hour',
        persona_role: 'AIVAULT AI Assistant',
        persona_tone: '自然',
        persona_lang: 'zh-Hant',
        video_enabled: true,
        voice_enabled: true
      };
    }
    function persistDraft() {
      try {
        localStorage.setItem('dh_draft', JSON.stringify(draft));
        if (draft.human_id) localStorage.setItem('dh_human_id', draft.human_id);
        const step = sessionStorage.getItem('dh_step');
        if (step) localStorage.setItem('dh_step', step);
      } catch {}
    }
    function restoreDraft() {
      try {
        const raw = localStorage.getItem('dh_draft');
        if (raw) draft = { ...blankDraft(), ...JSON.parse(raw) };
        const hid = localStorage.getItem('dh_human_id') || sessionStorage.getItem('dh_human_id');
        if (hid) { draft.human_id = hid; sessionStorage.setItem('dh_human_id', hid); }
        const step = localStorage.getItem('dh_step') || sessionStorage.getItem('dh_step');
        if (step) sessionStorage.setItem('dh_step', step);
      } catch {}
    }
    restoreDraft();

    function toast(text) {
      const el = document.getElementById('toast');
      el.textContent = text;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2400);
    }
    function esc(v) {
      return String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    }
    function route() {
      const hash = (location.hash || '#/').replace(/^#/, '');
      const parts = hash.split('/').filter(Boolean);
      if (parts[0] !== 'digital-human' && parts[0] !== 'dh') {
        if (!parts.length) return { name: 'list' };
      }
      const segs = parts[0] === 'digital-human' || parts[0] === 'dh' ? parts.slice(1) : parts;
      if (!segs.length) return { name: 'list' };
      if (segs[0] === 'create') return { name: 'create', step: Number(new URLSearchParams(location.search).get('step') || 1) };
      const id = segs[0];
      const sub = segs[1] || 'dash';
      return { name: sub, id };
    }
    function go(path) {
      location.hash = path.startsWith('#') ? path : '#' + path;
    }

    async function authHeader() {
      const { data } = await sb.auth.getSession();
      session = data.session;
      const token = session?.access_token || SUPABASE_ANON_KEY;
      return {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`,
        'apikey': SUPABASE_ANON_KEY
      };
    }

    function errText(data, fallback) {
      return data?.error || data?.message || data?.msg || data?.code || data?.detail || fallback;
    }

    async function callFn(name, body) {
      const res = await fetch(FN(name), {
        method: 'POST',
        headers: await authHeader(),
        body: JSON.stringify(body || {})
      });
      let data = {};
      try { data = await res.json(); } catch {}
      if (!res.ok) throw new Error(errText(data, `${name} HTTP ${res.status}`));
      if (data && data.ok === false && (data.error || data.code)) throw new Error(errText(data, 'request failed'));
      return data;
    }

    async function callFnForm(name, form) {
      const { data } = await sb.auth.getSession();
      session = data.session;
      const token = session?.access_token || SUPABASE_ANON_KEY;
      const res = await fetch(FN(name), {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'apikey': SUPABASE_ANON_KEY
        },
        body: form
      });
      let data2 = {};
      try { data2 = await res.json(); } catch {}
      if (!res.ok) throw new Error(errText(data2, `${name} HTTP ${res.status}`));
      if (data2 && data2.ok === false && (data2.error || data2.code)) throw new Error(errText(data2, 'request failed'));
      return data2;
    }

    function unwrapList(data, keys = ['items', 'data', 'records', 'humans', 'assets', 'videos', 'images', 'voices']) {
      if (Array.isArray(data)) return data;
      for (const k of keys) if (Array.isArray(data?.[k])) return data[k];
      if (Array.isArray(data?.result)) return data.result;
      return [];
    }
    function unwrapOne(data) {
      return data?.asset || data?.result || data?.human || data?.item || data?.record || data?.data || data?.digital_human || data;
    }

    async function saveHuman(payload) {
      const attempts = [
        payload,
        { action: payload.action || (payload.id ? 'update' : 'create'), ...payload },
        { op: payload.action || (payload.id ? 'update' : 'create'), ...payload }
      ];
      let lastErr;
      for (const body of attempts) {
        try { return unwrapOne(await callFn('digital-human-save', body)); }
        catch (e) { lastErr = e; }
      }
      throw lastErr;
    }

    async function listHumans() {
      let list = [];
      try {
        const { data, error } = await sb.from('digital_humans').select('*').order('created_at', { ascending: false });
        if (!error && Array.isArray(data)) list = data;
      } catch {}
      if (!list.length) {
        const attempts = [{ action: 'list' }, { op: 'list' }, { type: 'list' }];
        for (const body of attempts) {
          try {
            const data = await callFn('digital-human-save', body);
            const rows = unwrapList(data);
            if (rows.length) { list = rows; break; }
          } catch {}
        }
      }
      const imgs = await listAssets('image');
      const voices = await listAssets('voice');
      assets.image = imgs;
      assets.voice = voices;
      const out = [];
      for (const h of list) {
        const img = imgs.find(x => String(x.id) === String(h.selected_image_id))
          || imgs.find(x => String(x.digital_human_id) === String(h.id))
          || imgs[0];
        const voice = voices.find(x => String(x.id) === String(h.selected_voice_id))
          || voices.find(x => String(x.digital_human_id) === String(h.id))
          || voices[0];
        const row = {
          ...h,
          preview_url: imageUrl(img) || h.preview_url || '',
          selected_image_id: h.selected_image_id || img?.id || null,
          selected_voice_id: h.selected_voice_id || voice?.id || null
        };
        if (row.id && img?.id && !h.selected_image_id) {
          try { await callFn('digital-human-asset', { action:'select_image', digital_human_id: row.id, image_id: img.id }); } catch {}
        }
        if (row.id && voice?.id && !h.selected_voice_id) {
          try { await callFn('digital-human-asset', { action:'select_voice', digital_human_id: row.id, voice_id: voice.id }); } catch {}
        }
        out.push(row);
      }
      return out;
    }

    async function getHuman(id) {
      try {
        const data = await callFn('digital-human-asset', { action: 'get_human', digital_human_id: id, id });
        const one = unwrapOne(data);
        if (one && (one.id || one.name)) return one;
      } catch {}
      const attempts = [
        { action: 'get', id },
        { action: 'get_human', digital_human_id: id },
        { id }
      ];
      for (const body of attempts) {
        try {
          const one = unwrapOne(await callFn('digital-human-save', body));
          if (one && (one.id || one.name)) return one;
        } catch {}
      }
      return humans.find(h => String(h.id) === String(id)) || { id };
    }

    async function listAssets(kind, humanId) {
      const table = kind === 'voice' ? 'digital_human_voices' : kind === 'video' ? 'ai_videos' : 'digital_human_images';
      let rows = [];
      try {
        let q = sb.from(table).select('*').order('created_at', { ascending: false });
        if (humanId) q = q.eq('digital_human_id', humanId);
        const { data, error } = await q;
        if (!error && Array.isArray(data)) rows = data;
        if (!rows.length && humanId) {
          const all = await sb.from(table).select('*').order('created_at', { ascending: false });
          if (!all.error && Array.isArray(all.data)) rows = all.data;
        }
      } catch {}
      if (!rows.length) {
        try {
          const data = await callFn('digital-human-asset', { action: 'list_assets', digital_human_id: humanId });
          const pack = data.result || data;
          rows = kind === 'voice' ? (pack.voices || []) : kind === 'video' ? (pack.videos || []) : (pack.images || []);
        } catch {}
      }
      if (rows.length) return await hydrateAssets(kind === 'voice' ? 'voice' : 'image', rows);
      try {
        const key = kind === 'voice' ? 'dh_last_voices' : kind === 'image' ? 'dh_last_images' : '';
        if (key) return JSON.parse(sessionStorage.getItem(key) || '[]');
      } catch {}
      return [];
    }

    function rememberHumanId(id) {
      if (!id) return;
      draft.human_id = id;
      try { sessionStorage.setItem('dh_human_id', id); } catch {}
    }

    async function updateBrain(id) {
      const payload = {
        action: 'update_human',
        id,
        digital_human_id: id,
        brain_provider: draft.brain_provider,
        provider: draft.brain_provider,
        brain_model: draft.brain_model,
        model: draft.brain_model,
        personality: {
          role: draft.persona_role || 'AIVAULT AI Assistant',
          style: draft.persona_tone || '自然',
          language: draft.persona_lang || 'zh-Hant'
        }
      };
      try {
        return unwrapOne(await callFn('digital-human-asset', payload));
      } catch {
        return unwrapOne(await callFn('digital-human-save', { ...payload, action: 'update' }));
      }
    }

    async function ensureHumanId() {
      if (current?.id) { rememberHumanId(current.id); return current.id; }
      if (draft.human_id) return draft.human_id;
      try {
        const sid = sessionStorage.getItem('dh_human_id');
        if (sid) { draft.human_id = sid; return sid; }
      } catch {}
      const existing = await listHumans();
      if (existing[0]?.id) {
        rememberHumanId(existing[0].id);
        current = existing[0];
        return existing[0].id;
      }
      if (!draft.name?.trim()) throw new Error('請先填寫數字人名稱');
      const created = unwrapOne(await callFn('digital-human-asset', {
        action: 'create_human',
        name: draft.name.trim(),
        description: draft.description || 'AIVAULT 數字人',
        brain_provider: draft.brain_provider,
        brain_model: draft.brain_model,
        personality: {
          role: draft.persona_role || 'AIVAULT AI Assistant',
          style: draft.persona_tone || '自然',
          language: draft.persona_lang || 'zh-Hant'
        },
        settings: { video_enabled: true, voice_enabled: true }
      }));
      const id = created?.id;
      if (!id) throw new Error('無法建立數字人，缺少 id');
      rememberHumanId(id);
      current = { ...(current || {}), ...created, id };
      return id;
    }

    async function uploadAsset(kind, file, humanId) {
      const id = humanId || await ensureHumanId();
      const action = kind === 'voice' ? 'upload_voice' : 'upload_image';
      const form = new FormData();
      form.append('action', action);
      form.append('digital_human_id', id);
      form.append('name', file.name || (kind === 'voice' ? 'Digital Human Voice' : 'Digital Human Image'));
      form.append('description', draft.description || '');
      form.append('file', file, file.name);
      const data = await callFnForm('digital-human-asset', form);
      const one = unwrapOne(data);
      if (!one || (!one.id && !one.storage_path)) throw new Error('上傳成功但沒有回傳資產');
      const local = URL.createObjectURL(file);
      const item = { ...one, preview_url: pickUrl(one) || pickUrl(data) || local, local_url: local };
      try {
        const key = kind === 'voice' ? 'dh_last_voices' : 'dh_last_images';
        const prev = JSON.parse(sessionStorage.getItem(key) || '[]');
        prev.unshift({ id: item.id, name: item.name, preview_url: item.preview_url, digital_human_id: id });
        sessionStorage.setItem(key, JSON.stringify(prev.slice(0, 12)));
      } catch {}
      return item;
    }

    async function deleteAsset(id, kind) {
      const hid = current?.id || draft.human_id;
      const action = kind === 'voice' ? 'delete_voice' : 'delete_image';
      const table = kind === 'voice' ? 'digital_human_voices' : 'digital_human_images';
      const body = { action, digital_human_id: hid, id };
      if (kind === 'voice') body.voice_id = id; else body.image_id = id;
      try {
        return await callFn('digital-human-delete', body);
      } catch (e) {
        const { error } = await sb.from(table).delete().eq('id', id);
        if (!error) return { success: true, deleted: true };
        throw new Error('刪除服務還沒部署：Supabase 建立 Function 名稱 digital-human-delete');
      }
    }


    async function startVideo(human, prompt, settings) {
      const provider = VIDEO_PROVIDERS.find(p => p.code === (human.video_provider || draft.video_provider)) || VIDEO_PROVIDERS[0];
      const body = {

        duration: settings.duration,
        aspect_ratio: settings.ratio,
        resolution: settings.resolution,

      };

      const provider = VIDEO_PROVIDERS[0];
      const id = job.job_id || job.id || job.request_id || job.video_id;
      return callFn(provider.result, { job_id: id, id, request_id: id });
    }

    function modelsOf(code) {
      const p = providers.find(x => x.code === code);
      const list = (p?.models && p.models.length) ? p.models : (DEFAULT_MODELS[code] || DEFAULT_MODELS.groq);
      return list.filter(Boolean);
    }

    async function loadProviders() {
      const attempts = [
        { action: 'providers' },
        { action: 'list_providers' },
        { op: 'providers' },
        { type: 'providers' }
      ];
      for (const body of attempts) {
        try {
          const data = await callFn('ai-gateway', body);
          const list = unwrapList(data, ['providers', 'items', 'data']);
          if (!list.length) continue;
          const mapped = list.map(p => ({
            code: p.code || p.id || p.provider,
            name: p.name || p.code || p.provider,
            models: p.models || p.model_list || DEFAULT_MODELS[p.code || p.id || p.provider] || []
          })).filter(p => p.code);
          if (mapped.length) {
            providers = mapped.map(p => ({
              ...p,
              models: (p.models && p.models.length) ? p.models : (DEFAULT_MODELS[p.code] || [])
            }));
            return;
          }
        } catch {}
      }
      providers = FALLBACK_PROVIDERS.slice();
    }

    function pickUrl(item) {
      if (!item || typeof item !== 'object') return '';
      const meta = item.metadata && typeof item.metadata === 'object' ? item.metadata : {};
      const raw = item.local_url || item.preview_url || item.public_url || item.signed_url || item.url || item.image_url || item.audio_url
        || meta.preview_url || meta.public_url || meta.signed_url || meta.url || '';
      return normalizeMediaUrl(raw);
    }
    function normalizeMediaUrl(u) {
      if (!u || typeof u !== 'string') return '';
      let s = u.trim();
      s = s.replace(SUPABASE_URL + '/storage/v1' + SUPABASE_URL, SUPABASE_URL);
      s = s.replace('/storage/v1https://', 'https://');
      if (s.startsWith('/storage/v1')) s = SUPABASE_URL + s;
      else if (s.startsWith('/object/')) s = SUPABASE_URL + '/storage/v1' + s;
      if (!/^https?:\/\//i.test(s) && !s.startsWith('blob:')) return '';
      return s;
    }
    async function signPath(kind, path) {
      if (!path) return '';
      const buckets = kind === 'voice'
        ? ['aivault-digital-human-voices', 'digital-human-voices']
        : ['aivault-digital-human-images', 'digital-human-images'];
      for (const bucket of buckets) {
        try {
          const { data } = await sb.storage.from(bucket).createSignedUrl(path, 60 * 60 * 24);
          if (data?.signedUrl) return data.signedUrl;
        } catch {}
      }
      return '';
    }
    async function hydrateAssets(kind, list) {
      const out = [];
      for (const x of list || []) {
        const item = { ...x };
        if (x.storage_path) item.preview_url = await signPath(kind, x.storage_path);
        if (!item.preview_url) item.preview_url = pickUrl(x);
        out.push(item);
      }
      return out;
    }
    function imageUrl(item) {
      if (!item) return '';
      return item.preview_url || item.local_url || pickUrl(item);
    }
    function voiceUrl(item) { return pickUrl(item); }
    function videoUrl(item) {
      return item?.mp4_url || item?.video_url || item?.public_url || item?.url || item?.download_url || '';
    }

        try {

          await ensureHumanId();
        } catch (err) { return toast(err.message); }
        sessionStorage.setItem('dh_step', '2'); persistDraft();
        return renderCreate();
      }
      if (step < 4) {
        sessionStorage.setItem('dh_step', String(step + 1)); persistDraft();
        const hid = current?.id || draft.human_id;
        if (hid) {
          assets.image = await listAssets('image', hid);
          assets.voice = await listAssets('voice', hid);
        }
        if (Number(sessionStorage.getItem('dh_step')) === 4) {
          if (!draft.selected_image_id && assets.image[0]?.id) draft.selected_image_id = assets.image[0].id;
          if (!draft.selected_voice_id && assets.voice[0]?.id) draft.selected_voice_id = assets.voice[0].id;

            try { await callFn('digital-human-asset', { action: 'select_image', digital_human_id: hid, image_id: draft.selected_image_id }); } catch {}
          }

            try { await callFn('digital-human-asset', { action: 'select_voice', digital_human_id: hid, voice_id: draft.selected_voice_id }); } catch {}
          }
        }
        return renderCreate();
      }
      toast('儲存 AI 大腦…');
      try {
        const id = await ensureHumanId();
        let saved = null;
        try { saved = await updateBrain(id); } catch {}
        try {
          saved = await saveHuman({
            action: 'update',
            id,
            digital_human_id: id,
            name: draft.name,
            description: draft.description,
            selected_image_id: draft.selected_image_id,
            selected_voice_id: draft.selected_voice_id,
            brain_provider: draft.brain_provider,
            provider: draft.brain_provider,
            brain_model: draft.brain_model,

            video_provider: draft.video_provider,
            persona_role: draft.persona_role,
            persona_tone: draft.persona_tone,
            persona_lang: draft.persona_lang,
            video_enabled: draft.video_enabled,
            voice_enabled: draft.voice_enabled,
            status: 'ready'
          });
        } catch {}
        sessionStorage.removeItem('dh_step');
        toast('AI 大腦已設定');
        go('/' + id);
      } catch (err) { toast(err.message); }
    }

    function stopTalk() {
      try { window.speechSynthesis?.cancel(); } catch {}
      try { mineAudio?.pause(); } catch {}
      try { stopHum(); } catch {}
    }

    function pickTalkVoice(langHint) {
      const voices = window.speechSynthesis?.getVoices?.() || [];
      const want = (langHint || 'zh-TW').toLowerCase();
      const zh = voices.filter(v => /zh|cmn|yue/i.test(v.lang));
      const female = zh.find(v => /female|woman|girl|ting|mei|xia|han|yating|hanhan|meijia|sinji/i.test(v.name + v.lang));
      return female || zh.find(v => v.lang.toLowerCase().startsWith(want)) || zh[0] || voices.find(v => v.lang.toLowerCase().startsWith('en')) || voices[0] || null;
    }

    function selectedVoiceItem() {
      const h = current || {};
      return assets.voice.find(x => String(x.id) === String(h.selected_voice_id))
        || assets.voice.find(x => x.is_selected)
        || assets.voice[0];
    }

    function playMyVoice() {
      const v = selectedVoiceItem();
      const url = voiceUrl(v);
      if (!url) { toast('還沒有我的聲音，請先去聲音克隆室錄音'); return false; }
      try { mineAudio?.pause(); } catch {}
      mineAudio = new Audio(url);
      mineAudio.play().catch(() => toast('我的聲音檔暫時無法播放，可改切「手機語音」'));
      mineAudio.onended = () => { mineAudio = null; };
      return true;
    }

    function speakBrowser(text, langHint) {
      if (!('speechSynthesis' in window)) return;
      const u = new SpeechSynthesisUtterance(String(text).replace(/[#*_`]/g, ''));
      u.lang = (langHint === 'en') ? 'en-US' : (langHint === 'zh-Hans' ? 'zh-CN' : 'zh-TW');
      u.rate = 1.02;
      u.pitch = 1.06;
      const v = pickTalkVoice(u.lang);
      if (v) u.voice = v;
      window.speechSynthesis.speak(u);
    }

    async function talk(text, langHint) {
      if (!voiceChatOn || !text) return;
      stopTalk();
      try { mineAudio?.pause(); } catch {}
      if (singing) return sing(text, langHint);
      try {
        const data = await callFn('aivault-tts', {
          action: 'tts',
          text: String(text).replace(/[#*_`]/g, ''),
          provider: 'auto',
          language: langHint === 'en' ? 'en-US' : (langHint === 'zh-Hans' ? 'zh-CN' : 'zh-TW'),
          digital_human_id: current?.id || draft.human_id,
          voice_id: current?.selected_voice_id || draft.selected_voice_id || null
        });
        const pack = data.result || data;
        const url = pack.audio_url;
        if (url) {
          mineAudio = new Audio(url);
          mineAudio.play().catch(() => speakBrowser(text, langHint));
          return;
        }
        if (pack.audio_base64) {
          mineAudio = new Audio('data:' + (pack.mime || 'audio/mpeg') + ';base64,' + pack.audio_base64);
          mineAudio.play().catch(() => speakBrowser(text, langHint));
          return;
        }
      } catch {}
      if (voiceMode === 'mine') { playMyVoice(); return; }
      speakBrowser(text, langHint);
    }

    function isSingAsk(text) {
      return /唱|唱歌|唱一[首曲]|哼歌|演唱|來首歌/.test(String(text || ''));
    }

    function startHum() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = 220;
        g.gain.value = 0.03;
        o.connect(g); g.connect(ctx.destination);
        o.start();
        const notes = [220, 247, 262, 294, 330, 294, 262, 247];
        let i = 0;
        const timer = setInterval(() => {
          o.frequency.setTargetAtTime(notes[i % notes.length], ctx.currentTime, 0.05);
          i += 1;
        }, 420);
        startHum._stop = () => { try { clearInterval(timer); o.stop(); ctx.close(); } catch {} };
      } catch {}
    }

    function stopHum() {
      try { startHum._stop?.(); } catch {}
      startHum._stop = null;
    }

    function sing(text, langHint) {
      stopTalk();
      stopHum();
      startHum();
      const lines = String(text).replace(/[#*_`]/g, '').split(/\n+/).map(s => s.trim()).filter(Boolean);
      const parts = lines.length > 1 ? lines : String(text).split(/[，。！？,.!?]/).map(s => s.trim()).filter(Boolean);
      const queue = parts.length ? parts : [text];
      const lang = (langHint === 'en') ? 'en-US' : (langHint === 'zh-Hans' ? 'zh-CN' : 'zh-TW');
      const voice = pickTalkVoice(lang);
      queue.forEach((line, idx) => {
        const u = new SpeechSynthesisUtterance(line);
        u.lang = lang;
        u.rate = 0.78;
        u.pitch = 1.35 + (idx % 3) * 0.08;
        if (voice) u.voice = voice;
        if (idx === queue.length - 1) u.onend = () => { stopHum(); singing = false; };
        window.speechSynthesis.speak(u);
      });
    }

    function mapEngineEmotion(raw) {
      const e = String(raw || '').toUpperCase();
      if (/JOY|HAPP|GLAD|EXCIT|AMUSE|LOVE|樂|喜/.test(e)) return 'happy';
      if (/ANG|RAGE|ANNOY|怒/.test(e)) return 'angry';
      if (/SAD|SORROW|GRIEF|哀/.test(e)) return 'sad';
      if (/SURPR|SHOCK|AMAZE|WONDER|驚/.test(e)) return 'wow';
      if (/THINK|CURIO|CONFUS|思/.test(e)) return 'think';
      return 'calm';
    }

    async function readEmotion(text) {

        const primary = pack.primary_emotion || pack.emotion || pack.facial_expression?.emotion;
        if (primary) return mapEngineEmotion(primary);
      } catch {}
      return detectEmotion(text);
    }

    function detectEmotion(text) {
      const t = String(text || '');
      const m = t.match(/\[表情[:：]\s*(喜|怒|哀|樂|驚|思|平)\]/);
      if (m) {
        return { 喜:'happy', 樂:'happy', 怒:'angry', 哀:'sad', 驚:'wow', 思:'think', 平:'calm' }[m[1]] || 'calm';
      }
      if (/開心|高興|哈哈|太好|喜歡|恭喜|棒|愛你|謝謝/.test(t)) return 'happy';
      if (/生氣|憤怒|討厭|不行|禁止|氣|怒/.test(t)) return 'angry';
      if (/難過|抱歉|可惜|傷心|遺憾|哭/.test(t)) return 'sad';
      if (/驚|哇|真的嗎|不會吧|意外/.test(t)) return 'wow';
      if (/想想|分析|可能|建議|因為|所以/.test(t)) return 'think';
      return 'calm';
    }

    function stripEmotionTag(text) {
      return String(text || '')
        .replace(/\[表情[:：]\s*(喜|怒|哀|樂|驚|思|平)\]\s*/g, '')
        .replace(/^\s*(首先|再來|接著|總結|第一[，,]|第二[，,])[:：]?\s*/gm, '')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
    }

      const f = faces[emotion] || faces.calm;

          <path d="M56 32 q14 ${f.brow} 22 0" stroke="#e2e8f0" stroke-width="3" fill="none" stroke-linecap="round"/>

    }

    function downloadText(text, filename) {
      const line = String(text || '').trim();
      if (!line) return toast('沒有可下載的文字');
      const blob = new Blob([line], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename || 'script.txt';
      document.body.appendChild(a);
      a.click();
      a.remove();
      toast('已開始下載');
    }

      if (!url) return toast('還沒有可下載的聲音檔');

        const blob = await res.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = (v.name || 'digital-human-voice') + (/\.\w+$/.test(v.name || '') ? '' : '.wav');
        document.body.appendChild(a);

        a.remove();
        toast('聲音檔下載中');

        location.href = url;

    async function recordChatVideo() {
      if (recordingVideo) return toast('正在錄製，請稍候');
      const h = current || {};
      if (!h.id) return toast('找不到數字人');
      if (!h.selected_image_id && !assets.image[0]) return toast('請先選擇一張照片再錄影片');
      const line = clipLine();
      if (!line) return toast('請先語音聊天，或在文案框輸入她要說的話');
      recordingVideo = true;
      renderChat();
      toast('開始錄製 AI 影片…');
      try {
        const human = {
          ...h,
          selected_image_id: h.selected_image_id || assets.image[0]?.id,
          selected_voice_id: h.selected_voice_id || assets.voice[0]?.id,
          voice_enabled: true
        };
        const prompt = `一位女性數字人面向鏡頭，自然微笑，口語說出以下內容，不要加字幕標題：${line}`;
        const job = unwrapOne(await startVideo(human, prompt, { duration: '5', ratio: '9:16', resolution: '720p' }));
        let result = job;
        for (let i = 0; i < 24; i++) {
          const url = videoUrl(result);
          const st = String(result.status || result.state || '').toLowerCase();
          if (url && /done|complete|success|ready/.test(st || 'ready')) break;
          if (url && i > 2) break;
          await new Promise(r => setTimeout(r, 4000));
          result = unwrapOne(await pollVideo(result));
        }
        const url = videoUrl(result);
        if (!url) throw new Error('影片還沒好，請稍後再按一次');
        chatClip = { url, raw: result, prompt: line };
        try {
          await callFn('digital-human-save', {
            action: 'save_video',
            digital_human_id: human.id,
            prompt: line,
            video_url: url,
            mp4_url: url
          });
        } catch {}
        toast('影片已可播放與下載');
      } catch (err) {
        toast(err.message || '錄製失敗');
      } finally {
        recordingVideo = false;
        renderChat();
      }
    }

    async function downloadChatClip() {
      if (!chatClip?.url) return toast('還沒有影片');
      try {
        const res = await fetch(chatClip.url);
        const blob = await res.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = (current?.name || 'digital-human') + '.mp4';
        document.body.appendChild(a);
        a.click();
        a.remove();
        toast('影片下載中');
      } catch {
        location.href = chatClip.url;
      }
    }

    function startListen() {
      const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Rec) return toast('此裝置不支援語音輸入，請改打字');
      stopTalk();
      const r = new Rec();
      r.lang = current?.persona_lang === 'en' ? 'en-US' : 'zh-TW';
      r.interimResults = false;
      toast('請開始說話…');
      r.onresult = ev => {
        const said = ev.results[0][0].transcript;
        const input = document.getElementById('chatIn');
        if (input) input.value = said;
        sendChat();
      };
      r.onerror = () => toast('沒聽到，請再按一次麥克風');
      r.start();
    }

    async function sendChat() {
      const input = document.getElementById('chatIn');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      stopTalk();
      stopHum();
      singing = isSingAsk(text);
      chatLog.push({ role: 'user', text });
      renderChat();
      const h = current || {};
      const lang = h.persona_lang === 'en' ? 'English' : h.persona_lang === 'zh-Hans' ? '简体中文' : '繁體中文';
      const systemPrompt = singing
        ? `你是數字人「${h.name || 'AIVAULT'}」，現在要唱歌給使用者聽。請使用${lang}。第一行只寫 [表情:樂]。
從第二行開始只輸出歌詞，每行一句，4到8句，像隨口哼給朋友聽。不要解釋、不要標題、不要寫「歌詞如下」。`
        : `你是數字人「${h.name || 'AIVAULT'}」。用${lang}跟對方聊天。
說話要像真人：口語、順暢、自然，一次把話說完。
規則：
- 第一行只寫一個標籤：[表情:喜] [表情:怒] [表情:哀] [表情:樂] [表情:驚] [表情:思] [表情:平] 其中一個
- 標籤下一行開始才是對使用者說的話
- 不要條列、不要標題、不要「首先／再來／總結」
- 不要重複對方的整句話
- 2到5句就好，像當面講，不要書面報告
角色：${h.persona_role || 'AIVAULT AI Assistant'}。語氣：${h.persona_tone || '自然'}。`;
      try {
        const history = chatLog.slice(-8).map(m => ({
          role: m.role === 'assistant' ? 'assistant' : 'user',
          content: m.text
        }));
        await thinkBrain(text, singing ? 'CREATIVE' : 'CONVERSATION');
        const data = await callFn('ai-gateway', {
          provider: h.brain_provider || h.provider || 'groq',
          model: h.brain_model || h.model || 'openai/gpt-oss-120b',
          agent: h.name || 'Digital Human',
          systemPrompt,
          messages: [{ role: 'system', content: systemPrompt }, ...history]
        });
        const raw = data.content || data.response || data.text || data.message || data.choices?.[0]?.message?.content || '（無內容）';
        const content = stripEmotionTag(raw);
        currentEmotion = singing ? 'happy' : await readEmotion(content);
        chatLog.push({ role: 'assistant', text: content });
      } catch (err) {
        currentEmotion = 'sad';
        chatLog.push({ role: 'assistant', text: 'AI Gateway 錯誤：' + err.message });
      }
      renderChat();
    }

    function renderVideo() {
      const h = current || {};
      setHeader('AI Video', h.name || '', null);
      document.getElementById('app').innerHTML = `
        <div class="card">
          <h3>你想讓數字人做什麼？</h3>
          <label>提示詞</label>
          <textarea id="vPrompt" placeholder="例如：我的數字人在台北街頭介紹 AIVAULT，使用自然的語氣向使用者說明平台功能。"></textarea>
          <label>時長</label>
          <select id="vDur"><option>5</option><option selected>10</option><option>15</option><option>30</option></select>
          <label>比例</label>
          <select id="vRatio"><option>9:16</option><option>16:9</option><option>1:1</option></select>
          <label>解析度</label>
          <select id="vRes"><option>720p</option><option selected>1080p</option></select>
          <label>影片 Provider</label>
          <select id="vProv">${VIDEO_PROVIDERS.map(p => `<option value="${p.code}">${p.name}</option>`).join('')}</select>
          <p class="muted" style="margin-top:8px;">目前可走 Magic Hour（magic-hour-test / magic-hour-result），架構可換其他 Video Provider。</p>
          <div class="row" style="margin-top:12px;"><button class="pill" id="btnGen">產生影片</button></div>
        </div>
        <div class="card hidden" id="vResult"></div>`;
      document.getElementById('btnGen').onclick = generateVideo;
    }

    async function generateVideo() {
      const prompt = document.getElementById('vPrompt').value.trim();
      if (!prompt) return toast('請先輸入提示詞');
      const settings = {
        duration: document.getElementById('vDur').value,
        ratio: document.getElementById('vRatio').value,
        resolution: document.getElementById('vRes').value
      };
      current.video_provider = document.getElementById('vProv').value;
      toast('開始產生影片…');
      try {
        const job = await startVideo(current, prompt, settings);
        const box = document.getElementById('vResult');
        box.classList.remove('hidden');
        box.innerHTML = `<p class="muted">生成中… job=${esc(job.job_id || job.id || '')}</p>`;
        let result = job;
        for (let i = 0; i < 20; i++) {
          if (result.status === 'complete' || result.status === 'completed' || result.mp4_url || result.video_url) break;
          await new Promise(r => setTimeout(r, 3000));
          try { result = await pollVideo(job); } catch {}
        }
        const url = videoUrl(result);
        if (!url) {
          box.innerHTML = `<p>狀態：${esc(result.status || '未知')}</p><p class="muted">${esc(JSON.stringify(result).slice(0, 240))}</p>`;
          return;
        }
        try {
          await callFn('digital-human-save', {
            action: 'save_video',
            digital_human_id: current.id,
            name: prompt.slice(0, 40),
            storage_path: result.storage_path,
            video_url: url,
            status: 'complete'
          });
        } catch {}
        box.innerHTML = `
          <video id="player" controls src="${esc(url)}" playsinline></video>
          <div class="row" style="margin-top:10px;">
            <button class="pill" id="btnPlay">▶ 播放</button>
            <a class="pill ghost" href="${esc(url)}" download="aivault-digital-human.mp4">⬇ 下載影片</a>
            <button class="pill ghost" id="btnSaveVid">儲存至我的影片</button>
          </div>`;
        document.getElementById('btnPlay').onclick = () => document.getElementById('player').play();
        document.getElementById('btnSaveVid').onclick = () => toast('已嘗試寫入後端影片資料');
      } catch (err) { toast(err.message); }
    }

    function renderImages() {
      const h = current || {};
      setHeader('圖片管理', h.name || '', '＋ 上傳圖片', () => document.getElementById('fileImg').click());
      document.getElementById('app').innerHTML = `
        <input id="fileImg" class="hidden" type="file" accept="image/png,image/jpeg,image/jpg,image/webp" />
        <div class="grid two" id="imgGrid"></div>`;
      document.getElementById('fileImg').onchange = async (e) => {
        const file = e.target.files?.[0]; if (!file) return;
        try {
          const item = await uploadAsset('image', file, h.id);
          assets.image.unshift(item);
          renderImages();
          toast('圖片已儲存');
        } catch (err) { toast(err.message); }
      };
      const grid = document.getElementById('imgGrid');
      grid.innerHTML = assets.image.length ? assets.image.map(img => `
        <div class="asset ${String(img.id)===String(h.selected_image_id)?'selected':''}">
          <img class="thumb" alt="" src="${esc(imageUrl(img))}"/>
          <div style="margin-top:8px;font-weight:700;">${esc(img.name || '圖片')}</div>
          <div class="muted">${esc(img.created_at || '')} ${String(img.id)===String(h.selected_image_id)?'· 目前使用中':''}</div>
          <div class="row" style="margin-top:8px;">
            <button class="pill ghost" data-pick-img="${esc(img.id)}">選擇</button>
            <button class="pill danger" data-del-img="${esc(img.id)}">刪除</button>
          </div>
        </div>`).join('') : `<div class="empty">尚無圖片</div>`;
    }

    function renderVoices() {
      const h = current || {};
      setHeader('聲音管理', h.name || '', '＋ 上傳聲音', () => document.getElementById('fileVoice').click());
      document.getElementById('app').innerHTML = `
        <input id="fileVoice" class="hidden" type="file" accept="audio/mpeg,audio/wav,audio/mp4,audio/ogg,audio/webm,.mp3,.wav,.m4a,.ogg,.webm" />
        <div class="grid" id="voiceGrid"></div>`;
      document.getElementById('fileVoice').onchange = async (e) => {
        const file = e.target.files?.[0]; if (!file) return;
        try {
          const item = await uploadAsset('voice', file, h.id);
          assets.voice.unshift(item);
          renderVoices();
          toast('聲音已儲存');
        } catch (err) { toast(err.message); }
      };
      document.getElementById('voiceGrid').innerHTML = assets.voice.map(v => `
        <div class="asset ${String(v.id)===String(h.selected_voice_id)?'selected':''}">
          <div style="font-weight:700;">${esc(v.name || '聲音')}</div>
          <div class="muted">${esc(v.created_at || '')} ${String(v.id)===String(h.selected_voice_id)?'· 目前使用中':''}</div>
          ${voiceUrl(v) ? `<audio controls src="${esc(voiceUrl(v))}" style="width:100%;margin-top:8px;"></audio>` : ''}
          <div class="row" style="margin-top:8px;">
            <button class="pill ghost" data-pick-voice="${esc(v.id)}">選擇</button>
            <button class="pill danger" data-del-voice="${esc(v.id)}">刪除</button>
          </div>
        </div>`).join('') || `<div class="empty">尚無聲音</div>`;
    }

    function renderVideos() {
      const h = current || {};
      setHeader('影片管理', h.name || '', '產生影片', () => go(`/${h.id}/video`));
      document.getElementById('app').innerHTML = assets.video.map(v => {
        const st = v.status || 'complete';
        const url = videoUrl(v);
        return `<div class="card">
          ${url ? `<video controls src="${esc(url)}" playsinline></video>` : `<div class="preview-ph">${esc(st)}</div>`}
          <h3 style="margin-top:8px;">${esc(v.name || '影片')}</h3>
          <p class="muted">${esc(v.created_at || '')} · ${st==='complete'||st==='completed'?'完成':st==='failed'?'失敗':'生成中'}</p>
          <div class="row">
            ${url ? `<a class="pill" href="${esc(url)}" download="aivault-video.mp4">⬇ 下載</a>` : ''}
            <button class="pill danger" data-del-vid="${esc(v.id)}">刪除</button>
          </div>
        </div>`;
      }).join('') || `<div class="empty">尚無影片</div>`;
    }

    function renderSettings() {
      const h = current || {};
      Object.assign(draft, {
        name: h.name || '',
        description: h.description || '',
        brain_provider: h.brain_provider || h.provider || draft.brain_provider,
        brain_model: h.brain_model || h.model || draft.brain_model,
        persona_role: h.persona_role || 'AIVAULT AI Assistant',
        persona_tone: h.persona_tone || '自然',
        persona_lang: h.persona_lang || 'zh-Hant',
        video_enabled: h.video_enabled !== false,
        voice_enabled: h.voice_enabled !== false
      });
      setHeader('設定', h.name || '', '儲存設定', saveSettings);
      document.getElementById('app').innerHTML = `
        <div class="card">
          <h3>基本資料</h3>
          <label>名稱</label><input id="fName" value="${esc(draft.name)}" />
          <label>描述</label><textarea id="fDesc">${esc(draft.description)}</textarea>
        </div>
        <div class="card">
          <h3>AI 大腦</h3>
          ${brainForm(draft)}
        </div>
        <div class="card">
          ${personaForm(draft)}
        </div>
        <div class="card">
          <h3>功能</h3>
          <label>影片功能</label>
          <select id="fVidOn"><option value="1" ${draft.video_enabled?'selected':''}>ON</option><option value="0" ${!draft.video_enabled?'selected':''}>OFF</option></select>
          <label>聲音功能</label>
          <select id="fVoiceOn"><option value="1" ${draft.voice_enabled?'selected':''}>ON</option><option value="0" ${!draft.voice_enabled?'selected':''}>OFF</option></select>
        </div>
        <div class="card danger-zone">
          <h3>危險操作</h3>
          <button class="pill danger" id="btnDelHuman">刪除數字人</button>
        </div>`;
      document.getElementById('fProvider').onchange = (e) => {
        draft.brain_provider = e.target.value;
        draft.brain_model = modelsOf(draft.brain_provider)[0] || draft.brain_model;
        toast('已選擇 AI：' + draft.brain_provider);
        renderSettings();
      };
      document.getElementById('fModel').onchange = (e) => {
        draft.brain_model = e.target.value;
        toast('已選擇 Model：' + draft.brain_model);
      };
      document.getElementById('btnDelHuman').onclick = async () => {
        if (!confirm('確定刪除這個數字人？此操作需二次確認。')) return;
        if (!confirm('再次確認：刪除後無法從這個畫面復原。')) return;
        try {
          await saveHuman({ action: 'delete', id: h.id });
          toast('已刪除');
          go('/');
        } catch (err) { toast(err.message); }
      };
    }

    async function saveSettings() {
      const h = current;
      try {
        const saved = await saveHuman({
          action: 'update',
          id: h.id,
          name: document.getElementById('fName').value.trim(),
          description: document.getElementById('fDesc').value.trim(),
          brain_provider: document.getElementById('fProvider').value,
          provider: document.getElementById('fProvider').value,
          brain_model: document.getElementById('fModel').value,
          model: document.getElementById('fModel').value,
          persona_role: document.getElementById('fRole').value,
          persona_tone: document.getElementById('fTone').value,
          persona_lang: document.getElementById('fLang').value,
          video_enabled: document.getElementById('fVidOn').value === '1',
          voice_enabled: document.getElementById('fVoiceOn').value === '1'
        });
        current = { ...h, ...saved };
        toast('設定已儲存');
        go(`/${h.id}`);
      } catch (err) { toast(err.message); }
    }

    async function pickImage(id) {
      draft.selected_image_id = id;
      const hid = current?.id || draft.human_id;
      if (hid) {
        try {
          await callFn('digital-human-asset', { action: 'select_image', digital_human_id: hid, image_id: id });
          current = { ...(current || {}), id: hid, selected_image_id: id };
          toast('已更新 selected_image_id');
        } catch (err) { toast(err.message); }
      }
      await render();
    }
    async function pickVoice(id) {
      draft.selected_voice_id = id;
      const hid = current?.id || draft.human_id;
      if (hid) {
        try {
          await callFn('digital-human-asset', { action: 'select_voice', digital_human_id: hid, voice_id: id });
          current = { ...(current || {}), id: hid, selected_voice_id: id };
          toast('已更新 selected_voice_id');
        } catch (err) { toast(err.message); }
      }
      await render();
    }

    document.getElementById('btnHome').onclick = () => { location.href = 'aivault-home.html'; };
    document.getElementById('btnBack').onclick = () => {
      const r = route();
      if (r.name === 'list') {
        location.href = 'aivault-home.html';
        return;
      }
      if (r.name === 'create') {
        persistDraft();
        const step = Number(sessionStorage.getItem('dh_step') || '1');
        if (step > 1) {
          sessionStorage.setItem('dh_step', String(step - 1));
          localStorage.setItem('dh_step', String(step - 1));
          renderCreate();
          return;
        }
        go('/'); return;
      }
      if (r.name === 'dash') { go('/'); return; }
      go('/' + r.id);
    };

    document.getElementById('app').addEventListener('click', async (e) => {
      const goBtn = e.target.closest('[data-go]');
      if (goBtn) { go(goBtn.getAttribute('data-go')); return; }
      const vs = e.target.closest('[data-go-voice]');
      if (vs) { location.href = 'aivault-voice-studio.html'; return; }
      const stg = e.target.closest('[data-go-stage]');
      if (stg) {
        sessionStorage.setItem('AIVAULT_DH_ID', stg.getAttribute('data-go-stage'));
        location.href = 'aivault-3d-stage.html';
        return;
      }
      const wr = e.target.closest('[data-go-warroom]');
      if (wr) {
        sessionStorage.setItem('AIVAULT_DH_ID', wr.getAttribute('data-go-warroom'));
        location.href = 'aivault-warroom.html';
        return;
      }
      const pi = e.target.closest('[data-pick-img]');
      if (pi) { await pickImage(pi.getAttribute('data-pick-img')); return; }
      const pv = e.target.closest('[data-pick-voice]');
      if (pv) { await pickVoice(pv.getAttribute('data-pick-voice')); return; }
      const dh = e.target.closest('[data-del-human]');
      if (dh) {
        if (!confirm('確定刪除這位數字人？圖片與聲音會一併刪。')) return;
        try { await deleteHuman(dh.getAttribute('data-del-human')); toast('已刪除'); go('/'); }
        catch (err) { toast(err.message); }
        return;
      }
      const di = e.target.closest('[data-del-img]');
      if (di) {
        if (!confirm('確定刪除這張圖片？')) return;
        try { await deleteAsset(di.getAttribute('data-del-img'), 'image'); assets.image = assets.image.filter(x => String(x.id) !== di.getAttribute('data-del-img')); toast('已刪除'); render(); }
        catch (err) { toast(err.message); }
      }
      const dv = e.target.closest('[data-del-voice]');
      if (dv) {
        if (!confirm('確定刪除這個聲音？')) return;
        try { await deleteAsset(dv.getAttribute('data-del-voice'), 'voice'); assets.voice = assets.voice.filter(x => String(x.id) !== dv.getAttribute('data-del-voice')); toast('已刪除'); render(); }
        catch (err) { toast(err.message); }
      }
      const dvid = e.target.closest('[data-del-vid]');
      if (dvid) {
        if (!confirm('確定刪除這部影片？')) return;
        try {
          await callFn('digital-human-save', { action: 'delete_video', id: dvid.getAttribute('data-del-vid') });
          assets.video = assets.video.filter(x => String(x.id) !== dvid.getAttribute('data-del-vid'));
          toast('已刪除'); render();
        } catch (err) { toast(err.message); }
      }
    });

    async function render() {
      const r = route();
      if (r.name === 'list') {
        humans = await listHumans();
        const hid = draft.human_id || localStorage.getItem('dh_human_id');
        if (!humans.length && hid) {
          const one = await getHuman(hid);
          if (one?.id) humans = [one];
        }
        return renderList();
      }
      if (r.name === 'create') {
        if (!sessionStorage.getItem('dh_step')) sessionStorage.setItem('dh_step', '1');
        const hid = current?.id || draft.human_id;
        assets.image = hid ? await listAssets('image', hid) : [];
        assets.voice = hid ? await listAssets('voice', hid) : [];
        return renderCreate();
      }
      current = await getHuman(r.id);
      assets.image = await listAssets('image', r.id);
      assets.voice = await listAssets('voice', r.id);
      assets.video = await listAssets('video', r.id);
      if (r.name === 'chat') return renderChat();
      if (r.name === 'video') return renderVideo();
      if (r.name === 'images') return renderImages();
      if (r.name === 'voices') return renderVoices();
      if (r.name === 'videos') return renderVideos();
      if (r.name === 'settings') return renderSettings();
      return renderDash();
    }

    window.addEventListener('hashchange', render);
    await loadProviders();
    if (!location.hash) location.hash = '#/';
    else await render();
  </script>
</body>
</html>
