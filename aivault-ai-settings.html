<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#070b14"/>
<title>AIVAULT — 我的 AI 設定</title>
<style>
:root{--bg:#070b14;--card:#0f172a;--line:#1e293b;--text:#e8eef8;--muted:#8b9bb0;--green:#22c55e;--red:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;line-height:1.5}
button,input,select{font:inherit}button{cursor:pointer}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:rgba(7,11,20,.96);flex-wrap:wrap}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#0ea5e9,#8b5cf6);display:grid;place-items:center;font-size:10px;font-weight:900}
.brand h1{font-size:15px}.brand .sub{font-size:11px;color:var(--muted)}
.btn{border:none;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;background:#1e293b;color:#fff}
.btn.primary{background:linear-gradient(135deg,#0ea5e9,#6366f1)}
.btn.success{background:var(--green);color:#04120a}
.btn.danger{background:transparent;border:1px solid var(--red);color:#fca5a5}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
input,select{width:100%;background:#020617;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#020617;font-size:13px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#1e293b;color:#93c5fd}
.badge.on{background:rgba(34,197,94,.15);color:#86efac}
.badge.off{background:rgba(239,68,68,.12);color:#fca5a5}
.meta{font-size:12px;color:var(--muted)}
.warn{font-size:12px;color:#fcd34d;margin-top:8px;line-height:1.5}
.ok{font-size:14px;color:#86efac;font-weight:700;margin-top:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:#1e293b;border:1px solid var(--line);padding:10px 14px;border-radius:12px;z-index:50;transition:.25s;font-size:13px;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="top">
  <div class="logo">AI</div>
  <div class="brand">
    <h1>我的 AI 設定</h1>
    <div class="sub">自備 Provider Key · 後端加密 · 不顯示 Token</div>
  </div>
  <div style="margin-left:auto">
    <button class="btn ghost" type="button" id="btnHome">Home</button>
  </div>
</header>
<main class="wrap">
  <div class="card">
    <div class="meta" id="authStatus">正在確認登入狀態…</div>
    <div id="successBanner" class="ok hidden"></div>
    <p class="warn">API Key 只在送出當下傳給後端加密保存。畫面只顯示遮罩與狀態，不會顯示完整 Key 或登入 Token。</p>
  </div>
  <div class="card">
    <h3 style="font-size:14px;margin-bottom:8px">新增／更新 Provider Key</h3>
    <label>Provider</label>
    <select id="provider">
      <option value="groq">Groq</option>
      <option value="gemini">Gemini</option>
      <option value="openai">OpenAI</option>
      <option value="anthropic">Anthropic</option>
    </select>
    <label>Key 名稱</label>
    <input id="keyName" value="default" autocomplete="off"/>
    <label>API Key（送出後立即清除）</label>
    <input id="apiKey" type="password" autocomplete="off" placeholder="貼上你的 Provider API Key"/>
    <div class="row">
      <button class="btn" type="button" id="btnTest">測試</button>
      <button class="btn primary" type="button" id="btnSave">儲存並啟用</button>
    </div>
    <p class="meta" style="margin-top:8px">Groq：<a href="https://console.groq.com/keys" target="_blank" rel="noopener" style="color:#93c5fd">console.groq.com/keys</a></p>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;margin-top:0">
      <h3 style="font-size:14px">我的 API Key</h3>
      <button class="btn ghost" type="button" id="btnRefresh">重新整理</button>
    </div>
    <div id="list" class="meta">載入中…</div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
const SUPABASE_URL = 'https://clcddygkaaqqtsbswgdf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsY2RkeWdrYWFxcXRzYnN3Z2RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzUwNjQsImV4cCI6MjEwMjMxMTA2NH0.kYg6h7n74CtbiIjNjZ2xxJj16SV42INZVzQ9dLNUfKE';
const CRED_URL = SUPABASE_URL + '/functions/v1/user-credentials';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let memAccessToken = null;
let memUserId = null;

function sanitizeUserMessage(msg) {
  let s = String(msg == null ? '' : msg);
  s = s.replace(/eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/g, '[已隱藏]');
  s = s.replace(/Bearer\s+[A-Za-z0-9._\-]+/gi, '[已隱藏]');
  s = s.replace(/access_token["'\s:=]+[^,\s}"]+/gi, 'access_token=[已隱藏]');
  s = s.replace(/refresh_token["'\s:=]+[^,\s}"]+/gi, 'refresh_token=[已隱藏]');
  if (s.length > 180) s = s.slice(0, 180) + '…';
  return s;
}
function toast(t) {
  const el = document.getElementById('toast');
  el.textContent = sanitizeUserMessage(t);
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}
function showSuccess(providerLabel) {
  const el = document.getElementById('successBanner');
  el.textContent = providerLabel + ' API Key 已啟用 ✓';
  el.classList.remove('hidden');
}
function humanError(err) {
  const raw = String(err && err.message ? err.message : err || '');
  if (/INVALID_CREDENTIAL/i.test(raw)) return 'API Key 無效，請重新設定。';
  if (/UNAUTHORIZED|JWT|session|login|登入/i.test(raw)) return '請先登入後再操作。';
  if (/NOT_FOUND|404|Failed to fetch/i.test(raw)) return '憑證服務尚未就緒，請稍後再試。';
  if (/DB_ERROR|SERVER|UNKNOWN_ACTION/i.test(raw)) return 'API Key 啟用失敗，請重新設定。';
  return 'API Key 啟用失敗，請重新設定。';
}
function providerLabel(p) {
  const m = { groq: 'Groq', gemini: 'Gemini', openai: 'OpenAI', anthropic: 'Anthropic' };
  return m[p] || p || 'Provider';
}
async function ensureSession() {
  const { data, error } = await sb.auth.getSession();
  if (error || !data?.session?.access_token) {
    memAccessToken = null;
    memUserId = null;
    document.getElementById('authStatus').textContent = '尚未登入。請先完成註冊／登入後再開啟此頁。';
    return false;
  }
  memAccessToken = data.session.access_token;
  memUserId = data.session.user?.id || null;
  const email = data.session.user?.email || '';
  document.getElementById('authStatus').textContent =
    '已登入' + (email ? ' · ' + email : '') + ' · 可管理自己的 API Key';
  return true;
}
async function callCred(body) {
  if (!memAccessToken) {
    const ok = await ensureSession();
    if (!ok) throw new Error('UNAUTHORIZED');
  }
  const res = await fetch(CRED_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + memAccessToken,
      'apikey': SUPABASE_ANON_KEY
    },
    body: JSON.stringify(body)
  });
  let data;
  try { data = await res.json(); } catch { throw new Error('NOT_FOUND'); }
  if (!res.ok || data.success === false) throw new Error(data.error || 'FAILED');
  return data;
}
function renderList(credentials) {
  const el = document.getElementById('list');
  if (!credentials || !credentials.length) {
    el.innerHTML = '<span class="meta">尚無已儲存的 Key。請在上方新增。</span>';
    return;
  }
  el.innerHTML = credentials.map(c => {
    const on = c.status === 'ACTIVE';
    return '<div class="item">' +
      '<div><b>' + providerLabel(c.provider) + '</b> · ' + (c.key_name || 'default') +
      ' <span class="badge ' + (on ? 'on' : 'off') + '">' + (on ? '使用中' : (c.status || '—')) + '</span></div>' +
      '<div class="meta">' + (c.key_mask || '••••••••') + '</div>' +
      '<div class="row">' +
      '<button class="btn success" type="button" data-use="' + c.id + '" data-provider="' + c.provider + '">使用</button>' +
      '<button class="btn" type="button" data-dis="' + c.id + '">停用</button>' +
      '<button class="btn danger" type="button" data-del="' + c.id + '">刪除</button>' +
      '</div></div>';
  }).join('');
}
async function refresh() {
  try {
    const ok = await ensureSession();
    if (!ok) { document.getElementById('list').textContent = '請先登入。'; return; }
    const data = await callCred({ action: 'list' });
    renderList(data.credentials || []);
  } catch (e) {
    document.getElementById('list').textContent = humanError(e);
    toast(humanError(e));
  }
}
document.getElementById('btnHome').onclick = function () { location.href = 'aivault-home.html'; };
document.getElementById('btnRefresh').onclick = function () { refresh(); };
document.getElementById('btnTest').onclick = async function () {
  var api_key = document.getElementById('apiKey').value;
  if (!api_key) { toast('請輸入 API Key'); return; }
  try {
    await callCred({ action: 'test', provider: document.getElementById('provider').value, api_key: api_key });
    toast(providerLabel(document.getElementById('provider').value) + ' Key 測試成功');
  } catch (e) { toast(humanError(e)); }
};
document.getElementById('btnSave').onclick = async function () {
  var api_key = document.getElementById('apiKey').value;
  var provider = document.getElementById('provider').value;
  if (!api_key) { toast('請輸入 API Key'); return; }
  try {
    await callCred({
      action: 'upsert',
      provider: provider,
      key_name: document.getElementById('keyName').value || 'default',
      api_key: api_key
    });
    document.getElementById('apiKey').value = '';
    showSuccess(providerLabel(provider));
    toast(providerLabel(provider) + ' API Key 已啟用 ✓');
    await refresh();
  } catch (e) { toast(humanError(e)); }
};
document.getElementById('list').onclick = async function (e) {
  var useId = e.target.getAttribute('data-use');
  var dis = e.target.getAttribute('data-dis');
  var del = e.target.getAttribute('data-del');
  var provider = e.target.getAttribute('data-provider');
  try {
    if (useId) {
      try {
        await callCred({ action: 'activate', id: useId });
      } catch (err1) {
        try {
          await callCred({ action: 'set_active', id: useId });
        } catch (err2) {
          throw err1;
        }
      }
      var label = providerLabel(provider);
      showSuccess(label);
      toast(label + ' API Key 已啟用 ✓');
      await refresh();
      return;
    }
    if (dis) {
      await callCred({ action: 'disable', id: dis });
      toast('已停用');
      await refresh();
      return;
    }
    if (del) {
      if (!confirm('確定刪除此 Key？')) return;
      await callCred({ action: 'delete', id: del });
      toast('已刪除');
      await refresh();
    }
  } catch (err) {
    var m = String(err && err.message ? err.message : err);
    if (/UNKNOWN_ACTION|activate|set_active/i.test(m)) {
      toast('請改用「儲存並啟用」完成啟用，或稍後更新憑證服務。');
    } else {
      toast(humanError(err));
    }
  }
};
ensureSession().then(function () { refresh(); });
</script>
</body>
</html>
