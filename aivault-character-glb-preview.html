<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT 真實 3D 角色測試</title><style>body{margin:0;background:#172d43;color:white;font-family:system-ui}canvas{display:block}.info{position:fixed;top:12px;left:12px;right:12px;max-width:400px;background:#102b45e8;padding:12px;border-radius:12px;font-size:13px}.info b{font-size:18px}button{border:1px solid #a9d8fa;background:#1e527a;color:white;border-radius:9px;padding:9px;margin:5px 4px 0 0}#status{margin-top:6px;color:#ffdf9a}</style></head><body><div class="info"><b>❄ AIVAULT｜真正 GLB 人物測試</b><div>獨立預覽，不修改正式協作城</div><div id="status">正在下載真實骨架人物…</div><button id="spin">⟳ 旋轉：開</button><button id="reload">重新載入</button><div>單指拖曳可旋轉視角；人物尚未製作冬裝或走路動畫。</div></div><script type="module">import * as THREE from 'https://esm.sh/three@0.160.1';import {GLTFLoader} from 'https://esm.sh/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';import {OrbitControls} from 'https://esm.sh/three@0.160.1/examples/jsm/controls/OrbitControls.js';const status=document.getElementById('status');const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ebbd3);const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);camera.position.set(3,2.7,5);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x60718a,2.5));const sun=new THREE.DirectionalLight(0xffe9ce,2);sun.position.set(3,8,5);scene.add(sun);const floor=new THREE.Mesh(new THREE.CylinderGeometry(2.3,2.4,.2,48),new THREE.MeshStandardMaterial({color:0xe9f5ff}));floor.position.y=-.13;scene.add(floor);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.enableDamping=true;controls.update();let model=null,spin=true;const sources=['https://raw.githubusercontent.com/programasweights/avatar/main/public/assets/character.glb','https://cdn.jsdelivr.net/gh/programasweights/avatar@main/public/assets/character.glb'];const loader=new GLTFLoader();async function load(i){if(i>=sources.length){status.textContent='無法載入 GLB：兩個模型來源都無法連線。這不是已完成的角色。';return}loader.load(sources[i],g=>{model=g.scene;const bounds=new THREE.Box3().setFromObject(model);const size=bounds.getSize(new THREE.Vector3());const center=bounds.getCenter(new THREE.Vector3());model.position.sub(center);model.position.y+=size.y/2;model.scale.multiplyScalar(Math.min(2.7/Math.max(size.y,.01),4));scene.add(model);status.textContent='已載入真正 GLB 骨架人物｜模型原貌，尚未換冬裝';},undefined,()=>load(i+1))}load(0);document.getElementById('spin').onclick=e=>{spin=!spin;e.target.textContent=spin?'⟳ 旋轉：開':'⟳ 旋轉：關'};document.getElementById('reload').onclick=()=>location.reload();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function tick(){requestAnimationFrame(tick);if(model&&spin)model.rotation.y+=.005;controls.update();renderer.render(scene,camera)}tick();</script></body></html>
