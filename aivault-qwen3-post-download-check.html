<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT iPhone 17 Qwen3 下載後診斷</title><style>body{background:#0b1728;color:#f1f5ff;font:16px system-ui,-apple-system,sans-serif;line-height:1.5;max-width:720px;margin:auto;padding:16px}button{font:inherit;background:#3778d4;color:white;border:0;border-radius:9px;padding:12px;margin:6px}pre{background:#1c2c44;padding:12px;border-radius:9px;white-space:pre-wrap;overflow-wrap:anywhere}small{color:#b8c8dd}</style></head><body><h2>Qwen3 下載後診斷（唯讀）</h2><p>版本 qwen3-postcheck-20261018-a。只查快取與上次階段，不讀取 570 MB 權重內容、不初始化模型、不下載權重、不清除資料。</p><button id="go">檢查權重是否已快取</button><button id="copy">複製報告</button><pre id="out">尚未檢查。</pre><small>注意：下載進度 100% 不代表 Cache Storage 已持久化。網站儲存估計值也不是 RAM。此頁不會重試載入。</small><script>
const out=document.getElementById('out');let report='';const mb=n=>(n/1048576).toFixed(1)+' MiB';document.getElementById('go').onclick=async()=>{const a=['qwen3-postcheck-20261018-a','UA='+navigator.userAgent];try{const s=localStorage.getItem('aivault-qwen3-loader-stage-v1');a.push('LOADER_STAGE='+String(s));}catch(e){a.push('STAGE_ERROR '+e)}try{const e=await navigator.storage?.estimate();a.push('SITE_USAGE='+mb(e?.usage||0));a.push('SITE_QUOTA_ESTIMATE='+mb(e?.quota||0));const names=await caches.keys();a.push('CACHES='+names.join(','));let weights=0;for(const n of names){const c=await caches.open(n);for(const req of await c.keys()){const u=new URL(req.url);if(!u.pathname.includes('/Qwen3-0.6B-ONNX/'))continue;const isWeight=/\.onnx($|_data$)|\.onnx_data$/.test(u.pathname);a.push((isWeight?'WEIGHT ':'META ')+u.pathname);if(isWeight){weights++;const resp=await c.match(req);a.push('  status='+resp?.status+' content-length='+(resp?.headers.get('content-length')||'unknown'));}}}a.push('WEIGHT_CACHE_ENTRIES='+weights);a.push(weights?'判定：發現模型權重快取項目；未驗證內容完整。':'判定：Cache Storage 未找到 Qwen3 ONNX 權重，請勿再次下載，先回報。')}catch(e){a.push('CACHE_ERROR '+e)}report=a.join('\n');out.textContent=report};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(report||out.textContent)}catch(e){out.textContent+='\n複製失敗：'+e}};
</script></body></html>
