<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#fff"><title>AIVAULT MAINLAND｜廣州使用入口</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#fff;color:#172033}body{display:flex;flex-direction:column}.bar{height:58px;flex:none;display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid #e5e7eb;background:#fff;z-index:5}.title{font-weight:800;font-size:14px}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#eef2ff;color:#3730a3}.status{margin-left:auto;font-size:11px;color:#64748b}.status.ok{color:#15803d}.status.bad{color:#b91c1c}.app{position:relative;flex:1;min-height:0}.app iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}.diag{position:fixed;right:10px;top:66px;width:min(330px,calc(100% - 20px));padding:12px;border:1px solid #e5e7eb;border-radius:14px;background:rgba(255,255,255,.97);box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:20;display:none}.diag.show{display:block}.diag h3{margin:0 0 8px;font-size:13px}.row{font-size:11px;line-height:1.6;padding:4px 0;border-bottom:1px solid #f1f5f9}.row:last-child{border:0}.btn{margin-top:8px;border:1px solid #d1d5db;background:#fff;border-radius:9px;padding:7px 10px;font-size:11px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#94a3b8;margin-right:5px}.good .dot{background:#16a34a}.bad .dot{background:#dc2626}</style></head><body><div class="bar"><div class="title">AIVAULT</div><div class="badge">MAINLAND</div><div id="status" class="status">正在檢查</div><button class="btn" style="margin:0" onclick="document.getElementById('diag').classList.toggle('show')">連線診斷</button></div><div class="app"><iframe id="app" src="technical-dark-star.html" title="Technical Dark Star"></iframe></div><div id="diag" class="diag"><h3>廣州使用前檢查</h3><div id="rows"></div><button class="btn" onclick="runChecks()">重新檢查</button></div><script>
const SB='https://clcddygkaaqqtsbswgdf.supabase.co';
const MAINLAND_GATEWAY=SB+'/functions/v1/aivault-mainland-gateway';
const GLOBAL_GATEWAY=SB+'/functions/v1/ai-gateway';
function row(name,state,detail){return `<div class="row ${state?'good':'bad'}"><span class="dot"></span><b>${name}</b>：${detail}</div>`}
async function runChecks(){const rows=document.getElementById('rows');rows.innerHTML='';let ok=0,total=0;const add=async(name,fn)=>{total++;try{const r=await fn();if(r){ok++;rows.innerHTML+=row(name,true,'可用')}else rows.innerHTML+=row(name,false,'失敗')}catch(e){rows.innerHTML+=row(name,false,String(e).slice(0,90))}};await add('瀏覽器',async()=>true);await add('AIVAULT MAINLAND Gateway',async()=>{const r=await fetch(MAINLAND_GATEWAY+'?health=1',{cache:'no-store'});return r.ok});await add('原 AI Gateway',async()=>{const r=await fetch(GLOBAL_GATEWAY+'?health=1',{cache:'no-store'});return r.ok});document.getElementById('status').textContent=`${ok}/${total} 項可用`;document.getElementById('status').className='status '+(ok===total?'ok':'bad')}
(function(){if('serviceWorker' in navigator){navigator.serviceWorker.register('aivault-mainland-sw.js',{scope:'./'}).catch(()=>{})}runChecks()})();
const frame=document.getElementById('app');frame.addEventListener('load',()=>{try{const w=frame.contentWindow;const original=w.fetch.bind(w);w.fetch=async function(input,init={}){try{const u=typeof input==='string'?input:input.url;if(u.includes('/functions/v1/ai-gateway')){const target=MAINLAND_GATEWAY+(u.includes('?')?u.slice(u.indexOf('?')):'');const h=new Headers(init.headers||{});h.set('x-aivault-region','MAINLAND');init={...init,headers:h};input=target}}catch(e){}return original(input,init)}}catch(e){}});
</script></body></html>
