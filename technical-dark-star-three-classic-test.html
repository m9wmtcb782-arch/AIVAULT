<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AIVAULT｜Three.js Classic Engine Test</title><style>html,body{margin:0;height:100%;background:#070a0f;color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}body{display:flex;flex-direction:column}.top{padding:14px;border-bottom:1px solid #202733}.title{font-size:18px;font-weight:700}.status{margin-top:5px;font-size:13px}.ok{color:#72e6a2}.err{color:#ff7b8a}.main{flex:1;position:relative}#stage{position:absolute;inset:0}.panel{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(8,12,18,.94);border:1px solid #293342;border-radius:14px;padding:12px;font-size:12px;line-height:1.5}.btn{margin-top:8px;border:1px solid #344054;background:#151b25;color:#fff;border-radius:9px;padding:8px 12px}</style></head><body><div class="top"><div class="title">AIVAULT｜Technical Dark Star 3D Engine Proof</div><div id="status" class="status">① JavaScript 啟動，準備測試非 Module 3D 引擎載入…</div></div><div class="main"><div id="stage"></div><div class="panel"><div id="log">先只驗證 Three.js 本身，不載入 GLB、不載入 GLTFLoader。</div><button class="btn" id="next">下一步：載入 AIVAULT GLB</button></div></div><script>const status=document.getElementById('status'),log=document.getElementById('log'),stage=document.getElementById('stage');function fail(e){status.className='status err';status.textContent='❌ '+(e&&e.message||e);log.textContent=(e&&e.stack)||String(e)}function ok(t){status.className='status ok';status.textContent=t}function addScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=()=>resolve(s);s.onerror=()=>reject(new Error('無法載入：'+src));document.head.appendChild(s)})}async function boot(){try{status.textContent='② 正在載入 Classic Three.js…';await addScript('./vendor/three/three.min.js');if(!window.THREE)throw new Error('three.min.js 已載入但 window.THREE 不存在');ok('③ Classic Three.js 載入成功');log.textContent='Three.js 版本：'+THREE.REVISION+'。現在建立 WebGLRenderer。';const scene=new THREE.Scene();scene.background=new THREE.Color(0x070a0f);const camera=new THREE.PerspectiveCamera(45,stage.clientWidth/Math.max(1,stage.clientHeight),.1,100);camera.position.set(0,1.2,4);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(stage.clientWidth,stage.clientHeight);stage.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x334455,2));const geo=new THREE.BoxGeometry(1.5,1.5,1.5);const mat=new THREE.MeshStandardMaterial({color:0x8fd3ff,roughness:.35,metalness:.1});const cube=new THREE.Mesh(geo,mat);scene.add(cube);ok('④ ✅ Classic Three.js + WebGLRenderer 成功');log.textContent='GPU 3D Cube 已建立。Three.js Revision '+THREE.REVISION+'。這代表已經完全繞過 ES Module。';function loop(){requestAnimationFrame(loop);cube.rotation.x+=.006;cube.rotation.y+=.01;renderer.render(scene,camera)}loop();document.getElementById('next').onclick=()=>location.href='technical-dark-star-three-classic-glb-test.html?v='+Date.now()}catch(e){fail(e)}}boot()</script></body></html>
