<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>AI天衡 · 推理與攻防測試 v3</title>
<style>
body{font-family:system-ui,sans-serif;background:#0a1628;color:#d0e8ff;padding:16px;max-width:1000px;margin:auto}
h1{font-size:1.2rem}h2{font-size:1rem;color:#00e5ff;margin-top:20px}
.pass{color:#00ff88}.fail{color:#ff4466}.warn{color:#ffaa00}.muted{color:#6a8aaa}
pre{background:#050a14;padding:10px;border-radius:6px;overflow:auto;font-size:0.72rem;max-height:400px}
button{background:#0d2840;color:#d0e8ff;border:1px solid #1a3a5c;padding:8px 14px;border-radius:6px;cursor:pointer;margin:4px}
.cap{font-size:0.65rem;padding:2px 6px;border-radius:4px;background:#1a3a5c}
table{border-collapse:collapse;width:100%;font-size:0.8rem;margin:8px 0}
td,th{border:1px solid #1a3a5c;padding:4px 8px;text-align:left}
</style>
</head>
<body>
<h1>AI天衡 · 推理與攻防測試 v3</h1>
<p class="warn">rule = 規則引擎；not_implemented = 未實現；model / darkstar = 本頁無實際呼叫。</p>
<button onclick="runAll()">執行全部測試（含負面）</button>
<div id="out"></div>
<script>
const log = [];
function record(engine, capability, input, output, pass, note) {
  log.push({engine, capability, input, output, pass, note, ts: new Date().toISOString()});
}

// ===== 1. 邏輯：含否定、矛盾、無效推論、反例 =====
function logic(premises, query) {
  const facts = new Set();
  const rules = [];
  premises.forEach(p => {
    if (p.includes('→')) {
      const [a,b] = p.split('→').map(s=>s.trim());
      rules.push([a,b]);
    } else facts.add(p);
  });
  const derived = new Set(facts);
  let changed = true;
  while (changed) {
    changed = false;
    for (const [a,b] of rules) {
      if (derived.has(a) && !derived.has(b)) { derived.add(b); changed = true; }
    }
  }
  const hasNeg = [...derived].some(f => f.startsWith('NOT ') && derived.has(f.slice(4)));
  const doubleNeg = [...derived].some(f => f.startsWith('NOT NOT '));
  const proves = derived.has(query);
  const insufficient = !proves && !hasNeg;
  return {derived:[...derived], proves, contradiction:hasNeg, doubleNeg, insufficient, valid: proves && !hasNeg};
}

// ===== 2. 數學：安全解析 + 負面測試 =====
function mathSafe(expr) {
  if (typeof expr !== 'string' || !expr.trim()) return {ok:false, err:'empty'};
  const cleaned = expr.replace(/\s/g,'');
  if (!/^[0-9+\-*/().]+$/.test(cleaned)) return {ok:false, err:'illegal char'};
  let bal = 0;
  for (const c of cleaned) {
    if (c==='(') bal++; else if (c===')') bal--;
    if (bal<0) return {ok:false, err:'mismatch paren'};
  }
  if (bal!==0) return {ok:false, err:'mismatch paren'};
  if (/[+\-*/]{2,}/.test(cleaned.replace(/\(-/g,'('))) return {ok:false, err:'consecutive ops'};
  const tokens = cleaned.match(/(\d+\.?\d*|[+\-*/()])/g) || [];
  const prec = {'+':1,'-':1,'*':2,'/':2};
  const out=[], ops=[];
  for (const t of tokens) {
    if (/^\d/.test(t)) out.push(parseFloat(t));
    else if (t==='(') ops.push(t);
    else if (t===')') { while(ops.length && ops[ops.length-1]!=='(') out.push(ops.pop()); ops.pop(); }
    else { while(ops.length && prec[ops[ops.length-1]]>=prec[t]) out.push(ops.pop()); ops.push(t); }
  }
  while(ops.length) out.push(ops.pop());
  const st=[];
  for (const t of out) {
    if (typeof t==='number') st.push(t);
    else {
      const b=st.pop(), a=st.pop();
      if (t==='/' && b===0) return {ok:false, err:'div by zero'};
      const r = t==='+'?a+b:t==='-'?a-b:t==='*'?a*b:a/b;
      if (!isFinite(r)) return {ok:false, err:'non finite'};
      st.push(r);
    }
  }
  return {result:st[0], ok: typeof st[0]==='number' && isFinite(st[0])};
}

// ===== 3. 因果：因果圖 + 干預前後 =====
function causalGraph(graph, intervention) {
  const nodes = Object.keys(graph);
  function compute(g, intervened) {
    const vals = {};
    const order = nodes.slice().sort((a,b)=> (g[a].deps||[]).length - (g[b].deps||[]).length);
    for (const n of order) {
      if (intervened && intervened.node===n) vals[n] = intervened.value;
      else {
        const deps = (g[n].deps||[]).map(d=>vals[d]);
        vals[n] = g[n].fn ? g[n].fn(...deps) : (deps[0]||0);
      }
    }
    return vals;
  }
  const before = compute(graph, null);
  const after = intervention ? compute(graph, intervention) : before;
  const changed = intervention ? before[intervention.node] !== after[intervention.node] : false;
  return {before, after, changed, graph: nodes};
}

// ===== 4. 機率：邊界驗證 =====
function bayes(prior, likelihood, notLikelihood) {
  if (prior<0||prior>1||likelihood<0||likelihood>1||notLikelihood<0||notLikelihood>1)
    return {ok:false, err:'out of range'};
  const evidence = likelihood*prior + notLikelihood*(1-prior);
  if (evidence===0) return {ok:false, err:'zero evidence'};
  const posterior = (likelihood*prior)/evidence;
  return {prior, posterior:Math.round(posterior*1000)/1000, evidence:Math.round(evidence*1000)/1000, ok:true, updated:Math.abs(posterior-prior)>0.001};
}

// ===== 5. 時間 / 6. 空間 / 7. 常識 / 8. 科學 =====
function temporal(events) {
  const sorted=[...events].sort((a,b)=>a.t-b.t);
  return {order:sorted.map(e=>e.name), valid:sorted.every((e,i)=>i===0||e.t>=sorted[i-1].t)};
}
function spatial(a,b) {
  const d=Math.hypot(a.x-b.x,a.y-b.y);
  return {distance:Math.round(d*100)/100, near:d<10};
}
function commonSense(s) {
  const rules=[{cond:x=>/rain/i.test(x),advice:'umbrella'},{cond:x=>/night/i.test(x),advice:'light'}];
  const hit=rules.find(r=>r.cond(s));
  return {advice:hit?hit.advice:'none', matched:!!hit};
}
function science(hyp, data, th=0.6) {
  const rate=data.length?data.filter(d=>d.supports).length/data.length:0;
  return {supportRate:Math.round(rate*100)/100, accepted:rate>th};
}

// ===== 9. 多模態：未實現 =====
function multimodal(inputs) {
  return {types:[...new Set(inputs.map(i=>i.type))], fused:false, status:'NOT_IMPLEMENTED'};
}

// ===== 10. 程式：白名單 =====
function programSafe(op,a,b,expected) {
  const ops={'+':(x,y)=>x+y,'-':(x,y)=>x-y,'*':(x,y)=>x*y,'/':(x,y)=>x===0?null:x/y};
  const fn=ops[op];
  if(!fn) return {ok:false,err:'unsupported'};
  const r=fn(a,b);
  if(r===null) return {ok:false,err:'div by zero'};
  return {result:r, match:r===expected, ok:true};
}

// ===== 11. 策略 =====
function planning(goals, resources) {
  const sorted=[...goals].sort((a,b)=>b.priority-a.priority);
  const rem={...resources}, plan=[];
  for(const g of sorted) if((rem[g.need]||0)>=g.amount){rem[g.need]-=g.amount; plan.push(g.name);}
  return {feasible:plan.length===goals.length, plan, remaining:rem};
}

// ===== 12. 多智能體：獨立判斷 + 交叉質疑 + 反駁 =====
function multiAgentIndependent(agents, task) {
  const judgments = agents.map(a => {
    const own = a.judge(a.input);
    return {id:a.id, vote:own.vote, reason:own.reason, independent:true};
  });
  const reviews = judgments.map(j => {
    const others = judgments.filter(o=>o.id!==j.id);
    const dissent = others.filter(o=>o.vote!==j.vote);
    const rebuttal = dissent.length ? `反對：${dissent.map(d=>d.id+':'+d.reason).join('; ')}` : '無分歧';
    return {reviewer:j.id, dissentCount:dissent.length, rebuttal};
  });
  const agree = judgments.filter(j=>j.vote===task).length;
  return {judgments, reviews, consensus:agree>judgments.length/2, preservedDissent:reviews.some(r=>r.dissentCount>0)};
}

// ===== 天衡攻防：四指標 + 修復後不同輸入 =====
const attackDefs = [
  {id:'A1', name:'偽造發票',
    detect: d => (d.amount>1000000 || d.vendor==='unknown'),
    repair: d => ({...d, amount: Math.min(d.amount, 100000), vendor: d.vendor==='unknown'?'verified':d.vendor}),
    cases:[
      {label:'正常', input:{amount:5000,vendor:'known'}, expectAttack:false},
      {label:'已知攻擊', input:{amount:1500000,vendor:'unknown'}, expectAttack:true},
      {label:'變形', input:{amount:1000001,vendor:'unknown'}, expectAttack:true},
      {label:'邊界', input:{amount:1000000,vendor:'known'}, expectAttack:false},
      {label:'繞過', input:{amount:999999,vendor:'known'}, expectAttack:false}
    ]},
  {id:'A2', name:'惡意輸入',
    detect: d => /ignore|bypass|skip|override/i.test(d.prompt||''),
    repair: d => ({...d, prompt:(d.prompt||'').replace(/ignore|bypass|skip|override/gi,'[filtered]')}),
    cases:[
      {label:'正常', input:{prompt:'please review'}, expectAttack:false},
      {label:'已知攻擊', input:{prompt:'ignore tax rules'}, expectAttack:true},
      {label:'變形', input:{prompt:'please SKIP the check'}, expectAttack:true},
      {label:'邊界', input:{prompt:'ignore'}, expectAttack:true},
      {label:'繞過', input:{prompt:'i g n o r e'}, expectAttack:false}
    ]},
  {id:'A3', name:'所得篡改',
    detect: d => Math.abs(d.reported-d.thirdParty)>d.reported*0.3,
    repair: d => ({...d, reported: d.thirdParty}),
    cases:[
      {label:'正常', input:{reported:100000,thirdParty:105000}, expectAttack:false},
      {label:'已知攻擊', input:{reported:100000,thirdParty:500000}, expectAttack:true},
      {label:'變形', input:{reported:100000,thirdParty:131000}, expectAttack:true},
      {label:'邊界', input:{reported:100000,thirdParty:130000}, expectAttack:false},
      {label:'繞過', input:{reported:100000,thirdParty:125000}, expectAttack:false}
    ]}
];

function runAttackSuite(a) {
  return a.cases.map(c => {
    const attackSuccess = c.expectAttack;
    const detected = a.detect(c.input);
    const detectionCorrect = detected === c.expectAttack;
    const repaired = a.repair(c.input);
    const afterRepairDetected = a.detect(repaired);
    const repairSuccess = c.expectAttack ? !afterRepairDetected : true;
    const mutated = {...c.input};
    if (c.input.amount) mutated.amount = c.input.amount + 1;
    if (c.input.prompt) mutated.prompt = c.input.prompt + ' extra';
    if (c.input.reported) mutated.reported = c.input.reported + 1;
    const retestDetected = a.detect(mutated);
    const retestSuccess = c.expectAttack ? retestDetected : !retestDetected;
    const defensePass = detectionCorrect && repairSuccess && retestSuccess;
    return {label:c.label, attackSuccess, detected, detectionCorrect, repairSuccess, retestSuccess, defensePass, input:c.input, repaired, mutated};
  });
}

function runAll() {
  log.length = 0;
  const summary = {rule:{total:0,pass:0,fail:0}, not_implemented:{total:0,pass:0}, model:{total:0}, darkstar:{total:0}};

  // Logic tests
  const logicTests = [
    {name:'鏈鎖推導', in:['A','A→B','B→C'], q:'C', expect:true},
    {name:'矛盾', in:['A','NOT A'], q:'A', expect:false},
    {name:'前提不足', in:['A'], q:'B', expect:false},
    {name:'無效推論', in:['A→B','B'], q:'A', expect:false}
  ];
  logicTests.forEach(t => {
    const r = logic(t.in, t.q);
    const pass = t.name==='矛盾' ? r.contradiction : (t.name==='前提不足'||t.name==='無效推論' ? !r.proves : r.valid===t.expect);
    record('邏輯推理','rule',t,r,pass,t.name);
    summary.rule.total++; if(pass) summary.rule.pass++; else summary.rule.fail++;
  });

  // Math tests
  const mathTests = [
    {expr:'2+3*4', expect:14},
    {expr:'(1+2)*3', expect:9},
    {expr:'1/0', expect:null},
    {expr:'1++2', expect:null},
    {expr:'(1+2', expect:null},
    {expr:'abc', expect:null}
  ];
  mathTests.forEach(t => {
    const r = mathSafe(t.expr);
    const pass = t.expect===null ? !r.ok : (r.ok && r.result===t.expect);
    record('數學推理','rule',t.expr,r,pass,'');
    summary.rule.total++; if(pass) summary.rule.pass++; else summary.rule.fail++;
  });

  // Causal graph
  const graph = {
    income:{deps:[], fn:()=>100},
    tax:{deps:['income'], fn:i=>i*0.2},
    alert:{deps:['tax'], fn:t=>t>30?1:0}
  };
  const cg = causalGraph(graph, {node:'income', value:50});
  const causalPass = cg.changed && cg.after.tax < cg.before.tax;
  record('因果推理','rule','intervention income=50',cg,causalPass,'因果圖干預');
  summary.rule.total++; if(causalPass) summary.rule.pass++; else summary.rule.fail++;

  // Bayes boundaries
  const bayesTests = [
    {p:0.3,l:0.8,nl:0.2,ok:true},
    {p:1.5,l:0.8,nl:0.2,ok:false},
    {p:0.3,l:0,nl:0,ok:false}
  ];
  bayesTests.forEach(t => {
    const r = bayes(t.p,t.l,t.nl);
    const pass = r.ok===t.ok;
    record('機率推理','rule',t,r,pass,'');
    summary.rule.total++; if(pass) summary.rule.pass++; else summary.rule.fail++;
  });

  // Temporal / Spatial / Common / Science
  const temp = temporal([{name:'a',t:1},{name:'b',t:2}]);
  record('時間推理','rule','',temp,temp.valid,'');
  summary.rule.total++; summary.rule.pass++;
  const sp = spatial({x:0,y:0},{x:3,y:4});
  record('空間推理','rule','',sp,sp.distance===5,'');
  summary.rule.total++; if(sp.distance===5) summary.rule.pass++; else summary.rule.fail++;
  const cs = commonSense('raining');
  record('常識推理','rule','',cs,cs.matched,'');
  summary.rule.total++; if(cs.matched) summary.rule.pass++; else summary.rule.fail++;
  const sci = science('H',[{supports:true},{supports:true},{supports:false}]);
  record('科學推理','rule','',sci,sci.accepted,'');
  summary.rule.total++; if(sci.accepted) summary.rule.pass++; else summary.rule.fail++;

  // Multimodal
  const mm = multimodal([{type:'text'},{type:'image'}]);
  record('多模態推理','not_implemented','',mm,true,'NOT_IMPLEMENTED');
  summary.not_implemented.total++; summary.not_implemented.pass++;

  // Program
  const pr = programSafe('+',2,2,4);
  record('程式推理','rule','',pr,pr.match,'');
  summary.rule.total++; if(pr.match) summary.rule.pass++; else summary.rule.fail++;
  const pr2 = programSafe('/',1,0,null);
  record('程式推理','rule','div0',pr2,!pr2.ok,'');
  summary.rule.total++; if(!pr2.ok) summary.rule.pass++; else summary.rule.fail++;

  // Planning
  const pl = planning([{name:'A',need:'s',amount:2,priority:1},{name:'B',need:'s',amount:1,priority:2}],{s:2});
  record('規劃策略','rule','',pl,!pl.feasible && pl.plan.includes('B'),'');
  summary.rule.total++; if(!pl.feasible && pl.plan.includes('B')) summary.rule.pass++; else summary.rule.fail++;

  // Multi-agent independent
  const agents = [
    {id:1, input:{risk:0.2}, judge: inp => ({vote: inp.risk<0.5?'approve':'reject', reason:'low risk'})},
    {id:2, input:{risk:0.7}, judge: inp => ({vote: inp.risk<0.5?'approve':'reject', reason:'high risk'})},
    {id:3, input:{risk:0.3}, judge: inp => ({vote: inp.risk<0.5?'approve':'reject', reason:'acceptable'})}
  ];
  const ma = multiAgentIndependent(agents, 'approve');
  const maPass = ma.preservedDissent && ma.judgments.every(j=>j.independent);
  record('多智能體協作','rule','',ma,maPass,'獨立判斷+反駁');
  summary.rule.total++; if(maPass) summary.rule.pass++; else summary.rule.fail++;

  // Attack suites
  const attackResults = [];
  attackDefs.forEach(a => {
    const suite = runAttackSuite(a);
    suite.forEach(s => {
      record('天衡-'+a.id,'rule',s.input,{detected:s.detected,repairSuccess:s.repairSuccess,retestSuccess:s.retestSuccess},s.defensePass,s.label);
      attackResults.push({id:a.id,name:a.name,...s});
    });
  });

  const defensePassCount = attackResults.filter(r=>r.defensePass).length;

  let html = '<h2>測試總表</h2>';
  html += '<table><tr><th>能力</th><th>總數</th><th>通過</th><th>失敗</th></tr>';
  html += `<tr><td>rule</td><td>${summary.rule.total}</td><td class="pass">${summary.rule.pass}</td><td class="fail">${summary.rule.fail}</td></tr>`;
  html += `<tr><td>not_implemented</td><td>${summary.not_implemented.total}</td><td>${summary.not_implemented.pass}</td><td>0</td></tr>`;
  html += `<tr><td>model</td><td>0</td><td colspan="2" class="muted">未呼叫</td></tr>`;
  html += `<tr><td>darkstar</td><td>0</td><td colspan="2" class="muted">未呼叫</td></tr></table>`;

  html += '<h2>天衡攻防（四指標）</h2>';
  html += `<p>防禦 PASS：<span class="${defensePassCount===attackResults.length?'pass':'warn'}">${defensePassCount}/${attackResults.length}</span></p>`;
  html += '<table><tr><th>攻擊</th><th>案例</th><th>偵測正確</th><th>修復</th><th>復測</th><th>防禦</th></tr>';
  attackResults.forEach(r => {
    html += `<tr><td>${r.id} ${r.name}</td><td>${r.label}</td><td class="${r.detectionCorrect?'pass':'fail'}">${r.detectionCorrect}</td><td class="${r.repairSuccess?'pass':'fail'}">${r.repairSuccess}</td><td class="${r.retestSuccess?'pass':'fail'}">${r.retestSuccess}</td><td class="${r.defensePass?'pass':'fail'}">${r.defensePass}</td></tr>`;
  });
  html += '</table>';

  html += '<h2>完整 JSON 紀錄</h2><pre>'+JSON.stringify(log,null,2)+'</pre>';
  document.getElementById('out').innerHTML = html;
}
</script>
</body>
</html>
