<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>AI天衡 · 推理與攻防測試 v4</title>
<style>
body{font-family:system-ui,sans-serif;background:#0a1628;color:#d0e8ff;padding:16px;max-width:1000px;margin:auto}
h1{font-size:1.2rem}h2{font-size:1rem;color:#00e5ff;margin-top:20px}
.pass{color:#00ff88}.fail{color:#ff4466}.warn{color:#ffaa00}.muted{color:#6a8aaa}
pre{background:#050a14;padding:10px;border-radius:6px;overflow:auto;font-size:0.72rem;max-height:400px}
button{background:#0d2840;color:#d0e8ff;border:1px solid #1a3a5c;padding:8px 14px;border-radius:6px;cursor:pointer;margin:4px}
table{border-collapse:collapse;width:100%;font-size:0.8rem;margin:8px 0}
td,th{border:1px solid #1a3a5c;padding:4px 8px;text-align:left}
</style>
</head>
<body>
<h1>AI天衡 · 推理與攻防測試 v4</h1>
<p class="warn">rule = 規則引擎。模擬多智能體不等於真實模型代理。攻擊結果由實際執行產生。</p>
<button onclick="runAll()">執行全部測試</button>
<div id="out"></div>
<script>
const log = [];
function record(engine, capability, input, output, pass, note) {
  log.push({engine, capability, input, output, pass, note, ts: new Date().toISOString()});
}

// ===== 數學：確認所有 token 被消耗，拒絕「1 2」等非法輸入 =====
function mathSafe(expr) {
  if (typeof expr !== 'string' || !expr.trim()) return {ok:false, err:'empty'};
  const cleaned = expr.replace(/\s/g,'');
  if (!/^[0-9+\-*/().]+$/.test(cleaned)) return {ok:false, err:'illegal char'};
  let bal = 0;
  for (const c of cleaned) {
    if (c==='(') bal++; else if (c===')') bal--;
    if (bal<0) return {ok:false, err:'mismatch paren'};
  }
  if (bal!==0) return {ok:false, err:'mismatch paren'};
  if (/[+\-*/]{2,}/.test(cleaned.replace(/\(-/g,'('))) return {ok:false, err:'consecutive ops'};
  const tokens = cleaned.match(/(\d+\.?\d*|[+\-*/()])/g) || [];
  const joined = tokens.join('');
  if (joined !== cleaned) return {ok:false, err:'unparsed residue'};
  const prec = {'+':1,'-':1,'*':2,'/':2};
  const out=[], ops=[];
  for (const t of tokens) {
    if (/^\d/.test(t)) out.push(parseFloat(t));
    else if (t==='(') ops.push(t);
    else if (t===')') { while(ops.length && ops[ops.length-1]!=='(') out.push(ops.pop()); ops.pop(); }
    else { while(ops.length && prec[ops[ops.length-1]]>=prec[t]) out.push(ops.pop()); ops.push(t); }
  }
  while(ops.length) out.push(ops.pop());
  const st=[];
  for (const t of out) {
    if (typeof t==='number') st.push(t);
    else {
      if (st.length < 2) return {ok:false, err:'insufficient operands'};
      const b=st.pop(), a=st.pop();
      if (t==='/' && b===0) return {ok:false, err:'div by zero'};
      const r = t==='+'?a+b:t==='-'?a-b:t==='*'?a*b:a/b;
      if (!isFinite(r)) return {ok:false, err:'non finite'};
      st.push(r);
    }
  }
  if (st.length !== 1) return {ok:false, err:'incomplete expression'};
  return {result:st[0], ok:true};
}

// ===== 因果：拓撲排序 + 循環偵測 =====
function topoSort(graph) {
  const nodes = Object.keys(graph);
  const indeg = {};
  nodes.forEach(n => indeg[n] = 0);
  nodes.forEach(n => (graph[n].deps||[]).forEach(d => { if (indeg[d]===undefined) indeg[d]=0; indeg[n]++; }));
  const q = nodes.filter(n => indeg[n]===0);
  const order = [];
  while (q.length) {
    const n = q.shift();
    order.push(n);
    nodes.forEach(m => {
      if ((graph[m].deps||[]).includes(n)) {
        indeg[m]--;
        if (indeg[m]===0) q.push(m);
      }
    });
  }
  const cycle = order.length !== nodes.length;
  return {order, cycle};
}
function causalGraph(graph, intervention) {
  const {order, cycle} = topoSort(graph);
  if (cycle) return {ok:false, err:'cycle detected', order, cycle};
  function compute(g, intervened) {
    const vals = {};
    for (const n of order) {
      if (intervened && intervened.node===n) vals[n] = intervened.value;
      else {
        const deps = (g[n].deps||[]).map(d=>vals[d]);
        vals[n] = g[n].fn ? g[n].fn(...deps) : (deps[0]||0);
      }
    }
    return vals;
  }
  const before = compute(graph, null);
  const after = intervention ? compute(graph, intervention) : before;
  const changed = intervention ? before[intervention.node] !== after[intervention.node] : false;
  return {ok:true, before, after, changed, order, cycle:false};
}

// ===== 多智能體：標示為模擬，不寫死 independent:true =====
function multiAgentSimulated(agents, task) {
  const judgments = agents.map(a => {
    const own = a.judge(a.input);
    return {id:a.id, vote:own.vote, reason:own.reason, source:'simulated_judge'};
  });
  const reviews = judgments.map(j => {
    const others = judgments.filter(o=>o.id!==j.id);
    const dissent = others.filter(o=>o.vote!==j.vote);
    return {reviewer:j.id, dissentCount:dissent.length, rebuttal: dissent.length ? dissent.map(d=>d.id+':'+d.reason).join('; ') : '無分歧'};
  });
  const agree = judgments.filter(j=>j.vote===task).length;
  return {
    mode: 'SIMULATED_AGENTS',
    note: '模擬代理，非真實模型呼叫',
    judgments,
    reviews,
    consensus: agree>judgments.length/2,
    preservedDissent: reviews.some(r=>r.dissentCount>0)
  };
}

// ===== 攻防：attackSuccess 由實際偵測行為產生，不取自預設 =====
const attackDefs = [
  {id:'A1', name:'偽造發票',
    detect: d => (d.amount>1000000 || d.vendor==='unknown'),
    repair: d => ({...d, amount: Math.min(d.amount||0, 100000), vendor: d.vendor==='unknown'?'verified':d.vendor}),
    cases:[
      {label:'正常', input:{amount:5000,vendor:'known'}},
      {label:'已知攻擊', input:{amount:1500000,vendor:'unknown'}},
      {label:'變形', input:{amount:1000001,vendor:'unknown'}},
      {label:'邊界', input:{amount:1000000,vendor:'known'}},
      {label:'繞過', input:{amount:999999,vendor:'known'}}
    ]},
  {id:'A2', name:'惡意輸入',
    detect: d => /ignore|bypass|skip|override/i.test(d.prompt||''),
    repair: d => ({...d, prompt:(d.prompt||'').replace(/ignore|bypass|skip|override/gi,'[filtered]')}),
    cases:[
      {label:'正常', input:{prompt:'please review'}},
      {label:'已知攻擊', input:{prompt:'ignore tax rules'}},
      {label:'變形', input:{prompt:'please SKIP the check'}},
      {label:'邊界', input:{prompt:'ignore'}},
      {label:'繞過', input:{prompt:'i g n o r e'}}
    ]}
];

function runAttackSuite(a) {
  return a.cases.map(c => {
    const detected = a.detect(c.input);
    const attackSuccess = detected;
    const repaired = a.repair(c.input);
    const afterRepairDetected = a.detect(repaired);
    const repairSuccess = !afterRepairDetected;
    const mutated = JSON.parse(JSON.stringify(c.input));
    if (typeof mutated.amount === 'number') mutated.amount += 1;
    if (typeof mutated.prompt === 'string') mutated.prompt += ' x';
    const retestDetected = a.detect(mutated);
    const retestSuccess = !retestDetected;
    const defensePass = !attackSuccess || (repairSuccess && retestSuccess);
    return {label:c.label, attackSuccess, detected, repairSuccess, retestSuccess, defensePass, input:c.input, repaired, mutated};
  });
}

// 其他模組保持簡化但標記 capability
function logic(premises, query) {
  const facts = new Set();
  const rules = [];
  premises.forEach(p => {
    if (p.includes('→')) { const [a,b]=p.split('→').map(s=>s.trim()); rules.push([a,b]); }
    else facts.add(p);
  });
  const derived = new Set(facts);
  let changed=true;
  while(changed){ changed=false; for(const [a,b] of rules) if(derived.has(a)&&!derived.has(b)){derived.add(b);changed=true;} }
  const hasNeg = [...derived].some(f => f.startsWith('NOT ') && derived.has(f.slice(4)));
  return {derived:[...derived], proves:derived.has(query), contradiction:hasNeg, valid:derived.has(query)&&!hasNeg};
}
function bayes(p,l,nl) {
  if(p<0||p>1||l<0||l>1||nl<0||nl>1) return {ok:false,err:'range'};
  const e = l*p + nl*(1-p);
  if(e===0) return {ok:false,err:'zero evidence'};
  return {ok:true, posterior:Math.round((l*p)/e*1000)/1000};
}
function temporal(events){ const s=[...events].sort((a,b)=>a.t-b.t); return {valid:s.every((e,i)=>i===0||e.t>=s[i-1].t)}; }
function spatial(a,b){ const d=Math.hypot(a.x-b.x,a.y-b.y); return {distance:Math.round(d*100)/100}; }
function commonSense(s){ return {matched:/rain/i.test(s)}; }
function science(data){ const r=data.filter(d=>d.supports).length/data.length; return {accepted:r>0.6}; }
function multimodal(){ return {status:'NOT_IMPLEMENTED'}; }
function programSafe(op,a,b){ const ops={'+':(x,y)=>x+y,'/':(x,y)=>y===0?null:x/y}; const f=ops[op]; if(!f) return {ok:false}; const r=f(a,b); return r===null?{ok:false,err:'div0'}:{ok:true,result:r}; }
function planning(goals,res){ const sorted=[...goals].sort((a,b)=>b.priority-a.priority); const rem={...res},plan=[]; for(const g of sorted) if((rem[g.need]||0)>=g.amount){rem[g.need]-=g.amount;plan.push(g.name);} return {feasible:plan.length===goals.length,plan}; }

function runAll(){
  log.length=0;
  const s={rule:{t:0,p:0,f:0},not_impl:{t:0}};

  // math
  [['2+3*4',14],['(1+2)*3',9],['1 2',null],['1/0',null],['1++2',null],['(1+2',null]].forEach(([expr,exp])=>{
    const r=mathSafe(expr);
    const pass = exp===null ? !r.ok : (r.ok && r.result===exp);
    record('數學','rule',expr,r,pass,'');
    s.rule.t++; if(pass) s.rule.p++; else s.rule.f++;
  });

  // causal
  const g={income:{deps:[],fn:()=>100},tax:{deps:['income'],fn:i=>i*0.2},alert:{deps:['tax'],fn:t=>t>30?1:0}};
  const cg=causalGraph(g,{node:'income',value:50});
  const cPass=cg.ok && !cg.cycle && cg.changed && cg.after.tax < cg.before.tax;
  record('因果','rule','intervention',cg,cPass,'topo');
  s.rule.t++; if(cPass) s.rule.p++; else s.rule.f++;
  const gCycle={a:{deps:['b'],fn:x=>x},b:{deps:['a'],fn:x=>x}};
  const cc=causalGraph(gCycle,null);
  record('因果','rule','cycle',cc,cc.cycle===true,'cycle detect');
  s.rule.t++; if(cc.cycle) s.rule.p++; else s.rule.f++;

  // multi-agent simulated
  const agents=[
    {id:1,input:{risk:0.2},judge:inp=>({vote:inp.risk<0.5?'approve':'reject',reason:'low'})},
    {id:2,input:{risk:0.7},judge:inp=>({vote:inp.risk<0.5?'approve':'reject',reason:'high'})},
    {id:3,input:{risk:0.3},judge:inp=>({vote:inp.risk<0.5?'approve':'reject',reason:'ok'})}
  ];
  const ma=multiAgentSimulated(agents,'approve');
  const maPass=ma.mode==='SIMULATED_AGENTS' && ma.preservedDissent && ma.judgments.every(j=>j.source==='simulated_judge');
  record('多智能體','rule','',ma,maPass,'simulated');
  s.rule.t++; if(maPass) s.rule.p++; else s.rule.f++;

  // attacks
  const ar=[];
  attackDefs.forEach(a=>runAttackSuite(a).forEach(x=>{ record('天衡-'+a.id,'rule',x.input,x,x.defensePass,x.label); ar.push({id:a.id,name:a.name,...x}); }));

  // other
  const others=[
    ['邏輯', logic(['A','A→B'],'B').valid],
    ['機率', bayes(0.3,0.8,0.2).ok],
    ['時間', temporal([{t:1},{t:2}]).valid],
    ['空間', spatial({x:0,y:0},{x:3,y:4}).distance===5],
    ['常識', commonSense('raining').matched],
    ['科學', science([{supports:true},{supports:true},{supports:false}]).accepted],
    ['程式', programSafe('+',2,2).result===4]
  ];
  others.forEach(([n,p])=>{ record(n,'rule','',{pass:p},p,''); s.rule.t++; if(p) s.rule.p++; else s.rule.f++; });
  record('多模態','not_implemented','',multimodal(),true,'');
  s.not_impl.t++;

  let html='<h2>測試總表</h2><table><tr><th>能力</th><th>總數</th><th>通過</th><th>失敗</th></tr>';
  html+=`<tr><td>rule</td><td>${s.rule.t}</td><td class="pass">${s.rule.p}</td><td class="fail">${s.rule.f}</td></tr>`;
  html+=`<tr><td>not_implemented</td><td>${s.not_impl.t}</td><td colspan="2">未實現</td></tr></table>`;

  html+='<h2>攻防（結果由實際偵測產生）</h2><table><tr><th>攻擊</th><th>案例</th><th>攻擊成功</th><th>修復</th><th>復測</th><th>防禦</th></tr>';
  ar.forEach(r=> html+=`<tr><td>${r.id} ${r.name}</td><td>${r.label}</td><td>${r.attackSuccess}</td><td>${r.repairSuccess}</td><td>${r.retestSuccess}</td><td class="${r.defensePass?'pass':'fail'}">${r.defensePass}</td></tr>`);
  html+='</table>';

  html+='<h2>JSON</h2><pre>'+JSON.stringify(log,null,2)+'</pre>';
  document.getElementById('out').innerHTML=html;
}
</script>
</body>
</html>
