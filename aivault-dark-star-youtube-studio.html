<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>暗星 YouTube 授權中心</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f1f5f9;font:16px system-ui,-apple-system,sans-serif}main{max-width:650px;margin:0 auto;padding:28px 18px}h1{font-size:26px}p{line-height:1.7;color:#cbd5e1}.panel{border:1px solid #334155;border-radius:16px;background:#172235;padding:20px;margin:18px 0}button{width:100%;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:700;background:#ef4444;color:white;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap;word-break:break-word;color:#fbbf24}a{color:#93c5fd}.small{font-size:13px}</style></head><body><main><h1>暗星 YouTube 授權中心</h1><p>只授權讀取暗星頻道資料。影片上架與公開發布仍需 Owner 另行批准。</p><div class="panel"><p id="account">正在確認 AIVAULT 登入狀態…</p><button id="connect" disabled>連接 YouTube 頻道</button><p id="status" role="status"></p></div><div class="panel"><button id="check" disabled style="background:#2563eb">檢查頻道連線</button><p id="channel"></p></div><p class="small"><a href="aivault-home.html">返回 AIVAULT 首頁</a> · 請先在同一個瀏覽器登入 AIVAULT。Google OAuth 授權由 Google 官方頁面完成。</p></main><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/+esm';const sb=createClient('https://clcddygkaaqqtsbswgdf.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsY2RkeWdrYWFxcXRzYnN3Z2RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzUwNjQsImV4cCI6MjEwMjMxMTA2NH0.kYg6h7n74CtbiIjNjZ2xxJj16SV42INZVzQ9dLNUfKE',{auth:{persistSession:true,autoRefreshToken:true,storage:localStorage}});const endpoint='https://clcddygkaaqqtsbswgdf.supabase.co/functions/v1/dark-star-youtube';const $=id=>document.getElementById(id);async function token(){const {data,error}=await sb.auth.getSession();if(error||!data.session)throw Error('尚未登入 AIVAULT。請先回首頁登入後再開啟此頁。');return data.session.access_token;}async function call(path,method='GET'){const t=await token();const res=await fetch(endpoint+path,{method,headers:{Authorization:'Bearer '+t,apikey:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsY2RkeWdrYWFxcXRzYnN3Z2RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzUwNjQsImV4cCI6MjEwMjMxMTA2NH0.kYg6h7n74CtbiIjNjZ2xxJj16SV42INZVzQ9dLNUfKE'}});const j=await res.json();if(!res.ok||!j.ok)throw Error(j.error||'HTTP '+res.status);return j;}async function init(){try{const {data}=await sb.auth.getUser();if(!data.user)throw Error('尚未登入 AIVAULT，請先回首頁登入。');$('account').textContent='已登入 AIVAULT：'+(data.user.email||data.user.id);$('connect').disabled=false;$('check').disabled=false;}catch(e){$('account').textContent=e.message;}}$('connect').onclick=async()=>{const b=$('connect');b.disabled=true;$('status').textContent='正在取得安全授權連結…';try{const x=await call('/youtube/auth','POST');$('status').textContent='即將前往 Google 授權頁面';location.assign(x.auth_url);}catch(e){$('status').textContent='授權啟動失敗：'+e.message;}finally{b.disabled=false;}};$('check').onclick=async()=>{try{const x=await call('/youtube/channel');$('channel').textContent='已連線：'+(x.channel?.snippet?.title||x.channel?.id||'頻道');}catch(e){$('channel').textContent='尚未連接或驗證失敗：'+e.message;}};init();</script></body></html>
