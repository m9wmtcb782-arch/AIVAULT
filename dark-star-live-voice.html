<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Technical Dark Star｜即時語音</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1}
.settings-btn{position:fixed;left:10px;top:10px;z-index:99999;border:1px solid #ddd;background:#fff;color:#222;border-radius:14px;padding:9px 12px;font-size:14px;box-shadow:0 5px 22px rgba(0,0,0,.12)}
.panel{position:fixed;left:10px;top:54px;z-index:100000;background:#fff;border:1px solid #e5e5e5;border-radius:14px;box-shadow:0 10px 35px rgba(0,0,0,.16);padding:8px;width:190px;display:none}
.panel.show{display:block}.panel-title{font-size:12px;color:#888;padding:6px 10px}.panel button{display:block;width:100%;border:0;background:#fff;text-align:left;padding:11px 12px;border-radius:9px;font-size:14px}.panel button:hover{background:#f4f4f4}.hint{font-size:11px;color:#999;padding:7px 10px 5px}
.state{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:99999;background:rgba(20,20,20,.92);color:#fff;border-radius:18px;padding:8px 14px;font-size:13px;display:none}.state.show{display:block}
</style>
</head>
<body>
<iframe id="frame" src="technical-dark-star.html" allow="microphone; autoplay"></iframe>
<button id="settings" class="settings-btn">☰ 語音設定</button>
<div id="panel" class="panel">
  <div class="panel-title">選擇聲音</div>
  <button data-v="Kore">♀ 女聲</button>
  <button data-v="Puck">♂ 男聲</button>
  <button data-v="Charon">◉ 成熟聲</button>
  <button data-v="Leda">○ 年輕聲</button>
  <div class="hint">聲音選擇會在下一次連線使用。</div>
</div>
<div id="state" class="state"></div>
<script>
const FN='https://clcddygkaaqqtsbswgdf.supabase.co/functions/v1/technical-dark-star-voice-session';
const MODEL='gemini-3.1-flash-live-preview';
const frame=document.getElementById('frame');
const state=document.getElementById('state');
const panel=document.getElementById('panel');
let ws=null,stream=null,ctx=null,processor=null,source=null,sessionId=null,running=false,starting=false;
let voice=localStorage.getItem('ds_live_voice')||'Kore',playAt=0,sources=new Set(),composerButton=null,composerInput=null;
function status(t,keep=false){state.textContent=t;state.classList.add('show');if(!keep)setTimeout(()=>state.classList.remove('show'),1800)}
async function api(body){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.error||('HTTP '+r.status));return d}
function b64(buf){const a=new Uint8Array(buf);let s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(s)}
function floatTo16(x){const a=new Int16Array(x.length);for(let i=0;i<x.length;i++){let v=Math.max(-1,Math.min(1,x[i]));a[i]=v<0?v*32768:v*32767}return a.buffer}
function resample(x,from,to){if(from===to)return x;const n=Math.round(x.length*to/from),o=new Float32Array(n),r=(x.length-1)/(n-1||1);for(let i=0;i<n;i++){const p=i*r,a=Math.floor(p),b=Math.min(a+1,x.length-1),f=p-a;o[i]=x[a]*(1-f)+x[b]*f}return o}
function decode(b){const s=atob(b),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function pcmFloat(a){const d=new DataView(a.buffer,a.byteOffset,a.byteLength),o=new Float32Array(Math.floor(a.byteLength/2));for(let i=0;i<o.length;i++)o[i]=d.getInt16(i*2,true)/32768;return o}
async function play(data){ctx=ctx||new AudioContext({sampleRate:24000});if(ctx.state==='suspended')await ctx.resume();const f=pcmFloat(data),b=ctx.createBuffer(1,f.length,24000);b.copyToChannel(f,0);const n=ctx.createBufferSource();n.buffer=b;n.connect(ctx.destination);playAt=Math.max(playAt,ctx.currentTime);n.start(playAt);playAt+=b.duration;sources.add(n);n.onended=()=>sources.delete(n)}
function clearAudio(){for(const s of sources){try{s.stop()}catch{}}sources.clear();if(ctx)playAt=ctx.currentTime}
async function save(role,text){text=(text||'').trim();if(!sessionId||!text)return;try{await api({action:'turn',session_id:sessionId,sequence_no:Date.now(),role,content:text})}catch(e){console.warn(e)}}
async function startMic(){stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});ctx=ctx||new AudioContext();await ctx.resume();source=ctx.createMediaStreamSource(stream);processor=ctx.createScriptProcessor(2048,1,1);processor.onaudioprocess=e=>{if(!ws||ws.readyState!==1)return;const x=resample(e.inputBuffer.getChannelData(0),ctx.sampleRate,16000);ws.send(JSON.stringify({realtimeInput:{audio:{data:b64(floatTo16(x)),mimeType:'audio/pcm;rate=16000'}}}))};source.connect(processor);processor.connect(ctx.destination)}
function setVoiceButton(active){if(!composerButton)return;composerButton.disabled=false;composerButton.style.cssText+=';background:#2563eb!important;color:#fff!important;opacity:1!important;cursor:pointer!important';composerButton.textContent=active?'⏹':'🎙';composerButton.setAttribute('aria-label',active?'結束即時語音':'即時語音')}
function bindComposer(){try{const d=frame.contentDocument;if(!d)return;composerButton=d.querySelector('.composer-send');composerInput=d.querySelector('.composer-input');if(!composerButton||!composerInput)return;const style=d.createElement('style');style.textContent='.composer-send{background:#2563eb!important;color:#fff!important;opacity:1!important;cursor:pointer!important}.composer-send:disabled{opacity:1!important;background:#2563eb!important;color:#fff!important;cursor:pointer!important}';d.head.appendChild(style);setVoiceButton(false);composerInput.addEventListener('input',updateComposerState);composerButton.addEventListener('click',composerCapture,true);updateComposerState()}catch(e){console.warn('composer bind failed',e)}}
function updateComposerState(){if(!composerButton||!composerInput)return;const hasText=!!composerInput.value.trim();composerButton.disabled=false;if(running){setVoiceButton(true);return}if(hasText){composerButton.textContent='➤';composerButton.setAttribute('aria-label','發送');composerButton.style.cssText+=';background:#2563eb!important;color:#fff!important;opacity:1!important;cursor:pointer!important'}else{setVoiceButton(false)}}
function composerCapture(e){if(!composerInput||!composerButton)return;const hasText=!!composerInput.value.trim();if(running||!hasText){e.preventDefault();e.stopImmediatePropagation();if(running)stop();else start()}}
frame.addEventListener('load',()=>{setTimeout(bindComposer,80)});
async function start(){if(running||starting)return;starting=true;status('正在連接語音…',true);try{if(!ctx)ctx=new AudioContext();await ctx.resume();const s=await api({action:'start',voice_profile:voice,metadata:{source:'dark-star-live-voice'}});sessionId=s.session?.id||null;const a=await api({voice_name:voice});ws=new WebSocket(a.websocket+'?access_token='+encodeURIComponent(a.token));ws.onopen=async()=>{ws.send(JSON.stringify({setup:{model:'models/'+MODEL,responseModalities:['AUDIO'],inputAudioTranscription:{},outputAudioTranscription:{},speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voice}}},thinkingConfig:{thinkingLevel:'minimal'},systemInstruction:{parts:[{text:'你是即時語音對話引擎。使用繁體中文，自然、簡短、像真人對話。不要自我介紹，不要重複回答。使用者可以隨時打斷你。'}]}}}));running=true;starting=false;setVoiceButton(true);status('🎙️ 可以說話了');await startMic()};ws.onmessage=async e=>{let m;try{m=JSON.parse(e.data)}catch{return}const c=m.serverContent;if(!c)return;if(c.inputTranscription?.text)save('user',c.inputTranscription.text);if(c.outputTranscription?.text)save('assistant',c.outputTranscription.text);if(c.interrupted)clearAudio();if(c.modelTurn?.parts)for(const p of c.modelTurn.parts)if(p.inlineData?.data)await play(decode(p.inlineData.data));if(c.turnComplete)status('請繼續說話')};ws.onerror=()=>{status('語音連線錯誤');stop()};ws.onclose=()=>{if(running)stop(true)}}catch(e){starting=false;setVoiceButton(false);status('啟動失敗：'+e.message);console.error(e)}}
async function stop(fromSocket=false){if(!running&&!starting)return;running=false;starting=false;try{processor?.disconnect()}catch{}try{source?.disconnect()}catch{}try{stream?.getTracks().forEach(t=>t.stop())}catch{}processor=source=stream=null;clearAudio();if(ws&&!fromSocket)try{ws.close()}catch{}ws=null;if(sessionId)try{await api({action:'end',session_id:sessionId})}catch{}sessionId=null;updateComposerState();status('已離開語音模式')}
document.getElementById('settings').onclick=()=>panel.classList.toggle('show');panel.querySelectorAll('button[data-v]').forEach(b=>b.onclick=()=>{voice=b.dataset.v;localStorage.setItem('ds_live_voice',voice);panel.classList.remove('show');status('已選擇 '+b.textContent)});
</script>
</body>
</html>
