<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dark Star Live Voice</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0}
#voiceState{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:9999;background:rgba(20,20,20,.92);color:#fff;border-radius:18px;padding:8px 14px;font-size:13px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#voiceState.show{display:block}
#voicePanel{position:fixed;top:58px;left:12px;z-index:10000;background:#fff;border:1px solid #e8e8e8;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.12);padding:10px;display:none;min-width:190px}
#voicePanel.show{display:block}
#voicePanel button{display:block;width:100%;border:0;background:#fff;text-align:left;padding:10px 12px;border-radius:9px;font-size:14px}
#voicePanel button:hover{background:#f4f4f4}
#voicePanel .title{font-size:12px;color:#888;padding:4px 10px 7px}
</style>
</head>
<body>
<iframe id="frame" src="technical-dark-star.html" allow="microphone; autoplay"></iframe>
<div id="voiceState"></div>
<div id="voicePanel"><div class="title">語音聲音</div><button data-v="Kore">女聲</button><button data-v="Puck">男聲</button><button data-v="Charon">成熟聲</button><button data-v="Leda">年輕聲</button></div>
<script>
const SUPABASE="https://clcddygkaaqqtsbswgdf.supabase.co";
const VOICE_FN=SUPABASE+"/functions/v1/technical-dark-star-voice-session";
const MODEL="gemini-3.1-flash-live-preview";
const frame=document.getElementById('frame');
const state=document.getElementById('voiceState');
const panel=document.getElementById('voicePanel');
let doc=null,input=null,send=null,mic=null,voiceBtn=null,voiceSettingsBtn=null;
let ws=null,audioCtx=null,processor=null,source=null,stream=null,sessionId=null,seq=0;
let running=false,starting=false,selectedVoice=localStorage.getItem('ds_voice')||'Kore';
let playbackTime=0,activeSources=new Set();
const show=(t)=>{state.textContent=t;state.classList.add('show')};
const hide=()=>state.classList.remove('show');
function b64(buf){let bytes=new Uint8Array(buf),s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(s)}
function bytes(b64s){const s=atob(b64s),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function pcm16ToFloat(u8){const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);const out=new Float32Array(Math.floor(u8.byteLength/2));for(let i=0;i<out.length;i++)out[i]=dv.getInt16(i*2,true)/32768;return out}
function resampleFloat(data,from,to){if(from===to)return data;const n=Math.round(data.length*to/from),out=new Float32Array(n);const r=(data.length-1)/(n-1||1);for(let i=0;i<n;i++){const x=i*r,a=Math.floor(x),b=Math.min(a+1,data.length-1),f=x-a;out[i]=data[a]*(1-f)+data[b]*f}return out}
function floatToPcm16(data){const out=new Int16Array(data.length);for(let i=0;i<data.length;i++){const x=Math.max(-1,Math.min(1,data[i]));out[i]=x<0?x*32768:x*32767}return out.buffer}
async function api(body){const r=await fetch(VOICE_FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.error||('HTTP '+r.status));return d}
async function saveTurn(role,text){text=(text||'').trim();if(!sessionId||!text)return;try{await api({action:'turn',session_id:sessionId,sequence_no:++seq,role,content:text})}catch(e){console.warn('voice turn save failed',e)}}
async function startVoice(){if(running||starting)return;starting=true;show('正在連接語音…');try{const start=await api({action:'start',voice_profile:selectedVoice,metadata:{source:'dark-star-live-voice'}});sessionId=start.session?.id||null;const auth=await api({voice_name:selectedVoice});ws=new WebSocket(auth.websocket+'?access_token='+encodeURIComponent(auth.token));ws.onopen=()=>{const setup={setup:{model:'models/'+MODEL,generationConfig:{responseModalities:['AUDIO']},inputAudioTranscription:{},outputAudioTranscription:{},speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:selectedVoice}}},thinkingConfig:{thinkingLevel:'minimal'},systemInstruction:{parts:[{text:'使用繁體中文。自然、簡短、像真人對話；不要自我介紹，不要重複回答；可以被使用者打斷。'}]}}};ws.send(JSON.stringify(setup));running=true;starting=false;show('可以說話了');startMic()};
ws.onmessage=handleMessage;ws.onerror=()=>{show('語音連線錯誤');stopVoice()};ws.onclose=()=>{if(running)stopVoice(true)};
}catch(e){console.error(e);starting=false;show('啟動失敗：'+e.message);setTimeout(hide,3500)}}
function handleMessage(ev){let m;try{m=JSON.parse(ev.data)}catch{return}const c=m.serverContent;if(!c)return;if(c.inputTranscription?.text)saveTurn('user',c.inputTranscription.text);if(c.outputTranscription?.text)saveTurn('assistant',c.outputTranscription.text);if(c.interrupted)clearPlayback();if(c.turnComplete)show('請繼續說話');for(const p of (c.modelTurn?.parts||[])){if(p.inlineData?.data)playPcm(bytes(p.inlineData.data))}}
function clearPlayback(){for(const s of activeSources){try{s.stop()}catch{}}activeSources.clear();if(audioCtx)playbackTime=audioCtx.currentTime}
async function playPcm(u8){if(!audioCtx)audioCtx=new AudioContext({sampleRate:24000});if(audioCtx.state==='suspended')await audioCtx.resume();const f=pcm16ToFloat(u8),buf=audioCtx.createBuffer(1,f.length,24000);buf.copyToChannel(f,0);const node=audioCtx.createBufferSource();node.buffer=buf;node.connect(audioCtx.destination);const now=audioCtx.currentTime;playbackTime=Math.max(playbackTime,now);node.start(playbackTime);playbackTime+=buf.duration;activeSources.add(node);node.onended=()=>activeSources.delete(node)}
async function startMic(){stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});audioCtx=audioCtx||new AudioContext();await audioCtx.resume();source=audioCtx.createMediaStreamSource(stream);processor=audioCtx.createScriptProcessor(2048,1,1);processor.onaudioprocess=e=>{if(!ws||ws.readyState!==1)return;const x=e.inputBuffer.getChannelData(0);const pcm=resampleFloat(x,audioCtx.sampleRate,16000);ws.send(JSON.stringify({realtimeInput:{audio:{data:b64(floatToPcm16(pcm)),mimeType:'audio/pcm;rate=16000'}}}))};source.connect(processor);processor.connect(audioCtx.destination)}
async function stopVoice(fromSocket){if(!running&&!starting)return;running=false;starting=false;try{if(processor)processor.disconnect()}catch{}try{if(source)source.disconnect()}catch{}try{stream?.getTracks().forEach(t=>t.stop())}catch{}processor=source=stream=null;clearPlayback();if(ws&&!fromSocket){try{ws.close()}catch{}}ws=null;if(sessionId){try{await api({action:'end',session_id:sessionId})}catch{}}sessionId=null;hide();}
function setup(){doc=frame.contentDocument||frame.contentWindow.document;input=doc.querySelector('textarea');send=[...doc.querySelectorAll('button')].find(b=>/發送|送出/.test(b.textContent||''));mic=[...doc.querySelectorAll('button')].find(b=>/🎤|麥克風|語音輸入/.test(b.textContent||''));if(!input||!send)return false;voiceBtn=document.createElement('button');voiceBtn.textContent='語音模式';voiceBtn.style.cssText='margin-left:8px;border:0;border-radius:10px;padding:9px 13px;background:#111;color:#fff;font-size:13px';send.parentNode.insertBefore(voiceBtn,send.nextSibling);send.style.display='none';voiceBtn.onclick=()=>{if(running){stopVoice();voiceBtn.textContent='語音模式'}else{startVoice();voiceBtn.textContent='退出語音'}};input.addEventListener('input',()=>{if(!running){send.style.display=input.value.trim()?'':'none';voiceBtn.style.display=input.value.trim()?'none':''}});voiceSettingsBtn=document.createElement('button');voiceSettingsBtn.textContent='🔊 語音設定';voiceSettingsBtn.style.cssText='position:fixed;top:8px;left:60px;z-index:9999;border:1px solid #e5e5e5;background:#fff;border-radius:9px;padding:7px 10px;font-size:12px';voiceSettingsBtn.onclick=()=>panel.classList.toggle('show');document.body.appendChild(voiceSettingsBtn);return true}
frame.addEventListener('load',()=>{let n=0;const timer=setInterval(()=>{if(setup()||++n>30)clearInterval(timer)},300)});
panel.querySelectorAll('button[data-v]').forEach(b=>b.onclick=()=>{selectedVoice=b.dataset.v;localStorage.setItem('ds_voice',selectedVoice);panel.classList.remove('show');show('已選擇：'+b.textContent);setTimeout(hide,1200)});
</script>
</body>
</html>
