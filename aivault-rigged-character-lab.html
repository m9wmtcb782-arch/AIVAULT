<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT 真實骨架角色載入驗證</title><style>body{margin:0;overflow:hidden;background:linear-gradient(#21364d,#9bbbd3);color:white;font-family:system-ui}#panel{position:fixed;top:12px;left:12px;right:12px;max-width:350px;padding:14px;border-radius:12px;background:#0b233cdd;z-index:2;font-size:13px}b{font-size:17px}#state{margin-top:8px;color:#fbdc9e}#controls{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px}button{background:#173d62;color:white;border:1px solid #8ec8ed;border-radius:10px;padding:11px}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><div id="panel"><b>AIVAULT｜真實 3D 骨架角色驗證</b><div>這是模型載入測試，不是冰雪城市成品，也沒有接入 AI。</div><div id="state">正在載入真正的 GLB 人物模型…</div></div><div id="controls"><button id="turn">⟳ 旋轉</button><button id="walk">▶ 骨架擺動</button></div><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const status=document.getElementById('state');let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(e){status.textContent='無法啟動 WebGL：'+e.message;throw e}renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color(0x809db4);scene.add(new THREE.HemisphereLight(0xffffff,0x667083,2.5));let light=new THREE.DirectionalLight(0xffe7c6,3);light.position.set(4,8,5);scene.add(light);const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.01,100);camera.position.set(2,1.8,4);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.enableDamping=true;controls.update();const ground=new THREE.Mesh(new THREE.CircleGeometry(10,64),new THREE.MeshStandardMaterial({color:0xeaf5fb}));ground.rotation.x=-Math.PI/2;scene.add(ground);let model,bones=[],animate=false,rotate=true,tm=0;const src='https://cdn.jsdelivr.net/gh/programasweights/avatar@main/public/assets/character.glb';new GLTFLoader().load(src,g=>{model=g.scene;const b=new THREE.Box3().setFromObject(model);const sz=b.getSize(new THREE.Vector3()),center=b.getCenter(new THREE.Vector3());const s=2.5/Math.max(sz.y,.01);model.scale.setScalar(s);model.position.set(-center.x*s,-b.min.y*s,-center.z*s);scene.add(model);model.traverse(o=>{if(o.isBone&&/arm|leg|thigh/i.test(o.name))bones.push({bone:o,base:o.rotation.z,baseX:o.rotation.x})});status.textContent='GLB 已載入｜真正網格與骨架｜骨骼 '+bones.length+' 個可擺動候選；尚未製作冬裝';},p=>{if(p.total)status.textContent='載入中 '+Math.round(p.loaded/p.total*100)+'%'},e=>{status.textContent='模型載入失敗：可能是 CDN 或網路限制。'+(e?.message||'');});document.getElementById('turn').onclick=()=>rotate=!rotate;document.getElementById('walk').onclick=e=>{animate=!animate;e.target.textContent=animate?'⏸ 停止擺動':'▶ 骨架擺動'};function frame(){requestAnimationFrame(frame);tm+=.016;if(model){if(rotate)model.rotation.y+=.005;for(let i=0;i<bones.length;i++){let o=bones[i];o.bone.rotation.x=o.baseX+(animate?Math.sin(tm*3+i*2.1)*.15:0)}}controls.update();renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
