<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT 中文模型批次審核</title><style>body{max-width:760px;margin:auto;padding:16px;background:#0c1728;color:#eef4ff;font:16px system-ui,-apple-system,sans-serif;line-height:1.5}textarea{width:100%;box-sizing:border-box;height:160px;background:#1c2b42;color:white;border:1px solid #56677d;border-radius:9px;padding:10px;font:14px monospace}button{background:#3479d6;color:white;border:0;border-radius:9px;padding:12px;margin:8px 8px 8px 0;font-size:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#19283d;border-radius:9px;padding:12px}small{color:#b9c6d8}</style></head><body><h2>AIVAULT 中文模型批次審核</h2><p>版本 batch-audit-20261018-a。只讀 Hugging Face 公開目錄，不下載權重、不執行模型、不消耗付費推論 API。</p><p>每行一個模型 ID；可以修改：</p><textarea id="ids">onnx-community/Qwen3-0.6B-ONNX
onnx-community/Qwen2.5-0.5B-Instruct
onnx-community/Qwen2.5-0.5B-ONNX
onnx-community/SmolLM2-135M-Instruct-ONNX</textarea><p><button id="run">批次查詢檔案大小</button><button id="copy">複製完整報告</button></p><pre id="out">等待開始。</pre><small>列出每個倉庫最小的 ONNX 主檔及可能的外部資料檔。主檔大小不是總下載量；也不能單憑檔案名稱推定 ONNX 與外部資料的依賴。200 MB 只是下載量初篩，不代表 RAM 或 WASM 相容性。</small><script>
const out=document.getElementById('out');let report='';const mb=n=>(n/1e6).toFixed(1)+' MB';const valid=id=>/^[\w.-]+\/[\w.-]+$/.test(id);
async function audit(id){const url='https://huggingface.co/api/models/'+id.split('/').map(encodeURIComponent).join('/')+'/tree/main?recursive=true';const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const files=await response.json();if(!Array.isArray(files))throw Error('無效清單');const onnx=files.filter(x=>x.type==='file'&&/\.onnx$/i.test(x.path));const extra=files.filter(x=>x.type==='file'&&/\.onnx_data$|\.onnx\.data$|\.onnx_data\b|\.onnx_data$|\.onnx_data\./i.test(x.path));onnx.sort((a,b)=>(a.size??Infinity)-(b.size??Infinity));const small=onnx.filter(x=>Number.isFinite(x.size)&&x.size<=200e6);const lines=['','【'+id+'】','ONNX 主檔數='+onnx.length,'主檔 <=200MB 數='+small.length];for(const f of onnx.slice(0,15))lines.push('  '+(Number.isFinite(f.size)?mb(f.size):'未知大小')+'  '+f.path);if(onnx.length>15)lines.push('  ...其餘 '+(onnx.length-15)+' 檔');for(const f of extra.slice(0,10))lines.push('外部資料候選 '+(Number.isFinite(f.size)?mb(f.size):'未知')+' '+f.path);if(!onnx.length)lines.push('無 ONNX 主檔，不代表其他格式不可用');if(small.length)lines.push('需核實外部權重及 WASM 相容性，不能直接判定可用');return lines.join('\n')}
document.getElementById('run').onclick=async()=>{const ids=[...new Set(document.getElementById('ids').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean))].slice(0,12);const lines=['AIVAULT batch-audit-20261018-a','僅查公開模型檔案目錄，沒有下載模型權重。'];for(const id of ids){if(!valid(id)){lines.push('無效模型 ID：'+id);continue}try{lines.push(await audit(id))}catch(e){lines.push('【'+id+'】查詢失敗：'+e)}}lines.push('','注意：檔案小於 200 MB 只是候選，不是部署成功；ONNX 外部資料與記憶體峰值尚未驗證。');report=lines.join('\n');out.textContent=report};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(report||out.textContent)}catch(e){out.textContent+='\n複製失敗：'+e}};
</script></body></html>
