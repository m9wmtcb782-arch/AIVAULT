<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT Drawing Engine V0.1</title><style>
*{box-sizing:border-box}body{margin:0;background:#101726;color:#f1f5ff;font:15px system-ui,"Noto Sans TC",sans-serif}header{padding:12px 16px;background:#1a2940;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:19px;margin:0}main{display:grid;grid-template-columns:250px minmax(0,1fr) 230px;gap:12px;padding:12px;max-width:1600px;margin:auto}.panel{background:#1c2a41;padding:12px;border-radius:12px;border:1px solid #394a66}button,select,input{background:#263b59;color:white;border:1px solid #506687;border-radius:7px;padding:8px;font:inherit}button{cursor:pointer}button[aria-pressed=true]{background:#3d6bb1}label{display:block;margin:12px 0 5px}.tools{display:flex;flex-wrap:wrap;gap:6px}.tools button{flex:1 0 65px}.canvas-wrap{background:#293246;overflow:auto;display:grid;place-items:center;min-height:550px;padding:12px}svg{width:min(100%,600px);height:auto;aspect-ratio:3/4;background:white;touch-action:none;box-shadow:0 8px 28px #0007}.layer{display:flex;align-items:center;gap:6px;margin:6px 0;padding:6px;background:#273b59;border-radius:6px}.layer button{flex:1;text-align:left}.layer.active{outline:2px solid #75a8ff}.muted{font-size:12px;color:#b6c6df}input[type=color]{width:100%;height:42px}input[type=range]{width:100%}a{color:#a8cbff}@media(max-width:900px){main{grid-template-columns:1fr}.canvas-wrap{min-height:420px}svg{max-width:420px}}</style></head><body>
<header><h1>🎨 AIVAULT 繪圖引擎 V0.1</h1><a href="./aivault-comic-studio.html">返回漫劇工作室</a><span class="muted">本機 SVG 向量繪圖原型 · 無付費 API</span></header>
<main><aside class="panel"><h2>繪圖工具</h2><div class="tools" id="tools"></div><label for="color">顏色</label><input id="color" type="color" value="#403b69"><label for="stroke">線條粗細</label><input id="stroke" type="range" min="1" max="30" value="5"><label for="name">素材名稱</label><input id="name" value="角色與場景草稿" maxlength="80"><h3>基礎素材</h3><div class="tools"><button id="head">人物頭部</button><button id="body">人物身體</button><button id="tree">樹木</button><button id="house">房屋</button></div><p class="muted">這些是可編輯的向量草圖，不是 AI 生成的動漫人物。後續將接入圖像生成模型和角色一致性系統。</p></aside>
<section class="panel"><h2>畫布 768 × 1024</h2><div class="canvas-wrap"><svg id="canvas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 1024" aria-label="繪圖畫布"><rect width="768" height="1024" fill="#ffffff" pointer-events="none"/></svg></div><div class="tools" style="margin-top:12px"><button id="undo">復原</button><button id="clear">清空</button><button id="svgExport">匯出 SVG</button><button id="pngExport">匯出 PNG</button><button id="save">本機儲存</button><button id="load">讀取草稿</button></div><p id="status" role="status" class="muted"></p></section>
<aside class="panel"><h2>圖層</h2><div id="layers"></div><button id="up">上移圖層</button><button id="down">下移圖層</button><button id="delete">刪除圖層</button><p class="muted">支援畫筆、直線、矩形、橢圓、選取移動及圖層順序。SVG 可供後續動畫引擎拆分使用。</p></aside></main>
<script>
"use strict";
const NS="http://www.w3.org/2000/svg", $=id=>document.getElementById(id), svg=$("canvas");let tool="pen",selected=null,drawing=null,start=null,history=[],moving=null;
const create=(tag,attrs={})=>{const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));return e};
const items=()=>[...svg.children].filter(e=>e.tagName!=="rect"||e.getAttribute("pointer-events")!=="none");
function snapshot(){history.push(items().map(x=>x.outerHTML).join(""));if(history.length>50)history.shift()}
function point(ev){const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;const m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:0,y:0}}
function add(el){svg.append(el);selected=el;layers()}
function layers(){const root=$("layers");root.replaceChildren();items().slice().reverse().forEach((el,i)=>{const row=document.createElement("div");row.className="layer"+(selected===el?" active":"");const b=document.createElement("button");b.textContent=(items().length-i)+" · "+(el.dataset.label||el.tagName);b.onclick=()=>{selected=el;layers()};row.append(b);root.append(row)})}
const definitions=[["select","選取"],["pen","畫筆"],["line","直線"],["rect","矩形"],["ellipse","橢圓"]];
definitions.forEach(([key,label])=>{const b=document.createElement("button");b.textContent=label;b.onclick=()=>{tool=key;document.querySelectorAll("#tools button").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true")};b.setAttribute("aria-pressed",key==="pen"?"true":"false");$("tools").append(b)});
svg.addEventListener("pointerdown",ev=>{const p=point(ev);start=p;svg.setPointerCapture(ev.pointerId);if(tool==="select"){selected=ev.target===svg?null:items().includes(ev.target)?ev.target:null;moving=selected?{p,transform:selected.getAttribute("transform")||""}:null;layers();return}snapshot();const base={stroke:$("color").value,"stroke-width":$("stroke").value,"stroke-linecap":"round","stroke-linejoin":"round"};if(tool==="pen"){drawing=create("polyline",{...base,fill:"none",points:p.x+","+p.y})}else if(tool==="line"){drawing=create("line",{...base,x1:p.x,y1:p.y,x2:p.x,y2:p.y})}else if(tool==="rect"){drawing=create("rect",{...base,fill:"none",x:p.x,y:p.y,width:0,height:0})}else{drawing=create("ellipse",{...base,fill:"none",cx:p.x,cy:p.y,rx:0,ry:0})}drawing.dataset.label=tool;add(drawing)});
svg.addEventListener("pointermove",ev=>{const p=point(ev);if(moving&&selected){selected.setAttribute("transform",moving.transform+" translate("+(p.x-moving.p.x)+" "+(p.y-moving.p.y)+")");return}if(!drawing||!start)return;if(tool==="pen")drawing.setAttribute("points",drawing.getAttribute("points")+" "+p.x+","+p.y);if(tool==="line"){drawing.setAttribute("x2",p.x);drawing.setAttribute("y2",p.y)}if(tool==="rect"){drawing.setAttribute("x",Math.min(start.x,p.x));drawing.setAttribute("y",Math.min(start.y,p.y));drawing.setAttribute("width",Math.abs(start.x-p.x));drawing.setAttribute("height",Math.abs(start.y-p.y))}if(tool==="ellipse"){drawing.setAttribute("cx",(start.x+p.x)/2);drawing.setAttribute("cy",(start.y+p.y)/2);drawing.setAttribute("rx",Math.abs(start.x-p.x)/2);drawing.setAttribute("ry",Math.abs(start.y-p.y)/2)}});
function finish(){drawing=null;moving=null;start=null;layers()}svg.addEventListener("pointerup",finish);svg.addEventListener("pointercancel",finish);
function primitive(kind){snapshot();const c=$("color").value;const g=create("g");g.dataset.label=kind;if(kind==="head"){g.append(create("ellipse",{cx:384,cy:350,rx:120,ry:150,fill:"#f1c8ac",stroke:c,"stroke-width":5}),create("ellipse",{cx:340,cy:350,rx:9,ry:12,fill:"#24213b"}),create("ellipse",{cx:428,cy:350,rx:9,ry:12,fill:"#24213b"}),create("path",{d:"M345 415 Q384 450 423 415",fill:"none",stroke:"#9b4d5d","stroke-width":6}))}else if(kind==="body"){g.append(create("path",{d:"M280 490 Q240 510 230 700 L230 870 L538 870 L538 700 Q528 510 488 490 Z",fill:c,stroke:"#29233b","stroke-width":5}))}else if(kind==="tree"){g.append(create("rect",{x:360,y:580,width:65,height:300,fill:"#805735"}),create("circle",{cx:390,cy:480,r:170,fill:"#4c916a"}))}else{g.append(create("rect",{x:190,y:480,width:390,height:340,fill:"#c5b3a2"}),create("path",{d:"M145 485 L385 260 L625 485 Z",fill:c}),create("rect",{x:345,y:650,width:90,height:170,fill:"#654a39"}))}add(g)}
["head","body","tree","house"].forEach(id=>$(id).onclick=()=>primitive(id));
$("undo").onclick=()=>{if(!history.length)return;const previous=history.pop();items().forEach(x=>x.remove());const doc=new DOMParser().parseFromString('<svg xmlns="'+NS+'">'+previous+'</svg>',"image/svg+xml");[...doc.documentElement.children].forEach(x=>svg.append(document.importNode(x,true)));selected=null;layers()};
$("clear").onclick=()=>{snapshot();items().forEach(x=>x.remove());selected=null;layers()};
$("delete").onclick=()=>{if(selected){snapshot();selected.remove();selected=null;layers()}};
$("up").onclick=()=>{if(selected&&selected.nextElementSibling){snapshot();svg.insertBefore(selected,selected.nextElementSibling.nextElementSibling);layers()}};
$("down").onclick=()=>{if(selected&&selected.previousElementSibling&&items().includes(selected.previousElementSibling)){snapshot();svg.insertBefore(selected,selected.previousElementSibling);layers()}};
function serialize(){const clone=svg.cloneNode(true);clone.setAttribute("width","768");clone.setAttribute("height","1024");return new XMLSerializer().serializeToString(clone)}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
$("svgExport").onclick=()=>download(new Blob([serialize()],{type:"image/svg+xml"}),"aivault-artwork.svg");
$("pngExport").onclick=()=>{const url=URL.createObjectURL(new Blob([serialize()],{type:"image/svg+xml"})),im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=768;c.height=1024;const ctx=c.getContext("2d");ctx.drawImage(im,0,0);c.toBlob(blob=>{if(blob)download(blob,"aivault-artwork.png");URL.revokeObjectURL(url)},"image/png")};im.onerror=()=>{$("status").textContent="PNG 轉換失敗";URL.revokeObjectURL(url)};im.src=url};
$("save").onclick=()=>{try{localStorage.setItem("aivault-drawing-v01",JSON.stringify({name:$("name").value,svg:serialize()}));$("status").textContent="草稿已存於本機瀏覽器"}catch(e){$("status").textContent="儲存失敗，請匯出 SVG"}};
$("load").onclick=()=>{try{const raw=localStorage.getItem("aivault-drawing-v01");if(!raw)throw Error("沒有草稿");const data=JSON.parse(raw);const doc=new DOMParser().parseFromString(data.svg,"image/svg+xml");if(doc.documentElement.localName!=="svg"||doc.getElementsByTagName("parsererror").length)throw Error("格式錯誤");snapshot();items().forEach(x=>x.remove());[...doc.documentElement.children].slice(1).forEach(x=>{if(["g","path","rect","ellipse","circle","line","polyline"].includes(x.localName))svg.append(document.importNode(x,true))});$("name").value=data.name||"草稿";selected=null;layers();$("status").textContent="已讀取本機草稿"}catch(e){$("status").textContent="讀取失敗："+e.message}};
layers();
</script></body></html>
