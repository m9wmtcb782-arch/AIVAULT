<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>任務</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body class="game-body">
  <div class="snow-layer"></div>
  <div class="app" id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/boot.js"></script>
  <script>
    (async () => {
      if (!(await FKAuth.requirePlayer())) return;
      const snap = await FKApi.snapshot();
      const tasks = [
        { t: "將熔爐升到 3 級", ok: snap.buildings.find(b=>b.building_type==="castle").level >= 3 },
        { t: "訓練任意士兵", ok: (snap.army.warrior+snap.army.archer+snap.army.cavalry+snap.army.mage) > 20 },
        { t: "研究一項科技", ok: (snap.techs||[]).some(t=>t.level>0) },
        { t: "在世界頻道發言", ok: false }
      ];
      document.getElementById("app").innerHTML = `
        <div class="page-head"><a class="back" href="game-menu.html">← 返回</a><h2>任務</h2></div>
        <div class="panel">${tasks.map(x => `<div class="list-item"><span>${x.t}</span><span class="badge">${x.ok?"已完成":"進行中"}</span></div>`).join("")}</div>
        ${FKUI.nav("more")}
      `;
    })();
  </script>
</body>
</html>
