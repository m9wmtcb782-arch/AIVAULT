<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>AIVAULT GPU Test</title>
  <style>
    :root {
      --bg: #0b0f14;
      --card: #141b24;
      --line: #243041;
      --text: #e8eef6;
      --muted: #8ea0b5;
      --ok: #3dd68c;
      --bad: #ff6b6b;
      --warn: #f5c542;
      --btn: #3b82f6;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 6px;
    }
    .sub {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 700;
      background: var(--btn);
      color: #fff;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .card {
      margin-top: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      font-size: 0.9rem;
    }
    .row:last-child { border-bottom: 0; }
    .k { color: var(--muted); flex: 0 0 42%; }
    .v {
      flex: 1;
      text-align: right;
      word-break: break-all;
      font-variant-numeric: tabular-nums;
    }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    .warn { color: var(--warn); }
    pre {
      margin: 10px 0 0;
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AIVAULT GPU Test</h1>
    <div class="sub">在真實手機瀏覽器按下按鈕後，由本機 WebGPU 執行 compute shader，再以 CPU 驗證 readback。不支援時會明確顯示 WebGPU 不支援。</div>
    <button id="startBtn" type="button">開始 GPU 測試</button>
    <div class="card" id="resultCard" hidden></div>
    <pre id="log"></pre>
  </div>
  <script>
    const N = 65536;
    const WORKGROUP_SIZE = 64;
    const KERNEL = "result[i] = A[i] + B[i] * C[i]";

    const startBtn = document.getElementById("startBtn");
    const resultCard = document.getElementById("resultCard");
    const logEl = document.getElementById("log");

    function log(msg) {
      logEl.textContent += msg + "\n";
    }

    function row(k, v, cls) {
      const c = cls ? ` ${cls}` : "";
      return `<div class="row"><div class="k">${escapeHtml(k)}</div><div class="v${c}">${escapeHtml(String(v))}</div></div>`;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function detectPlatform() {
      const ua = navigator.userAgent || "";
      if (/iPhone|iPad|iPod/i.test(ua)) return "iOS";
      if (/Android/i.test(ua)) return "Android";
      if (/Macintosh/i.test(ua)) return "macOS";
      if (/Windows/i.test(ua)) return "Windows";
      if (/Linux/i.test(ua)) return "Linux";
      return "Unknown";
    }

    function detectBrowser() {
      const ua = navigator.userAgent || "";
      if (/Edg\//i.test(ua)) return "Edge";
      if (/OPR\//i.test(ua) || /Opera/i.test(ua)) return "Opera";
      if (/Chrome\//i.test(ua) && !/Edg\//i.test(ua)) return "Chrome";
      if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) return "Safari";
      if (/Firefox/i.test(ua)) return "Firefox";
      return ua.slice(0, 80) || "Unknown";
    }

    function detectOS() {
      const ua = navigator.userAgent || "";
      const plat = navigator.platform || "";
      const ios = ua.match(/OS (\d+[_\d]*) like Mac OS X/i);
      if (ios) return "iOS " + ios[1].replace(/_/g, ".");
      const and = ua.match(/Android\s([\d.]+)/i);
      if (and) return "Android " + and[1];
      return (navigator.userAgentData && navigator.userAgentData.platform) || plat || "Unknown";
    }

    function bytesToHex(bytes) {
      const hex = [];
      for (let i = 0; i < bytes.length; i++) {
        hex.push(bytes[i].toString(16).padStart(2, "0"));
      }
      return hex.join("");
    }

    async function sha256Hex(buffer) {
      const digest = await crypto.subtle.digest("SHA-256", buffer);
      return bytesToHex(new Uint8Array(digest));
    }

    function makeId() {
      const t = Date.now().toString(16);
      const r = crypto.getRandomValues(new Uint32Array(2));
      return "gpu-" + t + "-" + r[0].toString(16) + r[1].toString(16);
    }

    function renderUnsupported(extra) {
      resultCard.hidden = false;
      resultCard.innerHTML =
        row("Test ID", makeId()) +
        row("手機平台", detectPlatform()) +
        row("瀏覽器", detectBrowser()) +
        row("OS", detectOS()) +
        row("螢幕解析度", `${screen.width}×${screen.height}`) +
        row("DPR", String(window.devicePixelRatio || 1)) +
        row("WebGPU 是否支援", "WebGPU 不支援", "bad") +
        row("Verification", "FAIL", "bad") +
        row("說明", extra || "navigator.gpu 不可用");
    }

    function fillInputs(a, b, c) {
      for (let i = 0; i < N; i++) {
        a[i] = (i * 0.017 + 1.25) % 97;
        b[i] = ((i * 0.031) % 53) + 0.5;
        c[i] = ((i * 0.013) % 19) - 3.0;
      }
    }

    async function runGpuTest() {
      startBtn.disabled = true;
      logEl.textContent = "";
      resultCard.hidden = true;
      log("開始測試…");

      if (!("gpu" in navigator) || !navigator.gpu) {
        log("navigator.gpu 不存在");
        renderUnsupported("navigator.gpu 不存在");
        startBtn.disabled = false;
        return;
      }

      let adapter = null;
      try {
        adapter = await navigator.gpu.requestAdapter();
      } catch (e) {
        log("requestAdapter 失敗: " + e);
        renderUnsupported("requestAdapter 失敗: " + e);
        startBtn.disabled = false;
        return;
      }

      if (!adapter) {
        log("沒有可用 GPUAdapter");
        renderUnsupported("沒有可用 GPUAdapter");
        startBtn.disabled = false;
        return;
      }

      let device = null;
      try {
        device = await adapter.requestDevice();
      } catch (e) {
        log("requestDevice 失敗: " + e);
        renderUnsupported("requestDevice 失敗: " + e);
        startBtn.disabled = false;
        return;
      }

      const info = adapter.info || {};
      const gpuHardware = [info.vendor, info.architecture, info.device, info.description]
        .filter(Boolean)
        .join(" / ") || "(瀏覽器未提供)";

      const bytes = N * 4;
      const aCpu = new Float32Array(N);
      const bCpu = new Float32Array(N);
      const cCpu = new Float32Array(N);
      fillInputs(aCpu, bCpu, cCpu);

      const expected = new Float32Array(N);
      for (let i = 0; i < N; i++) {
        expected[i] = aCpu[i] + bCpu[i] * cCpu[i];
      }

      const usageSrc = GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST;
      const bufA = device.createBuffer({ size: bytes, usage: usageSrc });
      const bufB = device.createBuffer({ size: bytes, usage: usageSrc });
      const bufC = device.createBuffer({ size: bytes, usage: usageSrc });
      const bufOut = device.createBuffer({
        size: bytes,
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC
      });
      const bufRead = device.createBuffer({
        size: bytes,
        usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ
      });

      device.queue.writeBuffer(bufA, 0, aCpu);
      device.queue.writeBuffer(bufB, 0, bCpu);
      device.queue.writeBuffer(bufC, 0, cCpu);

      const shader = device.createShaderModule({
        code: `
          @group(0) @binding(0) var<storage, read> A : array<f32>;
          @group(0) @binding(1) var<storage, read> B : array<f32>;
          @group(0) @binding(2) var<storage, read> C : array<f32>;
          @group(0) @binding(3) var<storage, read_write> result : array<f32>;

          @compute @workgroup_size(${WORKGROUP_SIZE})
          fn main(@builtin(global_invocation_id) gid : vec3<u32>) {
            let i = gid.x;
            if (i >= arrayLength(&result)) {
              return;
            }
            result[i] = A[i] + B[i] * C[i];
          }
        `
      });

      const pipeline = device.createComputePipeline({
        layout: "auto",
        compute: { module: shader, entryPoint: "main" }
      });

      const bindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: { buffer: bufA } },
          { binding: 1, resource: { buffer: bufB } },
          { binding: 2, resource: { buffer: bufC } },
          { binding: 3, resource: { buffer: bufOut } }
        ]
      });

      const dispatchCount = Math.ceil(N / WORKGROUP_SIZE);
      const encoder = device.createCommandEncoder();
      const pass = encoder.beginComputePass();
      pass.setPipeline(pipeline);
      pass.setBindGroup(0, bindGroup);
      pass.dispatchWorkgroups(dispatchCount);
      pass.end();
      encoder.copyBufferToBuffer(bufOut, 0, bufRead, 0, bytes);

      const t0 = performance.now();
      device.queue.submit([encoder.finish()]);
      if (device.queue.onSubmittedWorkDone) {
        await device.queue.onSubmittedWorkDone();
      }
      await bufRead.mapAsync(GPUMapMode.READ);
      const t1 = performance.now();

      const raw = bufRead.getMappedRange();
      const gpuOut = new Float32Array(raw.slice(0));
      const shaSource = raw.slice(0);
      bufRead.unmap();

      let mismatch = 0;
      let maxAbsErr = 0;
      const samples = [];
      for (let i = 0; i < N; i++) {
        const err = Math.abs(gpuOut[i] - expected[i]);
        if (err > maxAbsErr) maxAbsErr = err;
        if (err > 1e-4) mismatch++;
        if (i < 5 || i === N - 1) {
          samples.push(`i=${i} gpu=${gpuOut[i]} cpu=${expected[i]} err=${err}`);
        }
      }

      const execMs = t1 - t0;
      const ops = N;
      const throughput = execMs > 0 ? (ops / (execMs / 1000)) : 0;
      const sha = await sha256Hex(shaSource);
      const passOk = mismatch === 0;
      const testId = makeId();

      resultCard.hidden = false;
      resultCard.innerHTML =
        row("Test ID", testId) +
        row("手機平台", detectPlatform()) +
        row("瀏覽器", detectBrowser()) +
        row("OS", detectOS()) +
        row("螢幕解析度", `${screen.width}×${screen.height}`) +
        row("DPR", String(window.devicePixelRatio || 1)) +
        row("WebGPU 是否支援", "支援", "ok") +
        row("GPU hardware", gpuHardware) +
        row("測試資料量", `${N} floats (${bytes} bytes × 4 buffers)`) +
        row("Workgroup size", String(WORKGROUP_SIZE)) +
        row("dispatchWorkgroups", String(dispatchCount)) +
        row("Kernel", KERNEL) +
        row("Execution Time", execMs.toFixed(3) + " ms") +
        row("Throughput", throughput.toFixed(0) + " elements/s") +
        row("Verification", passOk ? `PASS (mismatch=${mismatch}, maxAbsErr=${maxAbsErr})` : `FAIL (mismatch=${mismatch}, maxAbsErr=${maxAbsErr})`, passOk ? "ok" : "bad") +
        row("SHA-256", sha) +
        row("Sample checks", samples.join(" | "));

      log("完成。Verification=" + (passOk ? "PASS" : "FAIL"));
      startBtn.disabled = false;

      try { bufA.destroy(); bufB.destroy(); bufC.destroy(); bufOut.destroy(); bufRead.destroy(); } catch (_) {}
      try { device.destroy(); } catch (_) {}
    }

    startBtn.addEventListener("click", () => {
      runGpuTest().catch((e) => {
        log("例外: " + e);
        renderUnsupported(String(e && e.message ? e.message : e));
        startBtn.disabled = false;
      });
    });
  </script>
</body>
</html>
