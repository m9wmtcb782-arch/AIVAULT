<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#070b14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>AIVAULT GPU TEST</title>
  <style>
    :root {
      --bg: #070b14;
      --bg-elev: #101826;
      --bg-card: #141e2e;
      --line: rgba(255, 255, 255, 0.08);
      --text: #f3f6fb;
      --muted: #9aa8bc;
      --accent: #3d8bff;
      --accent-2: #6ee7c5;
      --warn: #f5c16c;
      --fail: #ff6b7a;
      --pass: #3ee0a0;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(61, 139, 255, 0.18), transparent 50%),
        radial-gradient(900px 500px at 100% 0%, rgba(110, 231, 197, 0.08), transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      padding: 20px 16px 48px;
    }

    .wrap {
      width: min(720px, 100%);
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 18px 8px 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 8vw, 42px);
      letter-spacing: 0.08em;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 17px;
      letter-spacing: 0.04em;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent 40%), var(--bg-card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 16px;
      margin-bottom: 16px;
    }

    .card h2 {
      margin: 0 0 14px;
      font-size: 15px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent-2);
    }

    .kv {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 10px 12px;
      font-size: 15px;
      line-height: 1.45;
    }

    .k {
      color: var(--muted);
    }

    .v {
      word-break: break-word;
    }

    .levels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .level {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--bg-elev);
      color: var(--text);
      border-radius: 14px;
      min-height: 68px;
      font-size: 16px;
      font-weight: 700;
      padding: 12px 10px;
    }

    .level small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-weight: 500;
      font-size: 12px;
    }

    .level.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(61, 139, 255, 0.35);
      background: linear-gradient(180deg, rgba(61,139,255,0.18), var(--bg-elev));
    }

    .primary, .secondary {
      width: 100%;
      border: 0;
      border-radius: 16px;
      min-height: 62px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .primary {
      margin-top: 14px;
      background: linear-gradient(180deg, #5aa0ff, #2c74e8);
      color: #fff;
    }

    .primary:disabled {
      opacity: 0.55;
    }

    .secondary {
      margin-top: 10px;
      background: #223049;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .status {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #0d1522;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .badge.pass {
      background: rgba(62, 224, 160, 0.16);
      color: var(--pass);
    }

    .badge.fail {
      background: rgba(255, 107, 122, 0.16);
      color: var(--fail);
    }

    .badge.warn {
      background: rgba(245, 193, 108, 0.16);
      color: var(--warn);
    }

    .report {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13.5px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      color: #d7e3f4;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      background: #111827;
      color: #fff;
      border: 1px solid var(--line);
      padding: 12px 16px;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>AIVAULT GPU TEST</h1>
      <div class="subtitle">手機 GPU 真實運算測試</div>
    </header>

    <section class="card">
      <h2>設備與環境</h2>
      <div class="kv">
        <div class="k">瀏覽器</div>
        <div class="v" id="info-browser">偵測中…</div>
        <div class="k">作業系統</div>
        <div class="v" id="info-os">偵測中…</div>
        <div class="k">螢幕解析度</div>
        <div class="v" id="info-screen">偵測中…</div>
        <div class="k">WebGPU 支援</div>
        <div class="v" id="info-webgpu">偵測中…</div>
        <div class="k">GPU 硬體資訊</div>
        <div class="v" id="info-gpu">偵測中…</div>
        <div class="k">GPU 使用率</div>
        <div class="v" id="info-usage">GPU 使用率：瀏覽器無法提供</div>
      </div>
    </section>

    <section class="card">
      <h2>GPU 測試 LEVEL</h2>
      <div class="levels">
        <button class="level active" data-size="100000" type="button">LEVEL 1<small>100,000</small></button>
        <button class="level" data-size="500000" type="button">LEVEL 2<small>500,000</small></button>
        <button class="level" data-size="1000000" type="button">LEVEL 3<small>1,000,000</small></button>
        <button class="level" data-size="5000000" type="button">LEVEL 4<small>5,000,000</small></button>
      </div>
      <button class="primary" id="start-btn" type="button">開始 GPU 測試</button>
      <div class="status" id="run-status">尚未開始。選擇 LEVEL 後按下開始，將使用此手機瀏覽器的 navigator.gpu 執行真實 WebGPU Compute Shader。</div>
      <p class="note">此頁只在本機瀏覽器執行。不會模擬 GPU、不會寫死時間、不會寫死 PASS。</p>
    </section>

    <section class="card">
      <h2>測試報告</h2>
      <div id="verification-badge"></div>
      <pre class="report" id="report">尚未產生報告。</pre>
      <button class="secondary" id="copy-btn" type="button" disabled>複製測試結果</button>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const LEVELS = [100000, 500000, 1000000, 5000000];
    const WORKGROUP_SIZE = 64;
    const FLOAT_TOLERANCE = 1e-4;

    const els = {
      browser: document.getElementById("info-browser"),
      os: document.getElementById("info-os"),
      screen: document.getElementById("info-screen"),
      webgpu: document.getElementById("info-webgpu"),
      gpu: document.getElementById("info-gpu"),
      usage: document.getElementById("info-usage"),
      start: document.getElementById("start-btn"),
      status: document.getElementById("run-status"),
      report: document.getElementById("report"),
      copy: document.getElementById("copy-btn"),
      badge: document.getElementById("verification-badge"),
      toast: document.getElementById("toast")
    };

    let selectedSize = 100000;
    let lastReportText = "";
    let webgpuSupported = typeof navigator.gpu !== "undefined";

    function parseBrowser(ua) {
      if (/EdgiOS|Edg\//i.test(ua)) return /EdgiOS/i.test(ua) ? "Microsoft Edge (iOS)" : "Microsoft Edge";
      if (/OPR\/|Opera/i.test(ua)) return "Opera";
      if (/Firefox|FxiOS/i.test(ua)) return /FxiOS/i.test(ua) ? "Firefox (iOS)" : "Firefox";
      if (/CriOS/i.test(ua)) return "Chrome (iOS)";
      if (/Chrome\//i.test(ua) && !/Chromium/i.test(ua)) return "Chrome";
      if (/Safari/i.test(ua) && /Version\//i.test(ua)) return "Safari";
      if (/SamsungBrowser/i.test(ua)) return "Samsung Internet";
      return navigator.userAgentData && navigator.userAgentData.brands
        ? navigator.userAgentData.brands.map(b => b.brand + " " + b.version).join(", ")
        : "未知瀏覽器";
    }

    function parseOS(ua) {
      if (/iPhone|iPad|iPod/i.test(ua)) {
        const m = ua.match(/OS (\d+)[._](\d+)/);
        return m ? ("iOS " + m[1] + "." + m[2]) : "iOS";
      }
      if (/Android/i.test(ua)) {
        const m = ua.match(/Android (\d+(?:\.\d+)?)/);
        return m ? ("Android " + m[1]) : "Android";
      }
      if (/Windows NT/i.test(ua)) return "Windows";
      if (/Mac OS X/i.test(ua)) return "macOS";
      if (/Linux/i.test(ua)) return "Linux";
      return "未知作業系統";
    }

    function setStatus(text) {
      els.status.textContent = text;
    }

    function showToast(text) {
      els.toast.textContent = text;
      els.toast.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => els.toast.classList.remove("show"), 1800);
    }

    function formatNumber(n) {
      return Number(n).toLocaleString("en-US");
    }

    function bytesToHex(buffer) {
      const bytes = new Uint8Array(buffer);
      let hex = "";
      for (let i = 0; i < bytes.length; i++) hex += bytes[i].toString(16).padStart(2, "0");
      return hex;
    }

    function valueAt(i) {
      const a = (i % 997) * 0.125;
      const b = ((i * 13) % 991) * 0.25;
      const c = ((i * 29) % 983) * 0.0625;
      return { a, b, c, expected: a + b * c };
    }

    function fillInputs(size) {
      const A = new Float32Array(size);
      const B = new Float32Array(size);
      const C = new Float32Array(size);
      for (let i = 0; i < size; i++) {
        const v = valueAt(i);
        A[i] = v.a;
        B[i] = v.b;
        C[i] = v.c;
      }
      return { A, B, C };
    }

    function sampleIndices(size) {
      const mid = Math.floor(size / 2);
      const set = new Set([
        0,
        1,
        2,
        3,
        7,
        64,
        65,
        127,
        128,
        255,
        256,
        1023,
        1024,
        mid - 1,
        mid,
        mid + 1,
        size - 3,
        size - 2,
        size - 1
      ]);
      const extra = [17, 99, 333, 777, 4096, 12345, 100000, 499999, 999999, 2500000, 4999999];
      extra.forEach(i => { if (i >= 0 && i < size) set.add(i); });
      return Array.from(set).filter(i => i >= 0 && i < size).sort((a, b) => a - b);
    }

    function nearlyEqual(gpuVal, expected) {
      const diff = Math.abs(gpuVal - expected);
      const tol = Math.max(FLOAT_TOLERANCE, Math.abs(expected) * 1e-5);
      return diff <= tol;
    }

    function verifyResults(gpuData, size) {
      const samples = sampleIndices(size);
      const details = [];
      let pass = true;
      for (const i of samples) {
        const expected = valueAt(i).expected;
        const actual = gpuData[i];
        const ok = Number.isFinite(actual) && nearlyEqual(actual, expected);
        if (!ok) pass = false;
        details.push({
          index: i,
          expected,
          actual,
          ok
        });
      }
      return { pass, samples: details };
    }

    async function sha256Hex(arrayBuffer) {
      const digest = await crypto.subtle.digest("SHA-256", arrayBuffer);
      return bytesToHex(digest);
    }

    function describeAdapterInfo(adapter) {
      const info = adapter.info || adapter.requestAdapterInfo && null;
      if (info && (info.vendor || info.architecture || info.device || info.description)) {
        const parts = [];
        if (info.vendor) parts.push("vendor=" + info.vendor);
        if (info.architecture) parts.push("architecture=" + info.architecture);
        if (info.device) parts.push("device=" + info.device);
        if (info.description) parts.push("description=" + info.description);
        return parts.join(" / ");
      }
      return "瀏覽器未提供 GPU 硬體詳細資訊";
    }

    async function probeWebGPU() {
      els.browser.textContent = parseBrowser(navigator.userAgent);
      els.os.textContent = parseOS(navigator.userAgent);
      els.screen.textContent = window.screen.width + " × " + window.screen.height +
        "  (CSS " + window.innerWidth + " × " + window.innerHeight + ", DPR " + window.devicePixelRatio + ")";
      els.usage.textContent = "GPU 使用率：瀏覽器無法提供";

      if (!webgpuSupported) {
        els.webgpu.textContent = "WebGPU：不支援";
        els.gpu.textContent = "瀏覽器未提供 GPU 硬體詳細資訊";
        els.start.disabled = true;
        setStatus("WebGPU：不支援。此瀏覽器沒有 navigator.gpu，無法執行真實 GPU Compute。");
        return;
      }

      els.webgpu.textContent = "WebGPU：支援（已偵測 navigator.gpu）";
      try {
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
          els.webgpu.textContent = "WebGPU：requestAdapter() 失敗";
          els.gpu.textContent = "瀏覽器未提供 GPU 硬體詳細資訊";
          els.start.disabled = true;
          setStatus("requestAdapter() 回傳空值，無法取得 GPU adapter。");
          return;
        }
        els.gpu.textContent = describeAdapterInfo(adapter);
        if (typeof adapter.requestAdapterInfo === "function" && !adapter.info) {
          try {
            const info = await adapter.requestAdapterInfo();
            if (info && (info.vendor || info.architecture || info.device || info.description)) {
              const parts = [];
              if (info.vendor) parts.push("vendor=" + info.vendor);
              if (info.architecture) parts.push("architecture=" + info.architecture);
              if (info.device) parts.push("device=" + info.device);
              if (info.description) parts.push("description=" + info.description);
              els.gpu.textContent = parts.join(" / ");
            } else {
              els.gpu.textContent = "瀏覽器未提供 GPU 硬體詳細資訊";
            }
          } catch (_) {
            els.gpu.textContent = "瀏覽器未提供 GPU 硬體詳細資訊";
          }
        }
      } catch (err) {
        els.webgpu.textContent = "WebGPU：requestAdapter() 發生錯誤";
        els.gpu.textContent = "瀏覽器未提供 GPU 硬體詳細資訊";
        els.start.disabled = true;
        setStatus("requestAdapter() 錯誤：" + (err && err.message ? err.message : String(err)));
      }
    }

    const WGSL = `@group(0) @binding(0) var<storage, read> A : array<f32>;
@group(0) @binding(1) var<storage, read> B : array<f32>;
@group(0) @binding(2) var<storage, read> C : array<f32>;
@group(0) @binding(3) var<storage, read_write> Out : array<f32>;

@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid : vec3<u32>) {
  let i = gid.x;
  if (i >= arrayLength(&Out)) {
    return;
  }
  Out[i] = A[i] + B[i] * C[i];
}`;

    async function runGpuTest(size) {
      if (!navigator.gpu) {
        throw new Error("WebGPU：不支援（navigator.gpu 不存在）");
      }

      const testId = crypto.randomUUID();
      setStatus("正在 requestAdapter()…");

      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) {
        throw new Error("requestAdapter() 失敗：未取得 adapter");
      }

      setStatus("正在 requestDevice()…");
      let device;
      try {
        device = await adapter.requestDevice();
      } catch (err) {
        throw new Error("requestDevice() 失敗：" + (err && err.message ? err.message : String(err)));
      }

      let lostMessage = "";
      device.lost.then((info) => {
        lostMessage = (info && info.message) ? info.message : "device lost";
      }).catch(() => {});

      const byteLength = size * 4;
      setStatus("正在建立 deterministic input A / B / C…");
      const { A, B, C } = fillInputs(size);

      setStatus("正在建立 GPU Buffer…");
      const usageSrc = GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST;
      const bufferA = device.createBuffer({ size: byteLength, usage: usageSrc, mappedAtCreation: true });
      const bufferB = device.createBuffer({ size: byteLength, usage: usageSrc, mappedAtCreation: true });
      const bufferC = device.createBuffer({ size: byteLength, usage: usageSrc, mappedAtCreation: true });
      new Float32Array(bufferA.getMappedRange()).set(A);
      new Float32Array(bufferB.getMappedRange()).set(B);
      new Float32Array(bufferC.getMappedRange()).set(C);
      bufferA.unmap();
      bufferB.unmap();
      bufferC.unmap();

      const bufferOut = device.createBuffer({
        size: byteLength,
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC
      });
      const bufferRead = device.createBuffer({
        size: byteLength,
        usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ
      });

      setStatus("正在建立 WGSL Shader Module 與 Compute Pipeline…");
      const module = device.createShaderModule({ code: WGSL });
      const pipeline = device.createComputePipeline({
        layout: "auto",
        compute: { module, entryPoint: "main" }
      });
      const bindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: { buffer: bufferA } },
          { binding: 1, resource: { buffer: bufferB } },
          { binding: 2, resource: { buffer: bufferC } },
          { binding: 3, resource: { buffer: bufferOut } }
        ]
      });

      const workgroups = Math.ceil(size / WORKGROUP_SIZE);
      setStatus("正在 dispatchWorkgroups(" + workgroups + ") 並提交 GPU 工作…");

      const t0 = performance.now();
      const encoder = device.createCommandEncoder();
      const pass = encoder.beginComputePass();
      pass.setPipeline(pipeline);
      pass.setBindGroup(0, bindGroup);
      pass.dispatchWorkgroups(workgroups);
      pass.end();
      encoder.copyBufferToBuffer(bufferOut, 0, bufferRead, 0, byteLength);
      device.queue.submit([encoder.finish()]);
      await device.queue.onSubmittedWorkDone();
      await bufferRead.mapAsync(GPUMapMode.READ);
      const t1 = performance.now();

      const mapped = bufferRead.getMappedRange();
      const rawCopy = mapped.slice(0);
      const gpuData = new Float32Array(rawCopy);
      bufferRead.unmap();

      const executionMs = t1 - t0;
      const seconds = executionMs / 1000;
      const throughput = seconds > 0 ? (size / seconds) : 0;

      setStatus("正在驗證 GPU 結果並計算 SHA-256…");
      const verification = verifyResults(gpuData, size);
      const sha = await sha256Hex(rawCopy);

      bufferA.destroy();
      bufferB.destroy();
      bufferC.destroy();
      bufferOut.destroy();
      bufferRead.destroy();
      device.destroy();

      if (lostMessage) {
        throw new Error("GPU device lost：" + lostMessage);
      }

      return {
        testId,
        size,
        workgroups,
        executionMs,
        throughput,
        verification,
        sha,
        adapterInfo: describeAdapterInfo(adapter)
      };
    }

    function renderReport(result, extraError) {
      const pass = result && result.verification && result.verification.pass && !extraError;
      els.badge.innerHTML = extraError
        ? '<span class="badge fail">FAIL</span>'
        : (pass
          ? '<span class="badge pass">PASS</span>'
          : '<span class="badge fail">FAIL</span>');

      if (extraError) {
        lastReportText =
          "AIVAULT GPU TEST\n" +
          "Verification: FAIL\n" +
          "Error: " + extraError + "\n";
        els.report.textContent = lastReportText;
        els.copy.disabled = false;
        return;
      }

      const failedSamples = result.verification.samples.filter(s => !s.ok);
      const sampleLines = result.verification.samples.slice(0, 12).map(s => {
        return "  i=" + s.index + " gpu=" + s.actual + " cpu=" + s.expected + " " + (s.ok ? "OK" : "MISMATCH");
      });

      lastReportText = [
        "AIVAULT GPU TEST",
        "手機 GPU 真實運算測試",
        "",
        "Test ID: " + result.testId,
        "LEVEL size: " + formatNumber(result.size),
        "Workgroup size: 64",
        "dispatchWorkgroups: " + result.workgroups,
        "Kernel: result[i] = A[i] + B[i] * C[i]",
        "GPU hardware: " + result.adapterInfo,
        "",
        "Execution Time: " + result.executionMs.toFixed(3) + " ms",
        "Throughput: " + result.throughput.toFixed(2) + " elements/s",
        "Verification: " + (result.verification.pass ? "PASS" : "FAIL"),
        "SHA-256: " + result.sha,
        "",
        "Sample checks:",
        sampleLines.join("\n"),
        failedSamples.length ? ("Failed samples: " + failedSamples.length) : "Failed samples: 0",
        "",
        "Browser: " + els.browser.textContent,
        "OS: " + els.os.textContent,
        "Screen: " + els.screen.textContent,
        "WebGPU: " + els.webgpu.textContent,
        "GPU usage: 瀏覽器無法提供"
      ].join("\n");

      els.report.textContent = lastReportText;
      els.copy.disabled = false;
    }

    document.querySelectorAll(".level").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".level").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedSize = Number(btn.dataset.size);
      });
    });

    els.start.addEventListener("click", async () => {
      if (!LEVELS.includes(selectedSize)) selectedSize = 100000;
      els.start.disabled = true;
      els.copy.disabled = true;
      els.badge.innerHTML = "";
      lastReportText = "";
      els.report.textContent = "測試進行中…";
      setStatus("開始真實 WebGPU 測試，size = " + formatNumber(selectedSize));

      try {
        const result = await runGpuTest(selectedSize);
        renderReport(result);
        setStatus(
          result.verification.pass
            ? "GPU 測試完成：PASS"
            : "GPU 測試完成：FAIL（GPU 結果與 CPU 預期不一致）"
        );
      } catch (err) {
        const message = err && err.message ? err.message : String(err);
        renderReport(null, message);
        setStatus(message);
      } finally {
        els.start.disabled = !navigator.gpu;
      }
    });

    els.copy.addEventListener("click", async () => {
      if (!lastReportText) {
        showToast("複製失敗");
        return;
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(lastReportText);
          showToast("已複製測試結果");
          return;
        }
        throw new Error("clipboard api unavailable");
      } catch (_) {
        try {
          const ta = document.createElement("textarea");
          ta.value = lastReportText;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand("copy");
          document.body.removeChild(ta);
          showToast(ok ? "已複製測試結果" : "複製失敗");
        } catch (e2) {
          showToast("複製失敗");
        }
      }
    });

    probeWebGPU();
  </script>
</body>
</html>
