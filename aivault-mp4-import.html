<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MP4 轉文字匯入 · AIVAULT</title>
<style>
body { font-family: -apple-system, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
.wrap { max-width: 640px; margin: 0 auto; padding: 20px; }
h1 { font-size: 20px; margin: 0 0 8px; }
p { color: #64748b; font-size: 14px; }
.card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; margin-top: 16px; }
button { background: #1d4ed8; color: #fff; border: 0; border-radius: 10px; padding: 12px 16px; font-size: 15px; width: 100%; }
input[type=file] { margin: 10px 0; }
#status { margin-top: 12px; font-size: 14px; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>MP4 轉文字匯入</h1>
  <p>將影片教材轉成文字並匯入後端知識庫，供暗星檢索使用。</p>
  <div class="card">
    <input id="file" type="file" accept="video/mp4,video/*">
    <button id="start" disabled>開始轉文字並匯入</button>
    <div id="status">請選擇 MP4 檔案。後端完成後會顯示真實進度。</div>
  </div>
</div>
<script>
const fileEl = document.getElementById("file");
const start = document.getElementById("start");
const status = document.getElementById("status");
fileEl.onchange = () => {
  const f = fileEl.files[0];
  if (!f) { start.disabled = true; return; }
  start.disabled = false;
  status.textContent = "已選：" + f.name + "（" + Math.round(f.size/1048576) + " MB）\n後端匯入功能準備中。";
};
start.onclick = () => {
  status.textContent = "後端知識庫與轉錄端點尚未完成，此為入口頁。\n完成後將直接在此上傳並寫入 knowledge_base。";
};
</script>
</body>
</html>
