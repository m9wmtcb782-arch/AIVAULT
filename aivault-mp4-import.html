<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MP4 轉文字匯入 · AIVAULT</title>
<style>
body { font-family: -apple-system, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
.wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
.topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.back { background: #e2e8f0; color: #0f172a; border: 0; border-radius: 10px; padding: 8px 12px; font-size: 14px; text-decoration: none; }
h1 { font-size: 20px; margin: 0 0 6px; }
p.lead { color: #64748b; font-size: 14px; margin: 0 0 12px; }
.card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; margin-top: 12px; }
button { background: #1d4ed8; color: #fff; border: 0; border-radius: 10px; padding: 12px 16px; font-size: 15px; width: 100%; margin-top: 8px; }
button:disabled { background: #94a3b8; }
button.secondary { background: #0f766e; }
input[type=file] { margin: 10px 0; width: 100%; }
#status { margin-top: 12px; font-size: 14px; white-space: pre-wrap; color: #334155; }
.preview-label { margin-top: 16px; font-size: 13px; font-weight: 600; color: #475569; }
#preview {
  margin-top: 6px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 14px;
  font-size: 15px;
  line-height: 1.65;
  white-space: pre-wrap;
  max-height: 420px;
  overflow: auto;
  min-height: 120px;
  color: #0f172a;
}
#preview.empty { color: #94a3b8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="aivault-home.html">← 回 Home</a>
  </div>
  <h1>MP4 轉文字匯入</h1>
  <p class="lead">將影片教材轉成文字，預覽後可下載。單檔上限 18 MB。</p>
  <div class="card">
    <input id="file" type="file" accept="video/mp4,video/*">
    <button id="start" disabled>開始轉文字</button>
    <div id="status">請選擇 MP4 檔案（上限 18 MB）。</div>
    <div class="preview-label">文字預覽</div>
    <div id="preview" class="empty">轉換完成後，文字會顯示在這裡。</div>
    <button id="download" class="secondary" style="display:none;">下載文字檔 (.txt)</button>
  </div>
</div>
<script>
const SUPABASE_URL = "https://clcddygkaaqqtsbswgdf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsY2RkeWdrYWFxcXRzYnN3Z2RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzUwNjQsImV4cCI6MjEwMjMxMTA2NH0.kYg6h7n74CtbiIjNjZ2xxJj16SV42INZVzQ9dLNUfKE";
const ENDPOINT = SUPABASE_URL + "/functions/v1/mp4-to-knowledge";
const MAX_MB = 18;

const fileEl = document.getElementById("file");
const start = document.getElementById("start");
const status = document.getElementById("status");
const preview = document.getElementById("preview");
const downloadBtn = document.getElementById("download");
let currentText = "";
let currentName = "transcript";

function setPreview(text, isEmpty) {
  preview.textContent = text;
  preview.classList.toggle("empty", !!isEmpty);
}

fileEl.onchange = () => {
  const f = fileEl.files[0];
  if (!f) { start.disabled = true; return; }
  const mb = Math.round(f.size / 1048576);
  if (mb > MAX_MB) {
    start.disabled = true;
    status.textContent = "檔案 " + mb + " MB，超過 " + MAX_MB + " MB 上限。請壓縮後再試。";
    setPreview("檔案太大，無法上傳。", true);
    return;
  }
  start.disabled = false;
  currentName = f.name.replace(/\.[^.]+$/, "") || "transcript";
  status.textContent = "已選：" + f.name + "（" + mb + " MB）\n按開始轉文字。";
  setPreview("轉換完成後，文字會顯示在這裡。", true);
  downloadBtn.style.display = "none";
};

start.onclick = async () => {
  const f = fileEl.files[0];
  if (!f) return;
  start.disabled = true;
  status.textContent = "正在上傳並轉錄…";
  setPreview("正在處理，請稍候…", true);
  downloadBtn.style.display = "none";

  try {
    const form = new FormData();
    form.append("file", f);

    const res = await fetch(ENDPOINT, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "apikey": SUPABASE_ANON_KEY
      },
      body: form
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok || !data.ok) {
      const err = data.message || data.error || data.detail || ("後端回應 " + res.status);
      status.textContent = "轉錄失敗：" + err;
      setPreview("轉錄失敗。\n" + err, true);
      start.disabled = false;
      return;
    }

    currentText = data.transcript || "";
    if (!currentText) {
      status.textContent = "後端沒有回傳文字。";
      setPreview("沒有取得轉錄文字。", true);
      start.disabled = false;
      return;
    }

    setPreview(currentText, false);
    downloadBtn.style.display = "block";
    status.textContent = "轉錄完成（" + (data.characters || currentText.length) + " 字）。可預覽與下載。";
  } catch (err) {
    status.textContent = "連線失敗：" + (err.message || err);
    setPreview("無法連到後端。\n" + (err.message || err), true);
  }
  start.disabled = false;
};

downloadBtn.onclick = () => {
  if (!currentText) return;
  const blob = new Blob([currentText], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = currentName + "-文字.txt";
  a.click();
  URL.revokeObjectURL(a.href);
  status.textContent = "已下載 " + currentName + "-文字.txt";
};
</script>
</body>
</html>
