<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>角色</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body class="game-body">
  <div class="snow-layer"></div>
  <div class="app" id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/boot.js"></script>
  <script>
    (async () => {
      if (!(await FKAuth.requirePlayer())) return;
      const snap = await FKApi.snapshot();
      const p = snap.player;
      document.getElementById("app").innerHTML = `
        <div class="page-head"><a class="back" href="game-menu.html">← 返回</a><h2>角色</h2></div>
        ${FKUI.top(snap)}
        <div class="panel">
          <p>名稱 ${p.name}</p>
          <p>等級 ${p.level} · 經驗 ${p.exp || 0}</p>
          <p>戰力 ${FKUI.fmt(p.power)} · 城市 Lv.${snap.city.level}</p>
          <p>聯盟 ${p.alliance_id || "無"}</p>
        </div>${FKUI.nav("more")}
      `;
    })();
  </script>
</body>
</html>
