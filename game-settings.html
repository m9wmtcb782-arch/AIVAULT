<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>設定</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body class="game-body">
  <div class="snow-layer"></div>
  <div class="app" id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/boot.js"></script>
  <script src="js/compute.js"></script>
  <script>
    (async () => {
      if (!(await FKAuth.requirePlayer())) return;
      const snap = await FKApi.snapshot();
      const on = !!snap.player.compute_opt_in;
      document.getElementById("app").innerHTML = `
        <div class="page-head"><a class="back" href="game-world.html">← 返回</a><h2>設定</h2></div>
        <div class="panel">
          <label class="check"><input id="music" type="checkbox" ${FKAudio.isOn()?"checked":""}/> 音樂</label>
          <hr style="border-color:var(--stroke)"/>
          <h3>智慧核心</h3>
          <p class="tiny">預設關閉。不是挖礦，不能兌換 Coupons，可隨時停。</p>
          <label class="check"><input id="compute" type="checkbox" ${on?"checked":""}/> 啟用智慧核心</label>
          <p class="tiny" id="cstat"></p>
          <button class="btn secondary" id="out">登出</button>
        </div>${FKUI.nav("more")}
      `;
      document.getElementById("music").onchange = () => FKAudio.toggle();
      document.getElementById("compute").onchange = async (e) => {
        await FKApi.setCompute(e.target.checked);
        if (e.target.checked) FKCompute.start(); else FKCompute.stop();
        document.getElementById("cstat").textContent = e.target.checked ? "執行中" : "已停止";
      };
      if (on) { FKCompute.start(); document.getElementById("cstat").textContent = "執行中"; }
      document.getElementById("out").onclick = async () => { await FKApi.signOut(); location.href = "game-start.html"; };
    })();
  </script>
</body>
</html>
