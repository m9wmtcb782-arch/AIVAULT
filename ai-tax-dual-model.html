<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI天衡 · 雙模型案件分析</title>
<style>
body{font-family:system-ui,sans-serif;background:#0a1628;color:#d0e8ff;padding:16px;max-width:960px;margin:auto}
h1{font-size:1.2rem}h2{font-size:1rem;color:#00e5ff;margin-top:16px}
textarea{width:100%;min-height:100px;background:#050a14;color:#d0e8ff;border:1px solid #1a3a5c;border-radius:6px;padding:8px;font-size:0.9rem}
button{background:#0d2840;color:#d0e8ff;border:1px solid #1a3a5c;padding:8px 14px;border-radius:6px;cursor:pointer;margin:4px}
.panel{background:#0a1628;border:1px solid #1a3a5c;border-radius:8px;padding:10px;margin:8px 0}
.pass{color:#00ff88}.fail{color:#ff4466}.warn{color:#ffaa00}.muted{color:#6a8aaa}
pre{background:#050a14;padding:8px;border-radius:6px;overflow:auto;font-size:0.75rem;white-space:pre-wrap}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:0.7rem;background:#1a3a5c}
</style>
</head>
<body>
<h1>AI天衡 · Groq + Gemini 雙模型案件分析</h1>
<p class="warn">呼叫失敗或回應無實質分析時標示 MODEL_UNAVAILABLE。不冒充模型輸出。暗星：NOT_CONNECTED。</p>

<div class="panel">
  <h2>輸入稅務案件</h2>
  <textarea id="caseInput" placeholder="輸入模擬稅務案件"></textarea>
  <div>
    <label>Gateway 端點：<input id="gatewayUrl" style="width:70%;background:#050a14;color:#d0e8ff;border:1px solid #1a3a5c;padding:4px;border-radius:4px" placeholder="https://xxx.supabase.co/functions/v1/ai-gateway"></label>
  </div>
  <button onclick="analyze()">執行天衡分析</button>
  <button onclick="downloadReport()">下載報告 JSON</button>
</div>

<div id="out"></div>

<script>
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>')
    .replace(/"/g,'"').replace(/'/g,'&#39;');
}

const RULE_CHECKS = [
  {id:'income_diff', name:'所得差異', test: c => /\d{3,}/.test(c) && /差異|不符/.test(c)},
  {id:'expense_ratio', name:'費用比例', test: c => /費用.*異常|比例/.test(c)},
  {id:'dup_tx', name:'重複交易', test: c => /重複/.test(c)},
  {id:'missing_doc', name:'憑證缺漏', test: c => /缺|漏/.test(c)}
];

function ruleCheck(text) {
  return RULE_CHECKS.map(r => ({id:r.id, name:r.name, triggered: r.test(text)}));
}

const STRUCTURED_PROMPT = `請以稅務審查角度分析以下案件，必須用以下 JSON 格式回答（不要額外文字）：
{"facts":"事實認定","legal_basis":"法律依據","risk":"風險判斷","conclusion":"結論","evidence_gaps":"證據不足處","suggestions":"改善建議"}
案件：\n`;

function parseStructured(text) {
  if (!text || typeof text !== 'string') return null;
  const m = text.match(/\{[\s\S]*\}/);
  if (!m) return null;
  try {
    const o = JSON.parse(m[0]);
    const required = ['facts','legal_basis','risk','conclusion','evidence_gaps','suggestions'];
    if (!required.every(k => typeof o[k] === 'string' && o[k].trim().length > 0)) return null;
    return o;
  } catch { return null; }
}

async function callModel(gateway, provider, caseText) {
  const t0 = Date.now();
  if (!gateway) return {provider, status:'MODEL_UNAVAILABLE', reason:'no gateway url', ms:0, structured:null, raw:null};
  const model = provider === 'gemini' ? 'gemini-3.6-flash' : (provider === 'groq' ? 'openai/gpt-oss-120b' : undefined);
  const body = {
    message: STRUCTURED_PROMPT + caseText,
    provider: provider,
    model: model,
    capability: 'chat'
  };
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 25000);
    const res = await fetch(gateway, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body),
      signal: ctrl.signal
    });
    clearTimeout(timer);
    const ms = Date.now() - t0;
    if (!res.ok) return {provider, status:'MODEL_UNAVAILABLE', reason:'HTTP '+res.status, ms, structured:null, raw:null};
    let data;
    try { data = await res.json(); } catch { return {provider, status:'MODEL_UNAVAILABLE', reason:'invalid JSON', ms, structured:null, raw:null}; }
    const text = String(data.content || data.text || data.message || data.analysis || '').trim();
    if (!text || text.length < 20) return {provider, status:'MODEL_UNAVAILABLE', reason:'empty or short response', ms, structured:null, raw:text.slice(0,500)};
    const structured = parseStructured(text);
    if (!structured) return {provider, status:'MODEL_UNAVAILABLE', reason:'no structured analysis', ms, structured:null, raw:text.slice(0,1000)};
    return {provider, status:'OK', model: data.model || model || provider, ms, structured, raw:text.slice(0,1500)};
  } catch(e) {
    return {provider, status:'MODEL_UNAVAILABLE', reason: e.name==='AbortError'?'timeout':String(e.message||e), ms: Date.now()-t0, structured:null, raw:null};
  }
}

function crossReview(g, m) {
  if (g.status!=='OK' && m.status!=='OK') return {mode:'RULE_ONLY', consistent:[], conflicts:[], requiresReview:[]};
  if (g.status!=='OK' || m.status!=='OK') {
    const ok = g.status==='OK' ? g : m;
    return {mode:'SINGLE_MODEL', consistent:[ok.provider+' 單獨可用'], conflicts:[], requiresReview:['另一模型不可用 → REQUIRES_REVIEW']};
  }
  const fields = ['facts','legal_basis','risk','conclusion','evidence_gaps','suggestions'];
  const consistent = [];
  const conflicts = [];
  fields.forEach(f => {
    const a = (g.structured[f]||'').trim();
    const b = (m.structured[f]||'').trim();
    if (a && b && a === b) consistent.push(f+'：一致');
    else if (a && b && a !== b) conflicts.push(f+'：Groq=「'+a.slice(0,40)+'」 / Gemini=「'+b.slice(0,40)+'」');
  });
  return {
    mode:'DUAL',
    consistent,
    conflicts,
    requiresReview: conflicts.map(c => c + ' → REQUIRES_REVIEW')
  };
}

let lastReport = null;

async function analyze() {
  const caseText = document.getElementById('caseInput').value.trim();
  const gateway = document.getElementById('gatewayUrl').value.trim();
  if (!caseText) { alert('請輸入案件'); return; }

  const rules = ruleCheck(caseText);
  const [groq, gemini] = await Promise.all([
    callModel(gateway, 'groq', caseText),
    callModel(gateway, 'gemini', caseText)
  ]);
  const review = crossReview(groq, gemini);

  lastReport = {
    ts: new Date().toISOString(),
    case: caseText,
    tianheng: { rules, groq, gemini, crossReview: review },
    darkstar: { status: 'NOT_CONNECTED', reason: '本頁未呼叫暗星' },
    mode: (groq.status!=='OK' && gemini.status!=='OK') ? 'RULE_ONLY' : review.mode
  };

  let html = '<h2>天衡規則檢查</h2><ul>';
  rules.forEach(r => html += `<li class="${r.triggered?'warn':'muted'}">${esc(r.name)}：${r.triggered?'觸發':'未觸發'}</li>`);
  html += '</ul>';

  function renderModel(name, m) {
    let h = `<h2>${esc(name)}</h2>`;
    h += `<p><span class="badge ${m.status==='OK'?'pass':'fail'}">${esc(m.status)}</span> ${m.ms||0}ms ${esc(m.reason||'')}</p>`;
    if (m.structured) {
      h += '<pre>'+esc(JSON.stringify(m.structured,null,2))+'</pre>';
    } else {
      h += '<pre class="muted">(無結構化分析)</pre>';
    }
    return h;
  }
  html += renderModel('Groq', groq);
  html += renderModel('Gemini', gemini);

  html += '<h2>交叉審查（結構化比對）</h2>';
  html += `<p>模式：<span class="badge">${esc(review.mode)}</span></p>`;
  html += `<p>一致：${review.consistent.map(esc).join('<br>')||'無'}</p>`;
  html += `<p class="warn">矛盾：${review.conflicts.map(esc).join('<br>')||'無'}</p>`;
  html += `<p class="warn">REQUIRES_REVIEW：${review.requiresReview.map(esc).join('<br>')||'無'}</p>`;

  html += '<h2>暗星</h2><p class="muted">NOT_CONNECTED</p>';
  html += '<h2>報告 JSON</h2><pre>'+esc(JSON.stringify(lastReport,null,2))+'</pre>';
  document.getElementById('out').innerHTML = html;
}

function downloadReport() {
  if (!lastReport) { alert('請先執行分析'); return; }
  const blob = new Blob([JSON.stringify(lastReport,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tianheng-report-'+Date.now()+'.json';
  a.click();
}
</script>
</body>
</html>
