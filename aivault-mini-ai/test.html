<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AIVAULT Mini AI Test</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#142033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #dfe5ee;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 20px #0000000a}h1{font-size:25px;margin:0 0 6px}.muted{color:#66758a;font-size:13px}.status{font-weight:800;margin:12px 0;padding:12px;border-radius:12px;background:#eef2f7}.ok{background:#e9f8ef;color:#13743b}.warn{background:#fff4dd;color:#8a5a00}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv{display:grid;grid-template-columns:38% 62%;gap:8px;font-size:14px}.kv span:nth-child(odd){color:#66758a}button{width:100%;min-height:52px;border:0;border-radius:14px;background:#111827;color:#fff;font-weight:800;font-size:15px}pre{white-space:pre-wrap;word-break:break-word;background:#10151d;color:#d8e2ef;border-radius:12px;padding:12px;font-size:12px;overflow:auto}
</style>
</head>
<body><main class="wrap">
<div class="card"><h1>📱 AIVAULT Mini AI</h1><div class="muted">手機端微型 AI 節點 v0.1</div><div id="status" class="status">初始化中…</div></div>
<div class="card"><h2>裝置能力</h2><div id="caps" class="kv"></div></div>
<div class="card"><h2>目前原則</h2><div class="muted">本測試頁不下載模型、不呼叫 API、不寫 Supabase、不虛構 AI 結果。</div><div class="row" style="margin-top:12px"><button id="refresh">重新偵測</button><button id="report">查看 Node Report</button></div></div>
<div class="card"><h2>Runtime</h2><pre id="out">尚未執行</pre></div>
<script src="index.js"></script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  let ai;
  function render(){
    ai=new AIVAULTMiniAI.AIVAULTMiniAI({});
    const c=ai.capabilities();
    $('caps').innerHTML=[
      ['Node ID',c.node_id],['Runtime',c.runtime],['WebGPU',c.webgpu?'可用':'不可用'],['WebNN',c.webnn?'可用':'不可用'],['CPU','可用'],['Local inference',c.local_inference?'READY':'尚未安裝 Runtime']
    ].map(x=>'<span>'+x[0]+'</span><b>'+x[1]+'</b>').join('');
    $('status').className='status '+(c.runtime==='none'?'warn':'ok');
    $('status').textContent=c.runtime==='none'?'🟡 基礎模組已載入；尚未安裝本地 AI Runtime / 模型':'🟢 本地 Runtime 已偵測';
    $('out').textContent=JSON.stringify(c,null,2);
  }
  $('refresh').onclick=render;
  $('report').onclick=function(){render();$('out').textContent=JSON.stringify(ai.nodeReport(),null,2)};
  render();
})();
</script>
</main></body></html>
