<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AIVAULT 3D AI Companion</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050711;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}#app{height:100%;position:relative;background:radial-gradient(circle at 50% 35%,#1a2748,#090c16 48%,#03040a)}canvas{position:absolute;inset:0;width:100%;height:100%}.top{position:absolute;z-index:2;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 14px) 16px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#050711dd,transparent)}.brand{font-weight:700}.brand small{display:block;font-size:10px;opacity:.45;margin-top:2px}.status{font-size:11px;border:1px solid #ffffff22;background:#ffffff0d;padding:7px 10px;border-radius:20px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#49e08a;box-shadow:0 0 9px #49e08a;margin-right:6px}.hint{position:absolute;z-index:2;top:calc(env(safe-area-inset-top) + 68px);width:100%;text-align:center;font-size:10px;opacity:.35}.panel{position:absolute;z-index:3;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px)}.chat{max-height:27vh;overflow:auto;display:flex;flex-direction:column;gap:7px;margin-bottom:9px}.bubble{max-width:82%;padding:9px 12px;border-radius:15px;background:#ffffff12;border:1px solid #ffffff14;backdrop-filter:blur(16px);font-size:13px;line-height:1.45}.ai{align-self:flex-start;border-bottom-left-radius:5px}.me{align-self:flex-end;background:#637cff28;border-bottom-right-radius:5px}.bar{display:flex;gap:7px;padding:7px;border-radius:23px;background:#090d18dd;border:1px solid #ffffff18;backdrop-filter:blur(20px)}input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:#fff;padding:8px;font-size:14px}button{width:40px;height:40px;border-radius:50%;border:1px solid #ffffff18;background:#ffffff10;color:#fff;font-size:17px}button.send{background:#6078ff;border:0}button.active{background:#e95454}#loading{position:absolute;z-index:9;inset:0;display:grid;place-items:center;background:#050711;transition:.5s}.hide{opacity:0;pointer-events:none}.load{text-align:center}.load b{font-size:20px}.load div{font-size:11px;opacity:.45;margin-top:5px}</style></head><body><div id="app"><div id="loading"><div class="load"><b>AIVAULT</b><div>3D AI Companion</div></div></div><canvas id="c"></canvas><div class="top"><div class="brand">3D AI Companion<small>Independent Product</small></div><div class="status"><span class="dot"></span>ONLINE</div></div><div class="hint">拖曳旋轉 · 雙指縮放</div><div class="panel"><div id="chat" class="chat"><div class="bubble ai">你好，我是你的 3D AI Companion。你可以直接和我聊天。</div></div><div class="bar"><button id="mic">🎙</button><input id="input" placeholder="輸入訊息…"><button class="send" id="send">➤</button></div></div></div><script type="module">import*as THREE from'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';import{OrbitControls}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';const c=document.querySelector('#c'),r=new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);r.outputColorSpace=THREE.SRGBColorSpace;const s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);cam.position.set(0,1.3,5.7);const ctl=new OrbitControls(cam,c);ctl.enableDamping=true;ctl.enablePan=false;ctl.minDistance=3.6;ctl.maxDistance=7;ctl.target.set(0,1.15,0);s.add(new THREE.AmbientLight(0x9eb5ff,2));let d=new THREE.DirectionalLight(0xffffff,3);d.position.set(2,4,4);s.add(d);let p=new THREE.PointLight(0x627bff,18,8);p.position.set(-2,2,2);s.add(p);const g=new THREE.Group();s.add(g);const skin=new THREE.MeshStandardMaterial({color:0xc98f78,roughness:.72}),hair=new THREE.MeshStandardMaterial({color:0x151821,roughness:.35}),suit=new THREE.MeshStandardMaterial({color:0x202b49,roughness:.42,metalness:.2}),glow=new THREE.MeshStandardMaterial({color:0x8ba0ff,emissive:0x334bff,emissiveIntensity:1.8});let torso=new THREE.Mesh(new THREE.SphereGeometry(1.2,32,24),suit);torso.scale.set(1,1.05,.62);torso.position.y=.35;g.add(torso);let neck=new THREE.Mesh(new THREE.CylinderGeometry(.28,.34,.55,32),skin);neck.position.y=1.25;g.add(neck);let head=new THREE.Mesh(new THREE.SphereGeometry(.78,48,32),skin);head.scale.set(.92,1.08,.86);head.position.y=2.05;g.add(head);let hh=new THREE.Mesh(new THREE.SphereGeometry(.81,48,24,0,Math.PI*2,0,Math.PI*.58),hair);hh.scale.set(1.01,1.16,.98);hh.position.set(0,2.28,-.02);g.add(hh);function eye(x){let e=new THREE.Mesh(new THREE.SphereGeometry(.095,20,12),new THREE.MeshStandardMaterial({color:0x11141d}));e.position.set(x,2.1,.73);g.add(e);let q=new THREE.Mesh(new THREE.SphereGeometry(.027,12,8),glow);q.position.set(x,2.1,.82);g.add(q)}eye(-.27);eye(.27);let nose=new THREE.Mesh(new THREE.SphereGeometry(.08,16,12),skin);nose.scale.set(.7,1.5,.7);nose.position.set(0,1.94,.76);g.add(nose);let mouth=new THREE.Mesh(new THREE.TorusGeometry(.13,.018,8,24,Math.PI),new THREE.MeshStandardMaterial({color:0x713845}));mouth.rotation.x=Math.PI/2;mouth.position.set(0,1.82,.77);g.add(mouth);let ring=new THREE.Mesh(new THREE.RingGeometry(1.2,1.23,64),new THREE.MeshBasicMaterial({color:0x627bff,transparent:true,opacity:.55,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=-.83;s.add(ring);let t=0;function loop(){requestAnimationFrame(loop);t+=.016;g.position.y=Math.sin(t*1.3)*.035;head.rotation.y=Math.sin(t*.55)*.035;head.rotation.z=Math.sin(t*.7)*.012;ring.scale.setScalar(1+Math.sin(t*1.8)*.035);ctl.update();r.render(s,cam)}loop();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});setTimeout(()=>loading.classList.add('hide'),450);const chat=document.querySelector('#chat'),input=document.querySelector('#input');function add(x,me){let b=document.createElement('div');b.className='bubble '+(me?'me':'ai');b.textContent=x;chat.appendChild(b);chat.scrollTop=chat.scrollHeight}function send(){let v=input.value.trim();if(!v)return;add(v,true);input.value='';setTimeout(()=>add('我已收到。這個版本已預留 AI Gateway 接口，下一步可直接接入真正的 AI 對話。'),350)}document.querySelector('#send').onclick=send;input.onkeydown=e=>{if(e.key==='Enter')send()};document.querySelector('#mic').onclick=()=>{let B=document.querySelector('#mic');if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window)){add('目前瀏覽器不支援語音辨識。');return}let R=window.SpeechRecognition||window.webkitSpeechRecognition,x=new R;x.lang='zh-TW';x.maxAlternatives=1;B.classList.add('active');x.start();x.onresult=e=>{input.value=e.results[0][0].transcript;send()};x.onend=()=>B.classList.remove('active')};</script></body></html>
