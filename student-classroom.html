<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIVAULT 學生課堂</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
body{font-size:22px}
#app{max-width:1000px;margin:auto;padding:22px}
header{text-align:center;padding:12px 0 24px;border-bottom:1px solid #e2e8f0}
h1{font-size:clamp(30px,8vw,44px);margin:4px 0 8px}
#status{color:#667085;font-size:20px;min-height:30px}
#join{max-width:520px;margin:40px auto 0;text-align:center}
#code{width:100%;font-size:48px;letter-spacing:14px;text-align:center;padding:14px 12px;border:2px solid #7567ff;border-radius:14px;outline:none}
#connect{width:100%;margin-top:14px;padding:15px;border:0;border-radius:12px;background:#7567ff;color:#fff;font-size:28px;font-weight:800}
#lesson{display:none;margin-top:24px}
#room{font-size:22px;color:#667085;text-align:center;margin-bottom:18px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
#leaveClass{padding:8px 14px;border:1px solid #d5dbe5;border-radius:10px;background:#fff;color:#172033;font-size:18px;font-weight:700}
#pageInfo{font-size:20px;color:#667085;margin-bottom:12px}
#content{font-size:30px;line-height:2;white-space:pre-wrap;word-break:break-word}
#videoBox{margin-top:20px}
#darkStarResearch{display:none;margin-top:20px;padding:16px;border:1px solid #dfe4ec;border-radius:12px;background:#fff}
#darkStarResearchTitle{font-weight:800;margin-bottom:8px}
#darkStarResearchBody{white-space:pre-wrap;line-height:1.8}
#darkStarResearchSources{margin-top:12px;padding-top:10px;border-top:1px solid #eee;font-size:16px;color:#667085}

#audioPanel{display:none;margin:0 0 18px;padding:12px 16px;border:1px solid #dfe4ec;border-radius:12px;background:#f7f9fc;text-align:center}
#audioToggle{padding:10px 18px;border:0;border-radius:10px;background:#7567ff;color:#fff;font-size:22px;font-weight:800}
#audioStatus{font-size:18px;color:#667085;margin-top:7px}
video,iframe{display:block;width:100%;max-height:620px;margin:18px 0;border:0;border-radius:12px;background:#000}
.msg{padding:18px;border-radius:12px;background:#f7f9fc;color:#475467}
.err{color:#b42318;background:#fff3f3}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="app">
<header>
<h1>✦ AIVAULT 課堂教室</h1>
<div id="status"></div>
</header>
<section id="join">
<input id="code" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="0000" aria-label="四位數教室入口">
<button id="connect">進入這間教室</button>
<div class="msg" style="margin-top:16px">學生只能看到老師目前正在上的本堂課內容，不提供電子書書架、電子書搜尋或學生翻書功能。</div>
</section>
<section id="lesson">
<div id="room"><span id="roomName"></span><button id="leaveClass" type="button">🚪 退出教室</button></div>
<div id="audioPanel"><button id="audioToggle" type="button">🔊 接收老師聲音</button><div id="audioStatus">課堂聲音：開啟</div><audio id="classroomAudio" autoplay playsinline></audio></div>
<div id="pageInfo"></div>
<div id="content" class="msg"></div>
<div id="videoBox"></div><section id="darkStarResearch"><div id="darkStarResearchTitle">✦ 暗星教學研究</div><div id="darkStarResearchBody"></div><div id="darkStarResearchSources"></div></section>
</section>
</div>
<script>
const SUPABASE_URL='https://clcddygkaaqqtsbswgdf.supabase.co';
const KEY='sb_publishable_1D05YGthBrNGg-5L92TLCw_GiLnInBu';
const API=SUPABASE_URL+'/functions/v1/dark-star-ebook-ingest';
const $=id=>document.getElementById(id);
let classroomCode='',channelToken='',channel=null,supabaseClient=null,total=0,page=1;
let audioPc=null,audioRemoteStream=null,audioEnabled=true,audioPlaybackStarted=false,audioPeerId=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random());
let pendingIce=[];
let audioJoinTimer=null;

function setStatus(t,error=false){$('status').textContent=t;$('status').classList.toggle('err',error);}
function esc(s){return String(s??'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));}
function videoHtml(v){
 const provider=String(v?.provider||'').toLowerCase(),u=String(v?.url||''),id=String(v?.video_id||''),t=esc(v?.title||'教學影片');
 if(provider==='youtube'&&id)return '<iframe src="https://www.youtube.com/embed/'+encodeURIComponent(id)+'" title="'+t+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';
 if(provider==='vimeo'&&id)return '<iframe src="https://player.vimeo.com/video/'+encodeURIComponent(id)+'" title="'+t+'" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>';
 if(provider==='direct'&&u)return '<video controls playsinline preload="metadata" src="'+esc(u)+'"></video>';
 return '';
}
async function sendSignal(event,payload){if(!channel)return;try{await channel.send({type:'broadcast',event,payload});}catch(e){console.warn('student audio signal',e);}}
function setAudioStatus(t){$('audioStatus').textContent=t;}
async function startStudentAudio(){
  if(!channel)return;
  $('classroomAudio').muted=!audioEnabled;$('audioToggle').textContent=audioEnabled?'🔊 課堂聲音':'🔇 課堂靜音';setAudioStatus(audioEnabled?'正在連接老師即時聲音…':'課堂聲音：已靜音');
  await sendSignal('audio_join',{peer_id:audioPeerId});
  clearInterval(audioJoinTimer);
  audioJoinTimer=setInterval(()=>{if(!channel)return;if(!audioPc||!['connected','completed'].includes(audioPc.connectionState))sendSignal('audio_join',{peer_id:audioPeerId}).catch(()=>{});else clearInterval(audioJoinTimer)},1800);
}
function stopStudentAudio(){clearInterval(audioJoinTimer);audioJoinTimer=null;if(audioPc){try{audioPc.close()}catch{}audioPc=null;}audioRemoteStream=null;$('classroomAudio').srcObject=null;audioPlaybackStarted=false;pendingIce=[];}
async function handleAudioOffer(payload){
  if(!payload||payload.to!==audioPeerId||!payload.description)return;
  stopStudentAudio();
  audioPc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});
  audioRemoteStream=new MediaStream();$('classroomAudio').srcObject=audioRemoteStream;$('classroomAudio').muted=!audioEnabled;
  audioPc.ontrack=e=>{e.streams[0]?.getTracks().forEach(t=>{if(!audioRemoteStream.getTracks().some(x=>x.id===t.id))audioRemoteStream.addTrack(t)});if(audioEnabled){const p=$('classroomAudio').play();if(p){p.then(()=>{audioPlaybackStarted=true;$('audioToggle').textContent='🔊 老師聲音已啟用';setAudioStatus('課堂聲音：已連線');}).catch(()=>{audioPlaybackStarted=false;$('audioToggle').textContent='🔊 啟用老師聲音';setAudioStatus('請按「🔊 啟用老師聲音」播放老師聲音。');});}}};
  audioPc.onicecandidate=e=>{if(e.candidate)sendSignal('audio_ice',{to:'teacher',from:'student',peer_id:audioPeerId,candidate:e.candidate});};
  audioPc.onconnectionstatechange=()=>{const s=audioPc?.connectionState;if(s==='connected'){clearInterval(audioJoinTimer);audioJoinTimer=null;setAudioStatus(audioEnabled?'課堂聲音：已連線':'課堂聲音：已靜音');}else if(['failed','disconnected','closed'].includes(s)){setAudioStatus('老師聲音連線中斷，正在重新連接…');if(channel)startStudentAudio().catch(()=>{});}};
  try{await audioPc.setRemoteDescription(payload.description);for(const c of pendingIce){try{await audioPc.addIceCandidate(c)}catch{}}pendingIce=[];const answer=await audioPc.createAnswer();await audioPc.setLocalDescription(answer);await sendSignal('audio_answer',{to:'teacher',from:'student',peer_id:audioPeerId,description:audioPc.localDescription});}catch(e){console.warn('student audio offer',e);setAudioStatus('課堂聲音連線失敗。');}
}
async function handleAudioIce(payload){if(!payload||payload.to!==audioPeerId||!payload.candidate)return;if(audioPc?.remoteDescription){try{await audioPc.addIceCandidate(payload.candidate)}catch(e){console.warn(e)}}else pendingIce.push(payload.candidate);}
let darkStarStudentUtterance=null,darkStarStudentVoiceId='';
function handleDarkStarVoice(v){
  if(!v||!v.action)return;
  if(v.action==='stop'){
    try{speechSynthesis.cancel()}catch{}
    darkStarStudentUtterance=null;
    $('audioStatus').textContent='暗星語音：已停止';
    return;
  }
  if(v.action==='pause'){
    try{if(speechSynthesis.speaking)speechSynthesis.pause()}catch{}
    $('audioStatus').textContent='暗星語音：已暫停';
    return;
  }
  if(v.action!=='speak'||!v.text)return;
  if(v.id&&v.id===darkStarStudentVoiceId)return;
  darkStarStudentVoiceId=String(v.id||Date.now());
  try{speechSynthesis.cancel()}catch{}
  const u=new SpeechSynthesisUtterance(String(v.text));
  u.lang='zh-TW';u.rate=1;u.pitch=1;u.volume=1;
  const voices=speechSynthesis.getVoices?.()||[];
  const zh=voices.find(x=>/^zh[-_]TW/i.test(x.lang))||voices.find(x=>/^zh/i.test(x.lang));
  if(zh)u.voice=zh;
  darkStarStudentUtterance=u;
  u.onstart=()=>{setAudioStatus('✦ 暗星正在解釋…');};
  u.onend=()=>{darkStarStudentUtterance=null;setAudioStatus('課堂聲音：已連線');};
  u.onerror=()=>{darkStarStudentUtterance=null;setAudioStatus('暗星語音播放失敗，請點「🔊 啟用老師聲音」後再試。');};
  speechSynthesis.speak(u);
}
function handleClassroomReading(reading){
 if(!reading||reading.action!=='speak'||!reading.text||!audioEnabled)return;
 const id=String(reading.id||'');
 if(id&&id===darkStarStudentVoiceId)return;
 darkStarStudentVoiceId=id||darkStarStudentVoiceId;
 try{speechSynthesis.cancel()}catch{}
 const u=new SpeechSynthesisUtterance(String(reading.text));
 u.lang='zh-TW';u.rate=1;u.pitch=1;u.volume=1;
 const voices=speechSynthesis.getVoices?.()||[];
 const zh=voices.find(x=>/^zh[-_]TW/i.test(x.lang))||voices.find(x=>/^zh/i.test(x.lang));
 if(zh)u.voice=zh;
 darkStarStudentUtterance=u;
 u.onstart=()=>setAudioStatus('📖 課堂朗讀中…');
 u.onend=()=>{darkStarStudentUtterance=null;setAudioStatus(audioEnabled?'課堂聲音：已連線':'課堂聲音：已靜音');};
 u.onerror=()=>{darkStarStudentUtterance=null;setAudioStatus(audioEnabled?'課堂朗讀播放失敗':'課堂聲音：已靜音');};
 speechSynthesis.speak(u);
}
function renderState(state){
 if(!state||typeof state!=='object')return;
 page=Number(state.page)||1;total=Number(state.total)||0;
 const isProject=state.type==='ppt-project';
 $('pageInfo').textContent=(isProject?'📊 '+(state.project_title||'PPT 專題報告')+'｜':'')+'第 '+page+(total?' / '+total:'')+' 頁';
 if(isProject&&state.project_page_title){ $('contentTitle').textContent=String(state.project_page_title||''); $('contentTitle').style.display='block'; } else if($('contentTitle')) { $('contentTitle').style.display='none'; }
 $('content').textContent=String(state.content||'');
 $('content').style.fontSize=isProject?'26px':'30px';
 $('content').style.lineHeight=isProject?'1.9':'2';
 const videos=Array.isArray(state.videos)?state.videos:[];
 $('videoBox').innerHTML=videos.map(videoHtml).join('');
 $('videoBox').style.display=$('videoBox').innerHTML?'block':'none';
 const research=state.research;
 if(research&&research.answer){
   $('darkStarResearch').style.display='block';
   $('darkStarResearchBody').textContent=String(research.answer||'');
   $('darkStarResearchBody').style.color=String(research.color||'#2563eb');
   const sources=Array.isArray(research.sources)?research.sources:[];
   $('darkStarResearchSources').innerHTML=sources.length
     ? '<b>資料來源</b><br>'+sources.map(s=>'<div style="margin-top:5px">'+esc(s.title||s.url||'來源')+(s.url?' — <a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.url)+'</a>':'')+'</div>').join('')
     : '';
 }else{
   $('darkStarResearch').style.display='none';
   $('darkStarResearchBody').textContent='';
   $('darkStarResearchSources').innerHTML='';
 }
 window.scrollTo({top:0,behavior:'smooth'});
}
async function api(payload){
 const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify(payload)});
 const raw=await r.text();let d={};try{d=raw?JSON.parse(raw):{}}catch{}
 if(!r.ok)throw Error(d.error||d.message||('課堂服務 HTTP '+r.status));
 return d;
}
async function connect(){
 const code=$('code').value.replace(/D/g,'').slice(0,4);$('code').value=code;
 if(!/^\d{4}$/.test(code)){setStatus('請輸入完整 4 位數教室入口。',true);return;}
 if(channel&&supabaseClient){await supabaseClient.removeChannel(channel);channel=null;}
 classroomCode=code;setStatus('正在尋找教室 '+code+'…');
 try{
  const d=await api({action:'classroom_resolve',code});
  const c=d.classroom;if(!c?.channel_token)throw Error('找不到這間教室');
  channelToken=String(c.channel_token);
  const state=c.current_state||{};
  $('join').style.display='none';$('lesson').style.display='block';$('roomName').textContent='教室 '+classroomCode;
  if(state&&state.content)renderState(state);
  if(!window.supabase?.createClient)throw Error('即時課堂元件尚未載入，請重新整理學生頁面。');
  supabaseClient=window.supabase.createClient(SUPABASE_URL,KEY);
  channel=supabaseClient.channel('student-classroom:'+channelToken,{config:{broadcast:{self:false},presence:{key:'student-'+(crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random())}}})
    .on('broadcast',{event:'classroom_state'},({payload})=>{
      if(!payload)return;
      renderState(payload);
      handleClassroomReading(payload.reading);
      handleDarkStarVoice(payload.darkstar_voice);
      setStatus('已連線教室 '+classroomCode+'，老師正在上課。');
    })
    .on('broadcast',{event:'audio_offer'},({payload})=>handleAudioOffer(payload))
    .on('broadcast',{event:'audio_ice'},({payload})=>handleAudioIce(payload))
    .subscribe(status=>{
      if(status==='SUBSCRIBED'){
        channel.track({role:'student',online_at:new Date().toISOString()}).catch(e=>console.warn('student presence track',e));
        $('audioPanel').style.display='block';
        startStudentAudio().catch(e=>setAudioStatus(e.message||'等待老師音訊…'));
        setStatus(state&&state.content?'已連線教室 '+classroomCode+'，內容會隨老師同步。':'已連線教室 '+classroomCode+'，等待老師上課內容…');
      }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){
        setStatus('教室連線失敗，請重新輸入 4 位數入口。',true);
      }
    });
 }catch(e){
  $('lesson').style.display='none';$('join').style.display='block';
  setStatus((e.message==='CLASSROOM_NOT_FOUND'||e.message==='找不到這間教室')?'找不到教室 '+code+'。請確認老師提供的 4 位數入口。':'進入教室失敗：'+(e.message||e),true);
 }
}
async function leaveClassroom(){
  try{speechSynthesis.cancel()}catch{}
  darkStarStudentUtterance=null;
  stopStudentAudio();
  if(channel&&supabaseClient){try{await supabaseClient.removeChannel(channel)}catch{}}
  channel=null;channelToken='';classroomCode='';total=0;page=1;
  $('classroomAudio').muted=true;
  $('audioPanel').style.display='none';
  $('content').textContent='';
  $('videoBox').innerHTML='';
  $('pageInfo').textContent='';
  $('roomName').textContent='';
  $('code').value='';
  $('lesson').style.display='none';
  $('join').style.display='block';
  setStatus('已退出教室。請輸入老師提供的 4 位數教室入口。');
  $('code').focus();
}
$('connect').onclick=connect;
$('leaveClass').onclick=leaveClassroom;
(function initSharedClassroom(){
  try{
    const sharedCode=new URLSearchParams(location.search).get('code')||'';
    if(/^\d{4}$/.test(sharedCode)){
      $('code').value=sharedCode;
      setStatus('已讀取老師分享的教室 '+sharedCode+'，正在進入…');
      setTimeout(()=>connect(),120);
    }
  }catch(e){console.warn('shared classroom code',e);}
})();
$('audioToggle').onclick=async()=>{if(audioEnabled){audioEnabled=false;$('classroomAudio').muted=true;$('audioToggle').textContent='🔇 課堂靜音';try{speechSynthesis.cancel()}catch{}darkStarStudentUtterance=null;setAudioStatus('課堂聲音：已靜音（老師＋暗星＋課堂朗讀）');return;}audioEnabled=true;$('classroomAudio').muted=false;$('audioToggle').textContent='🔊 課堂聲音';try{await $('classroomAudio').play();audioPlaybackStarted=true;setAudioStatus('課堂聲音：已啟用');}catch{setAudioStatus('瀏覽器仍未允許播放，請再按一次。');}if(!audioPc||!['connected','completed'].includes(audioPc.connectionState))await startStudentAudio();};
$('code').addEventListener('input',()=>{const v=$('code').value.replace(/D/g,'').slice(0,4);$('code').value=v;if(v.length===4)connect();});
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')connect();});

/* Shared classroom link: student-classroom.html?code=1234 */
const sharedClassroomCode=new URLSearchParams(location.search).get('code');
if(/^\d{4}$/.test(String(sharedClassroomCode||''))){
  $('code').value=String(sharedClassroomCode);
  setStatus('正在進入教室 '+sharedClassroomCode+'…');
  setTimeout(()=>connect(),0);
}
</script>
<script src="classroom-handwriting.js?v=20260929-01"></script>
</body>
</html>
