<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT 即時語音獨立測試</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;display:flex;justify-content:center;min-height:100vh}.box{width:min(92vw,560px);padding:60px 0}.title{font-size:24px;font-weight:700;text-align:center}.sub{text-align:center;color:#777;margin:10px 0 34px}.orb{width:120px;height:120px;border-radius:50%;background:#0a84ff;margin:0 auto 24px;display:flex;align-items:center;justify-content:center}.bars{height:40px;display:flex;gap:5px;align-items:center}.bars i{display:block;width:4px;height:18px;border-radius:4px;background:#fff;animation:w 1s ease-in-out infinite}.bars i:nth-child(2){animation-delay:.12s}.bars i:nth-child(3){animation-delay:.24s}.bars i:nth-child(4){animation-delay:.36s}@keyframes w{50%{height:36px}}button{display:block;margin:auto;border:0;border-radius:24px;background:#0a84ff;color:#fff;padding:13px 25px;font-size:16px}button:disabled{opacity:.55}.status{text-align:center;font-size:18px;margin:20px 0 5px}.hint{text-align:center;color:#777;font-size:13px}.log{margin-top:25px;padding:14px;border:1px solid #eee;border-radius:14px;background:#fafafa;min-height:130px;max-height:260px;overflow:auto;white-space:pre-wrap;font:12px ui-monospace,monospace}.trans{margin-top:18px;border-top:1px solid #eee}.turn{padding:10px 0;border-bottom:1px solid #eee}</style></head><body><main class="box"><div class="title">AIVAULT 即時語音獨立測試</div><div class="sub">只測 Live Voice｜不載入 Technical Dark Star</div><div class="orb"><span class="bars"><i></i><i></i><i></i><i></i></span></div><button id="go">開始即時語音</button><div id="status" class="status">尚未開始</div><div class="hint">請允許麥克風，然後直接說話</div><div id="trans" class="trans"></div><pre id="log" class="log"></pre></main><script>
const FN='https://clcddygkaaqqtsbswgdf.supabase.co/functions/v1/technical-dark-star-voice-session';let v=null,seq=0,pendingUser='',pendingAI='',audioOut=null,nextTime=0;
const $=x=>document.getElementById(x),log=x=>{$('log').textContent+=x+'\n';$('log').scrollTop=$('log').scrollHeight},status=x=>$('status').textContent=x;
function pcm(f){const b=new ArrayBuffer(f.length*2),d=new DataView(b);for(let i=0;i<f.length;i++){let x=Math.max(-1,Math.min(1,f[i]));d.setInt16(i*2,x<0?x*32768:x*32767,true)}return new Uint8Array(b)}
function b64(a){let s='';for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode(...a.subarray(i,i+0x8000));return btoa(s)}
function down(f,from,to){if(from===to)return f;const r=from/to,n=Math.ceil(f.length/r),o=new Float32Array(n);for(let i=0;i<n;i++){let a=Math.floor(i*r),b=Math.min(f.length,Math.floor((i+1)*r)),sum=0;for(let j=a;j<b;j++)sum+=f[j];o[i]=b>a?sum/(b-a):0}return o}
function add(role,text){if(!text)return;const d=document.createElement('div');d.className='turn';d.textContent=(role==='user'?'你：':'AI：')+text;$('trans').appendChild(d)}
async function api(body){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const t=await r.text();let j;try{j=JSON.parse(t)}catch{j={raw:t}}log(body.action?'API '+body.action+' HTTP '+r.status:'TOKEN HTTP '+r.status);if(!r.ok)throw Error(j.error||j.raw||('HTTP '+r.status));return j}
async function turn(session,role,content){if(!content)return;try{await api({action:'turn',session_id:session,sequence_no:++seq,role,content})}catch(e){log('TURN SAVE ERROR '+e.message)}}
async function start(){if(v)return;$('go').disabled=true;pendingUser='';pendingAI='';seq=0;status('取得 Gemini Live 臨時權杖…');try{const tj=await api({voice_name:'Kore'});log('TOKEN OK model='+tj.model);const token=tj.token||tj.access_token;if(!token)throw Error('後端沒有提供 Live token');status('建立測試 Session…');const sj=await api({action:'start',voice_profile:'Kore'});const session=sj.session_key||sj.session?.session_key||sj.session?.id;if(!session)throw Error('後端沒有提供 session_key');log('SESSION OK '+session);const ws=new WebSocket((tj.websocket||'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained')+'?access_token='+encodeURIComponent(token));const ac=new AudioContext({sampleRate:16000});await ac.resume();v={ws,ac,session,stream:null,src:null,proc:null};ws.onopen=()=>{log('WS OPEN');ws.send(JSON.stringify({setup:{model:tj.model||'models/gemini-3.1-flash-live-preview',responseModalities:['AUDIO'],inputAudioTranscription:{},outputAudioTranscription:{},speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:'Kore'}}},thinkingConfig:{thinkingLevel:'minimal'},systemInstruction:{parts:[{text:'使用繁體中文，自然、簡短、像真人對話。不要自我介紹，不要提及模型或內部系統。'}]}}}));};ws.onmessage=async e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.setupComplete){status('正在聆聽…');log('SETUP COMPLETE');await mic();return}if(m.error){status('Gemini Live 錯誤');log('SERVER ERROR '+JSON.stringify(m.error));return}const c=m.serverContent;if(!c)return;if(c.inputTranscription?.text)pendingUser+=c.inputTranscription.text;if(c.outputTranscription?.text)pendingAI+=c.outputTranscription.text;if(c.modelTurn?.parts)for(const p of c.modelTurn.parts)if(p.inlineData?.data)play(p.inlineData.data);if(c.turnComplete){if(pendingUser.trim()){add('user',pendingUser.trim());await turn(v.session,'user',pendingUser.trim());pendingUser=''}if(pendingAI.trim()){add('assistant',pendingAI.trim());await turn(v.session,'assistant',pendingAI.trim());pendingAI=''}status('正在聆聽…')}};ws.onerror=()=>{status('WebSocket 錯誤');log('WS ERROR')};ws.onclose=e=>{log('WS CLOSE '+e.code+' '+e.reason);stop(false)};}catch(e){log('FAIL '+e.message);status('測試失敗');$('go').disabled=false}}
async function mic(){const s=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});v.stream=s;v.src=v.ac.createMediaStreamSource(s);v.proc=v.ac.createScriptProcessor(2048,1,1);v.proc.onaudioprocess=e=>{if(!v||v.ws.readyState!==1)return;const f=down(e.inputBuffer.getChannelData(0),v.ac.sampleRate,16000);v.ws.send(JSON.stringify({realtimeInput:{audio:{data:b64(pcm(f)),mimeType:'audio/pcm;rate=16000'}}}))};v.src.connect(v.proc);v.proc.connect(v.ac.destination);log('MIC READY source='+v.ac.sampleRate+'Hz -> 16000Hz')}
function play(data){audioOut=audioOut||new AudioContext({sampleRate:24000});audioOut.resume();const u=Uint8Array.from(atob(data),c=>c.charCodeAt(0)),i=new Int16Array(u.buffer),b=audioOut.createBuffer(1,i.length,24000),f=b.getChannelData(0);for(let n=0;n<i.length;n++)f[n]=i[n]/32768;const s=audioOut.createBufferSource();s.buffer=b;s.connect(audioOut.destination);nextTime=Math.max(nextTime,audioOut.currentTime);s.start(nextTime);nextTime+=b.duration}
async function stop(end=true){if(!v)return;const x=v;v=null;try{x.proc?.disconnect();x.src?.disconnect();x.stream?.getTracks().forEach(t=>t.stop());x.ac.close()}catch{}if(end&&x.session)try{await api({action:'end',session_id:x.session})}catch{}try{x.ws.close()}catch{}$('go').disabled=false;status('測試結束')}
$('go').onclick=()=>v?stop():start();
</script></body></html>
