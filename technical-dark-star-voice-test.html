<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Technical Dark Star｜即時語音測試</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{width:100%;height:100%;border:0}#voiceSettings{position:fixed;top:58px;left:14px;z-index:9999;background:#fff;border:1px solid #e5e5e5;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.12);padding:10px;display:none;font:14px -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}#voiceSettings.show{display:block}#voiceSettings button{border:0;background:#f3f3f3;border-radius:8px;padding:7px 10px;margin:3px;cursor:pointer}#voiceSettings button.active{background:#171717;color:#fff}#voiceSettings .close{float:right;background:transparent}#voiceSettings small{display:block;color:#777;margin:5px 3px 8px}</style></head><body><iframe id="ds" allow="microphone; autoplay" src="technical-dark-star.html"></iframe><div id="voiceSettings"><button class="close" id="closeSettings">×</button><b>聲音</b><small>選擇即時語音風格</small><div><button data-voice="Kore" class="active">男</button><button data-voice="Aoede">女</button><button data-voice="Gacrux">成熟</button><button data-voice="Leda">年輕</button></div></div><script>
const F=document.getElementById('ds'), S=document.getElementById('voiceSettings');
let selectedVoice=localStorage.getItem('ds_voice_profile')||'Kore';
const SUP='https://clcddygkaaqqtsbswgdf.supabase.co/functions/v1/technical-dark-star-voice-session';
const WSS='wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained';
function b64(a){let s='';const u=new Uint8Array(a);for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function pcm16(f){const b=new ArrayBuffer(f.length*2),v=new DataView(b);for(let i=0;i<f.length;i++){let x=Math.max(-1,Math.min(1,f[i]));v.setInt16(i*2,x<0?x*32768:x*32767,true)}return b}
function down(f,from,to){if(from===to)return f;const r=from/to,o=Math.ceil(f.length/r),a=new Float32Array(o);let j=0;for(let i=0;i<o;i++){const e=Math.min(f.length,Math.round((i+1)*r));let sum=0,n=0;for(;j<e;j++){sum+=f[j];n++}a[i]=n?sum/n:0}return a}
let voice=null;
function status(t){try{F.contentWindow.postMessage({dsVoiceStatus:t},'*')}catch(e){}}
async function startVoice(){
 if(voice)return;
 status('正在連線…');
 const sr=await fetch(SUP,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voice_name:selectedVoice})}).then(r=>r.json());
 if(!sr.success)throw new Error(sr.error||'無法建立語音工作階段');
 const ws=new WebSocket(WSS+'?access_token='+encodeURIComponent(sr.token));
 const ac=new AudioContext(); await ac.resume();
 let stream,src,proc; let cursor=ac.currentTime; let pendingUser='',pendingAI=''; let seq=0; let sessionId=null;
 const started=await fetch(SUP,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'start',voice_profile:selectedVoice})}).then(r=>r.json()); sessionId=started?.session?.id||null;
 voice={ws,ac,stream,src,proc,sessionId};
 ws.onopen=async()=>{
  ws.send(JSON.stringify({setup:{model:'models/gemini-3.1-flash-live-preview'}}));
  stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); voice.stream=stream;
  src=ac.createMediaStreamSource(stream); proc=ac.createScriptProcessor(2048,1,1); voice.src=src;voice.proc=proc;
  proc.onaudioprocess=e=>{if(!voice||ws.readyState!==1)return;const f=down(e.inputBuffer.getChannelData(0),ac.sampleRate,16000);ws.send(JSON.stringify({realtimeInput:{audio:{data:b64(pcm16(f)),mimeType:'audio/pcm;rate=16000'}}}))};src.connect(proc);proc.connect(ac.destination);status('正在聆聽…');
 };
 ws.onmessage=async e=>{const m=JSON.parse(e.data),c=m.serverContent;if(!c)return;
  if(c.interrupted){cursor=ac.currentTime;return}
  if(c.inputTranscription?.text)pendingUser+=c.inputTranscription.text;
  if(c.outputTranscription?.text)pendingAI+=c.outputTranscription.text;
  if(c.modelTurn?.parts) for(const p of c.modelTurn.parts){if(p.inlineData?.data){const bytes=Uint8Array.from(atob(p.inlineData.data),x=>x.charCodeAt(0));const i16=new Int16Array(bytes.buffer);const ab=ac.createBuffer(1,i16.length,24000);const ch=ab.getChannelData(0);for(let i=0;i<i16.length;i++)ch[i]=i16[i]/32768;const n=ac.createBufferSource();n.buffer=ab;n.connect(ac.destination);const t=Math.max(cursor,ac.currentTime);n.start(t);cursor=t+ab.duration;}}
  if(c.turnComplete){if(sessionId&&pendingUser.trim()){seq++;fetch(SUP,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'turn',session_id:sessionId,sequence_no:seq,role:'user',content:pendingUser.trim()})});pendingUser=''}if(sessionId&&pendingAI.trim()){seq++;fetch(SUP,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'turn',session_id:sessionId,sequence_no:seq,role:'assistant',content:pendingAI.trim()})});pendingAI=''}status('正在聆聽…')}
 };
 ws.onerror=()=>status('語音連線錯誤');ws.onclose=()=>stopVoice(false);
}
function stopVoice(sendEnd=true){if(!voice)return;const v=voice;voice=null;try{if(sendEnd&&v.ws.readyState===1)v.ws.send(JSON.stringify({realtimeInput:{audioStreamEnd:true}}))}catch(e){}try{v.proc?.disconnect();v.src?.disconnect();v.stream?.getTracks().forEach(t=>t.stop());v.ws.close();v.ac.close();if(v.sessionId)fetch(SUP,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'end',session_id:v.sessionId})})}catch(e){}status('')}
function install(){const w=F.contentWindow,d=F.contentDocument;if(!d)return;const btn=d.getElementById('sendButton'),input=d.getElementById('composerInput');if(!btn||!input)return;
 const original=btn.innerHTML;function refresh(){if(voice){btn.disabled=false;btn.textContent='結束';btn.style.cssText='width:62px;min-width:62px;height:39px;border-radius:20px;background:#1677ff;color:#fff;border:0;font-size:13px';return}if(!input.value.trim()&&!(w.attachments&&w.attachments.length)){btn.disabled=false;btn.textContent='語音';btn.style.cssText='width:62px;min-width:62px;height:39px;border-radius:20px;background:#1677ff;color:#fff;border:0;font-size:13px'}else{btn.innerHTML=original;btn.style.cssText=''}}
 input.addEventListener('input',refresh,true);btn.addEventListener('click',async e=>{if(voice||(!input.value.trim())){e.preventDefault();e.stopImmediatePropagation();if(voice){stopVoice()}else{try{await startVoice()}catch(x){alert(x.message)}}refresh()}},true);refresh();
 const cap=d.getElementById('capabilityButton');if(cap){const b=d.createElement('button');b.className='drawer-item';b.textContent='🔊 聲音設定';b.onclick=()=>S.classList.toggle('show');cap.parentNode.insertBefore(b,cap.nextSibling)}
 w.addEventListener('message',e=>{if(e.data?.dsVoiceStatus){}},false);
}
F.addEventListener('load',()=>setTimeout(install,300));
setTimeout(()=>{if(F.contentDocument?.readyState==='complete')install()},1000);
document.querySelectorAll('[data-voice]').forEach(b=>b.onclick=()=>{selectedVoice=b.dataset.voice;localStorage.setItem('ds_voice_profile',selectedVoice);document.querySelectorAll('[data-voice]').forEach(x=>x.classList.toggle('active',x===b));if(voice){stopVoice();setTimeout(startVoice,150)}});
document.getElementById('closeSettings').onclick=()=>S.classList.remove('show');
</script></body></html>
