<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Coupons</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body class="game-body">
  <div class="snow-layer"></div>
  <div class="app" id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/boot.js"></script>
  <script>
    (async () => {
      if (!(await FKAuth.requirePlayer())) return;
      const snap = await FKApi.snapshot();
      const tx = await FKApi.couponHistory();
      document.getElementById("app").innerHTML = `
        <div class="page-head"><a class="back" href="game-menu.html">← 返回</a><h2>AIVAULT Coupons</h2></div>
        ${FKUI.top(snap)}
        <div class="panel">
          <p>目前餘額 <b>${snap.coupons || snap.resources.coupons || 0}</b></p>
          ${FKApi.mode()==="local" ? `<button class="btn secondary" id="dev">本機測試發放 50 券</button>` : ""}
          <h3>交易紀錄</h3>
          ${(tx||[]).slice().reverse().map(t => `<div class="list-item"><div>${t.transaction_type} ${t.reference_type}</div><b>${t.amount}</b></div>`).join("") || "<p class='tiny'>無紀錄</p>"}
        </div>${FKUI.nav("more")}
      `;
      const d = document.getElementById("dev");
      if (d) d.onclick = () => { FKLocal.addCouponsDev(FKLocal.session().user_id, 50); location.reload(); };
    })();
  </script>
</body>
</html>
