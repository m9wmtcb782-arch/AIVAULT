<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>AIVAULT — System Shutdown</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:#edf7ff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",sans-serif}
body{display:grid;place-items:center}
.scene{position:relative;width:100%;height:100%;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(33,105,255,.10),transparent 30%),radial-gradient(circle at 50% 70%,rgba(0,235,255,.05),transparent 42%),#02040a}
.grid{position:absolute;inset:-10%;background-image:linear-gradient(rgba(90,180,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(90,180,255,.035) 1px,transparent 1px);background-size:44px 44px;transform:perspective(500px) rotateX(60deg) translateY(18%);transform-origin:center bottom;opacity:.4}
.stars{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(160,225,255,.7) 0 1px,transparent 1.5px);background-size:93px 117px;opacity:.14;animation:stars 12s linear infinite}
.logo{position:relative;text-align:center;z-index:3;opacity:0;transform:scale(1);animation:logoIn .8s .1s forwards}
.brand{font-size:clamp(32px,9vw,56px);font-weight:800;letter-spacing:.2em;margin-left:.2em;text-shadow:0 0 12px rgba(106,224,255,.28),0 0 40px rgba(76,119,255,.2)}
.tag{margin-top:10px;font-size:11px;letter-spacing:.22em;color:#8193ad}
.core{position:absolute;z-index:2;width:min(70vw,300px);height:min(70vw,300px);border-radius:50%;border:1px solid rgba(96,195,255,.2);box-shadow:0 0 70px rgba(43,117,255,.08),inset 0 0 50px rgba(0,215,255,.04);animation:rotate 14s linear infinite,fadeCore 3.2s ease forwards;opacity:.7}
.core:before,.core:after{content:"";position:absolute;border-radius:50%;inset:12%;border:1px dashed rgba(104,225,255,.18)}
.core:after{inset:28%;border:1px solid rgba(128,155,255,.16)}
.status{position:absolute;z-index:5;bottom:22%;width:100%;text-align:center;font-size:12px;letter-spacing:.18em;color:#8fa2bd;min-height:18px}
.progress{position:absolute;z-index:5;bottom:16%;left:50%;transform:translateX(-50%);width:min(72vw,380px);height:2px;background:rgba(255,255,255,.07);overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#65eaff,#839bff);box-shadow:0 0 12px #65eaff;animation:load 2.6s linear forwards}
.ready{position:absolute;z-index:6;bottom:11%;color:#8ef1ff;font-size:12px;letter-spacing:.24em;opacity:0;text-shadow:0 0 12px rgba(101,235,255,.5)}
.fade{position:absolute;inset:0;background:#02040a;opacity:0;z-index:30;transition:opacity .55s}
@keyframes logoIn{to{opacity:1;transform:scale(1)}}
@keyframes rotate{to{transform:rotate(-360deg)}}
@keyframes stars{to{transform:translateY(30px)}}
@keyframes load{to{width:100%}}
@keyframes fadeCore{0%{opacity:.75;transform:scale(1)}70%{opacity:.35}100%{opacity:0;transform:scale(.85)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="scene" id="scene">
  <div class="grid"></div>
  <div class="stars"></div>
  <div class="core"></div>
  <div class="logo">
    <div class="brand">AIVAULT</div>
    <div class="tag">SESSION TERMINATED</div>
  </div>
  <div class="status" id="status">SIGNING OUT</div>
  <div class="progress"><div class="bar"></div></div>
  <div class="ready" id="ready">GOODBYE</div>
  <div class="fade" id="fade"></div>
</main>
<script>
const status = document.getElementById('status');
const steps = [
  [0, 'SIGNING OUT'],
  [500, 'CLEARING SESSION'],
  [1100, 'DISCONNECTING AGENTS'],
  [1700, 'CLOSING GATEWAY'],
  [2300, 'SYSTEM STANDBY']
];

let audioCtx;
function tone(freq, dur, type = 'sine', gain = .03, delay = 0) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime + delay;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0);
    o.stop(t0 + dur + .03);
  } catch (e) {}
}

function playShutdown() {
  // 下沉音階，與開機上揚相反
  tone(523, .18, 'sine', .035, 0);
  tone(392, .2, 'sine', .03, .12);
  tone(294, .25, 'triangle', .028, .26);
  tone(196, .4, 'sine', .025, .42);
}

steps.forEach(([delay, text], i) => {
  setTimeout(() => {
    status.textContent = text;
    tone(280 - i * 28, .1, 'sine', .02);
  }, delay);
});

setTimeout(() => {
  document.getElementById('ready').style.opacity = 1;
  playShutdown();
}, 2500);

setTimeout(() => {
  document.getElementById('fade').style.opacity = 1;
  setTimeout(() => {
    location.replace('aivault-login.html');
  }, 500);
}, 3200);

// 嘗試恢復音訊（部分瀏覽器需手勢，失敗也無妨）
try {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume?.();
} catch (e) {}
</script>
</body>
</html>
