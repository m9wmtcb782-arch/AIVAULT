<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AIVAULT War Room">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>AIVAULT · WAR ROOM</title>

<style>
:root{
  --bg:#050914;
  --panel:#0a1220;
  --panel2:#0d1728;
  --line:rgba(255,255,255,.09);
  --text:#f5f7fb;
  --muted:#91a0b7;
  --cyan:#36d7ff;
  --blue:#4285ff;
  --green:#36e39a;
  --yellow:#ffd166;
  --red:#ff5268;
  --purple:#a978ff;
  --shadow:0 20px 60px rgba(0,0,0,.45);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:
    radial-gradient(circle at 50% -10%,rgba(54,215,255,.12),transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "PingFang TC",
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
  overflow-x:hidden;
}

body{
  min-height:100svh;
}

button,
textarea,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================================================
   APP
========================================================= */

.app{
  width:100%;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* =========================================================
   HEADER
========================================================= */

.topbar{
  height:64px;
  min-height:64px;
  padding:
    max(8px,env(safe-area-inset-top))
    14px
    8px
    14px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:rgba(5,9,20,.82);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-orb{
  width:34px;
  height:34px;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 30%,#fff,transparent 12%),
    radial-gradient(circle,#36d7ff 0%,#256cff 45%,#071329 72%);
  box-shadow:
    0 0 18px rgba(54,215,255,.6),
    inset 0 0 14px rgba(255,255,255,.25);
}

.brand-title{
  font-weight:800;
  font-size:15px;
  letter-spacing:1.5px;
}

.brand-sub{
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
}

.header-actions{
  display:flex;
  gap:7px;
}

.icon-btn{
  width:38px;
  height:38px;
  border-radius:12px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.045);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================================================
   MAIN
========================================================= */

main{
  flex:1;
  width:100%;
  max-width:1200px;
  margin:0 auto;
  padding:14px 12px 130px;
}

/* =========================================================
   ROOM STATUS
========================================================= */

.room-status{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:11px 13px;
  margin-bottom:12px;

  border:1px solid var(--line);
  border-radius:15px;

  background:rgba(255,255,255,.025);
}

.status-left{
  display:flex;
  align-items:center;
  gap:9px;
}

.status-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 12px var(--green);
}

.status-dot.paused{
  background:var(--yellow);
  box-shadow:0 0 12px var(--yellow);
}

.status-dot.completed{
  background:var(--muted);
  box-shadow:none;
}

.status-text{
  font-size:13px;
  font-weight:700;
}

.round-info{
  color:var(--muted);
  font-size:12px;
}

/* =========================================================
   AI ROOM
========================================================= */

.ai-room{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

/*
  未來 AI 真人影像：
  .agent-video-slot 就是影像掛載區。
  之後可以放 video / canvas / WebRTC / Live Avatar。
*/

.agent-card{
  position:relative;
  min-height:235px;

  border:1px solid var(--line);
  border-radius:20px;

  overflow:hidden;

  background:
    radial-gradient(circle at 50% 0%,rgba(54,215,255,.07),transparent 45%),
    linear-gradient(145deg,#0b1423,#070c17);

  box-shadow:var(--shadow);
}

.agent-card.speaking{
  border-color:rgba(54,215,255,.65);
  box-shadow:
    0 0 0 1px rgba(54,215,255,.15),
    0 0 28px rgba(54,215,255,.15);
}

.agent-card.thinking{
  border-color:rgba(169,120,255,.45);
}

.agent-video-slot{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(circle at center,
      rgba(54,215,255,.09),
      transparent 55%);
}

.agent-avatar{
  width:86px;
  height:86px;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:38px;

  border:1px solid rgba(255,255,255,.12);

  background:
    radial-gradient(circle at 35% 25%,#fff,transparent 10%),
    radial-gradient(circle,#273f73,#101b32 60%,#070c15);

  box-shadow:
    0 0 35px rgba(54,215,255,.12);
}

.agent-video-slot::after{
  content:"";
  position:absolute;
  width:130px;
  height:130px;
  border:1px solid rgba(54,215,255,.08);
  border-radius:50%;
  animation:pulse 2.5s infinite;
}

@keyframes pulse{
  0%,100%{
    transform:scale(.9);
    opacity:.35;
  }
  50%{
    transform:scale(1.12);
    opacity:.75;
  }
}

.agent-info{
  position:absolute;
  left:0;
  right:0;
  bottom:0;

  padding:13px;

  background:
    linear-gradient(
      to top,
      rgba(3,7,15,.98),
      rgba(3,7,15,.75),
      transparent
    );
}

.agent-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.agent-name{
  font-size:14px;
  font-weight:800;
}

.agent-role{
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
}

.agent-status{
  padding:4px 7px;
  border-radius:7px;
  background:rgba(255,255,255,.06);
  color:var(--muted);
  font-size:9px;
}

.agent-status.speaking{
  color:var(--cyan);
  background:rgba(54,215,255,.1);
}

.agent-status.thinking{
  color:var(--purple);
  background:rgba(169,120,255,.1);
}

.agent-status.done{
  color:var(--green);
}

.agent-dialogue{
  margin-top:9px;
  font-size:12px;
  line-height:1.55;
  color:#dce5f5;

  max-height:58px;
  overflow:auto;
}

/* =========================================================
   OWNER PANEL
========================================================= */

.owner-panel{
  margin-top:12px;

  border:1px solid rgba(54,215,255,.18);
  border-radius:19px;

  background:
    linear-gradient(
      145deg,
      rgba(54,215,255,.055),
      rgba(255,255,255,.025)
    );

  padding:12px;
}

.owner-label{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--cyan);
  font-size:11px;
  font-weight:800;
  letter-spacing:.8px;
  margin-bottom:9px;
}

.owner-input-row{
  display:flex;
  gap:8px;
  align-items:flex-end;
}

#ownerInput{
  flex:1;
  min-height:46px;
  max-height:110px;

  resize:none;

  border:1px solid var(--line);
  border-radius:13px;

  padding:12px;

  color:#fff;
  background:rgba(0,0,0,.25);

  outline:none;
}

#ownerInput:focus{
  border-color:rgba(54,215,255,.5);
}

.send-btn{
  width:46px;
  height:46px;

  border:0;
  border-radius:13px;

  background:linear-gradient(135deg,#36d7ff,#3478ff);
  color:#03101c;

  font-weight:900;
  box-shadow:0 8px 25px rgba(54,215,255,.2);
}

/* =========================================================
   CONTROL ROW
========================================================= */

.control-row{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.control-btn{
  flex:1;
  min-height:42px;

  border:1px solid var(--line);
  border-radius:12px;

  background:rgba(255,255,255,.045);
  color:#dbe5f5;

  font-size:12px;
}

.control-btn.primary{
  background:rgba(54,215,255,.1);
  border-color:rgba(54,215,255,.25);
  color:var(--cyan);
}

.control-btn.danger{
  color:#ff8090;
  border-color:rgba(255,82,104,.2);
}

/* =========================================================
   TRANSCRIPT
========================================================= */

.transcript{
  position:fixed;
  left:0;
  right:0;
  bottom:0;

  height:min(72svh,600px);

  background:#07101d;

  border-top:1px solid rgba(54,215,255,.18);

  transform:translateY(105%);
  transition:transform .28s ease;

  z-index:300;

  display:flex;
  flex-direction:column;
}

.transcript.open{
  transform:translateY(0);
}

.transcript-head{
  min-height:54px;
  padding:10px 14px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  border-bottom:1px solid var(--line);
}

.transcript-title{
  font-size:13px;
  font-weight:800;
}

.transcript-body{
  flex:1;
  overflow:auto;
  padding:12px;
}

.transcript-message{
  margin-bottom:10px;
  padding:10px 11px;
  border-radius:12px;
  background:rgba(255,255,255,.035);
}

.transcript-message.owner{
  border-left:3px solid var(--cyan);
}

.transcript-message.ai{
  border-left:3px solid var(--purple);
}

.transcript-role{
  font-size:10px;
  color:var(--muted);
  margin-bottom:4px;
}

.transcript-content{
  font-size:12px;
  line-height:1.55;
}

/* =========================================================
   OVERLAY
========================================================= */

.overlay{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.72);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  z-index:500;

  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease;
}

.overlay.visible{
  opacity:1;
  pointer-events:auto;
}

.dialog{
  width:min(100%,430px);

  border:1px solid rgba(54,215,255,.2);
  border-radius:22px;

  background:#0a1321;

  box-shadow:0 30px 100px rgba(0,0,0,.6);

  padding:20px;
}

.dialog h2{
  margin:0 0 8px;
  font-size:18px;
}

.dialog p{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}

.dialog-actions{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.dialog-actions button{
  flex:1;
  min-height:44px;
  border-radius:12px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.05);
  color:#fff;
}

.dialog-actions .confirm{
  background:linear-gradient(135deg,#36d7ff,#3478ff);
  color:#04101d;
  border:0;
  font-weight:800;
}

/* =========================================================
   HISTORY
========================================================= */

.history-item{
  padding:13px;
  border:1px solid var(--line);
  border-radius:13px;
  background:rgba(255,255,255,.035);
  margin-bottom:8px;
}

.history-item .title{
  font-size:13px;
  font-weight:700;
}

.history-item .meta{
  margin-top:5px;
  font-size:10px;
  color:var(--muted);
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;
  left:50%;
  bottom:24px;

  transform:translate(-50%,20px);

  padding:10px 15px;

  background:rgba(10,18,31,.96);
  border:1px solid var(--line);

  border-radius:12px;

  font-size:12px;

  opacity:0;
  pointer-events:none;

  z-index:900;

  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:760px){

  main{
    padding-left:20px;
    padding-right:20px;
  }

  .ai-room{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .agent-card{
    min-height:270px;
  }

}

@media(min-width:1100px){

  .ai-room{
    grid-template-columns:repeat(5,minmax(0,1fr));
  }

}

/* =========================================================
   ACCESSIBILITY / REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    animation-duration:.001ms!important;
    transition-duration:.001ms!important;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- =====================================================
       TOP BAR
  ====================================================== -->

  <header class="topbar">

    <div class="brand">

      <div class="brand-orb"></div>

      <div>
        <div class="brand-title">AIVAULT WAR ROOM</div>
        <div class="brand-sub">AI GOVERNANCE · COLLABORATION</div>
      </div>

    </div>

    <div class="header-actions">

      <button
        class="icon-btn"
        id="btnLang"
        type="button"
        title="Language">
        中
      </button>

      <button
        class="icon-btn"
        id="btnMic"
        type="button"
        title="語音輸入">
        🎙️
      </button>

      <button
        class="icon-btn"
        id="btnBackHome"
        type="button"
        title="返回首頁">
        ⌂
      </button>

    </div>

  </header>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main>

    <section class="room-status">

      <div class="status-left">

        <span
          id="statusDot"
          class="status-dot">
        </span>

        <span
          id="statusText"
          class="status-text">
          等待 Owner 指示
        </span>

      </div>

      <div
        id="roundInfo"
        class="round-info">
        Round 0 / 6
      </div>

    </section>


    <!-- ===================================================
         AI ROOM
    ==================================================== -->

    <section
      id="aiRoom"
      class="ai-room">
    </section>


    <!-- ===================================================
         OWNER
    ==================================================== -->

    <section class="owner-panel">

      <div class="owner-label">
        <span>◆</span>
        <span id="ownerLabel">OWNER COMMAND</span>
      </div>

      <div class="owner-input-row">

        <textarea
          id="ownerInput"
          rows="1"
          placeholder="輸入你的問題或任務..."
          autocomplete="off"
          spellcheck="false"></textarea>

        <button
          id="btnSend"
          class="send-btn"
          type="button">
          ➤
        </button>

      </div>


      <div
        id="controlRow"
        class="control-row">

        <button
          id="btnNextRound"
          class="control-btn primary"
          type="button">
          下一輪
        </button>

        <button
          id="btnPause"
          class="control-btn"
          type="button">
          暫停
        </button>

        <button
          id="btnApprove"
          class="control-btn primary"
          type="button">
          批准
        </button>

        <button
          id="btnStop"
          class="control-btn danger"
          type="button">
          結束
        </button>

      </div>


      <div class="control-row">

        <button
          id="btnTranscript"
          class="control-btn"
          type="button">
          會議紀錄
        </button>

        <button
          id="btnViewHistory"
          class="control-btn"
          type="button">
          歷史會議
        </button>

        <button
          id="btnHideKeyboard"
          class="control-btn"
          type="button">
          收起鍵盤
        </button>

      </div>

    </section>

  </main>


  <!-- =====================================================
       TRANSCRIPT
  ====================================================== -->

  <section
    id="transcript"
    class="transcript">

    <div class="transcript-head">

      <div class="transcript-title">
        WAR ROOM · 即時會議紀錄
      </div>

      <button
        id="btnCloseTranscript"
        class="icon-btn"
        type="button">
        ×
      </button>

    </div>

    <div
      id="transcriptBody"
      class="transcript-body">
    </div>

  </section>


  <!-- =====================================================
       START OVERLAY
  ====================================================== -->

  <div
    id="overlayStart"
    class="overlay">

    <div class="dialog">

      <h2>進入 AIVAULT War Room</h2>

      <p>
        Owner 將提出任務，AI 團隊會依序進行分析、
        協作、審查與決策。
      </p>

      <div class="dialog-actions">

        <button
          id="btnStartNew"
          class="confirm"
          type="button">
          開始會議
        </button>

        <button
          id="btnHistory"
          type="button">
          查看歷史
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       APPROVAL
  ====================================================== -->

  <div
    id="overlayDecision"
    class="overlay">

    <div class="dialog">

      <h2>批准最終決策</h2>

      <p>
        Owner 即將批准本次 War Room 的最終決策。
        批准後本次會議將標記為完成。
      </p>

      <div class="dialog-actions">

        <button
          id="btnReject"
          type="button">
          返回會議
        </button>

        <button
          id="btnConfirmApprove"
          class="confirm"
          type="button">
          確認批准
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       HISTORY
  ====================================================== -->

  <div
    id="overlayHistory"
    class="overlay">

    <div class="dialog">

      <h2>歷史會議</h2>

      <div id="historyList"></div>

      <div class="dialog-actions">

        <button
          id="btnCloseHistory"
          class="confirm"
          type="button">
          關閉
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       TOAST
  ====================================================== -->

  <div
    id="toast"
    class="toast">
  </div>

</div>


<script>
"use strict";

/* =========================================================
   AIVAULT WAR ROOM
   Version: 2.0
   Architecture:
   Owner
      ↓
   War Room
      ↓
   Agent collaboration
      ↓
   TTS Queue
      ↓
   Future AI Digital Human Video Layer

   IMPORTANT:
   TTS is intentionally independent from UI.
========================================================= */


/* =========================================================
   DOM HELPER
========================================================= */

const $ = selector => document.querySelector(selector);


/* =========================================================
   LANGUAGE
========================================================= */

let uiLang = "zh";


function applyLangBtn(){

  const btn = $("#btnLang");

  if(!btn) return;

  btn.textContent = uiLang === "zh"
    ? "中"
    : "EN";

}


/* =========================================================
   AGENTS
========================================================= */

const AGENTS = [

  {
    id:"chief",
    name:"Chief",
    role:"AI 主任／會議主持",
    avatar:"👨🏻‍💼"
  },

  {
    id:"strategist",
    name:"Strategist",
    role:"策略分析",
    avatar:"🧠"
  },

  {
    id:"engineer",
    name:"Engineer",
    role:"技術工程",
    avatar:"👨🏻‍💻"
  },

  {
    id:"security",
    name:"Security",
    role:"安全與風險",
    avatar:"🛡️"
  },

  {
    id:"reviewer",
    name:"Reviewer",
    role:"獨立審查",
    avatar:"🔍"
  }

];


/* =========================================================
   STATE
========================================================= */

const state = {

  status:"idle",

  meetingId:null,

  round:0,

  maxRounds:6,

  ownerInput:"",

  transcript:[],

  activeAgent:null,

  language:"zh"

};


/* =========================================================
   TTS ENGINE
========================================================= */

/*
  核心修正：

  以前：
  speechSynthesis.speak()
       ↓
  voice 還沒載入
       ↓
  第一輪沒有聲音

  現在：
  initializeTTS()
       ↓
  等待 voiceschanged
       ↓
  選擇中文 voice
       ↓
  speakChinese()
       ↓
  TTS queue
*/

let ttsInitialized = false;

let ttsVoices = [];

let ttsChineseVoice = null;

let ttsSpeaking = false;

let ttsQueue = [];

let ttsUnlockDone = false;


/* =========================================================
   GET VOICES
========================================================= */

function refreshVoices(){

  if(!("speechSynthesis" in window)){
    return [];
  }

  try{

    ttsVoices =
      window.speechSynthesis.getVoices() || [];

  }catch(error){

    console.warn(
      "[AIVAULT TTS] getVoices failed",
      error
    );

    ttsVoices = [];

  }

  /*
    優先順序：

    1. zh-TW
    2. zh-HK
    3. zh-CN
    4. 中文語音
  */

  const preferred = [

    v =>
      /^zh-TW/i.test(v.lang),

    v =>
      /^zh-HK/i.test(v.lang),

    v =>
      /^zh-CN/i.test(v.lang),

    v =>
      /^zh/i.test(v.lang),

    v =>
      /Chinese|Mandarin|Taiwan|普通話|中文|國語/i
        .test(v.name)

  ];

  ttsChineseVoice = null;

  for(const finder of preferred){

    const found = ttsVoices.find(finder);

    if(found){

      ttsChineseVoice = found;

      break;

    }

  }

  return ttsVoices;

}


/* =========================================================
   WAIT FOR VOICES
========================================================= */

function waitForVoices(timeout = 2500){

  return new Promise(resolve => {

    refreshVoices();

    if(ttsVoices.length){

      resolve(ttsVoices);

      return;

    }

    let finished = false;

    const finish = () => {

      if(finished) return;

      finished = true;

      window.speechSynthesis.removeEventListener(
        "voiceschanged",
        onVoicesChanged
      );

      refreshVoices();

      resolve(ttsVoices);

    };

    const onVoicesChanged = () => {

      refreshVoices();

      if(ttsVoices.length){

        finish();

      }

    };

    window.speechSynthesis.addEventListener(
      "voiceschanged",
      onVoicesChanged
    );

    setTimeout(
      finish,
      timeout
    );

  });

}


/* =========================================================
   INITIALIZE TTS
========================================================= */

async function initializeTTS(){

  if(!("speechSynthesis" in window)){

    console.warn(
      "[AIVAULT TTS] Browser does not support speechSynthesis."
    );

    return false;

  }

  if(ttsInitialized){

    return true;

  }

  try{

    refreshVoices();

    await waitForVoices(2500);

    /*
      即使 voice 沒有立即出現，
      iPhone Safari 後面仍可能載入。
    */

    if(!ttsChineseVoice){

      refreshVoices();

    }

    ttsInitialized = true;

    console.log(
      "[AIVAULT TTS] initialized",
      {
        voices:ttsVoices.length,
        chineseVoice:
          ttsChineseVoice
            ? ttsChineseVoice.name
            : "system-default"
      }
    );

    return true;

  }catch(error){

    console.warn(
      "[AIVAULT TTS] initialization error",
      error
    );

    return false;

  }

}


/* =========================================================
   AUDIO UNLOCK
========================================================= */

/*
  iPhone Safari 對語音有使用者互動限制。

  因此 Owner 第一次：

    點開始會議
    點送出
    點麥克風

  都會嘗試解鎖。

  不使用長音效。
  只建立一個極短、無文字的 speech utterance。
*/

function unlockAudio(){

  if(ttsUnlockDone){

    return;

  }

  if(!("speechSynthesis" in window)){

    return;

  }

  try{

    const u =
      new SpeechSynthesisUtterance("");

    u.lang = "zh-TW";

    u.volume = 0;

    u.rate = 1;

    u.pitch = 1;

    window.speechSynthesis.speak(u);

    ttsUnlockDone = true;

    setTimeout(() => {

      try{
        window.speechSynthesis.cancel();
      }catch(e){}

    },100);

  }catch(error){

    console.warn(
      "[AIVAULT TTS] unlock failed",
      error
    );

  }

}


/* =========================================================
   CREATE UTTERANCE
========================================================= */

function createChineseUtterance(text, agent){

  const utterance =
    new SpeechSynthesisUtterance(text);

  /*
    核心：
    無論目前 UI 是否英文，
    AI 語音預設中文國語。
  */

  utterance.lang = "zh-TW";

  if(ttsChineseVoice){

    utterance.voice = ttsChineseVoice;

  }

  utterance.rate = 0.95;

  utterance.pitch = 1;

  utterance.volume = 1;

  utterance.onstart = () => {

    setAgentStatus(
      agent.id,
      "speaking"
    );

    state.activeAgent = agent.id;

  };

  utterance.onend = () => {

    setAgentStatus(
      agent.id,
      "done"
    );

    state.activeAgent = null;

    ttsSpeaking = false;

    processTTSQueue();

  };

  utterance.onerror = error => {

    console.warn(
      "[AIVAULT TTS] speech error",
      error
    );

    setAgentStatus(
      agent.id,
      "done"
    );

    state.activeAgent = null;

    ttsSpeaking = false;

    /*
      出錯時不能卡死整個 queue。
    */

    processTTSQueue();

  };

  return utterance;

}


/* =========================================================
   TTS QUEUE
========================================================= */

function speakChinese(text, agentId){

  return new Promise(resolve => {

    if(!text){

      resolve();

      return;

    }

    const agent =
      AGENTS.find(a => a.id === agentId)
      || AGENTS[0];

    ttsQueue.push({

      text,

      agent,

      resolve

    });

    processTTSQueue();

  });

}


/* =========================================================
   PROCESS QUEUE
========================================================= */

async function processTTSQueue(){

  if(ttsSpeaking){

    return;

  }

  if(!ttsQueue.length){

    return;

  }

  /*
    確保第一輪也完成初始化。
  */

  await initializeTTS();

  const item =
    ttsQueue.shift();

  if(!item){

    return;

  }

  ttsSpeaking = true;

  unlockAudio();

  /*
    如果 voice 是在 queue 等待期間才載入，
    再掃一次。
  */

  refreshVoices();

  const utterance =
    createChineseUtterance(
      item.text,
      item.agent
    );

  /*
    防止 Safari 在上一段 speech 狀態卡住。
  */

  try{

    if(
      window.speechSynthesis.speaking ||
      window.speechSynthesis.pending
    ){

      /*
        這裡不 cancel。
        因為我們自己就是 queue。
      */

    }

    window.speechSynthesis.speak(
      utterance
    );

  }catch(error){

    console.error(
      "[AIVAULT TTS] speak failed",
      error
    );

    ttsSpeaking = false;

    setAgentStatus(
      item.agent.id,
      "done"
    );

    item.resolve();

    processTTSQueue();

    return;

  }

  item.resolve();

}


/* =========================================================
   STOP TTS
========================================================= */

function stopTTS(){

  ttsQueue = [];

  ttsSpeaking = false;

  try{

    window.speechSynthesis.cancel();

  }catch(error){

    console.warn(error);

  }

}

/* =========================================================

========================================================= */

function setAgentStatus(agentId,status){

  const card =
    document.getElementById(
      `agent-${agentId}`
    );

  const statusEl =
    document.getElementById(
      `status-${agentId}`
    );

  if(!card || !statusEl){

    return;

  }

  card.classList.remove(
    "speaking",
    "thinking"
  );

  statusEl.classList.remove(
    "speaking",
    "thinking",
    "done"
  );

  if(status === "speaking"){

    card.classList.add(
      "speaking"
    );

    statusEl.classList.add(
      "speaking"
    );

    statusEl.textContent =
      "正在發言";

  }
  else if(status === "thinking"){

    card.classList.add(
      "thinking"
    );

    statusEl.classList.add(
      "thinking"
    );

    statusEl.textContent =
      "分析中";

  }
  else if(status === "done"){

    statusEl.classList.add(
      "done"
    );

    statusEl.textContent =
      "完成";

  }
  else{

    statusEl.textContent =
      "待命";

  }

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value)

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

/* =========================================================
   START MEETING
========================================================= */

async function startMeeting(ownerText){

  const text =
    String(ownerText || "").trim();

  if(!text){

    return;

  }

  /*
    第一個使用者動作：
    立即解鎖 Audio
  */

  unlockAudio();

  /*
    同時初始化 TTS。
    不等待到第 5 輪才處理。
  */

  initializeTTS();

  state.status =
    "active";

  state.meetingId =
    createMeetingId();

  state.round = 1;

  state.transcript = [];

  addTranscriptMessage({

    role:"Owner",

    content:text,

    isOwner:true

  });

  updateRoundUI();

  toast("War Room 已開始");

  /*
    第一輪立即開始。
  */

  await runRound(1,text);

}


/* =========================================================
   ROUND
========================================================= */

async function runRound(round,ownerText){

  if(
    state.status !== "active" &&
    state.status !== "paused"
  ){

    return;

  }

  if(state.status === "paused"){

    return;

  }

  const responses =
    createRoundResponses(
      round,
      ownerText
    );

  /*
    AI 逐一發言。
    這裡故意串行。
    不會五個 AI 同時搶聲音。
  */

  for(const response of responses){

    if(state.status !== "active"){

      return;

    }

    setAgentStatus(
      response.agent.id,
      "thinking"
    );

    setAgentDialogue(
      response.agent.id,
      "正在分析 Owner 指示……"
    );

    await delay(
      300
    );

    setAgentDialogue(
      response.agent.id,
      response.text
    );

    addTranscriptMessage({

      role:
        response.agent.name,

      content:
        response.text,

      isOwner:false

    });

    /*
      這就是中文國語 TTS。
    */

    await speakChinese(
      response.text,
      response.agent.id
    );

    await delay(
      180
    );

  }

}


/* =========================================================
   ROUND RESPONSES
========================================================= */

function createRoundResponses(
  round,
 ownerText
){

  const short =
    ownerText.length > 90
      ? ownerText.slice(0,90) + "……"
      : ownerText;

  return [

    {
      agent:AGENTS[0],

      text:
        `收到 Owner 指示。這是第 ${round} 輪討論。我會主持本輪協作，確認問題範圍、目標與最後需要交付的成果。`
    },

    {
      agent:AGENTS[1],

      text:
        `策略分析：目前 Owner 的核心需求是「${short}」。我建議先確認目標、限制條件與成功標準，再進入執行方案。`
    },

    {
      agent:AGENTS[2],

      text:
        `工程分析：技術上可以將需求拆成可執行任務，並保留後續接入 AI Gateway、資料庫與 Agent Pipeline 的接口。`
    },

    {
      agent:AGENTS[3],

      text:
        `安全分析：執行前需要檢查權限、資料安全、輸入內容與可能的系統風險。任何高風險操作都應該先經過治理閘門。`
    },

    {
      agent:AGENTS[4],

      text:
        `獨立審查：目前方案可以繼續，但正式交付前仍應經過測試、驗證、問題修正以及 Owner 最終批准。`
    }

  ];

}


/* =========================================================
   NEXT ROUND
========================================================= */

async function runNextRound(){

  if(state.status === "idle"){

    toast("請先開始會議");

    return;

  }

  if(state.status === "completed"){

    toast("本次會議已完成");

    return;

  }

  if(state.status === "paused"){

    return;

  if(
    state.round >=
    state.maxRounds
  ){

  state.round++;

  updateRoundUI();

  await runRound(
    state.round,
    state.ownerInput ||
    "請繼續分析目前議題。"
  );

}

/* =========================================================
   VOICE RECOGNITION
========================================================= */

let recognition = null;

let recognizing = false;


function getRecognition(){

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SR){

    return null;

  }

  if(recognition){

    return recognition;

  }

  recognition =
    new SR();

  recognition.continuous =
    false;

  recognition.interimResults =
    true;

  recognition.maxAlternatives =
    1;

  /*
    Owner 語音輸入固定中文。
  */

  recognition.lang =
    "zh-TW";


  recognition.onstart = () => {

    recognizing = true;

    const btn =
      $("#btnMic");

    if(btn){

      btn.textContent =
        "🔴";

      btn.style.borderColor =
        "#ef4444";

    }

  };


  recognition.onend = () => {

    recognizing = false;

    const btn =
      $("#btnMic");

    if(btn){

      btn.textContent =
        "🎙️";

      btn.style.borderColor =
        "";

    }

  };


  recognition.onerror = event => {

    recognizing = false;

    console.warn(
      "[AIVAULT Speech Recognition]",
      event.error
    );

    const btn =
      $("#btnMic");

    if(btn){

      btn.textContent =
        "🎙️";

    }

  };


  recognition.onresult = event => {

    let finalText = "";

    let interim = "";

    for(
      let i=event.resultIndex;
      i<event.results.length;
      i++
    ){

      const result =
        event.results[i];

      if(result.isFinal){

        finalText +=
          result[0].transcript;

      }else{

        interim +=
          result[0].transcript;

      }

    }

    const input =
      $("#ownerInput");

    if(input && interim){

      input.value =
        interim;

    }

    if(
      finalText.trim()
    ){

      if(input){

        input.value =
          finalText.trim();

      }

      handleVoiceCommand(
        finalText.trim()
      );

    }

  };

  return recognition;

}


/* =========================================================
   START LISTEN
========================================================= */

function startListen(){

  /*
    語音輸入也是使用者互動。
    同時解鎖 TTS。
  */

  unlockAudio();

  initializeTTS();

  const rec =
    getRecognition();

  if(!rec){

    alert(
      "此瀏覽器不支援語音辨識，請改用文字輸入。"
    );

    return;

  }

  try{

    if(recognizing){

      rec.stop();

      return;

    }

    rec.lang =
      "zh-TW";

    rec.start();

  }catch(error){

    console.warn(
      "[AIVAULT Recognition]",
      error
    );

  }

}


/* =========================================================
   VOICE COMMAND
========================================================= */

async function handleVoiceCommand(text){

  const raw =
    text.trim();

  if(!raw){

    return;

  }

  addTranscriptMessage({

    role:"Owner",

    content:raw,

    isOwner:true

  });


  if(
    /結束會議|停止會議|end meeting|stop meeting/i
      .test(raw)
  ){

    stopMeeting();

    return;

  }


  if(
    /下一輪|下一步|next round|continue/i
      .test(raw)
  ){

    runNextRound();

    return;

  }


  if(
    /暫停|pause/i
      .test(raw)
  ){

    togglePause();

    return;

  }


  if(
    /批准|同意|approve/i
      .test(raw)
  ){

    approveMeeting();

    return;

  }


  if(
    /收起鍵盤|關閉鍵盤|hide keyboard/i
      .test(raw)
  ){

    hideKeyboard();

    return;

  }


  /*
    一般 Owner 發言
  */

  const input =
    $("#ownerInput");

  if(input){

    input.value =
      raw;

  }

  $("#btnSend")
    ?.click();

}


/* =========================================================
   HIDE KEYBOARD
========================================================= */

  const input =
    $("#ownerInput");

  if(input){

    input.blur();

  }

  if(
    document.activeElement &&
    document.activeElement.blur
  ){

    document.activeElement.blur();

  }

  window.scrollTo(
    0,
    0
  );

  setTimeout(
    () => window.scrollTo(0,0),
    50
  );

}

        location.href =
          "aivault-home.html";

      }
    );


  /* Send */

  $("#btnSend")
    ?.addEventListener(
      "click",
      async () => {

        const input =
          $("#ownerInput");

        const text =
          input.value.trim();

        if(!text){

          return;

        }

        /*
          這是最重要的修正：

          Owner 按送出本身就是使用者互動。
          立即解鎖 Audio。
        */

        unlockAudio();

        /*
          第一輪前立即初始化中文 voice。
        */

        initializeTTS();

        state.ownerInput =
          text;

        input.value = "";

        input.style.height =
          "auto";

        if(
          state.status === "idle" ||
          !state.meetingId
        ){

          /*
            第一輪 AI 直接開始。
          */

          await startMeeting(
            text
          );

        }else{

          addTranscriptMessage({

            role:"Owner",

            content:text,

            isOwner:true

          });

          toast(
            "已送出補充意見"
          );

        }

      }
    );


  /* Enter */

  $("#ownerInput")
    ?.addEventListener(
      "keydown",
      event => {

        if(
          event.key === "Enter" &&
          !event.shiftKey
        ){

          event.preventDefault();

          $("#btnSend")
            ?.click();

        }

      }
    );


  /* Auto resize */

  $("#ownerInput")
    ?.addEventListener(
      "input",
      function(){

        this.style.height =
          "auto";

        this.style.height =
          Math.min(
            this.scrollHeight,
            110
          ) + "px";

      }
    );


  /* Next */

  $("#btnNextRound")
    ?.addEventListener(
      "click",
      () => runNextRound()
    );


  /* Approve */

  $("#btnApprove")
    ?.addEventListener(
      "click",
      () => approveMeeting()
    );


  /* Confirm */

  $("#btnConfirmApprove")
    ?.addEventListener(
      "click",
      () => confirmApprove()
    );


  /* Reject */

  $("#btnReject")
    ?.addEventListener(
      "click",
      () => {

        $("#overlayDecision")
          .classList
          .remove("visible");

        toast(
          "已返回會議"
        );

      }
    );


  /* Stop */

  $("#btnStop")
    ?.addEventListener(
      "click",
      () => {

        if(
          !confirm(
            "確定結束會議？"
          )
        ){

          return;

        }

        stopMeeting();

      }
    );


  /* Pause */

  $("#btnPause")
    ?.addEventListener(
      "click",
      () => togglePause()
    );


  /* Transcript */

  $("#btnTranscript")
    ?.addEventListener(
      "click",
      () => {

        $("#transcript")
          .classList
          .toggle("open");

      }
    );


  $("#btnCloseTranscript")
    ?.addEventListener(
      "click",
      () => {

        $("#transcript")
          .classList
          .remove("open");

      }
    );


  /* Start */

  $("#btnStartNew")
    ?.addEventListener(
      "click",
      () => {

        $("#overlayStart")
          .classList
          .remove("visible");

        /*
          使用者明確點擊。
          這裡解鎖 TTS。
        */

        unlockAudio();

        initializeTTS();

        setTimeout(
          () => $("#ownerInput")?.focus(),
          100
        );

      }
    );


  /* History */

  ["btnViewHistory","btnHistory"]
    .forEach(id => {

      const el =
        document.getElementById(id);

      if(!el){

        return;

      }

      el.addEventListener(
        "click",
        () => {

          $("#overlayHistory")
            .classList
            .add("visible");

          renderHistory();

        }
      );

    });


  $("#btnCloseHistory")
    ?.addEventListener(
      "click",
      () => {

        $("#overlayHistory")
          .classList
          .remove("visible");

      }
    );


  /* Language */

  $("#btnLang")
    ?.addEventListener(
      "click",
      () => {

        uiLang =
          uiLang === "zh"
            ? "en"
            : "zh";

        applyLangBtn();

        /*
          UI 可切英文，
          但 AI TTS 仍然維持中文國語。
        */

        if(ttsInitialized){

          speakChinese(
            uiLang === "zh"
              ? "已切換為中文模式"
              : "介面已切換為英文模式，但人工智慧語音仍使用中文國語。",
            "chief"
          );

        }

      }
    );


  /* Mic */

  $("#btnMic")
    ?.addEventListener(
      "click",
      event => {

        event.preventDefault();

        startListen();

      }
    );


  /* Hide Keyboard */

  $("#btnHideKeyboard")
    ?.addEventListener(
      "click",
      event => {

        event.preventDefault();

        hideKeyboard();

      }
    );


  /*
    點 AI 房間空白處收鍵盤。
  */

  document
    .querySelector("main")
    ?.addEventListener(
      "pointerdown",
      event => {

        if(
          event.target.closest(
            ".owner-panel"
          )
        ){

          return;

        }

        if(
          event.target.closest(
            "textarea,input,button,a"
          )
        ){

          return;

        }

        hideKeyboard();

      }
    );

}


/* =========================================================
   PREVENT PAGE SCROLL
========================================================= */

(function preventPageScroll(){

  document.addEventListener(
    "touchmove",
    event => {

      let el =
        event.target;

      while(
        el &&
        el !== document.body
      ){

        if(
          el.classList &&
          (
            el.classList.contains(
              "agent-dialogue"
            ) ||
            el.classList.contains(
              "transcript-body"
            ) ||
            el.tagName === "TEXTAREA"
          )
        ){

          return;

        }

        el =
          el.parentElement;

      }

      /*
        不鎖死 textarea。
        只限制頁面本身。
      */

      if(
        !event.target.closest(
          ".transcript-body,.agent-dialogue,textarea"
        )
      ){

        event.preventDefault();

      }

    },
    {
      passive:false
    }
  );


  document.addEventListener(
    "scroll",
    () => {

      if(
        window.scrollY !== 0
      ){

        window.scrollTo(
          0,
          0
        );

      }

    },
    {
      passive:true
    }
  );

})();


/* =========================================================
   INIT
========================================================= */

async function init(){

  renderAgents();

  bindEvents();

  resetAllAgents(
    "listening"
  );

  updateRoundUI();

  applyLangBtn();

  /*
    先嘗試載入中文 voice。
    即使瀏覽器現在還沒有 voice，
    voiceschanged 會再抓一次。
  */

  initializeTTS();

  /*
    沒有 active meeting 才顯示開始畫面。
  */

  if(!state.meetingId){

    $("#overlayStart")
      .classList
      .add("visible");

  }

}


/* =========================================================
   START
========================================================= */

init();


/* =========================================================
   DEBUG / FUTURE INTEGRATION
========================================================= */

window.AIVAULT_WARROOM = {

  state,

  AGENTS,

  startMeeting,

  runNextRound,

  setAgentStatus,

  setAgentDialogue,

  speakChinese,

  stopTTS,

  initializeTTS,

  refreshVoices,

  /*
    未來數位人：
    可透過這個介面把 video/canvas/WebRTC
    掛到指定 Agent。
  */

  mountAgentVideo(agentId, element){

    const slot =
      document.getElementById(
        `video-${agentId}`
      );

    if(!slot){

      return false;

    }

    slot.innerHTML = "";

    slot.appendChild(
      element
    );

    return true;

  }

};

</script>
