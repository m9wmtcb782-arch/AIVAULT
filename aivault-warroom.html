<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AIVAULT">
<meta name="theme-color" content="#050914">

<title>AIVAULT · AI War Room</title>

<style>
:root{
  --bg:#050914;
  --panel:#0b1220;
  --panel2:#101a2c;
  --border:rgba(255,255,255,.10);
  --text:#f5f7fb;
  --muted:#8b98ad;
  --blue:#4da3ff;
  --cyan:#31d7ff;
  --green:#34d399;
  --yellow:#fbbf24;
  --red:#fb7185;
  --purple:#a78bfa;
  --shadow:0 18px 60px rgba(0,0,0,.45);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "PingFang TC",
    "Noto Sans TC",
    Arial,
    sans-serif;
}

body{
  overflow-x:hidden;
}

button,
textarea,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  padding:
    max(12px, env(safe-area-inset-top))
    max(12px, env(safe-area-inset-right))
    max(20px, env(safe-area-inset-bottom))
    max(12px, env(safe-area-inset-left));
}

/* ============================================================
   TOP BAR
============================================================ */

.topbar{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(5,9,20,.92);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.brand-mark{
  width:34px;
  height:34px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 35% 25%, #61e8ff, #2368ff 45%, #09142d 75%);
  box-shadow:
    0 0 25px rgba(49,215,255,.35);
  font-size:16px;
}

.brand-text{
  min-width:0;
}

.brand-title{
  font-size:14px;
  font-weight:800;
  letter-spacing:.08em;
}

.brand-sub{
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
}

.top-actions{
  display:flex;
  gap:7px;
}

.icon-btn{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.045);
  color:white;
  border-radius:11px;
  display:grid;
  place-items:center;
  font-size:17px;
}

.icon-btn:active{
  transform:scale(.96);
}

/* ============================================================
   STATUS
============================================================ */

.statusbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 2px;
  gap:10px;
}

.status-left{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.live-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 14px var(--green);
}

.status-text{
  font-size:12px;
  color:#cbd5e1;
}

.round-info{
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
}

/* ============================================================
   OWNER PANEL
============================================================ */

.owner-panel{
  background:
    linear-gradient(
      135deg,
      rgba(28,61,110,.28),
      rgba(8,15,29,.9)
    );
  border:1px solid rgba(77,163,255,.22);
  border-radius:18px;
  padding:13px;
  box-shadow:var(--shadow);
}

.owner-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:9px;
}

.owner-label{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  font-weight:800;
}

.owner-badge{
  font-size:9px;
  padding:3px 7px;
  border-radius:999px;
  background:rgba(77,163,255,.13);
  color:#8cc9ff;
  border:1px solid rgba(77,163,255,.2);
}

.owner-input-row{
  display:flex;
  align-items:flex-end;
  gap:8px;
}

#ownerInput{
  flex:1;
  min-height:48px;
  max-height:110px;
  resize:none;
  border:1px solid var(--border);
  border-radius:14px;
  padding:13px;
  outline:none;
  color:white;
  background:rgba(0,0,0,.25);
  line-height:1.45;
}

#ownerInput:focus{
  border-color:rgba(77,163,255,.6);
  box-shadow:0 0 0 3px rgba(77,163,255,.08);
}

.send-btn{
  width:48px;
  height:48px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#2388ff,#5b5df6);
  color:white;
  font-size:18px;
  box-shadow:0 10px 30px rgba(35,136,255,.22);
}

.owner-tools{
  display:flex;
  gap:7px;
  margin-top:8px;
  overflow-x:auto;
  scrollbar-width:none;
}

.owner-tools::-webkit-scrollbar{
  display:none;
}

.tool-btn{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:rgba(255,255,255,.035);
  color:#d7deea;
  border-radius:10px;
  padding:8px 11px;
  font-size:11px;
}

.tool-btn.active{
  border-color:rgba(49,215,255,.45);
  color:#7eeaff;
  background:rgba(49,215,255,.08);
}

/* ============================================================
   WAR ROOM
============================================================ */

.room{
  margin-top:12px;
}

.room-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.room-title strong{
  font-size:14px;
}

.room-title span{
  font-size:10px;
  color:var(--muted);
}

/*
  未來數位人／真人影像只需要放入 .agent-avatar 的 img
  不改動 Agent 卡片與 War Room 核心架構。
*/

.agent-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}

.agent-card{
  min-height:190px;
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );
  border:1px solid var(--border);
  border-radius:17px;
  padding:10px;
  position:relative;
  overflow:hidden;
  transition:
    transform .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}

.agent-card.active{
  border-color:rgba(49,215,255,.48);
  box-shadow:
    0 0 0 1px rgba(49,215,255,.06),
    0 0 35px rgba(49,215,255,.10);
  transform:translateY(-1px);
}

.agent-card.speaking{
  border-color:rgba(52,211,153,.65);
  box-shadow:
    0 0 0 1px rgba(52,211,153,.08),
    0 0 40px rgba(52,211,153,.13);
}

.agent-card.thinking{
  border-color:rgba(167,139,250,.5);
}

.agent-top{
  display:flex;
  align-items:center;
  gap:9px;
}

.agent-avatar{
  width:48px;
  height:48px;
  flex:0 0 48px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-size:24px;
  background:
    radial-gradient(
      circle at 35% 25%,
      rgba(255,255,255,.22),
      rgba(255,255,255,.04)
    );
  border:1px solid rgba(255,255,255,.10);
  overflow:hidden;
  position:relative;
}

.agent-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.agent-info{
  min-width:0;
}

.agent-name{
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.agent-role{
  font-size:9px;
  color:var(--muted);
  margin-top:3px;
}

.agent-status{
  margin-left:auto;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#64748b;
}

.agent-status.listening{
  background:#64748b;
}

.agent-status.thinking{
  background:var(--purple);
  box-shadow:0 0 12px var(--purple);
  animation:pulse 1s infinite;
}

.agent-status.speaking{
  background:var(--green);
  box-shadow:0 0 13px var(--green);
  animation:pulse .65s infinite;
}

.agent-status.done{
  background:var(--blue);
}

@keyframes pulse{
  0%,100%{
    transform:scale(.8);
    opacity:.55;
  }
  50%{
    transform:scale(1.25);
    opacity:1;
  }
}

.agent-position{
  margin-top:9px;
  padding:7px 9px;
  border-radius:9px;
  background:rgba(255,255,255,.035);
  color:#b9c6d9;
  font-size:9px;
  line-height:1.4;
}

.agent-speech{
  margin-top:8px;
  min-height:62px;
  max-height:95px;
  overflow:auto;
  color:#e7edf7;
  font-size:11px;
  line-height:1.55;
}

.agent-speech::-webkit-scrollbar{
  width:2px;
}

.agent-speech::-webkit-scrollbar-thumb{
  background:#334155;
}

.agent-footer{
  position:absolute;
  bottom:9px;
  left:10px;
  right:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.agent-round{
  font-size:8px;
  color:#64748b;
}

.agent-thinking{
  font-size:8px;
  color:#9aa8bd;
}

@media(min-width:850px){
  .agent-grid{
    grid-template-columns:repeat(5,minmax(0,1fr));
  }

  .agent-card{
    min-height:230px;
  }
}

/* ============================================================
   TRANSCRIPT
============================================================ */

.transcript{
  margin-top:12px;
  background:rgba(8,14,27,.85);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
}

.transcript-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:11px 13px;
  border-bottom:1px solid var(--border);
}

.transcript-title{
  font-size:12px;
  font-weight:800;
}

.transcript-body{
  max-height:270px;
  overflow:auto;
  padding:10px;
}

.transcript-empty{
  text-align:center;
  padding:25px 10px;
  color:var(--muted);
  font-size:11px;
}

.message{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.message.owner{
  flex-direction:row-reverse;
}

.message-avatar{
  width:28px;
  height:28px;
  flex:0 0 28px;
  border-radius:9px;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.06);
  font-size:13px;
}

.message-box{
  max-width:82%;
  padding:8px 10px;
  border-radius:11px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.06);
}

.message.owner .message-box{
  background:rgba(77,163,255,.12);
  border-color:rgba(77,163,255,.18);
}

.message-name{
  font-size:9px;
  color:#8fa1b8;
  margin-bottom:3px;
}

.message-content{
  font-size:11px;
  line-height:1.5;
}

/* ============================================================
   CONTROL ROW
============================================================ */

.control-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-top:12px;
}

.control-btn{
  min-height:43px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.04);
  color:#e5e7eb;
  border-radius:12px;
  font-size:11px;
  font-weight:700;
}

.control-btn:active{
  transform:scale(.97);
}

.control-btn.primary{
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  border-color:transparent;
}

.control-btn.approve{
  background:linear-gradient(135deg,#059669,#10b981);
  border-color:transparent;
}

.control-btn.danger{
  color:#fecaca;
  border-color:rgba(251,113,133,.25);
  background:rgba(251,113,133,.06);
}

/* ============================================================
   OVERLAYS
============================================================ */

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(14px);
}

.overlay.visible{
  display:flex;
}

.dialog{
  width:min(520px,100%);
  max-height:85vh;
  overflow:auto;
  background:#0b1220;
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:0 30px 100px rgba(0,0,0,.65);
  padding:18px;
}

.dialog h2{
  margin:0 0 8px;
  font-size:18px;
}

.dialog p{
  color:#9aa8bd;
  font-size:12px;
  line-height:1.6;
}

.dialog-actions{
  display:flex;
  gap:8px;
  margin-top:16px;
}

.dialog-actions button{
  flex:1;
  min-height:44px;
  border-radius:12px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.05);
  color:white;
}

.dialog-actions .confirm{
  background:linear-gradient(135deg,#059669,#10b981);
  border:0;
}

.history-item{
  padding:13px;
  margin-bottom:8px;
  border:1px solid var(--border);
  border-radius:13px;
  background:rgba(255,255,255,.035);
}

.history-item .title{
  font-size:12px;
  font-weight:700;
}

.history-item .meta{
  margin-top:5px;
  font-size:9px;
  color:var(--muted);
}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(25px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px);
  z-index:300;
  opacity:0;
  pointer-events:none;
  padding:10px 15px;
  border-radius:999px;
  background:rgba(15,23,42,.95);
  border:1px solid rgba(255,255,255,.12);
  color:white;
  font-size:11px;
  transition:.25s ease;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ============================================================
   VOICE
============================================================ */

.voice-indicator{
  position:fixed;
  top:72px;
  right:12px;
  z-index:80;
  display:none;
  align-items:center;
  gap:7px;
  padding:7px 10px;
  border-radius:999px;
  background:rgba(5,9,20,.9);
  border:1px solid rgba(52,211,153,.3);
  color:#86efac;
  font-size:9px;
}

.voice-indicator.visible{
  display:flex;
}

.voice-bars{
  display:flex;
  align-items:flex-end;
  gap:2px;
  height:13px;
}

.voice-bars span{
  width:2px;
  background:#34d399;
  animation:voiceBar .55s infinite alternate;
}

.voice-bars span:nth-child(2){
  animation-delay:.12s;
}

.voice-bars span:nth-child(3){
  animation-delay:.25s;
}

@keyframes voiceBar{
  from{height:3px}
  to{height:13px}
}

/* ============================================================
   STARTUP
============================================================ */

.startup{
  text-align:center;
}

.startup-logo{
  width:65px;
  height:65px;
  margin:0 auto 16px;
  border-radius:20px;
  display:grid;
  place-items:center;
  font-size:29px;
  background:
    radial-gradient(circle at 35% 25%,#62eaff,#275eff 48%,#08122c);
  box-shadow:0 0 50px rgba(49,215,255,.28);
}

.startup h2{
  margin-bottom:7px;
}

.startup p{
  margin:0;
}

/* ============================================================
   RESPONSIVE
============================================================ */

@media(max-width:430px){
  .agent-card{
    min-height:184px;
  }

  .agent-avatar{
    width:44px;
    height:44px;
    flex-basis:44px;
  }

  .agent-name{
    font-size:11px;
  }

  .agent-speech{
    font-size:10px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- ========================================================
       TOP BAR
  ========================================================= -->

  <header class="topbar">

    <div class="brand">

      <button
        id="btnBackHome"
        class="icon-btn"
        aria-label="返回首頁">
        ←
      </button>

      <div class="brand-mark">
        AI
      </div>

      <div class="brand-text">
        <div class="brand-title">
          AIVAULT WAR ROOM
        </div>

        <div class="brand-sub">
          AI MULTI-AGENT GOVERNANCE
        </div>
      </div>

    </div>

    <div class="top-actions">

      <button
        id="btnLang"
        class="icon-btn"
        title="語言">
        中
      </button>

      <button
        id="btnViewHistory"
        class="icon-btn"
        title="歷史紀錄">
        ◷
      </button>

    </div>

  </header>


  <!-- ========================================================
       STATUS
  ========================================================= -->

  <section class="statusbar">

    <div class="status-left">

      <span
        id="liveDot"
        class="live-dot">
      </span>

      <span
        id="statusText"
        class="status-text">
        等待 Owner 提出問題
      </span>

    </div>

    <div
      id="roundInfo"
      class="round-info">
      Round 0 / 6
    </div>

  </section>


  <!-- ========================================================
       OWNER
  ========================================================= -->

  <section class="owner-panel">

    <div class="owner-head">

      <div class="owner-label">
        <span>👤</span>
        <span>OWNER</span>

        <span class="owner-badge">
          COMMANDER
        </span>
      </div>

      <span
        id="meetingIdLabel"
        style="font-size:9px;color:var(--muted);">
        尚未建立會議
      </span>

    </div>


    <div class="owner-input-row">

      <textarea
        id="ownerInput"
        rows="1"
        placeholder="輸入問題，讓 5 個 AI 開始討論……"></textarea>

      <button
        id="btnSend"
        class="send-btn">
        ➤
      </button>

    </div>


    <div class="owner-tools">

      <button
        id="btnMic"
        class="tool-btn">
        🎙️ 語音
      </button>

      <button
        id="btnHideKeyboard"
        class="tool-btn">
        ⌨️ 收起鍵盤
      </button>

      <button
        id="btnTranscript"
        class="tool-btn">
        📜 討論紀錄
      </button>

      <button
        id="btnHistory"
        class="tool-btn">
        🗂️ 歷史
      </button>

    </div>

  </section>


  <!-- ========================================================
       WAR ROOM
  ========================================================= -->

  <main>

    <section class="room">

      <div class="room-title">

        <strong>
          五人 AI 決策會議
        </strong>

        <span>
          INDEPENDENT AGENTS
        </span>

      </div>


      <div
        id="agentGrid"
        class="agent-grid">

      </div>

    </section>


    <!-- ======================================================
         TRANSCRIPT
    ======================================================= -->

    <section
      id="transcript"
      class="transcript">

      <div class="transcript-head">

        <div class="transcript-title">
          即時討論紀錄
        </div>

        <button
          id="btnCloseTranscript"
          class="tool-btn">
          關閉
        </button>

      </div>

      <div
        id="transcriptBody"
        class="transcript-body">

        <div class="transcript-empty">
          尚無討論紀錄
        </div>

      </div>

    </section>


    <!-- ======================================================
         CONTROLS
    ======================================================= -->

    <div
      id="controlRow"
      class="control-row">

      <button
        id="btnPause"
        class="control-btn">
        暫停
      </button>

      <button
        id="btnNextRound"
        class="control-btn primary">
        下一輪
      </button>

      <button
        id="btnApprove"
        class="control-btn approve">
        批准
      </button>

      <button
        id="btnStop"
        class="control-btn danger">
        結束
      </button>

    </div>

  </main>

</div>


<!-- ==========================================================
     VOICE INDICATOR
=========================================================== -->

<div
  id="voiceIndicator"
  class="voice-indicator">

  <div class="voice-bars">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <span id="voiceAgentName">
    AI 正在說話
  </span>

</div>


<!-- ==========================================================
     START OVERLAY
=========================================================== -->

<div
  id="overlayStart"
  class="overlay visible">

  <div class="dialog startup">

    <div class="startup-logo">
      AI
    </div>

    <h2>
      AIVAULT WAR ROOM
    </h2>

    <p>
      五個獨立 AI 將針對 Owner 的問題<br>
      分別提出自己的觀點、質疑、風險與建議。
    </p>

    <div class="dialog-actions">

      <button
        id="btnStartNew"
        class="confirm">
        開始會議
      </button>

    </div>

  </div>

</div>


<!-- ==========================================================
     APPROVE
=========================================================== -->

<div
  id="overlayDecision"
  class="overlay">

  <div class="dialog">

    <h2>
      批准最終決策
    </h2>

/* ============================================================
   VOICE ENGINE
   ------------------------------------------------------------
   重點：

   iOS Safari / 部分瀏覽器第一次使用 speechSynthesis 時，
   voice list 尚未完成，因此不能等到第五輪才處理。

   這裡：
   1. 頁面載入時預先取得 voices
   2. 開始會議的使用者點擊事件立即 unlock
   3. 第一個 Agent 發言前再次確保 voices ready
   4. 每個 Agent 都有自己的 voice profile
============================================================ */

let availableVoices = [];

let audioUnlocked = false;

let currentUtterance = null;

function loadVoices(){

  availableVoices =
    window.speechSynthesis
      ? window.speechSynthesis.getVoices()
      : [];

  return availableVoices;

}

if("speechSynthesis" in window){

  loadVoices();

  speechSynthesis.onvoiceschanged =
    ()=>{
      loadVoices();
    };

}


/* ------------------------------------------------------------
   找最適合的中文聲音
------------------------------------------------------------ */

function findVoice(agent){

  const voices =
    availableVoices.length
      ? availableVoices
      : loadVoices();

  if(!voices.length){
    return null;
  }


  const preferred =
    agent.voiceProfile.preferred || [];


  /* 第一優先：指定名稱 */

  for(const wanted of preferred){

    const found =
      voices.find(v =>
        v.name
          .toLowerCase()
          .includes(wanted.toLowerCase())
      );

    if(found){
      return found;
    }

  }


  /* 第二優先：中文 */

  const zhVoices =
    voices.filter(v =>
      /^zh/i.test(v.lang) ||
      /chinese|中文|mandarin|普通話/i.test(v.name)
    );


  /*
    第三優先：
    依 Agent 固定索引分配。

    即使系統只有少量中文 voice，
    五個 Agent 仍然不會全部拿同一個設定。
  */

  if(zhVoices.length){

    const index =
      AGENTS.indexOf(agent) %
      zhVoices.length;

    return zhVoices[index];

  }


  /* 最後才使用系統預設 */

  return voices[0] || null;

}


/* ------------------------------------------------------------
   Audio unlock
------------------------------------------------------------ */

function unlockAudio(){

  if(audioUnlocked){
    return;
  }

  audioUnlocked = true;

  loadVoices();

  /*
    不播放空白音。
    iOS 對空白 utterance 有時不視為真正的語音解鎖。

    這裡只建立 speech engine 狀態，
    真正第一個 Agent 發言仍然會在使用者開始會議後播放。
  */

  try{
    speechSynthesis.resume();
  }catch(e){}

}


/* ------------------------------------------------------------
   語音播放
------------------------------------------------------------ */

function speakAgent(agent,text){

  return new Promise(resolve=>{

    if(
      !("speechSynthesis" in window) ||
      !text ||
      state.status === "paused"
    ){
      resolve();
      return;
    }


    unlockAudio();

    loadVoices();


    /*
      確保上一個 Agent 已停止，
      不讓五個聲音重疊。
    */

    try{
      speechSynthesis.cancel();
    }catch(e){}


    const utterance =
      new SpeechSynthesisUtterance(text);


    const voice =
      findVoice(agent);


    if(voice){

      utterance.voice = voice;

    }


    /*
      國語優先
    */

    utterance.lang =
      voice && /^zh/i.test(voice.lang)
        ? voice.lang
        : "zh-TW";


    /*
      每個 Agent 有自己的音高與速度。
      如果系統真的提供男女聲，
      優先使用對應 voice；
      如果系統沒有，
      至少保持五個 Agent 聽起來不同。
    */

    utterance.pitch =
      agent.voiceProfile.pitch;

    utterance.rate =
      agent.voiceProfile.rate;

    utterance.volume = 1;


    currentUtterance =
      utterance;


    const indicator =
      $("voiceIndicator");

    const agentName =
      $("voiceAgentName");


    if(indicator){

      indicator.classList.add("visible");

    }

    if(agentName){

      agentName.textContent =
        `${agent.name} · ${agent.role}`;

    }


    setAgentStatus(
      agent.id,
      "speaking"
    );


    utterance.onend = ()=>{

      setAgentStatus(
        agent.id,
        "done"
      );

      if(indicator){

        indicator.classList.remove("visible");

      }

      currentUtterance = null;

      resolve();

    };


    utterance.onerror = ()=>{

      setAgentStatus(
        agent.id,
        "done"
      );

      if(indicator){

        indicator.classList.remove("visible");

      }

      currentUtterance = null;

      resolve();

    };


    try{

      speechSynthesis.speak(
        utterance
      );

      /*
        iOS Safari 某些版本在第一次 speak 後
        queue 會處於 paused 狀態。
      */

      setTimeout(()=>{
        try{
          speechSynthesis.resume();
        }catch(e){}
      },80);

    }catch(e){

      console.warn(
        "Speech synthesis error:",
        e
      );

      resolve();

    }

  });

}


/* ============================================================
   STOP VOICE
============================================================ */

function stopVoice(){

  try{

    if("speechSynthesis" in window){

      speechSynthesis.cancel();

      speechSynthesis.resume();

    }

  }catch(e){}

  currentUtterance = null;

  $("voiceIndicator")
    ?.classList.remove("visible");

}


/* ============================================================
   THINKING MODEL
   ------------------------------------------------------------
   重要：

   這裡不是顯示 AI 的私人 chain-of-thought。

   War Room 顯示的是：
   「公開判斷摘要」

   每個 Agent 都有不同的：
   - 立場

/* ============================================================
   內容解析
============================================================ */

function extractKeywords(topic){

  const clean =
    topic
      .replace(/[，。！？、,.!?]/g," ")
      .trim();

  const words =
    clean
      .split(/\s+/)
      .filter(Boolean);

  return words.slice(0,8);

}


/* ============================================================
   Agent 公開分析生成器
============================================================ */

function generateAgentResponse(
  agent,
  topic,
  round,
  previousStatements
){

  const keywords =
    extractKeywords(topic);

  const key =
    keywords.length
      ? keywords.join("、")
      : "目前議題";


  const previous =
    previousStatements.length
      ? previousStatements[
          previousStatements.length - 1
        ]
      : "";


  /*
    每個 Agent 的內容結構完全不同。
  */

  if(agent.id === "strategist"){

    if(round === 1){

      return `
我的第一個判斷是，這個問題不能只看眼前功能。
我會先把「${key}」放進 AIVAULT 的長期產品架構來看。
如果現在的決策會限制未來 Agent、模組或商業流程，我不建議直接定死。
目前我的方向是先建立可擴充的核心，再把具體功能模組化。
`.trim();

    }

    return `
我重新檢視前面的討論後，仍然認為核心問題是長期可擴充性。
${previous ? "前一位的觀點有價值，但我認為不能因此犧牲整體架構。" : ""}
如果要推進，我建議把目前決策分成「現在必做」與「未來可替換」兩層。
這樣 AIVAULT 才不會因為一次決策而被綁死。
`.trim();

  }


  if(agent.id === "engineer"){

    if(round === 1){

      return `
我先從技術面拆解。
目前最需要確認的不是畫面，而是資料流、Agent 狀態、API 邊界與失敗處理。
「${key}」如果要真正進入系統，必須能被保存、追蹤、重試，而且不能讓前端直接掌握敏感金鑰。
我的結論是：可以做，但要先把核心服務邊界定清楚。
`.trim();

    }

    return `
我不同意把這件事只當成產品功能。
前面的討論如果沒有考慮資料一致性與錯誤恢復，實際部署後會出問題。
我建議保留目前 War Room 介面，但讓每個 Agent 的狀態、訊息與決策都變成獨立資料。
這樣未來接真正 AI API 時，不需要重寫房間。
`.trim();

  }


  if(agent.id === "critic"){

    if(round === 1){

      return `
我先反對過快通過。
目前至少有三個風險需要被確認：權限、資料保存，以及錯誤決策造成的後果。
尤其是「${key}」，如果沒有明確的批准門檻，AI 的建議可能被誤認成最終決策。
我的立場是可以繼續研究，但現在不應直接批准。
`.trim();

    }

    return `
我要挑戰前面的結論。
如果我們只是因為「可以實作」就認為「可以上線」，這是錯誤的。
真正需要問的是：出了問題誰能停止、誰能追蹤、誰能回溯。
因此我要求把審批與 Audit Log 保留在流程核心，而不是事後補。
`.trim();

  }


  if(agent.id === "product"){

    if(round === 1){

      return `
我從使用者角度看，這個方案最大的問題是使用者到底能不能理解。
如果五個 AI 只是輪流說話，Owner 不會覺得這是一個真正的決策團隊。
所以我支持把每個 Agent 的角色、立場與不同意見清楚呈現。
產品價值不是 AI 越多越好，而是 Owner 能看懂誰支持、誰反對、為什麼。
`.trim();

    }

    return `
我同意技術與風險需要處理，但我要提醒大家不要把產品做成工程控制台。
Owner 最後需要的是「我現在應該做什麼」。
所以每一輪討論之後，應該留下清楚的判斷摘要，而不是大量無法閱讀的內容。
`.trim();

  }


  if(agent.id === "researcher"){

    if(round === 1){

      return `
我目前不會急著支持任何一方。
因為現階段我們知道的是方案方向，但還缺少足夠證據驗證實際效果。
我建議把未知事項列出來，再針對關鍵問題做 Research。
對「${key}」而言，最重要的是區分已確認資訊、假設，以及尚未驗證的部分。
`.trim();

    }

    return `
我重新整理目前五方觀點。
戰略關注長期性，工程關注落地，風險官關注失誤，產品關注使用者，而我關注證據。
目前最大的缺口不是更多意見，而是哪些結論已經被實際驗證。
因此下一步應該針對爭議最大的項目取得證據。
`.trim();

  }


  return `
我會從自己的職責重新評估目前議題。
目前不建議直接下最終決策，應先確認關鍵條件。
`.trim();

}


/* ============================================================
   產生 Agent 對前一位的回應
============================================================ */

function generateDebateResponse(
  agent,
  topic,
  round,
  previousAgent,
  previousText
){

  if(!previousAgent || !previousText){

    return generateAgentResponse(
      agent,
      topic,
      round,
      []
    );

  }


  if(agent.id === "critic"){

    return `
我不同意 ${previousAgent.name} 把目前方案直接視為可接受。
${previousText.slice(0,90)}
這段觀點解決了部分問題，但沒有回答風險發生時誰負責。
我的要求是增加明確的 Governance Gate，再進入下一階段。
`.trim();

  }


  if(agent.id === "engineer"){

    return `
我補充 ${previousAgent.name} 的觀點，但從實作角度要修正一點。
${previousText.slice(0,90)}
如果要落地，這個結論必須轉成清楚的 API、資料結構與狀態流程。
否則現在的共識仍然只是概念。
`.trim();

  }


  if(agent.id === "product"){

    return `
我部分同意 ${previousAgent.name}，但我不認為技術或風險本身就是產品答案。
${previousText.slice(0,90)}
Owner 最後仍然需要一個簡單、可理解的決策結果。
所以我支持保留這個方向，但必須降低使用者操作複雜度。
`.trim();

  }


  if(agent.id === "researcher"){

    return `
我認為 ${previousAgent.name} 的判斷有一個需要驗證的前提。
${previousText.slice(0,90)}
目前這個前提還不能當成事實。
我建議把它列為待驗證事項，避免團隊把假設當成共識。
`.trim();

  }


  if(agent.id === "strategist"){

    return `
我理解 ${previousAgent.name} 的顧慮，但我會把視角拉回整體。
${previousText.slice(0,90)}
如果現在只解決局部問題，未來反而可能增加重構成本。
因此我支持保留這個方向，但架構必須允許後續替換。
`.trim();

  }


  return generateAgentResponse(
    agent,
    topic,
    round,
    [previousText]
  );

}


/* ============================================================
   RUN ONE ROUND
============================================================ */

async function runNextRound(){

  if(!state.meetingId){

    toast("請先建立會議");

    return;

  }


  if(
    state.status === "paused" ||
    state.status === "completed"
  ){

    return;

  }


  if(state.round >= state.maxRounds){

    toast("已完成最大討論輪數");

    return;

  }


  stopVoice();


  state.round++;

  state.status = "active";

  updateRoundUI();


  const statementsThisRound = [];

  let previousAgent = null;

  let previousText = "";


  for(const agent of AGENTS){

    if(state.status !== "active"){

      break;

    }


    /*
      Agent 進入思考狀態
    */

    setAgentStatus(
      agent.id,
      "thinking"
    );


    $("statusText").textContent =
      `${agent.name} 正在分析其他 Agent 的觀點…`;


    /*
      不顯示私人 chain-of-thought。
      只顯示短暫的公開狀態。
    */

    await delay(
      650 + Math.random()*600
    );


    if(state.status !== "active"){

      break;

    }


    let response;


    if(roundIsFirstForAgent(agent)){

      response =
        generateAgentResponse(
          agent,
          state.topic,
          state.round,
          statementsThisRound
        );

    }else{

      response =
        generateDebateResponse(
          agent,
          state.topic,
          state.round,
          previousAgent,
          previousText
        );

    }


    /*
      儲存自己的獨立觀點
    */

    setAgentStatement(
      agent.id,
      response
    );


    addTranscriptMessage({
      role:agent.name,
      content:response,
      isOwner:false,
      agentId:agent.id
    });


    statementsThisRound.push(
      response
    );


    previousAgent = agent;

    previousText = response;


    /*
      第一輪也會真正播放。
    */

    await speakAgent(
      agent,
      response
    );


    if(state.status !== "active"){

      break;

    }


    setAgentStatus(
      agent.id,
      "done"
    );


    await delay(300);

  }


  if(state.status === "active"){

    $("statusText").textContent =
      `Round ${state.round} 完成，等待 Owner 指示`;

  }


  saveMeeting();

}


/* ============================================================
   FIRST ROUND CHECK
============================================================ */

function roundIsFirstForAgent(agent){

  const count =
    state.transcript.filter(
      x => x.agentId === agent.id
    ).length;

  return count === 0;

}


/* ============================================================
   DELAY
============================================================ */

function delay(ms){

  return new Promise(
    resolve =>
      setTimeout(resolve,ms)
  );

}


/* ============================================================
   START MEETING
============================================================ */

function startMeeting(topic){

  const clean =
    String(topic || "").trim();

  if(!clean){

    toast("請先輸入問題");

    return;

  }


  /*
    非常重要：
    startMeeting 是由 Owner 按鈕觸發。
    這個 click context 會拿來解鎖 speechSynthesis。
  */

  unlockAudio();


  stopVoice();


  state.meetingId =
    uid("meeting");

  state.status =
    "active";

  state.round =
    0;

  state.topic =
    clean;

  state.transcript =
    [];

  state.currentSpeaker =
    null;

  state.agentLastStatements =
    {};

  state.startedAt =
    nowText();

  state.updatedAt =
    nowText();

  AGENTS.forEach(agent=>{

    state.agentStates[agent.id] =
      "listening";

    state.agentLastStatements[agent.id] =
      "等待本輪議題。";

  });


  $("meetingIdLabel").textContent =
    state.meetingId.slice(-10);


  $("overlayStart")
    .classList.remove("visible");


  $("controlRow")
    .style.display = "grid";


  renderAgents();

  renderTranscript();

  updateRoundUI();


  addTranscriptMessage({

    role:"Owner",

    content:clean,

    isOwner:true,

    agentId:null

  });


  $("statusText").textContent =
    "五個 Agent 正在準備第一輪分析…";


  saveMeeting();


  /*
    第一輪立刻開始。
  */

  setTimeout(
    ()=>{
      runNextRound();
    },
    100
  );

}


/* ============================================================
   PAUSE / RESUME
============================================================ */

function togglePause(){

  if(state.status === "completed"){

    return;

  }


  if(state.status === "paused"){

    state.status =
      "active";

    $("btnPause").textContent =
      "暫停";

    $("statusText").textContent =
      "已恢復，繼續 AI 討論";

    try{
      speechSynthesis.resume();
    }catch(e){}

    toast("會議已恢復");

    return;

  }


  state.status =
    "paused";


  try{
    speechSynthesis.pause();
  }catch(e){}


  $("btnPause").textContent =
    "繼續";


  $("statusText").textContent =
    "會議已暫停";


  toast("會議已暫停");

}


/* ============================================================
   COMPLETE
============================================================ */

function completeMeeting(reason){

  state.status =
    "completed";

  state.updatedAt =
    nowText();

  state.decision =
    reason || "meeting_completed";


  stopVoice();


  $("controlRow")
    .style.display = "none";


  AGENTS.forEach(agent=>{

    setAgentStatus(
      agent.id,
      "listening"
    );

  });


  $("statusText").textContent =
    "會議已結束";


  saveMeeting();

}


/* ============================================================
   APPROVE
============================================================ */

function approveMeeting(){

  state.decision =
    "approved";

  addTranscriptMessage({

    role:"Owner",

    content:"✅ Owner 批准目前最終決策。",

    isOwner:true

  });


  completeMeeting(
    "approved"
  );


  toast(
    "決策已批准，會議完成"
  );

}


/* ============================================================
   HISTORY STORAGE
============================================================ */

const STORAGE_KEY =
  "AIVAULT_WAR_ROOM_HISTORY_V2";


function getHistory(){

  try{

    return JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      ) || "[]"
    );

  }catch(e){

    return [];

  }

}


function saveMeeting(){

  if(!state.meetingId){

    return;

  }


  state.updatedAt =
    nowText();


  const record = {

    meetingId:
      state.meetingId,

    topic:
      state.topic,

    status:
      state.status,

    round:
      state.round,

    maxRounds:
      state.maxRounds,

    decision:
      state.decision,

    startedAt:
      state.startedAt,

    updatedAt:
      state.updatedAt,

    transcript:
      state.transcript

  };


  let history =
    getHistory();


  const index =
    history.findIndex(
      item =>
        item.meetingId ===
        state.meetingId
    );


  if(index >= 0){

    history[index] =
      record;

  }else{

    history.unshift(
      record
    );

  }


  /*
    最多保留 50 場，
    避免手機 localStorage 過大。
  */

  history =
    history.slice(0,50);


  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(history)
    );

  }catch(e){

    console.warn(
      "localStorage save failed",
      e
    );

  }


  /*
    如果設定 Supabase，
    再非同步同步。
  */

  syncMeetingToSupabase(
    record
  );

}


/* ============================================================
   SUPABASE OPTIONAL SYNC
============================================================ */

async function syncMeetingToSupabase(record){

  if(
    !SUPABASE_URL ||
    !SUPABASE_ANON_KEY
  ){

    return;

  }


  /*
    預留資料表：
    war_room_meetings

    建議欄位：

    id
    topic
    status
    round
    decision
    started_at
    updated_at
    transcript jsonb

    這裡不阻塞 War Room。
  */

  try{

    await fetch(
      `${SUPABASE_URL}/rest/v1/war_room_meetings`,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json",

          "apikey":
            SUPABASE_ANON_KEY,

          "Authorization":
            `Bearer ${SUPABASE_ANON_KEY}`,

          "Prefer":
            "resolution=merge-duplicates"
        },

        body:JSON.stringify({

          id:
            record.meetingId,

          topic:
            record.topic,

          status:
            record.status,

          round:
            record.round,

          decision:
            record.decision,

          started_at:
            record.startedAt,

          updated_at:
            record.updatedAt,

          transcript:
            record.transcript

        })

      }
    );

  }catch(error){

    console.warn(
      "Supabase sync unavailable:",
      error
    );

  }

}

/* ============================================================
   LOAD HISTORY
============================================================ */

function loadHistoryMeeting(id){

  const history =
    getHistory();

  const record =
    history.find(
      item =>
        item.meetingId === id
    );


  if(!record){

    toast("找不到會議");

    return;

  }


  state.meetingId =
    record.meetingId;

  state.topic =
    record.topic;

  state.status =
    record.status;

  state.round =
    record.round;

  state.maxRounds =
    record.maxRounds || 6;

  state.decision =
    record.decision;

  state.startedAt =
    record.startedAt;

  state.updatedAt =
    record.updatedAt;

  state.transcript =
    record.transcript || [];


  AGENTS.forEach(agent=>{

    const messages =
      state.transcript.filter(
        item =>
          item.agentId ===
          agent.id
      );

    const last =
      messages[messages.length-1];

    state.agentLastStatements[
      agent.id
    ] =
      last
        ? last.content
        : "此 Agent 尚無發言。";

  });


  $("meetingIdLabel").textContent =
    state.meetingId.slice(-10);


  renderAgents();

  renderTranscript();

  updateRoundUI();


  $("overlayHistory")
    .classList.remove("visible");


  toast(
    "已載入歷史會議"
  );

}

/* ============================================================
   SPEECH RECOGNITION
============================================================ */

let recognition =
  null;

let recognizing =
  false;


function getRecognition(){

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SR){

    return null;

  }


  if(recognition){

    return recognition;

  }


  recognition =
    new SR();


  recognition.continuous =
    false;

  recognition.interimResults =
    true;

  recognition.maxAlternatives =
    1;

  recognition.lang =
    "zh-TW";


  recognition.onstart =
    ()=>{

      recognizing = true;

      $("btnMic").textContent =
        "🔴 收音中";

    };


  recognition.onend =
    ()=>{

      recognizing = false;

      $("btnMic").textContent =
        "🎙️ 語音";

    };


  recognition.onerror =
    event=>{

      recognizing = false;

      $("btnMic").textContent =
        "🎙️ 語音";

      console.warn(
        "Speech recognition:",
        event.error
      );

    };


  recognition.onresult =
    event=>{

      let finalText = "";

      let interim = "";


      for(
        let i =
          event.resultIndex;

        i <
          event.results.length;

        i++
      ){

        const result =
          event.results[i];


        if(result.isFinal){

          finalText +=
            result[0].transcript;

        }else{

          interim +=
            result[0].transcript;

        }

      }


      if(interim){

        $("ownerInput").value =
          interim;

      }


      if(finalText.trim()){

        $("ownerInput").value =
          finalText.trim();

        $("btnSend").click();

      }

    };


  return recognition;

}


function updateRecognitionLanguage(){

  if(!recognition){

    return;

  }


  recognition.lang =
    uiLang === "en"
      ? "en-US"
      : "zh-TW";

}


function startListen(){

  unlockAudio();

  const rec =
    getRecognition();


  if(!rec){

    alert(
      "此瀏覽器不支援語音辨識，請使用文字輸入。"
    );

    return;

  }


  if(recognizing){

    rec.stop();

    return;

  }


  updateRecognitionLanguage();


  try{

    rec.start();

  }catch(error){

    console.warn(error);

  }

}


/* ============================================================
   EVENTS
============================================================ */

function bindEvents(){


  /* 返回首頁 */

  $("btnBackHome")
    .addEventListener(
      "click",
      ()=>{
        location.href =
          "aivault-home.html";
      }
    );


  /* Owner Send */

  $("btnSend")
    .addEventListener(
      "click",
      ()=>{

        const text =
          $("ownerInput")
            .value
            .trim();


        if(!text){

          return;

        }


        unlockAudio();


        /*
          尚未建立會議
        */

        if(
          state.status === "idle" ||
          !state.meetingId
        ){

          startMeeting(
            text
          );

        }else{

          /*
            會議中的 Owner 補充意見
          */

          addTranscriptMessage({

            role:"Owner",

            content:text,

            isOwner:true

          });


          state.topic +=
            "\nOwner補充：" +
            text;


          $("statusText").textContent =
            "已收到 Owner 補充意見";


          toast(
            "已送出補充意見"
          );

        }


        $("ownerInput").value = "";

        $("ownerInput").style.height =
          "auto";

      }
    );


  /* Enter */

  $("ownerInput")
    .addEventListener(
      "keydown",
      event=>{

        if(
          event.key === "Enter" &&
          !event.shiftKey
        ){

          event.preventDefault();

          $("btnSend").click();

        }

      }
    );


  /* Auto resize */

  $("ownerInput")
    .addEventListener(
      "input",
      function(){

        this.style.height =
          "auto";

        this.style.height =
          Math.min(
            this.scrollHeight,
            110
          ) + "px";

      }
    );


  /* Next Round */

  $("btnNextRound")
    .addEventListener(
      "click",
      ()=>{

        unlockAudio();

        runNextRound();

    );

    .addEventListener(

    );

        }

        $("overlayDecision")

    );


  /*
    點房間空白處收鍵盤
  */

  document
    .querySelector("main")
    ?.addEventListener(
      "pointerdown",
      event=>{

        if(
          event.target.closest(
            ".owner-panel"
          )
        ){

          return;

        }


        if(
          event.target.closest(
            "textarea,input,button,a"
          )
        ){

          return;

        }


        hideKeyboard();

      }
    );


  /*
    iPhone 防止整頁亂滑。
    允許 transcript 與 textarea 自己滑。
  */

  document.addEventListener(
    "touchmove",
    event=>{

      let el =
        event.target;


      while(
        el &&
        el !== document.body
      ){

        if(
          el.classList &&
          (
            el.classList.contains(
              "transcript-body"
            ) ||
            el.classList.contains(
              "agent-speech"
            )
          )
        ){

          return;

        }


        if(
          el.tagName === "TEXTAREA"
        ){

          return;

        }


        el =
          el.parentElement;

      }


      event.preventDefault();

    },
    {
      passive:false
    }
  );


}

   INIT
============================================================ */
