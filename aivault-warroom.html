<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AIVAULT">

<title>AIVAULT · WAR ROOM</title>

<style>
:root{
  --bg:#05070d;
  --panel:#0b101a;
  --panel2:#101725;
  --line:rgba(255,255,255,.09);
  --text:#f4f7fb;
  --muted:#8994a8;
  --blue:#4da3ff;
  --cyan:#37d9ff;
  --green:#35d39a;
  --yellow:#f7c948;
  --red:#ff5d73;
  --purple:#9b7cff;
  --shadow:0 20px 60px rgba(0,0,0,.45);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;
}

button,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 50% -10%,rgba(55,217,255,.10),transparent 40%),
    radial-gradient(circle at 100% 100%,rgba(155,124,255,.08),transparent 35%),
    #05070d;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
  height:62px;
  min-height:62px;
  padding:
    env(safe-area-inset-top)
    14px
    0
    14px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  border-bottom:1px solid var(--line);
  background:rgba(5,7,13,.92);
  backdrop-filter:blur(20px);
  z-index:20;
}

.top-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.back-btn{
  width:38px;
  height:38px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#0b111b;
  color:#fff;
  font-size:19px;
}

.brand{
  display:flex;
  flex-direction:column;
  line-height:1.1;
}

.brand-title{
  font-size:15px;
  font-weight:800;
  letter-spacing:.8px;
}

.brand-sub{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
  letter-spacing:1.2px;
}

.top-right{
  display:flex;
  align-items:center;
  gap:7px;
}

.icon-btn{
  width:38px;
  height:38px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#0b111b;
  color:#fff;
  font-size:17px;
}

.icon-btn.active{
  border-color:var(--cyan);
  box-shadow:0 0 18px rgba(55,217,255,.18);
}

/* =========================================================
   STATUS
========================================================= */

.statusbar{
  height:36px;
  min-height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid var(--line);
  background:#080c14;
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:11px;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 10px var(--green);
}

.status.paused .status-dot{
  background:var(--yellow);
  box-shadow:0 0 10px var(--yellow);
}

.status.completed .status-dot{
  background:var(--red);
  box-shadow:0 0 10px var(--red);
}

/* =========================================================
   MAIN ROOM
========================================================= */

.room{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* =========================================================
   AI STAGE
========================================================= */

.ai-stage{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;

  padding:
    12px
    12px
    20px;

  -webkit-overflow-scrolling:touch;
}

.ai-stage::-webkit-scrollbar{
  width:3px;
}

.ai-stage::-webkit-scrollbar-thumb{
  background:#263246;
  border-radius:10px;
}

/* =========================================================
   MEETING HEADER
========================================================= */

.meeting-header{
  margin-bottom:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.meeting-title{
  font-size:14px;
  font-weight:800;
}

.round-info{
  color:var(--muted);
  font-size:11px;
}

/* =========================================================
   AI GRID
========================================================= */

.ai-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}

/*
  頭像刻意縮小。
  未來這個區域可以直接換成 video / AI avatar。
*/

.agent-card{
  position:relative;
  min-height:112px;

  border:1px solid var(--line);
  border-radius:16px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.012)
    );

  padding:9px;

  transition:
    border-color .2s,
    box-shadow .2s,
    transform .2s;

  overflow:hidden;
}

.agent-card.speaking{
  border-color:rgba(55,217,255,.7);
  box-shadow:
    0 0 0 1px rgba(55,217,255,.1),
    0 0 25px rgba(55,217,255,.12);
}

.agent-card.thinking{
  border-color:rgba(155,124,255,.65);
}

.agent-card.offline{
  opacity:.5;
}

.agent-top{
  display:flex;
  align-items:center;
  gap:8px;
}

/* 小頭像 */

.agent-avatar{
  width:46px;
  height:46px;
  min-width:46px;

  border-radius:12px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:24px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.10),
      rgba(255,255,255,.025)
    );

  border:1px solid rgba(255,255,255,.08);

  overflow:hidden;
}

.agent-avatar img,
.agent-avatar video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.agent-info{
  min-width:0;
}

.agent-name{
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.agent-role{
  color:var(--muted);
  font-size:9px;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.agent-state{
  margin-top:8px;
  display:flex;
  align-items:center;
  gap:5px;
  color:var(--muted);
  font-size:9px;
}

.agent-state-dot{
  width:5px;
  height:5px;
  border-radius:50%;
  background:#64748b;
}

.agent-card.speaking .agent-state-dot{
  background:var(--cyan);
  box-shadow:0 0 8px var(--cyan);
}

.agent-card.thinking .agent-state-dot{
  background:var(--purple);
  box-shadow:0 0 8px var(--purple);
}

.agent-card.speaking .agent-state{
  color:var(--cyan);
}

.agent-card.thinking .agent-state{
  color:#b9aaff;
}

/* =========================================================
   DIALOGUE
========================================================= */

.dialogue{
  margin-top:12px;

  border:1px solid var(--line);
  border-radius:16px;

  background:#080d16;

  overflow:hidden;
}

.dialogue-header{
  height:35px;
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 12px;

  border-bottom:1px solid var(--line);
}

.dialogue-title{
  font-size:11px;
  font-weight:800;
}

.dialogue-live{
  font-size:9px;
  color:var(--green);
}

.dialogue-box{
  min-height:90px;
  max-height:170px;

  overflow-y:auto;

  padding:10px;

  -webkit-overflow-scrolling:touch;
}

.dialogue-box::-webkit-scrollbar{
  width:3px;
}

.dialogue-box::-webkit-scrollbar-thumb{
  background:#263246;
}

.message{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.message.owner{
  justify-content:flex-end;
}

.message-bubble{
  max-width:88%;

  padding:8px 10px;

  border-radius:11px;

  background:#111a29;

  color:#dce5f2;

  font-size:11px;
  line-height:1.55;
}

.message.owner .message-bubble{
  background:#123a55;
  border:1px solid rgba(55,217,255,.18);
}

.message-meta{
  color:#65738a;
  font-size:8px;
  margin-bottom:3px;
}

/* =========================================================
   OWNER PANEL
========================================================= */

.owner-panel{
  padding:
    9px
    10px
    calc(10px + env(safe-area-inset-bottom));

  border-top:1px solid var(--line);

  background:
    linear-gradient(
      180deg,
      rgba(8,12,20,.98),
      rgba(5,7,13,1)
    );

  z-index:15;
}

.owner-label{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:7px;

  color:var(--muted);
  font-size:10px;
}

.owner-label strong{
  color:#fff;
  font-size:11px;
}

/* 真正的輸入區 */

.input-row{
  display:flex;
  align-items:flex-end;
  gap:7px;
}

.input-box{
  flex:1;
  min-width:0;

  display:flex;
  align-items:flex-end;

  border:1px solid rgba(255,255,255,.11);
  border-radius:14px;

  background:#0c121d;

  padding:7px 8px;
}

#ownerInput{
  width:100%;
  min-height:38px;
  max-height:90px;

  resize:none;
  overflow-y:auto;

  border:0;
  outline:0;

  background:transparent;
  color:#fff;

  font-size:14px;
  line-height:1.45;
}

#ownerInput::placeholder{
  color:#647187;
}

.send-btn{
  width:48px;
  height:48px;
  min-width:48px;

  border:0;
  border-radius:14px;

  background:linear-gradient(
    135deg,
    #188bff,
    #37d9ff
  );

  color:#03111d;

  font-size:20px;
  font-weight:900;

  box-shadow:0 8px 22px rgba(55,217,255,.18);
}

.owner-tools{
  display:flex;
  gap:6px;
  margin-top:7px;
}

.tool-btn{
  flex:1;

  min-height:34px;

  border:1px solid var(--line);
  border-radius:9px;

  background:#0b111b;

  color:#dbe5f2;

  font-size:10px;
}

.tool-btn:active{
  transform:scale(.97);
}

.tool-btn.danger{
  color:#ff8797;
}

.tool-btn.primary{
  color:var(--cyan);
}

.tool-btn.approve{
  color:var(--green);
}

/* =========================================================
   OVERLAYS
========================================================= */

.overlay{
  position:fixed;
  inset:0;

  display:none;
  align-items:center;
  justify-content:center;

  padding:18px;

  background:rgba(0,0,0,.68);

  backdrop-filter:blur(10px);

  z-index:100;
}

.overlay.visible{
  display:flex;
}

.modal{
  width:min(430px,100%);

  border:1px solid rgba(255,255,255,.12);
  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      #111827,
      #080d16
    );

  box-shadow:var(--shadow);

  overflow:hidden;
}

.modal-header{
  padding:15px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  border-bottom:1px solid var(--line);
}

.modal-title{
  font-weight:800;
  font-size:15px;
}

.close-btn{
  width:34px;
  height:34px;

  border:1px solid var(--line);
  border-radius:9px;

  background:#0a0f18;
  color:#fff;
}

.modal-body{
  padding:15px;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.modal-actions button{
  flex:1;
  height:42px;

  border:1px solid var(--line);
  border-radius:11px;

  background:#0b111b;
  color:#fff;
}

.modal-actions .confirm{
  background:#123e35;
  color:#65e3b2;
}

/* =========================================================
   START
========================================================= */

.start-logo{
  width:58px;
  height:58px;

  margin:0 auto 13px;

  border-radius:17px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid rgba(55,217,255,.3);

  background:
    radial-gradient(
      circle,
      rgba(55,217,255,.2),
      rgba(55,217,255,.03)
    );

  font-size:25px;
}

.start-text{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}

/* =========================================================
   HISTORY
========================================================= */

.history-list{
  max-height:55vh;
  overflow-y:auto;
}

.history-item{
  padding:12px;

  margin-bottom:7px;

  border:1px solid var(--line);
  border-radius:12px;

  background:#0b111b;
}

.history-item-title{
  font-size:12px;
  font-weight:800;
}

.history-item-meta{
  color:var(--muted);
  font-size:9px;
  margin-top:5px;
}

.history-empty{
  padding:25px 10px;
  text-align:center;
  color:var(--muted);
  font-size:11px;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;
  left:50%;
  bottom:125px;

  transform:
    translateX(-50%)
    translateY(20px);

  opacity:0;

  pointer-events:none;

  padding:9px 14px;

  border:1px solid var(--line);
  border-radius:10px;

  background:#101827;

  color:#fff;

  font-size:11px;

  z-index:300;

  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:380px){

  .ai-grid{
    gap:7px;
  }

  .agent-card{
    min-height:104px;
    padding:8px;
  }

  .agent-avatar{
    width:42px;
    height:42px;
    min-width:42px;
    font-size:21px;
  }

  .owner-tools{
    gap:4px;
  }

  .tool-btn{
    font-size:9px;
  }
}

@media(min-width:700px){

  .room{
    width:min(900px,100%);
    margin:0 auto;
  }

  .ai-grid{
    grid-template-columns:repeat(3,1fr);
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- =====================================================
       TOP BAR
  ====================================================== -->

  <header class="topbar">

    <div class="top-left">

      <button
        id="btnBackHome"
        class="back-btn"
        type="button">
        ←
      </button>

      <div class="brand">
        <div class="brand-title">
          AIVAULT WAR ROOM
        </div>

        <div class="brand-sub">
          AI GOVERNANCE · COLLABORATION
        </div>
      </div>

    </div>

    <div class="top-right">

      <button
        id="btnLang"
        class="icon-btn"
        type="button"
        title="語言">
        中
      </button>

      <button
        id="btnHistory"
        class="icon-btn"
        type="button"
        title="歷史會議">
        🕘
      </button>

    </div>

  </header>


  <!-- =====================================================
       STATUS
  ====================================================== -->

  <div class="statusbar">

    <div
      id="meetingStatus"
      class="status">

      <span class="status-dot"></span>

      <span id="statusText">
        等待 Owner 啟動會議
      </span>

    </div>

  </div>


  <!-- =====================================================
       ROOM
  ====================================================== -->

  <main class="room">

    <section
      id="aiStage"
      class="ai-stage">

      <div class="meeting-header">

        <div class="meeting-title">
          AI 協作會議室
        </div>

        <div
          id="roundInfo"
          class="round-info">
          Round 0 / 6
        </div>

      </div>


      <!-- =================================================
           AI AGENTS
      ================================================== -->

      <div
        id="agentGrid"
        class="ai-grid">
      </div>


      <!-- =================================================
           DIALOGUE
      ================================================== -->

      <section class="dialogue">

        <div class="dialogue-header">

          <div class="dialogue-title">
            即時會議內容
          </div>

          <div
            id="dialogueLive"
            class="dialogue-live">
            ● LIVE
          </div>

        </div>

        <div
          id="dialogueBox"
          class="dialogue-box">
        </div>

      </section>

    </section>


    <!-- ===================================================
         OWNER INPUT
    ==================================================== -->

    <section class="owner-panel">

      <div class="owner-label">

        <span>
          <strong>OWNER</strong>
          · 決策者
        </span>

        <span id="inputHint">
          輸入問題或指令
        </span>

      </div>


      <div class="input-row">

        <div class="input-box">

          <textarea
            id="ownerInput"
            rows="1"
            maxlength="2000"
            placeholder="輸入你要交給 AI 團隊的問題……"></textarea>

        </div>

        <button
          id="btnSend"
          class="send-btn"
          type="button">
          ↑
        </button>

      </div>


      <!-- 工具列 -->

      <div class="owner-tools">

        <button
          id="btnMic"
          class="tool-btn"
          type="button">
          🎙️ 語音
        </button>

        <button
          id="btnPause"
          class="tool-btn"
          type="button">
          ⏸ 暫停
        </button>

        <button
          id="btnNextRound"
          class="tool-btn primary"
          type="button">
          下一輪
        </button>

        <button
          id="btnApprove"
          class="tool-btn approve"
          type="button">
          ✓ 批准
        </button>

        <button
          id="btnStop"
          class="tool-btn danger"
          type="button">
          ■ 結束
        </button>

      </div>

    </section>

  </main>

</div>


<!-- =======================================================
     START OVERLAY
======================================================= -->

<div
  id="overlayStart"
  class="overlay visible">

  <div class="modal">

    <div class="modal-body">

      <div class="start-logo">
        ◈
      </div>

      <div
        class="modal-title"
        style="text-align:center;">
        AIVAULT WAR ROOM
      </div>

      <div class="start-text">

        AI 團隊已待命。<br>
        請由 Owner 輸入第一個問題，<br>
        系統將啟動 AI 協作會議。

      </div>

      <div class="modal-actions">

        <button
          id="btnStartNew"
          class="confirm"
          type="button">
          開始會議
        </button>

        <button
          id="btnViewHistory"
          type="button">
          歷史紀錄
        </button>

      </div>

    </div>

  </div>

</div>


<!-- =======================================================
     APPROVE
======================================================= -->

<div
  id="overlayDecision"
  class="overlay">

  <div class="modal">

    <div class="modal-header">

      <div class="modal-title">
        Owner 最終決策
      </div>

      <button
        id="btnReject"
        class="close-btn"
        type="button">
        ×
      </button>

    </div>

    <div class="modal-body">

      <div class="start-text">
        確定批准目前 AI 團隊提出的最終決策嗎？
        <br><br>
        批准後，本次 War Room 會議將結束。
      </div>

      <div class="modal-actions">

        <button
          id="btnConfirmApprove"
          class="confirm"
          type="button">
          ✓ 確認批准
        </button>

        <button
          id="btnReject2"
          type="button">
          返回
        </button>

      </div>

    </div>

  </div>

</div>


<!-- =======================================================
     HISTORY
======================================================= -->

<div
  id="overlayHistory"
  class="overlay">

  <div class="modal">

    <div class="modal-header">

      <div class="modal-title">
        歷史會議
      </div>

      <button
        id="btnCloseHistory"
        class="close-btn"
        type="button">
        ×
      </button>

    </div>

    <div class="modal-body">

      <div
        id="historyList"
        class="history-list">
      </div>

    </div>

  </div>

</div>


<!-- =======================================================
     TOAST
======================================================= -->

<div
  id="toast"
  class="toast">
</div>


<script>

/* =========================================================
   AIVAULT WAR ROOM
========================================================= */

(() => {

  "use strict";


  /* =======================================================
     DOM HELPER
  ====================================================== */

  const $ = id =>
    document.getElementById(id);


  /* =======================================================
     AGENTS
  ====================================================== */

  const AGENTS = [

    {
      id:"chief",
      name:"Chief AI",
      role:"會議主持 / 統籌",
      avatar:"🧠"
    },

    {
      id:"research",
      name:"Research AI",
      role:"研究 / 資料分析",
      avatar:"🔎"
    },

    {
      id:"legal",
      name:"Legal AI",
      role:"法遵 / 風險",
      avatar:"⚖️"
    },

    {
      id:"strategy",
      name:"Strategy AI",
      role:"策略 / 商業",
      avatar:"♟️"
    },

    {
      id:"security",
      name:"Security AI",
      role:"安全 / 防禦",
      avatar:"🛡️"
    },

    {
      id:"review",
      name:"Review AI",
      role:"品質 / 審查",
      avatar:"✓"
    }

  ];


  /* =======================================================
     STATE
  ====================================================== */

  const state = {

    status:"idle",

    meetingId:null,

    round:0,

    maxRounds:6,

    topic:"",

    transcript:[],

    currentSpeaker:null,

    paused:false,

    language:"zh"

  };


  /* =======================================================
     LANGUAGE
  ====================================================== */

  let uiLang = "zh";


  /* =======================================================
     SPEECH
  ====================================================== */

  let voices = [];

  let speechUnlocked = false;

  let speaking = false;


  function loadVoices(){

    if (!("speechSynthesis" in window)) return;

    voices = window.speechSynthesis
      .getVoices()
      .filter(Boolean);

  }


  if ("speechSynthesis" in window){

    loadVoices();

    window.speechSynthesis
      .addEventListener(
        "voiceschanged",
        loadVoices
      );

  }


  /*
    核心修正：

    不再只挑某一個 voice。

    優先：
    zh-TW
    zh-CN
    cmn

    因為不同 iPhone / Safari /
    Chrome 安裝的語音名稱不同。
  */

  function getMandarinVoice(){

    if (!voices.length) return null;


    const preferred = [

      "zh-TW",

      "zh-CN",

      "cmn-TW",

      "cmn-CN"

    ];


    for (const lang of preferred){

      const found =
        voices.find(
          v => v.lang === lang
        );

      if (found) return found;

    }


    const chinese =
      voices.find(
        v =>
          /^zh/i.test(v.lang) ||
          /^cmn/i.test(v.lang)
      );

    return chinese || null;

  }


  /*
    第一次 Owner 操作時解鎖語音。
  */

  function unlockAudio(){

    if (speechUnlocked) return;

    speechUnlocked = true;

    if ("speechSynthesis" in window){

      try{

        window.speechSynthesis.cancel();

        const u =
          new SpeechSynthesisUtterance("");

        u.volume = 0;

        u.lang = "zh-TW";

        window.speechSynthesis.speak(u);

      }catch(e){

        console.warn(
          "speech unlock:",
          e
        );

      }

    }

  }


  function stopSpeech(){

    if (
      "speechSynthesis"
      in window
    ){

      try{

        window.speechSynthesis.cancel();

      }catch(e){}

    }

    speaking = false;

    setAllAgentsListening();

  }


  /*
    AI 全部國語發音
  */

  function speakAI(
    agentId,
    text
  ){

    if (!text) return;

    if (state.paused) return;


    unlockAudio();


    if (!("speechSynthesis" in window)){

      return;

    }


    stopSpeech();


    const voice =
      getMandarinVoice();


    const utterance =
      new SpeechSynthesisUtterance(
        text
      );


    utterance.lang =
      voice?.lang ||
      "zh-TW";


    if (voice){

      utterance.voice =
        voice;

    }


    utterance.rate = .92;

    utterance.pitch = 1;

    utterance.volume = 1;


    speaking = true;

    setAgentSpeaking(
      agentId
    );


    utterance.onend = () => {

      speaking = false;

      setAllAgentsListening();

    };


    utterance.onerror = () => {

      speaking = false;

      setAllAgentsListening();

    };


    /*
      Safari 某些情況第一次 speech
      不穩定，所以用短延遲排程。
    */

    setTimeout(() => {

      try{

        window.speechSynthesis
          .speak(utterance);

      }catch(e){

        console.warn(
          "speech:",
          e
        );

        speaking = false;

        setAllAgentsListening();

      }

    },80);

  }

  /* =======================================================
     AGENT STATE

  /* =======================================================
     TRANSCRIPT
  ====================================================== */

  function addTranscriptMessage(
    message
  ){

    const item = {

      ...message,

      time:
        new Date()
          .toLocaleTimeString(
            "zh-TW",
            {
              hour:"2-digit",
              minute:"2-digit"
            }
          )

    };


    state.transcript.push(
      item
    );


    renderDialogue();

    saveCurrentMeeting();

  function renderDialogue(){

    const box =
      $("dialogueBox");

    if (!box) return;


    box.innerHTML =
      state.transcript
        .map(msg => {

            msg.isOwner ||
            msg.role === "Owner";


          return `

            <div
              class="message

              <div
                class="message-bubble">

                <div
                  class="message-meta">

                  ${escapeHTML(
                    msg.role || "AI"
                  )}

                  ·

                  ${escapeHTML(
                    msg.time || ""
                  )}

                </div>

                ${escapeHTML(
                  msg.content || ""
                )}

              </div>

            </div>

  /* =======================================================
     START MEETING
  ====================================================== */

  function startMeeting(
    topic
  ){

    unlockAudio();


    state.meetingId =
      "WAR-" +
      Date.now();


    state.status =
      "active";


    state.paused =
      false;


    state.round =
      0;


    state.topic =
      topic;


    state.transcript =
      [];


    updateStatus();


    addTranscriptMessage({

      role:"Owner",

      content:topic,

      isOwner:true

    });


    toast(
      "會議已啟動"
    );


    /*
      第一輪立即開始。
    */

    setTimeout(
      () => runNextRound(),
      350
    );

  }


  /* =======================================================
     NEXT ROUND
  ====================================================== */

  async function runNextRound(){

    if (
      !state.meetingId
    ){

      toast(
        "請先輸入問題開始會議"
      );

      return;

    }


    if (
      state.status ===
      "completed"
    ){

      toast(
        "會議已結束"
      );

      return;

    }


    if (state.paused){

      toast(
        "會議目前暫停中"
      );

      return;

    }


    if (
      state.round >=
      state.maxRounds
    ){

      toast(
        "已完成所有會議輪次"
      );

      return;

    }


    state.round++;

    updateRoundUI();


    const sequence =
      [

        "chief",

        "research",

        "legal",

        "strategy",

        "security",

        "review"

      ];


    const agentId =
      sequence[
        (state.round - 1)
        % sequence.length
      ];


    const agent =
      AGENTS.find(
        a => a.id === agentId
      );


    setAgentThinking(
      agentId
    );


    /*
      模擬 AI 思考。
      未來這裡直接接
      governance-engine。
    */

    await delay(
      700
    );


    if (
      state.status !==
      "active" ||
      state.paused
    ){

      setAllAgentsListening();

      return;

    }


    const response =
      generateDemoResponse(
        agentId,
        state.topic,
        state.round
      );


    addTranscriptMessage({

      role:agent.name,

      content:response,

      isOwner:false

    });


    /*
      關鍵：
      每一輪 AI 發言都會經過
      同一個國語 TTS。
    */

    speakAI(
      agentId,
      response
    );

  }


  /* =======================================================
     DEMO AI RESPONSE
  ====================================================== */

  function generateDemoResponse(
    agentId,
    topic,
    round
  ){

    const t =
      topic || "目前議題";


    const responses = {

      chief:
        `Owner 的議題是「${t}」。第 ${round} 輪由我統籌目前討論方向，先確認問題範圍、目標與最終需要交付的成果。`,

      research:
        `Research AI 已完成初步分析。針對「${t}」，建議先確認資料來源、事實基礎以及目前是否存在資訊缺口，避免團隊在錯誤前提上繼續推進。`,

      legal:
        `Legal AI 認為「${t}」需要進一步檢查法律與合規風險。正式執行前應確認權限、責任以及相關規範，並保留必要的人工審查。`,

      strategy:
        `Strategy AI 建議將「${t}」拆成可執行的任務，再比較成本、效益、時間與風險，最後形成 Owner 可以直接決策的方案。`,

      security:
        `Security AI 已將「${t}」列入安全檢查。下一步應確認資料保護、權限控制、API 金鑰以及外部服務是否存在安全風險。`,

      review:
        `Review AI 建議目前不要直接結案。應先確認研究結果、法律檢查與安全檢查是否一致，再整理成最終決策文件交由 Owner 審批。`

    };


    return (
      responses[agentId] ||
      `AI 團隊正在分析「${t}」。目前第 ${round} 輪討論已完成。`
    );

  }


  /* =======================================================
     APPROVE

     PAUSE
  ====================================================== */

      !state.meetingId
    ){

        "請先開始會議"

  /* =======================================================
     STATUS UI
  ====================================================== */

  function updateStatus(){

    const status =
      $("meetingStatus");


    const text =
      $("statusText");


    if (!status || !text)
      return;


    status.classList.remove(
      "paused",
      "completed"
    );


    if (
      state.status ===
      "active"
    ){

        "AI 團隊協作中";

    }
    else if (
      state.status ===
      "paused"
    ){

      status.classList.add(

      );

      text.textContent =

    else if (
      state.status ===
      "completed"
    ){

      status.classList.add(
        "completed"
      );

      text.textContent =
        "會議已結束";

    }
    else{

      text.textContent =

    }

  /* =======================================================
     HISTORY
  ====================================================== */

  function saveCurrentMeeting(){

    if (
      !state.meetingId
    ){

      return;

    }


    const meetings =
      JSON.parse(
        localStorage.getItem(
          "AIVAULT_WARROOM_HISTORY"
        ) || "[]"
      );


    const record = {

      id:
        state.meetingId,

      topic:
        state.topic,

      round:
        state.round,

      status:
        state.status,

      createdAt:
        new Date().toISOString(),

      transcript:
        state.transcript

    };


    const index =
      meetings.findIndex(
        m =>
          m.id ===
          state.meetingId
      );


    if (index >= 0){

      meetings[index] =
        record;

    }else{

      meetings.unshift(
        record
      );

    }


    /*
      最多保留 50 筆。
    */

    localStorage.setItem(
      "AIVAULT_WARROOM_HISTORY",
      JSON.stringify(
        meetings.slice(0,50)
      )
    );

  }

  /* =======================================================
     VOICE RECOGNITION
  ====================================================== */

  let recognition =
    null;

  let recognizing =
    false;


  function setupRecognition(){

    const SR =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if (!SR){

      return null;

    }


    if (recognition){

      return recognition;

    }


    recognition =
      new SR();


    recognition.continuous =
      false;

    recognition.interimResults =
      true;

    recognition.maxAlternatives =
      1;

    recognition.lang =
      "zh-TW";


    recognition.onstart =
      () => {

        recognizing =
          true;

        const btn =
          $("btnMic");

        if (btn){

          btn.textContent =
            "🔴 收音中";

          btn.style.color =
            "#ff6b7c";

        }

      };


    recognition.onend =
      () => {

        recognizing =
          false;

        const btn =
          $("btnMic");

        if (btn){

          btn.textContent =
            "🎙️ 語音";

          btn.style.color =
            "";

        }

      };


    recognition.onerror =
      event => {

        console.warn(
          "SpeechRecognition:",
          event.error
        );

        recognizing =
          false;

      };


    recognition.onresult =
      event => {

        let text = "";


        for (
          let i =
            event.resultIndex;
          i <
            event.results.length;
          i++
        ){

          text +=
            event.results[i][0]
              .transcript;

        }


        text =
          text.trim();


        if (text){

          $("ownerInput")
            .value =
            text;

        }

      };


    return recognition;

  }


  function startVoice(){

    unlockAudio();


    const rec =
      setupRecognition();


    if (!rec){

      alert(
        "此瀏覽器不支援語音辨識，請使用文字輸入。"
      );

      return;

    }


    if (recognizing){

      try{

        rec.stop();

      }catch(e){}

      return;

    }


    try{

      /*
        永遠使用國語。
      */

      rec.lang =
        "zh-TW";


      rec.start();

    }catch(e){

      console.warn(e);

    }

  }


  /* =======================================================
     OWNER SEND
  ====================================================== */

  function sendOwnerMessage(){

    unlockAudio();


    const input =
      $("ownerInput");


    if (!input)
      return;


    const text =
      input.value.trim();


    if (!text)
      return;


    input.value =
      "";

    input.style.height =
      "auto";


    if (
      !state.meetingId ||
      state.status ===
      "idle"
    ){

      startMeeting(
        text
      );

      return;

    }


    if (
      state.status ===
      "paused"
    ){

      toast(
        "會議暫停中，請先恢復"
      );

      input.value =
        text;

      return;

    }


    if (
      state.status ===
      "completed"
    ){

      toast(
        "本次會議已結束"
      );

      return;

    }


    addTranscriptMessage({

      role:"Owner",

      content:text,

      isOwner:true

    });


    toast(
      "已送出 Owner 意見"
    );


    /*
      Owner 補充意見後，
      自動進下一輪。
    */

    setTimeout(
      () => runNextRound(),
      250
    );

  }

  /* =======================================================
     TOAST
  ====================================================== */

  let toastTimer =
    null;


  function toast(
    message
  ){

    const el =
      $("toast");


    if (!el) return;


    el.textContent =
      message;


    el.classList.add(
      "show"
    );


    clearTimeout(
      toastTimer
    );


    toastTimer =
      setTimeout(
        () => {

          el.classList.remove(
            "show"
          );

        },
        1800
      );

  }


  /* =======================================================
     ESCAPE HTML
  ====================================================== */

  function escapeHTML(
    value
  ){

    return String(
      value ?? ""
    )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

  }


  /* =======================================================
     DELAY
  ====================================================== */

  function delay(ms){

    return new Promise(
      resolve =>
        setTimeout(
          resolve,
          ms
        )
    );

  }

    .addEventListener(
      "input",
      resizeInput
    );


  $("ownerInput")
    .addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Enter" &&
          !event.shiftKey
        ){

          event.preventDefault();

          sendOwnerMessage();

        }

      }
    );


  $("btnMic")
    .addEventListener(
      "click",
      startVoice
    );


  $("btnPause")
    .addEventListener(
      "click",
      togglePause
    );


  $("btnNextRound")
    .addEventListener(
      "click",
      runNextRound
    );


  $("btnApprove")
    .addEventListener(
      "click",
      approveMeeting
    );


  $("btnConfirmApprove")
    .addEventListener(
      "click",
      () => {

        $("overlayDecision")
          .classList.remove(
            "visible"
          );

        confirmApprove();

      }
    );


  $("btnReject")
    .addEventListener(
      "click",
      () => {

        $("overlayDecision")
          .classList.remove(
            "visible"
          );

      }
    );


  $("btnReject2")
    .addEventListener(
      "click",
      () => {

        $("overlayDecision")
          .classList.remove(
            "visible"
          );

      }
    );


  $("btnStop")
    .addEventListener(
      "click",
      stopMeeting
    );


  $("btnHistory")
    .addEventListener(
      "click",
      () => {

        renderHistory();

        $("overlayHistory")
          .classList.add(
            "visible"
          );

      }
    );


  $("btnViewHistory")
    .addEventListener(
      "click",
      () => {

        $("overlayStart")
          .classList.remove(
            "visible"
          );

        renderHistory();

        $("overlayHistory")
          .classList.add(
            "visible"
          );

      }
    );


  $("btnCloseHistory")
    .addEventListener(
      "click",
      () => {

        $("overlayHistory")
          .classList.remove(
            "visible"
          );

      }
    );


  $("btnStartNew")
    .addEventListener(
      "click",
      () => {

        $("overlayStart")
          .classList.remove(
            "visible"
          );

        unlockAudio();

        setTimeout(
          () =>
            $("ownerInput")
              .focus(),
          100
        );

      }
    );


  $("btnLang")
    .addEventListener(
      "click",
      toggleLanguage
    );


  /* =======================================================
     INIT
  ====================================================== */

  renderAgents();

  setAllAgentsListening();

  updateStatus();

  updateRoundUI();

  renderDialogue();


  /*
    預先載入語音。

    這是修正「前幾輪沒有聲音，
    後面突然才有聲音」的重要部分。
  */

  setTimeout(
    loadVoices,
    100
  );

  setTimeout(
    loadVoices,
    500
  );

  setTimeout(
    loadVoices,
    1200
  );


  /*
    Owner 第一次觸碰頁面時，
    儘早解鎖 SpeechSynthesis。
  */

  document.addEventListener(
    "pointerdown",
    unlockAudio,
    {
      once:true,
      passive:true
    }
  );


  /*
    點 AI 區域時讓輸入框失焦，
    避免手機鍵盤一直擋住會議畫面。
  */

  $("aiStage")
    .addEventListener(
      "pointerdown",
      event => {

        if (
          event.target.closest(
            "button"
          )
        ){

          return;

        }

        $("ownerInput")
          .blur();

      }
    );


  /*
    公開給未來 Governance Engine
    / AI Gateway 使用。
  */

  window.AIVAULT_WAR_ROOM = {

    state,

    AGENTS,

    startMeeting,

    runNextRound,

    speakAI,

    addTranscriptMessage,

    saveCurrentMeeting,

    renderHistory

  };


})();

</script>

</body>
</html>
