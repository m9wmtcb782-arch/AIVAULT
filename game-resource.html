<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>資源點</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body class="game-body">
  <div class="snow-layer"></div>
  <div class="app" id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/boot.js"></script>
  <script>
    (async () => {
      if (!(await FKAuth.requirePlayer())) return;
      const kind = new URLSearchParams(location.search).get("kind") || "wood";
      const names = { wood: "寒木林", food: "凍土農地", stone: "裂冰岩場", iron: "霜鐵礦脈" };
      document.getElementById("app").innerHTML = `
        <div class="page-head"><a class="back" href="game-map.html">← 返回</a><h2>${names[kind]||kind}</h2></div>
        <div class="panel">
          <p>野外資源點。生產在主城建築進行。</p>
          <button class="btn" onclick="location.href='game-city.html'">返回主城</button>
        </div>${FKUI.nav("map")}
      `;
    })();
  </script>
</body>
</html>
