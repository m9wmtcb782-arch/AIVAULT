<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>AIVAULT 真實骨架人物測試</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#14283e;font-family:system-ui;color:#fff}canvas{display:block}#ui{position:fixed;top:14px;left:12px;right:12px;pointer-events:none}#title{display:inline-block;background:#0d2945dd;border:1px solid #8ac5e6;border-radius:12px;padding:12px;font-size:14px}#title b{font-size:18px}#buttons{position:fixed;bottom:24px;left:0;right:0;display:flex;justify-content:center;gap:8px}button{font-size:16px;background:#194366;color:white;border:1px solid #9ed7fb;padding:11px 15px;border-radius:12px}button.active{background:#3286b6}#status{font-size:12px;color:#cde8ff;margin-top:6px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><div id="ui"><div id="title"><b>❄ AIVAULT · 單一真人形 3D 角色</b><div>穿制服的人物｜真正骨架動畫</div><div id="status">正在載入人物模型…</div><div style="font-size:12px;margin-top:5px">手指拖曳旋轉，雙指縮放</div></div></div><div id="buttons"><button data-act="Idle" class="active">待命</button><button data-act="Walk">走路</button><button data-act="Run">跑步</button></div><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const status=document.getElementById('status');let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(e){status.textContent='無法啟動 WebGL：'+e.message;throw e}renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x91bad3);scene.fog=new THREE.Fog(0x91bad3,12,35);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);camera.position.set(3.6,2.8,6);const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,1.1,0);orbit.enableDamping=true;orbit.minDistance=2;orbit.maxDistance=11;orbit.maxPolarAngle=Math.PI/2.05;orbit.update();
scene.add(new THREE.HemisphereLight(0xf4f9ff,0x5a7488,2.3));const light=new THREE.DirectionalLight(0xffebd0,2.6);light.position.set(-3,8,5);light.castShadow=true;light.shadow.mapSize.set(1024,1024);light.shadow.camera.left=-6;light.shadow.camera.right=6;light.shadow.camera.top=6;light.shadow.camera.bottom=-6;scene.add(light);
const ground=new THREE.Mesh(new THREE.CylinderGeometry(3.8,4,0.45,48),new THREE.MeshStandardMaterial({color:0xeaf5ff,roughness:.9}));ground.position.y=-.24;ground.receiveShadow=true;scene.add(ground);
for(let i=0;i<24;i++){const r=2.3+(i%4)*.3,a=i*2.399;const o=new THREE.Mesh(new THREE.ConeGeometry(.22+(i%3)*.07,1.0+(i%4)*.3,7),new THREE.MeshStandardMaterial({color:0x4b8a7b}));o.position.set(Math.cos(a)*r,.5,Math.sin(a)*r);scene.add(o)}
let mixer,clips={},current;function activate(name){if(!clips[name])return;if(current===clips[name])return;const next=clips[name];next.reset().setEffectiveTimeScale(1).setEffectiveWeight(1).play();if(current)current.crossFadeTo(next,.28,false);current=next;document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.act===name));status.textContent='模型已載入｜目前動作：'+({Idle:'待命',Walk:'走路',Run:'跑步'}[name]||name)}
const url='https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/models/gltf/Soldier.glb';
new GLTFLoader().load(url,g=>{const model=g.scene;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});scene.add(model);mixer=new THREE.AnimationMixer(model);for(const clip of g.animations)clips[clip.name]=mixer.clipAction(clip);status.textContent='載入成功｜動畫：'+Object.keys(clips).join('、');activate('Walk')},p=>{if(p.total)status.textContent='載入中 '+Math.round(p.loaded/p.total*100)+'%'},e=>{status.textContent='模型下載失敗：請檢查網路或稍後重試';console.error(e)});
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>activate(b.dataset.act)));const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);if(mixer)mixer.update(dt);orbit.update();renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
