<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT 真實骨架角色驗證</title><style>body{margin:0;background:#122338;color:#fff;font:14px system-ui;overflow:hidden}#status{position:absolute;top:12px;left:12px;right:12px;background:#102c4edb;padding:12px;border-radius:12px;max-width:380px}#status strong{font-size:17px}#buttons{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px}button{background:#204d73;border:1px solid #9bd0f4;color:white;border-radius:10px;padding:10px}canvas{display:block}</style></head><body><div id="status"><strong>🧍 AIVAULT 骨架角色驗證 V3</strong><div id="msg">正在載入真實 GLB 模型…</div><small>獨立測試：原始基礎角色，尚未製作冬裝與走路動畫。拖曳可旋轉。</small></div><div id="buttons"><button id="left">↶ 左轉</button><button id="right">右轉 ↷</button><button id="reset">重置</button></div><script type="module">import * as THREE from 'https://esm.sh/three@0.160.1';import {GLTFLoader} from 'https://esm.sh/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';const msg=document.getElementById('msg');let r;try{r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight);r.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(r.domElement)}catch(e){msg.textContent='WebGL 無法啟動：'+e.message;throw e}const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bbfd4);const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,1.8,6);scene.add(new THREE.HemisphereLight(0xffffff,0x49657c,2.6));const l=new THREE.DirectionalLight(0xfff3e5,2.6);l.position.set(3,7,5);scene.add(l);const floor=new THREE.Mesh(new THREE.CylinderGeometry(2.1,2.2,.22,48),new THREE.MeshStandardMaterial({color:0xeaf4fa}));floor.position.y=-.15;scene.add(floor);let model,rotation=0,drag=false,prev=0;new GLTFLoader().load('https://raw.githubusercontent.com/programasweights/avatar/main/public/assets/character.glb',g=>{model=g.scene;const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());model.position.sub(center);model.position.y+=size.y/2;model.scale.multiplyScalar(3/Math.max(size.y,.1));scene.add(model);msg.textContent='已載入真實 GLB 角色（骨架基礎版，尚未換冬裝）';},undefined,e=>{msg.textContent='模型載入失敗：外部 GLB 來源無法讀取。此版本尚未通過實機驗證。';console.error(e)});r.domElement.addEventListener('pointerdown',e=>{drag=true;prev=e.clientX});window.addEventListener('pointerup',()=>drag=false);window.addEventListener('pointermove',e=>{if(drag){rotation+=(e.clientX-prev)*.01;prev=e.clientX}});document.getElementById('left').onclick=()=>rotation-=.4;document.getElementById('right').onclick=()=>rotation+=.4;document.getElementById('reset').onclick=()=>rotation=0;addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});function tick(){requestAnimationFrame(tick);if(model)model.rotation.y=rotation;r.render(scene,camera)}tick();</script></body></html>
