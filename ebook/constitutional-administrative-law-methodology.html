<script>
const pages=[
{t:'cover',h:'憲法解釋與行政法學研究方法論',p:['西方法學研究方法論之總結、問題集成、論點建構與天人合一整合分析','AIVAULT 法學方法論研究電子書','依據兩篇研究稿整理、分析與重構']},
{h:'編者說明',p:['本書不是將兩篇原稿直接合併，而是以「研究方法論」為共同軸線重新整理。核心材料為《憲法解釋方法論之體系建構——天人合一思想與現代憲法解釋學之整合模型》與《行政法學研究方法論——兼談天人合一思想在行政法上之運用》。本書的任務，是把兩篇文章中分散於不同章節的問題意識、方法、論證功能、限制與結論重新組織，使讀者可以看見一條完整的法學研究路徑。','本書所稱「西方法學研究方法論」，係指兩篇原稿所大量援引及討論的近代歐陸法學方法，例如概念法學、法教義學、價值法學、利益法學、自然法思想、目的論、結果導向、社會科學取向，以及憲法解釋中的文義、體系、歷史、目的、比較法與動態解釋等。這裡不是主張西方法學只有單一方法，也不是把所有方法都視為彼此排斥；相反地，兩篇原稿本身已呈現「方法互補、層次化整合」的方向。','至於「天人合一」部分，本書將其定位為兩篇原稿提出的整合性規範理念與方法論方案，而不是把它倒推為西方法學傳統本身的一部分。如此可以避免把不同思想傳統混為一談，也能清楚呈現作者試圖完成的跨傳統方法論建構。']},
{h:'第一章　研究問題：法學為什麼需要方法論？',p:['第一個根本問題是：法律條文存在之後，究竟憑什麼理由得到一個具有拘束力、可理解、可檢驗的法律結論？如果沒有共同的方法，法律解釋可能退化為個人直覺、政治偏好或事後合理化。兩篇原稿都把方法論理解為控制法律決定的重要機制：它一方面統一法律發現、解釋與體系化的程序，另一方面提供批判現行法、檢討合理性與指導制度發展的工具。','第二個問題是：法律的「合法性」是否已足以回答所有問題？兩篇原稿的答案是否定的。概念法學可以提供形式上的一致性與可預測性，但若過度抽象化，可能與生活事實脫節；利益法學可以把法律重新連回社會利益，但又可能產生價值取捨主觀化；自然法可以提供正義與合理性的標準，但其抽象性使操作標準不易明確化；價值法學則把憲法價值納入體系，但價值衝突仍需論證。','第三個問題是：如果不同方法各有優缺點，是否應尋找一種「單一最高方法」？兩篇原稿的結構顯示，較合理的方向不是尋找唯一方法，而是建立分層、互補、可檢驗的論證結構。也就是先處理規範與體系，再處理事理與事實，再處理利益與價值，最後回到憲法秩序及權力分立的界限。']},
{h:'第二章　西方法學研究方法論的演進與功能',p:['一、概念法學：以概念建構、系統化與演繹法形成外部體系。其優點是精確、穩定、邏輯清楚；問題在於若純粹以形式邏輯運作，可能忽略社會現實與價值判斷。','二、法教義學：以解釋、建構與體系化法規範為主要任務，並以文義、體系、歷史、目的及合憲性等方法處理法律問題。其核心價值是使法律材料具有一致性、融貫性與可操作性。','三、價值法學：不只追求形式邏輯，而以法律原則與價值判斷形成「內部體系」。它使法律體系具有正當化能力，但因法律原則具有開放性，因此必須透過論證避免價值判斷任意化。','四、利益法學：將法律理解為處理利益衝突的制度，要求辨識公共利益、個人利益及其他相互衝突的利益，並進行客觀利益衡量。其優點是能連結社會生活；其風險則是若缺乏明確的法律拘束，容易轉化為個人價值選擇。','五、自然法思想：要求法律不能只是權力所制定的命令，而應符合事物本質、人的本性、普遍理性或正義。兩篇原稿特別把「事理」與合理性納入行政法研究，並把自然法作為避免形式法治失去正當性的補充。','六、目的論、結果導向與社會科學取向：法律不是孤立文字，而是服務社會生活的制度。目的解釋與結果考量要求研究者觀察規範目的、實際效果及社會經驗；但憲法篇同時強調，結果考量仍受憲法、法律及權力分立拘束，不能藉結果考量取代立法。','七、比較法：外國法不是可以直接移植的答案，而是提供問題意識、制度經驗與論證理由。借鑑外國法時仍須確認其文義、體系、歷史、目的與本國制度是否相容。','八、動態與演進式解釋：憲法具有開放性，解釋需要回應社會變遷；但動態性不能等同於無限制的司法創造。解釋界限仍由憲法文本、規範目的、基本原則及權力分立所控制。']},
{h:'第三章　憲法解釋方法論的核心結構',p:['憲法篇首先指出，憲法規範的是政治共同體基本秩序、國家權力的創設與限制以及基本權利保障；因此憲法具有抽象性、原則性、文化性與開放性。憲法同時具有客觀價值秩序功能，故憲法解釋不能只把它當成普通法律條文處理。','在方法層面，傳統解釋方法仍是基礎：文義解釋、體系解釋、歷史解釋與目的解釋。比較法、社會文化因素、結果考量與動態解釋則屬補充或深化的論證工具。各種解釋方法之間不存在絕對固定的先後順序，應透過論證的可說服力與客觀可檢驗性避免任意。','在控制層面，原稿將憲法解釋原則整理為體系整合、功能分配與效力最大化等群組，包括憲法統一性、實踐整合、權力分立、民主回溯、立法形成空間尊重、最佳憲法效力與合憲解釋等。','在界限方面，原稿強調：當解釋結果已與文義及目的明確相反、重新決定規範內容，或在重要部分偏離規範目標時，即可能超越解釋界限；同時，司法應避免侵入其他國家權力的固有領域。']},
{h:'第四章　行政法學研究方法論的核心結構',p:['行政法篇把研究方法論進一步落實到行政法規範與個案問題。第一層是體系化：透過概念法學與法教義學，使行政法規範形成內外一致的體系，並連結憲法統一秩序。','第二層是事物邏輯與自然法：研究者不能只問「條文怎麼寫」，還要問「這項制度所處理的生活事實究竟是什麼」。適宜性、合理性與事物本質，成為檢查規範是否真正適合其規範對象的重要方法。','第三層是利益衡量：辨識各方利益，分析公共利益與個人利益之衝突，並尋求均衡。客觀利益衡量可避免把立法或裁判簡化為主觀偏好。','第四層是行政目的與結果導向：行政法應關注為民除害、為民興利、行政任務、法規影響評估、成本效益、社會實證與實際結果。','最後是價值法學與憲法價值收束。原稿提出四層次模型：法教義學提供形式合法與安定性；自然法學補充事理與合理性；利益法學提供利益均衡與公正性；價值法學則以憲法價值完成正當性收束。天人合一思想則被設計成貫穿四層的中軸線。']},
{h:'第五章　問題收集：兩篇方法論共同面對的十大問題',p:['問題一：形式合法是否等於實質正當？——概念體系可以確認法律形式，但仍可能留下正義與合理性問題。','問題二：法律文字不明確時，誰決定規範意義？——文義、體系、歷史、目的與價值之間需要可檢驗的論證。','問題三：價值衝突如何處理？——基本權、公共利益與其他利益不能只靠抽象宣告，必須提出衡量理由。','問題四：結果考量是否會侵犯立法權？——必須建立結果考量的法律界限，避免司法以政策判斷取代民主形成。','問題五：社會變遷如何進入憲法解釋？——動態解釋需要回應現實，但不能脫離憲法文本與基本結構。','問題六：外國法能否直接移植？——比較法必須經過本國文義、體系、歷史、制度與社會條件的再檢驗。','問題七：行政裁量如何避免恣意？——必須結合目的、比例、平等、信賴保護、事理及利益衡量等方法。','問題八：法教義學如何避免封閉？——需要引入社會科學、經驗事實、法政策及結果評估，但仍保持法律論證的拘束性。','問題九：自然法與天人合一是否過度抽象？——若要進入司法或行政論證，必須將其轉化為可觀察的原則、界線與審查步驟。','問題十：方法越多是否反而增加任意性？——真正需要的不是更多名詞，而是清楚的層次、使用條件、優先關係與理由公開。']},
{h:'第六章　核心論點：建立「六步法學方法論」',p:['論點一——先確定規範材料，再開始價值判斷。第一步應確認憲法、法律、命令、裁判及其他具有法源意義的材料，避免先有結論再找法律依據。','論點二——先做文義與體系，再做目的與歷史。傳統解釋方法是法律論證的基本骨架，目的、歷史及比較法則用於說明規範形成與功能。','論點三——把生活事實帶回法律。任何抽象規範都要與實際規範對象、社會條件及制度功能連結，這正是行政法篇所強調的事理與社會實證。','論點四——在法律允許的範圍內進行利益與價值衡量。利益衡量不能取代法律；價值判斷也不能成為不受拘束的政策選擇。衡量應指出利益、權利、負擔、替代方案與比例關係。','論點五——檢查結果，但不得以結果反過來任意創造法律。結果考量可作為目的論與一般實踐論證的一部分；其合法性仍須回到憲法、法律、基本價值及權力分立。','論點六——以正當性與可檢驗性完成最後收束。最終結論必須回答：法律依據何在、解釋方法為何、事實如何支持、利益如何衡量、價值衝突如何化解、司法／行政權限界線在哪裡。']},
{h:'第七章　天人合一整合模型：從西方法學方法走向跨傳統方法論',p:['兩篇原稿並非主張以「天人合一」取代文義、體系、歷史、目的、法教義學、利益衡量等既有方法，而是試圖把它作為一條縱向的價值與理論中軸。行政法篇以「事理—人倫—自然」貫穿四層次；憲法篇則提出天道、天理、客觀價值秩序、事理、人理、憲法規範與原則、解釋方法、個案裁判等逐層具體化模型。','依憲法篇的八層結構，可理解為：天道層 → 天理層 → 客觀價值秩序層 → 事理層 → 人理層 → 憲法規範與原則層 → 解釋方法層 → 個案裁判層。其理論意義在於把抽象價值、制度理性、民主正當性與具體法律適用連成一條推理鏈。','如果「天人合一」要成為可研究、可教學、可檢驗的方法論，就不能停留在價值口號，而應轉化為至少三類問題：一是天理界線，即哪些核心價值不可任意侵犯；二是事理檢驗，即制度是否符合規範對象的客觀條件與生活邏輯；三是人理檢驗，即制度是否尊重人民、民主正當性、共同生活及基本權。','因此，天人合一在本書中最適合被理解為「整合性規範視角」，而不是取代既有法學方法的單一工具。它可以要求研究者在合法性之外，同時追問合理性、公正性、正當性、人民福祉與永續性。']},
{h:'第八章　綜合分析：西方法學方法論的成就與結構性限制',p:['第一項成就是把法律推理從個人直覺轉化為可公開討論的方法。概念法學、法教義學與傳統解釋方法建立了高度結構化的法律論證技術，使法規範可以被分類、比較、體系化與適用。','第二項成就是建立權力控制功能。憲法解釋方法論不只是「怎麼解釋文字」，還處理司法與立法、行政之間的功能分配，避免憲法裁判失去制度界限。','第三項成就是逐漸把社會現實帶回法律。利益法學、目的論、社會科學取向、結果考量與動態解釋，都在回答同一個問題：法律規範如何真正作用於生活世界。','其結構性限制則是：形式體系可能過度抽象；利益與結果考量可能主觀化；自然法與價值論可能抽象化；動態解釋可能越界；比較法可能發生制度移植錯誤。這些限制不表示相關方法失敗，而是說每一方法都需要另一方法提供控制。','因此，兩篇原稿真正形成的不是「方法之爭」，而是「方法之間的控制關係」：體系控制任意性，事理控制形式主義，利益衡量控制單一利益，憲法價值控制政策恣意，權力分立控制司法越界，天人合一則在作者的整合構想中提供整體性與終極價值方向。']},
{h:'第九章　最終結論：從方法的集合走向方法的體系',p:['本書的第一個結論是：憲法解釋與行政法學研究方法不能理解成互不相關的技術清單。兩篇原稿共同呈現出一個由「規範」走向「體系」、由「體系」走向「事理」、由「事理」走向「利益」、由「利益」走向「目的與結果」、再由「目的與結果」回到「憲法價值與權力界限」的循環。','第二個結論是：法律方法的最高要求不是讓所有人得到同一個答案，而是讓不同答案都必須提出可以公開檢驗的理由。方法論的真正功能因此包含可理解性、可預測性、可控制性與正當化。','第三個結論是：西方法學方法論的歷史演進，可以被理解為從「形式確定性」逐步擴張到「實質合理性」與「社會有效性」，但每一次擴張都同時產生新的控制問題。因此成熟的方法論不是拋棄舊方法，而是讓不同方法各自負責不同問題。','第四個結論是：兩篇原稿所提出的天人合一整合方案，若要進一步發展成獨立學說，最重要的工作不是再增加抽象理念，而是建立可重複使用的審查程序。例如：規範依據確認 → 文義與體系分析 → 事理與生活事實檢驗 → 利益衡量 → 目的與結果評估 → 憲法價值與權力分立控制 → 天理、事理、人理三重檢驗 → 形成可公開論證的結論。','第五個結論是：這套方法論最終所追求的不是「讓法律變得更複雜」，而是讓法律決定同時具備合法性、合理性、公正性、正當性與可檢驗性。','因此，本書可以將兩篇原稿的共同命題濃縮為一句方法論宣言：法律研究不能只問「法條怎麼說」，也不能只問「結果好不好」；必須同時回答「規範依據何在、體系如何成立、事理是否相符、利益如何平衡、目的是否正當、結果是否合理、權力是否越界，以及人民的尊嚴、自由與共同生活是否受到正當保障」。']},
{h:'附錄　AIVAULT 法學研究問題清單',p:['一、規範問題：法源是什麼？規範位階如何？是否存在規範衝突？','二、解釋問題：文義、體系、歷史、目的各自支持什麼結果？彼此是否衝突？','三、體系問題：本案結論能否與整體法秩序一致？是否破壞憲法統一性？','四、事理問題：規範所處理的生活事實與制度本質是什麼？規範手段是否適宜、合理？','五、利益問題：涉及哪些公共利益、個人利益與第三人利益？各利益的法律地位為何？','六、目的問題：規範要達成什麼目的？行政措施是否真正服務該目的？','七、結果問題：不同解釋會產生什麼實際後果？結果是否可執行、可接受且與規範目的具有合理關聯？','八、權力問題：該決定屬於立法、行政或司法的功能範圍？是否尊重民主正當性與權力分立？','九、基本權問題：是否涉及尊嚴、自由、平等、程序保障或其他基本權？限制是否有法律依據及正當目的？','十、比較法問題：外國制度解決了什麼問題？其制度前提與本國是否相同？哪些理由可以借鑑？','十一、天理問題：是否觸及不可任意侵害的核心正義與人性尊嚴界線？','十二、事理問題：制度是否符合客觀生活條件、自然環境與制度運作邏輯？','十三、人理問題：是否尊重人民、民主程序、共同生活及基本人倫？','十四、最終論證：能否把上述理由完整寫成一條他人可以重現、檢驗與批判的推理鏈？']},
{h:'資料來源與使用說明',p:['本書主要依據兩篇研究稿整理而成：一、《行政法學研究方法論——兼談天人合一思想在行政法上之運用》，陳清秀教授；二、《憲法解釋方法論之體系建構——天人合一思想與現代憲法解釋學之整合模型》，陳清秀教授。','本書中的「總結、問題集成、六步法與綜合分析」屬於在兩篇原稿基礎上的編輯性重構與分析，不應視為原稿逐字內容，也不應冒充作者原文。若日後作為學位論文、正式出版物或教學教材使用，建議另行核對原稿引註、判例、文獻版本及頁碼。']}
];
