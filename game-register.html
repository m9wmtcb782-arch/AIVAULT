<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>註冊 · FROST KINGDOM</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body class="game-body">
  <div class="snow-layer"></div>
  <div class="app">
    <div class="page-head"><a class="back" href="game-login.html">← 返回</a><h2>建立 AIVAULT 帳號</h2></div>
    <div class="panel glass">
      <label>Email</label><input id="email" type="email" />
      <label>Password</label><input id="password" type="password" />
      <label>Confirm Password</label><input id="confirm" type="password" />
      <div class="msg" id="msg"></div>
      <button class="btn" id="btn">建立 AIVAULT 帳號</button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/boot.js"></script>
  <script>
    qs("btn").onclick = () => guarded(async () => {
      const email = qs("email").value.trim();
      const password = qs("password").value;
      if (password !== qs("confirm").value) throw new Error("兩次密碼不一致");
      if (password.length < 6) throw new Error("密碼至少 6 碼");
      await FKApi.signUp(email, password);
      const session = await FKApi.session();
      if (!session) {
        qs("msg").className = "msg ok";
        qs("msg").textContent = "請到 Email 完成驗證後再登入";
        setTimeout(() => location.href = "game-login.html", 1600);
        return;
      }
      location.href = "game-create-player.html";
    });
  </script>
</body>
</html>
