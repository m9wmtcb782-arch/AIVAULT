<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#fff"><title>Technical Dark Star｜即時視訊＋語音測試</title><style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#202123;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif}body{min-height:100dvh}.app{max-width:960px;margin:auto;padding:14px}.top{display:flex;align-items:center;gap:10px;border-bottom:1px solid #eee;padding:5px 0 14px;margin-bottom:14px}.mark{width:40px;height:40px;border-radius:12px;background:#171717;color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px}h1{font-size:18px;margin:0}.sub{font-size:12px;color:#888;margin-top:3px}.badge{margin-left:auto;padding:7px 10px;border-radius:999px;background:#f4f4f4;font-size:11px}.card{border:1px solid #e5e5e5;border-radius:16px;padding:14px;margin-bottom:12px}.card h2{font-size:14px;margin:0 0 10px}.video-wrap{position:relative;background:#111;border-radius:14px;overflow:hidden;aspect-ratio:4/3}.video-wrap video{width:100%;height:100%;object-fit:cover;display:block}.status,.live{position:absolute;top:10px;padding:7px 10px;border-radius:999px;background:rgba(0,0,0,.68);color:#fff;font-size:11px}.status{left:10px}.live{right:10px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid #ddd;background:#fff;border-radius:10px;padding:11px 14px;color:#333}.btn.primary{background:#171717;color:#fff;border-color:#171717}.btn.danger{border-color:#e8caca;color:#b42318}.btn:disabled{opacity:.4}.voice{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px}.voice select{border:1px solid #ddd;border-radius:9px;padding:9px;background:#fff}.conversation{min-height:260px;max-height:520px;overflow:auto;border:1px solid #eee;border-radius:12px;padding:12px;background:#fafafa}.bubble{margin:0 0 12px;padding:11px 13px;border-radius:12px;line-height:1.7;white-space:pre-wrap;word-break:break-word}.you{background:#fff;border:1px solid #eee}.dark{background:#171717;color:#fff}.interim{opacity:.55}.empty{color:#999;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:#f7f7f7;border-radius:11px;padding:10px}.metric span{font-size:11px;color:#777}.metric b{display:block;font-size:15px;margin-top:3px}.log{max-height:190px;overflow:auto;background:#111;color:#ddd;border-radius:11px;padding:10px;font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}.notice{font-size:12px;color:#666;line-height:1.7}@media(max-width:620px){.app{padding:10px}.grid{grid-template-columns:1fr}.badge{display:none}}
</style></head><body><div class="app">
<div class="top"><div class="mark">🌑</div><div><h1>Technical Dark Star｜即時視訊＋語音測試</h1><div class="sub">真正即時對話｜你問暗星，暗星自己看、聽、回答</div></div><div class="badge" id="badge">尚未連線</div></div>
<section class="card"><h2>🎥👂 即時感知</h2><div class="video-wrap"><video id="video" playsinline muted></video><div class="status" id="cameraStatus">尚未啟動</div><div class="live" id="liveStatus">● OFF</div></div><div class="controls"><button class="btn primary" id="startBtn">🎥🎤 開始即時對話</button><button class="btn danger" id="stopBtn" disabled>⏹ 停止</button></div><div class="voice"><span>🔊 暗星聲音：</span><select id="voice"><option value="Kore">Kore</option><option value="Puck">Puck</option><option value="Leda">Leda</option><option value="Aoede">Aoede</option><option value="Zephyr">Zephyr</option><option value="Fenrir">Fenrir</option></select></div><p class="notice"><b>這裡不會叫暗星照著網頁文字回答。</b>開始後麥克風會持續聽你說話，攝像頭會持續提供畫面；你直接問問題，暗星依照「你當下說的話＋當下看到的畫面」自己回答。暗星說話時你可以直接打斷它。</p></section>
<section class="card"><h2>💬 即時對話字幕</h2><div id="conversation" class="conversation"><div class="empty">開始後直接說：「暗星，你現在看到什麼？」</div></div></section>
<section class="card"><h2>⚡ 即時測試數據</h2><div class="grid"><div class="metric"><span>視訊影格</span><b id="frames">0</b></div><div class="metric"><span>麥克風</span><b id="mic">未啟動</b></div><div class="metric"><span>Live</span><b id="socket">未連線</b></div><div class="metric"><span>最後提問</span><b id="lastQ">—</b></div><div class="metric"><span>最後回答</span><b id="lastA">—</b></div><div class="metric"><span>語音播放</span><b id="audioState">待命</b></div></div></section>
<section class="card"><h2>🧪 技術事件</h2><div id="log" class="log">等待測試…</div></section>
<canvas id="canvas" hidden></canvas></div>
<script>
const BASE="https://clcddygkaaqqtsbswgdf.supabase.co",FN=BASE+"/functions/v1/technical-dark-star-vision-test",$=id=>document.getElementById(id);const video=$("video"),canvas=$("canvas"),startBtn=$("startBtn"),stopBtn=$("stopBtn"),voiceSel=$("voice"),conv=$("conversation"),log=$("log");let ws=null,stream=null,videoTimer=null,micCtx=null,micSource=null,processor=null,audioCtx=null,frameBusy=false,frameCount=0,playing=[];let currentUser=null,currentDark=null,userInterim=null,darkInterim=null;
function logMsg(x){log.textContent+=`\n[${new Date().toLocaleTimeString()}] ${x}`;log.scrollTop=log.scrollHeight}function status(x){$("socket").textContent=x;$("badge").textContent=x}function b64(blob){return new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(",")[1]||"");f.onerror=j;f.readAsDataURL(blob)})}
function bubble(who,text,interim=false){if(!text)return null;const d=document.createElement("div");d.className="bubble "+(who==="you"?"you":"dark")+(interim?" interim":"");d.textContent=(who==="you"?"你：":"暗星：")+text;conv.appendChild(d);conv.scrollTop=conv.scrollHeight;return d}
function replaceInterim(kind,text){let ref=kind==="you"?userInterim:darkInterim;if(ref)ref.remove();if(!text){if(kind==="you")userInterim=null;else darkInterim=null;return}ref=bubble(kind,text,true);if(kind==="you")userInterim=ref;else darkInterim=ref}
function finalText(kind,text){if(!text)return;let ref=kind==="you"?userInterim:darkInterim;if(ref){ref.classList.remove("interim");ref.textContent=(kind==="you"?"你：":"暗星：")+text}else bubble(kind,text);if(kind==="you"){$("lastQ").textContent=new Date().toLocaleTimeString()}else{$("lastA").textContent=new Date().toLocaleTimeString();}if(kind==="you")userInterim=null;else darkInterim=null}
function stopPlayback(){playing.forEach(s=>{try{s.stop()}catch{}});playing=[];if(audioCtx)$("audioState").textContent="已中斷"}
function playPCM(base64,mime){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:24000});const bin=atob(base64),buf=new ArrayBuffer(bin.length),u=new Uint8Array(buf);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const pcm=new Int16Array(buf),ab=audioCtx.createBuffer(1,pcm.length,24000),ch=ab.getChannelData(0);for(let i=0;i<pcm.length;i++)ch[i]=pcm[i]/32768;const src=audioCtx.createBufferSource();src.buffer=ab;src.connect(audioCtx.destination);const when=Math.max(audioCtx.currentTime,window._audioEnd||audioCtx.currentTime);src.start(when);window._audioEnd=when+ab.duration;playing.push(src);$("audioState").textContent="播放中";src.onended=()=>{playing=playing.filter(x=>x!==src);if(!playing.length)$("audioState").textContent="待命"}}catch(e){logMsg("Audio playback ERROR: "+e.message)}}
function downsample(float32,inRate,outRate){if(inRate===outRate){const out=new Int16Array(float32.length);for(let i=0;i<float32.length;i++)out[i]=Math.max(-1,Math.min(1,float32[i]))*32767;return out}const ratio=inRate/outRate,n=Math.round(float32.length/ratio),out=new Int16Array(n);let off=0;for(let i=0;i<n;i++){const next=Math.min(float32.length,Math.round((i+1)*ratio));let sum=0,c=0;for(let j=off;j<next;j++){sum+=float32[j];c++}const v=c?sum/c:0;out[i]=Math.max(-1,Math.min(1,v))*32767;off=next}return out}
function pcmB64(a){const bytes=new Uint8Array(a.buffer),s=[];for(let i=0;i<bytes.length;i+=0x8000)s.push(String.fromCharCode(...bytes.subarray(i,i+0x8000)));return btoa(s.join(""))}
async function sendFrame(){if(frameBusy||!stream||!ws||ws.readyState!==1||video.readyState<2)return;frameBusy=true;try{const w=Math.min(768,video.videoWidth||768),h=Math.round(w*((video.videoHeight||576)/(video.videoWidth||768)));canvas.width=w;canvas.height=h;canvas.getContext("2d").drawImage(video,0,0,w,h);const blob=await new Promise(r=>canvas.toBlob(r,"image/jpeg",.72));if(blob){ws.send(JSON.stringify({type:"video",data:await b64(blob),mimeType:"image/jpeg"}));frameCount++;$("frames").textContent=frameCount}}catch(e){logMsg("Frame ERROR: "+e.message)}finally{frameBusy=false}}
function startMic(){if(!stream)return;micCtx=new (window.AudioContext||window.webkitAudioContext)();micCtx.resume();micSource=micCtx.createMediaStreamSource(stream);processor=micCtx.createScriptProcessor(4096,1,1);processor.onaudioprocess=e=>{if(!ws||ws.readyState!==1)return;const pcm=downsample(e.inputBuffer.getChannelData(0),micCtx.sampleRate,16000);ws.send(JSON.stringify({type:"audio",data:pcmB64(pcm),mimeType:"audio/pcm;rate=16000"}))};micSource.connect(processor);processor.connect(micCtx.destination);$("mic").textContent="聆聽中"}
function stopMic(){try{processor?.disconnect();micSource?.disconnect();micCtx?.close()}catch{}processor=null;micSource=null;micCtx=null;$("mic").textContent="已停止"}
function connect(){const v=encodeURIComponent(voiceSel.value);ws=new WebSocket(FN+"?voice="+v);status("連線中…");ws.onopen=()=>{status("已連線");logMsg("Realtime voice + vision connected")};ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==="live_open"){logMsg("Live / voice="+(m.voiceName||"default"));return}if(m.setupComplete){logMsg("Live setup complete");return}if(m.error){logMsg("ERROR: "+JSON.stringify(m.error));return}if(m.audio){playPCM(m.audio.data,m.audio.mimeType);return}const c=m.serverContent;if(c?.interimInputTranscription?.text)replaceInterim("you",c.interimInputTranscription.text);if(c?.inputTranscription?.text)finalText("you",c.inputTranscription.text);if(c?.outputTranscription?.text)replaceInterim("dark",c.outputTranscription.text);if(c?.turnComplete){if(darkInterim){const t=darkInterim.textContent.replace(/^暗星：/,'');finalText("dark",t)}logMsg("turn complete")}if(c?.interrupted){stopPlayback();logMsg("暗星語音被使用者打斷")}if(m.usageMetadata)logMsg("usage received")}catch(e){logMsg("Message parse ERROR: "+e.message)}};ws.onerror=()=>{status("連線錯誤");logMsg("WebSocket ERROR")};ws.onclose=()=>{status("已關閉");logMsg("WebSocket CLOSED")}}
async function start(){if(stream)return;try{const AC=window.AudioContext||window.webkitAudioContext;audioCtx=audioCtx||new AC({sampleRate:24000});await audioCtx.resume();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});video.srcObject=stream;await video.play();$("cameraStatus").textContent="視訊＋麥克風已啟動";$("liveStatus").textContent="● LIVE";startBtn.disabled=true;stopBtn.disabled=false;connect();setTimeout(()=>{startMic();sendFrame();videoTimer=setInterval(sendFrame,1000)},700)}catch(e){logMsg("START ERROR: "+(e?.message||e));alert("請允許攝像頭與麥克風權限後再測試。")}}
function stop(){if(videoTimer){clearInterval(videoTimer);videoTimer=null}stopMic();stopPlayback();if(ws){try{ws.send(JSON.stringify({type:"close"}))}catch{}try{ws.close()}catch{}ws=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;$("cameraStatus").textContent="已停止";$("liveStatus").textContent="● OFF";startBtn.disabled=false;stopBtn.disabled=true;status("未連線");logMsg("Test stopped")}
startBtn.onclick=start;stopBtn.onclick=stop;voiceSel.onchange=()=>{if(ws){logMsg("聲音變更需重新開始測試："+voiceSel.value)}};window.addEventListener("beforeunload",stop);
</script></body></html>
