<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Technical Dark Star｜即時視訊視覺測試</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#202123;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif}body{min-height:100dvh}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:920px;margin:0 auto;padding:16px}.top{display:flex;align-items:center;gap:10px;border-bottom:1px solid #eee;padding:4px 0 14px;margin-bottom:14px}.mark{width:38px;height:38px;border-radius:11px;background:#171717;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}h1{font-size:18px;margin:0;font-weight:650}.sub{font-size:12px;color:#888;margin-top:3px}.badge{margin-left:auto;padding:6px 9px;border-radius:999px;background:#f4f4f4;color:#666;font-size:11px}.card{border:1px solid #e5e5e5;border-radius:16px;padding:14px;margin-bottom:12px;background:#fff}.card h2{font-size:14px;margin:0 0 10px}.video-wrap{position:relative;background:#111;border-radius:14px;overflow:hidden;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}video{width:100%;height:100%;object-fit:cover;display:block;transform:none}#canvas{display:none}.status{position:absolute;left:10px;top:10px;padding:7px 10px;border-radius:999px;background:rgba(0,0,0,.68);color:#fff;font-size:11px}.live-dot{position:absolute;right:10px;top:10px;padding:7px 10px;border-radius:999px;background:rgba(0,0,0,.68);color:#fff;font-size:11px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px 13px;color:#333}.btn.primary{background:#171717;color:#fff;border-color:#171717}.btn.danger{border-color:#e8caca;color:#b42318}.btn:disabled{opacity:.4;cursor:default}.prompt{width:100%;min-height:76px;border:1px solid #ddd;border-radius:11px;padding:10px;resize:vertical;outline:none}.prompt:focus{border-color:#999}.result{min-height:130px;white-space:pre-wrap;word-break:break-word;line-height:1.7;font-size:15px}.result.empty{color:#999;font-size:13px}.log{max-height:200px;overflow:auto;background:#111;color:#ddd;border-radius:11px;padding:10px;font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#f7f7f7;border-radius:11px;padding:10px}.metric b{display:block;font-size:16px;margin-top:3px}.metric span{font-size:11px;color:#777}.notice{font-size:12px;color:#666;line-height:1.7}.ok{color:#15803d}.bad{color:#b42318}@media(max-width:620px){.app{padding:11px}.grid{grid-template-columns:1fr}.badge{display:none}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="mark">🌑</div><div><h1>Technical Dark Star｜即時視訊視覺測試</h1><div class="sub">獨立測試頁｜真正連續視訊，不是照片分析</div></div><div class="badge" id="connectionBadge">尚未連線</div></div>
<section class="card">
<h2>🎥 1. 開啟 iPhone 攝像頭</h2>
<div class="video-wrap"><video id="video" playsinline muted></video><div class="status" id="cameraStatus">攝像頭尚未啟動</div><div class="live-dot" id="liveStatus">● 尚未串流</div></div>
<canvas id="canvas"></canvas>
<div class="controls"><button class="btn primary" id="cameraBtn">🎥 開啟攝像頭</button><button class="btn primary" id="connectBtn">🔌 連接暗星視覺核心</button><button class="btn primary" id="liveBtn" disabled>▶️ 開始即時視訊</button><button class="btn danger" id="stopBtn" disabled>⏹ 停止即時視訊</button></div>
<p class="notice"><b>本頁只測試連續視訊。</b>不提供「拍一張」功能。開始後會持續從攝像頭擷取視訊影格送入 Live 視覺核心，用來測試暗星的觀察、變化辨識與反應速度。</p>
</section>
<section class="card"><h2>🧠 2. 即時要求</h2><textarea class="prompt" id="prompt">暗星，持續觀察我現在的視訊畫面。請注意畫面中的人物、物件、文字與環境變化；只有在你確認看見重要變化時才回答。</textarea><div class="controls"><button class="btn" id="askBtn" disabled>🗣️ 立即詢問暗星目前看到什麼</button></div></section>
<section class="card"><h2>🌑 暗星即時視覺回答</h2><div id="result" class="result empty">尚未收到暗星的即時視覺回答。</div></section>
<section class="card"><h2>⚡ 即時速度測試</h2><div class="grid"><div class="metric"><span>攝像頭</span><b id="mCamera">未啟動</b></div><div class="metric"><span>Live</span><b id="mSocket">未連線</b></div><div class="metric"><span>串流影格</span><b id="mFrames">0</b></div><div class="metric"><span>最後回答</span><b id="mReply">—</b></div><div class="metric"><span>最後影格時間</span><b id="mFrameTime">—</b></div><div class="metric"><span>回答延遲</span><b id="mLatency">—</b></div></div></section>
<section class="card"><h2>🧪 技術事件</h2><div id="log" class="log">等待測試…</div></section>
</div>
<script>
const SUPABASE_URL="https://clcddygkaaqqtsbswgdf.supabase.co";
const WS_URL=SUPABASE_URL.replace(/^https:/,"wss:")+"/functions/v1/technical-dark-star-vision-test";
const $=id=>document.getElementById(id);const video=$("video"),canvas=$("canvas"),cameraBtn=$("cameraBtn"),connectBtn=$("connectBtn"),liveBtn=$("liveBtn"),stopBtn=$("stopBtn"),askBtn=$("askBtn"),prompt=$("prompt"),result=$("result"),log=$("log");
let stream=null,ws=null,liveTimer=null,frames=0,lastFrameSentAt=0,lastReplyAt=0,frameBusy=false;
function logMsg(s){const t=new Date().toLocaleTimeString();log.textContent+=`\n[${t}] ${s}`;log.scrollTop=log.scrollHeight}
function setSocket(s){$("mSocket").textContent=s;$("connectionBadge").textContent=s;$("connectionBadge").className="badge"+(s.includes("已連線")?" ok":s.includes("錯")?" bad":"")}
function appendResult(text){if(!text)return;result.classList.remove("empty");result.textContent+=text;lastReplyAt=performance.now();$("mReply").textContent=new Date().toLocaleTimeString();if(lastFrameSentAt){$("mLatency").textContent=Math.max(0,Math.round(lastReplyAt-lastFrameSentAt))+" ms"}}
function resetResult(){result.classList.add("empty");result.textContent="";$("mLatency").textContent="—"}
function b64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(",")[1]||"");r.onerror=reject;r.readAsDataURL(blob)})}
async function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();cameraBtn.disabled=true;cameraStatus.textContent="攝像頭已啟動";$("mCamera").textContent="已啟動";liveBtn.disabled=!(ws&&ws.readyState===WebSocket.OPEN);stopBtn.disabled=false;logMsg("Camera OK")}catch(e){cameraStatus.textContent="攝像頭啟動失敗";logMsg("Camera ERROR: "+(e?.message||e));alert("無法取得攝像頭，請允許此 GitHub Pages 網站使用攝像頭。")}}
function connect(){if(ws&&ws.readyState===WebSocket.OPEN)return;resetResult();setSocket("連線中…");logMsg("Connecting realtime vision core");ws=new WebSocket(WS_URL);ws.onopen=()=>{setSocket("已連線");askBtn.disabled=false;liveBtn.disabled=!stream;logMsg("WebSocket OPEN");sendText("Technical Dark Star 即時視訊測試開始。請準備持續接收攝像頭影格，不要把這當成單張照片分析。")};ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==="live_open"){logMsg("Live core OPEN / "+(m.model||"unknown"));return}if(m.setupComplete){logMsg("Live setup complete");return}if(m.error){logMsg("ERROR: "+JSON.stringify(m.error));return}if(m.serverContent?.outputTranscription?.text)appendResult(m.serverContent.outputTranscription.text);if(m.serverContent?.turnComplete)logMsg("turn complete");if(m.serverContent?.interrupted)logMsg("interrupted");if(m.usageMetadata)logMsg("usage received")}catch(err){logMsg("Message parse error: "+err)}};ws.onerror=()=>{setSocket("連線錯誤");logMsg("WebSocket ERROR")};ws.onclose=()=>{setSocket("已關閉");askBtn.disabled=true;liveBtn.disabled=true;logMsg("WebSocket CLOSED")}}
function sendText(text){if(!ws||ws.readyState!==WebSocket.OPEN)return false;ws.send(JSON.stringify({type:"text",text}));return true}
async function captureAndSend(){if(!stream||!ws||ws.readyState!==WebSocket.OPEN||frameBusy||video.readyState<2)return false;frameBusy=true;try{const w=Math.min(768,video.videoWidth||768),h=Math.round(w*((video.videoHeight||576)/(video.videoWidth||768)));canvas.width=w;canvas.height=h;const ctx=canvas.getContext("2d");ctx.drawImage(video,0,0,w,h);const blob=await new Promise(r=>canvas.toBlob(r,"image/jpeg",.72));if(!blob)throw new Error("JPEG frame failed");const data=await b64(blob);lastFrameSentAt=performance.now();ws.send(JSON.stringify({type:"video",data,mimeType:"image/jpeg"}));frames++;$("mFrames").textContent=String(frames);$("mFrameTime").textContent=new Date().toLocaleTimeString();return true}catch(e){logMsg("Frame ERROR: "+(e?.message||e));return false}finally{frameBusy=false}}
function startLive(){if(liveTimer||!stream||!ws||ws.readyState!==WebSocket.OPEN)return;resetResult();liveBtn.textContent="🔴 即時視訊串流中";liveBtn.disabled=true;cameraStatus.textContent="攝像頭持續串流中";$("liveStatus").textContent="● LIVE 1 FPS";logMsg("REALTIME VIDEO START / continuous frames / 1 FPS");captureAndSend();liveTimer=setInterval(captureAndSend,1000);sendText(prompt.value.trim()||"持續觀察目前視訊畫面。")}
function stopLive(){if(liveTimer){clearInterval(liveTimer);liveTimer=null}liveBtn.textContent="▶️ 開始即時視訊";liveBtn.disabled=!stream;$("liveStatus").textContent="● 已停止串流";logMsg("REALTIME VIDEO STOP")}
function stopAll(){stopLive();if(ws){try{ws.close()}catch{}ws=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;cameraBtn.disabled=false;stopBtn.disabled=true;liveBtn.disabled=true;askBtn.disabled=true;$("mCamera").textContent="已停止";cameraStatus.textContent="攝像頭已停止";setSocket("未連線");logMsg("Test stopped")}
cameraBtn.onclick=startCamera;connectBtn.onclick=connect;liveBtn.onclick=startLive;stopBtn.onclick=stopAll;askBtn.onclick=()=>{resetResult();sendText(prompt.value.trim()||"暗星，現在看到什麼？")};window.addEventListener("beforeunload",()=>{try{if(ws)ws.close()}catch{}try{if(stream)stream.getTracks().forEach(t=>t.stop())}catch{}});
</script>
</body>
</html>
