<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT 3D 人物工作室</title><style>body{margin:0;background:#142c45;color:#fff;font-family:system-ui}#view{height:72dvh}#panel{padding:14px}button{background:#285578;border:1px solid #9ec9e9;color:white;border-radius:10px;padding:10px;margin:3px}#status{font-size:13px;line-height:1.5}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><div id="view"></div><div id="panel"><b>AIVAULT 3D 人物工作室｜獨立測試</b><p id="status">載入真正的骨架人物中……</p><button id="idle">待命</button><button id="walk">走路（骨架測試）</button><button id="reset">重設視角</button><p style="font-size:12px">外部 CC0 基礎人物，不是最終冬裝角色；若模型來源失效，會顯示錯誤而不冒充成功。</p></div><script type="module">import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';const el=document.getElementById('view'),s=document.getElementById('status');let r;try{r=new T.WebGLRenderer({antialias:true});}catch(e){s.textContent='WebGL 初始化失敗：'+e.message;throw e}r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(el.clientWidth,el.clientHeight);r.outputColorSpace=T.SRGBColorSpace;el.appendChild(r.domElement);const scene=new T.Scene();scene.background=new T.Color(0x9cb9cf);const cam=new T.PerspectiveCamera(40,el.clientWidth/el.clientHeight,.1,100);cam.position.set(2,2.2,5);const ctl=new OrbitControls(cam,r.domElement);ctl.target.set(0,1,0);ctl.enableDamping=true;ctl.update();scene.add(new T.HemisphereLight(0xffffff,0x657688,2.5));const l=new T.DirectionalLight(0xfff4e3,2.2);l.position.set(4,8,6);scene.add(l);const floor=new T.Mesh(new T.CylinderGeometry(2,2,.15,64),new T.MeshStandardMaterial({color:0xdce9f1}));floor.position.y=-.1;scene.add(floor);let obj=null,mixer=null,action=null,clock=new T.Clock(),mode='idle';const src='https://raw.githubusercontent.com/programasweights/avatar/main/public/assets/character.glb';new GLTFLoader().load(src,g=>{obj=g.scene;const b=new T.Box3().setFromObject(obj),size=b.getSize(new T.Vector3()),center=b.getCenter(new T.Vector3());const sc=2/Math.max(size.y,.01);obj.scale.setScalar(sc);obj.position.set(-center.x*sc,-b.min.y*sc,-center.z*sc);scene.add(obj);mixer=new T.AnimationMixer(obj);if(g.animations.length){action=mixer.clipAction(g.animations[0]);action.play()}s.textContent='已載入真實 GLB 骨架人物。動畫片段：'+g.animations.length+'；此素材未內建走路動畫。';},undefined,e=>{s.textContent='模型載入失敗（外部來源或網路限制）。尚未完成 3D 人物整合。';});document.getElementById('idle').onclick=()=>{mode='idle';s.textContent=obj?'待命模式。骨架人物已載入，尚無正式待命動作。':'模型尚未載入。'};document.getElementById('walk').onclick=()=>{mode='walk';s.textContent=obj?'骨架位移測試，不是正式走路動畫。':'模型尚未載入。'};document.getElementById('reset').onclick=()=>{cam.position.set(2,2.2,5);ctl.target.set(0,1,0);ctl.update()};function loop(){requestAnimationFrame(loop);const dt=clock.getDelta();if(mixer)mixer.update(dt);if(obj){obj.rotation.y+=dt*.12;if(mode==='walk')obj.position.x=Math.sin(clock.elapsedTime*.7)*.4;else obj.position.x=0}ctl.update();r.render(scene,cam)}loop();addEventListener('resize',()=>{cam.aspect=el.clientWidth/el.clientHeight;cam.updateProjectionMatrix();r.setSize(el.clientWidth,el.clientHeight)});</script></body></html>
