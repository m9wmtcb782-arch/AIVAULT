<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111">
<title>Technical Dark Star｜暗星即時語音</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}.top{padding:18px 18px 14px;border-bottom:1px solid #ddd;position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);z-index:5}.brand{display:flex;align-items:center;gap:12px}.star{width:48px;height:48px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:27px;box-shadow:0 3px 12px #bbb}.title{font-size:25px;font-weight:800}.engine{font-size:13px;color:#777;margin-top:2px}.main{max-width:760px;margin:0 auto;padding:16px}.panel{border:1px solid #ddd;border-radius:18px;padding:15px;margin-bottom:14px;background:#fff}.label{font-size:14px;color:#666;margin-bottom:8px}.select{width:100%;font-size:19px;padding:13px;border:1px solid #bbb;border-radius:12px;background:#fff}.hint{font-size:13px;color:#777;margin-top:7px}.row{display:flex;gap:10px;flex-wrap:wrap}.btn{flex:1;min-width:140px;font-size:19px;font-weight:700;padding:14px 16px;border:1px solid #222;border-radius:13px;background:#fff}.btn.primary{background:#111;color:#fff}.btn:disabled{opacity:.4}.status{padding:14px;border-radius:13px;background:#f2f2f2;font-size:18px}.chat{min-height:120px}.bubble{margin:10px 0;padding:13px 15px;border-radius:16px;white-space:pre-wrap;line-height:1.5;font-size:18px}.user{background:#eef5ff}.ai{background:#f2f2f2}.role{font-weight:700;margin-bottom:4px}.log{margin-top:14px;background:#111;color:#0f0;padding:12px;border-radius:12px;height:170px;overflow:auto;font:12px ui-monospace,monospace;white-space:pre-wrap}.footer{font-size:13px;color:#888;text-align:center;padding:10px 0 25px}.voiceTag{display:inline-block;font-size:12px;padding:3px 7px;border-radius:999px;background:#eee;color:#555;margin-left:6px}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="star">★</div><div><div class="title">Technical Dark Star</div><div class="engine">暗星｜AIVAULT 即時語音</div></div></div></header>
<main class="main">
<section class="panel">
 <div class="label">暗星聲音</div>
 <select id="voice" class="select">
  <option value="Kore">Kore｜堅定・清晰</option>
  <option value="Puck">Puck｜活潑・開朗</option>
  <option value="Charon">Charon｜資訊豐富・穩重</option>
  <option value="Aoede">Aoede｜輕快・自然</option>
  <option value="Leda">Leda｜年輕・俐落</option>
  <option value="Fenrir">Fenrir｜興奮・有能量</option>
  <option value="Orus">Orus｜堅定・自信</option>
  <option value="Zephyr">Zephyr｜明亮・輕鬆</option>
  <option value="Callirrhoe">Callirrhoe｜輕鬆・自然</option>
  <option value="Autonoe">Autonoe｜明亮・溫和</option>
  <option value="Enceladus">Enceladus｜輕柔・帶氣聲</option>
  <option value="Iapetus">Iapetus｜清晰</option>
  <option value="Umbriel">Umbriel｜輕鬆</option>
  <option value="Algieba">Algieba｜柔和</option>
  <option value="Despina">Despina｜流暢</option>
  <option value="Erinome">Erinome｜清晰</option>
  <option value="Algenib">Algenib｜沙啞</option>
  <option value="Rasalgethi">Rasalgethi｜資訊豐富</option>
  <option value="Laomedeia">Laomedeia｜活潑</option>
  <option value="Achernar">Achernar｜柔和</option>
  <option value="Alnilam">Alnilam｜堅定</option>
  <option value="Schedar">Schedar｜平穩</option>
  <option value="Gacrux">Gacrux｜成熟</option>
  <option value="Achird">Achird｜友善</option>
  <option value="Zubenelgenubi">Zubenelgenubi｜隨和</option>
  <option value="Sadachbia">Sadachbia｜活潑</option>
  <option value="Sadaltager">Sadaltager｜博學</option>
  <option value="Pulcherrima">Pulcherrima｜積極</option>
  <option value="Vindemiatrix">Vindemiatrix｜溫和</option>
  <option value="Sulafat">Sulafat｜溫暖</option>
 </select>
 <div class="hint">聲音在開始連線時設定；若要換聲音，先停止，再選新的聲音後重新開始。</div>
</section>
<section class="panel">
 <div id="status" class="status">尚未連線</div>
 <div class="row" style="margin-top:12px"><button id="start" class="btn primary">🎙️ 開始與暗星對話</button><button id="stop" class="btn" disabled>停止</button></div>
</section>
<section class="panel"><div class="chat" id="chat"></div></section>
<section class="panel"><div class="label">連線紀錄</div><div class="log" id="log"></div></section>
<div class="footer">Technical Dark Star 暗星｜語音對話獨立模組<br>不修改原本 technical-dark-star.html 的麥克風功能</div>
</main>
<script>
const SUPA='https://clcddygkaaqqtsbswgdf.supabase.co';
const SESSION=SUPA+'/functions/v1/technical-dark-star-voice-session';
const RELAY=SUPA.replace('https://','wss://')+'/functions/v1/technical-dark-star-voice-sdk-relay';
let ws=null,stream=null,ctx=null,processor=null,source=null,sessionKey=null,seq=0;let inputText='',outputText='',playAt=0;
const $=id=>document.getElementById(id);
function log(x){$('log').textContent+=new Date().toLocaleTimeString()+' '+x+'\n';$('log').scrollTop=$('log').scrollHeight}
function status(x){$('status').textContent=x;log(x)}
function add(role,text){if(!text)return;const d=document.createElement('div');d.className='bubble '+(role==='user'?'user':'ai');const r=document.createElement('div');r.className='role';r.textContent=role==='user'?'你':'暗星';d.appendChild(r);const t=document.createElement('div');t.textContent=text;d.appendChild(t);$('chat').appendChild(d);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function b64(u8){let s='';const n=0x8000;for(let i=0;i<u8.length;i+=n)s+=String.fromCharCode(...u8.subarray(i,i+n));return btoa(s)}
function resample(input,inRate,outRate){if(inRate===outRate)return input;const ratio=inRate/outRate,len=Math.round(input.length/ratio),out=new Float32Array(len);for(let i=0;i<len;i++){const p=i*ratio,ip=Math.floor(p),f=p-ip,a=input[ip]||0,b=input[ip+1]??a;out[i]=a+(b-a)*f}return out}
function pcm16(f){const out=new Int16Array(f.length);for(let i=0;i<f.length;i++){const x=Math.max(-1,Math.min(1,f[i]));out[i]=x<0?x*32768:x*32767}return new Uint8Array(out.buffer)}
function playPCM(base64){if(!ctx)return;const bin=atob(base64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const pcm=new Int16Array(u.buffer);const buf=ctx.createBuffer(1,pcm.length,24000),ch=buf.getChannelData(0);for(let i=0;i<pcm.length;i++)ch[i]=pcm[i]/32768;const src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);const now=ctx.currentTime;if(playAt<now)playAt=now+.03;src.start(playAt);playAt+=buf.duration}
async function api(action,body={}){const r=await fetch(SESSION,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...body})});return await r.json()}
async function saveTurn(role,content){if(!sessionKey||!content.trim())return;seq++;const r=await api('turn',{session_key:sessionKey,role,content:content.trim(),sequence_no:seq});log('SAVE '+role+' '+(r?.success===false?'FAIL':'OK'))}
async function start(){
 $('start').disabled=true;$('stop').disabled=false;$('voice').disabled=true;$('chat').innerHTML='';$('log').textContent='';inputText='';outputText='';seq=0;
 const voice=$('voice').value;
 try{status('暗星正在建立語音工作階段…');const s=await api('start',{voice_name:voice,metadata:{transport:'sdk-relay',voice}});sessionKey=s.session?.session_key||s.session_key;if(!sessionKey)throw Error('session_key missing');ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();ws=new WebSocket(RELAY+'?session_key='+encodeURIComponent(sessionKey)+'&voice='+encodeURIComponent(voice));ws.onopen=()=>status('暗星 Relay 已連線，等待 Gemini Live…');ws.onmessage=async e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='relay_open')log('暗星 Relay OPEN｜'+m.voice);else if(m.type==='live_open')status('暗星 Live 已連線｜聲音：'+m.voice);else if(m.type==='sdk_connected')status('暗星語音引擎已建立｜聲音：'+m.voice);else if(m.type==='setup_complete'){status('🟢 暗星可以聽你說話｜'+m.voice);await mic()}else if(m.type==='input_transcription'){inputText+=m.text||''}else if(m.type==='output_transcription'){outputText+=m.text||''}else if(m.type==='audio')playPCM(m.data);else if(m.type==='turn_complete'){const u=inputText.trim(),a=outputText.trim();add('user',u);add('assistant',a);await saveTurn('user',u);await saveTurn('assistant',a);inputText='';outputText='';status('🟢 暗星正在聽你說話')}else if(m.type==='relay_error')status('❌ '+m.stage+': '+m.error);else if(m.type==='live_close')log('LIVE CLOSE '+m.code+' '+m.reason)};ws.onerror=()=>status('❌ 暗星 Relay WebSocket 錯誤');ws.onclose=()=>{log('RELAY CLOSE');stop(false)}}catch(e){status('❌ '+e.message);stop(false)}}
async function mic(){if(stream)return;stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});await ctx.resume();const rate=ctx.sampleRate;log('MIC '+rate+'Hz → 16000Hz');source=ctx.createMediaStreamSource(stream);processor=ctx.createScriptProcessor(4096,1,1);processor.onaudioprocess=e=>{if(!ws||ws.readyState!==1)return;const f=resample(e.inputBuffer.getChannelData(0),rate,16000);ws.send(JSON.stringify({type:'audio',data:b64(pcm16(f)),mimeType:'audio/pcm;rate=16000'}))};source.connect(processor);processor.connect(ctx.destination)}
function stop(sendClose=true){try{if(processor)processor.disconnect();if(source)source.disconnect();if(stream)stream.getTracks().forEach(t=>t.stop());if(sendClose&&ws&&ws.readyState===1)ws.send(JSON.stringify({type:'close'}));if(ws)ws.close()}catch{}processor=null;source=null;stream=null;ws=null;$('start').disabled=false;$('stop').disabled=true;$('voice').disabled=false;status('已停止')}
$('start').onclick=start;$('stop').onclick=()=>stop(true);
</script>
</body>
</html>
