<script>
(function () {
  var NAV_HTML =
    '<a href="https://m9wmtcb782-arch.github.io/AIVAULT/aivault-agent-collaboration.html" target="_top">🤝 AI 協作池</a>' +
    '<a href="https://m9wmtcb782-arch.github.io/AIVAULT/aivault-compute-mesh.html" target="_top">⚡ 算力池</a>' +
    '<a href="aivault-dark-star-youtube-studio.html" target="_top">▶️ 暗星 YouTube 授權</a>' +
    '<a href="ncl-studio/" target="_top">⚙️ NCL 程式語言</a>';
  var nav = document.getElementById('aivaultTopNav');
  function lockNav() {
    if (!nav) return;
    if (nav.getAttribute('data-locked') === '1' && nav.children.length === 4) return;
    nav.innerHTML = NAV_HTML;
    nav.setAttribute('data-locked', '1');
  }
  lockNav();
  if (window.MutationObserver && nav) {
    new MutationObserver(function () {
      if (nav.children.length !== 4) {
        nav.setAttribute('data-locked', '0');
        lockNav();
      }
    }).observe(nav, { childList: true });
  }
  document.querySelectorAll('.home-nav').forEach(function (el) {
    if (el !== nav) el.remove();
  });

  // Inject tax card below digital human in iframe
  var frame = document.getElementById('aivaultApp');
  function injectTax() {
    try {
      var doc = frame.contentDocument;
      if (!doc || doc.getElementById('taxSimEntry')) return;
      var dawn = doc.getElementById('dawnMaleEntry');
      if (!dawn) return;
      var card = doc.createElement('a');
      card.id = 'taxSimEntry';
      card.href = 'ai-tax-jarvis-command.html';
      card.target = '_top';
      card.className = 'agent-card';
      card.style.cssText = 'margin-bottom:16px;grid-column:1/-1;display:block;text-decoration:none;color:inherit;border-color:rgba(212,168,67,.5);background:linear-gradient(135deg,#1e3a5f,#0f172a);';
      card.innerHTML = '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;"><div><div class="agent-name" style="font-size:15px;">⚖️ AI稅務模擬專區</div><div class="agent-role" style="margin-bottom:0;">12 推理引擎 · 安全指數光圈 · NCL 統籌</div></div><div class="scale-btn" style="flex-shrink:0;width:52px;height:52px;perspective:120px;"><div class="scale-3d" style="width:100%;height:100%;display:grid;place-items:center;font-size:28px;animation:scaleTilt 3s ease-in-out infinite;">⚖️</div></div></div>';
      var style = doc.createElement('style');
      style.textContent = '@keyframes scaleTilt{0%,100%{transform:rotateY(0deg) rotateX(0deg)}25%{transform:rotateY(20deg) rotateX(8deg)}50%{transform:rotateY(0deg) rotateX(0deg)}75%{transform:rotateY(-20deg) rotateX(-8deg)}}';
      doc.head.appendChild(style);
      dawn.parentNode.insertBefore(card, dawn.nextSibling);
    } catch (e) {}
  }
  frame.addEventListener('load', function () { setTimeout(injectTax, 400); });
  setTimeout(injectTax, 1200);
})();
</script>
