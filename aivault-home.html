<script>
(function () {
  try {
    if (window.top !== window.self) {
      window.top.location.replace('https://m9wmtcb782-arch.github.io/AIVAULT/aivault-home.html');
      return;
    }
  } catch (e) {}
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (reg) { reg.unregister(); });
    });
  }
  if (window.caches && caches.keys) {
    caches.keys().then(function (keys) {
      keys.forEach(function (key) { caches.delete(key); });
    });
  }
})();
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
.home-nav{position:fixed;top:0;left:0;right:0;z-index:1000;height:56px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:8px;padding:8px 10px;box-sizing:border-box;overflow-x:auto;overflow-y:hidden}
.home-nav a{height:40px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;padding:0 12px;border-radius:12px;border:1px solid #e2e8f0;background:#fff;color:#334155;text-decoration:none;font-size:14px;font-weight:700;white-space:nowrap}
@media(max-width:360px){.home-nav a{padding:0 8px;font-size:13px}}
iframe{display:block;position:absolute;top:56px;left:0;width:100%;height:calc(100% - 56px);border:0;background:#fff}
html:not(.av-authed) .home-nav{display:none}
html:not(.av-authed) iframe{top:0;height:100%}
</style>
<script>
(function(){try{var j=JSON.parse(localStorage.getItem('sb-clcddygkaaqqtsbswgdf-auth-token')||'null');var u=j&&(j.user||(j.currentSession&&j.currentSession.user));if(u&&(j.refresh_token||(j.currentSession&&j.currentSession.refresh_token)))document.documentElement.classList.add('av-authed');}catch(e){}})();
window.addEventListener('storage',function(e){if(e.key==='sb-clcddygkaaqqtsbswgdf-auth-token'&&!e.newValue)document.documentElement.classList.remove('av-authed');});
</script>
</head>
<body>
<nav class="home-nav" id="aivaultTopNav" aria-label="AIVAULT 快速入口"></nav>
<iframe id="aivaultApp" src="aivault-home-original-dark.html?v=20261016-yx3" title="AIVAULT"></iframe>
<script>
(function () {
  var NAV_HTML =
    '<a href="https://m9wmtcb782-arch.github.io/AIVAULT/aivault-agent-collaboration.html" target="_top">🤝 AI 協作池</a>' +
    '<a href="https://m9wmtcb782-arch.github.io/AIVAULT/aivault-compute-mesh.html" target="_top">⚡ 算力池</a>';
  var nav = document.getElementById('aivaultTopNav');
  function lockNav() {
    if (!nav) return;
    if (nav.getAttribute('data-locked') === '1' && nav.children.length === 2) return;
    nav.innerHTML = NAV_HTML;
    nav.setAttribute('data-locked', '1');
  }
  lockNav();
  if (window.MutationObserver && nav) {
    new MutationObserver(function () {
      if (nav.children.length !== 2) {
        nav.setAttribute('data-locked', '0');
        lockNav();
      }
    }).observe(nav, { childList: true });
  }
  document.querySelectorAll('.home-nav').forEach(function (el) {
    if (el !== nav) el.remove();
  });
})();
</script>
</body>
