2a!important;--text-muted:#64748b!important}.header{background:rgba(255,255,255,.94)!important;border-color:#e2e8f0!important}.tabs{background:#fff!important;border-color:#e2e8f0!important}.gear-btn{background:#f8fafc!important;color:#334155!important;border-color:#e2e8f0!important}.account-mask{background:rgba(15,23,42,.28)!important}.account-panel{background:#fff!important;color:#0f172a!important;border-color:#e2e8f0!important}.account-panel input{background:#fff!important;color:#0f172a!important;border-color:#cbd5e1!important}.agent-card,.task-item,.chat-container,.workflow,.registry-item,.room-ask,.stat-card,.chart-card,.proposal-doc,.library-item{background:#fff!important;color:#0f172a!important;border-color:#e2e8f0!important}.agent-card:hover{background:#f8fafc!important}.task-item.active{background:#f8fbff!important}.msg.agent .msg-bubble{background:#f1f5f9!important;color:#0f172a!important}.chat-input-area{background:#fff!important;border-color:#e2e8f0!important}.chat-input{background:#fff!important;color:#0f172a!important;border-color:#cbd5e1!important}.agent-pick-bar{background:#fff!important;border-color:#e2e8f0!important}.agent-chip{background:#f8fafc!important;color:#64748b!important;border-color:#cbd5e1!important}.agent-chip.selected{background:#eff6ff!important;color:#2563eb!important}.step-num{background:#e2e8f0!important;color:#334155!important}.workflow-step:not(:last-child)::after{background:#e2e8f0!important}.toast{background:#fff!important;color:#0f172a!important;border-color:#cbd5e1!important;box-shadow:0 8px 30px rgba(15,23,42,.12)!important}.proposal-bar,.room-bar{background:rgba(255,255,255,.96)!important;color:#0f172a!important;border-color:#e2e8f0!important}.studio{background:#fff!important;border-color:#e2e8f0!important}.anchor{background:#f8fafc!important;border-color:#e2e8f0!important}.demo-note{border-color:#e2e8f0!important}.aivault-luna-brain{border:1px solid #c4b5fd!important;background:linear-gradient(135deg,#f5f3ff,#ffffff)!import
