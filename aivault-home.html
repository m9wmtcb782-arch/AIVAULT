<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AIVAULT — AI Agent 協作工作平台</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:-apple-system,"Noto Sans TC",sans-serif}
.home-nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px}
.home-nav a{height:40px;display:inline-flex;align-items:center;padding:0 12px;border-radius:12px;border:1px solid #e2e8f0;background:#fff;color:#334155;text-decoration:none;font-size:14px;font-weight:700}
.home-nav a.ebook{background:#1b1612;color:#f4ead6;border-color:#1b1612}
iframe{display:block;position:absolute;top:96px;left:0;width:100%;height:calc(100% - 96px);border:0}
@media(min-width:520px){iframe{top:56px;height:calc(100% - 56px)}}
</style>
</head>
<body>
<nav class="home-nav">
  <a href="aivault-agent-collaboration.html" target="_top">AI 協作池</a>
  <a href="teaching-assistant-min.html" target="_top">教學助理</a>
  <a class="ebook" href="dark-star-ebook.html?ebook_id=3c203a20-258d-42b1-910f-5f10c8186033" target="_top">電子書</a>
</nav>
<iframe id="aivaultApp" src="aivault-home-original-dark.html" title="AIVAULT"></iframe>
<script>
(function(){
  const f=document.getElementById("aivaultApp");
  function apply(){
    try{
      const d=f.contentDocument; if(!d||!d.body) return;
      if(d.getElementById("aivaultHomeShortcuts")) return;
      const bar=d.createElement("div");
      bar.id="aivaultHomeShortcuts";
      bar.style.cssText="display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid #e2e8f0";
      bar.innerHTML='<a href="teaching-assistant-min.html" target="_top" style="padding:8px 12px;border:1px solid #e2e8f0;border-radius:10px;text-decoration:none;color:#334155;font-weight:700">教學助理</a><a href="dark-star-ebook.html?ebook_id=3c203a20-258d-42b1-910f-5f10c8186033" target="_top" style="padding:8px 12px;border-radius:10px;text-decoration:none;background:#1b1612;color:#f4ead6;font-weight:700">電子書</a>';
      d.body.insertBefore(bar,d.body.firstChild);
    }catch(e){}
  }
  f.addEventListener("load",apply);
  setInterval(apply,800);
})();
</script>
</body>
</html>
