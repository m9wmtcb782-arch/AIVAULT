<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Technical Dark Star｜真實聲音克隆測試 v2</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f8;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:18px;margin:12px 0}button,input,textarea{font:inherit}button{border:1px solid #ccc;background:#fff;border-radius:12px;padding:12px 16px;margin:4px;touch-action:manipulation}button.primary{background:#111;color:#fff}.status{padding:10px;border-radius:12px;background:#eee;margin:10px 0}.ok{color:#087f23}.err{color:#b00020}input,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:12px}.meter{text-align:center;font-size:20px;margin:10px}.wave{height:150px;background:#111;border-radius:14px}.wave canvas{width:100%;height:100%;pointer-events:none}.audio{width:100%;margin-top:10px}</style></head><body><main class="wrap"><h1>🎙️ Technical Dark Star｜真實聲音克隆測試 v2</h1><div>獨立測試頁，不修改 technical-dark-star.html。</div><div id="auth" class="status">正在檢查 Supabase Auth…</div><section class="card"><h2>① 錄音</h2><label>聲音名稱</label><input id="name" value="暗星測試聲音"><div class="wave"><canvas id="canvas"></canvas></div><div id="timer" class="meter">00:00 / 00:45</div><button id="rec" style="width:100%;font-size:18px">🎙️ 開始錄音</button><button id="stop" disabled>⏹ 停止</button><button id="play" disabled>▶ 播放</button><button id="redo" disabled>↻ 重錄</button><audio id="raw" class="audio" controls hidden></audio><div id="mic" class="status">尚未錄音</div></section><section class="card"><h2>② 真正 Voice Clone</h2><button id="clone" class="primary" disabled>🚀 建立真正 Clone Voice</button><div id="cloneStatus" class="status">請先完成錄音。</div></section><section class="card"><h2>③ 真正語音生成</h2><textarea id="text" rows="4">大家好，我是暗星。這是 AIVAULT 真正聲音克隆的播放測試。</textarea><button id="speak" class="primary" disabled>🔊 用 Clone Voice 說出來</button><audio id="out" class="audio" controls hidden></audio></section><section class="card"><h2>結果</h2><pre id="result" style="white-space:pre-wrap">尚未開始</pre></section></main><script>
const URL='https://clcddygkaaqqtsbswgdf.supabase.co';
// v2 只改測試頁 Auth Key：改用同一 Project 的 legacy anon key 做相容性排查。
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsY2RkeWdrYWFxcXRzYnN3Z2RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzUwNjQsImV4cCI6MjEwMjMxMTA2NH0.kYg6h7n74CtbiIjNjZ2xxJj16SV42INZVzQ9dLNUfKE';
const FN=URL+'/functions/v1/technical-dark-star-voice-clone-test';
const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=x=>document.getElementById(x);let rec,stream,chunks=[],blob,rawUrl,voiceId,ctx,analyser,raf,t0,timer,mime='';
async function auth(){try{let r=await sb.auth.getSession();if(r.error)throw r.error;if(r.data.session){$('auth').textContent='✅ 已取得現有 Session';$('auth').className='status ok';return r.data.session}let x=await sb.auth.signInAnonymously();if(x.error)throw x.error;if(!x.data.session)throw Error('匿名登入沒有回傳 Session');$('auth').textContent='✅ Anonymous Session 建立成功（legacy anon key）';$('auth').className='status ok';$('result').textContent='AUTH READY\n已建立匿名 Session';return x.data.session}catch(e){$('auth').innerHTML='❌ '+(e.message||e);$('auth').className='status err';$('result').textContent='AUTH FAILED\n'+(e.message||e);return null}}
function fmt(n){n=Math.floor(n);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function draw(){if(!analyser)return;let c=$('canvas'),r=c.getBoundingClientRect(),d=c.getContext('2d');c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;let a=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(a);d.clearRect(0,0,c.width,c.height);d.strokeStyle='#fff';d.beginPath();a.forEach((v,i)=>{let x=i/(a.length-1)*c.width,y=c.height/2+(v-128)/128*c.height*.4;i?d.lineTo(x,y):d.moveTo(x,y)});d.stroke();raf=requestAnimationFrame(draw)}
function cleanup(){clearInterval(timer);cancelAnimationFrame(raf);if(ctx)ctx.close().catch(()=>{});ctx=null;analyser=null;if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}}
$('rec').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true});mime=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'].find(x=>MediaRecorder.isTypeSupported(x))||'';rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{blob=new Blob(chunks,{type:mime||'audio/webm'});rawUrl&&URL.revokeObjectURL(rawUrl);rawUrl=URL.createObjectURL(blob);$('raw').src=rawUrl;$('raw').hidden=false;$('play').disabled=false;$('redo').disabled=false;$('clone').disabled=!blob.size;$('cloneStatus').textContent='✅ 錄音完成，可建立真正 Clone Voice';cleanup()};rec.start(250);t0=Date.now();$('rec').disabled=true;$('stop').disabled=false;$('clone').disabled=true;$('mic').textContent='🔴 錄音中';timer=setInterval(()=>{let s=(Date.now()-t0)/1000;$('timer').textContent=fmt(s)+' / 00:45';if(s>=45)stop()},100);ctx=new (AudioContext||webkitAudioContext)();let src=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=2048;src.connect(analyser);draw()}catch(e){$('mic').textContent='❌ '+(e.message||e);$('mic').className='status err'}};
function stop(){if(rec&&rec.state!=='inactive'){rec.stop();$('stop').disabled=true;$('rec').disabled=false}}
$('stop').onclick=stop;$('play').onclick=()=>$('raw').play();$('redo').onclick=()=>{blob=null;voiceId=null;$('clone').disabled=true;$('speak').disabled=true;$('raw').hidden=true;$('redo').disabled=true;$('timer').textContent='00:00 / 00:45';$('rec').click()};
$('clone').onclick=async()=>{let s=await auth();if(!s)return;try{$('clone').disabled=true;$('cloneStatus').textContent='⏳ AIVAULT → ElevenLabs 真正 Clone 中…';let fd=new FormData();fd.append('action','clone');fd.append('name',$('name').value.trim()||'暗星測試聲音');fd.append('description','Technical Dark Star isolated voice clone test v2');fd.append('files',blob,'dark-star-sample.'+(blob.type.includes('mp4')?'m4a':blob.type.includes('ogg')?'ogg':'webm'));let session=(await sb.auth.getSession()).data.session;if(!session)throw Error('Session 已失效');let r=await fetch(FN,{method:'POST',headers:{Authorization:'Bearer '+session.access_token,apikey:KEY},body:fd});let j=await r.json();if(!r.ok||!j.success)throw Error(j.error||('HTTP '+r.status));voiceId=j.voice_id;if(!voiceId)throw Error('沒有取得真正 voice_id');$('cloneStatus').textContent='✅ REAL CLONE 成功，Voice ID：'+voiceId;$('cloneStatus').className='status ok';$('speak').disabled=false;$('result').textContent='REAL CLONE SUCCESS\nprovider=elevenlabs\nvoice_id='+voiceId}catch(e){$('cloneStatus').textContent='❌ '+(e.message||e);$('cloneStatus').className='status err';$('result').textContent='CLONE FAILED\n'+(e.message||e);$('clone').disabled=false}};
$('speak').onclick=async()=>{try{let s=await auth();if(!s||!voiceId)return;let r=await fetch(FN,{method:'POST',headers:{Authorization:'Bearer '+s.access_token,apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({action:'speak',voice_id:voiceId,text:$('text').value.trim(),model:'eleven_multilingual_v2'})});let j=await r.json();if(!r.ok||!j.success)throw Error(j.error||('HTTP '+r.status));let bin=atob(j.audio_base64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);let uurl=URL.createObjectURL(new Blob([u],{type:'audio/mpeg'}));$('out').src=uurl;$('out').hidden=false;$('result').textContent+='\nREAL TTS SUCCESS\nbytes='+j.bytes;$('out').play().catch(()=>{})}catch(e){$('result').textContent+='\nTTS FAILED\n'+(e.message||e)}};
auth();
</script></body></html>
