<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIVAULT｜第八章 国家机构体系</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,"Noto Sans TC","Noto Serif CJK SC",serif;background:#15171b;color:#eee}
header{height:52px;background:#101114;border-bottom:1px solid #2b2e35;display:flex;align-items:center;gap:8px;padding:0 10px}
.btn{border:0;border-radius:8px;background:#292c33;color:#fff;padding:8px 12px;text-decoration:none;cursor:pointer;font:inherit}
.title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}.source{font-size:12px;color:#9a8f7d}
.layout{height:calc(100dvh - 52px);display:grid;grid-template-columns:300px 1fr;gap:10px;padding:10px}
aside,main{background:#1d2025;border:1px solid #2c3038;border-radius:10px;overflow:hidden;min-width:0}
aside{display:flex;flex-direction:column}
.meta{padding:14px;border-bottom:1px solid #2c3038}
.toc{overflow:auto}.toc button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#ddd;padding:9px 14px;border-bottom:1px solid #282b31;cursor:pointer}
.toc button:hover,.toc button.on{background:#282b31}
main{display:flex;flex-direction:column;background:#f4efe6;color:#201b16}
.pager{height:44px;display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid #d9d0c2;background:#efe8db}
.pager button{border:0;border-radius:7px;padding:7px 10px;background:#292c33;color:#eee;cursor:pointer}
.paper{flex:1;overflow:auto;padding:28px 32px 48px;line-height:1.9}
.paper h1{font-size:26px;margin:0 0 16px;color:#6b1515}
.paper h2{font-size:20px;margin:28px 0 10px;color:#6b1515;border-bottom:1px solid #d8c9a0;padding-bottom:4px}
.paper h3{font-size:17px;margin:22px 0 8px;color:#7a1d1d}
.paper h4{font-size:15px;margin:16px 0 6px}
.paper p{margin:.55em 0;text-indent:2em}
.paper blockquote{margin:1em 0;padding:.6em .9em;border-left:3px solid #8b1e1e;color:#5a4e42;background:#efe8db}
.paper blockquote p{text-indent:0}
@media(max-width:800px){.layout{grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>
<header>
  <a class="btn" href="dark-star-ebook.html">🔙 回書架</a>
  <a class="btn" href="dark-star-ebook.html?ebook_id=65d955cf-9dce-402c-a938-5a762acafdf1">📖 FlipBook</a>
  <div class="title">第八章　国家机构体系</div>
  <div class="sp"></div>
  <span class="source">憲法學講義｜AIVAULT 遠端教材</span>
</header>
<div class="layout">
  <aside>
    <div class="meta"><b>憲法學課堂講義</b><br><span class="source">已校正斷頁與明顯錯字。源稿止於黑龍江強制婚檢事件引言。</span></div>
    <div class="toc" id="toc"></div>
  </aside>
  <main>
    <div class="pager">
      <button id="prev">← 上一頁</button>
      <span id="lab">第 1 / 26 頁</span>
      <button id="next">下一頁 →</button>
      <div class="sp"></div>
      <span class="source" id="st">載入中…</span>
    </div>
    <article class="paper" id="paper"></article>
  </main>
</div>
<script>
const EBOOK_ID = "65d955cf-9dce-402c-a938-5a762acafdf1";
const API = "https://clcddygkaaqqtsbswgdf.supabase.co/functions/v1/dark-star-ebook-ingest";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsY2RkeWdrYWFxcXRzYnN3Z2RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzUwNjQsImV4cCI6MjEwMjMxMTA2NH0.kYg6h7n74CtbiIjNjZ2xxJj16SV42INZVzQ9dLNUfKE";
const TOC = [
  ["章前导引", 1],
  ["一、国家机构的宪法地位", 1],
  ["二、各国家机关", 2],
  ["（一）全国人民代表大会", 4],
  ["1. 职权", 6],
  ["2. 选举制度", 7],
  ["（二）国家主席", 10],
  ["（三）国务院", 14],
  ["（四）中央军事委员会", 15],
  ["（五）地方各级人大和政府", 16],
  ["（六）民族自治地方的自治机关", 17],
  ["（七）监察委员会", 19],
  ["（八）人民法院和人民检察院", 22],
  ["三、案例分析", 25]
];
let page = 1, total = 26, cache = {};
function esc(s){return String(s??"").replace(/[&<>]/g,c=>({"&":"&","<":"<",">":">"}[c]));}
function md(text){
  return esc(text).split(/\n\n+/).map(function(block){
    const t = block.trim();
    if (!t) return "";
    if (t.startsWith("> ")) return "<blockquote><p>"+t.replace(/^>\s?/,"").replace(/\n>\s?/g,"<br>")+"</p></blockquote>";
    if (t.startsWith("# ")) return "<h1>"+t.slice(2)+"</h1>";
    if (t.startsWith("## ")) return "<h2>"+t.slice(3)+"</h2>";
    if (t.startsWith("### ")) return "<h3>"+t.slice(4)+"</h3>";
    if (t.startsWith("#### ")) return "<h4>"+t.slice(5)+"</h4>";
    return "<p>"+t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>")+"</p>";
  }).join("");
}
async function ingest(payload){
  const r = await fetch(API,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY,Authorization:"Bearer "+KEY},body:JSON.stringify(payload)});
  return r.json();
}
async function load(n){
  if (cache[n]) return cache[n];
  const j = await ingest({action:"book",ebook_id:EBOOK_ID,page_number:n});
  const pg = j.data && j.data.page;
  const book = j.data && j.data.ebook;
  if (book && book.total_pages) total = book.total_pages;
  cache[n] = (pg && pg.content) || "（此頁無內容）";
  return cache[n];
}
async function show(n){
  page = Math.min(total, Math.max(1, n));
  document.getElementById("st").textContent = "載入第 "+page+" 頁…";
  const text = await load(page);
  document.getElementById("paper").innerHTML = md(text);
  document.getElementById("paper").scrollTop = 0;
  document.getElementById("lab").textContent = "第 "+page+" / "+total+" 頁";
  document.getElementById("st").textContent = "遠端教材 " + EBOOK_ID.slice(0,8);
  document.querySelectorAll(".toc button").forEach(function(b){
    b.classList.toggle("on", Number(b.dataset.p)===page);
  });
}
document.getElementById("prev").onclick=function(){show(page-1)};
document.getElementById("next").onclick=function(){show(page+1)};
document.getElementById("toc").innerHTML = TOC.map(function(row){
  return '<button data-p="'+row[1]+'">'+esc(row[0])+'</button>';
}).join("");
document.querySelectorAll(".toc button").forEach(function(b){
  b.onclick=function(){show(Number(b.dataset.p));};
});
show(1);
</script>
</body>
</html>
