<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>登入 · FROST KINGDOM</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body class="game-body">
  <div class="snow-layer"></div>
  <div class="app">
    <div class="page-head"><a class="back" href="game-start.html">← 返回</a><h2>登入帳號</h2></div>
    <div class="panel glass">
      <label>Email</label>
      <input id="email" type="email" autocomplete="username" />
      <label>Password</label>
      <input id="password" type="password" autocomplete="current-password" />
      <label class="check"><input id="remember" type="checkbox" /> 記住帳號</label>
      <div class="msg" id="msg"></div>
      <button class="btn" id="btn">登入</button>
      <div class="linkrow">
        <a href="game-forgot-password.html">忘記密碼</a>
        <a href="game-register.html">註冊新帳號</a>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/boot.js"></script>
  <script>
    const saved = localStorage.getItem("aivault_game_remember_email");
    if (saved) { qs("email").value = saved; qs("remember").checked = true; }
    qs("btn").onclick = () => guarded(async () => {
      const email = qs("email").value.trim();
      const password = qs("password").value;
      if (!email || !password) throw new Error("請輸入 Email 與密碼");
      if (qs("remember").checked) localStorage.setItem("aivault_game_remember_email", email);
      else localStorage.removeItem("aivault_game_remember_email");
      await FKApi.signIn(email, password);
      const p = await FKApi.getPlayer();
      location.href = p ? "game-world.html" : "game-create-player.html";
    });
  </script>
</body>
</html>
