<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT 冰雪協作城｜獨立動畫預覽</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#132844;color:white;font-family:system-ui}canvas{display:block;width:100%;height:100%}.hud{position:absolute;top:12px;left:12px;background:#09233dbb;border:1px solid #8cc8ff88;border-radius:12px;padding:12px;font-size:13px}.hud b{font-size:18px}.bar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px}button{border:1px solid #c9e8ff;background:#12395ddd;color:white;padding:10px 15px;border-radius:12px;font-size:15px}</style></head><body><canvas id="c"></canvas><div class="hud"><b>❄ AIVAULT 冰雪協作城</b><div>獨立動畫原型｜80 位動畫人物</div><div>僅視覺演示，非 AI 在線證據</div></div><div class="bar"><button id="pause">⏸ 暫停</button><button id="snow">❄ 雪花</button></div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d');let w,h,t=0,run=true,snow=true;function resize(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);w=innerWidth;h=innerHeight}addEventListener('resize',resize);resize();const rand=(n)=>{let z=Math.sin(n*78.233+12.7)*43758.5453;return z-Math.floor(z)};const people=Array.from({length:80},(_,i)=>({x:rand(i+4)*1100,y:rand(i+900)*550,s:0.65+rand(i+18)*0.5,v:0.2+rand(i+71)*0.5,p:rand(i+31)*6.28,col:['#bd6b42','#4b7d9c','#667aab','#a15c83','#c6a363'][i%5]}));const flakes=Array.from({length:130},(_,i)=>({x:rand(i+300)*1600,y:rand(i+400)*900,s:1+rand(i+500)*3}));function house(px,py,scale,i){x.save();x.translate(px,py);x.scale(scale,scale);x.fillStyle='#c9d5df';x.fillRect(-35,-25,70,62);x.fillStyle='#536c88';x.beginPath();x.moveTo(-47,-24);x.lineTo(0,-63);x.lineTo(47,-24);x.closePath();x.fill();x.strokeStyle='#f4fbff';x.lineWidth=8;x.beginPath();x.moveTo(-47,-26);x.lineTo(0,-65);x.lineTo(47,-26);x.stroke();x.fillStyle='#ffd38a';x.fillRect(-19,-8,15,18);x.fillRect(9,-8,15,18);x.fillStyle='#755f55';x.fillRect(-4,12,12,25);x.restore()}function person(p,i){let px=p.x+Math.sin(t*p.v*.018+p.p)*32,py=p.y+Math.cos(t*p.v*.012+p.p)*17;let sc=p.s*(.65+py/1200);x.save();x.translate(px,py);x.scale(sc,sc);x.fillStyle='#21344955';x.beginPath();x.ellipse(0,10,13,5,0,0,7);x.fill();let step=Math.sin(t*.12*p.v+p.p)*5;x.strokeStyle='#30394c';x.lineWidth=5;x.beginPath();x.moveTo(-5,1);x.lineTo(-6+step,11);x.moveTo(5,1);x.lineTo(6-step,11);x.stroke();x.fillStyle=p.col;x.beginPath();x.roundRect(-12,-24,24,27,8);x.fill();x.fillStyle='#ffe1bd';x.beginPath();x.arc(0,-30,12,0,7);x.fill();x.fillStyle=['#d7e7f4','#9ec7e7','#aeb4dc','#f2d7af'][i%4];x.beginPath();x.arc(0,-34,13,Math.PI,Math.PI*2);x.lineTo(13,-30);x.lineTo(-13,-30);x.fill();x.fillStyle='#202d3a';x.fillRect(-5,-31,2,2);x.fillRect(4,-31,2,2);x.restore()}function frame(){if(run)t++;const sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#173b68');sky.addColorStop(1,'#b3d7ef');x.fillStyle=sky;x.fillRect(0,0,w,h);x.save();let scale=Math.min(w/1200,h/730)*1.12,ox=(w-1200*scale)/2,oy=(h-730*scale)/2;x.translate(ox,oy);x.scale(scale,scale);x.fillStyle='#e5f3fb';x.beginPath();x.ellipse(600,440,800,440,0,0,7);x.fill();x.fillStyle='#c6e4f6';for(let i=0;i<7;i++){x.beginPath();x.ellipse(100+i*175,400+i%2*50,90,22,-.2,0,7);x.fill()}for(let i=0;i<28;i++){let px=65+(i%7)*175,py=100+Math.floor(i/7)*145;house(px,py,.7+(i%3)*.12,i)}people.sort((a,b)=>a.y-b.y).forEach(person);x.restore();if(snow){x.fillStyle='#ffffffbb';for(const f of flakes){let sx=(f.x+t*f.s*.24)%(w+20),sy=(f.y+t*f.s*.5)%(h+20);x.beginPath();x.arc(sx,sy,f.s*.7,0,7);x.fill()}}requestAnimationFrame(frame)}frame();document.getElementById('pause').onclick=e=>{run=!run;e.target.textContent=run?'⏸ 暫停':'▶ 播放'};document.getElementById('snow').onclick=e=>{snow=!snow;e.target.textContent=snow?'❄ 雪花':'❄ 雪花關'}})();</script></body></html>
