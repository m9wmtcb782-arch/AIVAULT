<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>AIVAULT 冰雪協作城 3D V2</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#152d4d;color:#fff;font-family:system-ui}#hud{position:fixed;top:12px;left:12px;background:#102d50d9;border:1px solid #8ccafa;border-radius:12px;padding:11px;max-width:270px;font-size:12px;pointer-events:none}#hud b{font-size:17px}#ctrl{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px}button{font-size:14px;border:1px solid #a3d5fa;border-radius:12px;padding:10px 14px;background:#153b60e8;color:white}#err{position:fixed;inset:25%;display:none;background:#183b5b;padding:18px;border-radius:12px}</style></head><body><div id="hud"><b>❄ AIVAULT 冰雪協作城</b><div>真正 WebGL 3D 場景 · 獨立預覽 V2</div><div>人物與建築皆為立體模型，可拖曳旋轉視角</div><div>動畫展示 ≠ AI 真實在線</div></div><div id="ctrl"><button id="play">⏸ 暫停</button><button id="zoom">＋ 放大</button><button id="reset">⟳ 視角</button></div><div id="err">3D 載入失敗。請使用 Safari 開啟，並確認網路可以載入 Three.js。</div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
let renderer;try{renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});}catch(e){document.getElementById('err').style.display='block';throw e}
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x8cb5d8);scene.fog=new T.FogExp2(0xa2c3d8,.018);
const camera=new T.PerspectiveCamera(44,innerWidth/innerHeight,.1,250);let angle=.72,dist=70;const target=new T.Vector3(0,0,0);
function cam(){camera.position.set(Math.sin(angle)*dist,dist*.72,Math.cos(angle)*dist);camera.lookAt(target)}cam();
scene.add(new T.HemisphereLight(0xeaf6ff,0x5d6b80,2.1));const sun=new T.DirectionalLight(0xffe3bd,2.3);sun.position.set(-25,48,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-60;sun.shadow.camera.right=60;sun.shadow.camera.top=60;sun.shadow.camera.bottom=-60;scene.add(sun);
const mat=(c,r=1)=>new T.MeshStandardMaterial({color:c,roughness:r});const snow=mat(0xf0f7ff),wall=mat(0x91a9b9),roof=mat(0x3a5a79),stone=mat(0x647d95),gold=new T.MeshStandardMaterial({color:0xffc975,emissive:0x5c2800,emissiveIntensity:.55}),wood=mat(0x725d59),blue=new T.MeshStandardMaterial({color:0x50d8ff,emissive:0x0079c5,emissiveIntensity:1});
function mesh(g,m,x=0,y=0,z=0,cast=true){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=true;scene.add(o);return o}
function box(x,y,z,w,h,d,m){return mesh(new T.BoxGeometry(w,h,d),m,x,y,z)}
function cone(x,y,z,r,h,m,n=5){return mesh(new T.ConeGeometry(r,h,n),m,x,y,z)}
function ball(x,y,z,r,m){return mesh(new T.SphereGeometry(r,10,8),m,x,y,z)}
box(0,-.65,0,115,1,115,snow);
for(let i=-4;i<=4;i++){box(i*10,-.1,0,4,.12,112,mat(0xc6dce9));box(0,-.08,i*10,112,.12,4,mat(0xc6dce9))}
function house(x,z,i){let s=.85+(i%3)*.17;box(x,1.6*s,z,5*s,3.2*s,5*s,wall);cone(x,4.45*s,z,4.1*s,3.2*s,roof,4).rotation.y=Math.PI/4;box(x,3.05*s,z,5.5*s,.27*s,5.5*s,snow);box(x,1.3*s,z+2.55*s,1.1*s,1.6*s,.15,gold);box(x-1.6*s,2.1*s,z+2.55*s,.8*s,.85*s,.15,gold);box(x+1.6*s,2.1*s,z+2.55*s,.8*s,.85*s,.15,gold);box(x,0,z+2.9*s,2,.2,1.6,stone)}
for(let ix=-4;ix<=4;ix++)for(let iz=-4;iz<=4;iz++){if(Math.abs(ix)<=1&&Math.abs(iz)<=1)continue;if((ix+iz)%3===0)house(ix*10,iz*10,Math.abs(ix*7+iz))}
function tower(x,z,sc=1){box(x,5*sc,z,8*sc,10*sc,8*sc,wall);for(let k=0;k<4;k++)box(x+(k%2?3.3:-3.3)*sc,9*sc,z+(k<2?3.3:-3.3)*sc,2*sc,6*sc,2*sc,stone);cone(x,12.8*sc,z,6.3*sc,6.5*sc,roof,4).rotation.y=Math.PI/4;box(x,6*sc,z+4.1*sc,2*sc,3*sc,.2,gold)}
tower(0,-7,1.1);tower(-29,-22,.65);tower(30,-20,.7);
function tree(x,z,sc){box(x,1*sc,z,.6*sc,2*sc,.6*sc,wood);for(let k=0;k<3;k++)cone(x,(2+k*.9)*sc,z,(2.3-k*.55)*sc,2.4*sc,mat(0x3d766c),7);cone(x,4.1*sc,z,.7*sc,.45*sc,snow,7)}
for(let i=0;i<85;i++){let x=(Math.sin(i*12.23)*.5+.5)*102-51,z=(Math.cos(i*7.63)*.5+.5)*102-51;if(Math.abs(x)<6||Math.abs(z)<6)continue;tree(x,z,.65+(i%4)*.14)}
function lamp(x,z){mesh(new T.CylinderGeometry(.12,.17,3,7),stone,x,1.5,z);ball(x,3.25,z,.5,gold)}
for(let i=-4;i<=4;i++){lamp(i*10,3.3);lamp(i*10,-3.3)}
const colors=[0x8a4f39,0x426b9a,0x8b587d,0x496f68,0xb17d39,0x7771a8],skin=mat(0xffd4b5),hair=mat(0x513d36),eyes=mat(0x1e2a3b);let people=[];
function character(i){const root=new T.Group();scene.add(root);const coat=mat(colors[i%colors.length]),hat=mat([0xeff5fa,0xb2c9e6,0xd4af91][i%3]);const body=new T.Mesh(new T.CylinderGeometry(.45,.52,1.1,8),coat);body.position.y=1.13;root.add(body);const head=new T.Mesh(new T.SphereGeometry(.48,12,10),skin);head.position.y=2.03;root.add(head);const cap=new T.Mesh(new T.SphereGeometry(.5,12,8,0,Math.PI*2,0,Math.PI*.55),hat);cap.position.y=2.18;root.add(cap);for(let k of [-1,1]){let e=new T.Mesh(new T.SphereGeometry(.045,6,6),eyes);e.position.set(k*.16,2.06,.44);root.add(e)}const legs=[];for(let k of [-1,1]){let leg=new T.Mesh(new T.CylinderGeometry(.16,.18,.67,7),mat(0x303b4e));leg.position.set(k*.23,.36,0);root.add(leg);legs.push(leg);let arm=new T.Mesh(new T.CylinderGeometry(.13,.14,.8,7),coat);arm.position.set(k*.6,1.16,0);arm.rotation.z=k*.18;root.add(arm)}let x=(Math.sin(i*17.7)*.5+.5)*80-40,z=(Math.cos(i*23.3)*.5+.5)*78-39;root.position.set(x,0,z);root.scale.setScalar(.85+(i%4)*.08);people.push({root,legs,phase:i*.7,baseX:x,baseZ:z})}
for(let i=0;i<90;i++)character(i);
const snowGeo=new T.BufferGeometry(),pts=[];for(let i=0;i<300;i++)pts.push((Math.random()-.5)*115,Math.random()*35,(Math.random()-.5)*115);snowGeo.setAttribute('position',new T.Float32BufferAttribute(pts,3));const flakes=new T.Points(snowGeo,new T.PointsMaterial({color:0xffffff,size:.22,transparent:true,opacity:.8}));scene.add(flakes);
let playing=true,time=0,drag=false,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(!drag)return;angle-=(e.clientX-lastX)*.008;dist=Math.max(25,Math.min(100,dist+(e.clientY-lastY)*.1));lastX=e.clientX;lastY=e.clientY;cam()});renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(25,Math.min(100,dist+e.deltaY*.03));cam()},{passive:true});document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'⏸ 暫停':'▶ 播放'};document.getElementById('zoom').onclick=()=>{dist=Math.max(25,dist-10);cam()};document.getElementById('reset').onclick=()=>{angle=.72;dist=70;cam()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function loop(){requestAnimationFrame(loop);if(playing){time+=.016;people.forEach((p,i)=>{let a=time*(.17+i%4*.04)+p.phase;p.root.position.x=p.baseX+Math.sin(a)*2.4;p.root.position.z=p.baseZ+Math.cos(a)*2.1;p.root.rotation.y=-a;p.legs[0].rotation.x=Math.sin(time*4+p.phase)*.35;p.legs[1].rotation.x=-p.legs[0].rotation.x});const a=flakes.geometry.attributes.position;for(let i=0;i<a.count;i++){let y=a.getY(i)-.03;if(y<0)y=34;a.setY(i,y)}a.needsUpdate=true}renderer.render(scene,camera)}loop();
</script></body></html>
