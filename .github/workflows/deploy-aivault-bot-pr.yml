name: Deploy bots migration + ingest (bot-pr feature)
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply additive migration
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          def q(sql):
              r = urllib.request.Request("https://api.supabase.com/v1/projects/clcddygkaaqqtsbswgdf/database/query",
                  data=json.dumps({"query": sql}).encode(), headers={"Authorization": "Bearer " + os.environ["TOKEN"], "Content-Type": "application/json", "User-Agent": "aivault-migrate"})
              return json.load(urllib.request.urlopen(r))
          q(open("supabase/migrations/20261016020000_dark_star_bots.sql").read())
          for t in ("dark_star_bots", "dark_star_bot_proposals"):
              print(t, q("select relrowsecurity from pg_class where relname='%s'" % t), q("select policyname,cmd from pg_policies where tablename='%s'" % t))
              print("GRANT", q("select grantee,privilege_type from information_schema.role_table_grants where table_name='%s' order by 1,2" % t))
          print("USERS", q("select count(*)::int n from auth.users"))
          print("SECRETS_NOTE: see next step")
          PY
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy function (JWT verification on)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy dark-star-ebook-ingest --project-ref clcddygkaaqqtsbswgdf --use-api
          supabase secrets list --project-ref clcddygkaaqqtsbswgdf | grep -E 'AIVAULT_OWNER_USER_ID|AIVAULT_PR_GITHUB_TOKEN|ANXING_GITHUB_TOKEN' | awk '{print $1}' || true
