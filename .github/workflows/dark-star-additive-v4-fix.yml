name: Dark Star Additive V4 Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize escaped newlines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('technical-dark-star.html')
          s = p.read_text(encoding='utf-8')
          marker = 'AIVAULT_DARK_STAR_ADDITIVE_VOICE_UI_V2'
          if marker not in s:
              raise SystemExit('marker missing')
          a = s.index('/* AIVAULT_DARK_STAR_ADDITIVE_VOICE_UI_V2 */')
          b = s.index('</style>', a)
          s = s[:a] + re.sub(r'\\+n', '\n', s[a:b]) + s[b:]
          a = s.index('<!-- AIVAULT_DARK_STAR_ADDITIVE_VOICE_UI_V2 -->')
          b = s.index('</body>', a)
          s = s[:a] + re.sub(r'\\+n', '\n', s[a:b]) + s[b:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit normalization
        run: |
          git config user.name "aivault-additive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add technical-dark-star.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix: normalize Dark Star additive markup"
          git push