name: Fix Dark Star menu click

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-dark-star-menu-click.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force top-left menu button click behavior
        shell: python
        run: |
          from pathlib import Path
          p=Path('technical-dark-star.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- AIVAULT_DARK_STAR_MENU_CLICK_FIX -->'
          if marker not in s:
            inject='''\n<!-- AIVAULT_DARK_STAR_MENU_CLICK_FIX -->\n<script>\n(()=>{\n  const bind=()=>{\n    const b=document.getElementById('menuButton');\n    const d=document.getElementById('drawer');\n    const x=document.getElementById('drawerBackdrop');\n    if(!b||!d||!x)return false;\n    b.style.position='relative';\n    b.style.zIndex='30000';\n    b.style.pointerEvents='auto';\n    b.addEventListener('click',e=>{\n      e.preventDefault();\n      e.stopImmediatePropagation();\n      d.classList.add('show');\n      x.classList.add('show');\n      if(typeof renderHistory==='function')renderHistory();\n    },true);\n    return true;\n  };\n  if(!bind()){document.addEventListener('DOMContentLoaded',bind,{once:true});}\n})();\n</script>\n'''
            s=s.replace('</body>',inject+'</body>',1)
            p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/fix-dark-star-menu-click.yml
          git config user.name 'AIVAULT Fix Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add technical-dark-star.html .github/workflows/fix-dark-star-menu-click.yml
          git commit -m 'Fix Technical Dark Star top-left menu button click'
          git push
