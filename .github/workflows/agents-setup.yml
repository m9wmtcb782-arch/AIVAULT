name: AI pool agents setup (manual)
on:
  workflow_dispatch:
    inputs:
      step: { description: "migrate,publish,seed,test | all", required: true, default: "all" }
      order: { description: "test order (optional)", required: false, default: "" }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PAGES_KEY: ${{ secrets.AIVAULT_PRIVATE_PAGES_KEY }}
          STEP: ${{ inputs.step }}
          ORDER: ${{ inputs.order }}
        run: python3 .github/scripts/agents_setup.py
