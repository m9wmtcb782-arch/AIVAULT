name: City Playwright screenshots (iPhone viewport, public pages, free runner)
on:
  workflow_dispatch:
    inputs:
      pages: { description: "space-separated pages", required: false, default: "aivault-city.html aivault-frozen-city.html?bench=1 aivault-lab.html" }
permissions: { contents: read }
concurrency: { group: city-screens, cancel-in-progress: false }
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-audit --no-fund playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - env: { PAGES: "${{ inputs.pages }}" }
        run: node .github/scripts/city_screens.mjs
      - uses: actions/upload-artifact@v4
        with: { name: city-screens, path: shots/, retention-days: 7 }
