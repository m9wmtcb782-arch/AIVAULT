name: iOS GPU Fabric Source Build

on:
  push:
    branches:
      - research/unified-gpu-fabric-v0.1
    paths:
      - "tests/gpu-fabric-native-matrix-stage.swift"
      - "tests/gpu-fabric-native-matrix-stage-v0.1.mjs"
      - "tests/gpu-fabric-metal-matrix.swift"
      - "tests/gpu-fabric-metal-matrix-v0.1.mjs"
      - "aivault-collab-v0.2/gpu-fabric-matrix-v0.1.mjs"
      - "native-worker/ios/AIVAULTNativeWorker.xcodeproj/project.pbxproj"
      - "native-worker/ios/AIVAULTNativeWorker/*.swift"
      - "native-worker/ios/AIVAULTNativeWorkerApp/*.swift"
      - "native-worker/ios/AIVAULTNativeWorkerApp/LaunchScreen.storyboard"
      - "compute-mesh-gpu-test.html"
      - "tests/gpu-fabric-native-https-contract.swift"
      - "tests/gpu-fabric-metal-wire-cli.swift"
      - "tests/gpu-fabric-metal-tls-handoff-v0.1.mjs"
      - "aivault-collab-v0.2/gpu-fabric-planned-stage-v0.1.mjs"
      - "tests/gpu-fabric-native-real-tls.swift"
      - "tests/gpu-fabric-native-real-tls-v0.1.mjs"
      - "tests/gpu-fabric-native-receiver.swift"
      - "tests/gpu-fabric-native-receiver-v0.1.mjs"
      - ".github/workflows/ios-gpu-fabric-build.yml"
      - "tests/gpu-fabric-metal-dense-cli.swift"
      - "tests/gpu-fabric-metal-dense-tls-v0.1.mjs"
      - "tests/fixtures/gpu-fabric-tiny-model-v0.1.mjs"
      - "aivault-collab-v0.2/gpu-fabric-dense-v0.1.mjs"
      - "aivault-collab-v0.2/gpu-fabric-backend-v0.1.mjs"
      - "tests/gpu-fabric-foreground-session.swift"
      - "tests/gpu-fabric-native-dense-stage.swift"
      - "tests/gpu-fabric-signed-config.swift"
      - "tests/gpu-fabric-signed-config-v0.1.mjs"
      - "aivault-collab-v0.2/gpu-fabric-signed-config-v0.1.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate inline JavaScript in the worker page
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('compute-mesh-gpu-test.html', 'utf8');
          const scripts = [];
          let cursor = 0;
          while (true) {
            const start = html.indexOf('<script', cursor);
            if (start < 0) break;
            const tagEnd = html.indexOf('>', start);
            if (tagEnd < 0) throw new Error('Malformed script opening tag');
            const close = html.indexOf('</script>', tagEnd + 1);
            if (close < 0) throw new Error('Missing closing script tag');
            scripts.push(html.slice(tagEnd + 1, close));
            cursor = close + '</script>'.length;
          }
          if (!scripts.length) throw new Error('No script blocks found');
          scripts.forEach((source, index) => {
            new vm.Script(source, { filename: `compute-mesh-gpu-test.html:script-${index + 1}` });
          });
          const required = [
            'function runNativeMetalSmokeTest()',
            'gpuFabric.execute',
            'nativeMetalBtn',
            '$("nativeMetalBtn")',
            'runNativeMetalSmokeTest'
          ];
          for (const token of required) {
            if (!html.includes(token)) throw new Error(`Missing native Metal UI integration token: ${token}`);
          }

          const appSwift = fs.readFileSync('native-worker/ios/AIVAULTNativeWorkerApp/AIVAULTNativeWorkerApp.swift', 'utf8');
          const bridgeSwift = fs.readFileSync('native-worker/ios/AIVAULTNativeWorker/AIVAULTWebBridge.swift', 'utf8');
          const nativeChecks = [
            [appSwift.includes('bridge.install(on: configuration)'), 'App installs the WebKit bridge'],
            [appSwift.includes('https://m9wmtcb782-arch.github.io/AIVAULT/compute-mesh-gpu-test.html'), 'App loads the allowlisted worker page'],
            [bridgeSwift.includes('securityOrigin.host == Self.trustedHost'), 'Bridge validates trusted host'],
            [bridgeSwift.includes('message.frameInfo.request.url?.path == "/AIVAULT/compute-mesh-gpu-test.html"'), 'Bridge validates exact page path'],
            [bridgeSwift.includes('operation == "mul_scalar" || operation == "add_scalar"'), 'Bridge limits supported Metal operations']
          ];
          for (const [passed, label] of nativeChecks) {
            if (!passed) throw new Error(`Native bridge integration check failed: ${label}`);
          }
          console.log(`PASS: parsed ${scripts.length} JavaScript block(s); UI and native bridge integration checks passed`);
          NODE
      - name: Type-check Swift sources against iOS Simulator SDK
        run: |
          SDK_PATH="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun swiftc \
            -typecheck \
            -parse-as-library \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios17.0-simulator \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTNativeHardware.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTWebBridge.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTMetalCompute.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTFloat32TensorV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTTensorHTTPSV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTTensorReceiveV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTTensorTLSListenerV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTForegroundSessionV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTForegroundTLSV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTPlannedDenseStageV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTSignedStagePackageV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTPlannedMatrixStageV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTSignedMatrixStagePackageV01.swift \
            native-worker/ios/AIVAULTNativeWorkerApp/AIVAULTNativeWorkerApp.swift

      - name: Build iOS Simulator app without code signing
        run: |
          xcodebuild \
            -project native-worker/ios/AIVAULTNativeWorker.xcodeproj \
            -scheme AIVAULTNativeWorkerApp \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath /tmp/aivault-derived-data \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Execute real Metal kernels on the macOS runner
        run: |
          xcrun swiftc \
            -parse-as-library \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTMetalCompute.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTFloat32TensorV01.swift \
            tests/gpu-fabric-metal-smoke.swift \
            -o /tmp/aivault-gpu-fabric-metal-smoke
          /tmp/aivault-gpu-fabric-metal-smoke

      - name: Test native HTTPS envelope and receipt contract (mock transport)
        run: |
          xcrun swiftc -parse-as-library \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTFloat32TensorV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTTensorHTTPSV01.swift \
            tests/gpu-fabric-native-https-contract.swift \
            -o /tmp/aivault-native-https-contract
          /tmp/aivault-native-https-contract

      - name: Test native Metal tensor handoff over loopback TLS (one GPU)
        run: |
          xcrun swiftc -parse-as-library \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTMetalCompute.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTFloat32TensorV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTTensorHTTPSV01.swift \
            tests/gpu-fabric-metal-wire-cli.swift \
            -o /tmp/aivault-metal-wire-cli
          node tests/gpu-fabric-metal-tls-handoff-v0.1.mjs /tmp/aivault-metal-wire-cli

      - name: Test native URLSession real TLS and Metal handoff (one GPU)
        run: |
          xcrun swiftc -parse-as-library \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTMetalCompute.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTFloat32TensorV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTTensorHTTPSV01.swift \
            tests/gpu-fabric-native-real-tls.swift \
            -o /tmp/aivault-native-real-tls
          node tests/gpu-fabric-native-real-tls-v0.1.mjs /tmp/aivault-native-real-tls /tmp/aivault-metal-wire-cli


      - name: Test native TLS receiver and durable replay with local Metal (one GPU)
        timeout-minutes: 3
        run: |
          xcrun swiftc -parse-as-library \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTMetalCompute.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTFloat32TensorV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTTensorHTTPSV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTTensorReceiveV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTTensorTLSListenerV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTForegroundSessionV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTForegroundTLSV01.swift \
            tests/gpu-fabric-native-receiver.swift \
            -o /tmp/aivault-native-receiver
          node tests/gpu-fabric-native-receiver-v0.1.mjs /tmp/aivault-native-receiver

      - name: Test dense two-layer model over loopback TLS (one local Metal device)
        timeout-minutes: 3
        run: |
          xcrun swiftc -parse-as-library \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTMetalCompute.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTFloat32TensorV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTTensorHTTPSV01.swift \
            tests/gpu-fabric-metal-dense-cli.swift \
            -o /tmp/aivault-metal-dense-cli
          node tests/gpu-fabric-metal-dense-tls-v0.1.mjs /tmp/aivault-metal-dense-cli

      - name: Test opt-in foreground session lifecycle (controlled transport)
        run: |
          xcrun swiftc -parse-as-library \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTForegroundSessionV01.swift \
            tests/gpu-fabric-foreground-session.swift \
            -o /tmp/aivault-foreground-session
          /tmp/aivault-foreground-session

      - name: Test native planned two-layer model with two TLS listeners (one Metal device)
        timeout-minutes: 3
        run: |
          xcrun swiftc -parse-as-library \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTMetalCompute.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTFloat32TensorV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTTensorHTTPSV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTTensorReceiveV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTTensorTLSListenerV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTForegroundSessionV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTForegroundTLSV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTPlannedDenseStageV01.swift \
            tests/gpu-fabric-native-dense-stage.swift \
            -o /tmp/aivault-native-dense-stage
          node tests/gpu-fabric-native-receiver-v0.1.mjs /tmp/aivault-native-dense-stage

      - name: Test signed native stage configuration and durable import replay
        run: |
          xcrun swiftc -parse-as-library \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTMetalCompute.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTFloat32TensorV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTTensorHTTPSV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTTensorReceiveV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTTensorTLSListenerV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTPlannedDenseStageV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTSignedStagePackageV01.swift \
            tests/gpu-fabric-signed-config.swift \
            -o /tmp/aivault-signed-config
          node tests/gpu-fabric-signed-config-v0.1.mjs /tmp/aivault-signed-config

      - name: Test native Metal matrix operators and tiny attention chain (one device)
        timeout-minutes: 3
        run: |
          xcrun swiftc -parse-as-library \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTMetalCompute.swift \
            tests/gpu-fabric-metal-matrix.swift \
            -o /tmp/aivault-metal-matrix
          node tests/gpu-fabric-metal-matrix-v0.1.mjs /tmp/aivault-metal-matrix

      - name: Test signed native two-stage attention graph over TLS (one device)
        timeout-minutes: 3
        run: |
          xcrun swiftc -parse-as-library \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTMetalCompute.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTFloat32TensorV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTTensorHTTPSV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTTensorReceiveV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTTensorTLSListenerV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTForegroundSessionV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTForegroundTLSV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTPlannedMatrixStageV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTSignedMatrixStagePackageV01.swift \
            tests/gpu-fabric-native-matrix-stage.swift \
            -o /tmp/aivault-native-matrix-stage
          node tests/gpu-fabric-native-matrix-stage-v0.1.mjs /tmp/aivault-native-matrix-stage

      - name: Package validated research Simulator app (not iPhone-installable)
        run: |
          mkdir -p /tmp/aivault-research-delivery
          ditto -c -k --sequesterRsrc --keepParent \
            /tmp/aivault-derived-data/Build/Products/Debug-iphonesimulator/AIVAULTNativeWorkerApp.app \
            /tmp/aivault-research-delivery/AIVAULTNativeWorker-Simulator.zip
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          root = Path('/tmp/aivault-research-delivery')
          archive = root / 'AIVAULTNativeWorker-Simulator.zip'
          manifest = {'source_commit': os.environ['GITHUB_SHA'], 'target': 'iOS Simulator',
                      'iphone_installable': False, 'production_deployed': False,
                      'physical_multi_device_verified': False,
                      'archive_sha256': hashlib.sha256(archive.read_bytes()).hexdigest()}
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          (root / 'README.txt').write_text('Research Simulator build only. This is not an IPA or a deployed GPU pool. Physical iPhone use requires Apple distribution signing and trusted native provisioning. No private keys, grants or model weights are included.\n')
          PYCODE
      - name: Upload research delivery bundle
        uses: actions/upload-artifact@v4
        with:
          name: aivault-research-simulator-${{ github.sha }}
          path: /tmp/aivault-research-delivery/
          if-no-files-found: error
          retention-days: 7
