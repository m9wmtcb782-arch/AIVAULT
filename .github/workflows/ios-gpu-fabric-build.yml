name: iOS GPU Fabric Source Build

on:
  push:
    branches:
      - research/unified-gpu-fabric-v0.1
    paths:
      - "native-worker/ios/AIVAULTNativeWorker.xcodeproj/project.pbxproj"
      - "native-worker/ios/AIVAULTNativeWorker/*.swift"
      - "native-worker/ios/AIVAULTNativeWorkerApp/*.swift"
      - "native-worker/ios/AIVAULTNativeWorkerApp/LaunchScreen.storyboard"
      - "compute-mesh-gpu-test.html"
      - "tests/gpu-fabric-native-https-contract.swift"
      - "tests/gpu-fabric-metal-wire-cli.swift"
      - "tests/gpu-fabric-metal-tls-handoff-v0.1.mjs"
      - ".github/workflows/ios-gpu-fabric-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate inline JavaScript in the worker page
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('compute-mesh-gpu-test.html', 'utf8');
          const scripts = [];
          let cursor = 0;
          while (true) {
            const start = html.indexOf('<script', cursor);
            if (start < 0) break;
            const tagEnd = html.indexOf('>', start);
            if (tagEnd < 0) throw new Error('Malformed script opening tag');
            const close = html.indexOf('</script>', tagEnd + 1);
            if (close < 0) throw new Error('Missing closing script tag');
            scripts.push(html.slice(tagEnd + 1, close));
            cursor = close + '</script>'.length;
          }
          if (!scripts.length) throw new Error('No script blocks found');
          scripts.forEach((source, index) => {
            new vm.Script(source, { filename: `compute-mesh-gpu-test.html:script-${index + 1}` });
          });
          const required = [
            'function runNativeMetalSmokeTest()',
            'gpuFabric.execute',
            'nativeMetalBtn',
            '$("nativeMetalBtn")',
            'runNativeMetalSmokeTest'
          ];
          for (const token of required) {
            if (!html.includes(token)) throw new Error(`Missing native Metal UI integration token: ${token}`);
          }

          const appSwift = fs.readFileSync('native-worker/ios/AIVAULTNativeWorkerApp/AIVAULTNativeWorkerApp.swift', 'utf8');
          const bridgeSwift = fs.readFileSync('native-worker/ios/AIVAULTNativeWorker/AIVAULTWebBridge.swift', 'utf8');
          const nativeChecks = [
            [appSwift.includes('bridge.install(on: configuration)'), 'App installs the WebKit bridge'],
            [appSwift.includes('https://m9wmtcb782-arch.github.io/AIVAULT/compute-mesh-gpu-test.html'), 'App loads the allowlisted worker page'],
            [bridgeSwift.includes('securityOrigin.host == Self.trustedHost'), 'Bridge validates trusted host'],
            [bridgeSwift.includes('message.frameInfo.request.url?.path == "/AIVAULT/compute-mesh-gpu-test.html"'), 'Bridge validates exact page path'],
            [bridgeSwift.includes('operation == "mul_scalar" || operation == "add_scalar"'), 'Bridge limits supported Metal operations']
          ];
          for (const [passed, label] of nativeChecks) {
            if (!passed) throw new Error(`Native bridge integration check failed: ${label}`);
          }
          console.log(`PASS: parsed ${scripts.length} JavaScript block(s); UI and native bridge integration checks passed`);
          NODE
      - name: Type-check Swift sources against iOS Simulator SDK
        run: |
          SDK_PATH="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun swiftc \
            -typecheck \
            -parse-as-library \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios17.0-simulator \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTNativeHardware.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTWebBridge.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTMetalCompute.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTFloat32TensorV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTTensorHTTPSV01.swift \
            native-worker/ios/AIVAULTNativeWorkerApp/AIVAULTNativeWorkerApp.swift

      - name: Build iOS Simulator app without code signing
        run: |
          xcodebuild \
            -project native-worker/ios/AIVAULTNativeWorker.xcodeproj \
            -scheme AIVAULTNativeWorkerApp \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath /tmp/aivault-derived-data \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Execute real Metal kernels on the macOS runner
        run: |
          xcrun swiftc \
            -parse-as-library \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTMetalCompute.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTFloat32TensorV01.swift \
            tests/gpu-fabric-metal-smoke.swift \
            -o /tmp/aivault-gpu-fabric-metal-smoke
          /tmp/aivault-gpu-fabric-metal-smoke

      - name: Test native HTTPS envelope and receipt contract (mock transport)
        run: |
          xcrun swiftc -parse-as-library \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTFloat32TensorV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTTensorHTTPSV01.swift \
            tests/gpu-fabric-native-https-contract.swift \
            -o /tmp/aivault-native-https-contract
          /tmp/aivault-native-https-contract

      - name: Test native Metal tensor handoff over loopback TLS (one GPU)
        run: |
          xcrun swiftc -parse-as-library \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTMetalCompute.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTFloat32TensorV01.swift \
            native-worker/ios/AIVAULTNativeWorker/AIVAULTTensorHTTPSV01.swift \
            tests/gpu-fabric-metal-wire-cli.swift \
            -o /tmp/aivault-metal-wire-cli
          node tests/gpu-fabric-metal-tls-handoff-v0.1.mjs /tmp/aivault-metal-wire-cli

