name: iOS GPU Fabric Source Build

on:
  push:
    branches:
      - research/unified-gpu-fabric-v0.1
    paths:
      - "native-worker/ios/AIVAULTNativeWorker.xcodeproj/project.pbxproj"
      - "native-worker/ios/AIVAULTNativeWorker/*.swift"
      - "native-worker/ios/AIVAULTNativeWorkerApp/*.swift"
      - ".github/workflows/ios-gpu-fabric-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/unified-gpu-fabric-v0.1
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build iOS Simulator target without code signing
        run: |
          xcodebuild \
            -project native-worker/ios/AIVAULTNativeWorker.xcodeproj \
            -target AIVAULTNativeWorkerApp \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
