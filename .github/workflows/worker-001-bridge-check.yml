name: Worker-001 bridge checks
on:
  push:
    paths:
      - 'workers/worker-001/model-bridge.py'
      - 'workers/worker-001/test_bridge_offline.py'
      - '.github/workflows/worker-001-bridge-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax validation
        run: python -m py_compile workers/worker-001/model-bridge.py workers/worker-001/test_bridge_offline.py
      - name: Local mock protocol and authorization checks (NOT real inference)
        run: python workers/worker-001/test_bridge_offline.py
