name: Dark Star Additive V5 Normalize

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize additive module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('technical-dark-star.html')
          s = p.read_text(encoding='utf-8')
          markers = [
              ('/* AIVAULT_DARK_STAR_ADDITIVE_VOICE_UI_V2 */', '</style>'),
              ('<!-- AIVAULT_DARK_STAR_ADDITIVE_VOICE_UI_V2 -->', '</body>'),
          ]
          changed = False
          for start, end in markers:
              if start not in s:
                  continue
              a = s.index(start)
              b = s.index(end, a)
              block = s[a:b]
              normalized = block.replace('\\\\n', '\n')
              if normalized != block:
                  s = s[:a] + normalized + s[b:]
                  changed = True
          if not changed:
              raise SystemExit(0)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "aivault-additive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add technical-dark-star.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix: normalize Dark Star additive voice markup"
          git push