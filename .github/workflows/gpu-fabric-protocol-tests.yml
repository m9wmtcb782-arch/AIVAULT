name: GPU Fabric Protocol v0.1 Tests

on:
  push:
    branches:
      - research/unified-gpu-fabric-v0.1
    paths:
      - "aivault-collab-v0.2/gpu-fabric-model-catalogue-v0.1.mjs"
      - "tests/gpu-fabric-model-catalogue-v0.1.test.mjs"
      - "aivault-collab-v0.2/gpu-fabric-protocol-v0.1.mjs"
      - "aivault-collab-v0.2/gpu-fabric-simulator-v0.1.mjs"
      - "aivault-collab-v0.2/gpu-fabric-planner-v0.1.mjs"
      - "aivault-collab-v0.2/gpu-fabric-backend-v0.1.mjs"
      - "aivault-collab-v0.2/gpu-fabric-local-runtime-v0.1.mjs"
      - "aivault-collab-v0.2/gpu-fabric-tensor-transfer-v0.1.mjs"
      - "aivault-collab-v0.2/gpu-fabric-tensor-wire-v0.1.mjs"
      - "aivault-collab-v0.2/gpu-fabric-transport-v0.1.mjs"
      - "aivault-collab-v0.2/gpu-fabric-https-channel-v0.1.mjs"
      - "aivault-collab-v0.2/gpu-fabric-https-receiver-v0.1.mjs"
      - "aivault-collab-v0.2/gpu-fabric-planned-stage-v0.1.mjs"
      - "tests/gpu-fabric-planned-stage-v0.1.test.mjs"
      - "aivault-collab-v0.2/gpu-fabric-replay-ledger-v0.1.mjs"
      - "aivault-collab-v0.2/gpu-fabric-job-state-v0.1.mjs"
      - "tests/gpu-fabric-protocol-v0.1.test.mjs"
      - "tests/gpu-fabric-simulator-v0.1.test.mjs"
      - "tests/gpu-fabric-planner-v0.1.test.mjs"
      - "tests/gpu-fabric-backend-v0.1.test.mjs"
      - "tests/gpu-fabric-local-runtime-v0.1.test.mjs"
      - "tests/gpu-fabric-tensor-transfer-v0.1.test.mjs"
      - "tests/gpu-fabric-tensor-wire-v0.1.test.mjs"
      - "tests/gpu-fabric-transport-v0.1.test.mjs"
      - "tests/gpu-fabric-https-channel-v0.1.test.mjs"
      - "tests/gpu-fabric-https-two-node-v0.1.test.mjs"
      - "tests/gpu-fabric-durable-two-process-v0.1.test.mjs"
      - "tests/fixtures/gpu-fabric-tls-cpu-worker-v0.1.mjs"
      - "tests/gpu-fabric-job-state-v0.1.test.mjs"
      - ".github/workflows/gpu-fabric-protocol-tests.yml"
      - "aivault-collab-v0.2/gpu-fabric-dense-v0.1.mjs"
      - "tests/gpu-fabric-dense-v0.1.test.mjs"
      - "tests/fixtures/gpu-fabric-tiny-model-v0.1.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check aivault-collab-v0.2/gpu-fabric-model-catalogue-v0.1.mjs
          node --check aivault-collab-v0.2/gpu-fabric-protocol-v0.1.mjs
          node --check aivault-collab-v0.2/gpu-fabric-simulator-v0.1.mjs
          node --check aivault-collab-v0.2/gpu-fabric-planner-v0.1.mjs
          node --check aivault-collab-v0.2/gpu-fabric-dense-v0.1.mjs
          node --check aivault-collab-v0.2/gpu-fabric-backend-v0.1.mjs
          node --check aivault-collab-v0.2/gpu-fabric-local-runtime-v0.1.mjs
          node --check aivault-collab-v0.2/gpu-fabric-tensor-transfer-v0.1.mjs
          node --check aivault-collab-v0.2/gpu-fabric-tensor-wire-v0.1.mjs
          node --check aivault-collab-v0.2/gpu-fabric-transport-v0.1.mjs
          node --check aivault-collab-v0.2/gpu-fabric-https-channel-v0.1.mjs
          node --check aivault-collab-v0.2/gpu-fabric-https-receiver-v0.1.mjs
          node --check aivault-collab-v0.2/gpu-fabric-planned-stage-v0.1.mjs
          node --check aivault-collab-v0.2/gpu-fabric-replay-ledger-v0.1.mjs
          node --check tests/fixtures/gpu-fabric-tls-cpu-worker-v0.1.mjs
          node --check aivault-collab-v0.2/gpu-fabric-job-state-v0.1.mjs
      - name: Run isolated protocol and simulator tests
        run: node --test tests/gpu-fabric-*.test.mjs

