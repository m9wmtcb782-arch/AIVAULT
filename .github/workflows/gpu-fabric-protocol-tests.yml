name: GPU Fabric Protocol v0.1 Tests

on:
  push:
    branches:
      - research/unified-gpu-fabric-v0.1
    paths:
      - "aivault-collab-v0.2/gpu-fabric-protocol-v0.1.mjs"
      - "tests/gpu-fabric-protocol-v0.1.test.mjs"
      - ".github/workflows/gpu-fabric-protocol-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/unified-gpu-fabric-v0.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check aivault-collab-v0.2/gpu-fabric-protocol-v0.1.mjs
      - name: Run isolated protocol tests
        run: node --test tests/gpu-fabric-protocol-v0.1.test.mjs
