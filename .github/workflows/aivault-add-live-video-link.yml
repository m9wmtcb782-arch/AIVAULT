name: AIVAULT add Dark Star live video link

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-link:
    if: github.event.head_commit.message != 'Add live video link to Dark Star favorites'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('technical-dark-star.html')
          s = p.read_text(encoding='utf-8')
          marker = '<div class="drawer-bottom">'
          link = '''\n\n    <a id="darkStarFavoriteVideo"\n      class="drawer-item"\n      href="technical-dark-star-live-video-test.html"\n      target="_blank"\n      rel="noopener noreferrer"\n      style="text-decoration:none;">\n      🎥 即時視訊\n    </a>'''
          if 'id="darkStarFavoriteVideo"' not in s:
              if marker not in s:
                  raise SystemExit('drawer-bottom not found')
              s = s.replace(marker, marker + link, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add technical-dark-star.html
          git rm .github/workflows/aivault-add-live-video-link.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add live video link to Dark Star favorites"
          git push