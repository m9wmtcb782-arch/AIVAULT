name: Deploy LINE webhook relay 2026-11-01 (additive)
on:
  push:
    branches: [deploy/line-relay-20261101]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: clcddygkaaqqtsbswgdf
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Additive guard + apply line_inbox migration
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          def q(sql):
              r = urllib.request.Request(f"https://api.supabase.com/v1/projects/{os.environ['REF']}/database/query",
                  data=json.dumps({"query": sql}).encode(), headers={"Authorization": "Bearer " + os.environ["SUPABASE_ACCESS_TOKEN"], "Content-Type": "application/json", "User-Agent": "aivault-line-relay"})
              try: return json.load(urllib.request.urlopen(r))
              except urllib.error.HTTPError as e: sys.exit("FAILED: " + e.read().decode()[:800])
          print("pre-exists:", q("select to_regclass('public.line_inbox') as t"))
          q("begin;\n" + open("supabase/line_inbox_20261101.sql").read() + "\ncommit;")
          print(q("select c.relname, c.relrowsecurity from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='line_inbox'"))
          PY
      - name: Guard - function and secret names must be new (do not overwrite existing)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" https://api.supabase.com/v1/projects/$REF/functions/line-webhook-relay)
          echo "existing line-webhook-relay http=$code"
          names=$(curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" https://api.supabase.com/v1/projects/$REF/secrets | python3 -c 'import sys,json;print(" ".join(x["name"] for x in json.load(sys.stdin)))')
          for n in LINE_CHANNEL_SECRET RELAY_POLL_SECRET; do case " $names " in *" $n "*) if [ "$code" != "200" ]; then echo "secret $n already exists and relay not deployed by us -> abort"; exit 1; fi;; esac; done
          echo guard ok
      - name: Set function secrets (values never echoed)
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.AIVAULT_LINE_CHANNEL_SECRET }}
          RELAY_POLL_SECRET: ${{ secrets.AIVAULT_RELAY_POLL_SECRET }}
        run: |
          printf 'LINE_CHANNEL_SECRET=%s\nRELAY_POLL_SECRET=%s\n' "$LINE_CHANNEL_SECRET" "$RELAY_POLL_SECRET" > /tmp/relay.env
          supabase secrets set --project-ref $REF --env-file /tmp/relay.env >/dev/null && echo "secrets set"; rm -f /tmp/relay.env
      - name: Deploy line-webhook-relay (no JWT)
        run: supabase functions deploy line-webhook-relay --project-ref $REF --no-verify-jwt --use-api
      - name: Smoke
        run: |
          echo -n "unsigned POST: "; curl -s -o /dev/null -w '%{http_code}\n' -X POST https://$REF.supabase.co/functions/v1/line-webhook-relay -d '{}'
          echo -n "pull no secret: "; curl -s -o /dev/null -w '%{http_code}\n' -X POST https://$REF.supabase.co/functions/v1/line-webhook-relay/pull
