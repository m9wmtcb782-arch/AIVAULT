name: Dark Star Voice Finalize
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: dark-star-voice-finalize
  cancel-in-progress: true
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Repair additive voice module
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('technical-dark-star.html')
          s=p.read_text(encoding='utf-8')
          marker='AIVAULT_DARK_STAR_ADDITIVE_VOICE_UI_V2'
          if marker not in s:
              raise SystemExit('voice additive module missing; refusing to modify core')
          s=re.sub(r'realtimeInput:\s*\{\s*mediaChunks\s*:\s*\[\s*\{\s*mimeType\s*:\s*["\']audio/pcm;rate=16000["\']\s*,\s*data\s*:\s*b64\([^)]*\)\s*\}\s*\]\s*\}', 'realtimeInput:{audio:{mimeType:"audio/pcm;rate=16000",data:b64(o)}}', s, flags=re.S)
          s=re.sub(r'voice\.session=sj\.session_id;', 'voice.session=sj.session?.id||sj.session_id||sj.session?.session_id;', s, count=1)
          s=re.sub(r'const url=tj\.websocket\|\|tj\.websocket\|\|tj\.websocket\|\|tj\.websocket\|\|tj\.websocket_url\|\|tj\.url\|\|\("wss://generativelanguage\.googleapis\.com/ws/google\.ai\.generativelanguage\.v1beta\.GenerativeService\.BidiGenerateContentConstrained\?access_token="\+encodeURIComponent\(tj\.token\)\);', 'const url=(tj.websocket||tj.websocket_url||tj.url||"wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained")+(tj.token?("?access_token="+encodeURIComponent(tj.token)):"");', s, count=1)
          s=re.sub(r'voice\.ws\.onopen=\(\)=>\{', 'voice.ws.onopen=async()=>{', s, count=1)
          s=s.replace('id="sendButton"\n          class="composer-send"\n          aria-label="送出"\n          disabled>', 'id="sendButton"\n          class="composer-send"\n          aria-label="送出">', 1)
          # Live API handshake must complete before microphone frames are sent.
          s=s.replace('const voice={on:false,ws:null,stream:null,ctx:null,source:null,processor:null,play:null,session:null,seq:0,profile:', 'const voice={on:false,ready:false,ws:null,stream:null,ctx:null,source:null,processor:null,play:null,session:null,seq:0,profile:', 1)
          s=s.replace('voice.on=true;stopIcon();st("正在聆聽…");voice.ws.send(JSON.stringify({setup:', 'voice.on=true;voice.ready=false;stopIcon();st("建立語音連線…");voice.ws.send(JSON.stringify({setup:', 1)
          s=s.replace('if(!voice.on||voice.ws.readyState!==1)return;const f=', 'if(!voice.on||!voice.ready||voice.ws.readyState!==1)return;const f=', 1)
          s=s.replace('voice.ws.onmessage=async e=>{let m;try{m=JSON.parse(e.data)}catch{return};const c=', 'voice.ws.onmessage=async e=>{let m;try{m=JSON.parse(e.data)}catch{return};if(m.setupComplete){voice.ready=true;st("正在聆聽…");return}const c=', 1)
          s=s.replace('voice.ws.onerror=()=>st("語音連線錯誤");', 'voice.ws.onerror=()=>{voice.ready=false;st("語音連線錯誤，請重試");};', 1)
          s=s.replace('voice.on=false;try{voice.processor?.disconnect()', 'voice.on=false;voice.ready=false;try{voice.processor?.disconnect()', 1)
          hard='''<script>\n/* AIVAULT_DARK_STAR_VOICE_HARDENED_CONTROLS_V3 */\n(()=>{\nconst input=document.getElementById("composerInput")||document.querySelector(".composer-input"),send=document.getElementById("sendButton")||document.querySelector(".composer-send"),menuButton=document.getElementById("menuButton"),drawer=document.getElementById("drawer"),back=document.getElementById("drawerBackdrop"),close=document.getElementById("drawerClose"),voicePanel=document.getElementById("aivaultVoicePanel"),drawerBottom=drawer?.querySelector(".drawer-bottom");\nif(!send)return;\nconst closeDrawer=()=>{drawer?.classList.remove("show");back?.classList.remove("show")};\nclose?.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();closeDrawer()},{capture:true});\nback?.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();closeDrawer()},{capture:true});\ndocument.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});\nmenuButton?.addEventListener("click",()=>{drawer?.classList.add("show");back?.classList.add("show")},true);\nif(voicePanel&&drawerBottom){drawerBottom.prepend(voicePanel);voicePanel.classList.remove("show");voicePanel.style.position="static";voicePanel.style.width="100%";voicePanel.style.margin="0 0 10px";voicePanel.style.boxShadow="none";voicePanel.style.border="1px solid #e5e5e5";}\nconst sync=()=>{if(!input)return;if(!input.value.trim()&&!send.dataset.darkStarSending){send.disabled=false;send.style.pointerEvents="auto"}};\nsync();input?.addEventListener("input",sync,true);new MutationObserver(sync).observe(send,{attributes:true,attributeFilter:["disabled"]});\nconst bottom=document.querySelector(".drawer-bottom");\nif(bottom&&!document.getElementById("aivaultDrawerVoice")){const box=document.createElement("div");box.id="aivaultDrawerVoice";box.style.cssText="border-top:1px solid #eee;margin-top:4px;padding:10px 4px 4px";box.innerHTML='<div style="font-size:12px;color:#777;margin:0 6px 7px">即時語音</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><button type="button" data-drawer-voice="Kore" style="border:1px solid #0a84ff;background:#f1f7ff;color:#0a84ff;border-radius:8px;padding:7px 4px;font-size:11px">女聲</button><button type="button" data-drawer-voice="Puck" style="border:1px solid #e4e4e4;background:#fff;color:#333;border-radius:8px;padding:7px 4px;font-size:11px">男聲</button><button type="button" data-drawer-voice="Charon" style="border:1px solid #e4e4e4;background:#fff;color:#333;border-radius:8px;padding:7px 4px;font-size:11px">成熟聲</button><button type="button" data-drawer-voice="Leda" style="border:1px solid #e4e4e4;background:#fff;color:#333;border-radius:8px;padding:7px 4px;font-size:11px">年輕聲</button></div>';bottom.appendChild(box);const setVoice=name=>{localStorage.setItem("aivault_voice_profile",name);document.querySelectorAll("[data-drawer-voice]").forEach(x=>{const on=x.dataset.drawerVoice===name;x.style.borderColor=on?"#0a84ff":"#e4e4e4";x.style.background=on?"#f1f7ff":"#fff";x.style.color=on?"#0a84ff":"#333"});document.querySelectorAll(".aivault-voice-choice").forEach(x=>x.classList.toggle("active",x.dataset.voice===name));if(voicePanel)voicePanel.classList.remove("show")};box.querySelectorAll("[data-drawer-voice]").forEach(b=>b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();setVoice(b.dataset.drawerVoice)}));setVoice(localStorage.getItem("aivault_voice_profile")||"Kore")}\n})();\n</script>\n'''
          s=re.sub(r'<script>\s*/\* AIVAULT_DARK_STAR_VOICE_HARDENED_CONTROLS(?:_V3)? \*/.*?</script>\s*', '', s, flags=re.S)
          s=s.replace('</body>', hard+'</body>', 1)
          p.write_text(s,encoding='utf-8')
      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          s=Path('technical-dark-star.html').read_text(encoding='utf-8')
          checks=[
            'AIVAULT_DARK_STAR_ADDITIVE_VOICE_UI_V2' in s,
            'AIVAULT_DARK_STAR_VOICE_HARDENED_CONTROLS_V3' in s,
            'voice.ready=false' in s,
            'if(m.setupComplete){voice.ready=true' in s,
            '!voice.ready' in s,
            'access_token=' in s,
            'realtimeInput:{audio:{mimeType:"audio/pcm;rate=16000",data:b64(o)}}' in s,
            'data-drawer-voice="Kore"' in s,
            '<button id="micButton"' in s,
            '<button id="sendButton"' in s,
            'id="drawerClose"' in s,
          ]
          if not all(checks): raise SystemExit('Dark Star live voice validation failed')
          print('DARK STAR LIVE VOICE V3 VALIDATED')
      - name: Commit repaired HTML
        shell: bash
        run: |
          git config user.name 'aivault-additive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add technical-dark-star.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Dark Star live voice handshake and drawer voice settings'
          git push