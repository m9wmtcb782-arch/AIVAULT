name: Dark Star Voice Finalize
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: dark-star-voice-finalize
  cancel-in-progress: true
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply exact header UI only
        shell: python
        run: |
          from pathlib import Path
          import re

          h=Path('technical-dark-star.html')
          j=Path('technical-dark-star-voice-fix.js')
          s=h.read_text(encoding='utf-8')
          v=j.read_text(encoding='utf-8')

          # 1. Back icon: only change the visible home control, preserving history.back().
          pattern=re.compile(r'<a id="homeButton"[\s\S]*?</a>')
          replacement='''<a id="homeButton"
    class="brand-home"
    href="#"
    aria-label="回上一頁"
    title="回上一頁"
    onclick="history.back(); return false;">
    🔙
  </a>'''
          s,n=pattern.subn(replacement,s,count=1)
          if n!=1:
              raise SystemExit('homeButton not found; refusing patch')

          # 2. Put ONLY the language control beside the upper header brand.
          marker='AIVAULT_DARK_STAR_HEADER_DIRECT_20260914'
          if marker not in v:
              old="const live=document.createElement('button');live.type='button';live.className='ds-fix-btn';live.id='dsFixLive';wrap.append(langWrap,voiceWrap,transWrap,live);"
              new="const live=document.createElement('button');live.type='button';live.className='ds-fix-btn';live.id='dsFixLive';wrap.append(voiceWrap,transWrap,live);\nconst languageTop=document.createElement('div');languageTop.className='ds-fix-language-top';languageTop.appendChild(langWrap);\n/* AIVAULT_DARK_STAR_HEADER_DIRECT_20260914 */"
              if old not in v:
                  raise SystemExit('language insertion target not found; refusing patch')
              v=v.replace(old,new,1)

              old2="const teaching=[...document.querySelectorAll('button,a,[role=\"button\"]')].find(el=>el.textContent.trim().includes('教學助理'));\nif(teaching&&teaching.parentNode){teaching.parentNode.insertBefore(wrap,teaching.nextSibling)}else{brand?brand.after(wrap):top.appendChild(wrap)}"
              new2="const teaching=[...document.querySelectorAll('button,a,[role=\"button\"]')].find(el=>el.textContent.trim().includes('教學助理'));\nif(teaching&&teaching.parentNode){teaching.parentNode.insertBefore(languageTop,teaching.nextSibling);teaching.parentNode.insertBefore(wrap,languageTop.nextSibling)}else{brand?brand.after(languageTop,wrap):top.append(languageTop,wrap)}"
              if old2 in v:
                  v=v.replace(old2,new2,1)
              else:
                  # Current page has no 教學助理 element in source; brand is the actual upper-header anchor.
                  old3="if(teaching&&teaching.parentNode){teaching.parentNode.insertBefore(wrap,teaching.nextSibling)}else{brand?brand.after(wrap):top.appendChild(wrap)}"
                  new3="if(teaching&&teaching.parentNode){teaching.parentNode.insertBefore(languageTop,teaching.nextSibling);teaching.parentNode.insertBefore(wrap,languageTop.nextSibling)}else{brand?brand.after(languageTop,wrap):top.append(languageTop,wrap)}"
                  if old3 not in v:
                      raise SystemExit('header insertion target not found; refusing patch')
                  v=v.replace(old3,new3,1)

              # 3. Keep the language button visually in the same top row.
              css=".ds-fix-language-top{display:inline-flex;align-items:center;position:relative;flex:0 0 auto;margin-left:8px;z-index:100}.ds-fix-language-top .ds-fix-btn{height:36px;white-space:nowrap}"
              anchor='.ds-fix-tools{'
              if css not in v:
                  idx=v.find(anchor)
                  if idx>=0:
                      end=v.find('}',idx)
                      if end>=0:v=v[:end+1]+css+v[end+1:]

          h.write_text(s,encoding='utf-8')
          j.write_text(v,encoding='utf-8')
      - name: Validate exact UI patch
        shell: python
        run: |
          from pathlib import Path
          h=Path('technical-dark-star.html').read_text(encoding='utf-8')
          j=Path('technical-dark-star-voice-fix.js').read_text(encoding='utf-8')
          checks=[
            'onclick="history.back(); return false;"' in h,
            '🔙' in h,
            'AIVAULT_DARK_STAR_HEADER_DIRECT_20260914' in j,
            "wrap.append(voiceWrap,transWrap,live)" in j,
            'languageTop.appendChild(langWrap)' in j,
          ]
          if not all(checks): raise SystemExit('Exact Dark Star header validation failed')
          print('DARK STAR HEADER EXACT PATCH VALIDATED')
      - name: Commit UI-only patch
        shell: bash
        run: |
          git config user.name 'aivault-ui-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add technical-dark-star.html technical-dark-star-voice-fix.js
          git diff --cached --quiet && exit 0
          git commit -m 'Place language beside header and use back icon'
          git push
