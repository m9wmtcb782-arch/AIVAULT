name: Dark Star Voice Finalize
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: dark-star-voice-finalize
  cancel-in-progress: true
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply Dark Star UI-only header fix
        shell: python
        run: |
          from pathlib import Path
          h=Path('technical-dark-star.html')
          j=Path('technical-dark-star-voice-fix.js')
          s=h.read_text(encoding='utf-8')
          v=j.read_text(encoding='utf-8')
          old='''<a id="homeButton"
    class="brand-home"
    href="aivault-home.html">
    回工作中心
  </a>'''
          new='''<a id="homeButton"
    class="brand-home"
    href="#"
    aria-label="回上一頁"
    title="回上一頁"
    onclick="history.back(); return false;">
    🔙
  </a>'''
          if old in s:
              s=s.replace(old,new,1)
          old=''' .brand{
  margin-left:7px;
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}'''.lstrip()
          new=''' .brand{
  margin-left:7px;
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
  flex:1 1 auto;
}'''.lstrip()
          if old in s:
              s=s.replace(old,new,1)
          old='.ds-fix-tools{display:flex;align-items:center;gap:6px;margin-left:10px;position:relative;z-index:80;flex-shrink:0}'
          new='.ds-fix-tools{display:flex;align-items:center;gap:6px;margin-left:10px;position:relative;z-index:80;flex-shrink:0}.ds-fix-language-top{display:inline-flex;align-items:center;position:relative;margin-left:8px;flex-shrink:0}.ds-fix-language-top .ds-fix-language-menu{top:41px;left:0}'
          if old in v:
              v=v.replace(old,new,1)
          old="const live=document.createElement('button');live.type='button';live.className='ds-fix-btn';live.id='dsFixLive';wrap.append(langWrap,voiceWrap,transWrap,live);\nconst teaching=[...document.querySelectorAll('button,a,[role=\"button\"]')].find(el=>el.textContent.trim().includes('教學助理'));\nif(teaching&&teaching.parentNode){teaching.parentNode.insertBefore(wrap,teaching.nextSibling)}else{brand?brand.after(wrap):top.appendChild(wrap)}"
          new="const live=document.createElement('button');live.type='button';live.className='ds-fix-btn';live.id='dsFixLive';wrap.append(voiceWrap,transWrap,live);\nconst languageTop=document.createElement('div');languageTop.className='ds-fix-language-top';languageTop.appendChild(langWrap);\nconst teaching=[...document.querySelectorAll('button,a,[role=\"button\"]')].find(el=>el.textContent.trim().includes('教學助理'));\nif(teaching&&teaching.parentNode){teaching.parentNode.insertBefore(languageTop,teaching.nextSibling);teaching.parentNode.insertBefore(wrap,languageTop.nextSibling)}else{brand?brand.after(languageTop,wrap):top.append(languageTop,wrap)}"
          if old not in v:
              raise SystemExit('Dark Star header insertion target not found; refusing patch')
          v=v.replace(old,new,1)
          h.write_text(s,encoding='utf-8')
          j.write_text(v,encoding='utf-8')
      - name: Commit UI-only patch
        shell: bash
        run: |
          git config user.name 'aivault-additive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add technical-dark-star.html technical-dark-star-voice-fix.js
          git diff --cached --quiet && exit 0
          git commit -m 'Move Dark Star language beside teaching assistant'
          git push
      - name: Fix Gemini Live WebSocket handshake and composer state
        shell: python
        run: |
          from pathlib import Path
          p=Path('technical-dark-star.html')
          s=p.read_text(encoding='utf-8')
          if 'AIVAULT_DARK_STAR_ADDITIVE_VOICE_UI_V2' not in s:
              raise SystemExit('voice additive module missing; refusing to modify core')
          old='''voice.ws.send(JSON.stringify({setup:{model:tj.model||"models/gemini-3.1-flash-live-preview",generationConfig:{responseModalities:["AUDIO"],thinkingConfig:{thinkingLevel:"minimal"}},inputAudioTranscription:{},outputAudioTranscription:{},speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voice.profile}}}}}));'''
          new='''voice.ws.send(JSON.stringify({setup:{model:tj.model||"models/gemini-3.1-flash-live-preview",responseModalities:["AUDIO"],inputAudioTranscription:{},outputAudioTranscription:{},speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voice.profile}}},thinkingConfig:{thinkingLevel:"minimal"},systemInstruction:{parts:[{text:"你是 AIVAULT 的即時語音對話引擎。使用繁體中文，回答自然、簡短、像真人對話。不要自我介紹，不要重複回答，不要提及模型或內部系統。"}]}}}));'''
          if old in s: s=s.replace(old,new,1)
          s=s.replace('voice.ws.onclose=()=>stop(false)', 'voice.ws.onclose=e=>{voice.ready=false;st("語音連線中斷"+(e?.code?" ["+e.code+"]":""));console.warn("AIVAULT Live WS close",e?.code,e?.reason,e);stop(false)}',1)
          s=s.replace('voice.ws.onerror=()=>{voice.ready=false;st("語音連線錯誤，請重試");};', 'voice.ws.onerror=e=>{voice.ready=false;st("語音連線錯誤");console.error("AIVAULT Live WS error",e)};',1)
          s=s.replace('if(m.setupComplete){voice.ready=true;st("正在聆聽…");return}', 'if(m.setupComplete){voice.ready=true;st("正在聆聽…");console.log("AIVAULT Live setupComplete",m);return}if(m.error){voice.ready=false;st("Gemini 語音設定錯誤");console.error("AIVAULT Live server error",m.error);return}',1)
          old_refresh='''function refresh(){if(voice.on)return stopIcon();if(input.value.trim()) {send.classList.remove("aivault-live-button","active");send.disabled=false}else wave()}'''
          new_refresh='''function textIcon(){send.innerHTML='<svg class="aivault-send-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>';send.classList.add("aivault-live-button","aivault-text-button");send.classList.remove("active");send.disabled=false}
function refresh(){if(voice.on)return stopIcon();if(input.value.trim())textIcon();else wave()}'''
          if old_refresh in s: s=s.replace(old_refresh,new_refresh,1)
          marker='''.aivault-live-button{background:#0a84ff!important;color:#fff!important;opacity:1!important;cursor:pointer!important}'''
          css='''.aivault-live-button{background:#0a84ff!important;color:#fff!important;opacity:1!important;cursor:pointer!important}\n.aivault-send-arrow{width:18px;height:18px;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}\n.aivault-text-button:hover{background:#0879eb!important}'''
          if marker in s and '.aivault-send-arrow{' not in s: s=s.replace(marker,css,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          s=Path('technical-dark-star.html').read_text(encoding='utf-8')
          checks=['onclick="history.back(); return false;"' in s,'function sendMessage()' in s,'const AI_GATEWAY_URL' in s,'function callAIVAULT(' in s]
          if not all(checks): raise SystemExit('Dark Star validation failed')
          print('DARK STAR UI-ONLY HEADER VALIDATED')
      - name: Commit repaired HTML
        shell: bash
        run: |
          git config user.name 'aivault-additive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add technical-dark-star.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix typed message send button state'
          git push
