name: Restore Dark Star Baseline
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact successful live-voice baseline
        shell: bash
        run: |
          git checkout 29b2df9c753604f6e310a0de1ca830e8f9e4d945 -- technical-dark-star.html
      - name: Validate baseline
        shell: bash
        run: |
          grep -q 'technical-dark-star-voice-fix.js' technical-dark-star.html
          ! grep -q 'AIVAULT_DARK_STAR_MOBILE_MENU_FIX_20260914' technical-dark-star.html
          ! grep -q 'AIVAULT_DARK_STAR_MENU_CLICK_FIX_20260914_V2' technical-dark-star.html
          grep -q 'menuButton.addEventListener' technical-dark-star.html
      - name: Commit restored page
        shell: bash
        run: |
          git config user.name 'aivault-restore-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add technical-dark-star.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restore Technical Dark Star successful live voice baseline'
          git push
