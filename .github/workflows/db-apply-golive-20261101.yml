name: DB apply go-live 2026-11-01 migrations (additive)
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations one by one via Management API (each in a transaction, stop on first error)
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          def q(sql):
              r = urllib.request.Request("https://api.supabase.com/v1/projects/clcddygkaaqqtsbswgdf/database/query",
                  data=json.dumps({"query": sql}).encode(), headers={"Authorization": "Bearer " + os.environ["TOKEN"], "Content-Type": "application/json", "User-Agent": "aivault-migrate"})
              try: return json.load(urllib.request.urlopen(r))
              except urllib.error.HTTPError as e: sys.exit("FAILED: " + e.read().decode()[:800])
          files = ["supabase/migrations/20261101010000_aivault_ai_quota_split_and_degree_learning.sql",
                   "supabase/migrations/20261101090000_aivault_causal_engine_v0.sql",
                   "supabase/migrations/20261101100000_aivault_experience_memory_v1.sql",
                   "neural/neural_events.sql", "neural/memory_scopes.sql",
                   "services/common-memory/sql/common_memory_v4.sql"]
          done = {r["name"] for r in q("select coalesce(json_agg(name),'[]') as n from supabase_migrations.schema_migrations where version like '20261101g%'")[0]["n"] or []} if False else set()
          for f in files:
              sql = open(f).read()
              q("begin;\n" + sql + "\ncommit;")
              print("APPLIED", f)
          q("insert into public.aivault_ai_quota_config(provider,daily_total,pool_share,source_note,updated_by) values ('groq',100,0.5,'founder set 2026-11-01 07:59 Taipei: 100/day, 50% pool, 50% darkstar','golive-20261101') on conflict (provider) do update set daily_total=excluded.daily_total,pool_share=excluded.pool_share,source_note=excluded.source_note,updated_by=excluded.updated_by,updated_at=now()")
          print(q("select provider,daily_total,pool_share from public.aivault_ai_quota_config"))
          print(q("select c.relname, c.relrowsecurity from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind in ('r','v') and (c.relname like 'aivault_ai_quota%' or c.relname like 'aivault_causal%' or c.relname like 'aivault_experience%' or c.relname like 'neural_%' or c.relname like 'aivault_memory_%' or c.relname like 'cm_%' or c.relname='aivault_pool_degree_learning_plan') order by 1"))
          print(q("select count(*) as n from public.aivault_pool_agent_memory"))
          PY
