name: Autonomous Agent Runtime Offline Tests
on:
  push:
    paths:
      - 'aivault-collab-v0.2/autonomous-agent-runtime/**'
      - '.github/workflows/agent-runtime-tests.yml'
  pull_request:
    paths:
      - 'aivault-collab-v0.2/autonomous-agent-runtime/**'
      - '.github/workflows/agent-runtime-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: aivault-collab-v0.2/autonomous-agent-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all offline regression tests
        run: |
          set -o pipefail
          node --experimental-transform-types run-offline-tests-node.mjs 2>&1 | tee offline-test-results.log
      - name: Publish test results
        if: always()
        run: |
          if [ -f offline-test-results.log ]; then
            echo '## Autonomous Agent Runtime offline tests' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 50 offline-test-results.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Tests did not start; inspect setup steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-agent-runtime-offline-tests
          path: aivault-collab-v0.2/autonomous-agent-runtime/offline-test-results.log
          if-no-files-found: ignore
          retention-days: 14
