name: Dark Star Header Exact

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply exact header placement
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('technical-dark-star.html')
          s = p.read_text(encoding='utf-8')

          marker = 'AIVAULT_DARK_STAR_HEADER_EXACT_20260914'
          if marker not in s:
              patch = r'''
<style id="AIVAULT_DARK_STAR_HEADER_EXACT_20260914">
/* AIVAULT_DARK_STAR_HEADER_EXACT_20260914 */
.topbar{display:flex!important;align-items:center!important;flex-wrap:nowrap!important;overflow:visible!important}
.brand{display:flex!important;align-items:center!important;flex:0 1 auto!important;min-width:0!important}
.ds-header-language-exact{display:inline-flex!important;align-items:center!important;position:relative!important;flex:0 0 auto!important;margin-left:8px!important;margin-right:0!important;z-index:100!important}
.ds-header-language-exact .ds-fix-btn{height:36px!important;white-space:nowrap!important}
</style>
<script>
(()=>{
  const place=()=>{
    const lang=document.getElementById('dsFixLanguage');
    const brand=document.querySelector('.topbar .brand');
    if(!lang||!brand||!brand.parentNode)return false;
    const box=lang.parentElement;
    if(!box)return false;
    box.classList.add('ds-header-language-exact');
    brand.parentNode.insertBefore(box,brand.nextSibling);
    return true;
  };
  if(!place()){
    const mo=new MutationObserver(()=>{if(place())mo.disconnect()});
    mo.observe(document.documentElement,{childList:true,subtree:true});
    setTimeout(()=>mo.disconnect(),20000);
  }
})();
</script>
'''
              pos=s.lower().rfind('</body>')
              if pos < 0: raise SystemExit('body marker not found')
              s=s[:pos]+patch+s[pos:]

          # Force the existing home control to be a back icon only.
          pattern = re.compile(r'<a id="homeButton"[\s\S]*?</a>')
          replacement = '''<a id="homeButton"
    class="brand-home"
    href="#"
    aria-label="回上一頁"
    title="回上一頁"
    onclick="history.back(); return false;">
    🔙
  </a>'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n:
              s=s2

          p.write_text(s,encoding='utf-8')

      - name: Commit exact header fix
        shell: bash
        run: |
          git config user.name 'aivault-ui-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add technical-dark-star.html
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Place language beside header and use back icon'
          git push
