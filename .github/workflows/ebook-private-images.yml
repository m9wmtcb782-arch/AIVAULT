name: Ebook images to private storage (manual)
on:
  workflow_dispatch:
    inputs:
      eid: { description: "ebook id", required: true, default: "c8743d50-bad5-4ec8-b675-5e64fe7985a9" }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EID: ${{ inputs.eid }}
        run: python3 .github/scripts/ebook_private_images.py
