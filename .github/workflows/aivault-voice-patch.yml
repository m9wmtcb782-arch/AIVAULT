name: AIVAULT Voice Patch

on:
  push:
    paths:
      - '.github/voice-patch-request.json'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply voice patch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          html_path = Path('technical-dark-star.html')
          request_path = Path('.github/voice-patch-request.json')
          html = html_path.read_text(encoding='utf-8')

          start = html.find('<!-- AIVAULT_DARK_STAR_VOICE_UI_V4_START -->')
          end = html.find('<!-- AIVAULT_DARK_STAR_VOICE_UI_V4_END -->')
          if start >= 0 and end >= 0:
              end += len('<!-- AIVAULT_DARK_STAR_VOICE_UI_V4_END -->')
              html = html[:start] + html[end:]

          css = r'''
          <style id="aivaultDarkStarVoiceV4Style">
          .ds-v4-tools{display:flex;align-items:center;gap:6px;margin-left:12px;position:relative;z-index:80}
          .ds-v4-btn{height:36px;border:1px solid #e5e5e5;background:#fff;color:#303030;border-radius:10px;padding:0 11px;display:flex;align-items:center;gap:7px;font-size:12px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.03)}
          .ds-v4-btn:hover{background:#f5f5f5}
          .ds-v4-btn.live{background:#171717;color:#fff;border-color:#171717}
          .ds-v4-btn.live:hover{background:#292929}
          .ds-v4-menu{position:absolute;left:0;top:42px;width:270px;max-height:58vh;overflow:auto;padding:7px;background:#fff;border:1px solid #e5e5e5;border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.14);display:none}
          .ds-v4-menu.show{display:block}
          .ds-v4-voice{width:100%;border:0;background:#fff;border-radius:9px;padding:9px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;color:#333;font-size:12px}
          .ds-v4-voice:hover{background:#f3f3f3}
          .ds-v4-voice.active{background:#f0f0f0;font-weight:600}
          .ds-v4-voice small{color:#999;font-size:10px}
          .ds-v4-status{font-size:11px;color:#888;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .ds-v4-live-row{display:flex;gap:13px;margin-bottom:30px;align-items:flex-start}
          .ds-v4-live-row.user{justify-content:flex-end}
          .ds-v4-live-row .message-avatar{flex:none}
          .ds-v4-live-row.user .message-avatar{background:#e9e9e9;color:#444}
          .ds-v4-live-row .message-body{min-width:0;max-width:690px}
          .ds-v4-live-row.user .message-body{max-width:min(600px,82%)}
          .ds-v4-live-row .message-text{font-size:16px;line-height:1.75;word-break:break-word;white-space:pre-wrap}
          .ds-v4-live-row.user .message-text{background:#f4f4f4;border-radius:18px;padding:10px 15px}
          @media(max-width:680px){.ds-v4-tools{margin-left:5px}.ds-v4-btn{padding:0 8px}.ds-v4-status{display:none}.ds-v4-menu{width:245px}}
          </style>
          '''

          js = r'''
          <script id="aivaultDarkStarVoiceV4">
          (()=>{
            const RELAY='wss://clcddygkaaqqtsbswgdf.supabase.co/functions/v1/technical-dark-star-voice-sdk-relay';
            const SESSION='https://clcddygkaaqqtsbswgdf.supabase.co/functions/v1/technical-dark-star-voice-session';
            const voices=[
              ['Kore','沉穩女聲'],['Puck','活潑男聲'],['Charon','知性男聲'],['Leda','年輕女聲'],['Gacrux','成熟女聲'],
              ['Aoede','自然女聲'],['Orus','沉穩男聲'],['Zephyr','明亮女聲'],['Fenrir','有力男聲'],['Achird','親切男聲'],
              ['Sadachbia','活潑女聲'],['Algieba','柔和男聲'],['Algenib','沙啞男聲'],['Achernar','柔軟女聲'],['Zubenelgenubi','自然男聲'],
              ['Sadaltager','知識型男聲'],['Enceladus','氣聲男聲'],['Laomedeia','明快女聲'],['Schedar','平穩男聲'],['Umbriel','輕鬆男聲'],
              ['Autonoe','明亮女聲'],['Erinome','清晰女聲'],['Callirrhoe','輕鬆女聲'],['Iapetus','清晰男聲'],['Despina','柔和女聲'],
              ['Rasalgethi','資訊型男聲'],['Alnilam','堅定男聲'],['Pulcherrima','前進感女聲'],['Vindemiatrix','溫柔女聲'],['Sulafat','溫暖女聲']
            ];
            const state={active:false,ready:false,ws:null,stream:null,ctx:null,source:null,processor:null,sessionId:null,sessionKey:null,seq:0,voice:localStorage.getItem('aivault_voice_profile')||'Kore',inputText:'',outputText:'',userBubble:null,assistantBubble:null,sources:new Set(),nextAudioTime:0};
            const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
            function addUI(){
              const top=document.querySelector('.topbar'); if(!top||document.getElementById('dsV4Tools')) return;
              const brand=top.querySelector('.brand');
              const wrap=document.createElement('div'); wrap.id='dsV4Tools'; wrap.className='ds-v4-tools';
              const voiceBtn=document.createElement('button'); voiceBtn.id='dsV4VoiceBtn'; voiceBtn.className='ds-v4-btn'; voiceBtn.type='button';
              const liveBtn=document.createElement('button'); liveBtn.id='dsV4LiveBtn'; liveBtn.className='ds-v4-btn'; liveBtn.type='button'; liveBtn.textContent='🎙 即時語音';
              const menu=document.createElement('div'); menu.id='dsV4VoiceMenu'; menu.className='ds-v4-menu';
              voices.forEach(([name,label])=>{const b=document.createElement('button');b.type='button';b.className='ds-v4-voice';b.dataset.voice=name;b.innerHTML='<span>🔊 '+esc(name)+'</span><small>'+esc(label)+'</small>';b.addEventListener('click',async e=>{e.stopPropagation();await chooseVoice(name);});menu.appendChild(b);});
              wrap.appendChild(voiceBtn); wrap.appendChild(menu); wrap.appendChild(liveBtn);
              brand?brand.after(wrap):top.insertBefore(wrap,top.firstChild);
              function update(){voiceBtn.textContent='🔊 '+state.voice;document.querySelectorAll('.ds-v4-voice').forEach(x=>x.classList.toggle('active',x.dataset.voice===state.voice));liveBtn.textContent=state.active?'⏹ 結束語音':'🎙 即時語音';liveBtn.classList.toggle('live',state.active)}
              voiceBtn.addEventListener('click',e=>{e.stopPropagation();menu.classList.toggle('show')});
              liveBtn.addEventListener('click',e=>{e.stopPropagation();state.active?stopVoice():startVoice()});
              document.addEventListener('click',()=>menu.classList.remove('show'));
              window.dsV4UpdateUI=update; update();
              document.getElementById('aivaultVoicePanel')?.style.setProperty('display','none','important');
              document.querySelector('[data-aivault-action="voice"]')?.style.setProperty('display','none','important');
            }
            function status(t){const s=document.getElementById('dsV4Status');if(s)s.textContent=t}
            function scroll(){const m=document.getElementById('messages');if(m)m.scrollTop=m.scrollHeight}
            function bubble(role,text){
              const inner=document.getElementById('messagesInner');if(!inner)return null;
              let row=document.createElement('div');row.className='ds-v4-live-row '+role;
              row.innerHTML='<div class="message-avatar">'+(role==='user'?'你':'暗星')+'</div><div class="message-body"><div class="message-text"></div></div>';
              if(role==='user') inner.appendChild(row); else inner.appendChild(row);
              scroll();return row.querySelector('.message-text');
            }
            function updateBubble(role,text){let key=role==='user'?'userBubble':'assistantBubble';if(!state[key])state[key]=bubble(role,text);if(state[key])state[key].textContent=text;scroll()}
            function finalizeBubbles(){
              try{
                if(state.inputText){messagesHistory.push({role:'user',text:state.inputText});}
                if(state.outputText){messagesHistory.push({role:'assistant',text:state.outputText});}
                if(typeof saveState==='function')saveState();
              }catch(e){console.warn('AIVAULT voice history save',e)}
              state.userBubble=null;state.assistantBubble=null;state.inputText='';state.outputText='';
            }
            function b64(buf){const u=new Uint8Array(buf.buffer,buf.byteOffset,buf.byteLength);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(s)}
            function u8(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
            async function saveTurn(role,text){if(!state.sessionId||!text)return;try{await fetch(SESSION,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'turn',session_id:state.sessionId,sequence_no:++state.seq,role,content:text})})}catch(e){console.warn('AIVAULT voice turn save',e)}}
            function stopAudio(){for(const s of state.sources){try{s.stop()}catch{}}state.sources.clear();if(state.ctx)state.nextAudioTime=state.ctx.currentTime}
            function playPCM(base64){if(!state.ctx)return;const u=u8(base64);const pcm=new Int16Array(u.buffer,u.byteOffset,Math.floor(u.byteLength/2));const f=new Float32Array(pcm.length);for(let i=0;i<pcm.length;i++)f[i]=pcm[i]/32768;const ac=state.ctx;const now=ac.currentTime;state.nextAudioTime=Math.max(state.nextAudioTime,now);const ab=ac.createBuffer(1,f.length,24000);ab.copyToChannel(f,0);const src=ac.createBufferSource();src.buffer=ab;src.connect(ac.destination);const start=Math.max(ac.currentTime,state.nextAudioTime);src.start(start);state.nextAudioTime=start+ab.duration;state.sources.add(src);src.onended=()=>state.sources.delete(src)}
            async function startVoice(){if(state.active)return;try{
              status('啟動中…');
              state.ctx=new(window.AudioContext||window.webkitAudioContext)();await state.ctx.resume();
              const r=await fetch(SESSION,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'start',voice_profile:state.voice})});
              const j=await r.json(); if(!r.ok||!j.session)throw new Error(j.error||'session start failed');
              state.sessionId=j.session.id;state.sessionKey=j.session.session_key;state.seq=0;
              state.stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
              const url=RELAY+'?voice='+encodeURIComponent(state.voice)+'&session_key='+encodeURIComponent(state.sessionKey||'');
              state.ws=new WebSocket(url);
              state.ws.onopen=()=>{state.active=true;state.ready=false;window.dsV4UpdateUI?.();status('連線中…')};
              state.ws.onmessage=async ev=>{let m;try{m=JSON.parse(ev.data)}catch{return};
                if(m.type==='setupComplete'){state.ready=true;status('正在聆聽…');
                  const ac=state.ctx;state.source=ac.createMediaStreamSource(state.stream);state.processor=ac.createScriptProcessor(4096,1,1);state.source.connect(state.processor);state.processor.connect(ac.destination);
                  state.processor.onaudioprocess=e=>{if(!state.active||!state.ready||!state.ws||state.ws.readyState!==1)return;const f=e.inputBuffer.getChannelData(0),ratio=e.inputBuffer.sampleRate/16000,n=Math.floor(f.length/ratio),o=new Int16Array(n);for(let i=0;i<n;i++){const v=Math.max(-1,Math.min(1,f[Math.floor(i*ratio)]));o[i]=v<0?v*32768:v*32767}state.ws.send(JSON.stringify({type:'audio',data:b64(o),mimeType:'audio/pcm;rate=16000'}))};
                  return;
                }
                if(m.error){status('語音錯誤');console.error('AIVAULT voice relay error',m);return}
                const c=m.serverContent||{};
                if(c.inputTranscription?.text){state.inputText+=c.inputTranscription.text;updateBubble('user',state.inputText)}
                if(c.outputTranscription?.text){state.outputText+=c.outputTranscription.text;updateBubble('assistant',state.outputText)}
                if(c.interrupted){stopAudio()}
                for(const p of (c.modelTurn?.parts||[])){if(p.inlineData?.data)playPCM(p.inlineData.data)}
                if(c.turnComplete){if(state.inputText)await saveTurn('user',state.inputText);if(state.outputText)await saveTurn('assistant',state.outputText);finalizeBubbles();}
              };
              state.ws.onerror=e=>{status('語音連線錯誤');console.error('AIVAULT SDK relay WS error',e)};
              state.ws.onclose=()=>{if(state.active){state.active=false;state.ready=false;window.dsV4UpdateUI?.();status('語音已中斷')} };
            }catch(e){console.error('AIVAULT voice start failed',e);status('語音啟動失敗');await stopVoice()}}
            async function stopVoice(){
              const was=state.active||state.sessionId;state.active=false;state.ready=false;window.dsV4UpdateUI?.();
              try{state.processor?.disconnect();state.source?.disconnect()}catch{};state.stream?.getTracks().forEach(t=>t.stop());stopAudio();try{state.ws?.send(JSON.stringify({type:'close'}))}catch{};try{state.ws?.close()}catch{};try{await state.ctx?.close()}catch{};
              if(was&&state.sessionId)fetch(SESSION,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'end',session_id:state.sessionId})}).catch(()=>{});
              state.ws=null;state.stream=null;state.ctx=null;state.source=null;state.processor=null;state.sessionId=null;state.sessionKey=null;state.seq=0;state.userBubble=null;state.assistantBubble=null;state.inputText='';state.outputText='';status('準備就緒');
            }
            async function chooseVoice(v){const running=state.active;state.voice=v;localStorage.setItem('aivault_voice_profile',v);window.dsV4UpdateUI?.();document.getElementById('dsV4VoiceMenu')?.classList.remove('show');if(running){await stopVoice();await startVoice()}}
            window.dsV4ChooseVoice=chooseVoice;
            document.addEventListener('click',e=>{
              const oldVoice=e.target.closest?.('[data-aivault-action="voice"]');
              if(oldVoice){e.preventDefault();e.stopImmediatePropagation();document.getElementById('dsV4VoiceBtn')?.click();}
              const send=e.target.closest?.('#composerSend,.composer-send,#sendButton');
              const input=document.getElementById('composerInput')||document.querySelector('.composer-input');
              if(send&&input&&!input.value.trim()&&!e.defaultPrevented){e.preventDefault();e.stopImmediatePropagation();state.active?stopVoice():startVoice();}
            },true);
            window.addEventListener('beforeunload',()=>{try{state.ws?.close()}catch{}});
            function boot(){addUI();const s=document.createElement('span');s.id='dsV4Status';s.className='ds-v4-status';s.textContent='';document.getElementById('dsV4Tools')?.appendChild(s)}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
          })();
          </script>
          '''

          marker = '<!-- AIVAULT_DARK_STAR_VOICE_UI_V4_START -->'
          endmarker = '<!-- AIVAULT_DARK_STAR_VOICE_UI_V4_END -->'
          block = marker + '\n' + css + '\n' + js + '\n' + endmarker
          if '</body>' in html:
              html = html.replace('</body>', block + '\n</body>', 1)
          else:
              html += '\n' + block + '\n'
          html_path.write_text(html, encoding='utf-8')
          request_path.unlink(missing_ok=True)
          PY

      - name: Commit patched page
        run: |
          git config user.name "AIVAULT Voice Patcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add technical-dark-star.html .github/voice-patch-request.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "AIVAULT voice V4: relay, voice selector, chat transcript"
          git push
