name: AI pool agent floor (work loop)
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      step: { description: "migrate,publish,seed,cycle,test", required: true, default: "cycle" }
      n: { description: "tasks per cycle (max 6)", required: false, default: "3" }
concurrency: { group: agent-floor, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PAGES_KEY: ${{ secrets.AIVAULT_PRIVATE_PAGES_KEY }}
          STEP: ${{ inputs.step || 'cycle' }}
          N: ${{ inputs.n || '3' }}
          OFF: ${{ vars.AGENT_FLOOR_OFF }}
        run: |
          if [ "$OFF" = "1" ]; then echo "disabled by repo variable AGENT_FLOOR_OFF=1"; exit 0; fi
          python3 .github/scripts/agent_floor_setup.py
