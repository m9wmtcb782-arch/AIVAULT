name: Dark Star Language Final
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact header UI
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('technical-dark-star.html')
          s=p.read_text(encoding='utf-8')
          marker='AIVAULT_DARK_STAR_HEADER_SIMPLE_20260914'
          if marker not in s:
              patch='''
<style id="AIVAULT_DARK_STAR_HEADER_SIMPLE_20260914">
.topbar{display:flex!important;align-items:center!important;flex-wrap:nowrap!important;overflow:visible!important}
.brand{display:flex!important;align-items:center!important;flex:0 1 auto!important;min-width:0!important}
.ds-header-language-simple{display:inline-flex!important;align-items:center!important;position:relative!important;flex:0 0 auto!important;margin-left:8px!important;z-index:100!important}
.ds-header-language-simple .ds-fix-btn{height:36px!important;white-space:nowrap!important}
</style>
<script>
(()=>{
 const place=()=>{
  const lang=document.getElementById('dsFixLanguage');
  const brand=document.querySelector('.topbar .brand');
  if(!lang||!brand||!brand.parentNode)return false;
  const box=lang.parentElement;
  if(!box)return false;
  box.classList.add('ds-header-language-simple');
  brand.parentNode.insertBefore(box,brand.nextSibling);
  return true;
 };
 if(!place()){
  const mo=new MutationObserver(()=>{if(place())mo.disconnect()});
  mo.observe(document.documentElement,{childList:true,subtree:true});
  setTimeout(()=>mo.disconnect(),20000);
 }
})();
</script>
'''
              pos=s.lower().rfind('</body>')
              if pos<0: raise SystemExit('body marker not found')
              s=s[:pos]+patch+s[pos:]
          old1='''<a id="homeButton"
    class="brand-home"
    href="aivault-home.html">
    回工作中心
  </a>'''
          new='''<a id="homeButton"
    class="brand-home"
    href="#"
    aria-label="回上一頁"
    title="回上一頁"
    onclick="history.back(); return false;">
    🔙
  </a>'''
          if old1 in s:s=s.replace(old1,new,1)
          old2='''<a id="homeButton"
    class="brand-home"
    href="#"
    aria-label="回上一頁"
    title="回上一頁"
    onclick="history.back(); return false;">
    ←
  </a>'''
          if old2 in s:s=s.replace(old2,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate and commit
        shell: bash
        run: |
          grep -q 'AIVAULT_DARK_STAR_HEADER_SIMPLE_20260914' technical-dark-star.html
          grep -q 'history.back(); return false;' technical-dark-star.html
          grep -q '🔙' technical-dark-star.html
          git config user.name 'aivault-ui-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add technical-dark-star.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Dark Star header language and back icon'
          git push
