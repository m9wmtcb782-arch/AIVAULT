name: Cache Three.js runtime

on:
  push:
    paths:
      - '.github/workflows/cache-threejs.yml'
  workflow_dispatch:

jobs:
  cache-three:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Three.js runtime
        run: |
          mkdir -p vendor/three/examples/jsm/loaders
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js -o vendor/three/three.module.js
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js -o vendor/three/examples/jsm/loaders/GLTFLoader.js
      - name: Rewrite GLTFLoader import to local runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('vendor/three/examples/jsm/loaders/GLTFLoader.js')
          s=p.read_text()
          s=s.replace("from 'three';", "from '../../three.module.js';")
          p.write_text(s)
          PY
      - name: Commit runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/three
          git diff --cached --quiet || git commit -m "Cache Three.js runtime for AIVAULT avatar"
          git push
