name: Android Compute Worker APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/compute-worker/**'
      - '.github/workflows/android-compute-worker.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK (no production credentials)
        working-directory: android/compute-worker
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload unsigned-for-release debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aivault-android-gpu-worker-debug
          path: android/compute-worker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
