name: Natural Voice isolated tests
on:
  push:
    branches: [feature/natural-voice-v1]
    paths:
      - "natural-voice/**"
      - ".github/workflows/natural-voice-tests.yml"
  pull_request:
    paths:
      - "natural-voice/**"
      - ".github/workflows/natural-voice-tests.yml"
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test JS modules without paid providers
        run: node --test natural-voice/*.test.mjs
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated test dependencies
        run: python -m pip install "fastapi>=0.110,<1" "httpx>=0.27,<1" "pydantic>=2,<3"
      - name: Test worker contracts without models or paid providers
        working-directory: natural-voice
        run: python -m unittest discover -p 'test_*.py' -v
