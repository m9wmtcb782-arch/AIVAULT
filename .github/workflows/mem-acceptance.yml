name: Shared memory A/B/C/D acceptance (offline sandbox, 1 free model call)
on:
  workflow_dispatch:
    inputs:
      step: { description: "migrate | test | both | admin", required: false, default: "both" }
concurrency: { group: mem-acceptance, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - if: inputs.step != 'test' && inputs.step != 'admin'
        env: { TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", PAGES_KEY: "${{ secrets.AIVAULT_PRIVATE_PAGES_KEY }}", STEP: memmig }
        run: python3 .github/scripts/degree_setup.py
      - if: inputs.step != 'migrate' && inputs.step != 'admin'
        env: { TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}" }
        run: python3 .github/scripts/mem_acceptance.py
      - if: inputs.step == 'admin'
        env: { TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", PAGES_KEY: "${{ secrets.AIVAULT_PRIVATE_PAGES_KEY }}", STEP: memgetmig }
        run: python3 .github/scripts/degree_setup.py && python3 .github/scripts/city_mem_admin.py
