name: Video center v2 (free CPU variants vs BBB questions)
# vc5. Off switch: repo var VIDEO_V2_OFF=1. Manual only. No Gemini, no paid API.
on:
  workflow_dispatch:
    inputs:
      variants: { description: "A,B", required: false, default: "A,B" }
      ctx_chars: { description: "max caption chars sent to the answerer", required: false, default: "14000" }
      try_tag: { description: "label appended to mode in DB", required: false, default: "" }
      record_verify: { description: "1 = write the scene-detector verification row", required: false, default: "0" }
concurrency: { group: video-center-v2, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 && pip install -q transformers==4.49.0 pillow accelerate num2words numpy
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-video-center-v2 }
      - env: { TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", VARIANTS: "${{ inputs.variants }}", RECORD_VERIFY: "${{ inputs.record_verify }}", CTX_CHARS: "${{ inputs.ctx_chars }}", TRY_TAG: "${{ inputs.try_tag }}", OFF: "${{ vars.VIDEO_V2_OFF }}" }
        run: |
          if [ "$OFF" = "1" ]; then echo "disabled by VIDEO_V2_OFF=1"; exit 0; fi
          python3 .github/scripts/video_center_v2.py
