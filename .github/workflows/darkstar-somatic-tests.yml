name: Dark Star Somatic Regression
on:
  push:
    paths:
      - 'modules/darkstar-*.js'
      - 'modules/package.json'
      - 'tests/darkstar-somatic-integration.test.mjs'
      - 'tests/darkstar-physics.test.mjs'
      - 'tests/darkstar-joint-motion-atlas.test.mjs'
      - 'modules/darkstar-physics/**'
      - '.github/workflows/darkstar-somatic-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  somatic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Dark Star somatic regression tests
        run: node --test tests/darkstar-somatic-integration.test.mjs tests/darkstar-physics.test.mjs tests/darkstar-joint-motion-atlas.test.mjs
