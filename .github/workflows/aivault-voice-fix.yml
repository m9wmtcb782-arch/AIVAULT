name: AIVAULT Voice Fix

on:
  push:
    paths:
      - '.github/voice-fix-request.json'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply additive voice and text-send fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html_path = Path('technical-dark-star.html')
          html = html_path.read_text(encoding='utf-8')

          # Remove only our previous fix blocks; preserve the tested V4 voice module itself.
          html = re.sub(r'<style id="aivaultDarkStarVoiceFixV1Style">.*?</script>\s*', '', html, count=1, flags=re.S)
          html = re.sub(r'<style id="aivaultDarkStarVoiceFixV2Style">.*?</script>\s*', '', html, count=1, flags=re.S)
          html = html.replace('<!-- AIVAULT_DARK_STAR_VOICE_UI_V4_END -->\n<!-- AIVAULT_DARK_STAR_VOICE_UI_V4_END -->', '<!-- AIVAULT_DARK_STAR_VOICE_UI_V4_END -->')

          fix = r'''<style id="aivaultDarkStarVoiceFixV3Style">
          /* Text composer: blue send button whenever normal text is ready. */
          .composer-send.ds-text-ready{
            background:#0a84ff!important;
            color:#fff!important;
            opacity:1!important;
          }
          .composer-send.ds-text-ready:hover{
            background:#0077ed!important;
          }
          /* Keep all 30 voice choices and their Traditional Chinese descriptions. */
          .ds-v4-voice small{
            display:block!important;
            color:#888!important;
            font-size:11px!important;
            line-height:1.35!important;
            margin-top:2px!important;
          }
          .ds-v4-voice{
            justify-content:flex-start!important;
            align-items:flex-start!important;
          }
          #dsV4VoiceMenu::before{
            content:'30 種聲音';
            display:block;
            padding:4px 10px 7px;
            color:#777;
            font-size:11px;
            font-weight:600;
            border-bottom:1px solid #eee;
            margin-bottom:3px;
          }
          #dsV4VoiceMenu{
            max-height:min(70vh,520px);
            overflow-y:auto;
          }
          #aivaultDrawerVoice,[data-drawer-voice],[data-aivault-action="voice"]{display:none!important;}
          #aivaultVoicePanel{display:none!important;}
          #dsV4VoiceBtn{min-width:92px;}
          </style>
          <script id="aivaultDarkStarVoiceFixV3">
          (()=>{
            function syncSend(){
              const input=document.getElementById('composerInput')||document.querySelector('.composer-input');
              const send=document.getElementById('composerSend')||document.querySelector('.composer-send');
              if(!input||!send)return;
              const has=String(input.value||'').trim().length>0;
              const live=send.classList.contains('aivault-live-button')||send.classList.contains('ds-live-button');
              send.classList.toggle('ds-text-ready',has&&!live);
              if(has&&!live)send.style.opacity='1';
            }
            function apply(){
              syncSend();
              const input=document.getElementById('composerInput')||document.querySelector('.composer-input');
              const send=document.getElementById('composerSend')||document.querySelector('.composer-send');
              if(input&&!input.dataset.dsVoiceFixV3){
                input.dataset.dsVoiceFixV3='1';
                input.addEventListener('input',syncSend,true);
                input.addEventListener('keyup',syncSend,true);
              }
              if(send&&!send.dataset.dsVoiceFixV3){
                send.dataset.dsVoiceFixV3='1';
                new MutationObserver(syncSend).observe(send,{attributes:true,attributeFilter:['class','disabled','style']});
              }
              const voice=document.getElementById('dsV4VoiceBtn');
              if(voice){voice.setAttribute('aria-label','人物聲音');voice.title='人物聲音';}
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply,{once:true});else apply();
            new MutationObserver(apply).observe(document.documentElement,{childList:true,subtree:true});
          })();
          </script>
          </body>
          </html>
          '''
          html = html.replace('</body>\n</html>\n', fix)
          html_path.write_text(html, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name 'AIVAULT Voice Fix'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add technical-dark-star.html
          git diff --cached --quiet && exit 0
          git commit -m 'Keep 30 voice descriptions and blue text send button'
          git push