name: Dark Star Live Voice V6
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize additive block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('technical-dark-star.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace(r'\\n','\n')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Correct live audio payload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('technical-dark-star.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('realtimeInput:{mediaChunks:[{mimeType:\'audio/pcm;rate=16000\',data:b64}]}','realtimeInput:{audio:{mimeType:\'audio/pcm;rate=16000\',data:b64}}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "aivault-additive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add technical-dark-star.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix: normalize and correct Dark Star live voice transport"
          git push