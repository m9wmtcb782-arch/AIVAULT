name: Deploy dark-star-reading-report
on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/functions/dark-star-reading-report/**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy reading report function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy dark-star-reading-report --project-ref clcddygkaaqqtsbswgdf --no-verify-jwt
