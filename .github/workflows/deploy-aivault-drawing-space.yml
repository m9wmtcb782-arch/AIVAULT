name: Deploy AIVAULT Drawing Space
on:
  workflow_dispatch:
    inputs:
      space_id:
        description: 'Existing Hugging Face Space (owner/name)'
        required: true
        type: string
      source_ref:
        description: 'Approved source ref containing online-space'
        required: true
        default: 'feature/comic-studio-v01'
        type: string
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check access token and input
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: ${{ inputs.space_id }}
        run: |
          test -n "$HF_TOKEN" || { echo "::error::Set repository secret HF_TOKEN"; exit 1; }
          [[ "$SPACE_ID" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::Invalid Space ID"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Verify files
        run: |
          test -f comic-studio/online-space/app.py
          test -f comic-studio/online-space/README.md
          test -f comic-studio/online-space/requirements.txt
          python -m py_compile comic-studio/online-space/app.py
      - name: Install uploader
        run: python -m pip install 'huggingface_hub>=0.30,<1'
      - name: Upload to existing Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: ${{ inputs.space_id }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["SPACE_ID"]
          info = api.repo_info(repo_id=space, repo_type="space")
          if not info:
              raise RuntimeError("Space does not exist")
          api.upload_folder(
              repo_id=space,
              repo_type="space",
              folder_path="comic-studio/online-space",
              ignore_patterns=["DEPLOY.md", "__pycache__/**", "*.pyc"],
              commit_message="Deploy AIVAULT AI drawing engine",
          )
          print("Uploaded to existing Space:", space)
          PY
