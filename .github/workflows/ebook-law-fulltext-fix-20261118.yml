name: Ebook law attachments full text fix (2026-11-18, one-off)
on:
  push:
    branches: [data/law-attachments-fulltext-20261118]
    paths:
      - "ebook/law-fulltext-20261118/**"
      - ".github/scripts/law_fulltext_fix_20261118.py"
      - ".github/workflows/ebook-law-fulltext-fix-20261118.yml"
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backup then apply
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 .github/scripts/law_fulltext_fix_20261118.py
      - name: Upload backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: law-fulltext-backup-20261118
          path: backup/
          retention-days: 90
