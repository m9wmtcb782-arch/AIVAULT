name: TinyFish offline safety tests
on:
  push:
    branches:
      - feat/free-token-resource-pool
    paths:
      - 'supabase/functions/_shared/tinyfish_*.ts'
      - 'supabase/functions/_shared/openrouter_free_inference*.ts'
      - 'supabase/functions/_shared/aivault_model_admission*.ts'
      - 'supabase/functions/_shared/aivault_external_egress*.ts'
      - 'supabase/functions/_shared/aivault_public_task_allowlist.ts'
      - 'supabase/functions/free-discovery-search/**'
      - 'supabase/functions/_shared/free_discovery_worker*.ts'
      - 'supabase/functions/_shared/tinyfish_node_test_runner.mjs'
      - '.github/workflows/tinyfish-offline-tests.yml'
      - 'scripts/tinyfish_resource_safety_node_tests.mjs'
      - 'scripts/tinyfish_manual_runner.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck TinyFish entrypoint and trusted runner
        run: deno check --no-remote supabase/functions/free-discovery-search/index.ts supabase/functions/_shared/tinyfish_trusted_runner.ts supabase/functions/_shared/tinyfish_queue_executor.ts scripts/tinyfish_manual_runner.ts supabase/functions/_shared/tinyfish_resource_triage_test.ts supabase/functions/_shared/tinyfish_resource_evidence_test.ts supabase/functions/_shared/tinyfish_official_evidence_test.ts supabase/functions/_shared/openrouter_free_inference_test.ts supabase/functions/_shared/aivault_model_admission_test.ts supabase/functions/_shared/aivault_external_egress_test.ts supabase/functions/_shared/aivault_public_task_allowlist_test.ts
      - name: Run mocked tests without API credentials
        run: deno test --no-remote supabase/functions/_shared/tinyfish_search_adapter_test.ts supabase/functions/_shared/free_discovery_worker_test.ts supabase/functions/_shared/tinyfish_trusted_runner_test.ts supabase/functions/_shared/tinyfish_queue_executor_test.ts supabase/functions/_shared/tinyfish_resource_triage_test.ts supabase/functions/_shared/tinyfish_resource_evidence_test.ts supabase/functions/_shared/tinyfish_official_evidence_test.ts supabase/functions/_shared/openrouter_free_inference_test.ts supabase/functions/_shared/aivault_model_admission_test.ts supabase/functions/_shared/aivault_external_egress_test.ts supabase/functions/_shared/aivault_public_task_allowlist_test.ts

  node-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run mocked tests with Node (no credentials)
        run: |
          node --experimental-strip-types supabase/functions/_shared/tinyfish_node_test_runner.mjs
          node --experimental-strip-types scripts/tinyfish_resource_safety_node_tests.mjs
