name: TinyFish offline safety tests
on:
  push:
    branches:
      - feat/free-token-resource-pool
    paths:
      - 'supabase/functions/_shared/tinyfish_*.ts'
      - 'supabase/functions/_shared/free_discovery_worker*.ts'
      - 'supabase/functions/_shared/tinyfish_node_test_runner.mjs'
      - '.github/workflows/tinyfish-offline-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run mocked tests without API credentials
        run: deno test --no-remote supabase/functions/_shared/tinyfish_search_adapter_test.ts supabase/functions/_shared/free_discovery_worker_test.ts

  node-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run mocked tests with Node (no credentials)
        run: node --experimental-strip-types supabase/functions/_shared/tinyfish_node_test_runner.mjs
