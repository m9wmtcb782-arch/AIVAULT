name: AIVAULT one-time Dark Star fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject additive voice module
        shell: python
        run: |
          from pathlib import Path
          p = Path('technical-dark-star.html')
          text = p.read_text(encoding='utf-8')
          marker = 'technical-dark-star-voice-fix.js'
          if marker not in text:
              needle = '</body>'
              if needle not in text:
                  raise SystemExit('technical-dark-star.html has no </body> marker')
              text = text.replace(needle, '<script src="technical-dark-star-voice-fix.js"></script>\n\n</body>', 1)
              p.write_text(text, encoding='utf-8')
          else:
              print('Voice module already injected; leaving HTML unchanged.')

      - name: Remove one-time workflow
        run: rm -f .github/workflows/aivault-one-time-dark-star-fix.yml

      - name: Commit corrected page
        run: |
          git config user.name "AIVAULT Fix Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add technical-dark-star.html technical-dark-star-voice-fix.js .github/workflows/aivault-one-time-dark-star-fix.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix Technical Dark Star live voice without changing baseline"
          git push
