name: Fix Dark Star menu JS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-dark-star-menu-js.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add direct top-left menu handler
        shell: python
        run: |
          from pathlib import Path
          p=Path('technical-dark-star-voice-fix.js')
          s=p.read_text(encoding='utf-8')
          marker='AIVAULT_DARK_STAR_MENU_DIRECT_20260914'
          if marker not in s:
              old="function boot(){try{addStyle();addUI();forceHeader()}catch(e){console.error('[DarkStar voice] boot',e)}}"
              new="""function bindDarkStarMenu(){
const b=document.getElementById('menuButton');
const d=document.getElementById('drawer');
const x=document.getElementById('drawerBackdrop');
if(!b||!d||!x||b.dataset.dsMenuBound==='1')return;
/* AIVAULT_DARK_STAR_MENU_DIRECT_20260914 */
b.dataset.dsMenuBound='1';
b.style.position='relative';b.style.zIndex='30000';b.style.pointerEvents='auto';b.style.touchAction='manipulation';
b.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();d.classList.add('show');x.classList.add('show');},true);
}
function boot(){try{addStyle();addUI();forceHeader();bindDarkStarMenu()}catch(e){console.error('[DarkStar voice] boot',e)}}"""
              if old not in s: raise SystemExit('boot target not found')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/fix-dark-star-menu-js.yml
          git config user.name 'AIVAULT Fix Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add technical-dark-star-voice-fix.js .github/workflows/fix-dark-star-menu-js.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Technical Dark Star top-left menu button click'
          git push
