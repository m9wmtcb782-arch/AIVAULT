name: Cache Dark Star Avatar

on:
  push:
    paths:
      - '.github/workflows/cache-dark-star-avatar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-avatar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download avatar into AIVAULT
        run: |
          mkdir -p assets/dark-star
          curl -L --fail --retry 4 --retry-delay 3 \
            'https://cdn.jsdelivr.net/gh/c-frame/valid-avatars-glb@c539a28/avatars/Asian/Asian_F_2_Casual.glb' \
            -o assets/dark-star/technical-dark-star-avatar.glb
          file assets/dark-star/technical-dark-star-avatar.glb
          ls -lh assets/dark-star/technical-dark-star-avatar.glb

      - name: Commit cached avatar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/dark-star/technical-dark-star-avatar.glb
          git diff --cached --quiet && exit 0
          git commit -m 'Cache Dark Star avatar model [skip ci]'
          git push
