name: Install Dark Star diagnostic strip
on:
  push:
    branches: [main]
    paths:
      - 'technical-dark-star-strip-diagnostic.js'
      - 'tools/install_strip_diagnostic.py'
      - '.github/workflows/install-strip-diagnostic.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert script tag
        run: python3 tools/install_strip_diagnostic.py
      - name: Commit HTML
        run: |
          git config user.name 'aivault-installer'
          git config user.email '41898282+aivault-installer@users.noreply.github.com'
          git add technical-dark-star.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Stop runtime diagnostic HTML from filling Dark Star composer'
          git push
