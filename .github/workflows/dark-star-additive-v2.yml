name: Dark Star Additive V2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply additive UI module
        env:
          TARGET: technical-dark-star.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("technical-dark-star.html")
          s = p.read_text(encoding="utf-8")
          marker = "AIVAULT_DARK_STAR_ADDITIVE_VOICE_UI_V2"
          if marker in s:
              print("V2 already installed")
              raise SystemExit(0)

          css = r'''\n/* AIVAULT_DARK_STAR_ADDITIVE_VOICE_UI_V2 */\n.aivault-top-actions{margin-left:auto;display:flex;align-items:center;gap:2px}\n.aivault-top-action{width:38px;height:38px;border:0;background:transparent;color:#303030;border-radius:10px;display:flex;align-items:center;justify-content:center}\n.aivault-top-action:hover{background:#f3f3f3}\n.aivault-top-action svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}\n.aivault-more-menu{position:fixed;right:14px;top:54px;width:245px;padding:7px;background:#fff;border:1px solid #e5e5e5;border-radius:14px;box-shadow:0 10px 34px rgba(0,0,0,.13);display:none;z-index:200}\n.aivault-more-menu.show{display:block}\n.aivault-menu-item{width:100%;border:0;background:transparent;color:#222;border-radius:9px;padding:10px 11px;display:flex;align-items:center;gap:11px;text-align:left;font-size:13px}\n.aivault-menu-item:hover{background:#f3f3f3}\n.aivault-menu-item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}\n.aivault-menu-item.danger{color:#dc2626}\n.aivault-live-button{background:#0a84ff!important;color:#fff!important;opacity:1!important;cursor:pointer!important}\n.aivault-live-button:hover{background:#0879eb!important}\n.aivault-wave{width:18px;height:18px;display:flex;align-items:center;justify-content:center;gap:2px}\n.aivault-wave i{display:block;width:2px;background:#fff;border-radius:2px;animation:aivaultWave 1s ease-in-out infinite;animation-play-state:paused}\n.aivault-wave i:nth-child(1){height:7px}.aivault-wave i:nth-child(2){height:14px;animation-delay:.12s}.aivault-wave i:nth-child(3){height:11px;animation-delay:.24s}.aivault-wave i:nth-child(4){height:6px;animation-delay:.36s}\n.aivault-live-button.active .aivault-wave i{animation-play-state:running}\n@keyframes aivaultWave{0%,100%{transform:scaleY(.65)}50%{transform:scaleY(1.12)}}\n.aivault-stop-icon{width:12px;height:12px;border-radius:3px;background:#fff}\n.aivault-voice-panel{position:fixed;right:14px;top:102px;width:260px;padding:14px;background:#fff;border:1px solid #e5e5e5;border-radius:15px;box-shadow:0 10px 34px rgba(0,0,0,.13);display:none;z-index:190}\n.aivault-voice-panel.show{display:block}\n.aivault-voice-title{font-size:13px;font-weight:600;margin-bottom:11px}\n.aivault-voice-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}\n.aivault-voice-choice{border:1px solid #e4e4e4;background:#fff;color:#333;border-radius:9px;padding:9px 8px;font-size:12px}\n.aivault-voice-choice.active{border-color:#0a84ff;background:#f1f7ff;color:#0a84ff}\n.aivault-voice-state{margin-top:10px;font-size:11px;color:#888;line-height:1.5}\n'''

          body = r'''\n<!-- AIVAULT_DARK_STAR_ADDITIVE_VOICE_UI_V2 -->\n<div id="aivaultMoreMenu" class="aivault-more-menu" aria-hidden="true">\n<button class="aivault-menu-item" data-aivault-action="voice"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v3M8 21h8"/></svg><span>加入即時語音</span></button>\n<button class="aivault-menu-item" data-aivault-action="share"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.9 7.6-4.7M8.2 13.1l7.6 4.7"/></svg><span>分享</span></button>\n<button class="aivault-menu-item" data-aivault-action="pin"><svg viewBox="0 0 24 24"><path d="m15 4 5 5-3 3 1 5-2 2-4-4-4 4-2-2 4-4-4-4 2-2 5 1 3-3Z"/></svg><span>釘選</span></button>\n<button class="aivault-menu-item" data-aivault-action="project"><svg viewBox="0 0 24 24"><path d="M4 7h6l2 2h8v10H4zM12 13v6M9 16h6"/></svg><span>新增至專案</span></button>\n<button class="aivault-menu-item" data-aivault-action="files"><svg viewBox="0 0 24 24"><path d="M5 4h9l5 5v11H5zM14 4v6h6M8 14h8M8 17h6"/></svg><span>已上傳的檔案</span></button>\n<button class="aivault-menu-item" data-aivault-action="search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span>在對話中搜尋</span></button>\n<button class="aivault-menu-item" data-aivault-action="archive"><svg viewBox="0 0 24 24"><path d="M4 7h16l-1 13H5L4 7ZM3 4h18v3H3zM9 11h6"/></svg><span>封存</span></button>\n<button class="aivault-menu-item danger" data-aivault-action="delete"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 11v6M14 11v6M8 7l1-3h6l1 3M7 7l1 14h8l1-14"/></svg><span>刪除</span></button>\n</div>\n<div id="aivaultVoicePanel" class="aivault-voice-panel" aria-hidden="true">\n<div class="aivault-voice-title">即時語音</div>\n<div class="aivault-voice-grid">\n<button class="aivault-voice-choice active" data-voice="Kore">女聲</button>\n<button class="aivault-voice-choice" data-voice="Puck">男聲</button>\n<button class="aivault-voice-choice" data-voice="Charon">成熟聲</button>\n<button class="aivault-voice-choice" data-voice="Leda">年輕聲</button>\n</div>\n<div id="aivaultVoiceState" class="aivault-voice-state">準備就緒</div>\n</div>\n'''

          script = r'''\n<script>\n/* AIVAULT_DARK_STAR_ADDITIVE_VOICE_UI_V2 */\n(()=>{\nconst T="https://clcddygkaaqqtsbswgdf.supabase.co/functions/v1/technical-dark-star-voice-session";\nconst input=document.querySelector(".composer-input"),send=document.querySelector(".composer-send"),top=document.querySelector(".topbar");\nif(!input||!send||!top)return;\nconst a=document.createElement("div");a.className="aivault-top-actions";a.innerHTML=`<button id="aivaultNewTopic" class="aivault-top-action" aria-label="開新話題"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button id="aivaultMore" class="aivault-top-action" aria-label="更多"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>`;\nconst home=top.querySelector(".brand-home");home?home.before(a):top.appendChild(a);\nconst menu=document.getElementById("aivaultMoreMenu"),panel=document.getElementById("aivaultVoicePanel"),state=document.getElementById("aivaultVoiceState");\nconst voice={on:false,ws:null,stream:null,ctx:null,source:null,processor:null,play:null,session:null,seq:0,profile:localStorage.getItem("aivault_voice_profile")||"Kore",q:[],playing:false};\nfunction wave(){send.innerHTML='<span class="aivault-wave"><i></i><i></i><i></i><i></i></span>';send.classList.add("aivault-live-button");send.classList.remove("active");send.disabled=false}\nfunction stopIcon(){send.innerHTML='<span class="aivault-stop-icon"></span>';send.classList.add("aivault-live-button","active");send.disabled=false}\nfunction refresh(){if(voice.on)return stopIcon();if(input.value.trim()) {send.classList.remove("aivault-live-button","active");send.disabled=false}else wave()}\nfunction st(x){if(state)state.textContent=x}\nfunction b64(x){let u=new Uint8Array(x.buffer,x.byteOffset,x.byteLength),s="";for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(s)}\nfunction u8(s){let b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}\nasync function save(role,text){if(!voice.session||!text)return;await fetch(T,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"turn",session_id:voice.session,sequence_no:++voice.seq,role,content:text})}).catch(()=>{})}\nasync function start(){if(voice.on)return;try{st("連線中…");voice.ctx=new(window.AudioContext||window.webkitAudioContext)();await voice.ctx.resume();const sr=await fetch(T,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"start",voice_profile:voice.profile})});const sj=await sr.json();voice.session=sj.session_id;const tr=await fetch(T,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({voice_name:voice.profile})});const tj=await tr.json();voice.stream=await navigator.mediaDevices.getUserMedia({audio:true});const url=tj.websocket_url||tj.url||("wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained?access_token="+encodeURIComponent(tj.token));voice.ws=new WebSocket(url);\nvoice.ws.onopen=()=>{voice.on=true;stopIcon();st("正在聆聽…");voice.ws.send(JSON.stringify({setup:{model:tj.model||"models/gemini-3.1-flash-live-preview",generationConfig:{responseModalities:["AUDIO"],thinkingConfig:{thinkingLevel:"minimal"}},inputAudioTranscription:{},outputAudioTranscription:{},speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voice.profile}}}}}));const ac=new(window.AudioContext||window.webkitAudioContext)();voice.source=ac.createMediaStreamSource(voice.stream);voice.processor=ac.createScriptProcessor(4096,1,1);voice.source.connect(voice.processor);voice.processor.connect(ac.destination);voice.processor.onaudioprocess=e=>{if(!voice.on||voice.ws.readyState!==1)return;const f=e.inputBuffer.getChannelData(0),ratio=e.inputBuffer.sampleRate/16000,n=Math.floor(f.length/ratio),o=new Int16Array(n);for(let i=0;i<n;i++){const v=Math.max(-1,Math.min(1,f[Math.floor(i*ratio)]));o[i]=v<0?v*32768:v*32767}voice.ws.send(JSON.stringify({realtimeInput:{mediaChunks:[{mimeType:"audio/pcm;rate=16000",data:b64(o)}]}}))}};\nvoice.ws.onmessage=async e=>{let m;try{m=JSON.parse(e.data)}catch{return};const c=m.serverContent||m;const ot=c.outputTranscription?.text||c.outputAudioTranscription?.text;if(ot)await save("assistant",ot);const it=c.inputTranscription?.text||c.inputAudioTranscription?.text;if(it)await save("user",it);if(c.interrupted){voice.q=[]}const parts=c.modelTurn?.parts||[];for(const p of parts)if(p.inlineData?.data){const u=u8(p.inlineData.data),pcm=new Int16Array(u.buffer),f=new Float32Array(pcm.length);for(let i=0;i<pcm.length;i++)f[i]=pcm[i]/32768;const ac=voice.play||(voice.play=new(window.AudioContext||window.webkitAudioContext)());const ab=ac.createBuffer(1,f.length,24000);ab.copyToChannel(f,0);const src=ac.createBufferSource();src.buffer=ab;src.connect(ac.destination);src.start()}};voice.ws.onerror=()=>st("語音連線錯誤");voice.ws.onclose=()=>stop(false)}catch(e){console.error(e);st("語音啟動失敗");stop(false)}}\nasync function stop(end=true){voice.on=false;try{voice.processor?.disconnect();voice.source?.disconnect()}catch{}voice.stream?.getTracks().forEach(x=>x.stop());try{voice.ws?.close()}catch{}try{voice.ctx?.close()}catch{}if(end&&voice.session)fetch(T,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"end",session_id:voice.session})}).catch(()=>{});voice.session=null;voice.seq=0;refresh();st("準備就緒")}\nsend.addEventListener("click",e=>{if(!voice.on&&!input.value.trim()){e.preventDefault();start();return}if(voice.on){e.preventDefault();stop();return}} ,true);\ninput.addEventListener("input",refresh);\nrefresh();\ndocument.getElementById("aivaultMore")?.addEventListener("click",e=>{e.stopPropagation();menu.classList.toggle("show");panel.classList.remove("show")});\ndocument.querySelector('[data-aivault-action="voice"]')?.addEventListener("click",()=>{menu.classList.remove("show");panel.classList.add("show")});\ndocument.querySelectorAll(".aivault-voice-choice").forEach(b=>b.addEventListener("click",()=>{voice.profile=b.dataset.voice;localStorage.setItem("aivault_voice_profile",voice.profile);document.querySelectorAll(".aivault-voice-choice").forEach(x=>x.classList.toggle("active",x===b));st("語音："+b.textContent)}));\ndocument.getElementById("aivaultNewTopic")?.addEventListener("click",()=>document.getElementById("newChatButton")?.click());\ndocument.querySelector('[data-aivault-action="share"]')?.addEventListener("click",async()=>{try{await navigator.share({title:"Technical Dark Star",text:document.title,url:location.href})}catch{}});\ndocument.querySelector('[data-aivault-action="search"]')?.addEventListener("click",()=>{const q=prompt("搜尋目前對話");if(q){const el=[...document.querySelectorAll(".message-text")].find(x=>x.textContent.includes(q));el?.scrollIntoView({behavior:"smooth",block:"center"})}});\ndocument.querySelector('[data-aivault-action="files"]')?.addEventListener("click",()=>document.querySelector(".attachment-preview")?.scrollIntoView({behavior:"smooth",block:"center"}));\ndocument.querySelector('[data-aivault-action="delete"]')?.addEventListener("click",()=>document.getElementById("clearMessagesButton")?.click());\ndocument.addEventListener("click",e=>{if(!e.target.closest("#aivaultMore")&&!e.target.closest("#aivaultMoreMenu"))menu.classList.remove("show")});\n})();\n</script>\n'''

          if "</style>" not in s or "</body>" not in s:
              raise SystemExit("unsafe target: required HTML markers missing")
          s = s.replace("</style>", css + "</style>", 1)
          s = s.replace("</body>", body + script + "</body>", 1)
          p.write_text(s, encoding="utf-8")
          print("Additive V2 installed")
          PY

      - name: Commit additive result
        run: |
          git config user.name "aivault-additive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add technical-dark-star.html
          git diff --cached --quiet && exit 0
          git commit -m "Additive: Dark Star voice UI V2"
          git push