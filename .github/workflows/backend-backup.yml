name: Backend backup (encrypted)
on:
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.48.3
      - name: Export (service key fetched in-job, never printed)
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 .github/scripts/backend_backup.py
      - name: Encrypt with owner's backup public key (artifact is unreadable without the private key)
        run: |
          tar czf backup.tgz backup
          gpg --batch --import .github/backup-pubkey.asc
          gpg --batch --yes --trust-model always -r backup@local -o backup.tgz.gpg -e backup.tgz
          rm -rf backup backup.tgz
          ls -la backup.tgz.gpg
      - uses: actions/upload-artifact@v4
        with:
          name: backend-backup-encrypted
          path: backup.tgz.gpg
          retention-days: 1
