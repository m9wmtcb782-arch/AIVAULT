name: Set DARKSTAR_POOL_KEY function secret
on:
  workflow_dispatch:
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Set secret (value from repo secret; never echoed)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          K: ${{ secrets.DARKSTAR_POOL_KEY }}
        run: |
          test -n "$K"
          supabase secrets set DARKSTAR_POOL_KEY="$K" --project-ref clcddygkaaqqtsbswgdf >/dev/null
          supabase secrets list --project-ref clcddygkaaqqtsbswgdf | grep -c DARKSTAR_POOL_KEY
