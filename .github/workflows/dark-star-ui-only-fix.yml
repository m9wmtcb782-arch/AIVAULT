name: Dark Star UI Only Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dark-star-ui-only-fix
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply UI-only changes
        shell: python
        run: |
          from pathlib import Path

          html_path = Path('technical-dark-star.html')
          js_path = Path('technical-dark-star-voice-fix.js')

          html = html_path.read_text(encoding='utf-8')
          js = js_path.read_text(encoding='utf-8')

          # 1) Only change the existing work-center control into a previous-page arrow.
          old_html = '''<a id="homeButton"
    class="brand-home"
    href="aivault-home.html">
    回工作中心
  </a>'''
          new_html = '''<a id="homeButton"
    class="brand-home"
    href="#"
    aria-label="回上一頁"
    title="回上一頁"
    onclick="history.back(); return false;">
    ←
  </a>'''
          if old_html not in html:
              raise SystemExit('Expected Dark Star back button markup was not found; refusing to modify core.')
          html = html.replace(old_html, new_html, 1)

          # 2) Header layout only: reserve the brand area so dynamically-added
          #    voice/language controls cannot cover the Dark Star logo/title.
          old_brand = '''.brand{
  margin-left:7px;
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}'''
          new_brand = '''.brand{
  margin-left:7px;
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
  flex:1 1 auto;
}'''
          if old_brand not in html:
              raise SystemExit('Expected Dark Star brand CSS was not found; refusing to modify core.')
          html = html.replace(old_brand, new_brand, 1)

          html_path.write_text(html, encoding='utf-8')

          # 3) Only adjust the existing dynamically-created voice/language tool row.
          #    It stays beside 教學助理; it no longer participates in shrinking the logo/title area.
          old_tools = '.ds-fix-tools{display:flex;align-items:center;gap:6px;margin-left:10px;position:relative;z-index:80}'
          new_tools = '.ds-fix-tools{display:flex;align-items:center;gap:6px;margin-left:10px;position:relative;z-index:80;flex-shrink:0}'
          if old_tools not in js:
              raise SystemExit('Expected Dark Star voice/language UI CSS was not found; refusing to modify voice logic.')
          js = js.replace(old_tools, new_tools, 1)
          js_path.write_text(js, encoding='utf-8')

      - name: Validate UI-only changes
        shell: python
        run: |
          from pathlib import Path
          h = Path('technical-dark-star.html').read_text(encoding='utf-8')
          j = Path('technical-dark-star-voice-fix.js').read_text(encoding='utf-8')
          checks = [
              'onclick="history.back(); return false;"' in h,
              '>\n    ←\n  </a>' in h,
              'flex:1 1 auto;' in h,
              '.ds-fix-tools{display:flex;align-items:center;gap:6px;margin-left:10px;position:relative;z-index:80;flex-shrink:0}' in j,
              'function sendMessage()' in h,
              'const AI_GATEWAY_URL' in h,
              'function callAIVAULT(' in h,
          ]
          if not all(checks):
              raise SystemExit('Dark Star UI-only validation failed')
          print('DARK STAR UI-ONLY CHANGE VALIDATED')

      - name: Commit UI-only changes
        shell: bash
        run: |
          git config user.name 'aivault-additive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add technical-dark-star.html technical-dark-star-voice-fix.js
          git diff --cached --quiet && exit 0
          git commit -m 'Adjust Dark Star header controls only'
          git push
