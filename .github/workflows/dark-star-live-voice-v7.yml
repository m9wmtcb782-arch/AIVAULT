name: Dark Star Live Voice V7
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair literal escaped newlines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('technical-dark-star.html')
          s=p.read_text(encoding='utf-8')
          marker='AIVAULT_DARK_STAR_ADDITIVE_VOICE_UI_V2'
          if marker in s:
              a=s.index(marker)
              head=s[:a]
              tail=s[a:]
              tail=tail.replace('\\n','\n')
              s=head+tail
          s=s.replace('\\n/* AIVAULT_DARK_STAR_ADDITIVE_VOICE_UI_V2 */','\n/* AIVAULT_DARK_STAR_ADDITIVE_VOICE_UI_V2 */')
          s=s.replace('\\n<!-- AIVAULT_DARK_STAR_ADDITIVE_VOICE_UI_V2 -->','\n<!-- AIVAULT_DARK_STAR_ADDITIVE_VOICE_UI_V2 -->')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify HTML syntax markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('technical-dark-star.html').read_text(encoding='utf-8')
          if '\\n/* AIVAULT_DARK_STAR_ADDITIVE_VOICE_UI_V2 */' in s:
              raise SystemExit('literal escaped newline remains before additive CSS')
          if 'AIVAULT_DARK_STAR_ADDITIVE_VOICE_UI_V2' not in s:
              raise SystemExit('additive marker missing')
          print('additive marker OK')
          PY
      - name: Commit repaired HTML
        run: |
          git config user.name "aivault-additive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add technical-dark-star.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix: repair Dark Star additive voice markup"
          git push
