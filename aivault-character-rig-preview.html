<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT 真實骨架人物驗證</title><style>body{margin:0;background:#17273c;color:#fff;font-family:system-ui;overflow:hidden}#info{position:fixed;top:12px;left:12px;right:12px;background:#142b48e8;border:1px solid #83a9c9;border-radius:14px;padding:12px;font-size:13px;max-width:380px}b{font-size:17px}#state{margin-top:7px;color:#bde9ff}#controls{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:9px}button{border:1px solid #9bc5e8;border-radius:12px;padding:12px;background:#1e466a;color:white}#credit{font-size:11px;opacity:.8;margin-top:6px}</style></head><body><div id="info"><b>AIVAULT｜真實 3D 人物驗證</b><div>這是模型載入測試，不是冰雪城市完成品。</div><div id="state">正在載入真正的 GLB 骨架人物…</div><div id="credit">模型來源：Quaternius CC0，經第三方打包；未包含冬裝與走路動畫。</div></div><div id="controls"><button id="turn">⟳ 自動旋轉</button><button id="zoom">＋ 放大</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';
const state=document.getElementById('state');let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(e){state.textContent='此裝置無法啟用 WebGL：'+e.message;throw e}
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x263f5d);const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);camera.position.set(0,2.3,5.5);camera.lookAt(0,1.1,0);scene.add(new THREE.HemisphereLight(0xffffff,0x51627b,2.2));const light=new THREE.DirectionalLight(0xffdfbc,3);light.position.set(-4,7,6);scene.add(light);const ground=new THREE.Mesh(new THREE.CylinderGeometry(2.1,2.3,.22,64),new THREE.MeshStandardMaterial({color:0x7d9fba,roughness:.8}));ground.position.y=-.12;scene.add(ground);let model=null,rot=true;const url='https://raw.githubusercontent.com/programasweights/avatar/main/public/assets/character.glb';new GLTFLoader().load(url,g=>{model=g.scene;scene.add(model);const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3());if(size.y>0){model.scale.multiplyScalar(2.8/size.y);const b=new THREE.Box3().setFromObject(model);model.position.y-=b.min.y;const center=b.getCenter(new THREE.Vector3());model.position.x-=center.x;model.position.z-=center.z}state.textContent='已載入真正的 3D 人物。手指拖曳可旋轉；尚未有走路動畫。'},undefined,e=>{state.textContent='模型載入失敗：外部檔案服務無法連線。此版本沒有假人物替代。';console.error(e)});
let down=false,px=0;renderer.domElement.addEventListener('pointerdown',e=>{down=true;px=e.clientX});addEventListener('pointerup',()=>down=false);addEventListener('pointermove',e=>{if(down&&model){model.rotation.y+=(e.clientX-px)*.01;px=e.clientX}});document.getElementById('turn').onclick=e=>{rot=!rot;e.target.textContent=rot?'⟳ 自動旋轉':'▶ 啟用旋轉'};document.getElementById('zoom').onclick=()=>{camera.position.multiplyScalar(.8);camera.position.z=Math.max(2.2,camera.position.z);camera.lookAt(0,1.1,0)};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function draw(){requestAnimationFrame(draw);if(rot&&model)model.rotation.y+=.005;renderer.render(scene,camera)}draw();</script></body></html>
