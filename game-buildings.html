<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>建築</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body class="game-body">
  <div class="snow-layer"></div>
  <div class="app" id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/boot.js"></script>
  <script>
    async function render() {
      if (!(await FKAuth.requirePlayer())) return;
      const snap = await FKApi.snapshot();
      const rows = snap.buildings.map((b) => {
        const def = FKEngine.BUILDINGS.find((x) => x.type === b.building_type);
        const cost = FKEngine.costScale(def.base, b.level);
        const busy = b.upgrade_finish_at && b.upgrade_finish_at > Date.now();
        return `<div class="list-item">
          <div><b>${def.name}</b><div class="tiny">Lv.${b.level} · 木${cost.wood} 石${cost.stone} 鐵${cost.iron} 糧${cost.food}</div>
          ${busy ? `<div class="timer">升級中 ${FKUI.remain(b.upgrade_finish_at)}</div>` : ""}</div>
          <button class="btn small" ${busy ? "disabled" : ""} onclick="up('${b.id}')">升級</button>
        </div>`;
      }).join("");
      document.getElementById("app").innerHTML = `
        <div class="page-head"><a class="back" href="game-city.html">← 返回</a><h2>建築</h2></div>
        ${FKUI.top(snap)}
        <div class="panel">${rows}
          <button class="btn secondary" onclick="spd()">Coupons 加速（5）</button>
          <div class="msg" id="msg"></div>
        </div>
        ${FKUI.nav("city")}
      `;
    }
    async function up(id) {
      try { await FKApi.upgrade(id); await render(); }
      catch (e) { const m = document.getElementById("msg"); if (m) m.textContent = e.message; else alert(e.message); }
    }
    async function spd() {
      try { await FKApi.speedup("building"); await render(); }
      catch (e) { alert(e.message); }
    }
    render();
    setInterval(render, 1000);
  </script>
</body>
</html>
