<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>建築</title>
  <link rel="stylesheet" href="css/game.css" />
  <style>
    body { margin:0; background:#071018; color:#e8f4ff; font-family:sans-serif; }
    .panel { margin:16px; padding:16px; border:1px solid #3a5a70; border-radius:16px; background:#0c1c2c; }
    .row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #234; }
    .btn { display:block; width:100%; margin:8px 0; padding:14px; border:0; border-radius:14px; font-weight:700; background:#8fd4ff; color:#081018; text-align:center; text-decoration:none; }
    .tiny { color:#8aa3b8; font-size:12px; }
    button.s { padding:8px 12px; border:0; border-radius:10px; background:#8fd4ff; font-weight:700; }
  </style>
</head>
<body class="game-body">
  <div class="panel">
    <h2>建築</h2>
    <p class="tiny">js 上線後升級會扣資源。現在先能看見列表。</p>
    <div class="row"><span>熔爐 Lv.2</span><button class="s" type="button">升級</button></div>
    <div class="row"><span>伐木場 Lv.1</span><button class="s" type="button">升級</button></div>
    <div class="row"><span>農場 Lv.1</span><button class="s" type="button">升級</button></div>
    <div class="row"><span>採石場 Lv.1</span><button class="s" type="button">升級</button></div>
    <div class="row"><span>煉鐵廠 Lv.1</span><button class="s" type="button">升級</button></div>
    <div class="row"><span>軍營 Lv.1</span><button class="s" type="button">升級</button></div>
    <div class="row"><span>醫院 Lv.1</span><button class="s" type="button">升級</button></div>
    <div class="row"><span>科技中心 Lv.1</span><button class="s" type="button">升級</button></div>
    <a class="btn" href="game-city.html">回主城</a>
  </div>
</body>
</html>
