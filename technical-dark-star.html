<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Technical Dark Star</title>
</head>
<body>
<script>
(async function rescueDarkStar() {
  const SRC = "https://cdn.jsdelivr.net/gh/m9wmtcb782-arch/AIVAULT@d4c36bc46351ab27ef01d19762bfe26c72a4326a/technical-dark-star.html";
  try {
    const html = await fetch(SRC, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("rescue source " + r.status);
      return r.text();
    });
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    document.body.innerHTML = "<p style='font-family:sans-serif;padding:24px'>暗星救援載入失敗：" + String(err && err.message || err) + "</p>";
    return;
  }

  function applyRescue() {
    if (!document.querySelector(".brand-mark")) return false;
    if (document.getElementById("darkStarRescueStyle")) return true;
    const style = document.createElement("style");
    style.id = "darkStarRescueStyle";
    style.textContent = [
      "@keyframes aivaultLogoColorShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}",
      ".brand-mark{background:linear-gradient(135deg,#ff3b30,#ff9500,#ffcc00,#34c759,#0a84ff,#5856d6,#af52de,#ff2d55)!important;background-size:300% 300%!important;animation:aivaultLogoColorShift 6s ease-in-out infinite!important;color:#fff!important;box-shadow:0 0 10px rgba(88,86,214,.45),0 0 18px rgba(255,45,85,.28)!important;}"
    ].join("");
    document.head.appendChild(style);

    if (!document.querySelector('script[data-dark-star-my-voice]')) {
      const s = document.createElement("script");
      s.src = "technical-dark-star-my-voice.js?v=rescue-20260927";
      s.dataset.darkStarMyVoice = "1";
      document.body.appendChild(s);
    }
    return true;
  }

  let n = 0;
  const t = setInterval(function () {
    if (applyRescue() || ++n > 40) clearInterval(t);
  }, 250);
})();
</script>
</body>
</html>
