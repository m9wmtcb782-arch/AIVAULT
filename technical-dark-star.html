<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Technical Dark Star</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#fff;
  color:#202123;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
    "Noto Sans TC","PingFang TC",sans-serif;
}

button,textarea,input{font:inherit}
button{cursor:pointer}
body{overflow:hidden}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:#fff;
}

/* =========================================================
   TOP
========================================================= */

.topbar{
  height:58px;
  min-height:58px;
  display:flex;
  align-items:center;
  padding:0 14px;
  border-bottom:1px solid #eee;
  background:rgba(255,255,255,.96);
  position:relative;
  z-index:30;
}

.menu-button{
  width:38px;
  height:38px;
  border:0;
  background:transparent;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#303030;
}

.menu-button:hover{
  background:#f3f3f3;
}

.brand{
  margin-left:7px;
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.brand-mark{
  width:28px;
  height:28px;
  border-radius:8px;
  background:#171717;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:600;
}

.brand-title{
  font-size:15px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.brand-engine{
  font-size:12px;
  color:#8b8b8b;
}

.brand-home{
  margin-left:auto;
  border:1px solid #e5e5e5;
  background:#fff;
  color:#333;
  border-radius:9px;
  padding:7px 10px;
  font-size:12px;
  text-decoration:none;
}

.brand-home:hover{
  background:#f4f4f4;
}

/* =========================================================
   CHAT
========================================================= */

.main{
  flex:1;
  min-height:0;
  position:relative;
  display:flex;
}

.chat{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:#fff;
}

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  scroll-behavior:smooth;
}

.messages-inner{
  width:min(760px,calc(100% - 32px));
  margin:0 auto;
  padding:34px 0 150px;
}

/* =========================================================
   SCROLL TO LATEST
========================================================= */

.scroll-latest{
  position:absolute;
  right:18px;
  bottom:112px;
  width:42px;
  height:42px;
  border:1px solid #dedede;
  border-radius:50%;
  background:rgba(255,255,255,.97);
  color:#333;
  box-shadow:0 3px 14px rgba(0,0,0,.12);
  display:none;
  align-items:center;
  justify-content:center;
  font-size:21px;
  line-height:1;
  z-index:25;
}

.scroll-latest.show{
  display:flex;
}

.scroll-latest:hover{
  background:#f5f5f5;
}

@media(max-width:700px){
  .scroll-latest{
    right:12px;
    bottom:108px;
  }
}

/* =========================================================
   WELCOME
========================================================= */

.welcome{
  min-height:calc(100dvh - 220px);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px 0;
}

.welcome-content{
  width:100%;
}

.welcome-mark{
  width:54px;
  height:54px;
  margin:0 auto 22px;
  border-radius:16px;
  background:#171717;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.welcome-title{
  margin:0;
  font-size:30px;
  font-weight:600;
  letter-spacing:-.7px;
}

.welcome-subtitle{
  margin:13px auto 0;
  max-width:570px;
  font-size:15px;
  line-height:1.75;
  color:#777;
}

/* =========================================================
   MESSAGE
========================================================= */

.message{
  display:flex;
  gap:13px;
  margin-bottom:30px;
}

.message.user{
  justify-content:flex-end;
}

.message-avatar{
  width:30px;
  height:30px;
  min-width:30px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:600;
  background:#171717;
  color:#fff;
  margin-top:2px;
}

.message.user .message-avatar{
  background:#e9e9e9;
  color:#444;
  animation:none;
}

.message-body{
  min-width:0;
  max-width:690px;
}

.message.user .message-body{
  max-width:min(600px,82%);
}

.message-text{
  font-size:16px;
  line-height:1.75;
  white-space:normal;
  word-break:break-word;
}

.message.user .message-text{
  background:#f4f4f4;
  border-radius:18px;
  padding:10px 15px;
}

.message-actions{
  margin-top:8px;
  display:flex;
  gap:4px;
}

.message-action{
  width:31px;
  height:31px;
  border:0;
  background:transparent;
  border-radius:8px;
  color:#777;
  display:flex;
  align-items:center;
  justify-content:center;
}

.message-action:hover{
  background:#f2f2f2;
  color:#222;
}

.message-action.danger:hover{
  background:#fdeaea;
  color:#dc2626;
}

/* =========================================================
   MEDIA
========================================================= */

.media-stack{
  margin-top:8px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.media-image,
.media-video{
  display:block;
  max-width:min(420px,100%);
  max-height:320px;
  border-radius:14px;
  border:1px solid #e8e8e8;
  background:#f7f7f7;
  object-fit:contain;
}

.media-article{
  margin-top:8px;
  padding:12px 14px;
  border:1px solid #e8e8e8;
  border-radius:14px;
  background:#fafafa;
  font-size:14px;
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-word;
}

.media-article a{
  color:#155eef;
}

/* =========================================================
   SANDBOX
========================================================= */

.sandbox-card{
  margin-top:15px;
  border:1px solid #e4e4e4;
  border-radius:14px;
  overflow:hidden;
  background:#fff;
}

.sandbox-head{
  min-height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:7px 10px 7px 14px;
  border-bottom:1px solid #ededed;
}

.sandbox-title{
  font-size:13px;
  font-weight:600;
}

.sandbox-tabs{
  display:flex;
  gap:3px;
}

.sandbox-tab{
  border:0;
  background:transparent;
  color:#777;
  border-radius:7px;
  padding:6px 9px;
  font-size:11px;
}

.sandbox-tab.active{
  background:#eee;
  color:#222;
}

.sandbox-body{
  height:420px;
}

.sandbox-view{
  display:none;
  width:100%;
  height:100%;
}

.sandbox-view.active{
  display:block;
}

.sandbox-empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#888;
  padding:30px;
}

.sandbox-empty-title{
  color:#555;
  font-size:14px;
  margin-bottom:7px;
}

.sandbox-empty-text{
  font-size:12px;
  line-height:1.6;
}

.sandbox-frame{
  width:100%;
  height:100%;
  border:0;
  background:#fff;
}

.sandbox-code{
  width:100%;
  height:calc(100% - 42px);
  border:0;
  outline:0;
  resize:none;
  background:#101114;
  color:#ddd;
  padding:15px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,
    Consolas,monospace;
  font-size:13px;
  line-height:1.6;
}

.sandbox-code-tools{
  height:42px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  background:#181a1f;
  border-bottom:1px solid #292c31;
}

.sandbox-file{
  color:#aaa;
  font-size:11px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.sandbox-copy{
  border:1px solid #373a40;
  background:#22252b;
  color:#eee;
  border-radius:6px;
  padding:5px 9px;
  font-size:11px;
  white-space:nowrap;
}

.sandbox-copy:hover{
  background:#2c3037;
}

/* =========================================================
   GATES
========================================================= */

.gate-card{
  margin-top:15px;
  border:1px solid #e5e5e5;
  border-radius:14px;
  overflow:hidden;
}

.gate-head{
  padding:13px 14px;
  border-bottom:1px solid #eee;
  font-size:13px;
  font-weight:600;
}

.gate-list{
  padding:9px 14px 12px;
}

.gate-row{
  display:flex;
  align-items:flex-start;
  gap:9px;
  padding:7px 0;
}

.gate-icon{
  width:20px;
  height:20px;
  min-width:20px;
  border-radius:50%;
  background:#eee;
  color:#999;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
}

.gate-row.running .gate-icon{
  background:#e9f0ff;
  color:#2563eb;
}

.gate-row.completed .gate-icon{
  background:#e7f7ef;
  color:#15803d;
}

.gate-row.failed .gate-icon{
  background:#fdeaea;
  color:#dc2626;
}

.gate-name{
  font-size:12px;
  font-weight:500;
}

.gate-status{
  margin-top:2px;
  color:#888;
  font-size:11px;
}

/* =========================================================
   COMPOSER
========================================================= */

.composer-area{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:10px 16px max(16px,env(safe-area-inset-bottom));
  background:linear-gradient(
    to bottom,
    rgba(255,255,255,0),
    rgba(255,255,255,.94) 22%,
    #fff 45%
  );
  pointer-events:none;
}

.composer{
  width:min(760px,100%);
  margin:0 auto;
  pointer-events:auto;
  border:1px solid #d9d9d9;
  border-radius:25px;
  background:#fff;
  box-shadow:0 3px 14px rgba(0,0,0,.06);
  overflow:hidden;
}

.attachment-preview{
  display:none;
  padding:9px 12px 0;
  gap:7px;
  flex-wrap:wrap;
}

.attachment-preview.show{
  display:flex;
}

.attachment-chip{
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 9px;
  background:#f4f4f4;
  border-radius:9px;
  font-size:11px;
  color:#555;
  max-width:230px;
}

.attachment-chip-name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.attachment-remove{
  border:0;
  background:transparent;
  color:#888;
  padding:0;
  font-size:14px;
}

.attachment-chip img{
  width:28px;
  height:28px;
  object-fit:cover;
  border-radius:6px;
}

.composer-row{
  min-height:54px;
  display:flex;
  align-items:flex-end;
  gap:5px;
  padding:6px 7px;
}

.composer-plus,
.composer-mic{
  width:39px;
  height:39px;
  min-width:39px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#444;
  display:flex;
  align-items:center;
  justify-content:center;
}

.composer-plus:hover,
.composer-mic:hover{
  background:#f1f1f1;
}

.composer-mic.recording{
  background:#f0f0f0;
  color:#111;
}

.composer-input{
  flex:1;
  min-height:39px;
  max-height:180px;
  resize:none;
  border:0;
  outline:0;
  padding:9px 7px;
  background:transparent;
  font-size:16px;
  line-height:1.45;
}

.composer-input::placeholder{
  color:#9a9a9a;
}

.composer-send{
  width:39px;
  height:39px;
  min-width:39px;
  border:0;
  border-radius:50%;
  background:#171717;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.composer-send:disabled{
  opacity:.35;
  cursor:default;
}

/* =========================================================
   ATTACH MENU
========================================================= */

.attach-menu{
  position:fixed;
  left:16px;
  bottom:90px;
  width:230px;
  padding:7px;
  background:#fff;
  border:1px solid #e5e5e5;
  border-radius:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.12);
  display:none;
  z-index:100;
}

.attach-menu.show{
  display:block;
}

.attach-option{
  width:100%;
  border:0;
  background:transparent;
  border-radius:9px;
  padding:11px;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  font-size:13px;
  color:#333;
}

.attach-option:hover{
  background:#f3f3f3;
}

/* =========================================================
   DRAWER
========================================================= */

.drawer-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.22);
  opacity:0;
  visibility:hidden;
  transition:.18s;
  z-index:80;
}

.drawer-backdrop.show{
  opacity:1;
  visibility:visible;
}

.drawer{
  position:fixed;
  top:0;
  bottom:0;
  left:0;
  width:min(310px,88vw);
  background:#fff;
  box-shadow:8px 0 30px rgba(0,0,0,.12);
  transform:translateX(-105%);
  transition:.2s;
  z-index:90;
  display:flex;
  flex-direction:column;
}

.drawer.show{
  transform:translateX(0);
}

.drawer-top{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  border-bottom:1px solid #eee;
}

.drawer-brand{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:14px;
  font-weight:600;
}

.drawer-close{
  width:36px;
  height:36px;
  border:0;
  background:transparent;
  border-radius:9px;
}

.drawer-close:hover{
  background:#f2f2f2;
}

.new-chat{
  margin:12px;
  height:42px;
  border:1px solid #dedede;
  background:#fff;
  border-radius:10px;
  text-align:left;
  padding:0 13px;
  font-size:13px;
}

.new-chat:hover{
  background:#f5f5f5;
}

.history{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:3px 9px 20px;
}

.history-label{
  padding:12px 8px 6px;
  color:#999;
  font-size:11px;
}

.history-item-wrap{
  display:flex;
  align-items:center;
  gap:4px;
}

.history-item-wrap .history-item{
  flex:1;
}

.history-item{
  width:100%;
  border:0;
  background:transparent;
  border-radius:9px;
  padding:10px 9px;
  text-align:left;
  color:#333;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover{
  background:#f2f2f2;
}

.history-del{
  width:28px;
  min-width:28px;
  height:28px;
  border:0;
  background:transparent;
  color:#aaa;
  border-radius:7px;
  font-size:14px;
}

.history-del:hover{
  background:#fdeaea;
  color:#dc2626;
}

.drawer-bottom{
  border-top:1px solid #eee;
  padding:9px;
}

.drawer-item{
  width:100%;
  border:0;
  background:transparent;
  border-radius:9px;
  padding:10px;
  text-align:left;
  font-size:13px;
  color:#444;
}

.drawer-item:hover{
  background:#f3f3f3;
}

/* =========================================================
   VOICE
========================================================= */

/* AIVAULT_DARK_STAR_WORK_LOCATION_V1 */
.dark-star-work-location{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:4px;
  color:#777;
  font-size:13px;
  line-height:1.45;
  word-break:break-word;
  min-height:20px;
  opacity:.9;
}
.dark-star-work-location-icon{
  width:16px;
  height:16px;
  flex:0 0 16px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:#999;
}
.dark-star-work-location-icon svg{
  width:15px;
  height:15px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.dark-star-work-location-text{
  display:inline-block;
  animation:darkStarWorkTextPulse 1.8s ease-in-out infinite;
}
.dark-star-work-location.is-idle .dark-star-work-location-text{
  animation:none;
}
@keyframes darkStarWorkTextPulse{
  0%,100%{opacity:.45;}
  50%{opacity:.95;}
}
.dark-star-work-stop{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-top:7px;
  min-height:30px;
  padding:4px 10px;
  border:1px solid #d9d9d9;
  border-radius:8px;
  background:#fff;
  color:#222;
  font-size:12px;
}
.dark-star-work-stop:hover{
  background:#f3f3f3;
}
.dark-star-work-stop.danger{
  border-color:#ef4444;
  color:#b91c1c;
}
@media(max-width:700px){
  .dark-star-work-location{font-size:13px;}
}

.voice-status{
  position:fixed;
  left:50%;
  bottom:105px;
  transform:translateX(-50%);
  padding:10px 15px;
  background:#171717;
  color:#fff;
  border-radius:20px;
  font-size:12px;
  display:none;
  z-index:120;
}

.voice-status.show{
  display:block;
}

.hidden-file{
  display:none;
}

.icon{
  width:20px;
  height:20px;
  display:block;
}

.icon-small{
  width:18px;
  height:18px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  .brand-engine{
    display:none;
  }

  .messages-inner{
    width:calc(100% - 24px);
    padding-top:25px;
  }

  .welcome{
    min-height:calc(100dvh - 220px);
  }

  .welcome-title{
    font-size:25px;
  }

  .welcome-subtitle{
    font-size:14px;
  }

  .message-text{
    font-size:16px;
  }

  .sandbox-body{
    height:360px;
  }

  .composer-area{
    padding-left:9px;
    padding-right:9px;
  }

  .composer{
    border-radius:22px;
  }

  .attach-menu{
    left:9px;
    bottom:88px;
  }
}


/* AIVAULT_DARK_STAR_AVATAR_COLOR_SHIFT_V1 */
.message.ai .message-avatar{
  width:36px;
  height:36px;
  min-width:36px;
  border-radius:10px;
  background:linear-gradient(135deg,#ff3b30,#ff9500,#ffcc00,#34c759,#0a84ff,#5856d6,#af52de,#ff2d55) !important;
  background-size:300% 300% !important;
  color:#fff !important;
  font-size:20px;
  font-weight:800;
  text-shadow:0 1px 2px rgba(0,0,0,.28);
  animation:aivaultLogoColorShift 6s ease-in-out infinite;
  border:0;
}

/* AIVAULT_WHITE_BUTTONS_V1 */
button,
a.brand-home,
.composer-plus,
.composer-mic,
.composer-send,
.attach-option,
.sandbox-tab,
.sandbox-copy,
.drawer-close,
.new-chat,
.history-item,
.history-del,
.drawer-item,
.message-action{
  background:#fff !important;
  color:#111 !important;
  border-color:#ddd !important;
}

button:hover,
a.brand-home:hover,
.composer-plus:hover,
.composer-mic:hover,
.composer-send:hover,
.attach-option:hover,
.sandbox-tab:hover,
.sandbox-copy:hover,
.drawer-close:hover,
.new-chat:hover,
.history-item:hover,
.drawer-item:hover,
.message-action:hover{
  background:#f5f5f5 !important;
  color:#111 !important;
}

.composer-send:disabled{
  background:#fff !important;
  color:#777 !important;
  opacity:.5;
}


/* AIVAULT_DARK_STAR_READABILITY_V1 */
.message-text{
  font-size:20px !important;
  line-height:1.8 !important;
}
.message.user .message-text{
  padding:11px 16px;
}
.media-article{
  font-size:18px !important;
  line-height:1.8 !important;
}
.composer-input{
  font-size:19px !important;
  line-height:1.55 !important;
}
.brand-title{font-size:16px !important;}
.brand-engine{font-size:13px !important;}
.history-item,.drawer-item,.new-chat,.attach-option{font-size:16px !important;}
.voice-status{font-size:15px !important;}

function escapeHTML(value){

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function isNearBottom(){

  return (
    messages.scrollHeight -
    messages.scrollTop -
    messages.clientHeight

}

function updateScrollLatest(){

  if(!scrollLatest)return;

  scrollLatest.classList.toggle(

    !isNearBottom()

}

function scrollBottom(){

  requestAnimationFrame(()=>{

  });
}

document.addEventListener(
  "paste",
  async event=>{

    const clipboard =
      event.clipboardData;

    if(!clipboard){
      return;
    }

    const files = [];

    if(
      clipboard.files &&
      clipboard.files.length
    ){

      Array.from(
        clipboard.files
      ).forEach(
        file=>files.push(file)
      );

    }


    Array.from(
      clipboard.items || []
    ).forEach(item=>{

      if(item.kind === "file"){

        const file =
          item.getAsFile();

        if(
          file &&
          !files.includes(file)
        ){

          files.push(file);

        }

      }

    });


    if(files.length){

      event.preventDefault();

      await addFilesFromList(
        files
      );

      return;
    }


    const pasted =
      clipboard.getData(
        "text/plain"
      );


    if(
      pasted &&
      pasted.length > 800 &&
      document.activeElement !== input
    ){

      event.preventDefault();

      const file =
        new File(
          [pasted],
          "pasted-article.txt",
          {
            type:"text/plain"
          }
        );

      await addFilesFromList(
        [file]
      );

    }

  }
);

async function prepareAttachment(
  file
){

  const base = {

    name:
      file.name,

    type:
      file.type ||
      "application/octet-stream",

    size:
      file.size

  };


  const textTypes = [

    "text/plain",
    "text/markdown",
    "application/json",
    "text/javascript",
    "application/javascript",
    "text/css",
    "text/html"

  ];


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const textExtensions = [

    "txt",
    "md",
    "json",
    "js",
    "ts",
    "jsx",
    "tsx",
    "html",
    "css",
    "csv",
    "xml",
    "yml",
    "yaml"

  ];


  if(
    textTypes.includes(
      file.type
    ) ||
    textExtensions.includes(
      extension
    )
  ){

    const content =
      await file.text();

    return {

      ...base,

      content_type:
        ["md","txt","html"]
          .includes(extension)
          ? "article"
          : "text",

      content,

      preview:
        content.slice(0,4000)

    };

  }


  if(
    file.type.startsWith(
      "image/"
    ) ||
    [
      "png",
      "jpg",
      "jpeg",
      "gif",
      "webp",
      "bmp",
      "svg"
    ].includes(extension)
  ){

    const preview =
      await readAsDataURL(
        file
      );

    return {

      ...base,

      content_type:
        "image",

      content_base64:
        preview,

      preview

    };

  }


  if(
    file.type.startsWith(
      "video/"
    ) ||
    [
      "mp4",
      "webm",
      "mov"
    ].includes(extension)
  ){

    if(
      file.size >
      3.5 * 1024 * 1024
    ){

      throw new Error(
        "影片超過 3.5MB。手機影片可能太大，請改拍更短的影片，或先使用照片。"
      );

    }

    const preview =
      await readAsDataURL(
        file
      );

    return {

      ...base,

      content_type:
        "video",

      content_base64:
        preview,

      preview

    };

  }


  if(
    file.type ===
      "application/pdf" ||
    extension === "pdf"
  ){

    return {

      ...base,

      content_type:
        "article",

      preview_kind:
        "pdf",

      content:
        "[PDF] " +
        file.name

    };

  }


  return {

    ...base,

    content_type:
      "file"

  };

}


function readAsDataURL(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload =
        ()=>resolve(
          reader.result
        );

      reader.onerror =
        ()=>reject(
          new Error(
            "無法讀取檔案"
          )
        );

      reader.readAsDataURL(
        file
      );

    }
  );

}


function renderAttachments(){

        );

        attachment.preview &&
        attachment.content_type ===
          "image"

        : `<span>${getFileIcon(attachment.type)}</span>`;


      chip.innerHTML = `

${thumb}

<span class="attachment-chip-name">
  ${escapeHTML(
    attachment.name
  )}
</span>

<button
  class="attachment-remove"
  data-index="${index}">
  ×
</button>

`;


      attachmentPreview.appendChild(
        chip
      );

    }
  );


  attachmentPreview
    .querySelectorAll(

    .forEach(button=>{

      button.onclick = ()=>{

        const index =
          Number(

          1
        );

        renderAttachments();

        sendButton.disabled =
          isSending ||
          (
            !input.value.trim() &&
            attachments.length === 0
          );

      };

    });

}


function getFileIcon(type){

  if(
    type?.startsWith(
      "image/"
    )
  ){
    return "圖片";
  }

  if(
    type ===
      "application/pdf"
  ){
    return "PDF";
  }

  if(
    type?.startsWith(
      "video/"
    )
  ){
    return "MP4";
  }

  if(
    type?.startsWith(
      "audio/"
    )
  ){
    return "WAV";
  }

  return "檔案";
}


/* =========================================================
   GATEWAY MESSAGE
========================================================= */

function buildGatewayMessage(
  userMessage,
  files
){

  const text =
    (userMessage || "").trim();

  const parts = [];

  if(text){
    parts.push(text);
  }


  (files || []).forEach(
    file=>{

      if(
        file.content_type ===
        "image"
      ){

        parts.push(
          "（已附加圖片：" +
          (file.name || "image") +
          "。請先辨識圖片。若圖中有程式碼，請完整讀出、指出錯誤並給出修正後的程式。）"
        );

      }else if(
        file.content_type ===
        "video"
      ){

        parts.push(
          "（已附加影片：" +
          (file.name || "video") +
          "）"
        );

      }else if(
        file.content_type ===
          "article" ||
        file.content_type ===
          "text"
      ){

        parts.push(
          "（已附加文章／文件：" +
          (file.name || "file") +
          "）\n" +
          String(
            file.content || ""
          ).slice(0,12000)
        );

      }else if(file.name){

        parts.push(
          "（已附加檔案：" +
          file.name +
          "）"
        );

      }

    }
  );


  return (
    parts.join("\n\n") ||
    "請分析我上傳的檔案。"
  );
}

function getDarkStarTopicId(){

  /*
    Gateway v3.1 Memory

    conversationId 優先。
    沒有 conversationId 時，
    使用固定 localStorage topic。
  */

  let topicId = null;


  try{

    topicId =
      localStorage.getItem(
        "technical-dark-star-topic-id"
      );

  }catch(error){

    console.warn(
      "[DarkStar][memory] localStorage read failed",
      error
    );

  }


  if(
    typeof topicId !==
      "string" ||
    !topicId.trim()
  ){

    if(
      window.crypto &&
      typeof crypto.randomUUID ===
        "function"
    ){

      topicId =
        "technical-dark-star-" +
        crypto.randomUUID();

    }else{

      topicId =
        "technical-dark-star-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2);

    }


    try{

      localStorage.setItem(
        "technical-dark-star-topic-id",
        topicId
      );

    }catch(error){

      console.warn(
        "[DarkStar][memory] localStorage write failed",
        error
      );

    }

  }


  return topicId;
}


/* =========================================================
   GATEWAY RESPONSE HELPERS
========================================================= */

function logGatewaySchema(data){

  try{

    if(
      !data ||
      typeof data !==
        "object"
    ){

      console.info(
        "[DarkStar][gateway-schema]",
        typeof data
      );

      return;

    }


    const keys =
      Object.keys(data)
        .map(key=>({

          key,

          type:
            Array.isArray(
              data[key]
            )
              ? "array"
              : typeof data[key]

        }));


    console.info(
      "[DarkStar][gateway-schema]",
      {

        keys,

        success:
          data.success,

        provider:
          data.provider,

        model:
          data.model,

        hasContent:
          typeof data.content ===
            "string",

        hasText:
          typeof data.text ===
            "string",

        memory:
          data.memory || null

      }
    );

  }catch(error){

    console.info(
      "[DarkStar][gateway-schema] log failed"
    );

  }

}


function extractTextValue(
  value,
  depth = 0
){

  if(value == null){
    return null;
  }


  if(
    typeof value ===
      "string"
  ){

    const text =
      value.trim();

    return text
      ? text
      : null;

  }


  if(
    typeof value ===
      "number" ||
    typeof value ===
      "boolean"
  ){

    return String(value);

  }


  if(depth > 6){
    return null;
  }


  if(Array.isArray(value)){

    const parts =
      value
        .map(
          item =>
            extractTextValue(
              item,
              depth + 1
            )
        )
        .filter(Boolean);

    return parts.length
      ? parts.join("\n")
      : null;

  }


  if(
    typeof value ===
      "object"
  ){

    const preferred = [

      "content",
      "text",
      "reply",
      "response",
      "answer",
      "output",
      "message"

    ];


    for(
      const key of preferred
    ){

      if(
        !(key in value)
      ){
        continue;
      }


      if(
        key === "message" &&
        typeof value[key] !==
          "string"
      ){

        const nested =
          extractTextValue(
            value[key],
            depth + 1
          );

        if(nested){
          return nested;
        }

        continue;

      }


      const found =
        extractTextValue(
          value[key],
          depth + 1
        );

      if(found){
        return found;
      }

    }


    if(
      Array.isArray(
        value.choices
      ) &&
      value.choices[0]
    ){

      const choice =
        value.choices[0];

      const found =
        extractTextValue(

          choice.message?.content ??
          choice.text ??
          choice.content ??
          choice,

          depth + 1

        );

      if(found){
        return found;
      }

    }


    if(
      Array.isArray(
        value.candidates
      ) &&
      value.candidates[0]
    ){

      const candidate =
        value.candidates[0];

      const found =
        extractTextValue(

          candidate.content ??
          candidate,

          depth + 1

        );

      if(found){
        return found;
      }

    }


    if(
      Array.isArray(
        value.parts
      )
    ){

      const parts =
        value.parts

          .map(
            part =>
              extractTextValue(
                part?.text ??
                part,
                depth + 1
              )
          )

          .filter(Boolean);

      if(parts.length){

        return parts.join(
          "\n"
        );

      }

    }

  }


  return null;
}


function getAIReply(data){

  if(!data){
    return null;
  }


  logGatewaySchema(data);


  const direct =
    extractTextValue(

      {

        content:
          data.content,

        text:
          data.text,

        reply:
          data.reply,

        response:
          typeof data.response ===
            "string"
            ? data.response
            : null,

        answer:
          data.answer,

        output:
          data.output,

        message:
          typeof data.message ===
            "string"
            ? data.message
            : null

      },

      0

    );


  if(direct){
    return direct;
  }


  return (

    extractTextValue(
      data.result,
      0
    ) ||

    extractTextValue(
      data.data,
      0
    ) ||

    extractTextValue(
      data.payload,
      0
    ) ||

    extractTextValue(
      data.output,
      0
    ) ||

    null

  );

}


/* =========================================================
   AI MEDIA
========================================================= */

function isDataOrHttpURL(value){

  return (
    typeof value ===
      "string" &&
    /^(https?:\/\/|data:image\/|data:video\/)/i
      .test(
        value.trim()
      )
  );

}


function collectAIMedia(
  result,
  text
){

  const items = [];


  function push(item){

    if(!item){
      return;
    }

    /*
      避免相同 URL 被加入兩次。
    */

    const exists =
      items.some(
        existing =>
          existing.preview ===
          item.preview
      );

    if(!exists){
      items.push(item);
    }

  }


  const urls = [];


  String(text || "")
    .replace(

      /(!)?\[([^\]]*)\]\(([^)]+)\)|(https?:\/\/[^\s<>"']+\.(?:png|jpe?g|gif|webp|mp4|webm))/ig,

      function(
        match,
        bang,
        label,
        mdUrl,
        rawUrl
      ){

        const url =
          mdUrl || rawUrl;

        if(url){
          urls.push(url);
        }

        return match;

      }

    );


  urls.forEach(
    url=>{

      if(
        /\.(mp4|webm|mov)(\?|$)/i
          .test(url)
      ){

        push({

          name:"video",

          content_type:
            "video",

          preview:url

        });

      }else if(

        /\.(png|jpe?g|gif|webp|bmp|svg)(\?|$)/i
          .test(url) ||
        url.startsWith(
          "data:image/"
        )

      ){

        push({

          name:"image",

          content_type:
            "image",

          preview:url

        });

      }

    }
  );


  const pools = [

    result,
    result?.files,
    result?.media,
    result?.images,
    result?.videos,
    result?.artifacts,
    result?.workspace

  ];


  pools.forEach(
    pool=>{

      if(!pool){
        return;
      }


      if(
        typeof pool ===
          "string" &&
        isDataOrHttpURL(pool)
      ){

        push({

          name:"media",

          content_type:
            pool.includes("video") ||
            /\.mp4/i.test(pool)
              ? "video"
              : "image",

          preview:pool

        });

        return;

      }


      if(Array.isArray(pool)){

        pool.forEach(
          (item,i)=>{

            if(
              typeof item ===
                "string" &&
              isDataOrHttpURL(item)
            ){

              push({

                name:
                  "media-" + i,

                content_type:
                  /\.mp4|video/i
                    .test(item)
                    ? "video"
                    : "image",

                preview:item

              });

            }else if(
              item &&
              typeof item ===
                "object"
            ){

              const url =
                item.url ||
                item.preview ||
                item.content_base64 ||
                item.src;

              if(
                isDataOrHttpURL(url)
              ){

                push({

                  name:
                    item.name ||
                    "media-" + i,

                  content_type:
                    item.content_type ||
                    (
                      String(
                        item.type || ""
                      ).startsWith(
                        "video"
                      )
                        ? "video"
                        : "image"
                    ),

                  preview:url

                });

              }

            }

          }
        );

      }

    }
  );


  return items;
}


function formatAIText(text){

  const escaped =
    escapeHTML(
      text || ""
    );


  const html =
    escaped

      .replace(
        /\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener">$1</a>'
      )

      .replace(
        /(https?:\/\/[^\s<]+)/g,
        function(url){

          if(
            url.includes(
              "</a>"
            )
          ){

            return url;

          }

          return (
            '<a href="' +
            url +
            '" target="_blank" rel="noopener">' +
            url +
            "</a>"
          );

        }
      )

      .replace(
        /\n/g,
        "<br>"
      );


  return {
    html
  };

}


/* =========================================================
   MEDIA RENDER
========================================================= */

function renderMediaStack(
  files
){

  const stack =
    document.createElement(
      "div"
    );

  stack.className =
    "media-stack";


  (files || []).forEach(
    file=>{

      const type =
        file.content_type ||
        (
          String(
            file.type || ""
          ).startsWith(
            "image/"
          )
            ? "image"
            : String(
                file.type || ""
              ).startsWith(
                "video/"
              )
                ? "video"
                : file.content
                  ? "article"
                  : "file"
        );


      const src =
        file.preview ||
        file.content_base64 ||
        file.url ||
        "";


      if(
        type === "image" &&
        src
      ){

        const img =
          document.createElement(
            "img"
          );

        img.className =
          "media-image";

        img.src =
          src;

        img.alt =
          file.name ||
          "圖片";

        stack.appendChild(
          img
        );

        return;

      }


      if(
        type === "video" &&
        src
      ){

        const video =
          document.createElement(
            "video"
          );

        video.className =
          "media-video";

        video.src =
          src;

        video.controls =
          true;

        video.playsInline =
          true;

        stack.appendChild(
          video
        );

        return;

      }


      if(
        type === "article" ||
        type === "text"
      ){

        const article =
          document.createElement(
            "article"
          );

        article.className =
          "media-article";

        article.textContent =
          (
            file.name
              ? file.name +
                "\n\n"
              : ""
          ) +
          String(
            file.content ||
            file.preview ||
            ""
          );

        stack.appendChild(
          article
        );

        return;

      }


      const fallback =
        document.createElement(
          "div"
        );

      fallback.style.fontSize =
        "12px";

      fallback.style.color =
        "#777";

      fallback.textContent =
        "📎 " +
        (
          file.name ||
          "檔案"
        );

      stack.appendChild(
        fallback
      );

    }
  );


  return stack;
}

========================================================= */

function appendResultArtifacts(
  body,
  result
){

  if(!result){
    return;
  }


  const files =
    result.files ||
    result.workspace?.files ||
    result.artifacts?.files ||
    null;


  /*
    只有真正由 Sandbox 執行產生的結果才顯示 Sandbox UI。
    正常聊天即使 Gateway 回傳 files，也不能自動把對話
    變成 Sandbox 對話。
  */

  const sandboxExecuted =
    result?.sandbox === true ||
    result?.sandbox?.executed === true ||
    result?.sandbox?.status === "executed" ||
    result?.execution?.environment === "sandbox" ||
    result?.source === "dark-star-sandbox";

  if(files && sandboxExecuted){

    renderSandbox(
      body,
      files,
      result
    );

  }


  const gates =
    result.gates ||
    result.learning?.gates ||
    result.stages ||
    null;


  if(
    Array.isArray(gates) &&
    gates.length
  ){

    renderGates(
      body,
      gates
    );

  }

}

function renderSandbox(

){

      files || {}
    );


  if(!names.length){
    return;
  }


  lastSandboxFiles =
    files;


  const preferred = [

    "index.html",
    "index.htm",
    "src/App.jsx",
    "App.jsx",
    "main.js",
    "src/main.js"

  ];


  const selected =
    preferred.find(
      name =>
        names.includes(name)
    ) ||
    names[0];


  const code =
    typeof files[selected] ===
      "string"

      ? files[selected]

      : JSON.stringify(
          files[selected],
          null,
          2
        );


  const sandbox =

      </div>

      </button>

  const textarea =

    previewPane.appendChild(

    );

  const previewURL =
    result?.sandbox?.preview_url ||
    result?.sandbox?.previewUrl ||
    result?.sandbox?.url ||
    result?.preview_url ||
    result?.previewUrl ||
    null;


  if(previewURL){

    previewPane.innerHTML =

    const iframe =

      );

    iframe.className =
      "sandbox-frame";

    iframe.src =
      previewURL;

    iframe.loading =
      "lazy";

    previewPane.appendChild(
      iframe
    );

  }


  sandbox
    .querySelectorAll(
      ".sandbox-tab"
    )
    .forEach(
      tab=>{

        tab.onclick =
          ()=>{

            sandbox
              .querySelectorAll(

              )
              .forEach(

            sandbox

              );

              );

            }

          };

      }
    );


  const copyButton =
    sandbox.querySelector(
      ".sandbox-copy-all"
    );


  copyButton.onclick =
    async ()=>{

      try{

        await navigator.clipboard.writeText(
          getAllFilesText(

          )
        );

        alert(
          "完整程式碼已複製"
        );

      }catch(error){

        textarea.focus();

        textarea.select();

        document.execCommand(
          "copy"
        );

        alert(
          "程式碼已複製"
        );

      }

    };


  const rerun =
    sandbox.querySelector(
      ".sandbox-rerun"
    );


  rerun.onclick =
    async ()=>{

      if(isSending){

        alert(
          "目前已有任務正在執行，請等待完成。"
        );

        return;

      }


      rerun.disabled =
        true;

      rerun.textContent =
        "重跑中…";


      try{

        const rerunResult =
          await callSandbox(
            "請重跑並測試目前的沙盒。",
            lastSandboxFiles,
            "rerun"
          );


        lastSandboxFiles =
          rerunResult.files ||
          lastSandboxFiles;


        renderAIMessage(
          getAIReply(
            rerunResult
          ) ||
          "沙盒已重跑。",
          rerunResult
        );


      }catch(error){

        alert(
          "沙盒重跑失敗：\n" +
          error.message
        );

      }finally{

        rerun.disabled =
          false;

        rerun.textContent =
          "重跑沙盒";

      }

    };


  parent.appendChild(
    sandbox
  );

}


function getAllFilesText(
  files
){

  return Object
    .entries(files || {})
    .map(
      ([name,content]) =>
        `===== ${name} =====\n\n` +
        (
          typeof content ===
            "string"
            ? content
            : JSON.stringify(
                content,
                null,
                2
              )
        ) +
        "\n\n"
    )
    .join("");

}

function renderGates(

){

  const card =
    document.createElement(
      "div"
    );

  card.className =
    "gate-card";


  const head =
    document.createElement(
      "div"
    );

  head.className =
    "gate-head";

  head.textContent =
    "Technical Dark Star 工作進度";


  const list =
    document.createElement(
      "div"
    );

  list.className =
    "gate-list";


  gates.forEach(
    gate=>{

      const row =
        document.createElement(
          "div"
        );


      const state =
        String(
          gate.status ||
          gate.state ||
          "pending"
        ).toLowerCase();


      if(
        [
          "completed",
          "passed",
          "success"
        ].includes(state)
      ){

        row.className =
          "gate-row completed";

      }else if(
        state === "running"
      ){

        row.className =
          "gate-row running";

      }else if(
        [
          "failed",
          "error"
        ].includes(state)
      ){

        row.className =
          "gate-row failed";

      }else{

        row.className =
          "gate-row";

      }


      let icon =
        "○";


      if(
        [
          "completed",
          "passed",
          "success"
        ].includes(state)
      ){

        icon =
          "✓";

      }else if(
        state === "running"
      ){

        icon =
          "●";

      }else if(
        [
          "failed",
          "error"
        ].includes(state)
      ){

        icon =
          "!";

      }


      row.innerHTML = `

<div class="gate-icon">
  ${icon}
</div>

<div>

  <div class="gate-name">
    ${escapeHTML(
      gate.name ||
      gate.stage ||
      "Unknown"
    )}
  </div>

  <div class="gate-status">
    ${escapeHTML(
      gate.message ||
      gate.label ||
      state
    )}
  </div>

</div>

`;


      list.appendChild(
        row
      );

    }
  );


  card.appendChild(
    head
  );

  card.appendChild(
    list
  );

  parent.appendChild(
    card
  );

}


/* =========================================================
   INTENT
========================================================= */

function isDebugIntent(
  text
){

  return /除錯|debug|報錯|錯誤|修bug|看這(段|張)|程式碼|code review|為什麼不能|讀圖|辨識圖片/i
    .test(
      String(text || "")
    );

}


function hasImageAttachment(
  files
){

  return (
    files || []
  ).some(
    file =>
      file.content_type ===
        "image" ||
      String(
        file.type || ""
      ).startsWith(
        "image/"
      )
  );

}


function isDrawIntent(
  text,
  files
){

  const value =
    String(text || "");


  if(
    isDebugIntent(value) ||
    hasImageAttachment(files)
  ){

    return false;

  }


  return /畫|繪|蝴蝶|圖片|生圖|動畫|svg|sketch/i
    .test(value);

}


function isGameIntent(
  text,
  files
){

  const value =
    String(text || "");


  if(
    isDebugIntent(value) ||
    hasImageAttachment(files) ||
    isDrawIntent(
      value,
      files
    )
  ){

    return false;

  }


  return /小遊戲|遊戲|貪食蛇|寫一個遊戲|做一個遊戲|玩法/i
    .test(value);

}


function isSandboxIntent(
  text,
  files
){

  /*
    Sandbox 是工程測試工具，不是正常聊天通道。

    只有使用者明確要求進入／執行／重跑 Sandbox
    時才啟用。一般「建立、做成、寫頁面、實作」
    等需求仍先走正常 Technical Dark Star 對話，
    不得因關鍵字誤判而自動把使用者送進 Sandbox。
  */

  const value =
    String(text || "").trim();

  if(
    !value ||
    isDebugIntent(value) ||
    hasImageAttachment(files) ||
    isGameIntent(value, files) ||
    isDrawIntent(value, files)
  ){

    return false;

  }

  return /(?:進入|使用|執行|開始|重跑|測試)\s*(?:沙盒|sandbox)|(?:沙盒|sandbox)\s*(?:測試|執行|重跑|驗證)/i
    .test(value);

}


/* =========================================================
   HTML / SVG EXTRACTION
========================================================= */

function extractHtmlFromText(
  text
){

  const raw =
    String(text || "");


  const doctype =
    raw.search(
      /<!DOCTYPE html/i
    );


  if(doctype >= 0){

    return raw
      .slice(doctype)
      .trim();

  }


  const start =
    raw.search(
      /<html/i
    );


  if(start >= 0){

    return raw
      .slice(start)
      .trim();

  }


  return "";

}


function extractSvgFromText(
  text
){

  const raw =
    String(text || "");


  const start =
    raw.search(
      /<svg/i
    );


  const end =
    raw
      .toLowerCase()
      .lastIndexOf(
        "</svg>"
      );


  if(
    start === -1 ||
    end === -1 ||
    end < start
  ){

    return "";

  }


  return raw
    .slice(
      start,
      end + 6
    );

}

/* =========================================================
   AIVAULT AI GATEWAY
   SINGLE VERSION ONLY
========================================================= */

async function callAIVAULT(
  userMessage,
  files
){
  updateDarkStarWorkLocation("📍 AIVAULT → AI Gateway → 發送請求", {kind:"gateway"});

  const requestId =
    ++requestSequence;


  console.info(
    "[DarkStar][GATEWAY REQUEST]",
    requestId
  );


  const safeFiles =
    (files || []).map(
      file=>({

        name:
          file.name,

        type:
          file.type,

        size:
          file.size,

        content_type:
          file.content_type,

        content:
          file.content ||
          null,

        content_base64:
          file.content_base64 ||
          file.preview ||
          null

      })
    );


  const images =
    safeFiles
      .filter(
        file =>
          file.content_type ===
            "image" &&
          file.content_base64
      )
      .map(
        file =>
          file.content_base64
      );


  const topicId =
    getDarkStarTopicId();


  const payload = {

    engine:
      ENGINE,

    message:
      buildGatewayMessage(
        userMessage,
        safeFiles
      ),

    conversation_id:
      conversationId || null,

    topic_id:
      topicId,

    agent_id:
      "technical-dark-star",

    source:
      "technical-dark-star-web",

    files:
      safeFiles,

    image:
      images[0] || null,

    images:
      images

  };


  console.info(
    "[DarkStar][GATEWAY PAYLOAD]",
    {

      request_id:
        requestId,

      topic_id:
        payload.topic_id,

      conversation_id:
        payload.conversation_id,

      agent_id:
        payload.agent_id,

      files:
        safeFiles.length,

      images:
        images.length

    }
  );


  updateDarkStarWorkLocation("📍 AIVAULT → AI Gateway → 等待真實回應", {kind:"gateway"});

  payload.stream = true;

  const response =
    await fetch(
      AI_GATEWAY_URL,
      {

        method:"POST",

        signal:
          getDarkStarAbortSignal(),

        headers:{
          "Content-Type":
            "application/json",
          "Accept":
            "text/event-stream, application/json"
        },

        body:
          JSON.stringify(
            payload
          )

      }
    );

  let data = {};

  if(!response.ok){
    const errorText = await response.text();
    let errorData = {};
    try{ errorData = errorText ? JSON.parse(errorText) : {}; }catch(error){}
    const detail =
      errorData?.message ||
      errorData?.error ||
      `HTTP ${response.status}`;
    throw new Error(String(detail));
  }

  const contentType =
    String(response.headers.get("content-type") || "").toLowerCase();

  if(contentType.includes("text/event-stream") && response.body){
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let streamDone = false;

    const handleEventBlock = (block) => {
      const lines = String(block || "").split(/\r?\n/);
      let eventName = "message";
      const dataLines = [];

      for(const line of lines){
        if(line.startsWith("event:")){
          eventName = line.slice(6).trim();
        }else if(line.startsWith("data:")){
          dataLines.push(line.slice(5).trimStart());
        }
      }

      if(!dataLines.length) return;

      const raw = dataLines.join("\n");
      let eventData = {};
      try{
        eventData = JSON.parse(raw);
      }catch(error){
        console.warn("[DarkStar][Gateway SSE] invalid event data", raw);
        return;
      }

      if(eventName === "runtime"){
        const action = String(eventData?.action || "").trim();
        const target = String(eventData?.target || "").trim();
        if(action || target){
          const label = [action, target].filter(Boolean).join("：");
          updateDarkStarWorkLocation("📍 " + label, {
            kind: eventData?.kind || "gateway"
          });
        }
        return;
      }

      if(eventName === "result"){
        data = eventData && typeof eventData === "object"
          ? eventData
          : {};
        return;
      }

      if(eventName === "error"){
        throw new Error(
          String(eventData?.message || eventData?.error || "AIVAULT AI Gateway 串流執行失敗")
        );
      }

      if(eventName === "done"){
        streamDone = true;
      }
    };

    while(!streamDone){
      const {value, done} = await reader.read();
      if(done) break;

      buffer += decoder.decode(value, {stream:true});

      const blocks = buffer.split("\n\n");
      buffer = blocks.pop() || "";

      for(const block of blocks){
        handleEventBlock(block);
      }
    }

    buffer += decoder.decode();
    if(buffer.trim()) handleEventBlock(buffer);

    if(!data || typeof data !== "object" || Object.keys(data).length === 0){
      throw new Error("AIVAULT AI Gateway 串流沒有收到最終結果。");
    }
  }else{
    const responseText = await response.text();
    try{
      data =
        responseText
          ? JSON.parse(responseText)
          : {};
    }catch(error){
      throw new Error(
        "AIVAULT AI Gateway 回傳不是 JSON：\\n" +
        responseText.slice(0,1200)
      );
    }
  }


  if(!response.ok){

    const detail =
      data?.message ||
      data?.error ||
      (
        Array.isArray(
          data?.failover
            ?.previous_failures
        ) &&
        data.failover
          .previous_failures[0]
          ?.error
      ) ||
      `HTTP ${response.status}`;


    throw new Error(
      String(detail)
    );

  }


  conversationId =
    data.conversation_id ||
    data.conversationId ||
    data.session_id ||
    data.sessionId ||
    conversationId;


  try{
    const returnedTopicId = data?.memory?.topic_id || data?.topic_id || topicId;
    if(returnedTopicId){
      localStorage.setItem("technical-dark-star-topic-id", String(returnedTopicId));
    }
  }catch(error){
    console.warn("[DarkStar][memory] topic persistence failed", error);
  }


  const actualLocation = createWorkLocationFromGateway(data);
  if(actualLocation){
    updateDarkStarWorkLocation(actualLocation, {kind: actualLocation.includes("GitHub") ? "github" : actualLocation.includes("Supabase") ? "supabase" : "gateway"});
  }

  console.info(
    "[DarkStar][GATEWAY RESPONSE]",
    {

      request_id:
        requestId,

      success:
        data?.success,

      provider:
        data?.provider,

      model:
        data?.model,

      conversation_id:
        data?.conversation_id ||
        conversationId,

      memory_enabled:
        data?.memory?.enabled,

      memory_reason:
        data?.memory?.reason

    }
  );


  console.info(
    "[DarkStar][MEMORY]",
    {

      request_id:
        requestId,

      enabled:
        data?.memory?.enabled,

      topic_id:
        data?.memory?.topic_id ||
        data?.topic_id ||
        topicId,

      conversation_id:
        data?.memory?.conversation_id ||
        data?.conversation_id ||
        conversationId,

      retained_messages:
        data?.memory?.retained_messages,

      context_messages_sent:
        data?.memory
          ?.context_messages_sent,

      reason:
        data?.memory?.reason,

      diagnostic:
        data?.memory?.diagnostic

    }
  );


  saveState();


  return data;

}

let activeDarkStarWorkLocation = null;
let activeDarkStarAbortController = null;
let darkStarStopRequested = false;

function getDarkStarAbortSignal(){
  return activeDarkStarAbortController
    ? activeDarkStarAbortController.signal
    : undefined;
}

function stopDarkStarWork(){
  if(!isSending || !activeDarkStarAbortController) return;
  darkStarStopRequested = true;
  updateDarkStarWorkLocation("■ 正在停止暗星目前工作……", {kind:"default"});
  activeDarkStarAbortController.abort();
}

function updateDarkStarWorkLocation(location, options = {}){
  const text = String(location || "").trim();
  if(!text) return;
  if(activeDarkStarWorkLocation){
    const textNode = activeDarkStarWorkLocation.querySelector(".dark-star-work-location-text");
    const iconNode = activeDarkStarWorkLocation.querySelector(".dark-star-work-location-icon");
    if(textNode) textNode.textContent = text;
    activeDarkStarWorkLocation.classList.remove("is-idle");
    if(iconNode){

async function copyTextToClipboard(text){

  const value = String(text || "");

  if(!value){
    return false;
  }

  try{

    if(
      navigator.clipboard &&
      typeof navigator.clipboard.writeText === "function"
    ){

      await navigator.clipboard.writeText(value);
      return true;

    }

  }catch(error){
    console.warn("[DarkStar][copy] clipboard API failed",error);
  }

  try{

    const area = document.createElement("textarea");
    area.value = value;
    area.setAttribute("readonly","");
    area.style.position = "fixed";
    area.style.opacity = "0";
    area.style.pointerEvents = "none";
    document.body.appendChild(area);
    area.select();
    area.setSelectionRange(0, area.value.length);
    const ok = document.execCommand("copy");
    area.remove();
    return ok;

  }catch(error){

    console.warn("[DarkStar][copy] fallback failed",error);
    return false;

  }
}

function makeBubble(role){const welcome=document.getElementById('welcome');if(welcome)welcome.remove();const row=document.createElement('div');row.className='message '+role;const avatar=document.createElement('div');avatar.className='message-avatar';avatar.textContent=role==='user'?'你':'✦';const body=document.createElement('div');body.className='message-body';const text=document.createElement('div');text.className='message-text';body.appendChild(text);if(role==='assistant'){const actions=document.createElement('div');actions.className='message-actions';const copyButton=createCopyButton('');actions.appendChild(copyButton);body.appendChild(actions);row.__copyButton=copyButton;}row.appendChild(avatar);row.appendChild(body);inner.appendChild(row);scrollBottom();return text}
function b64(bytes){let s='';const u=new Uint8Array(bytes.buffer,bytes.byteOffset,bytes.byteLength);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(s)}
function u8(base64){const bin=atob(base64),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
function floatToPCM16(inputSamples,inputRate,targetRate=16000){let samples=inputSamples;if(inputRate!==targetRate){const ratio=inputRate/targetRate,outLength=Math.max(1,Math.round(inputSamples.length/ratio)),out=new Float32Array(outLength);for(let i=0;i<outLength;i++){const pos=i*ratio,left=Math.floor(pos),frac=pos-left,a=inputSamples[left]||0,b=inputSamples[Math.min(left+1,inputSamples.length-1)]||a;out[i]=a+(b-a)*frac}samples=out}const pcm=new Int16Array(samples.length);for(let i=0;i<samples.length;i++){const v=Math.max(-1,Math.min(1,samples[i]));pcm[i]=v<0?v*32768:v*32767}return pcm}
async function saveTurn(role,text){text=String(text||'').trim();if(!state.sessionId||!text)return;try{await fetch(SESSION,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'turn',session_id:state.sessionId,sequence_no:++state.sequence,role,content:text})})}catch(e){console.warn('[DarkStar voice] save turn failed',e)}}
function getDarkStarAccessToken(){try{const raw=localStorage.getItem('sb-clcddygkaaqqtsbswgdf-auth-token');if(!raw)return '';const j=JSON.parse(raw);return String(j.access_token||j.currentSession&&j.currentSession.access_token||'').trim()}catch(e){return ''}}
function getDarkStarLiveConnectParams(){const params=new URLSearchParams();params.set('voice',VOICE);params.set('agent_id','technical-dark-star');const topic=(typeof getDarkStarTopicId==='function'?getDarkStarTopicId():'')||'';const conv=(typeof conversationId==='string'&&conversationId.trim())?conversationId.trim():'';if(topic)params.set('topic_id',topic);if(conv)params.set('conversation_id',conv);const token=getDarkStarAccessToken();if(token)params.set('access_token',token);return params}
async function startSession(){try{const token=getDarkStarAccessToken();const topic=(typeof getDarkStarTopicId==='function'?getDarkStarTopicId():'')||'';const conv=(typeof conversationId==='string'&&conversationId.trim())?conversationId.trim():'';const headers={'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;const body={action:'start',voice_profile:VOICE,agent_id:'technical-dark-star'};if(topic)body.topic_id=topic;if(conv)body.conversation_id=conv;const r=await fetch(SESSION,{method:'POST',headers,body:JSON.stringify(body)}),j=await r.json();state.sessionId=j?.session?.id||j?.session_id||j?.id||null;const cid=j?.session?.conversation_id||j?.conversation_id;if(cid&&typeof cid==='string'){conversationId=cid;try{localStorage.setItem('technical_dark_star_conversation_id',cid)}catch(e){}}}catch(e){console.warn('[DarkStar voice] session persistence unavailable',e);state.sessionId=null}}
function playPCM(base64){if(!state.ctx)return;const bytes=u8(base64);if(bytes.byteLength<2)return;const pcm=new Int16Array(bytes.buffer,bytes.byteOffset,Math.floor(bytes.byteLength/2)),f=new Float32Array(pcm.length);for(let i=0;i<pcm.length;i++)f[i]=pcm[i]/32768;const buffer=state.ctx.createBuffer(1,f.length,24000);buffer.copyToChannel(f,0);const source=state.ctx.createBufferSource();source.buffer=buffer;source.connect(state.ctx.destination);const start=Math.max(state.ctx.currentTime,state.nextAudioTime);source.start(start);state.nextAudioTime=start+buffer.duration}
function applyLiveSessionIds(msg){if(!msg||typeof msg!=='object')return;const cid=msg.conversation_id||msg.conversationId||(msg.session&&msg.session.conversation_id)||(msg.live_open&&msg.live_open.conversation_id)||(msg.memory&&msg.memory.conversation_id);const topic=msg.topic_id||msg.topicId||(msg.live_open&&msg.live_open.topic_id);if(typeof cid==='string'&&cid.trim()){conversationId=cid.trim();try{localStorage.setItem('technical_dark_star_conversation_id',conversationId)}catch(e){}}if(typeof topic==='string'&&topic.trim()){try{localStorage.setItem('technical-dark-star-topic-id',topic.trim())}catch(e){}}}
function liveTranscriptText(msg,kind){const c=(msg&&(msg.serverContent||msg.content))||{};const block=kind==='in'?(c.inputTranscription||msg.inputTranscription):(c.outputTranscription||msg.outputTranscription);if(block&&block.text)return String(block.text);if(msg&&msg.type===(kind==='in'?'inputTranscription':'outputTranscription')&&msg.text)return String(msg.text);return ''}
function startMicMeter(){if(!state.analyser)return;let canvas=document.getElementById('voiceWaveCanvas');if(!canvas){canvas=document.createElement('canvas');canvas.id='voiceWaveCanvas';canvas.width=220;canvas.height=28;canvas.style.display='block';canvas.style.margin='6px auto 0';canvas.style.width='220px';canvas.style.height='28px';if(status)status.appendChild(canvas)}const ctx2d=canvas.getContext('2d');const data=new Uint8Array(state.analyser.fftSize);const tick=()=>{if(!state.active||!state.analyser)return;state.analyser.getByteTimeDomainData(data);let sum=0;for(let i=0;i<data.length;i++){const v=(data[i]-128)/128;sum+=v*v}const rms=Math.sqrt(sum/data.length);state.micRms=rms;voiceButton.style.boxShadow=rms>0.02?('0 0 0 '+Math.round(4+rms*18)+'px rgba(17,17,17,'+Math.min(0.35,rms).toFixed(2)+')'):'none';if(ctx2d){ctx2d.clearRect(0,0,canvas.width,canvas.height);ctx2d.fillStyle='#fff';const bars=24;const step=Math.floor(data.length/bars);for(let b=0;b<bars;b++){let peak=0;for(let k=0;k<step;k++){peak=Math.max(peak,Math.abs((data[b*step+k]-128)/128))}const h=Math.max(2,peak*canvas.height);ctx2d.fillRect(4+b*9,canvas.height-h,6,h)}}if(!state.inputText)setStatus(rms>0.02?'正在聆聽……':'正在聆聽…… 無音量',true);state.raf=requestAnimationFrame(tick)};state.raf=requestAnimationFrame(tick)}
async function stopVoice(endSession=true){const wasActive=state.active||state.starting;state.active=false;state.starting=false;if(state.raf){try{cancelAnimationFrame(state.raf)}catch{}}state.raf=0;setMic(false);voiceButton.style.boxShadow='none';try{state.processor?.disconnect()}catch{}try{state.analyser?.disconnect()}catch{}try{state.source?.disconnect()}catch{}try{state.sink?.disconnect()}catch{}try{state.stream?.getTracks().forEach(t=>t.stop())}catch{}try{state.ws?.close()}catch{}try{await state.ctx?.close()}catch{}state.processor=null;state.analyser=null;state.source=null;state.sink=null;state.stream=null;state.ws=null;state.ctx=null;state.nextAudioTime=0;if(endSession&&state.sessionId){try{const token=getDarkStarAccessToken();const headers={'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;await fetch(SESSION,{method:'POST',headers,body:JSON.stringify({action:'end',session_id:state.sessionId})})}catch{}}state.sessionId=null;if(wasActive)setStatus('即時語音已結束',false)}
async function startVoice(){if(state.active||state.starting)return;state.starting=true;setStatus('正在啟動即時語音……');try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('此瀏覽器不支援音訊');if(!navigator.mediaDevices?.getUserMedia)throw new Error('此瀏覽器不允許麥克風存取');state.stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});const track=state.stream.getAudioTracks()[0];if(!track||track.readyState==='ended')throw new Error('沒有取得麥克風音軌');state.ctx=new AC();if(state.ctx.state==='suspended')await state.ctx.resume();startSession();state.ws=new WebSocket(RELAY+'?'+getDarkStarLiveConnectParams().toString());state.ws.onopen=()=>{state.active=true;state.starting=false;state.inputText='';state.outputText='';state.userTextEl=null;state.assistantTextEl=null;setMic(true);setStatus('正在聆聽……');if(state.ctx.state==='suspended')state.ctx.resume();const src=state.ctx.createMediaStreamSource(state.stream),analyser=state.ctx.createAnalyser(),processor=state.ctx.createScriptProcessor(2048,1,1),sink=state.ctx.createGain();analyser.fftSize=2048;sink.gain.value=0;state.source=src;state.analyser=analyser;state.processor=processor;state.sink=sink;src.connect(analyser);analyser.connect(processor);processor.connect(sink);sink.connect(state.ctx.destination);processor.onaudioprocess=event=>{if(!state.active||!state.ws||state.ws.readyState!==WebSocket.OPEN)return;const pcm=floatToPCM16(event.inputBuffer.getChannelData(0),event.inputBuffer.sampleRate,16000);if(!pcm.length)return;try{state.ws.send(JSON.stringify({type:'audio',data:b64(pcm),mimeType:'audio/pcm;rate=16000'}));state.pcmSent=(state.pcmSent||0)+1}catch{}};startMicMeter()};state.ws.onmessage=async event=>{let msg;try{msg=JSON.parse(event.data)}catch{return}applyLiveSessionIds(msg);if(msg?.error?.message){console.error('[DarkStar voice]',msg.error.message);setStatus('語音連線錯誤：'+msg.error.message);return}const inText=liveTranscriptText(msg,'in');const outText=liveTranscriptText(msg,'out');const content=msg.serverContent||{};if(inText){state.inputText+=inText;if(!state.userTextEl)state.userTextEl=makeBubble('user');state.userTextEl.textContent=state.inputText;try{input.value=state.inputText;input.dispatchEvent(new Event('input',{bubbles:true}))}catch(e){}scrollBottom()}if(outText){state.outputText+=outText;if(!state.assistantTextEl){state.assistantTextEl=makeBubble('assistant')}state.assistantTextEl.textContent=state.outputText;const assistantRow=state.assistantTextEl.parentElement?.parentElement;if(assistantRow?.__copyButton){const copyButton=assistantRow.__copyButton;copyButton.onclick=async event=>{event.preventDefault();event.stopPropagation();const ok=await copyTextToClipboard(state.outputText);if(ok){copyButton.textContent='✓';copyButton.title='已複製';setTimeout(()=>{copyButton.textContent='📋';copyButton.title='複製'},1200)}else{copyButton.title='複製失敗，請長按文字複製'}};copyButton.textContent='📋';copyButton.title='複製'}scrollBottom()}if(content.modelTurn?.parts)for(const part of content.modelTurn.parts)if(part?.inlineData?.data)playPCM(part.inlineData.data);if(content.interrupted)state.nextAudioTime=0;if(content.turnComplete){const u=state.inputText,a=state.outputText;if(u)await saveTurn('user',u);if(a)await saveTurn('assistant',a);state.inputText='';state.outputText='';state.userTextEl=null;state.assistantTextEl=null;if(state.active)setStatus('正在聆聽……')}};state.ws.onerror=()=>setStatus('即時語音連線發生錯誤');state.ws.onclose=()=>{if(state.active)stopVoice(false)}}catch(error){state.starting=false;console.error('[DarkStar voice] start failed',error);setStatus(error?.message||'即時語音啟動失敗');await stopVoice(false)}}

send.addEventListener('click',event=>{if(!state.active)return;event.preventDefault();event.stopImmediatePropagation();const text=input.value.trim();if(!text)return;if(state.ws?.readyState===WebSocket.OPEN){state.ws.send(JSON.stringify({type:'text',text}));if(!state.userTextEl)state.userTextEl=makeBubble('user');state.userTextEl.textContent=text;state.inputText=text;input.value='';input.dispatchEvent(new Event('input',{bubbles:true}));scrollBottom()}},true);
