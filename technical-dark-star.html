<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Technical Dark Star</title>
</head>
<body>
<p id="restoreStatus" style="font-family:sans-serif;padding:24px;color:#444">正在連接暗星…</p>
<script>
(async function () {
  const sources = [
    "https://raw.githubusercontent.com/m9wmtcb782-arch/AIVAULT/ece64b65d112fc15802b97507a886805b43ba552/technical-dark-star.html",
    "https://cdn.jsdelivr.net/gh/m9wmtcb782-arch/AIVAULT@ece64b65d112fc15802b97507a886805b43ba552/technical-dark-star.html"
  ];
  let html = "";
  let lastError = "";
  for (const url of sources) {
    try {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const candidate = await res.text();
      if (candidate && candidate.includes("createLoadingMessage") && candidate.includes("Technical Dark Star")) {
        html = candidate;
        break;
      }
      throw new Error("備份內容不完整");
    } catch (err) {
      lastError = err && err.message ? err.message : String(err);
    }
  }
  if (!html) {
    document.getElementById("restoreStatus").textContent =
      "暗星載入失敗：" + lastError + "。請重新整理，不要清除資料。";
    return;
  }
  // Keep the verified Dark Star page intact; only attach the current My Voice module.
  html = html.replace('</body>', '<script src="technical-dark-star-my-voice.js?v=24"></script></body>');
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
