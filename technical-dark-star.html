<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AIVAULT AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
      background: #0b0f19;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       Header
    ========================= */

    .header {
      height: 64px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #252b3a;
      background: #111624;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #9ca3af;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #666;
    }

    .status-dot.online {
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    .status-dot.busy {
      background: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
    }

    .status-dot.error {
      background: #ef4444;
    }

    /* =========================
       Chat
    ========================= */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px 120px;
    }

    .messages {
      max-width: 900px;
      margin: auto;
    }

    .message {
      display: flex;
      margin-bottom: 20px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 80%;
      padding: 14px 17px;
      border-radius: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .bubble {
      background: #2563eb;
      border-bottom-right-radius: 4px;
    }

    .ai .bubble {
      background: #171d2b;
      border: 1px solid #272e3e;
      border-bottom-left-radius: 4px;
    }

    .ai-name {
      font-size: 12px;
      color: #8b93a7;
      margin-bottom: 5px;
    }

    /* =========================
       Loading
    ========================= */

    .typing {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: #9ca3af;
      border-radius: 50%;
      animation: typing 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        opacity: .25;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    /* =========================
       Input
    ========================= */

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 15px;
      background:
        linear-gradient(
          transparent,
          #0b0f19 20%
        );
    }

    .input-box {
      max-width: 900px;
      margin: auto;
      display: flex;
      gap: 10px;
      background: #151b29;
      border: 1px solid #2a3142;
      border-radius: 16px;
      padding: 10px;
    }

    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: white;
      font-size: 16px;
      line-height: 1.5;
      min-height: 44px;
      max-height: 150px;
      padding: 10px;
      font-family: inherit;
    }

    textarea::placeholder {
      color: #687084;
    }

    button {
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      width: 48px;
      height: 48px;
      cursor: pointer;
      font-size: 20px;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    /* =========================
       Error
    ========================= */

    .error {
      color: #fca5a5;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .bubble {
        max-width: 88%;
      }

      .header {
        padding: 0 15px;
      }

      .chat {
        padding-left: 10px;
        padding-right: 10px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="logo">
      AIVAULT AI
    </div>

    <div class="status">
      <span
        id="statusDot"
        class="status-dot"
      ></span>

      <span id="statusText">
        Gateway 連線中
      </span>
    </div>
  </header>


  <main
    id="chat"
    class="chat"
  >
    <div
      id="messages"
      class="messages"
    >

      <div class="message ai">
        <div>
          <div class="ai-name">
            AIVAULT AI
          </div>

          <div class="bubble">
            你好，我是 AIVAULT AI。
            
            請輸入你的問題。
          </div>
        </div>
      </div>

    </div>
  </main>


  <div class="input-area">

    <div class="input-box">

      <textarea
        id="input"
        placeholder="輸入訊息..."
        rows="1"
      ></textarea>

      <button
        id="send"
        onclick="sendMessage()"
      >
        ↑
      </button>

    </div>

  </div>

</div>


<script>

/* ============================================================
   AIVAULT AI GATEWAY
   ============================================================

   把下面這個 URL 改成你的 Supabase Edge Function URL。

   例如：

   https://你的專案.supabase.co/functions/v1/ai-gateway

   ============================================================ */

const AIVAULT_AI_GATEWAY_URL =
  "https://YOUR_PROJECT.supabase.co/functions/v1/ai-gateway";


/* ============================================================
   Chat State
   ============================================================ */

const conversation = [];


/* ============================================================
   DOM
   ============================================================ */

const input =
  document.getElementById("input");

const sendButton =
  document.getElementById("send");

const messages =
  document.getElementById("messages");

const statusDot =
  document.getElementById("statusDot");

const statusText =
  document.getElementById("statusText");


/* ============================================================
   Status
   ============================================================ */

function setStatus(
  type,
  text
) {
  statusDot.className =
    "status-dot";

  if (type) {
    statusDot.classList.add(type);
  }

  statusText.textContent =
    text;
}


/* ============================================================
   Add Message
   ============================================================ */

function addMessage(
  role,
  content
) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    `message ${role}`;


  const inner =
    document.createElement("div");


  if (role === "ai") {

    const name =
      document.createElement("div");

    name.className =
      "ai-name";

    name.textContent =
      "AIVAULT AI";

    inner.appendChild(name);
  }


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    content;


  inner.appendChild(bubble);

  wrapper.appendChild(inner);

  messages.appendChild(wrapper);

  scrollToBottom();

  return bubble;
}


/* ============================================================
   Typing Indicator
   ============================================================ */

function addTyping() {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message ai";

  wrapper.id =
    "typingMessage";


  const inner =
    document.createElement("div");


  const name =
    document.createElement("div");

  name.className =
    "ai-name";

  name.textContent =
    "AIVAULT AI";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  const typing =
    document.createElement("div");

  typing.className =
    "typing";


  typing.innerHTML =
    `
      <span></span>
      <span></span>
      <span></span>
    `;


  bubble.appendChild(typing);

  inner.appendChild(name);

  inner.appendChild(bubble);

  wrapper.appendChild(inner);

  messages.appendChild(wrapper);

  scrollToBottom();
}


function removeTyping() {

  const element =
    document.getElementById(
      "typingMessage"
    );

  if (element) {
    element.remove();
  }
}


/* ============================================================
   Scroll
   ============================================================ */

function scrollToBottom() {

  const chat =
    document.getElementById(
      "chat"
    );

  chat.scrollTop =
    chat.scrollHeight;
}


/* ============================================================
   Send Message
   ============================================================ */

async function sendMessage() {

  const text =
    input.value.trim();

  if (!text) {
    return;
  }


  if (
    AIVAULT_AI_GATEWAY_URL.includes(
      "YOUR_PROJECT"
    )
  ) {

    addMessage(
      "ai",
      "尚未設定 AIVAULT AI Gateway URL。"
    );

    return;
  }


  input.value = "";

  input.style.height =
    "44px";

  sendButton.disabled =
    true;


  /* -------------------------
     顯示使用者訊息
  ------------------------- */

  addMessage(
    "user",
    text
  );


  /* -------------------------
     加入對話歷史
  ------------------------- */

  conversation.push({
    role: "user",
    content: text
  });


  addTyping();

  setStatus(
    "busy",
    "AI 回答中"
  );


  try {

    const response =
      await fetch(
        AIVAULT_AI_GATEWAY_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              /*
               * Gateway v2.6 支援
               * messages
               */

              messages:
                conversation,

              /*
               * 明確指定 Provider。
               *
               * Gateway 會：
               *
               * Gemini Key1
               * ↓
               * Gemini Key2
               * ↓
               * ...
               * ↓
               * Groq
               */

              provider:
                "gemini",

              /*
               * 使用 Gemini 預設模型。
               * Failover 到 Groq 時，
               * Gateway 自動切換 Groq model。
               */

              model:
                "gemini-3.6-flash",

              agent:
                "aivault-chat",

              temperature:
                0.2,

              max_tokens:
                4096

            })
        }
      );


    const data =
      await response.json();


    removeTyping();


    /* -------------------------
       Gateway 失敗
    ------------------------- */

    if (
      !response.ok ||
      !data.success
    ) {

      const errorMessage =
        data.message ||
        data.error ||
        "AI 執行失敗";

      addMessage(
        "ai",
        `AI 執行失敗：${errorMessage}`
      );

      setStatus(
        "error",
        "Gateway 發生錯誤"
      );

      return;
    }


    /* -------------------------
       AI Answer
    ------------------------- */

    const answer =
      data.content ||
      "AI 沒有返回內容。";


    addMessage(
      "ai",
      answer
    );


    /* -------------------------
       加入 AI 歷史
    ------------------------- */

    conversation.push({
      role: "assistant",
      content: answer
    });


    /* -------------------------
       Gateway 狀態
    ------------------------- */

    if (
      data.fallback
    ) {

      setStatus(
        "online",
        `AI Online · ${data.provider}`
      );

    } else {

      setStatus(
        "online",
        "AI Online"
      );
    }


  } catch (error) {

    removeTyping();


    console.error(
      "AIVAULT Gateway Error:",
      error
    );


    addMessage(
      "ai",
      "無法連接 AIVAULT AI Gateway。請確認 Gateway URL 與 Edge Function 狀態。"
    );


    setStatus(
      "error",
      "Gateway 無法連線"
    );


  } finally {

    sendButton.disabled =
      false;

    input.focus();
  }
}


/* ============================================================
   Enter
   ============================================================ */

input.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();
    }

  }
);


/* ============================================================
   Auto Resize
   ============================================================ */

input.addEventListener(
  "input",
  function() {

    this.style.height =
      "auto";

    this.style.height =
      Math.min(
        this.scrollHeight,
        150
      ) + "px";
  }
);


/* ============================================================
   Gateway Health Check
   ============================================================ */

async function checkGateway() {

  if (
    AIVAULT_AI_GATEWAY_URL.includes(
      "YOUR_PROJECT"
    )
  ) {

    setStatus(
      "error",
      "尚未設定 Gateway"
    );

    return;
  }


  try {

    const response =
      await fetch(
        AIVAULT_AI_GATEWAY_URL +
        "?health=1"
      );


    const data =
      await response.json();


    if (
      response.ok &&
      data.success
    ) {

      setStatus(
        "online",
        `Gateway Online · Gemini ${data.provider_pool.gemini_keys} / Groq ${data.provider_pool.groq_keys}`
      );

    } else {

      setStatus(
        "error",
        "Gateway Offline"
      );
    }

  } catch {

    setStatus(
      "error",
      "Gateway 無法連線"
    );
  }
}


/* ============================================================
   Start
   ============================================================ */

checkGateway();

</script>

</body>
</html>
