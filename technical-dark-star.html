<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Technical Dark Star</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#fff;
  color:#202123;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
    "Noto Sans TC","PingFang TC",sans-serif;
}

button,textarea,input{font:inherit}
button{cursor:pointer}
body{overflow:hidden}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:#fff;
}

/* =========================================================
   TOP
========================================================= */

.topbar{
  height:58px;
  min-height:58px;
  display:flex;
  align-items:center;
  padding:0 14px;
  border-bottom:1px solid #eee;
  background:rgba(255,255,255,.96);
  position:relative;
  z-index:30;
}

.menu-button{
  width:38px;
  height:38px;
  border:0;
  background:transparent;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#303030;
}

.menu-button:hover{
  background:#f3f3f3;
}

.brand{
  margin-left:7px;
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.brand-mark{
  width:28px;
  height:28px;
  border-radius:8px;
  background:linear-gradient(135deg,#ff3b30,#ff9500,#ffcc00,#34c759,#0a84ff,#5856d6,#af52de,#ff2d55) !important;
  background-size:300% 300% !important;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:600;
  animation:aivaultLogoColorShift 6s ease-in-out infinite;
}

.brand-title{
  font-size:15px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.brand-engine{
  font-size:12px;
  color:#8b8b8b;
}

.brand-home{
  margin-left:auto;
  border:1px solid #e5e5e5;
  background:#fff;
  color:#333;
  border-radius:9px;
  padding:7px 10px;
  font-size:12px;
  text-decoration:none;
}

.brand-home:hover{
  background:#f4f4f4;
}

/* =========================================================
   CHAT
========================================================= */

.main{
  flex:1;
  min-height:0;
  position:relative;
  display:flex;
}

.chat{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:#fff;
}

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  scroll-behavior:smooth;
}

.messages-inner{
  width:min(760px,calc(100% - 32px));
  margin:0 auto;
  padding:34px 0 150px;
}

/* =========================================================
   SCROLL TO LATEST
========================================================= */

.scroll-latest{
  position:absolute;
  right:18px;
  bottom:112px;
  width:42px;
  height:42px;
  border:1px solid #dedede;
  border-radius:50%;
  background:rgba(255,255,255,.97);
  color:#333;
  box-shadow:0 3px 14px rgba(0,0,0,.12);
  display:none;
  align-items:center;
  justify-content:center;
  font-size:21px;
  line-height:1;
  z-index:25;
}

.scroll-latest.show{
  display:flex;
}

.scroll-latest:hover{
  background:#f5f5f5;
}

@media(max-width:700px){
  .scroll-latest{
    right:12px;
    bottom:108px;
  }
}

/* =========================================================
   WELCOME
========================================================= */

.welcome{
  min-height:calc(100dvh - 220px);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px 0;
}

.welcome-content{
  width:100%;
}

.welcome-mark{
  width:54px;
  height:54px;
  margin:0 auto 22px;
  border-radius:16px;
  background:#171717;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.welcome-title{
  margin:0;
  font-size:30px;
  font-weight:600;
  letter-spacing:-.7px;
}

.welcome-subtitle{
  margin:13px auto 0;
  max-width:570px;
  font-size:15px;
  line-height:1.75;
  color:#777;
}

/* =========================================================
   MESSAGE
========================================================= */

.message{
  display:flex;
  gap:13px;
  margin-bottom:30px;
}

.message.user{
  justify-content:flex-end;
}

.message-avatar{
  width:30px;
  height:30px;
  min-width:30px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:600;
  background:#171717;
  color:#fff;
  margin-top:2px;
}

.message.user .message-avatar{
  background:#e9e9e9;
  color:#444;
  animation:none;
}

.message-body{
  min-width:0;
  max-width:690px;
}

.message.user .message-body{
  max-width:min(600px,82%);
}

.message-text{
  font-size:16px;
  line-height:1.75;
  white-space:normal;
  word-break:break-word;
}

.message.user .message-text{
  background:#f4f4f4;
  border-radius:18px;
  padding:10px 15px;
}

.message-actions{
  margin-top:8px;
  display:flex;
  gap:4px;
}

.message-action{
  width:31px;
  height:31px;
  border:0;
  background:transparent;
  border-radius:8px;
  color:#777;
  display:flex;
  align-items:center;
  justify-content:center;
}

.message-action:hover{
  background:#f2f2f2;
  color:#222;
}

.message-action.danger:hover{
  background:#fdeaea;
  color:#dc2626;
}

/* =========================================================
   MEDIA
========================================================= */

.media-stack{
  margin-top:8px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.media-image,
.media-video{
  display:block;
  max-width:min(420px,100%);
  max-height:320px;
  border-radius:14px;
  border:1px solid #e8e8e8;
  background:#f7f7f7;
  object-fit:contain;
}

.media-article{
  margin-top:8px;
  padding:12px 14px;
  border:1px solid #e8e8e8;
  border-radius:14px;
  background:#fafafa;
  font-size:14px;
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-word;
}

.media-article a{
  color:#155eef;
}

/* =========================================================
   SANDBOX
========================================================= */

.sandbox-card{
  margin-top:15px;
  border:1px solid #e4e4e4;
  border-radius:14px;
  overflow:hidden;
  background:#fff;
}

.sandbox-head{
  min-height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:7px 10px 7px 14px;
  border-bottom:1px solid #ededed;
}

.sandbox-title{
  font-size:13px;
  font-weight:600;
}

.sandbox-tabs{
  display:flex;
  gap:3px;
}

.sandbox-tab{
  border:0;
  background:transparent;
  color:#777;
  border-radius:7px;
  padding:6px 9px;
  font-size:11px;
}

.sandbox-tab.active{
  background:#eee;
  color:#222;
}

.sandbox-body{
  height:420px;
}

.sandbox-view{
  display:none;
  width:100%;
  height:100%;
}

.sandbox-view.active{
  display:block;
}

.sandbox-empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#888;
  padding:30px;
}

.sandbox-empty-title{
  color:#555;
  font-size:14px;
  margin-bottom:7px;
}

.sandbox-empty-text{
  font-size:12px;
  line-height:1.6;
}

.sandbox-frame{
  width:100%;
  height:100%;
  border:0;
  background:#fff;
}

.sandbox-code{
  width:100%;
  height:calc(100% - 42px);
  border:0;
  outline:0;
  resize:none;
  background:#101114;
  color:#ddd;
  padding:15px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,
    Consolas,monospace;
  font-size:13px;
  line-height:1.6;
}

.sandbox-code-tools{
  height:42px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  background:#181a1f;
  border-bottom:1px solid #292c31;
}

.sandbox-file{
  color:#aaa;
  font-size:11px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.sandbox-copy{
  border:1px solid #373a40;
  background:#22252b;
  color:#eee;
  border-radius:6px;
  padding:5px 9px;
  font-size:11px;
  white-space:nowrap;
}

.sandbox-copy:hover{
  background:#2c3037;
}

/* =========================================================
   GATES
========================================================= */

.gate-card{
  margin-top:15px;
  border:1px solid #e5e5e5;
  border-radius:14px;
  overflow:hidden;
}

.gate-head{
  padding:13px 14px;
  border-bottom:1px solid #eee;
  font-size:13px;
  font-weight:600;
}

.gate-list{
  padding:9px 14px 12px;
}

.gate-row{
  display:flex;
  align-items:flex-start;
  gap:9px;
  padding:7px 0;
}

.gate-icon{
  width:20px;
  height:20px;
  min-width:20px;
  border-radius:50%;
  background:#eee;
  color:#999;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
}

.gate-row.running .gate-icon{
  background:#e9f0ff;
  color:#2563eb;
}

.gate-row.completed .gate-icon{
  background:#e7f7ef;
  color:#15803d;
}

.gate-row.failed .gate-icon{
  background:#fdeaea;
  color:#dc2626;
}

.gate-name{
  font-size:12px;
  font-weight:500;
}

.gate-status{
  margin-top:2px;
  color:#888;
  font-size:11px;
}

/* =========================================================
   COMPOSER
========================================================= */

.composer-area{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:10px 16px max(16px,env(safe-area-inset-bottom));
  background:linear-gradient(
    to bottom,
    rgba(255,255,255,0),
    rgba(255,255,255,.94) 22%,
    #fff 45%
  );
  pointer-events:none;
}

.composer{
  width:min(760px,100%);
  margin:0 auto;
  pointer-events:auto;
  border:1px solid #d9d9d9;
  border-radius:25px;
  background:#fff;
  box-shadow:0 3px 14px rgba(0,0,0,.06);
  overflow:hidden;
}

.attachment-preview{
  display:none;
  padding:9px 12px 0;
  gap:7px;
  flex-wrap:wrap;
}

.attachment-preview.show{
  display:flex;
}

.attachment-chip{
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 9px;
  background:#f4f4f4;
  border-radius:9px;
  font-size:11px;
  color:#555;
  max-width:230px;
}

.attachment-chip-name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.attachment-remove{
  border:0;
  background:transparent;
  color:#888;
  padding:0;
  font-size:14px;
}

.attachment-chip img{
  width:28px;
  height:28px;
  object-fit:cover;
  border-radius:6px;
}

.composer-row{
  min-height:54px;
  display:flex;
  align-items:flex-end;
  gap:5px;
  padding:6px 7px;
}

.composer-plus,
.composer-mic{
  width:39px;
  height:39px;
  min-width:39px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#444;
  display:flex;
  align-items:center;
  justify-content:center;
}

.composer-plus:hover,
.composer-mic:hover{
  background:#f1f1f1;
}

.composer-mic.recording{
  background:#f0f0f0;
  color:#111;
}

.composer-input{
  flex:1;
  min-height:39px;
  max-height:180px;
  resize:none;
  border:0;
  outline:0;
  padding:9px 7px;
  background:transparent;
  font-size:16px;
  line-height:1.45;
}

.composer-input::placeholder{
  color:#9a9a9a;
}

.composer-send{
  width:39px;
  height:39px;
  min-width:39px;
  border:0;
  border-radius:50%;
  background:#171717;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.composer-send:disabled{
  opacity:.35;
  cursor:default;
}

/* =========================================================
   ATTACH MENU
========================================================= */

.attach-menu{
  position:fixed;
  left:16px;
  bottom:90px;
  width:230px;
  padding:7px;
  background:#fff;
  border:1px solid #e5e5e5;
  border-radius:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.12);
  display:none;
  z-index:100;
}

.attach-menu.show{
  display:block;
}

.attach-option{
  width:100%;
  border:0;
  background:transparent;
  border-radius:9px;
  padding:11px;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  font-size:13px;
  color:#333;
}

.attach-option:hover{
  background:#f3f3f3;
}

/* =========================================================
   DRAWER
========================================================= */

.drawer-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.22);
  opacity:0;
  visibility:hidden;
  transition:.18s;
  z-index:80;
}

.drawer-backdrop.show{
  opacity:1;
  visibility:visible;
}

.drawer{
  position:fixed;
  top:0;
  bottom:0;
  left:0;
  width:min(310px,88vw);
  background:#fff;
  box-shadow:8px 0 30px rgba(0,0,0,.12);
  transform:translateX(-105%);
  transition:.2s;
  z-index:90;
  display:flex;
  flex-direction:column;
}

.drawer.show{
  transform:translateX(0);
}

.drawer-top{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  border-bottom:1px solid #eee;
}

.drawer-brand{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:14px;
  font-weight:600;
}

.drawer-close{
  width:36px;
  height:36px;
  border:0;
  background:transparent;
  border-radius:9px;
}

.drawer-close:hover{
  background:#f2f2f2;
}

.new-chat{
  margin:12px;
  height:42px;
  border:1px solid #dedede;
  background:#fff;
  border-radius:10px;
  text-align:left;
  padding:0 13px;
  font-size:13px;
}

.new-chat:hover{
  background:#f5f5f5;
}

.history{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:3px 9px 20px;
}

.history-label{
  padding:12px 8px 6px;
  color:#999;
  font-size:11px;
}

.history-item-wrap{
  display:flex;
  align-items:center;
  gap:4px;
}

.history-item-wrap .history-item{
  flex:1;
}

.history-item{
  width:100%;
  border:0;
  background:transparent;
  border-radius:9px;
  padding:10px 9px;
  text-align:left;
  color:#333;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover{
  background:#f2f2f2;
}

.history-del{
  width:28px;
  min-width:28px;
  height:28px;
  border:0;
  background:transparent;
  color:#aaa;
  border-radius:7px;
  font-size:14px;
}

.history-del:hover{
  background:#fdeaea;
  color:#dc2626;
}

.drawer-bottom{
  border-top:1px solid #eee;
  padding:9px;
}

.drawer-item{
  width:100%;
  border:0;
  background:transparent;
  border-radius:9px;
  padding:10px;
  text-align:left;
  font-size:13px;
  color:#444;
}

.drawer-item:hover{
  background:#f3f3f3;
}

/* =========================================================
   VOICE
========================================================= */

/* AIVAULT_DARK_STAR_WORK_LOCATION_V1 */
.dark-star-work-location{
  display:block;
  margin-top:4px;
  color:#777;
  font-size:13px;
  line-height:1.45;
  word-break:break-word;
}
@media(max-width:700px){
  .dark-star-work-location{font-size:13px;}
}

.voice-status{
  position:fixed;
  left:50%;
  bottom:105px;
  transform:translateX(-50%);
  padding:10px 15px;
  background:#171717;
  color:#fff;
  border-radius:20px;
  font-size:12px;
  display:none;
  z-index:120;
}

.voice-status.show{
  display:block;
}

.hidden-file{
  display:none;
}

.icon{
  width:20px;
  height:20px;
  display:block;
}

.icon-small{
  width:18px;
  height:18px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  .brand-engine{
    display:none;
  }

  .messages-inner{
    width:calc(100% - 24px);
    padding-top:25px;
  }

  .welcome{
    min-height:calc(100dvh - 220px);
  }

  .welcome-title{
    font-size:25px;
  }

  .welcome-subtitle{
    font-size:14px;
  }

  .message-text{
    font-size:16px;
  }

  .sandbox-body{
    height:360px;
  }

  .composer-area{
    padding-left:9px;
    padding-right:9px;
  }

  .composer{
    border-radius:22px;
  }

  .attach-menu{
    left:9px;
    bottom:88px;
  }
}


@keyframes aivaultLogoColorShift{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* AIVAULT_DARK_STAR_AVATAR_COLOR_SHIFT_V1 */
.message.ai .message-avatar{
  width:36px;
  height:36px;
  min-width:36px;
  border-radius:10px;
  background:linear-gradient(135deg,#ff3b30,#ff9500,#ffcc00,#34c759,#0a84ff,#5856d6,#af52de,#ff2d55) !important;
  background-size:300% 300% !important;
  color:#fff !important;
  font-size:20px;
  font-weight:800;
  text-shadow:0 1px 2px rgba(0,0,0,.28);
  animation:aivaultLogoColorShift 6s ease-in-out infinite;
  border:0;
}

/* AIVAULT_WHITE_BUTTONS_V1 */
button,
a.brand-home,
.composer-plus,
.composer-mic,
.composer-send,
.attach-option,
.sandbox-tab,
.sandbox-copy,
.drawer-close,
.new-chat,
.history-item,
.history-del,
.drawer-item,
.message-action{
  background:#fff !important;
  color:#111 !important;
  border-color:#ddd !important;
}

.brand-mark,
.welcome-mark,
.drawer-brand .brand-mark{
  background:linear-gradient(135deg,#ff3b30,#ff9500,#ffcc00,#34c759,#0a84ff,#5856d6,#af52de,#ff2d55) !important;
  background-size:300% 300% !important;
  color:#fff !important;
  text-shadow:0 0 8px rgba(255,255,255,.85),0 0 16px rgba(255,80,180,.55);
  box-shadow:0 0 10px rgba(255,59,48,.45),0 0 18px rgba(10,132,255,.35),0 0 28px rgba(175,82,222,.28);
  animation:aivaultLogoColorShift 6s ease-in-out infinite;
}
button:hover,
a.brand-home:hover,
.composer-plus:hover,
.composer-mic:hover,
.composer-send:hover,
.attach-option:hover,
.sandbox-tab:hover,
.sandbox-copy:hover,
.drawer-close:hover,
.new-chat:hover,
.history-item:hover,
.drawer-item:hover,
.message-action:hover{
  background:#f5f5f5 !important;
  color:#111 !important;
}

.composer-send:disabled{
  background:#fff !important;
  color:#777 !important;
  opacity:.5;
}


/* AIVAULT_DARK_STAR_READABILITY_V1 */
.message-text{
  font-size:20px !important;
  line-height:1.8 !important;
}
.message.user .message-text{
  padding:11px 16px;
}
.media-article{
  font-size:18px !important;
  line-height:1.8 !important;
}
.composer-input{
  font-size:19px !important;
  line-height:1.55 !important;
}
.brand-title{font-size:16px !important;}
.brand-engine{font-size:13px !important;}
.history-item,.drawer-item,.new-chat,.attach-option{font-size:16px !important;}
.voice-status{font-size:15px !important;}
@media(max-width:700px){
  .message-text{font-size:19px !important;line-height:1.8 !important;}
  .welcome-subtitle{font-size:17px !important;line-height:1.8 !important;}
  .composer-input{font-size:19px !important;}
  .history-item,.drawer-item,.new-chat,.attach-option{font-size:16px !important;}
}

/* AIVAULT_DARK_STAR_LARGE_TEXT_MODE_V1 */
.readability-toggle{
  margin-left:8px;
  border:1px solid #ddd;
  background:#fff;
  color:#111;
  border-radius:9px;

  "paste",
  async event=>{

    const clipboard =
      event.clipboardData;

    if(!clipboard){
      return;
    }

    const files = [];

    if(
      clipboard.files &&
      clipboard.files.length
    ){

      Array.from(
        clipboard.files
      ).forEach(
        file=>files.push(file)
      );

    }


    Array.from(
      clipboard.items || []
    ).forEach(item=>{

      if(item.kind === "file"){

        const file =
          item.getAsFile();

        if(
          file &&
          !files.includes(file)
        ){

          files.push(file);

        }

      }

    });


    if(files.length){

      event.preventDefault();

      await addFilesFromList(
        files
      );

      return;
    }


    const pasted =
      clipboard.getData(
        "text/plain"
      );


    if(
      pasted &&
      pasted.length > 800 &&
      document.activeElement !== input
    ){

      event.preventDefault();

      const file =
        new File(
          [pasted],
          "pasted-article.txt",
          {
            type:"text/plain"
          }
        );

      await addFilesFromList(
        [file]

    }

  }
);

async function prepareAttachment(
  file
){

  const base = {

    name:
      file.name,

    type:
      file.type ||
      "application/octet-stream",

    size:
      file.size

  };


  const textTypes = [

    "text/plain",
    "text/markdown",
    "application/json",
    "text/javascript",
    "application/javascript",
    "text/css",
    "text/html"

  ];


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const textExtensions = [

    "txt",
    "md",
    "json",
    "js",
    "ts",
    "jsx",
    "tsx",
    "html",
    "css",
    "csv",
    "xml",
    "yml",
    "yaml"

  ];


  if(
    textTypes.includes(
      file.type
    ) ||
    textExtensions.includes(
      extension
    )
  ){

    const content =
      await file.text();

    return {

      ...base,

      content_type:
        ["md","txt","html"]
          .includes(extension)
          ? "article"
          : "text",

      content,

      preview:
        content.slice(0,4000)

    };

  }


  if(
    file.type.startsWith(
      "image/"
    ) ||
    [
      "png",
      "jpg",
      "jpeg",
      "gif",
      "webp",
      "bmp",
      "svg"
    ].includes(extension)
  ){

    const preview =
      await readAsDataURL(
        file
      );

    return {

      ...base,

      content_type:
        "image",

      content_base64:
        preview,

      preview

    };

  }


  if(
    file.type.startsWith(
      "video/"
    ) ||
    [
      "mp4",
      "webm",
      "mov"
    ].includes(extension)
  ){

    if(
      file.size >
      3.5 * 1024 * 1024
    ){

      throw new Error(
        "影片超過 3.5MB。手機影片可能太大，請改拍更短的影片，或先使用照片。"
      );

    }

    const preview =
      await readAsDataURL(
        file
      );

    return {

      ...base,

      content_type:
        "video",

      content_base64:
        preview,

      preview

    };

  }


  if(
    file.type ===
      "application/pdf" ||
    extension === "pdf"
  ){

    return {

      ...base,

      content_type:
        "article",

      preview_kind:
        "pdf",

      content:
        "[PDF] " +
        file.name

    };

  }


  return {

    ...base,

    content_type:
      "file"

  };

}


function readAsDataURL(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload =
        ()=>resolve(
          reader.result
        );

      reader.onerror =
        ()=>reject(
          new Error(
            "無法讀取檔案"
          )
        );

      reader.readAsDataURL(
        file
      );

    }
  );

}


function renderAttachments(){

  if(!attachments.length){

    attachmentPreview.classList.remove(

function getFileIcon(type){

  if(
    type?.startsWith(
      "image/"
    )
  ){
    return "圖片";
  }

  if(
    type ===
      "application/pdf"
  ){
    return "PDF";
  }

  if(
    type?.startsWith(
      "video/"
    )
  ){
    return "MP4";
  }

  if(
    type?.startsWith(
      "audio/"
    )
  ){
    return "WAV";
  }

  return "檔案";
}

      ){

        parts.push(
          "（已附加影片：" +
          (file.name || "video") +
          "）"
        );

      }else if(
        file.content_type ===

          "text"
      ){

function logGatewaySchema(data){

  try{

    if(
      !data ||
      typeof data !==

    ){

      console.info(
        "[DarkStar][gateway-schema]",
        typeof data
      );

      return;

    }


    const keys =
      Object.keys(data)
        .map(key=>({

          key,

          type:
            Array.isArray(
              data[key]
            )
              ? "array"
              : typeof data[key]

        }));


    console.info(
      "[DarkStar][gateway-schema]",
      {

        keys,

        success:
          data.success,

        provider:
          data.provider,

        model:
          data.model,

        hasContent:
          typeof data.content ===
            "string",

        hasText:
          typeof data.text ===
            "string",

          data.memory || null

      }
    );

  }catch(error){

    console.info(
      "[DarkStar][gateway-schema] log failed"
    );

  }

}


function extractTextValue(
  value,
  depth = 0
){

  if(value == null){
    return null;
  }


  if(
    typeof value ===
      "string"
  ){

    const text =
      value.trim();

    return text
      ? text
      : null;

  }


  if(
    typeof value ===
      "number" ||
    typeof value ===
      "boolean"
  ){

    return String(value);

  }


  if(depth > 6){
    return null;
  }


  if(Array.isArray(value)){

    const parts =
      value
        .map(
          item =>
            extractTextValue(
              item,
              depth + 1
            )
        )
        .filter(Boolean);

    return parts.length
      ? parts.join("\n")
      : null;

  }


  if(
    typeof value ===
      "object"
  ){

    const preferred = [

      "content",
      "text",
      "reply",
      "response",
      "answer",
      "output",
      "message"

    ];


    for(
      const key of preferred
    ){

      if(
        !(key in value)
      ){
        continue;
      }


      if(
        key === "message" &&
        typeof value[key] !==
          "string"
      ){

        const nested =
          extractTextValue(
            value[key],
            depth + 1
          );

        if(nested){
          return nested;
        }

        continue;

      }


      const found =
        extractTextValue(
          value[key],
          depth + 1
        );

      if(found){
        return found;
      }

    }


    if(
      Array.isArray(
        value.choices
      ) &&
      value.choices[0]
    ){

      const choice =
        value.choices[0];

      const found =
        extractTextValue(

          choice.message?.content ??
          choice.text ??
          choice.content ??
          choice,

          depth + 1

        );

      if(found){
        return found;
      }

    }


    if(
      Array.isArray(
        value.candidates
      ) &&
      value.candidates[0]
    ){

      const candidate =
        value.candidates[0];

      const found =
        extractTextValue(

          candidate.content ??
          candidate,

          depth + 1

        );

      if(found){
        return found;
      }

    }


    if(
      Array.isArray(
        value.parts
      )
    ){

      const parts =
        value.parts

          .map(
            part =>
              extractTextValue(
                part?.text ??
                part,
                depth + 1
              )
          )

          .filter(Boolean);

      if(parts.length){

        return parts.join(
          "\n"
        );

      }

    }

  }


  return null;
}


function getAIReply(data){

  if(!data){
    return null;
  }


  logGatewaySchema(data);


  const direct =
    extractTextValue(

      {

        content:
          data.content,

        text:
          data.text,

        reply:
          data.reply,

        response:
          typeof data.response ===
            "string"
            ? data.response
            : null,

        answer:
          data.answer,

        output:
          data.output,

        message:
          typeof data.message ===
            "string"
            ? data.message
            : null

      },

      0

    );


  if(direct){
    return direct;
  }


  return (

    extractTextValue(
      data.result,
      0
    ) ||

    extractTextValue(
      data.data,
      0
    ) ||

    extractTextValue(
      data.payload,
      0
    ) ||

    extractTextValue(
      data.output,
      0
    ) ||

    null

  );

}


/* =========================================================
   AI MEDIA
========================================================= */

function isDataOrHttpURL(value){

  return (
    typeof value ===
      "string" &&
    /^(https?:\/\/|data:image\/|data:video\/)/i
      .test(
        value.trim()
      )
  );

}


function collectAIMedia(
  result,
  text
){

  const items = [];


  function push(item){

    if(!item){
      return;
    }

    /*
      避免相同 URL 被加入兩次。
    */

    const exists =
      items.some(
        existing =>
          existing.preview ===
          item.preview
      );

    if(!exists){
      items.push(item);
    }

  }


  const urls = [];


  String(text || "")
    .replace(

      /(!)?\[([^\]]*)\]\(([^)]+)\)|(https?:\/\/[^\s<>"']+\.(?:png|jpe?g|gif|webp|mp4|webm))/ig,

      function(
        match,
        bang,
        label,
        mdUrl,
        rawUrl
      ){

        const url =
          mdUrl || rawUrl;

        if(url){
          urls.push(url);
        }

        return match;

      }

    );


  urls.forEach(
    url=>{

      if(
        /\.(mp4|webm|mov)(\?|$)/i
          .test(url)
      ){

        push({

          name:"video",

          content_type:
            "video",

          preview:url

        });

      }else if(

        /\.(png|jpe?g|gif|webp|bmp|svg)(\?|$)/i
          .test(url) ||
        url.startsWith(
          "data:image/"
        )

      ){

        push({

          name:"image",

          content_type:
            "image",

          preview:url

        });

      }

    }
  );


  const pools = [

    result,
    result?.files,
    result?.media,
    result?.images,
    result?.videos,
    result?.artifacts,
    result?.workspace

  ];


  pools.forEach(
    pool=>{

      if(!pool){
        return;
      }


      if(
        typeof pool ===
          "string" &&
        isDataOrHttpURL(pool)
      ){

        push({

          name:"media",

          content_type:
            pool.includes("video") ||
            /\.mp4/i.test(pool)
              ? "video"
              : "image",

          preview:pool

        });

        return;

      }


      if(Array.isArray(pool)){

        pool.forEach(
          (item,i)=>{

            if(
              typeof item ===
                "string" &&
              isDataOrHttpURL(item)
            ){

              push({

                name:
                  "media-" + i,

                content_type:
                  /\.mp4|video/i
                    .test(item)
                    ? "video"
                    : "image",

                preview:item

              });

            }else if(
              item &&
              typeof item ===
                "object"
            ){

              const url =
                item.url ||
                item.preview ||
                item.content_base64 ||
                item.src;

              if(
                isDataOrHttpURL(url)
              ){

                push({

                  name:
                    item.name ||
                    "media-" + i,

                  content_type:
                    item.content_type ||
                    (
                      String(
                        item.type || ""
                      ).startsWith(
                        "video"
                      )
                        ? "video"
                        : "image"
                    ),

                  preview:url

                });

              }

            }

          }
        );

      }

    }
  );


  return items;
}


function formatAIText(text){

  const escaped =
    escapeHTML(
      text || ""
    );


  const html =
    escaped

      .replace(
        /\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener">$1</a>'
      )

      .replace(
        /(https?:\/\/[^\s<]+)/g,
        function(url){

          if(
            url.includes(
              "</a>"
            )
          ){

            return url;

          }

          return (
            '<a href="' +
            url +
            '" target="_blank" rel="noopener">' +
            url +
            "</a>"
          );

        }
      )

      .replace(
        /\n/g,
        "<br>"
      );


  return {
    html
  };

}


/* =========================================================
   MEDIA RENDER
========================================================= */

function renderMediaStack(
  files
){

  const stack =
    document.createElement(
      "div"
    );

  stack.className =
    "media-stack";


  (files || []).forEach(
    file=>{

      const type =
        file.content_type ||
        (
          String(
            file.type || ""
          ).startsWith(
            "image/"
          )
            ? "image"
            : String(
                file.type || ""
              ).startsWith(
                "video/"
              )
                ? "video"
                : file.content
                  ? "article"
                  : "file"
        );


      const src =
        file.preview ||
        file.content_base64 ||
        file.url ||
        "";


      if(
        type === "image" &&
        src
      ){

        const img =
          document.createElement(
            "img"
          );

        img.className =
          "media-image";

        img.src =
          src;

        img.alt =
          file.name ||
          "圖片";

        stack.appendChild(
          img
        );

        return;

      }


      if(
        type === "video" &&
        src
      ){

        const video =
          document.createElement(
            "video"
          );

        video.className =
          "media-video";

        video.src =
          src;

        video.controls =
          true;

        video.playsInline =
          true;

        stack.appendChild(
          video
        );

        return;

      }


      if(
        type === "article" ||
        type === "text"
      ){

        const article =
          document.createElement(
            "article"
          );

        article.className =
          "media-article";

        article.textContent =
          (
            file.name
              ? file.name +
                "\n\n"
              : ""
          ) +
          String(
            file.content ||
            file.preview ||
            ""
          );

        stack.appendChild(
          article
        );

        return;

      }


      const fallback =
        document.createElement(
          "div"
        );

      fallback.style.fontSize =
        "12px";

      fallback.style.color =
        "#777";

      fallback.textContent =
        "📎 " +
        (
          file.name ||
          "檔案"
        );

      stack.appendChild(
        fallback
      );

    }
  );


  return stack;
}

    const actions =
      document.createElement(
        "div"
      );

    actions.className =
      "message-actions";

    actions.appendChild(
      createDeleteButton(
        messageIndex
      )
    );

    body.appendChild(
      actions
    );

  }


  if(result){

    appendResultArtifacts(
      body,
      result
    );

  }


  row.appendChild(
    avatar
  );

  row.appendChild(
    body
  );

  messagesInner.appendChild(
    row
  );

  scrollBottom();


  return row;
}


function appendDarkStarDiagnostic(
  body,
  result
){
  if(!result || typeof result !== "object"){
    return;
  }

  const diagnostic =
    result.diagnostic ||
    result.failover ||
    result.quota ||
    null;

  if(!diagnostic){
    return;
  }

  const details =
    document.createElement("details");

  details.className =
    "dark-star-diagnostic";

  const summary =
    document.createElement("summary");

  summary.textContent =
    "🔧 技術診斷（工程用，不作為暗星回答）";

  const pre =
    document.createElement("pre");

  try{
    pre.textContent =
      JSON.stringify(
        {
          gateway_version:
            result.gateway?.version ||
            null,
          quota:
            result.quota ||
            null,
          diagnostic:
            result.diagnostic ||
            null,
          failover:
            result.failover ||
            null,
        },
        null,
        2
      );
  }catch(error){
    pre.textContent =
      String(error);
  }

  details.appendChild(summary);
  details.appendChild(pre);
  body.appendChild(details);
}

   RESULT ARTIFACTS
========================================================= */

function appendResultArtifacts(
  body,
  result
){

  if(!result){
    return;
  }


  const files =
    result.files ||
    result.workspace?.files ||
    result.artifacts?.files ||
    null;


  /*
    只有真正由 Sandbox 執行產生的結果才顯示 Sandbox UI。
    正常聊天即使 Gateway 回傳 files，也不能自動把對話
    變成 Sandbox 對話。
  */

  const sandboxExecuted =
    result?.sandbox === true ||
    result?.sandbox?.executed === true ||
    result?.sandbox?.status === "executed" ||
    result?.execution?.environment === "sandbox" ||
    result?.source === "dark-star-sandbox";

  if(files && sandboxExecuted){

    renderSandbox(
      body,
      files,
      result
    );

  }


  const gates =
    result.gates ||
    result.learning?.gates ||
    result.stages ||
    null;


  if(
    Array.isArray(gates) &&
    gates.length
  ){

    renderGates(
      body,
      gates
    );

  }

}

function renderSandbox(
  parent,
  files,
  result
){

  const names =
    Object.keys(
      files || {}
    );


  if(!names.length){
    return;
  }


  lastSandboxFiles =
    files;


  const preferred = [

    "index.html",
    "index.htm",
    "src/App.jsx",
    "App.jsx",
    "main.js",
    "src/main.js"

  ];


  const selected =
    preferred.find(
      name =>
        names.includes(name)
    ) ||
    names[0];


  const code =
    typeof files[selected] ===
      "string"

      ? files[selected]

      : JSON.stringify(
          files[selected],
          null,
          2
        );


  const sandbox =
    document.createElement(
      "div"
    );

  sandbox.className =
    "sandbox-card";


  sandbox.innerHTML = `

<div class="sandbox-head">

  <div class="sandbox-title">
    Sandbox
  </div>

  <div class="sandbox-tabs">

    <button
      class="sandbox-tab active"
      data-mode="preview">
      完成品
    </button>

    <button
      class="sandbox-tab"
      data-mode="code">
      程式碼
    </button>

    <button
      class="sandbox-copy sandbox-rerun">
      重跑沙盒
    </button>

  </div>

</div>

<div class="sandbox-body">

  <div
    class="sandbox-view active"
    data-view="preview">

    <div class="sandbox-empty">

      <div>

        <div class="sandbox-empty-title">
          已收到實際檔案
        </div>

        <div class="sandbox-empty-text">
          尚未提供 Sandbox Preview。
        </div>

      </div>

    </div>

  </div>

  <div
    class="sandbox-view"
    data-view="code">

    <div class="sandbox-code-tools">

      <div class="sandbox-file">
        ${escapeHTML(selected)}
      </div>

      <button class="sandbox-copy sandbox-copy-all">
        複製全部
      </button>

    </div>

    <textarea
      class="sandbox-code"
      readonly></textarea>

  </div>

</div>

`;


  const textarea =
    sandbox.querySelector(
      ".sandbox-code"
    );

  textarea.value =
    code;


  const previewPane =
    sandbox.querySelector(
      '[data-view="preview"]'
    );


  if(
    String(selected)
      .toLowerCase()
      .endsWith(".html") ||
    String(selected)
      .toLowerCase()
      .endsWith(".htm")
  ){

    previewPane.innerHTML =
      "";

    const iframe =
      document.createElement(
        "iframe"
      );

    iframe.className =
      "sandbox-frame";

    iframe.srcdoc =
      code;

    previewPane.appendChild(
      iframe
    );

  }


  const previewURL =
    result?.sandbox?.preview_url ||
    result?.sandbox?.previewUrl ||
    result?.sandbox?.url ||
    result?.preview_url ||
    result?.previewUrl ||
    null;


  if(previewURL){

    previewPane.innerHTML =
      "";

    const iframe =
      document.createElement(
        "iframe"
      );

    iframe.className =
      "sandbox-frame";

    iframe.src =
      previewURL;

    iframe.loading =
      "lazy";

    previewPane.appendChild(
      iframe
    );

  }


  sandbox
    .querySelectorAll(
      ".sandbox-tab"
    )
    .forEach(
      tab=>{

        tab.onclick =
          ()=>{

            sandbox
              .querySelectorAll(
                ".sandbox-tab"
              )
              .forEach(
                item =>
                  item.classList.remove(
                    "active"
                  )
              );


            tab.classList.add(
              "active"
            );


            sandbox
              .querySelectorAll(
                ".sandbox-view"
              )
              .forEach(
                view =>
                  view.classList.remove(
                    "active"
                  )
              );


            const target =
              sandbox.querySelector(
                `[data-view="${tab.dataset.mode}"]`
              );


            if(target){

              target.classList.add(
                "active"
              );

            }

          };

      }
    );


  const copyButton =
    sandbox.querySelector(
      ".sandbox-copy-all"
    );


  copyButton.onclick =
    async ()=>{

      try{

        await navigator.clipboard.writeText(
          getAllFilesText(
            files
          )
        );

        alert(
          "完整程式碼已複製"
        );

      }catch(error){

        textarea.focus();

        textarea.select();

        document.execCommand(
          "copy"
        );

        alert(
          "程式碼已複製"
        );

      }

    };


  const rerun =
    sandbox.querySelector(
      ".sandbox-rerun"
    );


  rerun.onclick =
    async ()=>{

      if(isSending){

        alert(
          "目前已有任務正在執行，請等待完成。"
        );

        return;

      }


      rerun.disabled =
        true;

      rerun.textContent =
        "重跑中…";


      try{

        const rerunResult =
          await callSandbox(
            "請重跑並測試目前的沙盒。",
            lastSandboxFiles,
            "rerun"
          );


        lastSandboxFiles =
          rerunResult.files ||
          lastSandboxFiles;


        renderAIMessage(
          getAIReply(
            rerunResult
          ) ||
          "沙盒已重跑。",
          rerunResult
        );


      }catch(error){

        alert(
          "沙盒重跑失敗：\n" +
          error.message
        );

      }finally{

        rerun.disabled =
          false;

        rerun.textContent =
          "重跑沙盒";

      }

    };


  parent.appendChild(
    sandbox
  );

}


function getAllFilesText(
  files
){

  return Object
    .entries(files || {})
    .map(
      ([name,content]) =>
        `===== ${name} =====\n\n` +
        (
          typeof content ===
            "string"
            ? content
            : JSON.stringify(
                content,
                null,
                2
              )
        ) +
        "\n\n"
    )
    .join("");

}

function renderGates(
  parent,
  gates
){

  const card =
    document.createElement(
      "div"
    );

  card.className =
    "gate-card";


  const head =
    document.createElement(
      "div"
    );

  head.className =
    "gate-head";

  head.textContent =
    "Technical Dark Star 工作進度";


  const list =
    document.createElement(
      "div"
    );

  list.className =
    "gate-list";


  gates.forEach(
    gate=>{

      const row =
        document.createElement(
          "div"
        );


      const state =
        String(
          gate.status ||
          gate.state ||
          "pending"
        ).toLowerCase();


      if(
        [
          "completed",
          "passed",
          "success"
        ].includes(state)
      ){

        row.className =
          "gate-row completed";

      }else if(
        state === "running"
      ){

        row.className =
          "gate-row running";

      }else if(
        [
          "failed",
          "error"
        ].includes(state)
      ){

        row.className =
          "gate-row failed";

      }else{

        row.className =
          "gate-row";

      }


      let icon =
        "○";


      if(
        [
          "completed",
          "passed",
          "success"
        ].includes(state)
      ){

        icon =
          "✓";

      }else if(
        state === "running"
      ){

        icon =
          "●";

      }else if(
        [
          "failed",
          "error"
        ].includes(state)
      ){

        icon =
          "!";

      }


      row.innerHTML = `

<div class="gate-icon">
  ${icon}
</div>

<div>

  <div class="gate-name">
    ${escapeHTML(
      gate.name ||
      gate.stage ||
      "Unknown"
    )}
  </div>

  <div class="gate-status">
    ${escapeHTML(
      gate.message ||
      gate.label ||
      state
    )}
  </div>

</div>

`;


      list.appendChild(
        row
      );

    }
  );


  card.appendChild(
    head
  );

  card.appendChild(
    list
  );

  parent.appendChild(
    card
  );

}

function isExplicitSvgIntent(text){

  const value = String(text || "").trim();

  if(!value) return false;

  /*
    SVG 必須是使用者明確要求的輸出格式／沙盒。
    提到 SVG 本身不能搶走 JPG／照片生成路由。
  */

  const wantsRaster =
    /JPG|JPEG|照片|點陣圖|點陣圖片|生成圖片|產生圖片|生成照片|產生照片|圖片生成|生圖|轉成JPG|轉成JPEG|改成JPG|改成JPEG/i
      .test(value);

  if(
    wantsRaster &&
    !/(?:只要|只輸出|僅輸出|輸出|生成|產生|畫出|做出)\s*(?:一份)?\s*(?:SVG|向量圖|向量圖形)/i
      .test(value)
  ){
    return false;
  }

  if(
    /(?:不要|不用|不需要|別|勿)\s*(?:輸出)?\s*(?:SVG|向量圖|向量圖形)/i
      .test(value)
  ){
    return false;
  }

  return /(?:輸出|生成|產生|畫出|做出|建立|轉成|使用|進入|執行|開始|重跑|測試)?\s*(?:SVG|向量圖|向量圖形)|(?:SVG|向量圖|向量圖形)\s*(?:圖|格式|程式碼|程式|Sandbox|沙盒|測試|執行)/i
    .test(value);

}


/*
  ========================================================
   IMAGE CONTEXT / INTENT
  ========================================================

  上一個任務若已經是圖片生成，後續只描述
  構圖、人物、服裝、背景、風格等內容時，
  視為同一圖片任務的延續，不要求使用者再次說 JPG。
*/

/* AIVAULT_JPG_FIRST_IMAGE_TASK_V2
   規則：
   1. 一般圖片/照片一律以 JPG 為預設。
   2. 只有明確 SVG 才進 SVG。
   3. 已有上一張 JPG 時，自然語言修改預設沿用同一圖片任務。
   4. 新人物/全新圖片等明確要求才建立新圖片任務。
*/

function normalizeImageTaskText(value){
  return String(value || "").replace(/\s+/g," ").trim();
}

function buildImageTaskState(previousTask, userMessage, continuation){
  /*
    AIVAULT_IMAGE_TASK_STATE_V3
    任務狀態只有在「延續／修改」時才繼承上一張。
    全新生成必須建立乾淨 task state，避免上一張人物身份
    （例如 Arnold Schwarzenegger）滲入新的圖片提示詞。
  */
  const previous =
    continuation &&
    previousTask?.image_task &&
    typeof previousTask.image_task === "object"
      ? previousTask.image_task
      : {};
  const text = normalizeImageTaskText(userMessage);
  const task = {
    ethnicity: previous.ethnicity || "",
    face: previous.face || "",
    skin_tone: previous.skin_tone || "",
    hair: previous.hair || "",
    clothing: previous.clothing || "",
    body: previous.body || "",
    pose: previous.pose || "",
    camera: previous.camera || "",
    background: previous.background || "",
    lighting: previous.lighting || "",
    style: previous.style || "",
    anatomy: previous.anatomy || "",
    breastfeeding: previous.breastfeeding || "",
    breast_anatomy: previous.breast_anatomy || ""
  };
  if(!continuation){
    if(/亞洲|亞裔|東亞|中國人|華人|日本人|韓國人|台灣人|東南亞/i.test(text)){
      task.ethnicity="亞洲／東亞成人女性面部外觀；維持自然一致的亞洲面部結構。";
      task.face="自然亞洲成人女性五官與臉型；眼睛、眉骨、鼻部、嘴唇與整體面部結構保持一致。";
    }else if(/白人|歐美人|歐洲人|西方人|高加索|Caucasian|European/i.test(text)){
      task.ethnicity="歐美／白人成年人面部外觀；維持一致的歐美面部結構。";
      task.face="自然一致的歐美成人五官與臉型。";
    }else if(/非裔|黑人|African/i.test(text)){
      task.ethnicity="非洲裔成人面部外觀；維持自然一致的面部結構。";
    }else if(/南亞|印度人|印度裔|South Asian|Indian/i.test(text)){
      task.ethnicity="南亞成人面部外觀；維持自然一致的面部結構。";
    }
    if(/黑髮|黑色頭髮|黑長髮|長髮/i.test(text)) task.hair="黑色長髮";
    if(/性感/i.test(text)) task.style="性感成人肖像風格";
  }
  if(/豐滿|胸大|胸部大|胸部豐滿/i.test(text)) task.body="上半身比例豐滿；只在使用者要求時調整身體比例。";
  if(/近距離|近景|上半身|半身|特寫/i.test(text)) task.camera="中近景／上半身構圖；完整頭部、完整臉部、雙肩與足夠上半身可見，不裁切臉或頭。";
  if(/全身/i.test(text)) task.camera="全身構圖";
  if(/背景/i.test(text)) task.background=text;
  if(/光線|柔光|逆光|燈光/i.test(text)) task.lighting=text;
  if(/姿勢|動作/i.test(text)) task.pose=text;
  if(/衣服|服裝|裙子|上衣/i.test(text)) task.clothing=text;
  if(/寫實|逼真/i.test(text)) task.style="寫實成人肖像";
  if(/人體工學|人體結構|人體比例|骨架|關節|姿勢分析|人體研究|人體藝術|哺乳|母乳|餵奶|餵母乳|母乳哺育|哺育嬰兒/i.test(text)){
    task.anatomy="人體結構研究：頭身比例、肩胯比例、脊柱與四肢長度、主要關節位置、姿勢與重心保持自然一致；以人體結構與工學為主要研究目標。";
  }
  if(/哺乳|母乳|餵奶|餵母乳|母乳哺育|哺育嬰兒/i.test(text)){
    task.breastfeeding="母乳哺育情境：成年母親與嬰兒的自然哺乳互動；以母嬰姿勢、支撐、關節角度、重心與照護情境為語意重點，不將哺乳自動解讀為性感情境。";
    task.breast_anatomy="乳房解剖定位：左右乳房位於胸廓前側，乳暈與乳頭位於各自乳房的合理中心區域；左右位置、大小比例與胸壁連接保持自然一致。";
    task.anatomy=(task.anatomy?task.anatomy+" ":"")+"哺乳相關人體結構：胸廓、乳房位置、母嬰接觸姿勢與支撐關係保持自然一致。";
  }
  return task;
}

function imageTaskLockPrompt(task){

    ["人物族群",task.ethnicity],["面部",task.face],["膚色",task.skin_tone],
    ["髮型",task.hair],["服裝",task.clothing],["身體比例",task.body],

}

function getLatestImageTask(){

  for(let i = messagesHistory.length - 1; i >= 0; i--){

    const item = messagesHistory[i];

    if(
      item &&
      item.role === "assistant" &&
      item.result &&
      item.result.capability === "image_generation"
    ){

      const previousUser =
        messagesHistory
          .slice(0, i)
          .reverse()
          .find(message =>
            message &&
            message.role === "user" &&
            String(message.text || "").trim()
          );

      return {
        prompt:
          String(
            item.result.image_prompt ||
            previousUser?.text ||
            ""
          ).trim(),
        image_task:
          item.result.image_task &&
          typeof item.result.image_task === "object"
            ? item.result.image_task
            : null,
        format:
          String(
            item.result.mime_type ||
            "image/jpeg"
          ).toLowerCase(),
        reference_url:
          String(
            item.result.artifact?.signed_url ||
            item.result.images?.[0]?.url ||
            ""
          ).trim(),
        result: item.result
      };

    }

  }

  return null;
}

}

/* =========================================================
   HTML / SVG EXTRACTION
========================================================= */

function extractHtmlFromText(
  text
){

  const raw =
    String(text || "");


  const doctype =
    raw.search(
      /<!DOCTYPE html/i
    );


  if(doctype >= 0){

    return raw
      .slice(doctype)
      .trim();

  }


  const start =
    raw.search(
      /<html/i
    );


  if(start >= 0){

    return raw
      .slice(start)
      .trim();

  }


  return "";

}


function extractSvgFromText(
  text
){

  const raw =
    String(text || "");


  const start =
    raw.search(
      /<svg/i
    );


  const end =
    raw
      .toLowerCase()
      .lastIndexOf(
        "</svg>"
      );


  if(
    start === -1 ||
    end === -1 ||
    end < start
  ){

    return "";

  }


  return raw
    .slice(
      start,
      end + 6
    );

}

  updateDarkStarWorkLocation("📍 AIVAULT → Draw Sandbox → 執行 SVG 測試");

    /動畫|拍翅膀|轉動|閃爍|animate|gif/i

    await fetch(

      {

        method:"POST",

        headers:{

            "application/json"

        body:
          JSON.stringify({

            engine:

            source:
              "technical-dark-star-web",

            message:
              userMessage,

            kind:
              animation
                ? "animation"
                : "image",

            svg:
              svg || "",

            files:
              svg
                ? {
                    "image.svg":
                      svg
                  }
                : {}

          })

      }
    );


  const responseText =
    await response.text();


  let data;


  try{

    data =
      responseText
        ? JSON.parse(
            responseText
          )

  }catch(error){

    throw new Error(
      "Draw sandbox 回傳不是 JSON：\n" +

  if(

  return data;

          getRequestedImageAppearanceGuidance(userMessage) + "\\n" +
          String(userMessage || "").trim()
        );


  const response =
    await fetch(
      SUPABASE_URL +
      "/functions/v1/technical-dark-star/image/generate",
      {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            prompt:
              imagePrompt,

            // AIVAULT_IMAGE_TASK_ISOLATION_V1
            // The backend must distinguish a genuinely new image from an edit.
            image_task_mode:
              continuation ? "continuation" : "new",
            user_request:
              String(userMessage || "").trim(),

            mime_type:
              "image/jpeg",

            aspect_ratio:
              "1:1",

            image_size:
              "1K",

            reference_image_urls:
              continuation && latestImageTask?.reference_url
                ? [latestImageTask.reference_url]
                : []

          })

      }
    );


  // AIVAULT_IMAGE_RESPONSE_HARDENING_V1
  // Safari/iOS can surface a generic "Load failed" while reading a
  // completed fetch body. Read text first so the real backend error/result
  // is preserved and can be parsed explicitly.
  const responseText = await response.text();
  let data = {};
  try{
    data = responseText ? JSON.parse(responseText) : {};
  }catch(parseError){
    throw new Error(
      "JPG 後端回應不是有效 JSON：" +
      responseText.slice(0, 800)
    );
  }


  if(
    !response.ok ||
    data?.success === false
  ){

    const rawError =
      data?.error ??
      data?.image_generation?.error ??
      ("JPG 圖片生成失敗（HTTP " +
        response.status +
        "）");

    let readableError = "";

    if (typeof rawError === "string") {
      readableError = rawError;
    } else {
      try {
        readableError =
          rawError?.message ||
          rawError?.error?.message ||
          JSON.stringify(rawError);
      } catch (error) {
        readableError = String(rawError);
      }
    }

    throw new Error(
      readableError ||
      ("JPG 圖片生成失敗（HTTP " +
        response.status +
        "）")
    );

  }


  const generated =
    data?.image_generation ||
    data;


  const artifact =
    generated?.artifact;


  const signedUrl =
    artifact?.signed_url ||
    generated?.signed_url ||
    data?.signed_url ||
    null;

  const inlineDataUrl =
    artifact?.inline_data_url ||
    generated?.inline_data_url ||
    data?.inline_data_url ||
    null;

  // Prefer the backend's verified JPEG bytes for rendering on iPhone/Safari.
  // Keep the signed URL as the persistent/downloadable artifact reference.
  const renderUrl =
    typeof inlineDataUrl === "string" &&
    inlineDataUrl.startsWith("data:image/jpeg;base64,")
      ? inlineDataUrl
      : signedUrl;


  if(!signedUrl){

    throw new Error(
      "JPG 已收到後端回應，但沒有取得圖片 URL。"
    );

  }

  /*
    AIVAULT_OUTPUT_CONTRACT_V1
    前端最後一道硬閘門：
    一般圖片任務要求 JPG 時，只接受後端已驗證的真正 JPEG。
    不接受 SVG、文字、未驗證的 MIME 或其他格式冒充 JPG。
  */
  const verifiedMime =
    String(
      generated?.mime_type ||
      data?.mime_type ||
      ""
    ).toLowerCase();

  /*
    AIVAULT_OUTPUT_CONTRACT_V2
    technical-dark-star/image/generate 會把真正的
    dark-star-image-generation 回應包在 data.image_generation。
    驗證必須讀取「實際下游結果」generated，而不是外層 wrapper。
  */
  if(
    generated?.format_verified !== true ||
    verifiedMime !== "image/jpeg"
  ){
    throw new Error(
      "JPG 輸出驗證失敗：後端沒有提供已驗證的 image/jpeg。SVG／文字 fallback 已禁止。"
    );
  }

  if(
    artifact?.signed_url &&
    !/^https?:\/\//i.test(String(artifact.signed_url))
  ){
    throw new Error(
      "JPG 輸出驗證失敗：圖片 URL 格式不正確。"
    );
  }


  return {

    success:true,

    capability:
      "image_generation",

    provider:
      generated?.provider ||
      "google",

    model:
      generated?.model ||
      "gemini-3.1-flash-image",

    mime_type:
      generated?.mime_type ||
      "image/jpeg",

    image_prompt:
      imagePrompt,

    image_task:
      imageTask,

    artifact:
      artifact ||
      null,

    images:[
      {
        name:
          "dark-star-generated.jpg",

        type:
          "image/jpeg",

async function callAIVAULT(

){

  const requestId =
    ++requestSequence;


  console.info(
    "[DarkStar][GATEWAY REQUEST]",

  );


  const safeFiles =
    (files || []).map(
      file=>({

        name:
          file.name,

        type:
          file.type,

        size:
          file.size,

        content_type:
          file.content_type,

        content:
          file.content ||
          null,

        content_base64:
          file.content_base64 ||
          file.preview ||
          null

      })
    );


  const images =
    safeFiles
      .filter(
        file =>
          file.content_type ===
            "image" &&
          file.content_base64
      )
      .map(
        file =>
          file.content_base64
      );


  const topicId =
    getDarkStarTopicId();

  const learningContext =
    await getDarkStarLearningContext(userMessage);


  const payload = {

    engine:
      ENGINE,

    message:
      buildGatewayMessage(
        userMessage,
        safeFiles,
        learningContext
      ),

    conversation_id:
      conversationId || null,

    topic_id:
      topicId,

    agent_id:
      "technical-dark-star",

    source:
      "technical-dark-star-web",

    provider:
      "gemini",

    model:
      "gemini-3.6-flash",

    files:
      safeFiles,

    image:
      images[0] || null,

    images:
      images

  };

  if(isDarkStarSelfRepairIntent(userMessage)){
    payload.action = "self_repair_authorize";
    payload.command_text = userMessage;
    payload.issue_summary = "Owner 明確要求 Technical Dark Star 進入自我修復授權流程";
    payload.stream = false;
    updateDarkStarWorkLocation("📍 AIVAULT → AI Gateway → Owner 自我修復授權");
  }else if(isDarkStarSelfDiagnosticIntent(userMessage)){
    payload.action = "self_diagnostic";
    payload.stream = false;
    updateDarkStarWorkLocation("📍 AIVAULT → AI Gateway → 自我診斷");
  }


  console.info(
    "[DarkStar][GATEWAY PAYLOAD]",
    {

      request_id:
        requestId,

      topic_id:
        payload.topic_id,

      conversation_id:
        payload.conversation_id,

      agent_id:
        payload.agent_id,

      files:
        safeFiles.length,

      images:
        images.length

    }
  );


  updateDarkStarWorkLocation("📍 AIVAULT → AI Gateway → 等待真實回應");

  if(!payload.action){
    payload.stream = true;
  }

  const response =
    await fetch(
      AI_GATEWAY_URL,
      {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json",
          "Accept":
            "text/event-stream, application/json",
          ...(getAIVAULTAccessToken()
            ? { "Authorization": "Bearer " + getAIVAULTAccessToken() }
            : {})
        },

        body:
          JSON.stringify(
            payload
          )

      }
    );

  let data = {};

  if(!response.ok){
    const errorText = await response.text();
    let errorData = {};
    try{
      errorData = errorText ? JSON.parse(errorText) : {};
    }catch(error){}
    const detail =
      errorData?.message ||
      errorData?.error ||
      `HTTP ${response.status}`;
    throw new Error(String(detail));
  }

  const contentType =
    String(response.headers.get("content-type") || "").toLowerCase();

  if(contentType.includes("text/event-stream") && response.body){
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let streamDone = false;

    const handleEventBlock = (block) => {
      const lines = String(block || "").split(/\r?\n/);
      let eventName = "message";
      const dataLines = [];

      for(const line of lines){
        if(line.startsWith("event:")){
          eventName = line.slice(6).trim();
        }else if(line.startsWith("data:")){
          dataLines.push(line.slice(5).trimStart());
        }
      }

      if(!dataLines.length) return;

      const raw = dataLines.join("\n");
      let eventData = {};
      try{
        eventData = JSON.parse(raw);
      }catch(error){
        console.warn("[DarkStar][Gateway SSE] invalid event data", raw);
        return;
      }

      if(eventName === "runtime"){
        const action = String(eventData?.action || "").trim();
        const target = String(eventData?.target || "").trim();
        if(action || target){
          const label = [action, target].filter(Boolean).join("：");
          updateDarkStarWorkLocation("📍 " + label);
        }
        return;
      }

      if(eventName === "result"){
        data = eventData && typeof eventData === "object"
          ? eventData
          : {};
        return;
      }

      if(eventName === "error"){
        throw new Error(
          String(eventData?.message || eventData?.error || "AIVAULT AI Gateway 串流執行失敗")
        );
      }

      if(eventName === "done"){
        streamDone = true;
      }
    };

    while(!streamDone){
      const {value, done} = await reader.read();
      if(done) break;

      buffer += decoder.decode(value, {stream:true});

      const blocks = buffer.split("\n\n");
      buffer = blocks.pop() || "";

      for(const block of blocks){
        handleEventBlock(block);
      }
    }

    buffer += decoder.decode();
    if(buffer.trim()) handleEventBlock(buffer);

    if(!data || typeof data !== "object" || Object.keys(data).length === 0){
      throw new Error("AIVAULT AI Gateway 串流沒有收到最終結果。");
    }
  }else{
    const responseText = await response.text();
    try{
      data =
        responseText
          ? JSON.parse(responseText)
          : {};
    }catch(error){
      throw new Error(
        "AIVAULT AI Gateway 回傳不是 JSON：\n" +
        responseText.slice(0,1200)
      );
    }
  }


  if(!response.ok){

    const detail =
      data?.message ||
      data?.error ||
      (
        Array.isArray(
          data?.failover
            ?.previous_failures
        ) &&
        data.failover
          .previous_failures[0]
          ?.error
      ) ||
      `HTTP ${response.status}`;


    throw new Error(
      String(detail)
    );

  }


  conversationId =
    data.conversation_id ||
    data.conversationId ||
    data.session_id ||
    data.sessionId ||
    conversationId;


  try{
    const returnedTopicId = data?.memory?.topic_id || data?.topic_id || topicId;
    if(returnedTopicId){
      localStorage.setItem("technical-dark-star-topic-id", String(returnedTopicId));
    }
  }catch(error){
    console.warn("[DarkStar][memory] topic persistence failed", error);
  }


  const actualLocation = createWorkLocationFromGateway(data);
  if(actualLocation){
    updateDarkStarWorkLocation(actualLocation);
  }

  await recordDarkStarUserCorrection(userMessage);

  console.info(
    "[DarkStar][GATEWAY RESPONSE]",
    {

      request_id:
        requestId,

      success:
        data?.success,

      provider:
        data?.provider,

      model:
        data?.model,

      conversation_id:
        data?.conversation_id ||
        conversationId,

      memory_enabled:
        data?.memory?.enabled,

      memory_reason:
        data?.memory?.reason

    }
  );


  console.info(
    "[DarkStar][MEMORY]",
    {

      request_id:
        requestId,

      enabled:
        data?.memory?.enabled,

      topic_id:
        data?.memory?.topic_id ||
        data?.topic_id ||
        topicId,

      conversation_id:
        data?.memory?.conversation_id ||
        data?.conversation_id ||
        conversationId,

      retained_messages:
        data?.memory?.retained_messages,

      context_messages_sent:
        data?.memory
          ?.context_messages_sent,

      reason:
        data?.memory?.reason,

      diagnostic:
        data?.memory?.diagnostic

    }
  );


  saveState();


  return data;

}

      - SVG 只有使用者明確指定 SVG／向量圖時才允許。
      - 不讓模型自行輸出 SVG 搶走圖片生成路由。
    */
    const explicitSvgIntent =
      isExplicitSvgIntent(text);

    const explicitJpgIntent =
      /JPG|JPEG|照片|相片|點陣圖|點陣圖片|轉成JPG|轉成JPEG|改成JPG|改成JPEG/i.test(String(text || ""));

    const drawIntent =
      isDrawIntent(
        text,
        outgoingFiles
      );

    let selectedImageFormat = null;

    /*
      AIVAULT_IMAGE_FORMAT_CHOICE_V1
      使用者未明確指定 SVG/JPG 時，不讓暗星自行決定格式。
      先由使用者選擇，再進入對應的實際生成路由。
    */
    if(
      (jpgImageIntent || drawIntent) &&
      !explicitSvgIntent &&
      !explicitJpgIntent
    ){
      /*
        AIVAULT_JPG_FIRST_IMAGE_ROUTER_V5
        自然圖片需求直接走真正 JPG 圖片生成。
        SVG 只有使用者明確要求 SVG 時才允許。
        不再讓格式選擇視窗把一般圖片任務送進 SVG Sandbox。
      */
      selectedImageFormat = "jpg";
    }

    console.info(
      "[DarkStar][IMAGE ROUTER V4]",
      {
        explicitSvgIntent,
        explicitJpgIntent,
        selectedImageFormat,
        jpgImageIntent,
        drawIntent,
        text
      }
    );

    if(
      explicitSvgIntent ||
      selectedImageFormat === "svg"
    ){

      result =
        await makeDrawWithDarkStar(
          text,
          outgoingFiles
        );

    }else if(
      explicitJpgIntent ||
      jpgImageIntent ||
      selectedImageFormat === "jpg"
    ){

      result =
        await makeJpgImageWithDarkStar(
          text,
          outgoingFiles
        );

    }else if(
      drawIntent
    ){

      result =
        await makeDrawWithDarkStar(
          text,
          outgoingFiles
        );

    }else if(
      isGameIntent(
        text,
        outgoingFiles
      )
    ){

      result =
        await makeGameWithDarkStar(
          text,
          outgoingFiles
        );

    }else if(
      isSandboxIntent(
        text,
        outgoingFiles
      )
    ){

      result =
        await makePageWithDarkStar(
          text,
          outgoingFiles
        );

    }else if(
      isHardJpgVisualRequest(text, outgoingFiles)
    ){

      // Final hard stop: visual requests cannot fall through to text/SVG.
      result =
        await makeJpgImageWithDarkStar(
          text,
          outgoingFiles
        );

    }else{

      result =
        await callAIVAULT(
          text,
          outgoingFiles
        );

    }


    /*
      移除唯一一個 loading。
    */

    loading.remove();


    const reply =
      result?.diagnostic_mode === "self_repair_authorization"
        ? formatSelfRepairReply(result)
        : result?.diagnostic_mode === "self_diagnostic"
          ? formatSelfDiagnosticReply(result)
          : getAIReply(result);


    const displayReply =
      reply ||
      (
        result?.capability === "svg_generation"
          ? "SVG 圖片已生成，請查看下方圖片預覽。"
          : "AIVAULT AI Gateway 已回傳資料，但沒有提供可顯示的文字回應。"
      );


    /*
      一次 sendMessage 只允許這裡
      render 一次 AI。
    */

    console.info(
      "[DarkStar][RENDER REPLY]",
      sendId
    );


    renderAIMessage(
      displayReply,
      result
    );


    messagesHistory.push({

      role:
        "assistant",

      text:
        displayReply,

      result:
        result

    });


    saveState();


    console.info(
      "[DarkStar][SEND COMPLETE]",
      sendId
    );


  }catch(error){

    loading.remove();


    let readableError = "";

    try{

      const rawError =
        error?.message ??
        error?.error ??
        error;

      if(
        typeof rawError ===
          "string"
      ){

        readableError =
          rawError;

      }else if(
        rawError &&
        typeof rawError ===
          "object"
      ){

        readableError =
          rawError.message ||
          rawError.error?.message ||
          JSON.stringify(
            rawError
          );

      }else{

        readableError =
          String(
            rawError
          );

      }

    }catch(serializationError){

      readableError =
        String(
          error
        );

    }

    const errorText =
      "Technical Dark Star 無法取得 AIVAULT 的真實回應。\n\n" +
      (
        readableError ||
        "未知錯誤"
      );


    console.error(
      "[DarkStar][SEND ERROR]",
      sendId,
      error
    );


    renderAIMessage(
      errorText
    );


    messagesHistory.push({

      role:
        "assistant",

      text:
        errorText

    });


    saveState();


  }finally{

    /*
      ======================================================
      RELEASE LOCK
      ======================================================
    */

    isSending =
      false;


    sendButton.disabled =
      !input.value.trim() &&
      attachments.length === 0;


    renderHistory();


    console.info(
      "[DarkStar][SEND FINALLY]",
      sendId
    );

  }

}

async function copyTextToClipboard(text){

  const value = String(text || "");

  if(!value){
    return false;
  }

  try{

    if(
      navigator.clipboard &&
      typeof navigator.clipboard.writeText === "function"
    ){

      await navigator.clipboard.writeText(value);
      return true;

    }

  }catch(error){
    console.warn("[DarkStar][copy] clipboard API failed",error);
  }

  try{

    const area = document.createElement("textarea");
    area.value = value;
    area.setAttribute("readonly","");
    area.style.position = "fixed";
    area.style.opacity = "0";
    area.style.pointerEvents = "none";
    document.body.appendChild(area);
    area.select();
    area.setSelectionRange(0, area.value.length);
    const ok = document.execCommand("copy");
    area.remove();
    return ok;

  }catch(error){

    console.warn("[DarkStar][copy] fallback failed",error);
    return false;

  }
}
