<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Technical Dark Star</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#fff;
  color:#202123;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
    "Noto Sans TC","PingFang TC",sans-serif;
}

button,textarea,input{font:inherit}
button{cursor:pointer}
body{overflow:hidden}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:#fff;
}

/* TOP */

.topbar{
  height:58px;
  min-height:58px;
  display:flex;
  align-items:center;
  padding:0 14px;
  border-bottom:1px solid #eee;
  background:rgba(255,255,255,.96);
  position:relative;
  z-index:30;
}

.menu-button{
  width:38px;
  height:38px;
  border:0;
  background:transparent;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#303030;
}

.menu-button:hover{background:#f3f3f3}

.brand{
  margin-left:7px;
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.brand-mark{
  width:28px;
  height:28px;
  border-radius:8px;
  background:#171717;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:600;
}

.brand-title{
  font-size:15px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.brand-engine{
  font-size:12px;
  color:#8b8b8b;
}

/* CHAT */

.main{
  flex:1;
  min-height:0;
  position:relative;
  display:flex;
}

.chat{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:#fff;
}

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  scroll-behavior:smooth;
}

.messages-inner{
  width:min(760px,calc(100% - 32px));
  margin:0 auto;
  padding:34px 0 150px;
}

/* WELCOME */

.welcome{
  min-height:calc(100dvh - 220px);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px 0;
}

.welcome-content{width:100%}

.welcome-mark{
  width:54px;
  height:54px;
  margin:0 auto 22px;
  border-radius:16px;
  background:#171717;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.welcome-title{
  margin:0;
  font-size:30px;
  font-weight:600;
  letter-spacing:-.7px;
}

.welcome-subtitle{
  margin:13px auto 0;
  max-width:570px;
  font-size:15px;
  line-height:1.75;
  color:#777;
}

/* MESSAGE */

.message{
  display:flex;
  gap:13px;
  margin-bottom:30px;
}

.message.user{justify-content:flex-end}

.message-avatar{
  width:30px;
  height:30px;
  min-width:30px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:600;
  background:#171717;
  color:#fff;
  margin-top:2px;
}

.message.user .message-avatar{
  background:#e9e9e9;
  color:#444;
}

.message-body{
  min-width:0;
  max-width:690px;
}

.message.user .message-body{
  max-width:min(600px,82%);
}

.message-text{
  font-size:16px;
  line-height:1.75;
  white-space:normal;
  word-break:break-word;
}

.message.user .message-text{
  background:#f4f4f4;
  border-radius:18px;
  padding:10px 15px;
}

.message-actions{
  margin-top:8px;
  display:flex;
  gap:4px;
}

.message-action{
  width:31px;
  height:31px;
  border:0;
  background:transparent;
  border-radius:8px;
  color:#777;
  display:flex;
  align-items:center;
  justify-content:center;
}

.message-action:hover{
  background:#f2f2f2;
  color:#222;
}

/* SANDBOX */

.sandbox-card{
  margin-top:15px;
  border:1px solid #e4e4e4;
  border-radius:14px;
  overflow:hidden;
  background:#fff;
}

.sandbox-head{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px 0 14px;
  border-bottom:1px solid #ededed;
}

.sandbox-title{
  font-size:13px;
  font-weight:600;
}

.sandbox-tabs{
  display:flex;
  gap:3px;
}

.sandbox-tab{
  border:0;
  background:transparent;
  color:#777;
  border-radius:7px;
  padding:6px 9px;
  font-size:11px;
}

.sandbox-tab.active{
  background:#eee;
  color:#222;
}

.sandbox-body{height:420px}

.sandbox-view{
  display:none;
  width:100%;
  height:100%;
}

.sandbox-view.active{display:block}

.sandbox-empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#888;
  padding:30px;
}

.sandbox-empty-title{
  color:#555;
  font-size:14px;
  margin-bottom:7px;
}

.sandbox-empty-text{
  font-size:12px;
  line-height:1.6;
}

.sandbox-frame{
  width:100%;
  height:100%;
  border:0;
  background:#fff;
}

.sandbox-code{
  width:100%;
  height:calc(100% - 42px);
  border:0;
  outline:0;
  resize:none;
  background:#101114;
  color:#ddd;
  padding:15px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,
    Consolas,monospace;
  font-size:13px;
  line-height:1.6;
}

.sandbox-code-tools{
  height:42px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  background:#181a1f;
  border-bottom:1px solid #292c31;
}

.sandbox-file{
  color:#aaa;
  font-size:11px;
}

.sandbox-copy{
  border:1px solid #373a40;
  background:#22252b;
  color:#eee;
  border-radius:6px;
  padding:5px 9px;
  font-size:11px;
}

/* GATES */

.gate-card{
  margin-top:15px;
  border:1px solid #e5e5e5;
  border-radius:14px;
  overflow:hidden;
}

.gate-head{
  padding:13px 14px;
  border-bottom:1px solid #eee;
  font-size:13px;
  font-weight:600;
}

.gate-list{padding:9px 14px 12px}

.gate-row{
  display:flex;
  align-items:flex-start;
  gap:9px;
  padding:7px 0;
}

.gate-icon{
  width:20px;
  height:20px;
  min-width:20px;
  border-radius:50%;
  background:#eee;
  color:#999;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
}

.gate-row.running .gate-icon{
  background:#e9f0ff;
  color:#2563eb;
}

.gate-row.completed .gate-icon{
  background:#e7f7ef;
  color:#15803d;
}

.gate-row.failed .gate-icon{
  background:#fdeaea;
  color:#dc2626;
}

.gate-name{
  font-size:12px;
  font-weight:500;
}

.gate-status{
  margin-top:2px;
  color:#888;
  font-size:11px;
}

/* COMPOSER */

.composer-area{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:10px 16px max(16px,env(safe-area-inset-bottom));
  background:linear-gradient(
    to bottom,
    rgba(255,255,255,0),
    rgba(255,255,255,.94) 22%,
    #fff 45%
  );
  pointer-events:none;
}

.composer{
  width:min(760px,100%);
  margin:0 auto;
  pointer-events:auto;
  border:1px solid #d9d9d9;
  border-radius:25px;
  background:#fff;
  box-shadow:0 3px 14px rgba(0,0,0,.06);
  overflow:hidden;
}

.attachment-preview{
  display:none;
  padding:9px 12px 0;
  gap:7px;
  flex-wrap:wrap;
}

.attachment-preview.show{display:flex}

.attachment-chip{
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 9px;
  background:#f4f4f4;
  border-radius:9px;
  font-size:11px;
  color:#555;
  max-width:230px;
}

.attachment-chip-name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.attachment-remove{
  border:0;
  background:transparent;
  color:#888;
  padding:0;
  font-size:14px;
}

.composer-row{
  min-height:54px;
  display:flex;
  align-items:flex-end;
  gap:5px;
  padding:6px 7px;
}

.composer-plus,
.composer-mic{
  width:39px;
  height:39px;
  min-width:39px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#444;
  display:flex;
  align-items:center;
  justify-content:center;
}

.composer-plus:hover,
.composer-mic:hover{
  background:#f1f1f1;
}

.composer-mic.recording{
  background:#f0f0f0;
  color:#111;
}

.composer-input{
  flex:1;
  min-height:39px;
  max-height:180px;
  resize:none;
  border:0;
  outline:0;
  padding:9px 7px;
  background:transparent;
  font-size:16px;
  line-height:1.45;
}

.composer-input::placeholder{color:#9a9a9a}

.composer-send{
  width:39px;
  height:39px;
  min-width:39px;
  border:0;
  border-radius:50%;
  background:#171717;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.composer-send:disabled{
  opacity:.35;
  cursor:default;
}

/* ATTACH */

.attach-menu{
  position:fixed;
  left:16px;
  bottom:90px;
  width:230px;
  padding:7px;
  background:#fff;
  border:1px solid #e5e5e5;
  border-radius:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.12);
  display:none;
  z-index:100;
}

.attach-menu.show{display:block}

.attach-option{
  width:100%;
  border:0;
  background:transparent;
  border-radius:9px;
  padding:11px;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  font-size:13px;
  color:#333;
}

.attach-option:hover{background:#f3f3f3}

/* DRAWER */

.drawer-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.22);
  opacity:0;
  visibility:hidden;
  transition:.18s;
  z-index:80;
}

.drawer-backdrop.show{
  opacity:1;
  visibility:visible;
}

.drawer{
  position:fixed;
  top:0;
  bottom:0;
  left:0;
  width:min(310px,88vw);
  background:#fff;
  box-shadow:8px 0 30px rgba(0,0,0,.12);
  transform:translateX(-105%);
  transition:.2s;
  z-index:90;
  display:flex;
  flex-direction:column;
}

.drawer.show{transform:translateX(0)}

.drawer-top{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  border-bottom:1px solid #eee;
}

.drawer-brand{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:14px;
  font-weight:600;
}

.drawer-close{
  width:36px;
  height:36px;
  border:0;
  background:transparent;
  border-radius:9px;
}

.drawer-close:hover{background:#f2f2f2}

.new-chat{
  margin:12px;
  height:42px;
  border:1px solid #dedede;
  background:#fff;
  border-radius:10px;
  text-align:left;
  padding:0 13px;
  font-size:13px;
}

.new-chat:hover{background:#f5f5f5}

.history{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:3px 9px 20px;
}

.history-label{
  padding:12px 8px 6px;
  color:#999;
  font-size:11px;
}

.history-item{
  width:100%;
  border:0;
  background:transparent;
  border-radius:9px;
  padding:10px 9px;
  text-align:left;
  color:#333;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover{background:#f2f2f2}

.drawer-bottom{
  border-top:1px solid #eee;
  padding:9px;
}

.drawer-item{
  width:100%;
  border:0;
  background:transparent;
  border-radius:9px;
  padding:10px;
  text-align:left;
  font-size:13px;
  color:#444;
}

.drawer-item:hover{background:#f3f3f3}

.hidden-file{display:none}

.voice-status{
  position:fixed;
  left:50%;
  bottom:105px;
  transform:translateX(-50%);
  padding:10px 15px;
  background:#171717;
  color:#fff;
  border-radius:20px;
  font-size:12px;
  display:none;
  z-index:120;
}

.voice-status.show{display:block}

.icon{
  width:20px;
  height:20px;
  display:block;
}

.icon-small{
  width:18px;
  height:18px;
}

@media(max-width:700px){

  .brand-engine{display:none}

  .messages-inner{
    width:calc(100% - 24px);
    padding-top:25px;
  }

  .welcome{
    min-height:calc(100dvh - 220px);
  }

  .welcome-title{font-size:25px}

  .welcome-subtitle{font-size:14px}

  .message-text{font-size:16px}

  .sandbox-body{height:360px}

  .composer-area{
    padding-left:9px;
    padding-right:9px;
  }

  .composer{border-radius:22px}

  .attach-menu{
    left:9px;
    bottom:88px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

  <button id="menuButton" class="menu-button" aria-label="聊天紀錄">
    <svg class="icon" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round">
      <path d="M4 7h16"/>
      <path d="M4 12h16"/>
      <path d="M4 17h16"/>
    </svg>
  </button>

  <div class="brand">

    <div class="brand-mark">✦</div>

    <div class="brand-title">
      Technical Dark Star
    </div>

    <div class="brand-engine">
      technical-dark-star
    </div>

  </div>

</header>

<main class="main">

<section class="chat">

  <div id="messages" class="messages">

    <div id="messagesInner" class="messages-inner">

      <section id="welcome" class="welcome">

        <div class="welcome-content">

          <div class="welcome-mark">✦</div>

          <h1 class="welcome-title">
            你好，我是 Technical Dark Star
          </h1>

          <p class="welcome-subtitle">
            直接跟我聊天、說話、傳檔案或貼上程式碼。
            <br>
            我會透過 AIVAULT 處理真正的 AI 回應與工程工作。
          </p>

        </div>

      </section>

    </div>

  </div>

  <div class="composer-area">

    <div class="composer">

      <div id="attachmentPreview" class="attachment-preview"></div>

      <div class="composer-row">

        <button id="plusButton" class="composer-plus" aria-label="新增">

          <svg class="icon" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round">
            <path d="M12 5v14"/>
            <path d="M5 12h14"/>
          </svg>

        </button>

        <textarea
          id="composerInput"
          class="composer-input"
          rows="1"
          placeholder="傳訊息給 Technical Dark Star……"></textarea>

        <button id="micButton" class="composer-mic" aria-label="語音輸入">

          <svg class="icon" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round">

            <rect x="9" y="3" width="6" height="12" rx="3"/>
            <path d="M5 11a7 7 0 0 0 14 0"/>
            <path d="M12 18v3"/>
            <path d="M9 21h6"/>

          </svg>

        </button>

        <button id="sendButton" class="composer-send"
          aria-label="送出" disabled>

          <svg class="icon-small" viewBox="0 0 24 24"
            fill="none" stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">

            <path d="M12 19V5"/>
            <path d="M6 11l6-6 6 6"/>

          </svg>

        </button>

      </div>

    </div>

  </div>

</section>

</main>
</div>

<div id="attachMenu" class="attach-menu">

  <button class="attach-option" data-type="image/*">
    <span>圖片</span>
  </button>

  <button class="attach-option" data-type=".doc,.docx">
    <span>Word</span>
  </button>

  <button class="attach-option" data-type=".pdf">
    <span>PDF</span>
  </button>

  <button class="attach-option"
    data-type=".txt,.md,.json,.js,.ts,.html,.css,.jsx,.tsx">
    <span>TXT／程式碼</span>
  </button>

  <button class="attach-option" data-type="video/mp4">
    <span>MP4</span>
  </button>

  <button class="attach-option" data-type="audio/wav,audio/x-wav">
    <span>WAV</span>
  </button>

</div>

<input id="fileInput" class="hidden-file" type="file">

<div id="drawerBackdrop" class="drawer-backdrop"></div>

<aside id="drawer" class="drawer">

  <div class="drawer-top">

    <div class="drawer-brand">

      <div class="brand-mark">✦</div>
      Technical Dark Star

    </div>

    <button id="drawerClose" class="drawer-close">

      <svg class="icon-small" viewBox="0 0 24 24"
        fill="none" stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round">

        <path d="M6 6l12 12"/>
        <path d="M18 6L6 18"/>

      </svg>

    </button>

  </div>

  <button id="newChatButton" class="new-chat">
    ＋ 新聊天
  </button>

  <div id="history" class="history">
    <div class="history-label">對話紀錄</div>
  </div>

  <div class="drawer-bottom">

    <button id="capabilityButton" class="drawer-item">
      🧠 學習能力
    </button>

    <button id="workHistoryButton" class="drawer-item">
      🧪 工作紀錄
    </button>

  </div>

</aside>

<div id="voiceStatus" class="voice-status">
  正在聆聽……
</div>

<script>

/* =========================================================
   AIVAULT 真實連線設定
========================================================= */

const SUPABASE_URL =
  "https://clcddygkaaqqtsbswgdf.supabase.co";

/*
  AIVAULT AI Gateway
  不是 learning-executor。
*/
const AI_GATEWAY_URL =
  SUPABASE_URL +
  "/functions/v1/ai-gateway";

const ENGINE =
  "technical-dark-star";


/* =========================================================
   STATE
========================================================= */

let conversationId =
  localStorage.getItem(
    "technical_dark_star_conversation_id"
  ) || null;

let messagesHistory =
  JSON.parse(
    localStorage.getItem(
      "technical_dark_star_messages"
    ) || "[]"
  );

let attachments = [];
let recognition = null;
let isRecording = false;


/* =========================================================
   ELEMENTS
========================================================= */

const messages =
  document.getElementById("messages");

const messagesInner =
  document.getElementById("messagesInner");

const input =
  document.getElementById("composerInput");

const sendButton =
  document.getElementById("sendButton");

const micButton =
  document.getElementById("micButton");

const plusButton =
  document.getElementById("plusButton");

const attachMenu =
  document.getElementById("attachMenu");

const fileInput =
  document.getElementById("fileInput");

const attachmentPreview =
  document.getElementById("attachmentPreview");

const drawer =
  document.getElementById("drawer");

const drawerBackdrop =
  document.getElementById("drawerBackdrop");

const menuButton =
  document.getElementById("menuButton");

const drawerClose =
  document.getElementById("drawerClose");

const historyElement =
  document.getElementById("history");

const voiceStatus =
  document.getElementById("voiceStatus");


/* =========================================================
   UTIL
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function scrollBottom(){

  requestAnimationFrame(()=>{
    messages.scrollTop =
      messages.scrollHeight;
  });
}


function saveState(){

  localStorage.setItem(
    "technical_dark_star_messages",
    JSON.stringify(messagesHistory)
  );

  if(conversationId){

    localStorage.setItem(
      "technical_dark_star_conversation_id",
      conversationId
    );

  }else{

    localStorage.removeItem(
      "technical_dark_star_conversation_id"
    );
  }
}


/* =========================================================
   INPUT
========================================================= */

function resizeInput(){

  input.style.height = "auto";

  input.style.height =
    Math.min(input.scrollHeight,180) + "px";
}


input.addEventListener("input",()=>{

  resizeInput();

  sendButton.disabled =
    !input.value.trim() &&
    attachments.length === 0;
});


input.addEventListener("keydown",event=>{

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();
  }
});


/* =========================================================
   DRAWER

async function prepareAttachment(file){

  const base = {
    name:file.name,
    type:file.type || "application/octet-stream",
    size:file.size
  };

  const textTypes = [
    "text/plain",
    "text/markdown",
    "application/json",
    "text/javascript",
    "application/javascript",
    "text/css",
    "text/html"
  ];

  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();

  const textExtensions = [
    "txt","md","json","js","ts",
    "jsx","tsx","html","css"
  ];

  if(
    textTypes.includes(file.type) ||
    textExtensions.includes(extension)
  ){

    return {
      ...base,
      content_type:"text",
      content:await file.text()
    };
  }

  if(file.type.startsWith("image/")){

    return {
      ...base,
      content_type:"image",
      content_base64:
        await readAsDataURL(file)
    };
  }

  return {
    ...base,
    content_type:"file"
  };
}


function readAsDataURL(file){

  return new Promise((resolve,reject)=>{

    const reader = new FileReader();

    reader.onload =
      ()=>resolve(reader.result);

    reader.onerror =
      ()=>reject(
        new Error("無法讀取檔案")
      );

    reader.readAsDataURL(file);
  });
}


function renderAttachments(){

  attachmentPreview.innerHTML = "";

  if(!attachments.length){

    attachmentPreview.classList.remove("show");

    return;
  }

  attachmentPreview.classList.add("show");

  attachments.forEach((attachment,index)=>{

    const chip =
      document.createElement("div");

    chip.className = "attachment-chip";

    chip.innerHTML = `

<span>${getFileIcon(attachment.type)}</span>

<span class="attachment-chip-name">
  ${escapeHTML(attachment.name)}
</span>

<button
  class="attachment-remove"
  data-index="${index}">
  ×
</button>
`;

    attachmentPreview.appendChild(chip);
  });

  attachmentPreview
    .querySelectorAll(".attachment-remove")
    .forEach(button=>{

      button.onclick = ()=>{

        const index =
          Number(button.dataset.index);

        attachments.splice(index,1);

        renderAttachments();

        sendButton.disabled =
          !input.value.trim() &&
          attachments.length === 0;
      };
    });
}


function getFileIcon(type){

  if(type?.startsWith("image/")) return "圖片";
  if(type === "application/pdf") return "PDF";
  if(type?.startsWith("video/")) return "MP4";
  if(type?.startsWith("audio/")) return "WAV";

  return "檔案";
}

/* =========================================================

========================================================= */

function renderSandbox(parent,files,result){

  const names =
    Object.keys(files || {});

  if(!names.length) return;

  const preferred = [
    "index.html",
    "index.htm",
    "src/App.jsx",
    "App.jsx",
    "main.js",
    "src/main.js"
  ];

  const selected =
    preferred.find(name=>names.includes(name)) ||
    names[0];

  const code =
    typeof files[selected] === "string"
      ? files[selected]
      : JSON.stringify(files[selected],null,2);

  const sandbox =
    document.createElement("div");

  sandbox.className = "sandbox-card";

  sandbox.innerHTML = `

<div class="sandbox-head">

  <div class="sandbox-title">
    Sandbox
  </div>

  <div class="sandbox-tabs">

    <button
      class="sandbox-tab active"
      data-mode="preview">
      完成品
    </button>

    <button
      class="sandbox-tab"
      data-mode="code">
      程式碼
    </button>

  </div>

</div>

<div class="sandbox-body">

  <div
    class="sandbox-view active"
    data-view="preview">

    <div class="sandbox-empty">

      <div>

        <div class="sandbox-empty-title">
          已收到實際檔案
        </div>

        <div class="sandbox-empty-text">
          尚未提供 Sandbox Preview。
        </div>

      </div>

    </div>

  </div>

  <div
    class="sandbox-view"
    data-view="code">

    <div class="sandbox-code-tools">

      <div class="sandbox-file">
        ${escapeHTML(selected)}
      </div>

      <button class="sandbox-copy">
        複製全部
      </button>

    </div>

    <textarea
      class="sandbox-code"
      readonly></textarea>

  </div>

</div>
`;

  const textarea =
    sandbox.querySelector(".sandbox-code");

  textarea.value = code;

  const previewURL =
    result?.sandbox?.preview_url ||
    result?.sandbox?.previewUrl ||
    result?.sandbox?.url ||
    result?.preview_url ||
    result?.previewUrl ||
    null;

  if(previewURL){

    const preview =
      sandbox.querySelector(
        '[data-view="preview"]'
      );

    preview.innerHTML = "";

    const iframe =
      document.createElement("iframe");

    iframe.className = "sandbox-frame";
    iframe.src = previewURL;

    preview.appendChild(iframe);
  }

  sandbox
    .querySelectorAll(".sandbox-tab")
    .forEach(tab=>{

      tab.onclick = ()=>{

        sandbox
          .querySelectorAll(".sandbox-tab")
          .forEach(item =>
            item.classList.remove("active")
          );

        tab.classList.add("active");

        sandbox
          .querySelectorAll(".sandbox-view")
          .forEach(view =>
            view.classList.remove("active")
          );

        sandbox
          .querySelector(
            `[data-view="${tab.dataset.mode}"]`
          )
          .classList.add("active");
      };
    });

  sandbox
    .querySelector(".sandbox-copy")
    .onclick = async ()=>{

      try{

        await navigator.clipboard.writeText(
          getAllFilesText(files)
        );

        alert("完整程式碼已複製");

      }catch(error){

        textarea.focus();
        textarea.select();
        document.execCommand("copy");

        alert("程式碼已複製");
      }
    };

  parent.appendChild(sandbox);
}


function getAllFilesText(files){

  return Object
    .entries(files)
    .map(([name,content]) =>
      `===== ${name} =====\n\n` +
      (
        typeof content === "string"
          ? content
          : JSON.stringify(content,null,2)
      ) +
      "\n\n"
    )
    .join("");
}


/* =========================================================

========================================================= */

function renderGates(parent,gates){

  const card =
    document.createElement("div");

  card.className = "gate-card";

  const head =
    document.createElement("div");

  head.className = "gate-head";
  head.textContent =
    "Technical Dark Star 工作進度";

  const list =
    document.createElement("div");

  list.className = "gate-list";

  gates.forEach(gate=>{

    const row =
      document.createElement("div");

    const state =
      String(
        gate.status ||
        gate.state ||
        "pending"
      ).toLowerCase();

    if(
      ["completed","passed","success"]
        .includes(state)
    ){

      row.className =
        "gate-row completed";

    }else if(state === "running"){

      row.className =
        "gate-row running";

    }else if(
      ["failed","error"].includes(state)
    ){

      row.className =
        "gate-row failed";

    }else{

      row.className = "gate-row";
    }

    let icon = "○";

    if(
      ["completed","passed","success"]
        .includes(state)
    ){

      icon = "✓";

    }else if(state === "running"){

      icon = "●";

    }else if(
      ["failed","error"].includes(state)
    ){

      icon = "!";
    }

    row.innerHTML = `

<div class="gate-icon">
  ${icon}
</div>

<div>

  <div class="gate-name">
    ${escapeHTML(
      gate.name ||
      gate.stage ||
      "Unknown"
    )}
  </div>

  <div class="gate-status">
    ${escapeHTML(
      gate.message ||
      gate.label ||
      state
    )}
  </div>

</div>
`;

    list.appendChild(row);
  });

  card.appendChild(head);
  card.appendChild(list);

  parent.appendChild(card);
}


/* =========================================================
   AIVAULT AI GATEWAY
========================================================= */

async function callAIVAULT(
  userMessage,
  files
){

  const payload = {

    engine:
      ENGINE,

    message:
      userMessage,

    conversation_id:
      conversationId,

    source:
      "technical-dark-star-web",

    files:
      files || []
  };

  const response =
    await fetch(
      AI_GATEWAY_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(payload)
      }
    );

  const responseText =
    await response.text();

  let data;

  try{

    data =
      responseText
        ? JSON.parse(responseText)
        : {};

  }catch(error){

    throw new Error(
      "AIVAULT AI Gateway 回傳不是 JSON：\n" +
      responseText.slice(0,1200)
    );
  }

  if(!response.ok){

    throw new Error(
      data?.error ||
      data?.message ||
      `HTTP ${response.status}`
    );
  }

  conversationId =
    data.conversation_id ||
    data.conversationId ||
    data.session_id ||
    data.sessionId ||
    conversationId;

  saveState();

  return data;
}


/* =========================================================
   AI RESPONSE
========================================================= */

function getAIReply(data){

  if(!data) return null;

  return (
    data.reply ??
    data.response ??
    data.answer ??
    data.message ??
    data.output ??
    data.result?.reply ??
    data.result?.response ??
    data.result?.answer ??
    data.result?.output ??
    null
  );
}


/* =========================================================
   SEND
========================================================= */

async function sendMessage(){

  const text =
    input.value.trim();

  if(
    !text &&
    !attachments.length
  ){

    return;
  }

  const outgoingFiles =
    attachments.map(file=>({...file}));

  const displayText =
    text ||
    "請分析我上傳的檔案。";

  renderUserMessage(
    text,
    outgoingFiles
  );

  messagesHistory.push({

    role:"user",

    text:text,

    attachments:
      outgoingFiles.map(file=>({

        name:file.name,
        type:file.type,
        size:file.size

      }))
  });

  saveState();

  input.value = "";
  attachments = [];

  renderAttachments();

  resizeInput();

  sendButton.disabled = true;

  const loading =
    createLoadingMessage();

  try{

    /*
      這裡是真正呼叫 AIVAULT AI Gateway。
      沒有本地 AI。
      沒有假答案。
    */

    const result =
      await callAIVAULT(
        text,
        outgoingFiles
      );

    loading.remove();

    const reply =
      getAIReply(result);

    /*
      Gateway 有真正文字才顯示。
      沒有文字就明確顯示資料狀態。
    */

    const displayReply =
      reply ||
      "AIVAULT AI Gateway 已回傳資料，但沒有提供可顯示的文字回應。";

    renderAIMessage(
      displayReply,
      result
    );

    messagesHistory.push({

      role:"assistant",

      text:displayReply,

      result:result
    });

    saveState();

  }catch(error){

    loading.remove();

    const errorText =
      "Technical Dark Star 無法取得 AIVAULT 的真實回應。\n\n" +
      error.message;

    renderAIMessage(errorText);

    messagesHistory.push({

      role:"assistant",

      text:errorText
    });

    saveState();
  }

  renderHistory();
}

/* =========================================================
   VOICE INPUT
========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if(SpeechRecognition){

  recognition =
    new SpeechRecognition();

  recognition.lang = "zh-TW";
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = ()=>{

    isRecording = true;

    micButton.classList.add("recording");

    voiceStatus.classList.add("show");

    voiceStatus.textContent =
      "正在聆聽……";
  };

  recognition.onresult = event=>{

    let transcript = "";

    for(
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ){

      transcript +=
        event.results[i][0].transcript;
    }

    input.value = transcript;

    resizeInput();

    sendButton.disabled =
      !transcript.trim();
  };

  recognition.onerror = event=>{

    console.error(
      "Speech recognition error:",
      event.error
    );

    stopRecording();
  };

  recognition.onend = ()=>{

    stopRecording();
  };

}else{

  micButton.title =
    "此瀏覽器不支援語音辨識";
}


function startRecording(){

  if(!recognition){

    alert(
      "目前瀏覽器不支援語音辨識。"
    );

    return;
  }

  if(isRecording){

    recognition.stop();

    return;
  }

  recognition.start();
}


function stopRecording(){

  isRecording = false;

  micButton.classList.remove("recording");

  voiceStatus.classList.remove("show");
}


micButton.addEventListener(
  "click",
  startRecording
);


/* =========================================================
   AI VOICE
========================================================= */

function speakText(text){

  if(!("speechSynthesis" in window)){

    alert(
      "目前瀏覽器不支援語音播放。"
    );

    return;
  }

  window.speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = "zh-TW";
  utterance.rate = 1;
  utterance.pitch = 1;

  window.speechSynthesis.speak(utterance);
}
