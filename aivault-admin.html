<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0f172a"/>
<title>AIVAULT 後台</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#0f172a;color:#e2e8f0;min-height:100dvh}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #334155}
.logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#f59e0b,#d97706);display:grid;place-items:center;font-weight:800;font-size:12px;color:#000}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:14px;margin-bottom:12px}
.btn{border:none;border-radius:10px;padding:8px 12px;background:#334155;color:#fff;font:inherit;cursor:pointer}
.btn.primary{background:linear-gradient(135deg,#3b82f6,#6366f1)}
.meta{font-size:13px;color:#94a3b8;word-break:break-all}
h1{font-size:18px;margin:0}h2{font-size:15px;margin:0 0 8px}
</style>
</head>
<body>
<header class="top">
  <div class="logo">AD</div>
  <div><h1>AIVAULT 後台</h1><div class="meta">管理員</div></div>
  <div style="margin-left:auto;display:flex;gap:8px">
    <button class="btn" type="button" id="btnHome">Home</button>
  </div>
</header>
<main class="wrap">
  <div class="card">
    <h2>目前登入</h2>
    <div class="meta" id="info">檢查中…</div>
  </div>
  <div class="card">
    <h2>快捷</h2>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <button class="btn primary" type="button" data-go="aivault-home.html">工作平台 Home</button>
      <button class="btn" type="button" data-go="aivault-video-studio.html">短視頻企劃</button>
      <button class="btn" type="button" data-go="aivault-research-warroom.html">研究論文室</button>
      <button class="btn" type="button" data-go="aivault-warroom.html">War Room</button>
    </div>
  </div>
  <div class="card">
    <h2>說明</h2>
    <p class="meta">此為管理員入口頁。完整使用者／用量管理可後續擴充。僅 <b>n_950143@hotmail.com</b> 或 role=admin／owner 可進入。</p>
  </div>
</main>
<script type="module">
const SUPABASE_URL='https://clcddygkaaqqtsbswgdf.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsY2RkeWdrYWFxcXRzYnN3Z2RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzUwNjQsImV4cCI6MjEwMjMxMTA2NH0.kYg6h7n74CtbiIjNjZ2xxJj16SV42INZVzQ9dLNUfKE';
const ADMIN_EMAILS=['n_950143@hotmail.com'];
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:localStorage}});
const { data:{ session } }=await sb.auth.getSession();
const user=session?.user;
const email=(user?.email||'').toLowerCase();
const role=user?.app_metadata?.role||user?.user_metadata?.role||'';
const ok=role==='admin'||role==='owner'||ADMIN_EMAILS.includes(email);
const el=document.getElementById('info');
if(!user){el.textContent='未登入，請先登入 Home。';}
else if(!ok){el.textContent='帳號 '+user.email+' 無管理員權限。';}
else{
  el.innerHTML='Email：'+user.email+'<br>暱稱：'+(user.user_metadata?.nickname||'—')+'<br>角色：'+(role||'admin（白名單）')+'<br>User ID：'+user.id;
}
document.getElementById('btnHome').onclick=()=>location.href='aivault-home.html';
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>location.href=b.dataset.go);
</script>
</body>
</html>
