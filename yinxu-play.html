<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090d"><title>因序小說｜AIVAULT</title>
<link rel="stylesheet" href="yinxu.css?v=20261016-yx1">
</head><body>
<header class="top"><a class="ib" href="yinxu-shelf.html">‹</a><div class="brand" id="bookTitle">因序小說</div><div style="flex:1"></div>
  <button class="btn" id="pauseBtn">⏸ 暫停</button><button class="btn" id="bgmBtn">🎵</button></header>
<main class="wrap">
  <div class="stage" id="stage"></div>
  <div class="dock"><div class="mic" id="mic"><div class="st" id="micSt"></div>
    <div class="row"><input id="typed" placeholder="也可以直接打字回答" enterkeyhint="send"><button class="btn primary" id="sendTyped">送出</button><button class="btn" id="tapMic" style="display:none">🎤 開麥</button></div></div></div>
</main>
<div class="overlay" id="intro">
  <div class="brand" style="font-size:26px">✦ 因序小說</div>
  <p class="muted">說書人與角色會開口說話。問到你時麥克風會自動打開，直接說出你的回答（沒有選項）。<br>幾秒沒回答會再問一次；還是沒回答，主角 AI 會替你回答，故事繼續。<br><b>時間線不可倒退。</b></p>
  <label class="muted">說書人聲音 <select id="narrVoice"></select></label>
  <button class="btn" id="ttsBtn">✨ Gemini 語音（較自然，會用額度）</button>
  <button class="btn primary" id="startBtn" style="min-height:52px;font-size:18px">▶ 點一下開始</button>
</div>
<div class="overlay" id="end" style="display:none">
  <div class="brand" style="font-size:22px">新的時間線誕生了</div><b id="endTitle"></b>
  <p class="muted" id="endStory" style="max-height:45vh;overflow:auto;text-align:left;white-space:pre-wrap"></p>
  <a class="btn primary" href="yinxu-shelf.html">回因序書架（已放在原作下方）</a>
</div>

<script src="yinxu-data.js?v=20261016-yx1"></script>
<script src="yinxu-store.js?v=20261016-yx1"></script>
<script src="yinxu-engine.js?v=20261016-yx1"></script>
</body></html>
