<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT iPhone 17 Qwen3 測試入口</title><style>body{background:#0d1728;color:#f2f6ff;font:16px system-ui,-apple-system,sans-serif;line-height:1.5;max-width:720px;margin:auto;padding:18px}button,a.go{display:inline-block;padding:12px 15px;background:#3577d1;border:0;border-radius:9px;color:white;text-decoration:none;font-size:16px;margin:8px 6px 8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1c2b43;padding:12px;border-radius:9px}small{color:#b6c7e2}</style></head><body><h2>AIVAULT iPhone 17｜Qwen3 570 MB 測試入口</h2><p>版本 iphone17-preflight-20261018-a。先檢查 GPUAdapter、GPU 緩衝區限制與網站快取；此階段不下載模型。</p><button id="test">第一步：檢查裝置（零模型下載）</button><button id="copy">複製診斷</button><pre id="out">尚未檢查</pre><p id="next">請先完成第一步。</p><small>重要：裝置通過 GPUAdapter 檢查，不代表 ONNX Runtime WebGPU 在 iOS Safari 受支援，也不代表 570 MB 模型能成功載入。模型下載須另行確認；請用 Safari 正式分頁，不要用 LINE 內建瀏覽器。</small><script>
const out=document.getElementById('out');let report='';const mb=n=>(n/1048576).toFixed(1)+' MiB';document.getElementById('test').onclick=async()=>{const a=['iphone17-preflight-20261018-a','UA='+navigator.userAgent,'navigator.gpu='+!!navigator.gpu];let adapter=null;try{adapter=await navigator.gpu?.requestAdapter();a.push('GPUAdapter='+(adapter?'YES':'NO'));if(adapter){const lim=adapter.limits;a.push('maxBufferSize='+mb(lim.maxBufferSize));a.push('maxStorageBufferBindingSize='+mb(lim.maxStorageBufferBindingSize));a.push('maxComputeWorkgroupStorageSize='+lim.maxComputeWorkgroupStorageSize);a.push('shader-f16='+adapter.features.has('shader-f16'));}}catch(e){a.push('GPUAdapter ERROR='+e)}try{const est=await navigator.storage?.estimate();a.push('網站儲存使用='+mb(est?.usage||0));a.push('網站儲存估計額度='+mb(est?.quota||0));const names=await caches.keys();a.push('Cache Storage='+names.join(','));for(const n of names){const c=await caches.open(n);for(const req of await c.keys()){if(/Qwen3-0.6B-ONNX/.test(req.url))a.push('QWEN_CACHE '+new URL(req.url).pathname)}}}catch(e){a.push('CACHE ERROR='+e)}a.push('此檢查不下載權重，也不保證 570 MB 模型可執行。');report=a.join('\n');out.textContent=report;const next=document.getElementById('next');if(adapter){next.innerHTML='GPUAdapter 已取得，但 ONNX WebGPU 相容性未確認。若你仍決定進行高風險下載測試，請另開 <a href="aivault-qwen3-0.6b-test.html?v=iphone17" style="color:#9bc8ff">Qwen3 原有獨立測試頁</a>，並在該頁再次確認下載。建議先複製本頁診斷。'}else{next.textContent='沒有取得 GPUAdapter，先不要進行 570 MB WebGPU 模型下載。'}};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(report||out.textContent)}catch(e){out.textContent+='\n複製失敗：'+e}};
</script></body></html>
