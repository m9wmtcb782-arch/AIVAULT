<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCL v0.8 Tokenizer & Embedding Tests</title><style>body{margin:0;background:#0b1220;color:#e5edf8;font:15px system-ui;padding:20px}main{max-width:850px;margin:auto}pre{white-space:pre-wrap;background:#111d2e;border:1px solid #34465c;border-radius:10px;padding:14px}.ok{color:#86efac}.bad{color:#fca5a5}button{background:#2563eb;color:white;border:0;border-radius:8px;padding:12px 16px;font-weight:700}</style></head><body><main><h1>NCL v0.8 Tokenizer／Embedding 驗收</h1><p>CPU reference；字元級 tokenizer，不是 BPE／SentencePiece。按下按鈕才執行。</p><button id="run">執行 12 項測試</button><h2 id="summary">尚未執行</h2><pre id="results">等待測試…</pre></main><script src="ncl-tensor-v04.js"></script><script src="ncl-model-v06.js"></script><script src="ncl-text-v08.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);$('run').onclick=()=>{const r=[],test=(n,f)=>{try{f();r.push('PASS  '+n);}catch(e){r.push('FAIL  '+n+' — '+e.message);}},T=NCLTensor.Tensor,V=NCLTextV08;
test('字元 tokenizer 建立詞彙表',()=>{const t=V.CharTokenizer.fromTexts(['你好','好嗎']);if(t.tokens.length!==4)throw Error('詞彙數錯誤：'+t.tokens.length);});
test('encode／decode 可往返',()=>{const t=V.CharTokenizer.fromTexts(['NCL你好']);if(t.decode(t.encode('NCL你好'))!=='NCL你好')throw Error('往返失敗');});
test('未知字元映射 UNK',()=>{const t=V.CharTokenizer.fromTexts(['甲']);if(t.encode('乙')[0]!==0)throw Error('未知字元未映射 UNK');});
test('Tokenizer 存檔與載入',()=>{const t=V.CharTokenizer.fromTexts(['abc']),u=V.CharTokenizer.load(t.save());if(u.decode(u.encode('abc'))!=='abc')throw Error('載入後結果不同');});
test('Embedding 前向輸出 shape',()=>{const e=new V.Embedding(8,4,{seed:3}),y=e.forward(new T([1,2,3,4],[2,2]));if(y.shape.join(',')!=='2,2,4')throw Error('shape 錯誤');});
test('相同 seed 初始化一致',()=>{const a=new V.Embedding(8,4,{seed:7}),b=new V.Embedding(8,4,{seed:7});if(a.w.some((x,i)=>x!==b.w[i]))throw Error('初始化不一致');});
test('重複 token 梯度正確累加',()=>{const e=new V.Embedding(5,2),ids=new T([2,2],[1,2]);e.forward(ids);e.backward(new T([1,2,3,4],[1,2,2]));if(e.grad[4]!==4||e.grad[5]!==6)throw Error('重複索引未累加');});
test('Embedding 反向梯度 shape 錯誤拒絕',()=>{const e=new V.Embedding(5,2);e.forward(new T([1],[1,1]));let ok=false;try{e.backward(new T([1,2,3],[1,1,3]));}catch(e){ok=true;}if(!ok)throw Error('應拒絕錯誤 shape');});
test('越界 token ID 拒絕',()=>{let ok=false;try{new V.Embedding(4,2).forward(new T([4],[1,1]));}catch(e){ok=true;}if(!ok)throw Error('應拒絕越界 ID');});
test('可變 Embedding 依梯度更新',()=>{const e=new V.Embedding(4,2),before=e.w[2];e.forward(new T([1],[1,1]));e.backward(new T([1,2],[1,1,2]));e.applyGradients(.1);if(e.w[2]===before)throw Error('權重未更新');});
test('固定 Embedding 不更新',()=>{const e=new V.Embedding(4,2,{weightMode:'fixed'}),before=Array.from(e.w);e.forward(new T([1],[1,1]));e.backward(new T([1,2],[1,1,2]));e.applyGradients(.1);if(e.w.some((x,i)=>x!==before[i]))throw Error('固定權重被修改');});
test('Embedding 存檔重載與 checksum 防護',()=>{const e=new V.Embedding(6,3,{seed:9}),r=e.save(),u=V.Embedding.load(r);if(e.w.some((x,i)=>x!==u.w[i]))throw Error('重載權重不同');r.payload.weights[0]+=1;let ok=false;try{V.Embedding.load(r);}catch(err){ok=/checksum/.test(err.message);}if(!ok)throw Error('未偵測存檔損壞');});
const pass=r.filter(x=>x.startsWith('PASS')).length,fail=r.length-pass;$('summary').textContent=pass+'/'+r.length+' 通過，'+fail+' 失敗';$('summary').className=fail?'bad':'ok';$('results').textContent=r.join('\n');};})();
</script></body></html>
