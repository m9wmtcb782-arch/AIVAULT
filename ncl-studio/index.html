<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>AIVAULT NCL Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e5edf8;font:15px system-ui,-apple-system,sans-serif}header{padding:16px;border-bottom:1px solid #29384d;display:flex;align-items:center;justify-content:space-between;gap:12px}a{color:#93c5fd}main{max-width:1050px;margin:auto;padding:16px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{background:#1d4ed8;border:0;border-radius:9px;padding:11px 14px;color:white;font-weight:650;cursor:pointer}button.secondary{background:#26384e}textarea,pre{width:100%;border:1px solid #34465c;background:#111d2e;color:#e2e8f0;border-radius:12px;padding:14px}textarea{font:14px/1.55 ui-monospace,SFMono-Regular,monospace;min-height:320px;resize:vertical}pre{white-space:pre-wrap;overflow:auto;min-height:85px;font-size:13px}h1{font-size:20px;margin:0}h2{font-size:16px;margin:18px 0 8px}.hint{color:#9aabc2;font-size:13px;line-height:1.6}canvas{width:100%;max-width:640px;aspect-ratio:16/9;background:#080d18;border-radius:12px;border:1px solid #34465c}#status{color:#93c5fd}@media(min-width:780px){.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}}</style></head><body><header><div><h1>⚙️ AIVAULT NCL Studio</h1><div class="hint">獨立語言實驗室 · v0.1 · 手機瀏覽器</div></div><a href="../aivault-home.html">← 第一基地</a></header><main><p class="hint">本版為 NCL 自訂語法、編譯為中介表示（IR）與 Canvas 動畫驗證環境。不是五模態 AI 模型，也尚未使用原生 Metal。</p><div class="cols"><section><h2>main.ncl</h2><textarea id="source" spellcheck="false" aria-label="NCL 原始碼">world cinema {
  character "暗星"
  scene "城市"
}
event darkstar.walk {
  duration = 5s
}
compute {
  device = phone.gpu
}
produce video {
  output = "movie.mp4"
}</textarea><div class="bar"><button id="compile">編譯 NCL</button><button id="run" class="secondary">執行動畫測試</button><button id="save" class="secondary">儲存程式</button><button id="download" class="secondary">匯出 .ncl</button></div><p id="status" role="status">等待編譯</p></section><section><h2>中介表示 IR</h2><pre id="ir">按「編譯 NCL」檢查語法</pre><h2>動畫預覽</h2><canvas id="preview" width="640" height="360"></canvas><p class="hint">測試動畫由 Canvas 2D 繪製；不會假裝已生成 AI 影片。程式只儲存在目前瀏覽器，請勿輸入密碼或金鑰。</p></section></div></main><script>
(function(){
'use strict';
const source=document.getElementById('source'),out=document.getElementById('ir'),status=document.getElementById('status'),canvas=document.getElementById('preview'),ctx=canvas.getContext('2d');let frame=0;
try{const saved=localStorage.getItem('aivault-ncl-source-v1');if(saved)source.value=saved;}catch(e){}
function compile(){const text=source.value;const lines=text.split(/\r?\n/);const blocks=[];let current=null;for(let i=0;i<lines.length;i++){let line=lines[i].trim();if(!line||line.startsWith('//'))continue;const start=line.match(/^(world|event|compute|produce)(?:\s+([\w.\u3400-\u9fff]+))?\s*\{$/);if(start){if(current)throw Error('第 '+(i+1)+' 行：不支援巢狀區塊');current={kind:start[1],name:start[2]||null,entries:[]};continue;}if(line==='}'){if(!current)throw Error('第 '+(i+1)+' 行：多餘的 }');blocks.push(current);current=null;continue;}if(!current)throw Error('第 '+(i+1)+' 行：指令必須在區塊內');const match=line.match(/^([\w.\u3400-\u9fff]+)(?:\s*=\s*|\s+)(.+)$/);if(!match)throw Error('第 '+(i+1)+' 行：無法解析指令');current.entries.push({key:match[1],value:match[2].trim()});}if(current)throw Error('缺少結束的 }');if(!blocks.length)throw Error('沒有可編譯的區塊');return {language:'NCL',version:'0.1',blocks};}
function build(){try{const ir=compile();out.textContent=JSON.stringify(ir,null,2);status.textContent='✓ 語法編譯成功（示範 IR）';return ir;}catch(e){status.textContent='✗ '+e.message;out.textContent='編譯失敗';return null;}}
document.getElementById('compile').onclick=build;
document.getElementById('save').onclick=()=>{try{localStorage.setItem('aivault-ncl-source-v1',source.value);status.textContent='✓ 已儲存於本機瀏覽器';}catch(e){status.textContent='儲存失敗：'+e.message;}};
document.getElementById('download').onclick=()=>{const blob=new Blob([source.value],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='main.ncl';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
document.getElementById('run').onclick=()=>{if(!build())return;cancelAnimationFrame(frame);let start=performance.now();function draw(now){let t=(now-start)/1000;ctx.fillStyle='#0c172b';ctx.fillRect(0,0,640,360);ctx.fillStyle='#182e45';for(let i=0;i<9;i++){let h=80+(i*37)%125;ctx.fillRect(i*78,275-h,60,h);}ctx.fillStyle='#334155';ctx.fillRect(0,275,640,85);let x=40+Math.min(t/5,1)*520;ctx.fillStyle='#f8c8a0';ctx.beginPath();ctx.arc(x,204,17,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e0e7ff';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(x,223);ctx.lineTo(x,269);ctx.stroke();ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(x,269);ctx.lineTo(x-12+Math.sin(t*10)*8,290);ctx.moveTo(x,269);ctx.lineTo(x+12-Math.sin(t*10)*8,290);ctx.stroke();ctx.fillStyle='white';ctx.font='18px system-ui';ctx.fillText('NCL 動畫測試（非 AI 生成）',18,30);if(t<5)frame=requestAnimationFrame(draw);else status.textContent='✓ 動畫測試完成（Canvas 2D）';}frame=requestAnimationFrame(draw);status.textContent='▶ 執行測試中';};
})();
</script></body></html>
