<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCL v1.3 Causal Language Model Tests</title><style>body{margin:0;background:#0b1220;color:#e5edf8;font:15px system-ui;padding:20px}main{max-width:850px;margin:auto}pre{white-space:pre-wrap;background:#111d2e;border:1px solid #34465c;border-radius:10px;padding:14px}.ok{color:#86efac}.bad{color:#fca5a5}button{background:#2563eb;color:white;border:0;border-radius:8px;padding:12px 16px;font-weight:700}</style></head><body><main><h1>NCL v1.3 Causal Language Model 測試</h1><p>Embedding + Positional Encoding + stacked Transformer + next-token loss + train/save/load。</p><button id="run">執行 12 項測試</button><h2 id="summary">尚未執行</h2><pre id="results">等待測試…</pre></main><script src="ncl-tensor-v04.js"></script><script src="ncl-model-v06.js"></script><script src="ncl-text-v08.js"></script><script src="ncl-attention-v09.js"></script><script src="ncl-multihead-v11.js"></script><script src="ncl-transformer-v12.js"></script><script src="ncl-language-model-v13.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);$('run').onclick=()=>{const r=[],test=(n,f)=>{try{f();r.push('PASS  '+n);}catch(e){r.push('FAIL  '+n+' — '+e.message);}},T=NCLTensor.Tensor,C=NCLLanguageModelV13.CausalLanguageModel;
const make=()=>new C({vocabSize:8,dimension:8,heads:2,layers:2,hiddenSize:16,maxSequenceLength:16,seed:41});
test('Forward 輸出 logits shape',()=>{const m=make(),y=m.forward(T.from([1,2,3,4],[1,4]));if(y.shape.join(',')!=='1,4,8')throw Error('logits shape');});
test('多層 Transformer 確實建立',()=>{const m=make();if(m.blocks.length!==2)throw Error('layer count');});
test('Cross-entropy loss 有限且為正',()=>{const m=make(),x=T.from([1,2,3],[1,3]),y=T.from([2,3,4],[1,3]);m.forward(x);const l=m.lossAndBackward(y);if(!(l>0&&Number.isFinite(l)))throw Error('loss 無效');});
test('端到端反向傳播產生 embedding 梯度',()=>{const m=make();m.forward(T.from([1,2,3],[1,3]));m.lossAndBackward(T.from([2,3,4],[1,3]));if(!m.embedding.hasGradients||!m.embedding.grad.some(v=>v!==0))throw Error('embedding gradient missing');});
test('trainStep 會更新輸出層',()=>{const m=make(),before=m.headW[0];m.trainStep(T.from([1,2,3],[1,3]),T.from([2,3,4],[1,3]),.001);if(before===m.headW[0])throw Error('head not updated');});
test('trainStep 會更新 embedding',()=>{const m=make(),before=m.embedding.w[8];m.trainStep(T.from([1,2,3],[1,3]),T.from([2,3,4],[1,3]),.001);if(before===m.embedding.w[8])throw Error('embedding not updated');});
test('trainStep 會更新 Transformer block',()=>{const m=make(),before=m.blocks[0].mlp.w1[0];m.trainStep(T.from([1,2,3],[1,3]),T.from([2,3,4],[1,3]),.001);if(before===m.blocks[0].mlp.w1[0])throw Error('block not updated');});
test('predictNext 回傳合法 token ID',()=>{const m=make(),p=m.predictNext(T.from([1,2,3],[1,3]));if(p.length!==1||p[0]<0||p[0]>=8)throw Error('prediction invalid');});
test('模型 save/load 保持預測一致',()=>{const m=make(),x=T.from([1,2,3],[1,3]),a=m.predictNext(x),copy=C.load(m.save()),b=copy.predictNext(x);if(a.join(',')!==b.join(','))throw Error('roundtrip prediction mismatch');});
test('固定權重模式不更新',()=>{const m=new C({vocabSize:8,dimension:8,heads:2,layers:1,hiddenSize:16,maxSequenceLength:16,seed:41,weightMode:'fixed'}),before=m.headW[0],emb=m.embedding.w[8],mlp=m.blocks[0].mlp.w1[0];m.trainStep(T.from([1,2,3],[1,3]),T.from([2,3,4],[1,3]),.001);if(before!==m.headW[0]||emb!==m.embedding.w[8]||mlp!==m.blocks[0].mlp.w1[0])throw Error('fixed weights changed');});
test('輸出層權重梯度中心差分驗證',()=>{const m=make(),x=T.from([1,2],[1,2]),y=T.from([2,3],[1,2]);m.forward(x);m.lossAndBackward(y);const analytic=m.gradW[0],old=m.headW[0],eps=1e-6;const calc=()=>{m.forward(x);let loss=0;const v=8;for(let row=0;row<2;row++){let max=-Infinity;for(let j=0;j<v;j++)max=Math.max(max,m.logitAt(row,j));let sum=0;for(let j=0;j<v;j++)sum+=Math.exp(m.logitAt(row,j)-max);loss+=Math.log(sum)+max-m.logitAt(row,y.data[row]);}return loss/2;};m.headW[0]=old+eps;const p=calc();m.headW[0]=old-eps;const n=calc();m.headW[0]=old;if(Math.abs((p-n)/(2*eps)-analytic)>1e-6)throw Error('output projection gradient mismatch');});
test('固定小型樣本重複訓練可降低 loss',()=>{const m=new C({vocabSize:8,dimension:8,heads:2,layers:1,hiddenSize:16,maxSequenceLength:8,seed:41}),x=T.from([1,2,3],[1,3]),y=T.from([2,3,4],[1,3]);m.forward(x);const before=m.lossAndBackward(y);for(let i=0;i<40;i++)m.trainStep(x,y,.01);m.forward(x);const after=m.lossAndBackward(y);if(!(after<before))throw Error('loss 未下降：'+before+' -> '+after);});
const pass=r.filter(x=>x.startsWith('PASS')).length,fail=r.length-pass;$('summary').textContent=pass+'/'+r.length+' 通過，'+fail+' 失敗';$('summary').className=fail?'bad':'ok';$('results').textContent=r.join('\n');};})();
</script></body></html>
