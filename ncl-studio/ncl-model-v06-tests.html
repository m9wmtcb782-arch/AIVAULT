<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCL v0.6 Model Tests</title><style>body{margin:0;background:#0b1220;color:#e5edf8;font:15px system-ui;padding:20px}main{max-width:850px;margin:auto}pre{white-space:pre-wrap;background:#111d2e;border:1px solid #34465c;border-radius:10px;padding:14px}.ok{color:#86efac}.bad{color:#fca5a5}button{background:#2563eb;color:white;border:0;border-radius:8px;padding:12px 16px;font-weight:700}</style></head><body><main><h1>NCL v0.6 多層模型與存檔驗收</h1><p>按下執行才會產生本機實際測試結果。</p><button id="run">執行 10 項測試</button><h2 id="summary">尚未執行</h2><pre id="results">等待測試…</pre></main><script src="ncl-tensor-v04.js"></script><script src="ncl-neural-v05.js"></script><script src="ncl-model-v06.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);$('run').onclick=()=>{const out=[];function test(n,f){try{f();out.push('PASS  '+n);}catch(e){out.push('FAIL  '+n+' — '+e.message);}}const T=NCLTensor.Tensor,M=NCLModel;const model=()=>new M.Sequential([new NCLNeural.Dense(2,3,{seed:1}),new NCLNeural.Dense(3,1,{seed:2})]);const x=new T([1,2,2,1],[2,2]);
test('建立兩層 Dense 模型',()=>{if(model().layers.length!==2)throw Error('層數錯誤');});
test('多層 forward shape 正確',()=>{if(model().forward(x).shape.join(',')!=='2,1')throw Error('輸出 shape 錯誤');});
test('多層 backward 回傳輸入梯度',()=>{const m=model();m.forward(x);const g=m.backward(new T([1,1],[2,1]));if(g.shape.join(',')!=='2,2')throw Error('梯度 shape 錯誤');});
test('梯度數值檢查通過',()=>{const d=new NCLNeural.Dense(2,2,{seed:8}),r=M.gradientCheck(d,new T([.3,-.7],[1,2]),new T([.2,-.4],[1,2]));if(!r.passed)throw Error('最大誤差 '+r.maxAbsoluteError);});
test('模型可序列化並載入',()=>{const m=model(),copy=M.Sequential.load(m.save());const a=m.forward(x),b=copy.forward(x);for(let i=0;i<a.data.length;i++)if(Math.abs(a.data[i]-b.data[i])>1e-12)throw Error('載入後輸出不一致');});
test('存檔 checksum 可檢查竄改',()=>{const r=model().save();r.payload.layers[0].bias[0]+=1;let ok=false;try{M.Sequential.load(r);}catch(e){ok=/checksum/.test(e.message);}if(!ok)throw Error('未偵測竄改');});
test('模型存檔保留各層權重模式',()=>{const m=model().setWeightMode('fixed'),r=M.Sequential.load(m.save());if(r.layers.some(l=>l.mode!=='fixed'))throw Error('權重模式未保留');});
test('不相容層維度拒絕建立',()=>{let ok=false;try{new M.Sequential([new NCLNeural.Dense(2,3),new NCLNeural.Dense(4,1)]);}catch(e){ok=true;}if(!ok)throw Error('應拒絕');});
test('錯誤權重長度拒絕載入',()=>{const r=model().save();r.payload.layers[0].weights.pop();r.checksum=M.checksum(JSON.stringify(r.payload));let ok=false;try{M.Sequential.load(r);}catch(e){ok=/尺寸/.test(e.message);}if(!ok)throw Error('應拒絕錯誤尺寸');});
test('模型訓練更新後可保存並重載',()=>{const m=new M.Sequential([new NCLNeural.Dense(1,1,{seed:12})]),xx=new T([0,1,2],[3,1]),yy=new T([1,3,5],[3,1]);for(let i=0;i<100;i++){const p=m.forward(xx),g=NCLNeural.mseGradient(p,yy);m.backward(g);m.applyGradients(.05);}const restored=M.Sequential.load(m.save());const a=m.forward(xx),b=restored.forward(xx);for(let i=0;i<a.data.length;i++)if(Math.abs(a.data[i]-b.data[i])>1e-12)throw Error('重載結果不同');});
const pass=out.filter(x=>x.startsWith('PASS')).length,fail=out.length-pass;$('summary').textContent=pass+'/'+out.length+' 通過，'+fail+' 失敗';$('summary').className=fail?'bad':'ok';$('results').textContent=out.join('\n');};})();
</script></body></html>
