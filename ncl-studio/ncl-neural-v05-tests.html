<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCL v0.5 Neural Core Tests</title><style>body{margin:0;background:#0b1220;color:#e5edf8;font:15px system-ui;padding:20px}main{max-width:850px;margin:auto}pre{white-space:pre-wrap;background:#111d2e;border:1px solid #34465c;border-radius:10px;padding:14px}.ok{color:#86efac}.bad{color:#fca5a5}button{background:#2563eb;color:white;border:0;border-radius:8px;padding:12px 16px;font-weight:700}</style></head><body><main><h1>NCL v0.5 神經網路核心驗收</h1><p>CPU reference 測試頁。按下執行後才會產生實際測試結果。</p><button id="run">執行 12 項測試</button><h2 id="summary">尚未執行</h2><pre id="results">等待測試…</pre></main><script src="ncl-tensor-v04.js"></script><script src="ncl-neural-v05.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);function run(){const results=[];function test(name,fn){try{fn();results.push('PASS  '+name);}catch(e){results.push('FAIL  '+name+' — '+e.message);}}
const T=window.NCLTensor.Tensor,N=window.NCLNeural;const eq=(a,b,t=1e-8)=>{if(Math.abs(a-b)>t)throw Error('預期 '+b+'，實際 '+a);};const same=(a,b)=>{if(a.length!==b.length||a.some((v,i)=>Math.abs(v-b[i])>1e-8))throw Error('陣列不相等');};
test('Dense 可建立且輸出 shape 正確',()=>{const d=new N.Dense(2,3,{seed:7});const y=d.forward(new T([1,2,3,4],[2,2]));same(y.shape,[2,3]);});
test('相同 seed 產生相同初始權重',()=>{const a=new N.Dense(2,2,{seed:9}).weights(),b=new N.Dense(2,2,{seed:9}).weights();same(Array.from(a.weight.data),Array.from(b.weight.data));});
test('不同 seed 可產生不同權重',()=>{const a=new N.Dense(2,2,{seed:9}).weights(),b=new N.Dense(2,2,{seed:10}).weights();if(Array.from(a.weight.data).every((v,i)=>v===b.weight.data[i]))throw Error('權重完全相同');});
test('forward 使用權重與 bias 計算',()=>{const d=new N.Dense(1,1,{seed:1});const w=d.weights();if(!Number.isFinite(w.weight.data[0]+w.bias.data[0]))throw Error('非有限權重');const y=d.forward(new T([2],[1,1]));if(!Number.isFinite(y.data[0]))throw Error('輸出非有限');});
test('backward 回傳輸入梯度 shape',()=>{const d=new N.Dense(2,1,{seed:2});d.forward(new T([1,2,3,4],[2,2]));const dx=d.backward(new T([1,1],[2,1]));same(dx.shape,[2,2]);});
test('backward 未先 forward 時拒絕執行',()=>{let ok=false;try{new N.Dense(1,1).backward(new T([1],[1,1]));}catch(e){ok=true;}if(!ok)throw Error('應拒絕');});
test('輸入維度錯誤時拒絕 forward',()=>{let ok=false;try{new N.Dense(2,1).forward(new T([1],[1,1]));}catch(e){ok=true;}if(!ok)throw Error('應拒絕');});
test('固定模式不改變權重',()=>{const d=new N.Dense(1,1,{seed:3,weightMode:'fixed'}),before=Array.from(d.weights().weight.data);d.forward(new T([1,2],[2,1]));d.backward(new T([1,1],[2,1]));d.applyGradients(.1);same(Array.from(d.weights().weight.data),before);});
test('可變模式更新權重',()=>{const d=new N.Dense(1,1,{seed:3}),before=Array.from(d.weights().weight.data);d.forward(new T([1,2],[2,1]));d.backward(new T([1,1],[2,1]));d.applyGradients(.1);if(before[0]===d.weights().weight.data[0])throw Error('權重未變');});
test('半變動模式第一步改變一半參數',()=>{const d=new N.Dense(2,2,{seed:4,weightMode:'half-restore'}),before=Array.from(d.weights().weight.data);d.forward(new T([1,1],[1,2]));d.backward(new T([1,1],[1,2]));const r=d.applyGradients(.1);if(r.phase!=='half-updated'||r.parametersChanged!==3)throw Error('半數更新狀態錯誤');if(before.every((v,i)=>v===d.weights().weight.data[i]))throw Error('沒有參數變動');});
test('半變動第二步精確還原第一半參數',()=>{const d=new N.Dense(2,2,{seed:4,weightMode:'half-restore'});const before=Array.from(d.weights().weight.data);d.forward(new T([1,1],[1,2]));d.backward(new T([1,1],[1,2]));d.applyGradients(.1);d.forward(new T([1,1],[1,2]));d.backward(new T([1,1],[1,2]));const r=d.applyGradients(.1);if(r.phase!=='restored')throw Error('未進入還原階段');same(Array.from(d.weights().weight.data),before);});
test('小型線性資料訓練後 MSE 下降',()=>{const d=new N.Dense(1,1,{seed:11}),x=new T([-1,0,1,2],[4,1]),target=new T([-1,1,3,5],[4,1]);let loss=N.mseGradient(d.forward(x),target);let initial=window.NCLTensor.ops.mse(d.forward(x),target);for(let i=0;i<500;i++){const pred=d.forward(x),grad=N.mseGradient(pred,target);d.backward(grad);d.applyGradients(.05);}const final=window.NCLTensor.ops.mse(d.forward(x),target);if(!(final<initial*.05))throw Error('loss 未充分下降：'+initial+' → '+final);});
const pass=results.filter(x=>x.startsWith('PASS')).length,fail=results.length-pass;$('summary').textContent=pass+'/'+results.length+' 通過，'+fail+' 失敗';$('summary').className=fail?'bad':'ok';$('results').textContent=results.join('\n');}
$('run').onclick=run;})();
</script></body></html>
