<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCL v1.0 Integration Tests</title><style>body{margin:0;background:#0b1220;color:#e5edf8;font:15px system-ui;padding:20px}main{max-width:850px;margin:auto}pre{white-space:pre-wrap;background:#111d2e;border:1px solid #34465c;border-radius:10px;padding:14px}.ok{color:#86efac}.bad{color:#fca5a5}button{background:#2563eb;color:white;border:0;border-radius:8px;padding:12px 16px;font-weight:700}</style></head><body><main><h1>NCL v1.0 Transformer Core 整合測試</h1><p>驗收 Token ID → Embedding → Position → Causal Attention；目前僅 Embedding 可訓練。</p><button id="run">執行 10 項測試</button><h2 id="summary">尚未執行</h2><pre id="results">等待測試…</pre></main><script src="ncl-tensor-v04.js"></script><script src="ncl-neural-v05.js"></script><script src="ncl-model-v06.js"></script><script src="ncl-text-v08.js"></script><script src="ncl-attention-v09.js"></script><script src="ncl-transformer-v10.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);$('run').onclick=()=>{const r=[],test=(n,f)=>{try{f();r.push('PASS  '+n);}catch(e){r.push('FAIL  '+n+' — '+e.message);}},T=NCLTensor.Tensor,C=NCLTransformerV10.TransformerCore;
test('Core 載入與版本',()=>{if(NCLTransformerV10.version!=='1.0.0-alpha.1')throw Error('版本錯誤');});
test('Token ID 輸入輸出 shape',()=>{const m=new C(8,4),y=m.forward(new T([1,2,3,4],[1,4]));if(y.shape.join(',')!=='1,4,4')throw Error('shape 錯誤');});
test('Batch 維度支援',()=>{const m=new C(8,4),y=m.forward(new T([1,2,3,4,5,6],[2,3]));if(y.shape.join(',')!=='2,3,4')throw Error('batch shape 錯誤');});
test('因果遮罩保持前位不受未來 token 影響',()=>{const m=new C(10,4),a=m.forward(new T([1,2,3],[1,3])),first=Array.from(a.data.slice(0,4));const n=new C(10,4),b=n.forward(new T([1,2,9],[1,3]));if(first.some((v,i)=>Math.abs(v-b.data[i])>1e-12))throw Error('未來 token 影響前位');});
test('Embedding 梯度可由整合核心回傳',()=>{const m=new C(8,4),y=m.forward(new T([1,2],[1,2]));const r=m.backward(T.ones(y.shape));if(!r.embeddingGradientReady)throw Error('未建立 embedding 梯度');});
test('Embedding 權重可更新',()=>{const m=new C(8,4),ids=new T([1,2],[1,2]),y=m.forward(ids),before=m.embedding.w[4];m.backward(T.ones(y.shape));const r=m.applyGradients(.01);if(!r.updated||m.embedding.w[4]===before)throw Error('權重未更新');});
test('固定權重模式不更新',()=>{const m=new C(8,4,{weightMode:'fixed'}),y=m.forward(new T([1,2],[1,2])),before=m.embedding.w[4];m.backward(T.ones(y.shape));const r=m.applyGradients(.01);if(r.updated||m.embedding.w[4]!==before)throw Error('fixed 權重被改動');});
test('儲存與載入後推論一致',()=>{const m=new C(8,4),ids=new T([1,2,3],[1,3]),a=m.forward(ids),loaded=C.load(m.save()),b=loaded.forward(ids);if(a.data.some((v,i)=>Math.abs(v-b.data[i])>1e-12))throw Error('輸出不一致');});
test('拒絕錯誤 Token ID',()=>{let ok=false;try{new C(8,4).forward(new T([99],[1,1]));}catch(e){ok=true;}if(!ok)throw Error('未拒絕錯誤 ID');});
test('拒絕被竄改的模型存檔',()=>{const m=new C(8,4),s=m.save();s.payload.dimension=99;let ok=false;try{C.load(s);}catch(e){ok=true;}if(!ok)throw Error('未拒絕竄改');});
const pass=r.filter(x=>x.startsWith('PASS')).length,fail=r.length-pass;$('summary').textContent=pass+'/'+r.length+' 通過，'+fail+' 失敗';$('summary').className=fail?'bad':'ok';$('results').textContent=r.join('\n');};})();
</script></body></html>
