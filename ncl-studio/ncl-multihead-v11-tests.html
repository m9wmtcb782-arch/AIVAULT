<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCL v1.1 Multi-Head Tests</title><style>body{margin:0;background:#0b1220;color:#e5edf8;font:15px system-ui;padding:20px}main{max-width:850px;margin:auto}pre{white-space:pre-wrap;background:#111d2e;border:1px solid #34465c;border-radius:10px;padding:14px}.ok{color:#86efac}.bad{color:#fca5a5}button{background:#2563eb;color:white;border:0;border-radius:8px;padding:12px 16px;font-weight:700}</style></head><body><main><h1>NCL v1.1 Multi-Head Attention 測試</h1><p>可訓練 Q/K/V/O 投影與單向因果多頭注意力。</p><button id="run">執行 10 項測試</button><h2 id="summary">尚未執行</h2><pre id="results">等待測試…</pre></main><script src="ncl-tensor-v04.js"></script><script src="ncl-model-v06.js"></script><script src="ncl-multihead-v11.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);$('run').onclick=()=>{const r=[],test=(n,f)=>{try{f();r.push('PASS  '+n);}catch(e){r.push('FAIL  '+n+' — '+e.message);}},T=NCLTensor.Tensor,A=NCLMultiHeadV11.MultiHeadAttention;
test('Multi-head forward shape',()=>{const a=new A(8,2),y=a.forward(T.ones([1,3,8]));if(y.shape.join(',')!=='1,3,8')throw Error('shape 錯誤');});
test('Batch 與四個 heads',()=>{const a=new A(8,4),y=a.forward(T.ones([2,3,8]));if(y.shape.join(',')!=='2,3,8')throw Error('batch/head 錯誤');});
test('Causal mask prevents future leakage',()=>{const a=new A(4,2,{seed:4}),b=new A(4,2,{seed:4}),x=T.from([1,0,0,1,1,1,2,2],[1,2,4]),z=T.from([1,0,0,1,90,90,80,80],[1,2,4]),u=a.forward(x),v=b.forward(z);for(let i=0;i<4;i++)if(Math.abs(u.data[i]-v.data[i])>1e-12)throw Error('未來 token 洩漏');});
test('Backward input gradient shape and finite',()=>{const a=new A(4,2),x=T.ones([1,3,4]);a.forward(x);const g=a.backward(T.ones(x.shape));if(g.shape.join(',')!=='1,3,4'||g.data.some(v=>!Number.isFinite(v)))throw Error('dx 無效');});
test('Q/K/V/O projection gradients finite',()=>{const a=new A(4,2),x=T.from([.1,.2,.3,.4,.4,.3,.2,.1],[1,2,4]),y=a.forward(x);a.backward(T.ones(y.shape));for(const k of Object.keys(a.grads))if(a.grads[k].some(v=>!Number.isFinite(v)))throw Error(k+' gradient 無效');});
test('Trainable projections update',()=>{const a=new A(4,2),x=T.from([.1,.2,.4,.8,.7,.3,.9,.2],[1,2,4]),g=T.from([.2,.5,.1,.8,.7,.3,.6,.4],[1,2,4]);const before=Array.from(a.params.wq);a.forward(x);a.backward(g);const r=a.applyGradients(.01);if(!r.updated||a.params.wq.every((v,i)=>v===before[i]))throw Error('Q projection 未更新');});
test('Fixed mode blocks updates',()=>{const a=new A(4,2,{weightMode:'fixed'}),x=T.ones([1,2,4]),before=a.params.wq[0];a.forward(x);a.backward(T.ones(x.shape));const r=a.applyGradients(.01);if(r.updated||a.params.wq[0]!==before)throw Error('fixed 權重被更新');});
test('Save/load preserves inference',()=>{const a=new A(4,2),x=T.from([1,2,3,4,4,3,2,1],[1,2,4]),y=a.forward(x),b=A.load(a.save()),z=b.forward(x);if(y.data.some((v,i)=>Math.abs(v-z.data[i])>1e-12))throw Error('載入後輸出不一致');});
test('Reject invalid head dimensions and checksum tampering',()=>{let a=false;try{new A(5,2);}catch(e){a=true;}if(!a)throw Error('未拒絕錯誤 head');const m=new A(4,2).save();m.payload.dimension=8;let b=false;try{A.load(m);}catch(e){b=true;}if(!b)throw Error('未拒絕竄改');});
test('Q/K/V/O 與輸入梯度通過中心差分',()=>{const x=T.from([.1,.2,.4,.8,.7,.3,.9,.2],[1,2,4]),up=T.from([.2,.5,.1,.8,.7,.3,.6,.4],[1,2,4]),a=new A(4,2,{seed:12}),y=a.forward(x),dx=a.backward(up),record=a.save(),loss=(input,rec=record)=>{const m=A.load(rec),z=m.forward(input);return z.data.reduce((s,v,i)=>s+v*up.data[i],0);},eps=1e-6;for(const key of ['wq','wk','wv','wo']){const i=2,rec=JSON.parse(JSON.stringify(record)),old=rec.payload.params[key][i];rec.payload.params[key][i]=old+eps;rec.checksum=NCLModel.checksum(JSON.stringify(rec.payload));const plus=loss(x,rec);rec.payload.params[key][i]=old-eps;rec.checksum=NCLModel.checksum(JSON.stringify(rec.payload));const minus=loss(x,rec),numeric=(plus-minus)/(2*eps);if(Math.abs(numeric-a.grads[key][i])>1e-6)throw Error(key+' 梯度差分失敗');}for(let i=0;i<x.data.length;i++){const v=Array.from(x.data);v[i]+=eps;const plus=loss(T.from(v,x.shape));v[i]-=2*eps;const minus=loss(T.from(v,x.shape)),numeric=(plus-minus)/(2*eps);if(Math.abs(numeric-dx.data[i])>1e-6)throw Error('input 梯度索引 '+i+' 差分失敗');}});
const pass=r.filter(x=>x.startsWith('PASS')).length,fail=r.length-pass;$('summary').textContent=pass+'/'+r.length+' 通過，'+fail+' 失敗';$('summary').className=fail?'bad':'ok';$('results').textContent=r.join('\n');};})();
</script></body></html>
