<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCL v0.9 Attention Tests</title><style>body{margin:0;background:#0b1220;color:#e5edf8;font:15px system-ui;padding:20px}main{max-width:850px;margin:auto}pre{white-space:pre-wrap;background:#111d2e;border:1px solid #34465c;border-radius:10px;padding:14px}.ok{color:#86efac}.bad{color:#fca5a5}button{background:#2563eb;color:white;border:0;border-radius:8px;padding:12px 16px;font-weight:700}</style></head><body><main><h1>NCL v0.9 Positional Encoding／Causal Attention 驗收</h1><p>單頭 scaled dot-product causal attention；CPU reference，非完整 Transformer。</p><button id="run">執行 10 項測試</button><h2 id="summary">尚未執行</h2><pre id="results">等待測試…</pre></main><script src="ncl-tensor-v04.js"></script><script src="ncl-attention-v09.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);$('run').onclick=()=>{const r=[],test=(n,f)=>{try{f();r.push('PASS  '+n);}catch(e){r.push('FAIL  '+n+' — '+e.message);}},T=NCLTensor.Tensor,A=NCLAttentionV09;
test('Sinusoidal positional encoding shape',()=>{const x=T.zeros([2,3,4]),y=new A.PositionalEncoding(4).forward(x);if(y.shape.join(',')!=='2,3,4')throw Error('shape 錯誤');});
test('Positional encoding 可區分位置',()=>{const y=new A.PositionalEncoding(4).forward(T.zeros([1,3,4]));if(y.data[0]===y.data[4])throw Error('位置編碼相同');});
test('Positional encoding backward 為 identity',()=>{const p=new A.PositionalEncoding(2),g=new T([1,2,3,4],[1,2,2]),b=p.backward(g);if(b.data.some((v,i)=>v!==g.data[i]))throw Error('梯度未原樣傳回');});
test('Causal attention 輸出 shape',()=>{const x=new T([1,0,0,1,1,1],[1,3,2]),a=new A.CausalSelfAttention(2),y=a.forward(x,x,x);if(y.shape.join(',')!=='1,3,2')throw Error('shape 錯誤');});
test('第一位置不受未來 token 影響',()=>{const a=new A.CausalSelfAttention(2),q=new T([1,0,0,1],[1,2,2]),k1=new T([1,0,0,1],[1,2,2]),k2=new T([1,0,99,99],[1,2,2]),v1=new T([2,3,4,5],[1,2,2]),v2=new T([2,3,900,900],[1,2,2]);const y1=a.forward(q,k1,v1),first=y1.data[0];const y2=a.forward(q,k2,v2);if(Math.abs(first-y2.data[0])>1e-12)throw Error('未來資訊洩漏');});
test('第一位置只注意自身 value',()=>{const q=new T([1,0,1,0],[1,2,2]),k=new T([1,0,0,1],[1,2,2]),v=new T([7,8,9,10],[1,2,2]),y=new A.CausalSelfAttention(2).forward(q,k,v);if(y.data[0]!==7||y.data[1]!==8)throw Error('causal mask 錯誤');});
test('Attention backward 回傳 Q/K/V 梯度',()=>{const x=new T([.2,.4,.5,.1],[1,2,2]),a=new A.CausalSelfAttention(2);a.forward(x,x,x);const g=a.backward(new T([1,1,1,1],[1,2,2]));if(g.query.shape.join(',')!=='1,2,2'||g.key.shape.join(',')!=='1,2,2'||g.value.shape.join(',')!=='1,2,2')throw Error('梯度 shape 錯誤');});
test('Attention 梯度皆為有限數',()=>{const x=new T([.2,.4,.5,.1],[1,2,2]),a=new A.CausalSelfAttention(2);a.forward(x,x,x);const g=a.backward(new T([1,2,3,4],[1,2,2]));for(const t of Object.values(g))if(t.data.some(v=>!Number.isFinite(v)))throw Error('非有限梯度');});
test('Attention 未 forward 不可 backward',()=>{let ok=false;try{new A.CausalSelfAttention(2).backward(T.ones([1,1,2]));}catch(e){ok=true;}if(!ok)throw Error('應拒絕');});
test('拒絕不相容 Q/K/V shape',()=>{let ok=false;try{const a=new A.CausalSelfAttention(2),q=T.zeros([1,2,2]);a.forward(q,T.zeros([1,3,2]),q);}catch(e){ok=true;}if(!ok)throw Error('應拒絕');});
const pass=r.filter(x=>x.startsWith('PASS')).length,fail=r.length-pass;$('summary').textContent=pass+'/'+r.length+' 通過，'+fail+' 失敗';$('summary').className=fail?'bad':'ok';$('results').textContent=r.join('\n');};})();
</script></body></html>
