<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCL v0.7 Tests</title><style>body{margin:0;background:#0b1220;color:#e5edf8;font:15px system-ui;padding:20px}main{max-width:850px;margin:auto}pre{white-space:pre-wrap;background:#111d2e;border:1px solid #34465c;border-radius:10px;padding:14px}.ok{color:#86efac}.bad{color:#fca5a5}button{background:#2563eb;color:white;border:0;border-radius:8px;padding:12px 16px;font-weight:700}</style></head><body><main><h1>NCL v0.7 非線性模型與 Adam 驗收</h1><p>CPU reference 測試；按下按鈕才會執行，結果不代表 GPU 或 iPhone 原生效能。</p><button id="run">執行 13 項測試</button><h2 id="summary">尚未執行</h2><pre id="results">等待測試…</pre></main><script src="ncl-tensor-v04.js"></script><script src="ncl-neural-v05.js"></script><script src="ncl-model-v06.js"></script><script src="ncl-model-v07.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);$('run').onclick=()=>{const r=[];const test=(n,f)=>{try{f();r.push('PASS  '+n);}catch(e){r.push('FAIL  '+n+' — '+e.message);}};const T=NCLTensor.Tensor,V=NCLModelV07;
test('ReLU 前向與負值歸零',()=>{const a=new V.Activation('relu').forward(new T([-2,0,3],[1,3]));if(a.data[0]!==0||a.data[2]!==3)throw Error('ReLU 錯誤');});
test('ReLU 反向梯度',()=>{const a=new V.Activation('relu');a.forward(new T([-1,2],[1,2]));const g=a.backward(new T([4,5],[1,2]));if(g.data[0]!==0||g.data[1]!==5)throw Error('ReLU 梯度錯誤');});
test('Sigmoid 數值穩定且介於 0 與 1',()=>{const y=new V.Activation('sigmoid').forward(new T([-1000,0,1000],[1,3]));if(y.data.some(v=>!Number.isFinite(v)||v<0||v>1))throw Error('Sigmoid 輸出錯誤');});
test('Tanh 前向',()=>{const y=new V.Activation('tanh').forward(new T([0,1],[1,2]));if(y.data[0]!==0||!(y.data[1]>0&&y.data[1]<1))throw Error('Tanh 錯誤');});
test('Activation 不相容梯度 shape 拒絕',()=>{const a=new V.Activation('relu');a.forward(new T([1,2],[1,2]));let ok=false;try{a.backward(new T([1],[1,1]));}catch(e){ok=true;}if(!ok)throw Error('未拒絕錯誤 shape');});
test('Dense + ReLU + Dense 前向',()=>{const m=new V.Sequential([new NCLNeural.Dense(2,4,{seed:1}),new V.Activation('relu'),new NCLNeural.Dense(4,1,{seed:2})]);if(m.forward(new T([1,2],[1,2])).shape.join(',')!=='1,1')throw Error('輸出 shape 錯誤');});
test('非線性模型反向傳播',()=>{const m=new V.Sequential([new NCLNeural.Dense(2,3),new V.Activation('tanh'),new NCLNeural.Dense(3,1)]),x=new T([.2,.8],[1,2]);m.forward(x);if(m.backward(new T([1],[1,1])).shape.join(',')!=='1,2')throw Error('反向 shape 錯誤');});
test('Adam 可更新 Dense 權重',()=>{const d=new NCLNeural.Dense(1,1,{seed:3}),before=d.w[0],x=new T([1,2],[2,1]);d.forward(x);d.backward(new T([1,1],[2,1]));new V.Adam().step(d,.01);if(d.w[0]===before)throw Error('權重未更新');});
test('Adam 多步狀態持續且步數遞增',()=>{const d=new NCLNeural.Dense(1,1),o=new V.Adam();for(let i=0;i<3;i++){d.forward(new T([1],[1,1]));d.backward(new T([1],[1,1]));var z=o.step(d,.01);}if(z.step!==3)throw Error('Adam step 錯誤');});
test('Adam 拒絕 half-restore 模式',()=>{const d=new NCLNeural.Dense(1,1,{weightMode:'half-restore'});d.forward(new T([1],[1,1]));d.backward(new T([1],[1,1]));let ok=false;try{new V.Adam().step(d,.01);}catch(e){ok=/half-restore/.test(e.message);}if(!ok)throw Error('應拒絕不相容模式');});
test('NCL-MODEL/2 可保存與重載 Activation',()=>{const m=new V.Sequential([new NCLNeural.Dense(2,3),new V.Activation('sigmoid'),new NCLNeural.Dense(3,1)]),x=new T([.4,-.2],[1,2]),a=m.forward(x),b=V.Sequential.load(m.save()).forward(x);if(Math.abs(a.data[0]-b.data[0])>1e-12)throw Error('重載輸出不同');});
test('損壞的模型 checksum 會被拒絕',()=>{const r=new V.Sequential([new NCLNeural.Dense(1,1),new V.Activation('relu')]).save();r.payload.layers[0].bias[0]+=1;let ok=false;try{V.Sequential.load(r);}catch(e){ok=/checksum/.test(e.message);}if(!ok)throw Error('未偵測損壞');});
test('Adam 訓練 XOR 小型資料 loss 下降',()=>{const x=new T([0,0,0,1,1,0,1,1],[4,2]),y=new T([0,1,1,0],[4,1]),m=new V.Sequential([new NCLNeural.Dense(2,8,{seed:21}),new V.Activation('tanh'),new NCLNeural.Dense(8,1,{seed:22}),new V.Activation('sigmoid')]),o=new V.Adam();const loss=()=>{const p=m.forward(x);return NCLTensor.ops.mse(p,y);};const initial=loss();for(let i=0;i<2500;i++){const p=m.forward(x),g=NCLNeural.mseGradient(p,y);m.backward(g);m.applyGradients(.03,o);}const final=loss();if(!(final<initial*.65))throw Error('loss 未下降：'+initial+' → '+final);});
const pass=r.filter(s=>s.startsWith('PASS')).length,fail=r.length-pass;$('summary').textContent=pass+'/'+r.length+' 通過，'+fail+' 失敗';$('summary').className=fail?'bad':'ok';$('results').textContent=r.join('\n');};})();
</script></body></html>
