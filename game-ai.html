<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI 王國</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body class="game-body">
  <div class="snow-layer"></div>
  <div class="app" id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/boot.js"></script>
  <script src="js/compute.js"></script>
  <script>
    (async () => {
      if (!(await FKAuth.requirePlayer())) return;
      const snap = await FKApi.snapshot();
      const ais = (await FKApi.searchPlayers("")).filter(p => p.is_ai);
      document.getElementById("app").innerHTML = `
        <div class="page-head"><a class="back" href="game-menu.html">← 返回</a><h2>AI 王國 / 智慧核心</h2></div>
        ${FKUI.top(snap)}
        <div class="panel">
          <label>向顧問提問</label>
          <input id="q" placeholder="例如：我要防守北方城市" />
          <button class="btn" id="ask">分析</button>
          <div class="msg ok" id="ans"></div>
          <h3>已知 AI 王國</h3>
          ${ais.map(p => `<div class="list-item"><span>${p.name} · 戰力 ${FKUI.fmt(p.power)}</span><a class="btn small" href="game-player.html?id=${p.id}">查看</a></div>`).join("")}
        </div>${FKUI.nav("more")}
      `;
      document.getElementById("ask").onclick = () => {
        const threat = ais.slice().sort((a,b)=>b.power-a.power)[0];
        document.getElementById("ans").textContent =
          `建議：保持熔爐高於 3 級、醫院清傷兵。最強威脅是「${threat?.name||"未知"}」（戰力 ${FKUI.fmt(threat?.power||0)}）。你方戰力 ${FKUI.fmt(snap.player.power)}，優先訓練弓手法師並研究軍事。`;
      };
    })();
  </script>
</body>
</html>
