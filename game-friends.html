<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>好友</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body class="game-body">
  <div class="snow-layer"></div>
  <div class="app" id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/boot.js"></script>
  <script>
    async function render() {
      if (!(await FKAuth.requirePlayer())) return;
      const q = (document.getElementById("q") || {}).value || "";
      const list = await FKApi.searchPlayers(q);
      document.getElementById("app").innerHTML = `
        <div class="page-head"><a class="back" href="game-menu.html">← 返回</a><h2>好友 / 搜尋</h2></div>
        <div class="panel">
          <input id="q" placeholder="搜尋玩家名稱" value="${q}" />
          <button class="btn" id="s">搜尋</button>
          ${list.map((p) => `<div class="list-item"><div>${p.name} ${p.is_ai?"·AI":""}</div>
            <a class="btn small" href="game-player.html?id=${p.id}">查看</a></div>`).join("")}
        </div>${FKUI.nav("more")}
      `;
      document.getElementById("s").onclick = render;
    }
    render();
  </script>
</body>
</html>
