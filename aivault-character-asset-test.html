<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT｜真實骨架人物測試</title><style>body{margin:0;background:#17263c;color:#f2f7ff;font:14px system-ui;overflow:hidden}#info{position:fixed;top:12px;left:12px;right:12px;background:#10243fdc;border:1px solid #7ca8d2;border-radius:12px;padding:12px;max-width:380px}#info b{font-size:17px}#status{margin-top:6px;color:#cce5ff}#buttons{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px}button{background:#214d77;color:#fff;border:1px solid #8ec9ed;border-radius:9px;padding:11px;font-size:14px}canvas{display:block}</style></head><body><div id="info"><b>AIVAULT｜3D 人物資產驗證</b><div>真正 GLB 網格＋骨架，非方塊小人</div><div id="status">正在載入外部 CC0 角色模型…</div><div style="font-size:11px;margin-top:6px">這是獨立資產測試，不是冰雪角色成品；不連協作池、不呼叫付費 API。</div></div><div id="buttons"><button id="turn">旋轉：開</button><button id="pause">暫停</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';
const status=document.getElementById('status'),scene=new THREE.Scene();scene.background=new THREE.Color('#b7d3e9');const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);camera.position.set(0,2.2,7);camera.lookAt(0,1.25,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x6b819d,2.4));const light=new THREE.DirectionalLight(0xfff1df,3);light.position.set(-4,9,5);scene.add(light);const ground=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.7,.2,64),new THREE.MeshStandardMaterial({color:0xe7f5fc,roughness:1}));ground.position.y=-.15;scene.add(ground);let root,mixer,clock=new THREE.Clock(),spinning=true,playing=true,rigged=false;const url='https://cdn.jsdelivr.net/gh/programasweights/avatar@main/public/assets/character.glb';new GLTFLoader().load(url,g=>{root=g.scene;const bounds=new THREE.Box3().setFromObject(root),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());root.position.sub(center);root.position.y+=size.y/2;const s=3.0/Math.max(size.y,.1);root.scale.setScalar(s);root.position.multiplyScalar(s);scene.add(root);root.traverse(o=>{if(o.isSkinnedMesh)rigged=true});if(g.animations.length){mixer=new THREE.AnimationMixer(root);mixer.clipAction(g.animations[0]).play()}status.textContent='模型已載入：'+(rigged?'確認含骨架':'未確認骨架')+'；動畫片段 '+g.animations.length+'。'+(g.animations.length?'可播放':'目前僅旋轉展示，尚未接走路動畫');},undefined,e=>{status.textContent='模型載入失敗：外部 CDN 可能無法連線。這不代表 3D 人物已完成。';console.error(e)});let dragging=false,old=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;old=e.clientX});addEventListener('pointerup',()=>dragging=false);addEventListener('pointermove',e=>{if(!dragging||!root)return;root.rotation.y+=(e.clientX-old)*.01;old=e.clientX});document.getElementById('turn').onclick=e=>{spinning=!spinning;e.target.textContent='旋轉：'+(spinning?'開':'關')};document.getElementById('pause').onclick=e=>{playing=!playing;e.target.textContent=playing?'暫停':'播放'};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function tick(){requestAnimationFrame(tick);const dt=clock.getDelta();if(playing){if(spinning&&root&&!dragging)root.rotation.y+=dt*.45;if(mixer)mixer.update(dt)}renderer.render(scene,camera)}tick();
</script></body></html>
