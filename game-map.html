<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>世界地圖</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body class="game-body">
  <div class="snow-layer"></div>
  <div class="app" id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/boot.js"></script>
  <script>
    (async () => {
      if (!(await FKAuth.requirePlayer())) return;
      const snap = await FKApi.snapshot();
      const world = await FKApi.world();
      const size = world.size;
      const key = {};
      world.tiles.forEach((t) => { key[t.x + "," + t.y] = t; });
      let cells = "";
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const t = key[x + "," + y];
          if (!t) { cells += `<div class="cell"></div>`; continue; }
          if (t.type === "me") cells += `<a class="cell me" href="game-city.html" title="我的王城">我</a>`;
          else if (t.type === "res") cells += `<a class="cell res" href="game-resource.html?id=${t.node.id}&kind=${t.node.kind}">${t.node.kind[0]}</a>`;
          else cells += `<a class="cell ${t.type}" href="game-player.html?id=${t.player.id}">${t.type==="ai"?"AI":"P"}</a>`;
        }
      }
      document.getElementById("app").innerHTML = `
        ${FKUI.top(snap)}
        <div class="panel" style="margin-bottom:8px">
          <div class="tiny">綠＝你 · 紫＝玩家 · 褐＝AI 王國 · 青＝資源點。</div>
        </div>
        <div class="map-wrap"><div class="map-grid" style="grid-template-columns:repeat(${size},28px)">${cells}</div></div>
        ${FKUI.nav("map")}
      `;
    })();
  </script>
</body>
</html>
