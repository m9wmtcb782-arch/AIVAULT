<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#02050c"
>

<title>AIVAULT — SYSTEM INITIALIZING</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{

  margin:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#02050c;

  color:#eaf8ff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Noto Sans TC",
    sans-serif;

}

body{

  display:flex;

  align-items:center;

  justify-content:center;

}


/* =========================================================
   背景
   ========================================================= */

.scene{

  position:fixed;

  inset:0;

  overflow:hidden;

  background:

    radial-gradient(
      circle at 50% 45%,
      rgba(26,113,255,.15),
      transparent 28%
    ),

    radial-gradient(
      circle at 50% 50%,
      rgba(0,224,255,.08),
      transparent 48%
    ),

    #02050c;

}


/* Grid */

.grid{

  position:absolute;

  inset:-50%;

  background:

    linear-gradient(
      rgba(74,175,255,.045) 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      rgba(74,175,255,.045) 1px,
      transparent 1px
    );

  background-size:
    45px 45px;

  transform:
    perspective(500px)
    rotateX(62deg)
    translateY(18%);

  animation:
    gridMove 8s linear infinite;

}

@keyframes gridMove{

  from{
    transform:
      perspective(500px)
      rotateX(62deg)
      translateY(18%);
  }

  to{
    transform:
      perspective(500px)
      rotateX(62deg)
      translateY(0%);
  }

}


/* =========================================================
   光束
   ========================================================= */

.beam{

  position:absolute;

  width:2px;

  height:140%;

  top:-20%;

  left:50%;

  background:
    linear-gradient(
      transparent,
      rgba(93,226,255,.65),
      transparent
    );

  filter:
    blur(2px);

  animation:
    beamMove 4s ease-in-out infinite;

}

.beam.b2{

  transform:rotate(35deg);

  opacity:.35;

  animation-delay:.7s;

}

.beam.b3{

  transform:rotate(-35deg);

  opacity:.25;

  animation-delay:1.2s;

}

@keyframes beamMove{

  0%,
  100%{
    opacity:.15;
  }

  50%{
    opacity:.75;
  }

}


/* =========================================================
   中央核心
   ========================================================= */

.core{

  position:absolute;

  left:50%;
  top:50%;

  width:220px;
  height:220px;

  transform:
    translate(-50%,-50%);

  display:flex;

  align-items:center;
  justify-content:center;

}


.ring{

  position:absolute;

  border-radius:50%;

  border:1px solid
    rgba(91,219,255,.3);

  box-shadow:
    0 0 20px
    rgba(30,177,255,.12);

}

.ring.r1{

  width:150px;
  height:150px;

  animation:
    rotate 5s linear infinite;

  border-top-color:
    rgba(113,235,255,.9);

}

.ring.r2{

  width:190px;
  height:190px;

  border-right-color:
    rgba(92,133,255,.75);

  animation:
    rotateReverse 8s linear infinite;

}

.ring.r3{

  width:220px;
  height:220px;

  border-bottom-color:
    rgba(0,226,255,.45);

  animation:
    rotate 12s linear infinite;

}

@keyframes rotate{

  to{
    transform:rotate(360deg);
  }

}

@keyframes rotateReverse{

  to{
    transform:rotate(-360deg);
  }

}


/* Core */

.core-light{

  width:70px;
  height:70px;

  border-radius:50%;

  background:

    radial-gradient(
      circle,
      #ffffff 0%,
      #91edff 12%,
      #388bff 42%,
      rgba(33,86,255,.1) 72%,
      transparent 100%
    );

  box-shadow:

    0 0 25px
      rgba(90,226,255,.9),

    0 0 70px
      rgba(54,111,255,.55),

    0 0 130px
      rgba(0,190,255,.25);

  animation:
    corePulse 2s ease-in-out infinite;

}

@keyframes corePulse{

  0%,
  100%{
    transform:scale(.8);
  }

  50%{
    transform:scale(1.08);
  }

}


/* =========================================================
   Logo
   ========================================================= */

.logo{

  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  text-align:center;

  opacity:0;

  animation:
    logoIn 2s ease
    1.4s forwards;

}

.logo h1{

  margin:0;

  font-size:42px;

  letter-spacing:.18em;

  margin-left:.18em;

  font-weight:800;

  text-shadow:

    0 0 15px
      rgba(112,228,255,.7),

    0 0 50px
      rgba(61,128,255,.5);

}

.logo p{

  margin:10px 0 0;

  color:#7f94ad;

  font-size:10px;

  letter-spacing:.28em;

}

@keyframes logoIn{

  from{

    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.7);

  }

  to{

    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1);

  }

}


/* =========================================================
   系統文字
   ========================================================= */

.system{

  position:absolute;

  left:50%;

  bottom:15%;

  transform:
    translateX(-50%);

  width:min(90%,500px);

  text-align:center;

}

.status{

  font-size:11px;

  letter-spacing:.18em;

  color:#79ddff;

  min-height:18px;

  text-shadow:
    0 0 10px
    rgba(73,210,255,.5);

}

.progress{

  width:100%;

  height:2px;

  margin-top:12px;

  background:
    rgba(255,255,255,.08);

  overflow:hidden;

}

.progress-bar{

  width:0%;

  height:100%;

  background:
    linear-gradient(
      90deg,
      #247cff,
      #7defff
    );

  box-shadow:
    0 0 12px
    rgba(82,218,255,.8);

  transition:
    width .2s linear;

}

.percent{

  margin-top:8px;

  font-size:10px;

  color:#52647d;

}


/* =========================================================
   Skip
   ========================================================= */

.skip{

  position:absolute;

  right:18px;

  bottom:18px;

  padding:8px 12px;

  border:1px solid
    rgba(255,255,255,.1);

  background:
    rgba(255,255,255,.03);

  color:#63758f;

  border-radius:8px;

  font-size:10px;

}


/* =========================================================
   Fade
   ========================================================= */

.fade{

  position:fixed;

  inset:0;

  background:#02050c;

  opacity:0;

  pointer-events:none;

  transition:
    opacity .8s ease;

  z-index:20;

}

.fade.show{

  opacity:1;

}

</style>

</head>

<body>

<div class="scene">

  <div class="grid"></div>

  <div class="beam"></div>
  <div class="beam b2"></div>
  <div class="beam b3"></div>

  <div class="core">

    <div class="ring r3"></div>
    <div class="ring r2"></div>
    <div class="ring r1"></div>

    <div class="core-light"></div>

  </div>

  <div class="logo">

    <h1>AIVAULT</h1>

    <p>
      AI AGENT OPERATING SYSTEM
    </p>

  </div>

  <div class="system">

    <div
      class="status"
      id="status"
    >
      INITIALIZING AIVAULT CORE
    </div>

    <div class="progress">

      <div
        class="progress-bar"
        id="progress"
      ></div>

    </div>

    <div
      class="percent"
      id="percent"
    >
      0%
    </div>

  </div>

</div>

<button
  class="skip"
  id="skip"
>
  跳過動畫
</button>

<div
  class="fade"
  id="fade"
></div>


<script>

/* =========================================================
   Session 檢查
   ========================================================= */

const accessToken =
  sessionStorage.getItem(
    "aivault_access_token"
  )
  ||
  localStorage.getItem(
    "aivault_access_token"
  );


/*
 * 如果沒有真正登入，
 * 不允許直接進入 Home。
 */

if(!accessToken){

  window.location.replace(
    "aivault-login.html"
  );

}


/* =========================================================
   動畫
   ========================================================= */

const status =
  document.getElementById(
    "status"
  );

const progress =
  document.getElementById(
    "progress"
  );

const percent =
  document.getElementById(
    "percent"
  );

const fade =
  document.getElementById(
    "fade"
  );

const skip =
  document.getElementById(
    "skip"
  );


const steps = [

  [
    8,
    "INITIALIZING AIVAULT CORE"
  ],

  [
    22,
    "VERIFYING SECURE SESSION"
  ],

  [
    38,
    "LOADING AI AGENT REGISTRY"
  ],

  [
    55,
    "CONNECTING AI GATEWAY"
  ],

  [
    70,
    "INITIALIZING COLLABORATION ENGINE"
  ],

  [
    84,
    "LOADING OWNER CONTROL"
  ],

  [
    95,
    "SYSTEM INTEGRITY VERIFIED"
  ],

  [
    100,
    "AIVAULT SYSTEM READY"
  ]

];


let current = 0;

let finished = false;


function nextStep(){

  if(finished){
    return;
  }

  if(current >= steps.length){

    finish();

    return;

  }

  const [
    value,
    text
  ] = steps[current];

  progress.style.width =
    `${value}%`;

  percent.textContent =
    `${value}%`;

  status.textContent =
    text;

  current++;

  setTimeout(
    nextStep,
    500
  );

}


function finish(){

  if(finished){
    return;
  }

  finished = true;

  status.textContent =
    "AIVAULT SYSTEM READY";

  progress.style.width =
    "100%";

  percent.textContent =
    "100%";


  /*
   * 留一點時間讓使用者看到
   * READY。
   */

  setTimeout(
    goHome,
    900
  );

}


function goHome(){

  fade.classList.add(
    "show"
  );

  setTimeout(
    () => {

      window.location.replace(
        "aivault-home.html"
      );

    },
    750
  );

}


/* =========================================================
   跳過
   ========================================================= */

skip.onclick = () => {

  if(finished){
    return;
  }

  finish();

};


/* =========================================================
   啟動
   ========================================================= */

setTimeout(
  nextStep,
  700
);


/* =========================================================
   語音
   ========================================================= */

function speak(){

  if(
    !("speechSynthesis" in window)
  ){
    return;
  }


  const text =
    "AIVAULT 核心系統啟動。正在驗證安全連線。AI Agent 協作引擎載入完成。系統準備完成。歡迎進入 AIVAULT。";


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );

  utterance.lang =
    "zh-TW";

  utterance.rate =
    .92;

  utterance.pitch =
    .95;

  utterance.volume =
    .8;


  window.speechSynthesis.cancel();

  window.speechSynthesis.speak(
    utterance
  );

}


/*
 * 行動裝置瀏覽器可能需要使用者
 * 互動才允許語音。
 *
 * 這裡不讓語音阻塞動畫。
 */

document.addEventListener(
  "click",
  () => {

    speak();

  },
  {
    once:true
  }
);


/*
 * 嘗試自動播放。
 */

setTimeout(
  speak,
  900
);

</script>

</body>
</html>
