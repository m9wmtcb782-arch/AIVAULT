<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT Worker-001 輕量任務引擎</title><style>body{font:16px system-ui;background:#0c1726;color:#f0f4ff;max-width:680px;margin:auto;padding:18px}textarea,button{font:inherit;padding:12px;border-radius:8px;margin:8px 0}textarea{width:94%;height:100px}button{background:#286bc1;color:white;border:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1b3048;padding:14px}</style><h2>Worker-001｜170 MB 限制內的輕量任務引擎</h2><p>本頁不下載模型、不呼叫付費 API。執行確定性的算術與文字檢索任務；不宣稱具備大型語言模型推論能力，也不將結果自動寫成已啟用。</p><label>任務類型 <select id="kind"><option value="calc">四則運算</option><option value="search">段落檢索</option></select></label><p>問題／算式</p><textarea id="query">125 * (8 + 4)</textarea><p>待檢索文本（段落檢索時使用）</p><textarea id="source">行政行為應遵守比例原則。\n法律保留原則要求重要事項由法律規定。\n平等原則禁止無正當理由的差別待遇。</textarea><p><button id="run">執行真實任務</button> <button id="copy" disabled>複製執行報告</button></p><pre id="output">尚未執行</pre><script>const $=id=>document.getElementById(id);let report=null;function calc(s){const t=s.replace(/\s+/g,'').match(/\d+(?:\.\d+)?|[()+*\/-]/g);if(!t||t.join('')!==s.replace(/\s+/g,''))throw Error('只接受數字、括號與四則運算');let i=0;function atom(){if(t[i]==='('){i++;const v=expr();if(t[i++]!==')')throw Error('括號不完整');return v}if(t[i]==='-'){i++;return -atom()}const x=Number(t[i++]);if(!Number.isFinite(x))throw Error('數字錯誤');return x}function mul(){let v=atom();while(t[i]==='*'||t[i]==='/'){const op=t[i++],b=atom();if(op==='/'&&b===0)throw Error('不可除以零');v=op==='*'?v*b:v/b}return v}function expr(){let v=mul();while(t[i]==='+'||t[i]==='-'){const op=t[i++],b=mul();v=op==='+'?v+b:v-b}return v}const v=expr();if(i!==t.length||!Number.isFinite(v))throw Error('算式不完整或結果無效');return String(v)}$('run').onclick=()=>{report=null;$('copy').disabled=true;const start=performance.now(),kind=$('kind').value,question=$('query').value.trim();try{if(!question)throw Error('請輸入任務');let answer;if(kind==='calc'){answer=calc(question)}else{const paragraphs=$('source').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);const terms=question.split(/\s+/).filter(Boolean);const hits=paragraphs.map((p,i)=>({p,i,score:terms.reduce((n,t)=>n+(p.includes(t)?1:0),0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);answer=hits.length?hits.slice(0,5).map(x=>'第'+(x.i+1)+'段：'+x.p).join('\n'):'沒有符合關鍵字的段落（不代表不存在答案）'}report={worker:'Worker-001',engine:'deterministic-local-task-engine-v1',task_type:kind,question,answer,elapsed_ms:Math.round(performance.now()-start),status:'CLIENT_EXECUTED_NOT_SERVER_VERIFIED',executed_at:new Date().toISOString()};$('output').textContent=JSON.stringify(report,null,2);$('copy').disabled=false}catch(e){$('output').textContent='TASK_FAILED: '+String(e)}};$('copy').onclick=async()=>{if(!report)return;try{await navigator.clipboard.writeText(JSON.stringify(report,null,2));alert('已複製')}catch(e){$('output').textContent+='\n複製失敗：'+String(e)}};</script></html>
