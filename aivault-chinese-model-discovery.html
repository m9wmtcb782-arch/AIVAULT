<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVAULT 小型中文模型探索</title><style>body{background:#0d1729;color:#eef3ff;font:16px system-ui,-apple-system,sans-serif;line-height:1.5;max-width:750px;margin:auto;padding:16px}button{background:#377cdb;border:0;color:white;border-radius:9px;padding:12px;margin:6px;font-size:16px}pre{background:#192b42;padding:12px;border-radius:9px;white-space:pre-wrap;overflow-wrap:anywhere}small{color:#c1cde0}</style></head><body><h2>AIVAULT 小型中文模型探索</h2><p>版本：zh-discovery-20261018-a。僅查詢 Hugging Face 公開模型清單和檔案 metadata，不下載模型，不執行推論，不使用付費 API。</p><button id="go">搜尋中文候選並檢查 ONNX</button><button id="copy">複製報告</button><pre id="out">等待操作。</pre><small>篩選結果是研究候選，不代表已證明中文品質、授權可用、WASM 相容或記憶體安全。搜尋 API 結果不完整，沒有命中不代表不存在。</small><script>
const o=document.getElementById('out');let report='';const mb=n=>(n/1e6).toFixed(1);
async function json(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
document.getElementById('go').onclick=async()=>{o.textContent='正在讀取公開目錄（不下載模型）……';const lines=['AIVAULT zh-discovery-20261018-a','只讀公開 metadata，不下載權重。'];const ids=new Set();for(const q of ['chinese 0.1B','chinese 0.3B','TinyLlama Chinese','Qwen 0.1B','Chinese small language model']){try{const a=await json('https://huggingface.co/api/models?search='+encodeURIComponent(q)+'&limit=15');lines.push('搜尋 '+q+'：'+a.length+' 筆');for(const x of a)if(x.id)ids.add(x.id)}catch(e){lines.push('搜尋失敗 '+q+': '+e)}}const candidates=[...ids].slice(0,45);lines.push('候選倉庫總數='+ids.size+'；本輪檢查前 '+candidates.length+' 筆');let onnxFound=0,under200=0;for(const id of candidates){try{const a=await json('https://huggingface.co/api/models/'+id.split('/').map(encodeURIComponent).join('/')+'/tree/main?recursive=true');if(!Array.isArray(a))continue;const fs=a.filter(f=>f.type==='file'&&/\.onnx$/i.test(f.path));if(!fs.length)continue;onnxFound++;const small=fs.filter(f=>Number.isFinite(f.size)&&f.size<=200e6);under200+=small.length;lines.push('','MODEL '+id+' ONNX='+fs.length+' 主檔<=200MB='+small.length);for(const f of fs.sort((a,b)=>(a.size??Infinity)-(b.size??Infinity)).slice(0,4))lines.push('  '+(Number.isFinite(f.size)?mb(f.size)+' MB':'大小未知')+' '+f.path);const external=a.filter(f=>f.type==='file'&&/\.onnx_data$|\.onnx\.data$/i.test(f.path));for(const f of external.slice(0,2))lines.push('  外部資料 '+(Number.isFinite(f.size)?mb(f.size)+' MB':'大小未知')+' '+f.path)}catch(e){lines.push('查詢失敗 '+id+' '+e)}}lines.push('','找到含 ONNX 倉庫='+onnxFound,'小於等於200MB的ONNX主檔數='+under200,'注意：這不是完整權重大小；未檢查模型品質、授權、WASM 或 RAM。');report=lines.join('\n');o.textContent=report};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(report||o.textContent)}catch(e){o.textContent+='\n複製失敗 '+e}};
</script></body></html>
